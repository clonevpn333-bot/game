<!DOCTYPE html><html><head><meta charset="utf-8"><title>Knight poses</title>
<style>html,body{margin:0;background:#222;overflow:hidden}#info{position:fixed;left:8px;top:8px;color:#ccc;font:12px monospace}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head><body><div id="info"></div><script type="module">
// Developer page: knights frozen in key poses (?poses=guard,block,...&who=kai&ang=0.6&weapon=sword)
import * as THREE from 'three';
import { buildKnight, LOOKS, arm } from './src/chapters/ch4/knights.js';
import { Animator } from './src/characters/ml/anim.js';
import { installLayer, POSES, ATTACKS } from './src/chapters/ch4/moves.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x40464e);
scene.add(new THREE.HemisphereLight(0xc8d4e0, 0x403830, 1.4));
const key = new THREE.DirectionalLight(0xfff1e0, 2.4); key.position.set(3, 5, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 4, bottom: -1 }); scene.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshStandardMaterial({ color: 0x4a4a44, roughness: 0.95 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const poses = (q.get('poses') || 'guard,block,parry,l1w,l1h,l3w,l3h,hvw,hvh').split(',');
const who = q.get('who') || 'kai', weapon = q.get('weapon') || 'sword', shield = q.get('shield') ?? 'blue';
const ang = +(q.get('ang') || 0.5);
const fighters = [];
for (let i = 0; i < poses.length; i++) {
  const L = typeof LOOKS[who] === 'function' ? LOOKS[who](i) : LOOKS[who];
  const c = buildKnight(L);
  arm(c, weapon, shield === 'none' ? null : shield);
  c.group.position.x = (i - (poses.length - 1) / 2) * 1.5; c.group.rotation.y = ang;
  scene.add(c.group);
  const a = new Animator(c);
  const f = { anim: a, stance: weapon === 'sword' ? 'guard' : 'guard2h' };
  installLayer(f);
  const p = poses[i];
  if (ATTACKS[p]) { f.atk = { def: ATTACKS[p], t: +(q.get('t') || ATTACKS[p].windup + ATTACKS[p].active) }; }
  else if (p !== 'guard' && p !== 'guard2h') { f.act = { pose: p, w: 1 }; if (p === 'none') f.stance = null; }
  fighters.push(f);
}
for (let k = 0; k < 90; k++) for (const f of fighters) f.anim.update(1 / 30);
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 100);
const W = poses.length * 1.5;
cam.position.set(0, 1.4, Math.max(5, W * 1.25)); cam.lookAt(0, 0.95, 0);
r.render(scene, cam);
document.getElementById('info').textContent = poses.join('  ·  ');
window.__done = true;
</script></body></html>
