<!DOCTYPE html><html><head><meta charset="utf-8"><title>City test</title><style>html,body{margin:0;overflow:hidden;background:#000}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script></head><body><script type="module">
import * as THREE from 'three';
import { Renderer } from './src/engine/renderer.js';
import { hdri } from './src/engine/assets.js';
import { buildCity, CITY } from './src/chapters/ch1/city.js';
import { makeSky } from './src/engine/sky.js';
import { buildCar } from './src/vehicles/carModel.js';
const q = new URLSearchParams(location.search);
const canvas = document.createElement('canvas'); document.body.appendChild(canvas); canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%';
const R = new Renderer(canvas, 'medium'); R.renderer.setPixelRatio(1); R.renderer.getContext().canvas; 
R.renderer.domElement.getContext; 
const scene = new THREE.Scene();
const env = await hdri(R.renderer.pmrem ? R.renderer : R, 'city_dusk');
scene.environment = env.env; scene.environmentIntensity = 0.55;
const sunDir = new THREE.Vector3(-0.7, 0.12, 0.6).normalize();
const sky = makeSky({ sunDir }); scene.add(sky);
scene.fog = new THREE.FogExp2(0x9a6a5a, 0.0016);
const sun = new THREE.DirectionalLight(0xffb27a, 2.4); sun.position.copy(sunDir).multiplyScalar(300); sun.castShadow = true; scene.add(sun); scene.add(sun.target);
sun.shadow.mapSize.set(2048, 2048); const sc = sun.shadow.camera; sc.left = -120; sc.right = 120; sc.top = 120; sc.bottom = -120; sc.far = 800; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(new THREE.HemisphereLight(0x8090b0, 0x302020, 0.4));
const t0 = performance.now();
const city = await buildCity(scene);
const car = buildCar('gt', { color: 0x7a1f1a, spoiler: true, caliper: true }); scene.add(car);
const P = CITY.P;
const cx = +(q.get('x') || P * 3), cz = +(q.get('z') || P * 2.5);
car.position.set(cx + 4, 0, cz + 8);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 60), innerWidth / innerHeight, 0.1, 4000);
cam.position.set(cx + +(q.get('dx') || 6), +(q.get('y') || 3), cz - 6); cam.lookAt(cx + +(q.get('lx') || 0), +(q.get('ly') || 6), cz + 60);
sun.position.copy(cam.position).addScaledVector(sunDir, 300); sun.target.position.copy(cam.position);
R.set(scene, cam);
R.setGrade({ exposure: 1.0, bloom: [0.7, 0.5, 0.82], saturation: 1.05, contrast: 1.05, vignette: 0.4 });
city.update(0, 1, 1);
window.__info = 'build ' + Math.round(performance.now() - t0) + 'ms';
R.render(0.016, 1); window.__done = true;
</script></body></html>
