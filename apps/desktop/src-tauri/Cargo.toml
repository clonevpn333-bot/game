[package]
name = "binderready"
version = "0.1.0"
description = "Client docs in, binder ready."
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "binderready_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "binderready"
path = "src/main.rs"

# Runs the same ingest pipeline from the command line: used by the accuracy harness
# for the scanned and photo tiers, and for benchmarking.
[[bin]]
name = "binderready-ingest"
path = "src/bin/ingest.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.3"
native-ocr = { path = "native-ocr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
kamadak-exif = "0.6"
pdfium-render = "0.9"
tesseract = "0.15"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rayon = "1.12"
tiff = "0.10"
imageproc = { version = "0.27", default-features = false }
num_cpus = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
