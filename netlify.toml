# Netlify deployment. No build step: the repo root is the site.
# The repository root is already the finished site — there is nothing to build
# at deploy time. A build command here breaks a drag-and-drop deploy, because
# the folder you drop contains the site but not the repo's tooling.
[build]
  publish = "."

# Content-hashed bundles are immutable for a year; a version bump changes the
# URL, so nothing stale is ever served (§2.3 / §3.1).
[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portal/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/portal/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The shell, the catalog and the service worker must be able to change.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/arcade.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/games.json"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
