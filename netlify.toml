[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "fullscreen=(self)"

[[headers]]
  for = "/vendor/three/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Private hub links: /h/<key> and any sub-route are served by the hub shell.
[[redirects]]
  from = "/h/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/games/summit/*"
  to = "/games/summit/:splat"
  status = 200
