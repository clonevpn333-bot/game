<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Nova Arcade</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .gate { text-align: center; opacity: 0; animation: fade 700ms var(--ease-out) 120ms forwards; }
  .mark { font-family: var(--font-display); font-size: 42px; letter-spacing: -.02em; }
  .mark em { font-style: normal; color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin-top: 10px; letter-spacing: .04em; }
  .bar { width: 180px; height: 2px; background: var(--surface-2); margin: 26px auto 0; border-radius: 2px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.1s var(--ease) infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(330%); } }
  @keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
<div class="gate">
  <div class="mark">Nova <em>Arcade</em></div>
  <div class="sub">Minting your private link…</div>
  <div class="bar"><span></span></div>
</div>
<script type="module">
  import { currentKey, hubURL } from '/js/session.js';
  location.replace(hubURL(currentKey()));
</script>
</body>
</html>
