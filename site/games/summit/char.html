<!doctype html>
<html><head><meta charset="utf-8"><title>Summit — climber preview</title>
<style>html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:12px;top:12px;font:12px ui-monospace,monospace;color:#9fb;white-space:pre;text-shadow:0 1px 3px #000}</style>
</head><body><canvas id="c"></canvas><div id="hud"></div>
<script type="module">
import * as THREE from '../../vendor/three/three.module.js';
import { Stage } from './client/gfx/scene.js';
import { buildClimber } from './client/char/body.js';
import { makeMaterials, makeExtras, defaultLook, OUTFITS, HATS } from './client/char/cosmetics.js';
import { makeSkeleton } from './client/char/rig.js';
import { materials } from './client/gfx/materials.js';
import { Animator } from './client/char/anim.js';

const q = new URLSearchParams(location.search);
const stage = new Stage(document.getElementById('c'), 'high');
stage.dayT = Number(q.get('day') ?? 0.42);

const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48).rotateX(-Math.PI / 2), materials().sandProp);
ground.receiveShadow = true;
stage.scene.add(ground);

const outfits = Object.keys(OUTFITS), hats = Object.keys(HATS);
const rigs = [];
const count = Number(q.get('n') ?? 4);
for (let i = 0; i < count; i++) {
  const look = { ...defaultLook(), outfit: outfits[i % outfits.length], hat: hats[(i + 1) % hats.length], tone: i % 5, pack: i % 3 === 0 ? 'large' : i % 3 === 1 ? 'small' : 'none' };
  const mats = makeMaterials(look);
  const { rest } = makeSkeleton();
  const rig = buildClimber(look, mats, makeExtras(look, rest));
  rig.mesh.position.set((i - (count - 1) / 2) * 1.5, 0, 0);
  rig.mesh.rotation.y = Number(q.get('spin') ?? 0);
  stage.scene.add(rig.mesh);
  rig.anim = new Animator(rig, null);
  rig.anim.setState(q.get('anim') || 'idle');
  rigs.push(rig);
}
if (q.get('skel') === '1') for (const r of rigs) stage.scene.add(new THREE.SkeletonHelper(r.mesh));

const focus = new THREE.Vector3(0, 1.1, 0);
const dist = Number(q.get('d') ?? 3.6);
stage.camera.position.set(0, 1.35, dist);
stage.camera.lookAt(focus);
let frames = 0, t = performance.now();
function loop() {
  const now = performance.now(); const dt = Math.min(0.05, (now - t) / 1000); t = now;
  for (const r of rigs) r.anim.update(dt, { speed: Number(q.get('speed') ?? 3), pitch: 0, grounded: true, footIK: false });
  stage.update(dt, focus, stage.dayT);
  stage.render();
  if (++frames === 45) window.__ready = true;
  document.getElementById('hud').textContent = `frames ${frames}\nclimbers ${rigs.length}`;
  requestAnimationFrame(loop);
}
window.__rigs = rigs; window.__stage = stage;
loop();
</script></body></html>
