<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* 00_style.css — owner: 95_ui.js agent (UI). Core/base rules here; UI agent owns the rest. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: #05070a;
  color: #cfe6ee;
  font-family: "Helvetica Neue", "Inter", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  cursor: none;
  user-select: none; -webkit-user-select: none;
  overscroll-behavior: none;
}
#gl { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#ui .clickable { pointer-events: auto; cursor: none; }
#boot {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 18px; background: #05070a;
  transition: opacity .8s ease; letter-spacing: .32em; font-size: 12px; color: #4d7f8c;
}
#boot.gone { opacity: 0; pointer-events: none; }
#bootbar { width: 240px; height: 2px; background: #12222a; overflow: hidden; }
#bootbar i { display: block; height: 100%; width: 0%; background: #00e5ff; box-shadow: 0 0 12px #00e5ff; transition: width .3s ease; }
#fatal {
  position: fixed; inset: 0; z-index: 200; display: none; padding: 40px; background: #07080b;
  color: #ff5c7a; font: 12px/1.6 monospace; white-space: pre-wrap; overflow: auto;
}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="boot"><div>VOLTHAVEN</div><div id="bootbar"><i></i></div><div id="bootmsg">INITIALISING</div></div>
<div id="fatal"></div>

<script>
/* VOLTHAVEN - all systems generated in code. Source module map:
 * 05_util.js
 * 10_core.js
 * 20_materials.js
 * 30_world.js
 * 40_chars.js
 * 50_combat.js
 * 60_ai.js
 * 70_story.js
 * 80_missions.js
 * 90_audio.js
 * 95_ui.js
 * 99_main.js
 */
(function(){
'use strict';

/* ==================== 05_util.js ==================== */
/* 05_util.js — shared primitives. Owner: core/integration. Other modules: read-only.
 * Event bus, input, deterministic RNG, noise, easing, geometry helpers, object pools.
 */
window.VH = window.VH || {};

/* ---------------------------------------------------------------- event bus */
(function () {
  const map = new Map();
  VH.on = function (n, fn) { if (!map.has(n)) map.set(n, []); map.get(n).push(fn); return fn; };
  VH.off = function (n, fn) { const a = map.get(n); if (!a) return; const i = a.indexOf(fn); if (i > -1) a.splice(i, 1); };
  VH.emit = function (n, p) {
    const a = map.get(n); if (!a) return;
    for (let i = 0; i < a.length; i++) { try { a[i](p); } catch (e) { console.error('handler ' + n, e); } }
  };
  VH.clearEvents = function () { map.clear(); };
})();

/* ---------------------------------------------------------------- query args */
VH.q = (function () {
  const o = {};
  const s = (typeof location !== 'undefined' ? location.search : '').replace(/^\?/, '');
  s.split('&').filter(Boolean).forEach(kv => { const p = kv.split('='); o[decodeURIComponent(p[0])] = p.length > 1 ? decodeURIComponent(p[1]) : '1'; });
  return o;
})();

/* ---------------------------------------------------------------- util math */
VH.util = (function () {
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
  const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
  const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; };
  const angDiff = (a, b) => { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return d; };

  /* deterministic RNG (mulberry32) */
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    const f = function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.range = (lo, hi) => lo + f() * (hi - lo);
    f.int = (lo, hi) => Math.floor(lo + f() * (hi - lo + 1));
    f.pick = arr => arr[Math.floor(f() * arr.length) % arr.length];
    f.chance = p => f() < p;
    f.sign = () => (f() < 0.5 ? -1 : 1);
    f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    return f;
  }

  /* value noise + fbm, deterministic, shared by World/Mat/Chars */
  const P = new Uint8Array(512);
  (function () { const r = rng(1337); const p = []; for (let i = 0; i < 256; i++) p[i] = i; r.shuffle(p); for (let i = 0; i < 512; i++) P[i] = p[i & 255]; })();
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad2 = (h, x, y) => { switch (h & 3) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; default: return -x - y; } };
  function noise2D(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y);
    const A = P[X] + Y, B = P[X + 1] + Y;
    return lerp(lerp(grad2(P[A], x, y), grad2(P[B], x - 1, y), u),
      lerp(grad2(P[A + 1], x, y - 1), grad2(P[B + 1], x - 1, y - 1), u), v);
  }
  function fbm(x, y, oct, gain, lac) {
    oct = oct || 4; gain = gain === undefined ? 0.5 : gain; lac = lac || 2.0;
    let s = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) { s += noise2D(x * f, y * f) * a; n += a; a *= gain; f *= lac; }
    return s / n;
  }
  function ridged(x, y, oct) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < (oct || 4); i++) { s += (1 - Math.abs(noise2D(x * f, y * f))) * a; n += a; a *= 0.5; f *= 2; } return s / n; }

  /* geometry merge — BufferGeometryUtils is not available in the core build */
  function mergeGeometries(geos, useGroups) {
    if (!geos.length) return null;
    const attrNames = [];
    for (const k in geos[0].attributes) attrNames.push(k);
    let idxCount = 0, vtxCount = 0;
    for (const g of geos) { vtxCount += g.attributes.position.count; idxCount += g.index ? g.index.count : g.attributes.position.count; }
    const out = new THREE.BufferGeometry();
    const arrays = {};
    for (const name of attrNames) {
      const proto = geos[0].attributes[name];
      arrays[name] = { arr: new Float32Array(vtxCount * proto.itemSize), size: proto.itemSize, off: 0 };
    }
    const idx = vtxCount > 65535 ? new Uint32Array(idxCount) : new Uint16Array(idxCount);
    let vo = 0, io = 0;
    for (let gi = 0; gi < geos.length; gi++) {
      const g = geos[gi];
      const n = g.attributes.position.count;
      for (const name of attrNames) {
        const a = g.attributes[name]; const t = arrays[name];
        if (!a) { t.off += n * t.size; continue; }
        t.arr.set(a.array.subarray(0, n * a.itemSize), t.off); t.off += n * t.size;
      }
      if (g.index) { const gi2 = g.index.array; for (let i = 0; i < gi2.length; i++) idx[io + i] = gi2[i] + vo; if (useGroups) out.addGroup(io, gi2.length, gi); io += gi2.length; }
      else { for (let i = 0; i < n; i++) idx[io + i] = vo + i; if (useGroups) out.addGroup(io, n, gi); io += n; }
      vo += n;
    }
    for (const name of attrNames) out.setAttribute(name, new THREE.BufferAttribute(arrays[name].arr, arrays[name].size));
    out.setIndex(new THREE.BufferAttribute(idx, 1));
    out.computeBoundingSphere();
    return out;
  }

  /* apply a matrix to a geometry clone (helper for kit-bashing) */
  function xform(geo, pos, rot, scale) {
    const g = geo.clone();
    const m = new THREE.Matrix4();
    const q = new THREE.Quaternion();
    if (rot) q.setFromEuler(rot instanceof THREE.Euler ? rot : new THREE.Euler(rot[0] || 0, rot[1] || 0, rot[2] || 0));
    m.compose(
      pos ? (pos.isVector3 ? pos : new THREE.Vector3(pos[0] || 0, pos[1] || 0, pos[2] || 0)) : new THREE.Vector3(),
      q,
      scale ? (scale.isVector3 ? scale : (typeof scale === 'number' ? new THREE.Vector3(scale, scale, scale) : new THREE.Vector3(scale[0], scale[1], scale[2]))) : new THREE.Vector3(1, 1, 1)
    );
    g.applyMatrix4(m);
    return g;
  }

  /* simple object pool */
  function pool(factory, reset, n) {
    const free = [], used = [];
    for (let i = 0; i < (n || 0); i++) free.push(factory());
    return {
      get() { const o = free.pop() || factory(); used.push(o); return o; },
      put(o) { const i = used.indexOf(o); if (i > -1) used.splice(i, 1); if (reset) reset(o); free.push(o); },
      each(fn) { for (let i = used.length - 1; i >= 0; i--) fn(used[i], i); },
      get active() { return used.length; },
      all: used,
    };
  }

  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
  const easeInCubic = t => t * t * t;
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const easeOutElastic = t => { const c4 = (2 * Math.PI) / 3; return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1; };
  const easeOutExpo = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);

  return {
    clamp, lerp, smoothstep, damp, angLerp, angDiff, rng, noise2D, fbm, ridged,
    mergeGeometries, xform, pool,
    easeOutCubic, easeOutQuint, easeInCubic, easeInOut, easeOutBack, easeOutElastic, easeOutExpo,
    TAU: Math.PI * 2, DEG: Math.PI / 180,
  };
})();

/* ---------------------------------------------------------------- input */
VH.Input = (function () {
  const keys = {};
  const pressedSet = {}, releasedSet = {};
  const mouse = { x: 0, y: 0, nx: 0, ny: 0, mx: 0, my: 0 };
  let down = false, rightDown = false, wheel = 0, clicked = false, rClicked = false;
  let el = null;
  let havePointer = false;

  function bind(target) {
    el = target || window;
    window.addEventListener('keydown', e => {
      if (keys[e.code]) { e.preventDefault(); return; }
      keys[e.code] = true; pressedSet[e.code] = true;
      if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Slash', 'Quote'].indexOf(e.code) > -1) e.preventDefault();
    }, { passive: false });
    window.addEventListener('keyup', e => { keys[e.code] = false; releasedSet[e.code] = true; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; down = false; rightDown = false; });
    window.addEventListener('mousemove', e => {
      havePointer = true;
      mouse.mx = e.movementX || 0; mouse.my = e.movementY || 0;
      mouse.x = e.clientX; mouse.y = e.clientY;
      mouse.nx = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.ny = -((e.clientY / window.innerHeight) * 2 - 1);
    });
    window.addEventListener('mousedown', e => {
      if (e.button === 0) { down = true; clicked = true; }
      if (e.button === 2) { rightDown = true; rClicked = true; }
    });
    window.addEventListener('mouseup', e => { if (e.button === 0) down = false; if (e.button === 2) rightDown = false; });
    window.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('wheel', e => { wheel += e.deltaY; if (e.cancelable) e.preventDefault(); }, { passive: false });
    /* touch: coarse support so it is at least not broken on a tablet */
    window.addEventListener('touchstart', e => {
      const t = e.touches[0]; if (!t) return;
      havePointer = true; down = true; clicked = true;
      mouse.x = t.clientX; mouse.y = t.clientY;
      mouse.nx = (t.clientX / window.innerWidth) * 2 - 1;
      mouse.ny = -((t.clientY / window.innerHeight) * 2 - 1);
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      const t = e.touches[0]; if (!t) return;
      mouse.x = t.clientX; mouse.y = t.clientY;
      mouse.nx = (t.clientX / window.innerWidth) * 2 - 1;
      mouse.ny = -((t.clientY / window.innerHeight) * 2 - 1);
    }, { passive: true });
    window.addEventListener('touchend', () => { down = false; });
    /* start the cursor at screen centre so the camera does not spin on load */
    mouse.x = window.innerWidth / 2; mouse.y = window.innerHeight / 2;
  }

  function endFrame() {
    for (const k in pressedSet) delete pressedSet[k];
    for (const k in releasedSet) delete releasedSet[k];
    wheel = 0; clicked = false; rClicked = false;
    mouse.mx = 0; mouse.my = 0;
  }

  return {
    bind, endFrame, keys, mouse,
    get down() { return down; },
    get rightDown() { return rightDown; },
    get wheel() { return wheel; },
    get clickedThisFrame() { return clicked; },
    get rightClickedThisFrame() { return rClicked; },
    get hasPointer() { return havePointer; },
    pressed(c) { return !!pressedSet[c]; },
    released(c) { return !!releasedSet[c]; },
    anyPressed() { for (const k in pressedSet) return true; return false; },
    axis() {
      let x = 0, z = 0;
      if (keys.KeyW || keys.ArrowUp) z -= 1;
      if (keys.KeyS || keys.ArrowDown) z += 1;
      if (keys.KeyA || keys.ArrowLeft) x -= 1;
      if (keys.KeyD || keys.ArrowRight) x += 1;
      const l = Math.hypot(x, z);
      return l > 1 ? { x: x / l, z: z / l, len: 1 } : { x, z, len: l };
    },
  };
})();

/* ---------------------------------------------------------------- perf meter */
VH.Perf = (function () {
  let last = performance.now(), acc = 0, frames = 0, fps = 60, worst = 999;
  function tick() {
    const now = performance.now(); const d = now - last; last = now;
    acc += d; frames++;
    if (acc > 500) { fps = 1000 / (acc / frames); worst = Math.min(worst, fps); acc = 0; frames = 0; }
    return d / 1000;
  }
  return { tick, get fps() { return fps; }, get worst() { return worst; }, reset() { worst = 999; } };
})();


/* ==================== 10_core.js ==================== */
/* 10_core.js — renderer, post-processing stack, camera rig. OWNER: core-render agent.
 * STUB: minimal working implementation so the build boots. Replace with the real thing. */
VH.Core = (function () {
  let renderer, scene, camera, ready = false;
  const camTarget = { pos: new THREE.Vector3(0, 3, 8), look: new THREE.Vector3(0, 1.5, 0), fov: 55, shakeMul: 1 };
  function init(canvas) {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: !!VH.q.cap });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    scene.fog = new THREE.FogExp2(0x0a1218, 0.018);
    camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 900);
    scene.add(new THREE.HemisphereLight(0x2a3d4a, 0x05070a, 0.6));
    const d = new THREE.DirectionalLight(0x9fd4e8, 0.5); d.position.set(-30, 60, 20); scene.add(d);
    API.scene = scene; API.camera = camera; API.renderer = renderer; API.env = null;
    addEventListener('resize', resize);
    ready = true;
  }
  function resize() { if (!ready) return; renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  function render() {
    if (!ready) return;
    camera.position.copy(camTarget.pos); camera.lookAt(camTarget.look);
    if (camera.fov !== camTarget.fov) { camera.fov = camTarget.fov; camera.updateProjectionMatrix(); }
    renderer.render(scene, camera);
  }
  const API = {
    init, render, resize, camTarget,
    scene: null, camera: null, renderer: null, env: null,
    setQuality() {}, shake() {}, hitstop() {}, registerLight() { return null; },
  };
  return API;
})();


/* ==================== 20_materials.js ==================== */
/* 20_materials.js — procedural textures & materials. OWNER: materials agent. STUB. */
VH.Mat = (function () {
  const cache = {};
  const palette = { cyan: 0x00e5ff, magenta: 0xff2d6f, amber: 0xffb340, green: 0x7cff5a, base: 0x2a3238 };
  function init() {}
  function get(n) {
    if (cache[n]) return cache[n];
    const m = new THREE.MeshStandardMaterial({ color: 0x3a4248, roughness: 0.85, metalness: 0.1 });
    cache[n] = m; return m;
  }
  function tex() { return null; }
  function makeSign() { return null; }
  return { init, get, tex, makeSign, palette, noise2D: VH.util.noise2D, fbm: VH.util.fbm };
})();


/* ==================== 30_world.js ==================== */
/* 30_world.js — procedural city. OWNER: world agent. STUB. */
VH.World = (function () {
  let world = null;
  function build(seed, district) {
    const group = new THREE.Group();
    const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), VH.Mat.get('asphalt'));
    g.rotation.x = -Math.PI / 2; group.add(g);
    world = {
      group, colliders: [], lights: [], district: district || 'undertide',
      navSample: () => ({ y: 0, walkable: true }),
      spawns: { player: new THREE.Vector3(0, 0, 0), enemy: [], cover: [] },
      bounds: new THREE.Box3(new THREE.Vector3(-200, 0, -200), new THREE.Vector3(200, 80, 200)),
    };
    return world;
  }
  function update() {}
  function raycastGround() { return 0; }
  function segments() { return ['undertide']; }
  return { build, update, raycastGround, segments };
})();


/* ==================== 40_chars.js ==================== */
/* 40_chars.js — procedural characters + animation. OWNER: character agent. STUB. */
VH.Chars = (function () {
  let nid = 0;
  function init() {}
  function create(archetype, opts) {
    opts = opts || {};
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.34, 1.05, 10), VH.Mat.get('fabricDark'));
    body.position.y = 1.0; group.add(body);
    const a = {
      id: (archetype === 'kas' ? 'p' : 'e') + (nid++), group, kind: opts.kind || (archetype === 'kas' ? 'player' : 'enemy'),
      archetype, team: opts.team === undefined ? (archetype === 'kas' ? 0 : 1) : opts.team,
      hp: opts.hp || 100, maxHp: opts.hp || 100, armor: 0, alive: true,
      radius: 0.42, height: 1.78, vel: new THREE.Vector3(), yaw: 0, state: 'idle',
      stagger: 0, iframes: 0, aim: new THREE.Vector3(), weapon: null, anim: {}, ai: {},
      headPos() { return group.position.clone().add(new THREE.Vector3(0, 1.62, 0)); },
      chestPos() { return group.position.clone().add(new THREE.Vector3(0, 1.25, 0)); },
    };
    return a;
  }
  function update() {}
  function play() {}
  function lookAt() {}
  function portrait() { return null; }
  return { init, create, update, play, lookAt, portrait };
})();


/* ==================== 50_combat.js ==================== */
/* 50_combat.js — player controller, weapons, damage, camera target. OWNER: combat agent. STUB. */
VH.Combat = (function () {
  const weapons = {};
  function init() {}
  function spawnPlayer(pos) {
    const p = VH.Chars.create('kas', { kind: 'player', team: 0 });
    p.group.position.copy(pos || new THREE.Vector3());
    VH.ctx.scene.add(p.group); VH.ctx.player = p; VH.ctx.actors.push(p);
    return p;
  }
  function update(dt) {
    const p = VH.ctx.player; if (!p) return;
    const ax = VH.Input.axis();
    p.group.position.x += ax.x * 6 * dt; p.group.position.z += ax.z * 6 * dt;
    const t = VH.Core.camTarget;
    t.pos.set(p.group.position.x, p.group.position.y + 3.1, p.group.position.z + 6.2);
    t.look.set(p.group.position.x, p.group.position.y + 1.5, p.group.position.z);
  }
  function damage(target, amount) {
    if (!target || !target.alive) return;
    target.hp -= amount;
    if (target.hp <= 0) { target.alive = false; VH.emit('kill', { target }); }
  }
  function giveWeapon() {}
  return { init, update, spawnPlayer, damage, giveWeapon, weapons };
})();


/* ==================== 60_ai.js ==================== */
/* 60_ai.js — enemy brains, squads, spawning. OWNER: ai agent. STUB. */
VH.AI = (function () {
  function init() {}
  function update() {}
  function spawn(archetype, pos, opts) {
    const a = VH.Chars.create(archetype, opts);
    a.group.position.copy(pos);
    VH.ctx.scene.add(a.group); VH.ctx.actors.push(a); VH.ctx.enemies.push(a);
    return a;
  }
  function clearAll() {
    VH.ctx.enemies.forEach(e => { if (e.group.parent) e.group.parent.remove(e.group); });
    VH.ctx.enemies.length = 0;
  }
  function setAlert() {}
  return { init, update, spawn, clearAll, setAlert };
})();

  dialogue: {}, codex: [], barks: {},
};


/* ==================== 80_missions.js ==================== */
/* 80_missions.js — mission runtime, triggers, cutscenes, flow. OWNER: missions agent. STUB. */
VH.Missions = (function () {
  let cur = null;
  function init() {}
  function start(id) { cur = { id, objectives: [] }; VH.emit('missionStart', { id }); }
  function update() {}
  function complete() { if (cur) VH.emit('missionEnd', { id: cur.id, outcome: 'success' }); }
  function fail(r) { if (cur) VH.emit('missionEnd', { id: cur.id, outcome: 'fail', reason: r }); }
  function goto(id) { start(id); }
  return { init, start, update, complete, fail, goto, get current() { return cur; } };
})();


/* ==================== 90_audio.js ==================== */
/* 90_audio.js — WebAudio synthesis, music, ambience. OWNER: audio agent. STUB. */
VH.Audio = (function () {
  let unlocked = false;
  function init() {}
  function unlock() { unlocked = true; }
  function update() {}
  function play() { return null; }
  function music() {}
  function ambience() {}
  function voice() {}
  return { init, unlock, update, play, music, ambience, voice, get unlocked() { return unlocked; } };
})();


/* ==================== 95_ui.js ==================== */
/* 95_ui.js — HUD, menus, dialogue, codex. OWNER: ui agent. STUB. */
VH.UI = (function () {
  let root;
  function init() { root = document.getElementById('ui'); }
  function update() {}
  function showDialogue(node, cb) { if (cb) cb(); }
  function hideDialogue() {}
  function setObjectives() {}
  function toast() {}
  function titleScreen() {}
  function missionCard(m, cb) { if (cb) cb(); }
  return { init, update, showDialogue, hideDialogue, setObjectives, toast, titleScreen, missionCard };
})();


/* ==================== 99_main.js ==================== */
/* 99_main.js — boot, main loop, debug hooks. OWNER: integration (main agent). */
(function () {
  const boot = document.getElementById('boot');
  const bootbar = document.querySelector('#bootbar i');
  const bootmsg = document.getElementById('bootmsg');
  function progress(p, msg) {
    if (bootbar) bootbar.style.width = (p * 100).toFixed(0) + '%';
    if (bootmsg && msg) bootmsg.textContent = msg;
  }
  function fatal(e) {
    const el = document.getElementById('fatal');
    el.style.display = 'block';
    el.textContent = 'VOLTHAVEN failed to start\n\n' + (e && e.stack ? e.stack : String(e));
    if (boot) boot.classList.add('gone');
    console.error(e);
  }

  VH.ctx = {
    scene: null, camera: null, renderer: null,
    player: null, actors: [], enemies: [],
    world: null, time: 0, dt: 0, frame: 0,
    paused: false, timeScale: 1, input: VH.Input, flags: {},
  };

  let hitstopT = 0;
  VH.on('hitstop', d => { hitstopT = Math.max(hitstopT, (d && d.dur) || 0.05); });

  function step(name, fn) {
    try { fn(); } catch (e) { console.error('[' + name + '] ' + e.message, e); throw e; }
  }

  function start() {
    if (!window.THREE) { fatal(new Error('three.js failed to load from cdnjs')); return; }
    const canvas = document.getElementById('gl');
    VH.Input.bind(canvas);

    progress(0.05, 'RENDERER');
    step('Audio.init', () => VH.Audio.init());
    step('Core.init', () => VH.Core.init(canvas));
    VH.ctx.scene = VH.Core.scene; VH.ctx.camera = VH.Core.camera; VH.ctx.renderer = VH.Core.renderer;

    progress(0.2, 'MATERIALS');
    step('Mat.init', () => VH.Mat.init(VH.Core.renderer));

    progress(0.45, 'VOLTHAVEN');
    const seed = +(VH.q.seed || 20770);
    const startMission = VH.q.mission || null;
    const district = startMission && VH.Story.missions[startMission] ? VH.Story.missions[startMission].district : undefined;
    step('World.build', () => {
      VH.ctx.world = VH.World.build(seed, district);
      if (VH.ctx.world && VH.ctx.world.group) VH.ctx.scene.add(VH.ctx.world.group);
    });

    progress(0.68, 'CHARACTERS');
    step('Chars.init', () => VH.Chars.init());
    step('Combat.init', () => VH.Combat.init());
    step('AI.init', () => VH.AI.init());

    progress(0.85, 'SYSTEMS');
    step('Missions.init', () => VH.Missions.init());
    step('UI.init', () => VH.UI.init());

    progress(1, 'READY');

    /* First user gesture unlocks audio (browser policy). */
    const unlock = () => { try { VH.Audio.unlock(); } catch (e) {} };
    window.addEventListener('pointerdown', unlock, { once: true });
    window.addEventListener('keydown', unlock, { once: true });

    setTimeout(() => { if (boot) boot.classList.add('gone'); }, 260);

    /* Entry point: title screen, or straight into a mission when driven by the harness. */
    if (startMission) {
      VH.Missions.goto(startMission);
    } else if (VH.q.nointro) {
      VH.Missions.start(VH.Story.acts[0].missions[0]);
    } else {
      VH.UI.titleScreen();
    }

    requestAnimationFrame(loop);
  }

  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    let raw = (now - last) / 1000; last = now;
    if (!(raw > 0)) raw = 1 / 60;
    raw = Math.min(raw, 1 / 20);

    if (hitstopT > 0) { hitstopT -= raw; }
    const scale = (hitstopT > 0 ? 0.02 : 1) * (VH.ctx.paused ? 0 : 1) * VH.ctx.timeScale;
    const dt = raw * scale;

    VH.ctx.dt = dt; VH.ctx.rawDt = raw; VH.ctx.time += dt; VH.ctx.frame++;

    try {
      VH.Missions.update(dt);
      VH.AI.update(dt);
      VH.Combat.update(dt, raw);
      VH.Chars.update(dt);
      VH.World.update(dt);
      VH.Audio.update(dt);
      VH.UI.update(dt, raw);
      VH.Core.render(dt, raw);
    } catch (e) {
      if (!VH._loopErrored) { VH._loopErrored = true; console.error('loop error:', e); }
    }

    VH.Input.endFrame();
    VH.Perf.tick();
    if (!VH.booted && VH.ctx.frame > 2) VH.booted = true;
  }

  /* ------------------------------------------------------------ debug hooks */
  VH.debug = {
    state() {
      const p = VH.ctx.player;
      return {
        mission: VH.Missions.current ? VH.Missions.current.id : null,
        objectives: VH.Missions.current && VH.Missions.current.objectives ? VH.Missions.current.objectives.map(o => (o.text || o.id) + (o.done ? ' [x]' : '')) : [],
        enemies: VH.ctx.enemies.filter(e => e.alive).length,
        hp: p ? Math.round(p.hp) : null,
        fps: Math.round(VH.Perf.fps),
        district: VH.ctx.world ? VH.ctx.world.district : null,
        pos: p ? [+p.group.position.x.toFixed(1), +p.group.position.y.toFixed(1), +p.group.position.z.toFixed(1)] : null,
        frame: VH.ctx.frame,
      };
    },
    goto(id) { VH.Missions.goto(id); },
    freecam(pos, look) {
      VH.debug._free = true;
      const t = VH.Core.camTarget;
      if (pos) t.pos.set(pos[0], pos[1], pos[2]);
      if (look) t.look.set(look[0], look[1], look[2]);
    },
    spawn(a, n) { for (let i = 0; i < (n || 1); i++) { const p = VH.ctx.player ? VH.ctx.player.group.position : new THREE.Vector3(); VH.AI.spawn(a, new THREE.Vector3(p.x + (Math.random() - .5) * 14, p.y, p.z - 6 - Math.random() * 8)); } },
    kill() { VH.ctx.enemies.slice().forEach(e => VH.Combat.damage(e, 99999, { silent: true })); },
    god(b) { VH.ctx.flags.god = b !== false; },
    timeScale(n) { VH.ctx.timeScale = n; },
    pause(b) { VH.ctx.paused = b !== false; },
  };
  if (VH.q.god) VH.ctx.flags.god = true;

  window.addEventListener('error', e => { if (!VH.booted) fatal(e.error || e.message); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { try { start(); } catch (e) { fatal(e); } });
  else { try { start(); } catch (e) { fatal(e); } }
})();


})();
</script>
</body>
</html>
