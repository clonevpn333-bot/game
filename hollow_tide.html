/* ============================== AUDIO ====================================
   Everything is synthesized: no samples, no files.                         */
const AUDIO = {
  ready: false,
  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = 0.8;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 6;
    this.master.connect(comp); comp.connect(ctx.destination);

    // noise beds
    const len = ctx.sampleRate * 2;
    this.whiteBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const wd = this.whiteBuf.getChannelData(0);
    for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
    this.brownBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const bd = this.brownBuf.getChannelData(0);
    let acc = 0;
    for (let i = 0; i < len; i++) { acc = (acc + (Math.random() * 2 - 1) * 0.02); acc *= 0.998; bd[i] = acc * 6; }

    // the drone — a building breathing under water
    const drone = ctx.createBufferSource(); drone.buffer = this.brownBuf; drone.loop = true;
    this.droneLP = ctx.createBiquadFilter(); this.droneLP.type = 'lowpass'; this.droneLP.frequency.value = 120;
    this.droneRes = ctx.createBiquadFilter(); this.droneRes.type = 'peaking'; this.droneRes.frequency.value = 200; this.droneRes.Q.value = 8; this.droneRes.gain.value = 5;
    this.droneGain = ctx.createGain(); this.droneGain.gain.value = 0.32;
    drone.connect(this.droneLP); this.droneLP.connect(this.droneRes); this.droneRes.connect(this.droneGain); this.droneGain.connect(this.master);
    drone.start();
    const sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = 34;
    this.subGain = ctx.createGain(); this.subGain.gain.value = 0.045;
    sub.connect(this.subGain); this.subGain.connect(this.master); sub.start();

    // rain
    const rain = ctx.createBufferSource(); rain.buffer = this.whiteBuf; rain.loop = true; rain.playbackRate.value = 0.9;
    const rainBP = ctx.createBiquadFilter(); rainBP.type = 'bandpass'; rainBP.frequency.value = 2600; rainBP.Q.value = 0.4;
    this.rainGain = ctx.createGain(); this.rainGain.gain.value = 0;
    rain.connect(rainBP); rainBP.connect(this.rainGain); this.rainGain.connect(this.master);
    rain.start();

    // the lens hum
    const hum1 = ctx.createOscillator(); hum1.frequency.value = 118;
    const hum2 = ctx.createOscillator(); hum2.frequency.value = 236.7;
    this.humGain = ctx.createGain(); this.humGain.gain.value = 0;
    hum1.connect(this.humGain); hum2.connect(this.humGain); this.humGain.connect(this.master);
    hum1.start(); hum2.start();

    // the hunt cluster — detuned strings that rise when he runs
    this.clusterGain = ctx.createGain(); this.clusterGain.gain.value = 0;
    const clusterLP = ctx.createBiquadFilter(); clusterLP.type = 'lowpass'; clusterLP.frequency.value = 850;
    this.clusterGain.connect(clusterLP); clusterLP.connect(this.master);
    for (const f of [98, 103.8, 110.9, 147.2]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.055;
      o.connect(g); g.connect(this.clusterGain); o.start();
    }
    this.heartT = 0;
    this.groanT = 2;
    this.ready = true;
  },
  now() { return this.ctx.currentTime; },
  /* one-shot noise burst through a filter — the workhorse */
  burst({ dur = 0.1, type = 'lowpass', freq = 500, q = 1, gain = 0.3, rate = 1, attack = 0.004, glide = 0 } = {}) {
    if (!this.ready) return;
    const ctx = this.ctx;
    const src = ctx.createBufferSource(); src.buffer = this.whiteBuf; src.loop = true;
    src.playbackRate.value = rate;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    if (glide) f.frequency.exponentialRampToValueAtTime(Math.max(30, freq + glide), this.now() + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, this.now());
    g.gain.exponentialRampToValueAtTime(gain, this.now() + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, this.now() + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(); src.stop(this.now() + dur + 0.05);
  },
  tone({ freq = 440, dur = 0.2, type = 'sine', gain = 0.15, glide = 0, attack = 0.005 } = {}) {
    if (!this.ready) return;
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + glide), this.now() + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, this.now());
    g.gain.exponentialRampToValueAtTime(gain, this.now() + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, this.now() + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.now() + dur + 0.05);
  },
  att(pos, playerPos, half = 6) {
    if (!pos || !playerPos) return 1;
    const d = pos.distanceTo(playerPos);
    return 1 / (1 + (d / half) * (d / half));
  },
  footstep(surface, mode) {
    const vol = mode === 'sneak' ? 0.16 : mode === 'sprint' ? 0.85 : mode === 'crawl' ? 0.1 : 0.45;
    switch (surface) {
      case 'metal':
        this.burst({ dur: 0.07, type: 'bandpass', freq: 700 + Math.random() * 300, q: 2.5, gain: 0.22 * vol });
        this.tone({ freq: 1250 + Math.random() * 500, dur: 0.11, type: 'triangle', gain: 0.045 * vol, glide: -300 });
        break;
      case 'cloth':
        this.burst({ dur: 0.07, freq: 240, gain: 0.08 * vol }); break;
      case 'sand':
        this.burst({ dur: 0.13, freq: 480, q: 0.6, gain: 0.13 * vol }); break;
      case 'water':
        this.burst({ dur: 0.16, type: 'bandpass', freq: 1000 + Math.random() * 400, q: 1.2, gain: 0.2 * vol, glide: -500 }); break;
      case 'stone':
        this.burst({ dur: 0.06, freq: 620, gain: 0.16 * vol }); break;
      case 'flesh':
        this.burst({ dur: 0.09, freq: 260, gain: 0.14 * vol }); break;
      default: // wood
        this.burst({ dur: 0.08, freq: 380 + Math.random() * 120, q: 1.4, gain: 0.18 * vol });
        if (Math.random() < 0.2) this.tone({ freq: 130, dur: 0.16, type: 'sine', gain: 0.03 * vol, glide: -30 }); // creak
    }
  },
  wardenStep(att) {
    this.burst({ dur: 0.22, freq: 120, gain: 0.5 * att, glide: -60 });
    this.tone({ freq: 55, dur: 0.3, type: 'sine', gain: 0.3 * att, glide: -18 });
    if (Math.random() < 0.4) this.tone({ freq: 90 + Math.random() * 40, dur: 0.5, type: 'sine', gain: 0.05 * att, glide: -35 }); // wet floorboard groan
  },
  groan(att) {
    if (!this.ready) return;
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(46, this.now());
    o.frequency.exponentialRampToValueAtTime(31, this.now() + 1.6);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160; f.Q.value = 4;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, this.now());
    g.gain.exponentialRampToValueAtTime(0.34 * att, this.now() + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, this.now() + 1.9);
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(); o.stop(this.now() + 2);
  },
  // the noise he makes the instant he sees her — a wet guttural bark
  roar(pitch = 1) {
    if (!this.ready) return;
    const ctx = this.ctx, t = this.now();
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(150 * pitch, t);
    o.frequency.exponentialRampToValueAtTime(60 * pitch, t + 0.5);
    const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 74 * pitch;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(500, t);
    f.frequency.exponentialRampToValueAtTime(180, t + 0.55); f.Q.value = 3;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o.start(); o2.start(); o.stop(t + 0.75); o2.stop(t + 0.75);
    // the chase theme drops in hard
    this.huntStab();
    this.huntActive = 4.0;
  },
  // a stab of the string cluster + a struck low drum: the music hitting
  huntStab() {
    if (!this.ready) return;
    const t = this.now();
    for (const f of [110, 130.8, 155.6, 220]) this.tone({ freq: f, dur: 1.4, type: 'sawtooth', gain: 0.05, attack: 0.02 });
    this.burst({ dur: 0.35, freq: 90, gain: 0.4, glide: -50 });
    this.tone({ freq: 55, dur: 0.9, type: 'sine', gain: 0.3, glide: -20 });
  },
  event(type, pos, data, playerPos) {
    if (!this.ready) return;
    const a = this.att(pos, playerPos);
    switch (type) {
      case 'step': this.footstep(data.surface, data.mode); break;
      case 'land': this.burst({ dur: 0.12, freq: 300, gain: 0.3 * (data || 0.5) }); break;
      case 'kick': this.burst({ dur: 0.2, type: 'bandpass', freq: 900, q: 2, gain: 0.3 * a }); this.tone({ freq: 1400, dur: 0.3, type: 'triangle', gain: 0.08 * a, glide: -700 }); break;
      case 'thud': this.burst({ dur: 0.14, freq: 200, gain: 0.4 * a * (data || 1) }); break;
      case 'wardenStep': this.wardenStep(a * (data || 1)); break;
      case 'distantGroan': this.groan(0.5); break;
      case 'wardenReveal': this.groan(0.9); this.tone({ freq: 60, dur: 2.4, type: 'sine', gain: 0.22, glide: -22 }); break;
      case 'wardenLunge': this.burst({ dur: 0.5, type: 'bandpass', freq: 300, q: 1, gain: 0.5, glide: 500 }); this.groan(1); break;
      case 'wardenSpot': this.roar(1); break;
      case 'wardenCrushed': this.burst({ dur: 0.8, freq: 150, gain: 0.7, glide: -100 }); this.groan(1); break;
      case 'wardenPinned': this.tone({ freq: 200, dur: 1.2, type: 'sine', gain: 0.1, glide: 160 }); break;
      case 'rendererStep': this.burst({ dur: 0.05, type: 'highpass', freq: 1400, q: 1, gain: 0.12 * a * (data || 1) }); break;
      case 'rendererAlert': this.burst({ dur: 0.7, type: 'bandpass', freq: 2400, q: 6, gain: 0.26, glide: 1200 }); this.tone({ freq: 1900, dur: 0.6, type: 'square', gain: 0.03, glide: 900 }); this.huntStab(); this.huntActive = 3.0; break;
      case 'rendererReveal': this.tone({ freq: 84, dur: 2.2, type: 'sine', gain: 0.2, glide: -26 }); this.burst({ dur: 1.4, type: 'bandpass', freq: 3200, q: 8, gain: 0.06 }); break;
      case 'chorusReveal': this.tone({ freq: 220, dur: 2.8, type: 'sine', gain: 0.05, glide: 24 }); this.tone({ freq: 331, dur: 2.8, type: 'sine', gain: 0.04, glide: -20 }); break;
      case 'chorusAngry': this.tone({ freq: 400 + Math.random() * 200, dur: 0.3, type: 'square', gain: 0.05 }); this.burst({ dur: 0.3, type: 'bandpass', freq: 1300, q: 3, gain: 0.14 }); break;
      case 'doorGrind': this.burst({ dur: 2.4, freq: 140, q: 3, gain: 0.4 * a, glide: 60 }); this.tone({ freq: 47, dur: 2.4, type: 'sawtooth', gain: 0.12 * a }); break;
      case 'leverClank': this.burst({ dur: 0.12, type: 'bandpass', freq: 1100, q: 4, gain: 0.3 * a }); this.tone({ freq: 320, dur: 0.2, type: 'square', gain: 0.05 * a, glide: -120 }); break;
      case 'unlock': this.tone({ freq: 700, dur: 0.15, type: 'triangle', gain: 0.1, glide: -200 }); this.burst({ dur: 0.3, type: 'bandpass', freq: 800, q: 3, gain: 0.2 }); break;
      case 'locked': this.burst({ dur: 0.1, type: 'bandpass', freq: 500, q: 4, gain: 0.18 }); break;
      case 'jarCrash': for (let i = 0; i < 5; i++) setTimeout(() => this.burst({ dur: 0.3, type: 'bandpass', freq: 900 + Math.random() * 1500, q: 3, gain: 0.35 }), i * 90); break;
      case 'hookCatch': this.burst({ dur: 0.15, type: 'bandpass', freq: 1500, q: 3, gain: 0.15 }); break;
      case 'swingRelease': this.burst({ dur: 0.1, freq: 700, gain: 0.08 }); break;
      case 'stub': this.tone({ freq: 1180, dur: 0.5, type: 'sine', gain: 0.08 }); this.tone({ freq: 1770, dur: 0.7, type: 'sine', gain: 0.05, attack: 0.1 }); break;
      case 'lanternPickup': this.tone({ freq: 880, dur: 0.4, type: 'sine', gain: 0.07 }); this.burst({ dur: 0.2, type: 'bandpass', freq: 1800, q: 4, gain: 0.1 }); break;
      case 'ballastCrash': this.burst({ dur: 0.6, freq: 130, gain: 0.8, glide: -70 }); this.tone({ freq: 48, dur: 1, type: 'sine', gain: 0.4, glide: -18 }); break;
      case 'winchRelease': this.burst({ dur: 0.6, type: 'bandpass', freq: 700, q: 2, gain: 0.25, glide: 900 }); break;
      case 'valveTurn': this.burst({ dur: 0.5, type: 'bandpass', freq: 480, q: 3, gain: 0.2, glide: 140 }); this.tone({ freq: 95, dur: 0.5, type: 'sawtooth', gain: 0.04 }); break;
      case 'doorsBurn': this.burst({ dur: 2.8, freq: 300, gain: 0.4, glide: 700 }); this.tone({ freq: 55, dur: 3, type: 'sawtooth', gain: 0.14, glide: 30 }); break;
      case 'beltStart': this.tone({ freq: 70, dur: 1.2, type: 'sawtooth', gain: 0.1, glide: 25 }); break;
      case 'beltStop': this.tone({ freq: 95, dur: 0.9, type: 'sawtooth', gain: 0.08, glide: -40 }); break;
      case 'splash': this.burst({ dur: 0.25, type: 'bandpass', freq: 1100, q: 1, gain: 0.3, glide: -600 }); break;
      case 'drown': this.burst({ dur: 1.2, freq: 400, gain: 0.4, glide: -320 }); break;
      case 'caught': this.burst({ dur: 0.4, freq: 250, gain: 0.6, glide: -150 }); this.tone({ freq: 66, dur: 0.8, type: 'sawtooth', gain: 0.3, glide: -30 }); break;
    }
  },
  setAmbience(tag) {
    if (!this.ready) return;
    const t = this.now();
    const presets = {
      beach:   { lp: 95,  resF: 150, resG: 2, rain: 0.16, hum: 0,    sub: 0.05 },
      hull:    { lp: 150, resF: 320, resG: 6, rain: 0.05, hum: 0,    sub: 0.045 },
      cellar:  { lp: 120, resF: 210, resG: 9, rain: 0,    hum: 0,    sub: 0.05 },
      works:   { lp: 230, resF: 520, resG: 8, rain: 0,    hum: 0.006, sub: 0.06 },
      stair:   { lp: 100, resF: 260, resG: 5, rain: 0,    hum: 0.004, sub: 0.04 },
      sanctum: { lp: 130, resF: 300, resG: 3, rain: 0,    hum: 0.02, sub: 0.03 },
      lens:    { lp: 150, resF: 350, resG: 4, rain: 0,    hum: 0.05, sub: 0.035 },
    };
    const p = presets[tag] || presets.cellar;
    this.droneLP.frequency.linearRampToValueAtTime(p.lp, t + 2.5);
    this.droneRes.frequency.linearRampToValueAtTime(p.resF, t + 2.5);
    this.droneRes.gain.linearRampToValueAtTime(p.resG, t + 2.5);
    this.rainGain.gain.linearRampToValueAtTime(p.rain, t + 2.5);
    this.humGain.gain.linearRampToValueAtTime(p.hum, t + 2.5);
    this.subGain.gain.linearRampToValueAtTime(p.sub, t + 2.5);
    this.exterior = tag === 'beach';
  },
  update(dt, threat, exhaustion) {
    if (!this.ready) return;
    // hunt cluster follows threat
    const cg = this.clusterGain.gain;
    cg.value = damp(cg.value, threat * 0.85, 1.6, dt);
    this.huntActive = Math.max((this.huntActive || 0) - dt, threat > 0.4 ? 1.5 : 0);
    // heartbeat under pressure
    this.heartT -= dt;
    if (threat > 0.25 && this.heartT <= 0) {
      this.heartT = 60 / (62 + threat * 74);
      this.tone({ freq: 52, dur: 0.14, type: 'sine', gain: 0.16 + threat * 0.2, glide: -14 });
      setTimeout(() => this.tone({ freq: 44, dur: 0.12, type: 'sine', gain: 0.1 + threat * 0.12, glide: -10 }), 180);
    }
    // driving chase pulse — the actual "music" while hunted: a running low ostinato
    this.pulseT = (this.pulseT || 0) - dt;
    if (this.huntActive > 0 && this.pulseT <= 0) {
      this.pulseT = 0.24;
      const step = (this.pulseStep = ((this.pulseStep || 0) + 1) % 4);
      const notes = [73.4, 73.4, 87.3, 98.0]; // Dm-ish running bass
      this.tone({ freq: notes[step], dur: 0.22, type: 'sawtooth', gain: 0.09, glide: -4 });
      if (step === 0) this.tone({ freq: notes[step] * 2, dur: 0.3, type: 'triangle', gain: 0.03 });
    }
    // the far rooms of the works knock and settle and moan
    this.ambT = (this.ambT ?? 4) - dt;
    if (this.ambT <= 0) {
      this.ambT = 8 + Math.random() * 16;
      const r = Math.random();
      if (r < 0.3) this.groan(0.1 + Math.random() * 0.08);
      else if (r < 0.55) this.burst({ dur: 0.4, type: 'bandpass', freq: 320 + Math.random() * 600, q: 7, gain: 0.05, glide: -120 });
      else if (r < 0.78) this.tone({ freq: 38 + Math.random() * 22, dur: 2.4, type: 'sine', gain: 0.05, glide: -9 });
      else this.burst({ dur: 1.8, freq: 140, q: 2, gain: 0.04, glide: 50 });
    }
    // rain droplet plinks
    if (this.exterior && Math.random() < dt * 7) {
      this.tone({ freq: 900 + Math.random() * 2200, dur: 0.03 + Math.random() * 0.05, type: 'sine', gain: 0.012 + Math.random() * 0.02 });
    }
  },
};

/* ============================== POST =====================================
   Custom post chain: scene → bright pass → separable blur → composite with
   ACES, film grain, vignette, edge chromatic aberration, breath, fades.   */
const GLSL_ACES = `
vec3 aces(vec3 x){
  return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
}`;
const POST = {
  init(renderer, w, h) {
    this.renderer = renderer;
    const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
    this.sceneRT = new THREE.WebGLRenderTarget(w, h, rtOpts);
    this.brightRT = new THREE.WebGLRenderTarget(w >> 1, h >> 1, rtOpts);
    this.blurART = new THREE.WebGLRenderTarget(w >> 1, h >> 1, rtOpts);
    this.blurBRT = new THREE.WebGLRenderTarget(w >> 1, h >> 1, rtOpts);
    this.quadScene = new THREE.Scene();
    this.quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
    this.quad.frustumCulled = false;
    this.quadScene.add(this.quad);
    const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
    this.brightMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, threshold: { value: 0.85 }, exposure: { value: 4.2 } },
      vertexShader: VS,
      fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform float threshold, exposure; ${GLSL_ACES}
        void main(){
          vec3 c = aces(texture2D(tDiffuse, vUv).rgb * exposure);
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          gl_FragColor = vec4(c * smoothstep(threshold, threshold + 0.3, l), 1.0);
        }`,
      depthTest: false, depthWrite: false,
    });
    this.blurMat = new THREE.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, dir: { value: new THREE.Vector2(1, 0) }, texel: { value: new THREE.Vector2(1 / 512, 1 / 512) } },
      vertexShader: VS,
      fragmentShader: `varying vec2 vUv; uniform sampler2D tDiffuse; uniform vec2 dir; uniform vec2 texel;
        void main(){
          float w[5]; w[0]=0.227027; w[1]=0.1945946; w[2]=0.1216216; w[3]=0.054054; w[4]=0.016216;
          vec3 c = texture2D(tDiffuse, vUv).rgb * w[0];
          for (int i = 1; i < 5; i++){
            vec2 o = dir * texel * float(i) * 1.6;
            c += texture2D(tDiffuse, vUv + o).rgb * w[i];
            c += texture2D(tDiffuse, vUv - o).rgb * w[i];
          }
          gl_FragColor = vec4(c, 1.0);
        }`,
      depthTest: false, depthWrite: false,
    });
    this.compMat = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: null }, tBloom: { value: null },
        time: { value: 0 }, bloomStrength: { value: 0.4 },
        breath: { value: 0 }, fade: { value: 0 }, exposure: { value: 4.2 },
        fadeColor: { value: new THREE.Color(0x000000) },
        grainAmt: { value: 0.055 }, caAmt: { value: 0.0016 },
      },
      vertexShader: VS,
      fragmentShader: `varying vec2 vUv;
        uniform sampler2D tDiffuse; uniform sampler2D tBloom;
        uniform float time, bloomStrength, breath, fade, grainAmt, caAmt, exposure;
        uniform vec3 fadeColor;
        ${GLSL_ACES}
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        void main(){
          vec2 cc = vUv - 0.5;
          float r2 = dot(cc, cc);
          // chromatic aberration grows toward the frame edge
          float ca = caAmt * r2 * 14.0;
          vec3 col;
          col.r = texture2D(tDiffuse, vUv + cc * ca).r;
          col.g = texture2D(tDiffuse, vUv).g;
          col.b = texture2D(tDiffuse, vUv - cc * ca).b;
          col *= exposure;
          col = aces(col);
          col += texture2D(tBloom, vUv).rgb * bloomStrength;
          // vignette — the world closes in
          float vig = 1.0 - smoothstep(0.32, 1.05, length(cc) * (1.35 + breath * 0.55));
          col *= mix(0.35, 1.0, vig);
          // breathing pulse when hunted
          float pulse = breath * (0.5 + 0.5 * sin(time * 4.4));
          col = mix(col, col * vec3(0.72, 0.5, 0.48), pulse * smoothstep(0.25, 0.85, length(cc)));
          // film grain
          float g = (hash(vUv * vec2(1723.0, 3121.0) + fract(time) * 913.0) - 0.5) * grainAmt;
          col += g * (0.4 + 0.6 * (1.0 - vig));
          // fades (death, ending)
          col = mix(col, fadeColor, fade);
          col = pow(max(col, 0.0), vec3(0.4545));
          gl_FragColor = vec4(col, 1.0);
        }`,
      depthTest: false, depthWrite: false, toneMapped: false,
    });
  },
  setSize(w, h) {
    this.sceneRT.setSize(w, h);
    this.brightRT.setSize(w >> 1, h >> 1);
    this.blurART.setSize(w >> 1, h >> 1);
    this.blurBRT.setSize(w >> 1, h >> 1);
  },
  pass(mat, target) {
    this.quad.material = mat;
    this.renderer.setRenderTarget(target);
    this.renderer.render(this.quadScene, this.quadCam);
  },
  render(scene, camera, u) {
    const r = this.renderer;
    r.setRenderTarget(this.sceneRT);
    r.render(scene, camera);
    this.brightMat.uniforms.tDiffuse.value = this.sceneRT.texture;
    this.pass(this.brightMat, this.brightRT);
    const tx = new THREE.Vector2(1 / this.brightRT.width, 1 / this.brightRT.height);
    this.blurMat.uniforms.texel.value.copy(tx);
    this.blurMat.uniforms.tDiffuse.value = this.brightRT.texture;
    this.blurMat.uniforms.dir.value.set(1, 0);
    this.pass(this.blurMat, this.blurART);
    this.blurMat.uniforms.tDiffuse.value = this.blurART.texture;
    this.blurMat.uniforms.dir.value.set(0, 1);
    this.pass(this.blurMat, this.blurBRT);
    this.blurMat.uniforms.tDiffuse.value = this.blurBRT.texture;
    this.blurMat.uniforms.dir.value.set(2, 0);
    this.pass(this.blurMat, this.blurART);
    this.blurMat.uniforms.tDiffuse.value = this.blurART.texture;
    this.blurMat.uniforms.dir.value.set(0, 2);
    this.pass(this.blurMat, this.blurBRT);
    this.compMat.uniforms.tDiffuse.value = this.sceneRT.texture;
    this.compMat.uniforms.tBloom.value = this.blurBRT.texture;
    this.compMat.uniforms.time.value = u.time;
    this.compMat.uniforms.breath.value = u.breath;
    this.compMat.uniforms.fade.value = u.fade;
    this.compMat.uniforms.fadeColor.value.copy(u.fadeColor);
    this.pass(this.compMat, null);
  },
};

/* ============================== GAME_LOOP ================================ */
const GAME = {
  hasLantern: false, ended: false, running: false,
  fade: { amt: 1, mode: 'in', t: 0, color: new THREE.Color(0x000000) },
  threat: 0, threatSmooth: 0,
};

function buildWorld(ctx) {
  const { ctrl, rig, RM } = ctx;
  const world = {
    time: 0,
    rig,
    cam: ctx.camera,
    player: {
      get pos() { return ctrl.pos; }, get vel() { return ctrl.vel; },
      get moveMode() { return ctrl.moveMode; }, get hidden() { return ctrl.hidden; },
      get masked() { return ctrl.masked; }, get state() { return ctrl.state; },
      get lanternUp() { return ctrl.lanternUp && GAME.hasLantern; },
    },
    emitSound(pos, loudness) {
      for (const room of RM.builtRooms()) {
        for (const a of room.actors) if (a.hear) a.hear(pos, loudness);
      }
    },
    onEvent(type, pos, data) {
      AUDIO.event(type, pos, data, ctrl.pos);
      if (type === 'wardenLunge') rig.impact(0.45);
      if (type === 'land' && data > 0.7) rig.impact(0.2);
    },
    killPlayer(cause, catcher) {
      if (GAME.fade.mode === 'death' || GAME.fade.mode === 'caught' || GAME.ended) return;
      GAME.fade.t = 0;
      GAME.fade.color.set(0x000000);
      rig.impact(0.6);
      if (catcher && catcher.seize) {
        // a monster has her in hand — play the grab before the dark
        GAME.fade.mode = 'caught';
        GAME.caughtBy = catcher;
        catcher.seizing = true;
        catcher.state = 'seize';
        ctx.eight.capturedX = ctrl.pos.x;
        ctx.eight.capturedY = ctrl.pos.y;
        AUDIO.event('caught', ctrl.pos, 1, ctrl.pos);
      } else {
        GAME.fade.mode = 'death';
        AUDIO.event(cause === 'drown' ? 'drown' : 'caught', ctrl.pos, 1, ctrl.pos);
      }
    },
    giveLantern() {
      if (GAME.hasLantern) return;
      GAME.hasLantern = true;
      ctx.eight.j.lantern.visible = true;
      AUDIO.event('lanternPickup', ctrl.pos, 1, ctrl.pos);
    },
    startEnding() {
      if (GAME.ended) return;
      GAME.ended = 'walking';
      GAME.fade.mode = 'end'; GAME.fade.t = 0;
      GAME.fade.color.set(0xf5efdf);
    },
  };
  return world;
}

class RoomManager {
  constructor(scene) {
    this.scene = scene;
    this.offsets = [];
    let ox = 0;
    for (const def of ROOM_DEFS) { this.offsets.push(ox); ox += def.width; }
    this.totalWidth = ox;
    this.rooms = ROOM_DEFS.map((d, i) => new Room(d, i, this.offsets[i]));
    this.current = -1;
    this.checkpoint = { x: 2, y: 0.05, z: 0 };
  }
  indexAt(x) {
    for (let i = this.rooms.length - 1; i >= 0; i--) if (x >= this.offsets[i]) return i;
    return 0;
  }
  builtRooms() { return this.rooms.filter(r => r.built); }
  ensure(i) {
    for (let k = 0; k < this.rooms.length; k++) {
      const want = Math.abs(k - i) <= 1;
      if (want && !this.rooms[k].built) this.rooms[k].build(this.scene);
      else if (!want && this.rooms[k].built) this.rooms[k].dispose(this.scene);
    }
  }
  enter(i, rig, snap = false) {
    this.ensure(i);
    this.current = i;
    const def = ROOM_DEFS[i], ox = this.offsets[i];
    rig.setRoom(def.cam, [ox, ox + def.width], snap, def.floorY || 0);
    AUDIO.setAmbience(def.ambience);
    this.fogTarget = def.fogDensity ?? CONFIG.fog.density;
    this.exposureTarget = 4.2 * (def.exposure ?? 1);
    this.checkpoint = { x: ox + def.spawn.x, y: (def.floorY || 0) + 0.05, z: def.spawn.z };
    SAVE.data.room = i; SAVE.write();
  }
  update(playerX, rig) {
    const idx = this.indexAt(playerX);
    if (idx !== this.current) this.enter(idx, rig);
  }
  currentRoom() { return this.rooms[this.current]; }
}

function main() {
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  let pr = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NoToneMapping; // ACES happens in the composite pass

  buildMaterials();
  Input.init();
  SAVE.read();

  const scene = new THREE.Scene();
  scene.background = PAL.abyss.clone();
  scene.fog = new THREE.FogExp2(PAL.abyss.clone(), CONFIG.fog.density);

  const camera = new THREE.PerspectiveCamera(CONFIG.cam.fovBase, innerWidth / innerHeight, 0.08, 70);
  const eight = new Eight();
  scene.add(eight.root);
  const ctrl = new PlayerController(eight);
  const rig = new CameraRig(camera);
  const RM = new RoomManager(scene);
  POST.init(renderer, Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
  const world = buildWorld({ ctrl, rig, RM, eight, camera });

  function applyOpts() {
    const d = OPTS.data;
    pr = [0.7, 1.05, Math.min(window.devicePixelRatio || 1, 1.5)][d.quality];
    renderer.setPixelRatio(pr);
    renderer.setSize(innerWidth, innerHeight);
    POST.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
    const sm = [1024, 1536, 2048][d.quality];
    CONFIG.budget.shadowMap = sm;
    scene.traverse(o => {
      if (o.isLight && o.shadow) {
        o.shadow.mapSize.setScalar(sm);
        if (o.shadow.map) { o.shadow.map.dispose(); o.shadow.map = null; }
      }
    });
    rig.fovDelta = d.fov - CONFIG.cam.fovBase;
    GAME.brightness = d.bright / 100;
    if (AUDIO.ready) AUDIO.master.gain.value = 0.8 * d.vol / 100;
    POST.compMat.uniforms.grainAmt.value = d.quality === 0 ? 0.035 : 0.055;
  }
  OPTS.read();
  const bindOpt = (id, key, fmt) => {
    const el = document.getElementById('set' + id), val = document.getElementById('val' + id);
    if (!el) return;
    el.value = OPTS.data[key];
    const upd = () => { if (val) val.textContent = fmt(OPTS.data[key]); };
    upd();
    el.addEventListener('input', () => { OPTS.data[key] = +el.value; OPTS.write(); applyOpts(); upd(); });
    el.addEventListener('click', (e) => e.stopPropagation());
  };
  bindOpt('Quality', 'quality', v => ['LOW', 'MED', 'HIGH'][v]);
  bindOpt('Fov', 'fov', v => v + '\u00b0');
  bindOpt('Bright', 'bright', v => v + '%');
  bindOpt('Vol', 'vol', v => v + '%');
  applyOpts();

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    POST.setSize(Math.floor(innerWidth * pr), Math.floor(innerHeight * pr));
  });

  const tmpQ = new THREE.Quaternion();
  let last = performance.now();
  let started = false;

  function respawn() {
    const room = RM.currentRoom();
    if (room && room.built) { room.dispose(scene); room.build(scene); }
    const cp = RM.checkpoint;
    ctrl.reset(cp.x, cp.y, cp.z);
    eight.faceAngle = Math.PI / 2;
    eight.root.rotation.z = 0; // clear any grab tilt
    rig.setRoom(ROOM_DEFS[RM.current].cam, [RM.offsets[RM.current], RM.offsets[RM.current] + ROOM_DEFS[RM.current].width], true, ROOM_DEFS[RM.current].floorY || 0);
  }

  function frame(now) {
    if (!GAME.running) return;
    requestAnimationFrame(frame);
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); // never negative (rAF/perf.now skew)
    last = now;
    world.time += dt;
    const F = GAME.fade;

    if (GAME.ended === 'walking') {
      // she walks out into the light; the game lets her go
      ctrl.vel.x = damp(ctrl.vel.x, 0.9, 3, dt);
      ctrl.pos.x += ctrl.vel.x * dt;
      eight.pose({ state: 'ground', moveMode: 'walk', vel: ctrl.vel, grounded: true, speedNorm: 0.3, dt, time: world.time, lanternUp: false });
      F.t += dt;
      F.amt = smoothstep(0.5, 5.5, F.t);
      if (F.t > 7 && GAME.ended !== 'done') {
        GAME.ended = 'done';
        SAVE.data.room = 0; SAVE.write();
        const bootEl = document.getElementById('boot');
        document.getElementById('optContinue').style.display = 'none';
        bootEl.classList.remove('gone');
        GAME.running = false;
      }
    } else {
      // fades
      if (F.mode === 'caught') {
        F.t += dt;
        const catcher = GAME.caughtBy;
        if (catcher && catcher.seize && catcher.root && catcher.root.parent) catcher.seize(dt, eight, F.t, world);
        // watch the grab for 1.6s, then the world goes out
        if (F.t < 1.6) F.amt = 0;
        else if (F.t < 2.2) F.amt = (F.t - 1.6) / 0.6;
        else if (F.t < 2.7) F.amt = 1;
        else if (F.t < 3.2) F.amt = 1 - (F.t - 2.7) / 0.5;
        else { F.amt = 0; F.mode = 'none'; }
        if (F.t >= 2.25 && !F.respawned) {
          F.respawned = true;
          if (catcher) { catcher.seizing = false; catcher.state = catcher instanceof Warden ? 'patrol' : 'sweep'; }
          eight.root.rotation.z = 0; GAME.caughtBy = null;
          respawn();
        }
        if (F.mode === 'none') F.respawned = false;
      } else if (F.mode === 'death') {
        F.t += dt;
        const D = CONFIG.fade.death;
        if (F.t < D * 0.4) F.amt = F.t / (D * 0.4);
        else if (F.t < D * 0.6) { F.amt = 1; }
        else if (F.t < D) { F.amt = 1 - (F.t - D * 0.6) / (D * 0.4); }
        else { F.amt = 0; F.mode = 'none'; }
        if (F.t >= D * 0.4 && !F.respawned && F.t < D * 0.6) { F.respawned = true; respawn(); }
        if (F.mode === 'none') F.respawned = false;
      } else if (F.mode === 'in') {
        F.t += dt; F.amt = 1 - smoothstep(0, 1.6, F.t);
        if (F.amt <= 0) F.mode = 'none';
      }

      const controlLocked = F.mode === 'caught' || (F.mode === 'death' && F.t < CONFIG.fade.death * 0.6);
      RM.update(ctrl.pos.x, rig);
      const room = RM.currentRoom();
      if (!controlLocked && room && room.built) {
        ctrl.update(dt, room, world);
        // conveyor drift
        if (room.belts) {
          for (const b of room.belts) {
            if (b.speed !== 0 && ctrl.grounded &&
                ctrl.pos.x > b.x0 && ctrl.pos.x < b.x1 && ctrl.pos.z > b.z0 && ctrl.pos.z < b.z1 &&
                Math.abs(ctrl.pos.y - b.ytop) < 0.1) ctrl.pos.x += b.speed * dt;
            for (const m of room.movables) {
              if (b.speed !== 0 && m.pos.x + m.half.x > b.x0 && m.pos.x - m.half.x < b.x1 &&
                  m.pos.z > b.z0 && m.pos.z < b.z1 &&
                  Math.abs((m.pos.y - m.half.y) - b.ytop) < 0.12) m.pos.x += b.speed * dt;
            }
          }
        }
        // black water is not water at all
        if (room.waterY !== null && ctrl.pos.y < room.waterY - 0.28) world.killPlayer('drown');
      }
      for (const r of RM.builtRooms()) r.update(dt, world);

      // threat drives the breathing vignette + score
      let threat = 0;
      for (const r of RM.builtRooms()) {
        for (const a of r.actors) {
          if (a instanceof Warden) {
            if (a.frozen > 0) continue;
            if (a.state === 'hunt' || a.state === 'lunge') threat = Math.max(threat, 1);
            else if (a.state === 'investigate') threat = Math.max(threat, 0.4);
          } else if (a instanceof RendererTwin) {
            if (a.state === 'alert') threat = Math.max(threat, 0.85);
            else if (a.state === 'feel') threat = Math.max(threat, 0.55);
          } else if (a instanceof ChorusLine && a.blockTimer > 0.1) threat = Math.max(threat, 0.7);
        }
      }
      GAME.threat = threat;
      GAME.threatSmooth = damp(GAME.threatSmooth, threat, threat > GAME.threatSmooth ? 4 : 0.8, dt);
      rig.update(dt, ctrl, world);
      AUDIO.update(dt, GAME.threatSmooth, eight.exhaustion);
      // fog eases between rooms
      if (RM.fogTarget !== undefined) scene.fog.density = damp(scene.fog.density, RM.fogTarget, 1.2, dt);
      if (RM.exposureTarget) {
        const e = damp(POST.compMat.uniforms.exposure.value, RM.exposureTarget * (GAME.brightness || 1), 1.2, dt);
        POST.compMat.uniforms.exposure.value = e;
        POST.brightMat.uniforms.exposure.value = e;
      }
    }

    // lantern flame billboards to camera
    if (eight.flame.visible) {
      eight.flame.parent.getWorldQuaternion(tmpQ);
      eight.flame.quaternion.copy(tmpQ.invert()).multiply(camera.quaternion);
    }
    POST.render(scene, camera, {
      time: world.time,
      breath: GAME.threatSmooth * 0.85,
      fade: F.amt,
      fadeColor: F.color,
    });
    Input.clear();
  }

  function start(roomIdx) {
    if (started) return;
    started = true;
    GAME.hasLantern = roomIdx > 0;
    eight.j.lantern.visible = GAME.hasLantern;
    if (roomIdx === 0) eight.exhaustion = 1; // she wakes spent, where the tide left her
    AUDIO.init();
    applyOpts();
    RM.enter(roomIdx, rig, true);
    const cp = RM.checkpoint;
    ctrl.reset(cp.x, cp.y, cp.z);
    eight.faceAngle = Math.PI / 2;
    document.getElementById('boot').classList.add('gone');
    GAME.running = true;
    GAME.fade.mode = 'in'; GAME.fade.t = 0; GAME.fade.amt = 1;
    last = performance.now();
    requestAnimationFrame(frame);
  }

  // boot overlay
  const hasSave = SAVE.data.room > 0;
  if (hasSave) document.getElementById('optContinue').style.display = '';
  document.getElementById('optStart').addEventListener('click', (e) => {
    e.stopPropagation();
    SAVE.data.room = 0; SAVE.data.stubs = new Array(10).fill(false); SAVE.write();
    start(0);
  });
  document.getElementById('optContinue').addEventListener('click', (e) => {
    e.stopPropagation();
    start(SAVE.data.room);
  });
  return { renderer, scene, camera, eight, ctrl, rig, RM, world };
}


/* ============================== KEY ART ==================================
   The title painting — brushed in 2D canvas, same palette as the world.  */
function paintKeyArt() {
  const c = document.getElementById('keyart');
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const rand = mulberry32(808);
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#03050a'); sky.addColorStop(0.5, '#0a141d');
  sky.addColorStop(0.72, '#0e1c26'); sky.addColorStop(1, '#04070b');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // storm cloud masses
  for (let i = 0; i < 46; i++) {
    const x = rand() * W, y = rand() * H * 0.5, r = 60 + rand() * 200;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${12 + rand() * 14},${20 + rand() * 16},${26 + rand() * 16},${0.05 + rand() * 0.07})`);
    g.addColorStop(1, 'rgba(10,16,22,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  // a wound of moonlight in the overcast
  const moon = ctx.createRadialGradient(W * 0.24, H * 0.16, 0, W * 0.24, H * 0.16, 260);
  moon.addColorStop(0, 'rgba(170,195,210,0.14)'); moon.addColorStop(0.4, 'rgba(150,175,195,0.05)'); moon.addColorStop(1, 'rgba(150,175,195,0)');
  ctx.fillStyle = moon; ctx.fillRect(0, 0, W, H);
  // sea
  const seaY = H * 0.66;
  const sea = ctx.createLinearGradient(0, seaY, 0, H);
  sea.addColorStop(0, '#0a151c'); sea.addColorStop(0.4, '#060c11'); sea.addColorStop(1, '#030507');
  ctx.fillStyle = sea; ctx.fillRect(0, seaY, W, H - seaY);
  for (let i = 0; i < 90; i++) { // wave glints
    ctx.fillStyle = `rgba(120,150,165,${0.02 + rand() * 0.05})`;
    ctx.fillRect(rand() * W, seaY + rand() * (H - seaY) * 0.7, 20 + rand() * 90, 1 + rand());
  }
  // THE WORKS — silhouette stacked on the right
  ctx.fillStyle = '#020407';
  ctx.fillRect(W * 0.60, H * 0.30, W * 0.34, H * 0.42);
  ctx.fillRect(W * 0.68, H * 0.20, W * 0.14, H * 0.2);
  ctx.fillRect(W * 0.88, H * 0.10, W * 0.07, H * 0.62);
  ctx.beginPath(); // conveyor gantry running to the sea
  ctx.moveTo(W * 0.60, H * 0.46); ctx.lineTo(W * 0.40, H * 0.62); ctx.lineTo(W * 0.40, H * 0.66); ctx.lineTo(W * 0.60, H * 0.52);
  ctx.closePath(); ctx.fill();
  // lighthouse crown + beam
  ctx.fillRect(W * 0.905, H * 0.065, W * 0.04, H * 0.045);
  const bx = W * 0.925, by = H * 0.085;
  const beam = ctx.createLinearGradient(bx, by, W * 0.45, H * 0.30);
  beam.addColorStop(0, 'rgba(255,190,90,0.30)'); beam.addColorStop(1, 'rgba(255,190,90,0)');
  ctx.fillStyle = beam;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(W * 0.40, H * 0.22); ctx.lineTo(W * 0.40, H * 0.40); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,210,130,0.9)';
  ctx.beginPath(); ctx.arc(bx, by, 5, 0, 7); ctx.fill();
  // scattered tungsten windows
  for (let i = 0; i < 26; i++) {
    const wx = W * (0.61 + rand() * 0.32), wy = H * (0.14 + rand() * 0.52);
    ctx.fillStyle = `rgba(255,179,64,${0.25 + rand() * 0.5})`;
    ctx.fillRect(wx, wy, 3 + rand() * 4, 5 + rand() * 6);
  }
  // drowned hull ribs, foreground left
  ctx.strokeStyle = '#020305';
  ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    ctx.lineWidth = 16 + rand() * 14;
    ctx.beginPath();
    const rx = W * (0.03 + i * 0.065), sway = (rand() - 0.5) * 60;
    ctx.moveTo(rx, H * 0.98);
    ctx.quadraticCurveTo(rx + 60 + sway, H * 0.55, rx + 180 + sway, H * (0.26 + rand() * 0.1));
    ctx.stroke();
  }
  // beach
  const beach = ctx.createLinearGradient(0, H * 0.78, 0, H);
  beach.addColorStop(0, '#0a0d10'); beach.addColorStop(1, '#050708');
  ctx.fillStyle = beach;
  ctx.beginPath(); ctx.moveTo(0, H * 0.86); ctx.quadraticCurveTo(W * 0.4, H * 0.78, W, H * 0.84);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  // — Eight — small, ember-bright, walking toward the works
  const ex = W * 0.36, ey = H * 0.845;
  const pool = ctx.createRadialGradient(ex + 8, ey + 26, 0, ex + 8, ey + 26, 90);
  pool.addColorStop(0, 'rgba(255,185,90,0.30)'); pool.addColorStop(1, 'rgba(255,185,90,0)');
  ctx.fillStyle = pool; ctx.beginPath(); ctx.ellipse(ex + 8, ey + 26, 95, 34, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0c0d10'; // legs
  ctx.fillRect(ex - 5, ey - 2, 4, 22); ctx.fillRect(ex + 3, ey, 4, 20);
  const coat = ctx.createLinearGradient(ex, ey - 42, ex, ey);
  coat.addColorStop(0, '#e06020'); coat.addColorStop(1, '#7e3210');
  ctx.fillStyle = coat;
  ctx.beginPath(); // coat, flaring slightly at the hem
  ctx.moveTo(ex - 9, ey); ctx.quadraticCurveTo(ex - 12, ey - 30, ex - 4, ey - 40);
  ctx.quadraticCurveTo(ex + 1, ey - 47, ex + 7, ey - 39); // hood peak sweep
  ctx.quadraticCurveTo(ex + 13, ey - 30, ex + 10, ey);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#050406'; // the dark of the hood
  ctx.beginPath(); ctx.ellipse(ex + 3.5, ey - 36, 4.5, 5.5, -0.2, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,205,120,0.95)'; // the lantern
  ctx.beginPath(); ctx.arc(ex + 13, ey + 4, 3.4, 0, 7); ctx.fill();
  const lg = ctx.createRadialGradient(ex + 13, ey + 4, 0, ex + 13, ey + 4, 30);
  lg.addColorStop(0, 'rgba(255,190,95,0.5)'); lg.addColorStop(1, 'rgba(255,190,95,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(ex + 13, ey + 4, 30, 0, 7); ctx.fill();
  // rain
  ctx.strokeStyle = 'rgba(150,170,180,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 340; i++) {
    const x = rand() * W, y = rand() * H, len = 12 + rand() * 26;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len * 0.12, y + len); ctx.stroke();
  }
  // vignette + grain
  const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85);
  vig.addColorStop(0, 'rgba(2,3,5,0)'); vig.addColorStop(1, 'rgba(2,3,5,0.72)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) {
    ctx.fillStyle = `rgba(${rand() < 0.5 ? '255,255,255' : '0,0,0'},${0.015 + rand() * 0.03})`;
    ctx.fillRect(rand() * W, rand() * H, 1, 1);
  }
}

/* ============================== OPTIONS ================================== */
const OPTS = {
  key: 'hollow_tide_opts',
  data: { quality: 2, fov: 34, bright: 100, vol: 80 },
  read() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch (e) {}
    this.data.quality = clamp(this.data.quality | 0, 0, 2);
    this.data.fov = clamp(this.data.fov, 28, 50);
    this.data.bright = clamp(this.data.bright, 60, 150);
    this.data.vol = clamp(this.data.vol, 0, 100);
  },
  write() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
};

/* ============================== SELF_TEST ================================ */
async function runTests() {
  document.getElementById('boot').classList.add('gone');
  const results = [];
  const T = (name, fn) => {
    try {
      const v = fn();
      results.push({ name, pass: !!v, detail: v === true ? '' : String(v) });
    } catch (e) {
      results.push({ name, pass: false, detail: String(e && e.message || e) });
    }
  };

  T('three: revision is 160', () => THREE.REVISION === '160');
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.setSize(320, 200);
  T('renderer: creates', () => !!renderer);
  buildMaterials();
  for (const key of Object.keys(MAT)) {
    T(`material: ${key} valid`, () => MAT[key] && (MAT[key].isMaterial === true));
  }
  T('textures: hero maps are 1024', () =>
    ['wood', 'rust', 'conc', 'wax'].every(k => TexCache.get(k) && TexCache.get(k).image.width === 1024));

  // utils
  T('rng: mulberry32 deterministic', () => { const a = mulberry32(9)(), b = mulberry32(9)(); return Math.abs(a - b) < 1e-12; });
  T('noise: deterministic', () => NOISE(1.53, 2.71) === NOISE(1.53, 2.71));
  T('noise: bounded 0..1', () => { for (let i = 0; i < 200; i++) { const v = FBM(i * 0.37, i * 0.11); if (v < 0 || v > 1) return `out ${v}`; } return true; });

  // merge
  T('merge: vertex counts sum', () => {
    const a = new THREE.BoxGeometry(1, 1, 1), b = new THREE.SphereGeometry(1, 8, 6);
    const m = mergeGeometries([a, b]);
    return m.attributes.position.count === a.attributes.position.count + b.attributes.position.count;
  });
  T('merge: preserves index', () => {
    const a = new THREE.BoxGeometry(1, 1, 1), b = new THREE.BoxGeometry(2, 2, 2);
    const m = mergeGeometries([a, b]);
    return m.index !== null && m.index.count === a.index.count + b.index.count;
  });
  T('geo: displaceGeo recomputes normals', () => {
    const g = displaceGeo(new THREE.PlaneGeometry(1, 1, 4, 4), 5, 0.2, 2);
    return g.attributes.normal.count === g.attributes.position.count;
  });
  T('geo: lathe profiles have 64 radial segs', () => GF.jar(1).attributes.position.count > 64 * 20);

  // characters
  const fakeWorld = {
    time: 0.5,
    player: { pos: new THREE.Vector3(500, 0, 0), vel: new THREE.Vector3(), moveMode: 'walk', hidden: false, masked: false, state: 'ground', lanternUp: false },
    emitSound() {}, onEvent() {}, killPlayer() {}, rig: { pushIn() {}, hold() {}, impact() {} },
  };
  const eight = new Eight();
  T('eight: rig has 20+ joints', () => eight.boneCount >= 20 ? true : `got ${eight.boneCount}`);
  T('eight: 25+ sub-meshes', () => { let n = 0; eight.root.traverse(o => { if (o.isMesh) n++; }); return n >= 25 ? true : `got ${n}`; });
  T('eight: three coat panels', () => eight.j.coat.length === 3);
  T('eight: carries a real light', () => eight.lightL && eight.lightL.isPointLight === true);
  T('eight: pose executes', () => {
    eight.pose({ state: 'ground', moveMode: 'walk', vel: new THREE.Vector3(1, 0, 0), grounded: true, speedNorm: 0.5, dt: 0.016, time: 1, lanternUp: false });
    return true;
  });
  const warden = new Warden([{ x: 0, z: 0 }, { x: 5, z: 0 }], { bounds: [-5, 10] });
  T('warden: rig has 18+ joints', () => warden.boneCount >= 18 ? true : `got ${warden.boneCount}`);
  T('warden: 30+ sub-meshes', () => { let n = 0; warden.root.traverse(o => { if (o.isMesh) n++; }); return n >= 30 ? true : `got ${n}`; });
  T('warden: lamp-eye spotlight', () => warden.eyeLight.isSpotLight === true);
  T('warden: hears near sounds', () => warden.hear(new THREE.Vector3(2, 0, 0), 1.0) === true);
  T('warden: deaf to far sounds', () => { const w2 = new Warden([{ x: 0, z: 0 }], {}); return w2.hear(new THREE.Vector3(400, 0, 0), 0.3) === false; });
  T('warden: update ticks', () => { warden.update(0.016, fakeWorld); return true; });
  const twin = new RendererTwin([{ x: 0, z: 0 }, { x: 4, z: 0 }], { bounds: [-5, 10] });
  T('renderer twin: rig has 16+ joints', () => twin.boneCount >= 16 ? true : `got ${twin.boneCount}`);
  T('renderer twin: feels walking nearby', () => {
    twin.root.position.set(0, 0, 0);
    const w = { player: { pos: new THREE.Vector3(2, 0, 0), vel: new THREE.Vector3(1.7, 0, 0), moveMode: 'walk', hidden: false, masked: false, state: 'ground' } };
    return twin.senseVibration(w) === true;
  });
  T('renderer twin: cannot feel the airborne', () => {
    const w = { player: { pos: new THREE.Vector3(1, 0, 0), vel: new THREE.Vector3(2, 0, 0), moveMode: 'sprint', hidden: false, masked: false, state: 'air' } };
    return twin.senseVibration(w) === false;
  });
  T('renderer twin: update ticks', () => { twin.update(0.016, fakeWorld); return true; });
  const chorus = new ChorusLine([new THREE.Vector3(0, 0, 0), new THREE.Vector3(10, 0, 0), new THREE.Vector3(10, 0, 2)], 12);
  T('chorus: 12 instances', () => chorus.mesh.count === 12);
  T('chorus: path loops', () => chorus.posAt(chorus.totalLen + 1).distanceTo(chorus.posAt(1)) < 0.001);
  T('chorus: update ticks', () => { chorus.update(0.016, fakeWorld); return true; });
  const crabs = new CrabSwarm(6, { x0: 0, x1: 5, z0: -1, z1: 1, y: 0 });
  T('crabs: update ticks', () => { crabs.update(0.016, fakeWorld); return true; });

  // physics
  T('collider: bounds are centered', () => {
    const c = makeCollider(0, 0, 0, 2, 1, 2, 'wood');
    return c.min.x === -1 && c.max.x === 1 && c.min.y === 0 && c.max.y === 1;
  });
  T('aabb: overlap detects', () => {
    const a = makeCollider(0, 0, 0, 1, 1, 1), b = makeCollider(0.5, 0.5, 0, 1, 1, 1), c = makeCollider(5, 0, 0, 1, 1, 1);
    return aabbOverlap(a.min, a.max, b.min, b.max) === true && aabbOverlap(a.min, a.max, c.min, c.max) === false;
  });
  T('movable: settles on ground', () => {
    const m = new Movable(new THREE.Group(), 0.5, 0.5, 0.5, 0, 2, 0, {});
    const floor = [makeCollider(0, -1, 0, 10, 1, 10, 'wood')];
    for (let i = 0; i < 200; i++) m.update(0.016, floor);
    return Math.abs(m.pos.y - 0.25) < 0.02 ? true : `y=${m.pos.y.toFixed(3)}`;
  });

  // save
  T('save: roundtrip', () => {
    SAVE.data.room = 4; SAVE.data.stubs[2] = true; SAVE.write();
    SAVE.data.room = 0; SAVE.data.stubs[2] = false;
    SAVE.read();
    const ok = SAVE.data.room === 4 && SAVE.data.stubs[2] === true;
    SAVE.clear();
    return ok;
  });
  T('save: survives garbage', () => {
    localStorage.setItem(SAVE.key, '{oops');
    const ok = SAVE.read() === false;
    SAVE.clear();
    return ok;
  });

  // rooms — every one must build, populate, and dispose
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(PAL.abyss, 0.05);
  const RM = new RoomManager(scene);
  T('rooms: 13 defined', () => ROOM_DEFS.length === 13 ? true : `got ${ROOM_DEFS.length}`);
  T('rooms: offsets monotonic', () => RM.offsets.every((o, i) => i === 0 || o > RM.offsets[i - 1]));
  T('rooms: indexAt maps correctly', () => RM.indexAt(RM.offsets[3] + 1) === 3 && RM.indexAt(0) === 0);
  T('rooms: five acts covered', () => new Set(ROOM_DEFS.map(d => d.act)).size === 5);
  for (let i = 0; i < ROOM_DEFS.length; i++) {
    const def = ROOM_DEFS[i], room = RM.rooms[i];
    T(`room ${def.name}: builds`, () => { room.build(scene); return room.built === true; });
    T(`room ${def.name}: has colliders`, () => room.colliders.length >= 4 ? true : `got ${room.colliders.length}`);
    T(`room ${def.name}: is lit`, () => room.lights.length >= 1);
    T(`room ${def.name}: light budget ≤6`, () => room.lights.length <= 6 ? true : `got ${room.lights.length}`);
    T(`room ${def.name}: spawn inside`, () => def.spawn.x >= 0 && def.spawn.x <= def.width);
    T(`room ${def.name}: camera framed`, () => def.cam && def.cam.dist > 2);
    T(`room ${def.name}: updates`, () => {
      fakeWorld.time += 0.016;
      room.update(0.016, fakeWorld);
      return true;
    });
  }
  T('rooms: acts 2+5 field a Warden', () => {
    const salt = RM.rooms[4];
    return salt.actors.some(a => a instanceof Warden);
  });
  T('rooms: tallow works fields the twins', () => RM.rooms[8].actors.filter(a => a instanceof RendererTwin).length === 2);
  T('rooms: procession fields the chorus', () => RM.rooms[9].actors.some(a => a instanceof ChorusLine));
  // compile everything the GPU will ever see
  const cam = new THREE.PerspectiveCamera(34, 1.6, 0.08, 70);
  cam.position.set(RM.offsets[1] + 5, 1.2, 5);
  T('gpu: full scene compiles', () => { renderer.compile(scene, cam); return true; });
  T('gpu: renders a frame', () => { renderer.render(scene, cam); return true; });
  for (let i = 0; i < ROOM_DEFS.length; i++) {
    const room = RM.rooms[i];
    T(`room ${ROOM_DEFS[i].name}: disposes`, () => { room.dispose(scene); return room.built === false; });
  }
  T('rooms: rebuild after dispose', () => { RM.rooms[0].build(scene); const ok = RM.rooms[0].built; RM.rooms[0].dispose(scene); return ok; });

  // post + audio
  T('post: initializes', () => { POST.init(renderer, 320, 200); return !!POST.sceneRT; });
  T('post: bloom at half res', () => POST.brightRT.width === 160);
  T('post: composite renders', () => {
    POST.render(scene, cam, { time: 1, breath: 0.3, fade: 0.2, fadeColor: new THREE.Color(0x000000) });
    return true;
  });
  T('audio: safe before init', () => { AUDIO.burst({}); AUDIO.event('step', null, { surface: 'wood', mode: 'walk' }, null); return true; });
  T('audio: footstep surfaces covered', () =>
    ['wood', 'metal', 'stone', 'cloth', 'sand', 'water', 'flesh'].every(s => CONFIG.noise.surfaces[s] !== undefined));
  T('config: warden outruns her sprint', () => CONFIG.warden.huntSpeed > CONFIG.player.sprintSpeed);
  T('config: only two accent hues', () => {
    const p = CONFIG.palette;
    return p.ember.getHSL({}).s > 0.5 && p.tungsten.getHSL({}).s > 0.5 &&
           p.brine.getHSL({}).s < 0.55 && p.boneGrey.getHSL({}).s < 0.55;
  });

  const passed = results.filter(r => r.pass).length;
  console.table(results.map(r => ({ test: r.name, pass: r.pass ? '✓' : '✗ ' + r.detail })));
  console.log(`HOLLOW TIDE self-test: ${passed}/${results.length} passed`);
  window.__TEST_RESULTS = { passed, total: results.length, failures: results.filter(r => !r.pass) };
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.style.color = passed === results.length ? '#5a9a6a' : '#b05545';
  el.textContent = `self-test: ${passed}/${results.length} passed` +
    (passed === results.length ? '' : '\n' + results.filter(r => !r.pass).map(r => `✗ ${r.name}: ${r.detail}`).join('\n'));
}

/* ============================== ENTRY ==================================== */
paintKeyArt();
if (TEST_MODE) runTests();
else { window.__GAME = main(); window.__POST = POST; }
</script>
