    // crude stitches across the sternum, like the chest was packed and sewn
    for (let i = 0; i < 4; i++) {
      const st = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.09, 8), MAT.dark);
      st.position.set(-0.03 + i * 0.02, 0.56 - i * 0.09, 0.20);
      st.rotation.z = Math.PI / 2 + (i % 2 ? 0.3 : -0.3);
      j.spine.add(st);
    }
    // head: smooth, eyeless, a stitched seam where a face was meant to go
    j.neck = new THREE.Group(); j.neck.position.set(0, 0.95, 0.12); j.spine.add(j.neck);
    j.head = new THREE.Group(); j.neck.add(j.head);
    const headGeo = displaceGeo(new THREE.SphereGeometry(0.17, 96, 64), 63, 0.008, 6);
    headGeo.scale(0.85, 1.25, 1.0);
    const head = new THREE.Mesh(headGeo, MAT.wax);
    head.rotation.x = 0.35; j.head.add(head);
    const seam = new THREE.Mesh(new THREE.TorusGeometry(0.145, 0.008, 6, 48, Math.PI * 0.9), MAT.dark);
    seam.position.set(0, 0.02, 0.06); seam.rotation.set(0.2, Math.PI / 2, 0.4); j.head.add(seam);
    for (let i = 0; i < 6; i++) { // crude cross-stitches
      const st = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.05, 6), MAT.dark);
      const a = -0.5 + i * 0.22;
      st.position.set(Math.sin(a) * 0.02, 0.02 + Math.cos(a) * 0.14, 0.13 + Math.sin(a + 0.4) * 0.04);
      st.rotation.z = a + Math.PI / 2; st.rotation.x = 0.4;
      j.head.add(st);
    }
    this.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

    this.state = 'sweep';
    this.wpIndex = 0;
    this.phase = 0;
    this.feelTarget = null;
    this.feelT = 0;
    this.faceAngle = 0;
    this.stepEvent = false;
    this.twitchT = 0;
    this.boneCount = (() => { let n = 0; this.root.traverse(o => { if (o.isGroup) n++; }); return n; })();
  }
  senseVibration(world) {
    const player = world.player;
    if (player.state !== 'ground' || player.hidden || player.masked) return false;
    const speed = Math.hypot(player.vel.x, player.vel.z);
    if (speed < 0.05) return false;
    const F = CONFIG.renderer_.feelRadius;
    const r = player.moveMode === 'sprint' ? F.sprint : player.moveMode === 'sneak' ? F.sneak :
              player.moveMode === 'crawl' ? F.crawl : F.walk;
    const d = this.root.position.distanceTo(player.pos);
    return d < r;
  }
  update(dt, world) {
    const C = CONFIG.renderer_;
    const p = this.root.position;
    const player = world.player;
    this.stepEvent = false;
    this.twitchT -= dt;
    if (this.seizing) return;
    if (this.task && this.state === 'sweep') this.task(dt, world);

    if (this.senseVibration(world)) {
      this.feelTarget = player.pos.clone();
      this.feelT = 0;
      if (this.state !== 'alert') { this.state = 'alert'; world.onEvent('rendererAlert', p); }
    }

    let speed = 0, target = null;
    if (this.state === 'sweep') {
      const wp = this.waypoints[this.wpIndex];
      target = new THREE.Vector3(wp.x, 0, wp.z);
      speed = C.sweepSpeed;
      if (p.distanceTo(target) < 0.35) this.wpIndex = (this.wpIndex + 1) % this.waypoints.length;
    } else if (this.state === 'alert') {
      this.feelT += dt;
      target = this.feelTarget; speed = C.alertSpeed;
      if (target && p.distanceTo(target) < 0.5) { this.state = 'feel'; this.feelT = 0; }
      if (this.feelT > C.calm) this.state = 'sweep';
    } else if (this.state === 'feel') {
      this.feelT += dt; speed = 0;
      // pat the ground in widening arcs — lethal to stand near
      if (this.feelT > 2.6) this.state = 'sweep';
      if (!player.hidden && p.distanceTo(player.pos) < 1.15 && player.state === 'ground') world.killPlayer('renderer', this);
    }
    if (target && speed > 0) {
      const dir = new THREE.Vector3().subVectors(target, p); dir.y = 0;
      const dist = dir.length();
      if (dist > 0.05) {
        dir.normalize();
        p.addScaledVector(dir, Math.min(speed, dist / dt) * dt);
        if (this.opts.bounds) p.x = clamp(p.x, this.opts.bounds[0], this.opts.bounds[1]);
        p.z = clamp(p.z, -1.9, 1.9);
        const ta = Math.atan2(dir.x, dir.z);
        let dd = ta - this.faceAngle;
        while (dd > Math.PI) dd -= Math.PI * 2; while (dd < -Math.PI) dd += Math.PI * 2;
        this.faceAngle += dd * Math.min(1, dt * (this.state === 'alert' ? 9 : 4));
        const prev = this.phase;
        this.phase += speed * dt * (this.state === 'alert' ? 2.6 : 1.7);
        if (Math.floor(this.phase / Math.PI) !== Math.floor(prev / Math.PI)) {
          this.stepEvent = true;
          world.onEvent('rendererStep', p, this.state === 'alert' ? 1 : 0.5);
        }
      }
    }
    // touch kill
    if (!player.hidden && p.distanceTo(player.pos) < C.grabRange && player.state === 'ground') world.killPlayer('renderer', this);
    this.root.rotation.y = this.faceAngle;
    this.poseBody(dt, world.time);
  }
  poseBody(dt, t) {
    const j = this.j, ph = this.phase;
    const k = Math.min(1, dt * 9);
    const alert = this.state === 'alert';
    const feeling = this.state === 'feel';
    const sway = Math.sin(ph);
    j.pelvis.position.y = lerp(j.pelvis.position.y, (alert ? 1.02 : 1.28) + Math.abs(Math.cos(ph)) * 0.05, k);
    j.spine.rotation.x = lerp(j.spine.rotation.x, alert ? 1.05 : feeling ? 1.25 : 0.5, k);
    j.legL.hip.rotation.x = lerp(j.legL.hip.rotation.x, sway * (alert ? 0.9 : 0.45), k);
    j.legR.hip.rotation.x = lerp(j.legR.hip.rotation.x, -sway * (alert ? 0.9 : 0.45), k);
    j.legL.knee.rotation.x = lerp(j.legL.knee.rotation.x, Math.max(0, -sway) * 1.0, k);
    j.legR.knee.rotation.x = lerp(j.legR.knee.rotation.x, Math.max(0, sway) * 1.0, k);
    if (feeling) {
      // frantic ground-patting
      const pat = Math.sin(t * 9);
      j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, -1.6 + pat * 0.5, k * 1.6);
      j.armR.sh.rotation.x = lerp(j.armR.sh.rotation.x, -1.6 - pat * 0.5, k * 1.6);
      j.armL.sh.rotation.z = lerp(j.armL.sh.rotation.z, 0.7 + Math.sin(t * 4.7) * 0.5, k);
      j.armR.sh.rotation.z = lerp(j.armR.sh.rotation.z, -0.7 - Math.cos(t * 5.3) * 0.5, k);
    } else if (alert) {
      j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, -1.9 + sway * 0.7, k);
      j.armR.sh.rotation.x = lerp(j.armR.sh.rotation.x, -1.9 - sway * 0.7, k);
      j.armL.sh.rotation.z = lerp(j.armL.sh.rotation.z, 0.25, k);
      j.armR.sh.rotation.z = lerp(j.armR.sh.rotation.z, -0.25, k);
    } else {
      // sweeping the walls and air, reading the room with fingertips
      j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, -1.1 + Math.sin(t * 1.3) * 0.4, k);
      j.armR.sh.rotation.x = lerp(j.armR.sh.rotation.x, -1.1 + Math.cos(t * 1.1) * 0.4, k);
      j.armL.sh.rotation.z = lerp(j.armL.sh.rotation.z, 0.5 + Math.sin(t * 0.9) * 0.3, k);
      j.armR.sh.rotation.z = lerp(j.armR.sh.rotation.z, -0.5 - Math.cos(t * 0.8) * 0.3, k);
    }
    j.armL.el.rotation.x = lerp(j.armL.el.rotation.x, -0.35, k);
    j.armR.el.rotation.x = lerp(j.armR.el.rotation.x, -0.35, k);
    // head twitch — reads horrifyingly wrong on a faceless thing
    if (this.twitchT <= 0 && Math.random() < 0.01) this.twitchT = 0.14;
    const twitch = this.twitchT > 0 ? (Math.random() - 0.5) * 0.9 : 0;
    j.head.rotation.z = lerp(j.head.rotation.z, twitch + Math.sin(t * 0.7) * 0.12, this.twitchT > 0 ? 0.8 : k * 0.5);
    j.head.rotation.y = lerp(j.head.rotation.y, Math.sin(t * 0.43) * 0.5, k * 0.4);
  }
  /* Blind, it clutches her up to the seam where its face should be, and listens. */
  seize(dt, eight, t, world) {
    const j = this.j, k = Math.min(1, dt * 10), p = this.root.position;
    const side = (eight.capturedX ?? eight.root.position.x) >= p.x ? 1 : -1;
    this.faceAngle = damp(this.faceAngle, side > 0 ? Math.PI / 2 : -Math.PI / 2, 9, dt);
    this.root.rotation.y = this.faceAngle;
    const clutch = smoothstep(0, 0.45, t);
    const raise = smoothstep(0.5, 1.35, t);
    j.spine.rotation.x = lerp(j.spine.rotation.x, 1.15 - raise * 0.7, k);
    j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, lerp(-0.3, -1.9, raise), k);
    j.armR.sh.rotation.x = lerp(j.armR.sh.rotation.x, lerp(-0.3, -1.9, raise), k);
    j.armL.sh.rotation.z = lerp(j.armL.sh.rotation.z, 0.6 - clutch * 0.3, k);
    j.armR.sh.rotation.z = lerp(j.armR.sh.rotation.z, -0.6 + clutch * 0.3, k);
    j.armL.el.rotation.x = lerp(j.armL.el.rotation.x, -1.5, k);
    j.armR.el.rotation.x = lerp(j.armR.el.rotation.x, -1.5, k);
    j.head.rotation.x = lerp(j.head.rotation.x, 0.6 - raise * 0.75, k);
    j.head.rotation.z = Math.sin(t * 7) * 0.25; // it turns her, feeling what it caught
    const groundY = eight.capturedY ?? 0.05;
    eight.root.position.x = damp(eight.root.position.x, p.x + side * lerp(0.6, 0.34, raise), 10, dt);
    eight.root.position.y = damp(eight.root.position.y, groundY + raise * 1.55, 10, dt); // up to the faceless head
    eight.root.position.z = damp(eight.root.position.z, p.z + 0.3, 8, dt);
    eight.root.rotation.z = damp(eight.root.rotation.z, -side * 0.5, 6, dt);
    eight.j.legL.hip.rotation.x = Math.sin(t * 12) * 0.5 * (1 - raise * 0.7);
    eight.j.legR.hip.rotation.x = -Math.sin(t * 12) * 0.5 * (1 - raise * 0.7);
    this.poseBody(dt, world.time);
  }
  dispose() { this.root.traverse(o => { if (o.isMesh) o.geometry.dispose(); }); }
}

/* --- The Chorus — grey processions. Break the line and be taken. --- */
class ChorusLine {
  constructor(path, count = 16, opts = {}) {
    this.path = path;             // array of Vector3, walked in order, looped
    this.count = count;
    this.opts = opts;
    // precompute path length table
    this.segs = [];
    let total = 0;
    for (let i = 0; i < path.length; i++) {
      const a = path[i], b = path[(i + 1) % path.length];
      const len = a.distanceTo(b);
      this.segs.push({ a, b, len, start: total });
      total += len;
    }
    this.totalLen = total;
    const bodyParts = [];
    const bodyPts = [];
    for (let i = 0; i <= 30; i++) {
      const t = i / 30;
      const r = lerp(0.34, 0.1, Math.pow(t, 0.8)) * (1 + 0.05 * Math.sin(t * 18));
      bodyPts.push([r, t * 0.78]);
    }
    bodyParts.push(latheProfile(bodyPts, 32));
    const headG = new THREE.SphereGeometry(0.115, 24, 18);
    headG.scale(0.9, 1.15, 0.95);
    bodyParts.push(xformGeo(headG, 0, 0.78, 0.1, 0.85, 0, 0)); // bowed head
    bodyParts.push(xformGeo(new THREE.CylinderGeometry(0.035, 0.03, 0.4, 12), -0.18, 0.42, 0.14, 0.6, 0, 0.5));
    bodyParts.push(xformGeo(new THREE.CylinderGeometry(0.035, 0.03, 0.4, 12), 0.18, 0.42, 0.14, 0.6, 0, -0.5));
    bodyParts.push(xformGeo(new THREE.TorusGeometry(0.3, 0.02, 6, 24), 0, 0.34, 0, Math.PI / 2)); // rope belt
    const geo = mergeGeometries(bodyParts);
    displaceGeo(geo, 71, 0.02, 4);
    this.mesh = new THREE.InstancedMesh(geo, MAT.sack, count);
    this.mesh.castShadow = true; this.mesh.receiveShadow = true;
    this.root = new THREE.Group(); this.root.add(this.mesh);
    this.dummy = new THREE.Object3D();
    this.dists = [];
    this.phases = [];
    for (let i = 0; i < count; i++) {
      this.dists.push((i / count) * total);
      this.phases.push(i * 1.7);
    }
    this.speed = opts.speed || 0.5;
    this.blockTimer = 0;
    this.seizing = -1;
  }
  posAt(dist) {
    dist = ((dist % this.totalLen) + this.totalLen) % this.totalLen;
    for (const s of this.segs) {
      if (dist <= s.start + s.len) {
        const t = (dist - s.start) / s.len;
        return new THREE.Vector3().lerpVectors(s.a, s.b, t);
      }
    }
    return this.segs[0].a.clone();
  }
  update(dt, world) {
    const player = world.player;
    let blockedAny = false;
    for (let i = 0; i < this.count; i++) {
      const cur = this.posAt(this.dists[i]);
      const ahead = this.posAt(this.dists[i] + 0.55);
      // does the small orange thing block the road ahead
      const blocked = player.state === 'ground' &&
        Math.abs(player.pos.y - cur.y) < 0.5 &&
        new THREE.Vector2(player.pos.x - ahead.x, player.pos.z - ahead.z).length() < 0.38;
      if (blocked) {
        blockedAny = true;
        if (this.seizing < 0) this.seizing = i;
      } else {
        this.dists[i] += this.speed * dt;
      }
      this.phases[i] += dt * (blocked ? 9 : 3.1);
      const next = this.posAt(this.dists[i] + 0.1);
      this.dummy.position.copy(cur);
      this.dummy.position.y += Math.abs(Math.sin(this.phases[i])) * 0.03;
      this.dummy.rotation.set(0, Math.atan2(next.x - cur.x, next.z - cur.z), Math.sin(this.phases[i]) * 0.05);
      if (this.seizing === i && blockedAny) {
        // rears up before it takes her
        this.dummy.rotation.x = -0.6 - Math.min(0.6, this.blockTimer);
        this.dummy.position.y += this.blockTimer * 0.12;
      }
      this.dummy.updateMatrix();
      this.mesh.setMatrixAt(i, this.dummy.matrix);
    }
    if (blockedAny) {
      this.blockTimer += dt;
      if (this.blockTimer > 0.35) world.onEvent('chorusAngry', player.pos);
      if (this.blockTimer > 1.15) world.killPlayer('chorus');
    } else { this.blockTimer = 0; this.seizing = -1; }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  dispose() { this.mesh.geometry.dispose(); }
}

/* --- crab-things: harmless punctuation for the beach --- */
class CrabSwarm {
  constructor(count, area) {
    this.area = area; this.count = count;
    const parts = [];
    const shell = displaceGeo(new THREE.SphereGeometry(0.05, 20, 14), 81, 0.012, 12);
    shell.scale(1.25, 0.55, 1);
    parts.push(shell);
    for (let l = 0; l < 6; l++) {
      const a = (l < 3 ? -1 : 1);
      const off = (l % 3) * 0.03 - 0.03;
      parts.push(xformGeo(new THREE.CylinderGeometry(0.005, 0.003, 0.07, 6), off, -0.015, a * 0.05, a * 1.15, 0, (l % 3 - 1) * 0.4));
    }
    const geo = mergeGeometries(parts);
    this.mesh = new THREE.InstancedMesh(geo, MAT.dark, count);
    this.mesh.castShadow = true;
    this.root = new THREE.Group(); this.root.add(this.mesh);
    this.dummy = new THREE.Object3D();
    const rand = mulberry32(area.seed || 5);
    this.crabs = [];
    for (let i = 0; i < count; i++) {
      this.crabs.push({
        x: lerp(area.x0, area.x1, rand()), z: lerp(area.z0, area.z1, rand()),
        tx: 0, tz: 0, retarget: 0, jitter: rand() * 10,
      });
    }
  }
  update(dt, world) {
    const pp = world.player.pos;
    for (let i = 0; i < this.count; i++) {
      const c = this.crabs[i];
      c.retarget -= dt;
      const dx = c.x - pp.x, dz = c.z - pp.z;
      const dp = Math.hypot(dx, dz);
      if (dp < 0.9) { c.tx = c.x + (dx / dp) * 1.5; c.tz = c.z + (dz / dp) * 1.5; c.retarget = 0.6; }
      else if (c.retarget <= 0) {
        c.tx = lerp(this.area.x0, this.area.x1, Math.random());
        c.tz = lerp(this.area.z0, this.area.z1, Math.random());
        c.retarget = 2 + Math.random() * 4;
      }
      const mx = c.tx - c.x, mz = c.tz - c.z, md = Math.hypot(mx, mz);
      if (md > 0.05) {
        const sp = dp < 0.9 ? 1.4 : 0.35;
        c.x += (mx / md) * sp * dt; c.z += (mz / md) * sp * dt;
      }
      this.dummy.position.set(c.x, this.area.y + Math.abs(Math.sin(world.time * 22 + c.jitter)) * 0.006, c.z);
      this.dummy.rotation.y = Math.atan2(mx, mz) + Math.PI / 2;
      this.dummy.updateMatrix();
      this.mesh.setMatrixAt(i, this.dummy.matrix);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
  dispose() { this.mesh.geometry.dispose(); }
}

/* ============================== INPUT ==================================== */
const Input = {
  down: {}, pressed: {},
  init() {
    addEventListener('keydown', (e) => {
      if (e.repeat) return;
      this.down[e.code] = true; this.pressed[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', (e) => { this.down[e.code] = false; });
    addEventListener('blur', () => { this.down = {}; });
  },
  axisX() { return (this.down.KeyD || this.down.ArrowRight ? 1 : 0) - (this.down.KeyA || this.down.ArrowLeft ? 1 : 0); },
  axisZ() { return (this.down.KeyS || this.down.ArrowDown ? 1 : 0) - (this.down.KeyW || this.down.ArrowUp ? 1 : 0); },
  sprint() { return !!(this.down.ShiftLeft || this.down.ShiftRight); },
  sneak() { return !!(this.down.KeyC || this.down.ControlLeft); },
  jumpPressed() { return !!this.pressed.Space; },
  grab() { return !!this.down.KeyE; },
  grabPressed() { return !!this.pressed.KeyE; },
  lantern() { return !!this.down.KeyQ; },
  clear() { this.pressed = {}; },
};

/* ============================== PHYSICS ================================== */
function aabbOverlap(aMin, aMax, bMin, bMax) {
  return aMin.x < bMax.x && aMax.x > bMin.x && aMin.y < bMax.y && aMax.y > bMin.y && aMin.z < bMax.z && aMax.z > bMin.z;
}
function makeCollider(x, y, z, w, h, d, surface = 'wood') {
  return {
    min: new THREE.Vector3(x - w / 2, y, z - d / 2),
    max: new THREE.Vector3(x + w / 2, y + h, z + d / 2),
    surface,
  };
}

/* A movable prop: crate, can, key… draggable, kickable, stand-on-able. */
class Movable {
  constructor(mesh, w, h, d, x, y, z, opts = {}) {
    this.mesh = mesh;
    this.half = new THREE.Vector3(w / 2, h / 2, d / 2);
    this.pos = new THREE.Vector3(x, y + h / 2, z); // center
    this.vel = new THREE.Vector3();
    this.mass = opts.mass ?? 1;
    this.surface = opts.surface || 'wood';
    this.kickable = opts.kickable ?? (this.mass < 0.5);
    this.grounded = false;
    this.dragged = false;
    this.landEvent = 0;
  }
  get colMin() { return new THREE.Vector3().subVectors(this.pos, this.half); }
  get colMax() { return new THREE.Vector3().addVectors(this.pos, this.half); }
  asCollider() { return { min: this.colMin, max: this.colMax, surface: this.surface, movable: this }; }
  // snap to the highest floor directly beneath the spawn, so it starts at rest
  settle(statics) {
    let bestTop = -Infinity;
    for (const c of statics) {
      if (this.pos.x > c.min.x && this.pos.x < c.max.x && this.pos.z > c.min.z && this.pos.z < c.max.z &&
          c.max.y <= this.pos.y + this.half.y + 0.05 && c.max.y > bestTop) bestTop = c.max.y;
    }
    if (bestTop > -Infinity) {
      this.pos.y = bestTop + this.half.y;
      this.vel.set(0, 0, 0); this.grounded = true;
      this.mesh.position.copy(this.pos);
      this.mesh.position.y = this.pos.y - this.half.y;
    }
  }
  update(dt, statics) {
    this.landEvent = 0;
    if (!this.dragged) {
      this.vel.x *= Math.pow(0.02, dt); this.vel.z *= Math.pow(0.02, dt);
    }
    this.vel.y -= CONFIG.player.gravity * dt;
    const wasAirborne = !this.grounded;
    // integrate + resolve per axis against statics
    for (const axis of ['x', 'z', 'y']) {
      const prevBottom = this.pos.y - this.half.y; // for swept-floor catch
      this.pos[axis] += this.vel[axis] * dt;
      const mn = this.colMin, mx = this.colMax;
      for (const c of statics) {
        // swept catch: bottom passed through a collider's top this frame (no tunneling)
        if (axis === 'y' && this.vel.y < 0 && prevBottom >= c.max.y - 0.02 && this.pos.y - this.half.y < c.max.y &&
            mx.x > c.min.x && mn.x < c.max.x && mx.z > c.min.z && mn.z < c.max.z) {
          this.pos.y = c.max.y + this.half.y;
          if (wasAirborne && this.vel.y < -1.4) this.landEvent = Math.min(1, -this.vel.y / 5);
          this.vel.y = 0; this.grounded = true;
          mn.copy(this.colMin); mx.copy(this.colMax);
          continue;
        }
        if (!aabbOverlap(mn, mx, c.min, c.max)) continue;
        if (axis === 'y') {
          if (this.vel.y <= 0 && this.pos.y > (c.min.y + c.max.y) / 2) {
            this.pos.y = c.max.y + this.half.y;
            if (wasAirborne && this.vel.y < -1.4) this.landEvent = Math.min(1, -this.vel.y / 5);
            this.vel.y = 0; this.grounded = true;
          } else if (this.vel.y > 0) { this.pos.y = c.min.y - this.half.y; this.vel.y = 0; }
        } else {
          const dir = this.vel[axis] > 0 ? 1 : -1;
          if (dir > 0) this.pos[axis] = c.min[axis] - this.half[axis]; else this.pos[axis] = c.max[axis] + this.half[axis];
          this.vel[axis] = 0;
        }
        mn.copy(this.colMin); mx.copy(this.colMax);
      }
    }
    if (this.vel.y !== 0) this.grounded = false;
    this.mesh.position.copy(this.pos);
    this.mesh.position.y = this.pos.y - this.half.y; // meshes are origin-at-base
  }
}

/* The character controller — everything Eight can physically do. */
class PlayerController {
  constructor(eight) {
    this.e = eight;
    this.pos = eight.root.position;
    this.vel = new THREE.Vector3();
    this.state = 'ground';       // ground | air | hang | mantle | climb | swing | dead
    this.moveMode = 'walk';      // idle | walk | sprint | sneak | crawl
    this.grounded = false;
    this.groundSurface = 'wood';
    this.fallStart = 0;
    this.hang = null;            // {x, y, z, nx} ledge info
    this.mantleT = 0;
    this.climb = null;           // climbable ref
    this.climbPhase = 0;
    this.swing = null;           // {pivot, len, theta, thetaV}
    this.dragging = null;        // Movable
    this.dragOffset = new THREE.Vector3();
    this.noise = 0;              // current emitted loudness 0..1+
    this.hidden = false;
    this.masked = false;         // steam-masked from Renderers
    this.lanternUp = false;
    this.coyote = 0;
    this.time = 0;
  }
  reset(x, y, z) {
    this.pos.set(x, y, z);
    this.vel.set(0, 0, 0);
    this.state = 'ground'; this.moveMode = 'idle';
    this.dragging = null; this.swing = null; this.climb = null; this.hang = null;
  }
  update(dt, room, world) {
    this.time += dt;
    const P = CONFIG.player;
    this.noise = 0;
    const colliders = room.activeColliders();

    // --- lantern ---
    this.lanternUp = Input.lantern() && this.state === 'ground';
    if (this.lanternUp) this.noise = Math.max(this.noise, CONFIG.noise.lanternRaise * 0.3);

    if (this.state === 'mantle') {
      this.mantleT += dt / 0.42;
      const h = this.hang;
      if (this.mantleT >= 1) {
        this.pos.set(h.x + h.nx * 0.16, h.y + 0.01, h.z);
        this.state = 'ground'; this.vel.set(0, 0, 0);
      } else {
        const t = this.mantleT;
        this.pos.y = lerp(h.y - 0.5, h.y + 0.01, smoothstep(0, 0.7, t));
        this.pos.x = lerp(h.x - h.nx * 0.13, h.x + h.nx * 0.16, smoothstep(0.35, 1, t));
      }
      this.poseCtx(dt, world);
      return;
    }
    if (this.state === 'hang') {
      const h = this.hang;
      this.vel.set(0, 0, 0);
      this.pos.x = h.x - h.nx * 0.13; this.pos.y = h.y - 0.5; this.pos.z = h.z;
      if (Input.jumpPressed() || Input.axisZ() < -0.5 || (h.nx > 0 ? Input.axisX() > 0.5 : Input.axisX() < -0.5)) {
        this.state = 'mantle'; this.mantleT = 0;
      } else if (Input.axisZ() > 0.5) { this.state = 'air'; this.hang = null; this.fallStart = this.pos.y; }
      this.poseCtx(dt, world);
      return;
    }
    if (this.state === 'climb') {
      const c = this.climb;
      const dy = -Input.axisZ() * 0.85 * dt;
      this.pos.y = clamp(this.pos.y + dy, c.yBottom, c.yTop - 0.5);
      if (Math.abs(dy) > 0.0001) this.climbPhase += dy * 14;
      this.pos.x = damp(this.pos.x, c.x, 12, dt);
      this.pos.z = damp(this.pos.z, c.z, 12, dt);
      this.vel.set(0, 0, 0);
      this.noise = 0.1;
      if (Input.jumpPressed()) {
        this.state = 'air'; this.climb = null;
        this.vel.set(Input.axisX() * 1.4, 2.2, Input.axisZ() * 1.2);
        this.fallStart = this.pos.y;
      } else if (this.pos.y <= c.yBottom + 0.01 && Input.axisZ() > 0.5) {
        this.state = 'ground'; this.climb = null;
      }
      this.poseCtx(dt, world);
      return;
    }
    if (this.state === 'swing') {
      const s = this.swing;
      const g = P.gravity;
      s.thetaV += (-(g / s.len) * Math.sin(s.theta) - s.thetaV * 0.22 + Input.axisX() * 1.7 * Math.cos(s.theta)) * dt;
      s.theta += s.thetaV * dt;
      this.pos.x = s.pivot.x + Math.sin(s.theta) * s.len;
      this.pos.y = s.pivot.y - Math.cos(s.theta) * s.len - 0.5;
      this.pos.z = damp(this.pos.z, s.pivot.z, 8, dt);
      if (Input.jumpPressed()) {
        this.state = 'air'; this.swing = null;
        this.vel.set(s.thetaV * s.len * Math.cos(s.theta) * 1.15, s.thetaV * s.len * Math.sin(s.theta) + 1.3, 0);
        this.fallStart = this.pos.y;
        world.onEvent('swingRelease', this.pos);
      }
      this.poseCtx(dt, world);
      return;
    }

    // --- ground / air movement ---
    const ix = Input.axisX(), iz = Input.axisZ();
    const moving = ix !== 0 || iz !== 0;
    const crawlForced = this.checkLowCeiling(colliders);
    const wantCrouch = Input.sneak();
    if (crawlForced) this.moveMode = 'crawl';
    else if (wantCrouch) this.moveMode = moving ? 'sneak' : 'crouch'; // crouch holds even while still
    else if (!moving) this.moveMode = 'idle';
    else if (Input.sprint() && this.e.exhaustion < 0.98) this.moveMode = 'sprint';
    else this.moveMode = 'walk';

    let speed = this.moveMode === 'sprint' ? P.sprintSpeed : this.moveMode === 'sneak' ? P.sneakSpeed :
                this.moveMode === 'crawl' ? P.crawlSpeed : this.moveMode === 'crouch' ? 0 : P.walkSpeed;
    if (this.dragging) speed *= P.dragFactor / Math.max(1, this.dragging.mass * 0.55);

    const accel = this.grounded ? P.accel : P.airAccel;
    const len = Math.hypot(ix, iz) || 1;
    this.vel.x = damp(this.vel.x, (ix / len) * speed, accel, dt);
    this.vel.z = damp(this.vel.z, (iz / len) * speed, accel, dt);

    // jump
    this.coyote = this.grounded ? 0.12 : Math.max(0, this.coyote - dt);
    if (Input.jumpPressed() && this.coyote > 0 && !this.dragging && this.moveMode !== 'crawl') {
      this.vel.y = P.jumpVel;
      this.grounded = false; this.coyote = 0;
      this.state = 'air'; this.fallStart = this.pos.y;
      world.emitSound(this.pos, 0.25 * CONFIG.noise.surfaces[this.groundSurface]);
    }
    this.vel.y -= P.gravity * dt;

    // integrate & resolve
    const wasGrounded = this.grounded;
    this.moveAndCollide(dt, colliders, world);
    this.pos.z = clamp(this.pos.z, room.zMin ?? P.zMin, room.zMax ?? P.zMax);

    if (this.grounded) {
      if (this.state === 'air' && !wasGrounded) {
        const fall = this.fallStart - this.pos.y;
        if (fall > 0.5) {
          const loud = clamp(fall / 2.4, 0.2, 1) * CONFIG.noise.surfaces[this.groundSurface];
          world.emitSound(this.pos, CONFIG.noise.land * loud);
          world.onEvent('land', this.pos, clamp(fall / 2.4, 0.2, 1));
        }
      }
      this.state = 'ground';
    } else if (this.state === 'ground') {
      this.state = 'air'; this.fallStart = this.pos.y;
    }

    // ledge grab
    if (this.state === 'air' && this.vel.y < 0.4 && !this.dragging) this.tryLedgeGrab(colliders);

    // hook catch
    if (this.state === 'air' && room.hooks) {
      for (const hk of room.hooks) {
        const bx = hk.pivot.x, by = hk.pivot.y - hk.len, bz = hk.pivot.z;
        if (Math.abs(this.pos.x - bx) < 0.45 && Math.abs(this.pos.z - bz) < 0.6 &&
            this.pos.y + 0.55 > by - 0.32 && this.pos.y + 0.55 < by + 0.42) {
          this.state = 'swing';
          this.swing = { pivot: hk.pivot, len: hk.len, theta: clamp((this.pos.x - bx) / hk.len, -0.6, 0.6), thetaV: this.vel.x / hk.len };
          world.onEvent('hookCatch', this.pos);
          break;
        }
      }
    }

    // movement noise
    if (this.grounded && Math.hypot(this.vel.x, this.vel.z) > 0.15) {
      const base = CONFIG.noise[this.moveMode === 'idle' ? 'sneak' : this.moveMode] ?? CONFIG.noise.walk;
      this.noise = Math.max(this.noise, base * (CONFIG.noise.surfaces[this.groundSurface] ?? 1));
      if (this.dragging) this.noise = Math.max(this.noise, CONFIG.noise.drag);
    }
    if (this.noise > 0.02) world.emitSound(this.pos, this.noise, true);

    // --- interactions (E) ---
    this.handleInteract(dt, room, world, colliders);

    // hide zones
    this.hidden = false;
    for (const hz of room.hideZones || []) {
      if (this.pos.x > hz.min.x && this.pos.x < hz.max.x && this.pos.y >= hz.min.y - 0.05 &&
          this.pos.y < hz.max.y && this.pos.z > hz.min.z && this.pos.z < hz.max.z &&
          this.moveMode !== 'sprint') { this.hidden = true; break; }
    }
    this.masked = false;
    for (const mz of room.maskZones || []) {
      if (this.pos.x > mz.min.x && this.pos.x < mz.max.x && this.pos.z > mz.min.z && this.pos.z < mz.max.z) { this.masked = true; break; }
    }

    this.poseCtx(dt, world);
  }
  moveAndCollide(dt, colliders, world) {
    const P = CONFIG.player;
    const r = P.radius, h = this.moveMode === 'crawl' ? 0.26 : P.height;
    const min = new THREE.Vector3(), max = new THREE.Vector3();
    const setBox = () => { min.set(this.pos.x - r, this.pos.y, this.pos.z - r); max.set(this.pos.x + r, this.pos.y + h, this.pos.z + r); };
    let landed = false;
    for (const axis of ['x', 'z', 'y']) {
      this.pos[axis] += this.vel[axis] * dt;
      setBox();
      for (const c of colliders) {
        if (!aabbOverlap(min, max, c.min, c.max)) continue;
        if (axis === 'y') {
          if (this.vel.y <= 0 && this.pos.y >= c.max.y - 0.32) {
            this.pos.y = c.max.y; this.vel.y = 0; landed = true;
            this.groundSurface = c.surface;
          } else if (this.vel.y > 0 && this.pos.y < c.min.y) {
            this.pos.y = c.min.y - h; this.vel.y = Math.min(0, this.vel.y);
          }
        } else {
          // step-up assist
          const stepSpace = c.max.y - this.pos.y;
          if (stepSpace > 0 && stepSpace <= P.stepUp + 0.02 && this.vel.y <= 0.01) {
            const liftedMin = min.clone(), liftedMax = max.clone();
            liftedMin.y = c.max.y + 0.01; liftedMax.y = c.max.y + 0.01 + h;
            let clear = true;
            for (const c2 of colliders) if (aabbOverlap(liftedMin, liftedMax, c2.min, c2.max)) { clear = false; break; }
            if (clear) { this.pos.y = c.max.y + 0.005; setBox(); continue; }
          }
          // kick light movables
          if (c.movable && c.movable.kickable && !c.movable.dragged) {
            const kick = Math.sign(this.vel[axis]) * Math.max(0.8, Math.abs(this.vel[axis]) * 1.4);
            c.movable.vel[axis] = kick;
            world.emitSound(this.pos, 0.55 * (CONFIG.noise.surfaces[c.movable.surface] ?? 1));
            world.onEvent('kick', this.pos, 0.7);
            continue;
          }
          if (this.vel[axis] > 0) this.pos[axis] = c.min[axis] - r; else this.pos[axis] = c.max[axis] + r;
          this.vel[axis] = 0;
        }
        setBox();
      }
    }
    this.grounded = landed;
  }
  checkLowCeiling(colliders) {
    const r = CONFIG.player.radius;
    const min = new THREE.Vector3(this.pos.x - r, this.pos.y + 0.28, this.pos.z - r);
    const max = new THREE.Vector3(this.pos.x + r, this.pos.y + CONFIG.player.height + 0.02, this.pos.z + r);
    for (const c of colliders) if (aabbOverlap(min, max, c.min, c.max)) return true;
    return false;
  }
  tryLedgeGrab(colliders) {
    const P = CONFIG.player;
    const dirx = Math.sin(this.e.faceAngle);
    if (Math.abs(dirx) < 0.5) return;
    const nx = Math.sign(dirx);
    const handX = this.pos.x + nx * (P.radius + 0.06);
    for (const c of colliders) {
      const top = c.max.y;
      if (top < this.pos.y + P.ledgeReachLo || top > this.pos.y + P.ledgeReachHi) continue;
      if (this.pos.z < c.min.z - 0.1 || this.pos.z > c.max.z + 0.1) continue;
      const face = nx > 0 ? c.min.x : c.max.x;
      if (Math.abs(handX - face) > 0.24) continue;
      if (nx > 0 && this.pos.x > face) continue;
      if (nx < 0 && this.pos.x < face) continue;
      // headroom above the ledge
      const hMin = new THREE.Vector3(face + (nx > 0 ? 0.02 : -0.3), top + 0.05, this.pos.z - 0.1);
      const hMax = new THREE.Vector3(face + (nx > 0 ? 0.3 : -0.02), top + 0.5, this.pos.z + 0.1);
      let clear = true;
      for (const c2 of colliders) if (aabbOverlap(hMin, hMax, c2.min, c2.max)) { clear = false; break; }
      if (!clear) continue;
      this.hang = { x: face, y: top, z: this.pos.z, nx };
      this.state = 'hang'; this.vel.set(0, 0, 0);
      return;
    }
  }
  handleInteract(dt, room, world, colliders) {
    // release drag
    if (this.dragging && (!Input.grab() || this.state !== 'ground')) {
      this.dragging.dragged = false; this.dragging = null;
    }
    if (this.dragging) {
      const m = this.dragging;
      const targetX = this.pos.x + this.dragOffset.x, targetZ = this.pos.z + this.dragOffset.z;
      m.vel.x = (targetX - m.pos.x) / Math.max(dt, 0.008);
      m.vel.z = (targetZ - m.pos.z) / Math.max(dt, 0.008);
      const cap = 3.2;
      m.vel.x = clamp(m.vel.x, -cap, cap); m.vel.z = clamp(m.vel.z, -cap, cap);
    }
    if (!Input.grabPressed()) return;
    // 1. interactables (levers, stubs, valves…)
    for (const it of room.interactables || []) {
      if (it.used && !it.repeat) continue;
      if (this.pos.distanceTo(it.pos) < (it.radius || 0.55)) { it.onUse(world); it.used = true; return; }
    }
    // 2. climbables
    for (const cl of room.climbables || []) {
      if (Math.abs(this.pos.x - cl.x) < 0.28 && Math.abs(this.pos.z - cl.z) < 0.35 &&
          this.pos.y > cl.yBottom - 0.4 && this.pos.y < cl.yTop) {
        this.state = 'climb'; this.climb = cl; this.vel.set(0, 0, 0);
        this.pos.y = Math.max(this.pos.y, cl.yBottom);
        return;
      }
    }
    // 3. movables → drag
    if (this.state === 'ground' && !this.dragging) {
      for (const m of room.movables || []) {
        const dx = Math.abs(this.pos.x - m.pos.x) - m.half.x, dz = Math.abs(this.pos.z - m.pos.z) - m.half.z;
        const dy = this.pos.y - (m.pos.y - m.half.y);
        if (dx < 0.22 && dz < 0.22 && Math.abs(dy) < 0.4) {
          this.dragging = m; m.dragged = true;
          this.dragOffset.set(m.pos.x - this.pos.x, 0, m.pos.z - this.pos.z);
          return;
        }
      }
    }
  }
  poseCtx(dt, world) {
    this.e.pose({
      state: this.state, moveMode: this.moveMode, vel: this.vel, grounded: this.grounded,
      speedNorm: clamp(Math.hypot(this.vel.x, this.vel.z) / CONFIG.player.sprintSpeed, 0, 1),
      mantleT: this.mantleT, climbPhase: this.climbPhase,
      swingLean: this.swing ? this.swing.theta * 0.8 : 0,
      dragging: !!this.dragging, lanternUp: this.lanternUp,
      dt, time: world.time,
    });
    if (this.e.stepEvent && this.grounded) world.onEvent('step', this.pos, { surface: this.groundSurface, mode: this.moveMode });
  }
}

/* ============================== CAMERA =================================== */
class CameraRig {
  constructor(camera) {
    this.cam = camera;
    this.conf = { dist: 4.2, height: 1.1, lookY: 0.55, dutch: 0, yFollow: 0.25, fov: CONFIG.cam.fovBase };
    this.bounds = [0, 100];
    this.x = 0; this.y = 0;
    this.pushT = 0; this.pushAmt = 0; this.pushDur = 1;
    this.holdT = 0; this.holdPos = null;
    this.shake = 0;
  }
  setRoom(conf, bounds, snap = false, floorY = 0) {
    this.conf = Object.assign({ dist: 4.2, height: 1.1, lookY: 0.55, dutch: 0, yFollow: 0.25, fov: CONFIG.cam.fovBase }, conf);
    this.bounds = bounds;
    this.floorY = floorY;
    if (snap) { this.x = null; }
  }
  pushIn(amount = 1.2, duration = 2.2) { this.pushT = duration; this.pushAmt = amount; this.pushDur = duration; }
  hold(seconds = 1.5) { this.holdT = seconds; }
  impact(a = 0.5) { this.shake = Math.min(1, this.shake + a); }
  update(dt, player, world) {
    const c = this.conf;
    const D = c.dist * 1.3;
    const margin = D * 0.75;
    const tx = clamp(player.pos.x, this.bounds[0] + margin, this.bounds[1] - margin);
    const fy = this.floorY || 0;
    const ty = fy + (player.pos.y - fy) * c.yFollow;
    if (this.x === null) { this.x = tx; this.y = ty; }
    if (this.holdT > 0) { this.holdT -= dt; }
    else {
      this.x = damp(this.x, tx, CONFIG.cam.damp, dt);
      this.y = damp(this.y, ty, CONFIG.cam.damp * 0.8, dt);
    }
    // parallax drift from depth position
    const pz = clamp(player.pos.z / 2.2, -1, 1);
    const parY = pz * CONFIG.cam.parallax * 0.45;
    const parZ = pz * CONFIG.cam.parallax;
    let dist = D + parZ;
    if (this.pushT > 0) {
      this.pushT -= dt;
      const t = 1 - this.pushT / this.pushDur;
      dist -= this.pushAmt * Math.sin(Math.min(1, t * 1.15) * Math.PI * 0.5);
    }
    this.shake = Math.max(0, this.shake - dt * 2.2);
    const sh = this.shake * this.shake;
    const shx = (NOISE(world.time * 31, 3.7) - 0.5) * 0.14 * sh;
    const shy = (NOISE(world.time * 29, 9.1) - 0.5) * 0.12 * sh;
    this.cam.position.set(this.x + shx, c.height + this.y + parY + shy, dist);
    this.cam.lookAt(this.x + shx, c.lookY + this.y + parY * 0.4 + shy, 0);
    this.cam.rotation.z += c.dutch;
    const fovTarget = (c.fov || CONFIG.cam.fovBase) + (this.fovDelta || 0);
    if (Math.abs(this.cam.fov - fovTarget) > 0.01) {
      this.cam.fov = damp(this.cam.fov, fovTarget, 2, dt);
      this.cam.updateProjectionMatrix();
    }
  }
}

/* ============================== FX ======================================= */
/* A hanging work lamp: cord, shade, bulb, visible cone, dust motes, floor
   glow decal and a real shadow-casting spotlight. The signature light. */
class Lamp {
  constructor(x, y, z, { cordLen = 1.2, intensity = 26, angle = 0.62, flicker = 0, shadow = false, swing = 0, floorY = 0 } = {}) {
    this.group = new THREE.Group();
    this.group.position.set(x, y, z);
    this.flicker = flicker;
    this.swing = swing;
    this.baseIntensity = intensity * 3.2;
    this.pivot = new THREE.Group();
    this.group.add(this.pivot);
    const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, cordLen, 8), MAT.dark);
    cord.position.y = -cordLen / 2; this.pivot.add(cord);
    this.headG = new THREE.Group(); this.headG.position.y = -cordLen; this.pivot.add(this.headG);
    const shade = new THREE.Mesh(GF.lampShade(0.85), MAT.metalDark);
    this.headG.add(shade);
    const bulb = new THREE.Mesh(GF.bulb(0.62), MAT.bulb);
    bulb.position.y = -0.42; this.headG.add(bulb);
    this.light = new THREE.SpotLight(new THREE.Color(0xffb340), intensity * 3.2, Math.max(6, y * 3), angle, 0.55, 1.6);
    this.light.position.y = -0.3;
    this.lightTarget = new THREE.Object3D(); this.lightTarget.position.y = -5;
    this.headG.add(this.light, this.lightTarget);
    this.light.target = this.lightTarget;
    if (shadow) {
      this.light.castShadow = true;
      this.light.shadow.mapSize.setScalar(CONFIG.budget.shadowMap);
      this.light.shadow.bias = -0.0012;
      this.light.shadow.camera.near = 0.3; this.light.shadow.camera.far = Math.max(8, y * 2.4);
    }
    const coneH = y - cordLen - 0.35 - floorY;
    if (coneH > 0.5) {
      const coneR = Math.tan(angle) * coneH * 0.52;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(coneR, coneH, 48, 1, true), MAT.lightCone);
      cone.position.y = -0.35 - coneH / 2;
      this.headG.add(cone);
      // dust motes inside the beam
      const dustCount = 44;
      const dpos = new Float32Array(dustCount * 3);
      const rand = mulberry32((x * 100 + z) | 0);
      for (let i = 0; i < dustCount; i++) {
        const t = rand();
        const rr = rand() * coneR * t;
        const a = rand() * Math.PI * 2;
        dpos[i * 3] = Math.cos(a) * rr; dpos[i * 3 + 1] = -0.35 - t * coneH; dpos[i * 3 + 2] = Math.sin(a) * rr;
      }
      const dgeo = new THREE.BufferGeometry();
      dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
      this.dust = new THREE.Points(dgeo, MAT.dust);
      this.headG.add(this.dust);
      // wet-floor reflection fake: mirrored dim glow decal
      this.decal = new THREE.Mesh(new THREE.PlaneGeometry(coneR * 2.6, coneR * 3.6), MAT.glowDecal.clone());
      this.decal.material.opacity = 0.16;
      this.decal.rotation.x = -Math.PI / 2;
      this.decal.position.set(x, floorY + 0.012, z);
    }
    this.seed = (x * 7.3 + z * 3.1) % 10;
  }
  update(dt, t) {
    let f = 1;
    if (this.flicker > 0) {
      f = 1 - this.flicker * (0.5 + 0.5 * Math.sin(t * 9 + this.seed)) * smoothstep(0.55, 0.95, NOISE(t * 2.2 + this.seed, 4.4));
    }
    this.light.intensity = this.baseIntensity * f * (0.96 + 0.04 * Math.sin(t * 13 + this.seed));
    if (this.decal) this.decal.material.opacity = 0.16 * f;
    if (this.swing > 0) {
      this.pivot.rotation.z = Math.sin(t * 0.9 + this.seed) * 0.05 * this.swing;
      this.pivot.rotation.x = Math.cos(t * 0.7 + this.seed) * 0.04 * this.swing;
    }
  }
}

class RainFX {
  constructor(x0, x1, y, count = 700) {
    const pos = new Float32Array(count * 3);
    const rand = mulberry32(11);
    this.spans = { x0, x1, y };
    for (let i = 0; i < count; i++) {
      pos[i * 3] = lerp(x0, x1, rand());
      pos[i * 3 + 1] = rand() * y;
      pos[i * 3 + 2] = lerp(-3, 3, rand());
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    this.pts = new THREE.Points(geo, MAT.rain);
    this.count = count;
    this.speed = 9;
  }
  update(dt) {
    const p = this.pts.geometry.attributes.position;
    for (let i = 0; i < this.count; i++) {
      let y = p.getY(i) - this.speed * dt * (0.8 + (i % 5) * 0.09);
      if (y < 0) y = this.spans.y * (0.9 + Math.random() * 0.1);
      p.setY(i, y);
    }
    p.needsUpdate = true;
  }
}

class SteamFX {
  constructor(x, z, h = 2.4, count = 60) {
    const pos = new Float32Array(count * 3);
    const rand = mulberry32((x * 13) | 0);
    this.base = { x, z, h };
    this.life = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      this.life[i] = rand();
      pos[i * 3] = x; pos[i * 3 + 1] = this.life[i] * h; pos[i * 3 + 2] = z;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    this.pts = new THREE.Points(geo, new THREE.PointsMaterial({
      color: new THREE.Color(0x8a949a), size: 0.14, transparent: true, opacity: 0.16,
      blending: THREE.NormalBlending, depthWrite: false, sizeAttenuation: true,
    }));
    this.count = count;
  }
  update(dt, t) {
    const p = this.pts.geometry.attributes.position;
    for (let i = 0; i < this.count; i++) {
      this.life[i] += dt * 0.45;
      if (this.life[i] > 1) this.life[i] = 0;
      const l = this.life[i];
      p.setXYZ(i,
        this.base.x + Math.sin(l * 9 + i) * 0.16 * l + NOISE(t * 0.4 + i, l * 3) * 0.3 * l,
        l * this.base.h,
        this.base.z + Math.cos(l * 7 + i * 2) * 0.14 * l);
    }
    p.needsUpdate = true;
    this.pts.material.opacity = 0.13 + 0.05 * Math.sin(t * 2.1 + this.base.x);
  }
}

/* ============================== ROOMS ==================================== */
class Room {
  constructor(def, index, ox) {
    this.def = def; this.index = index; this.ox = ox;
    this.built = false;
  }
  build(scene) {
    if (this.built) return;
    this.group = new THREE.Group();
    this.group.name = 'room_' + this.def.name;
    this.colliders = [];
    this.movables = [];
    this.billboards = [];
    this.climbables = [];
    this.hooks = [];
    this.hideZones = [];
    this.maskZones = [];
    this.interactables = [];
    this.actors = [];
    this.lamps = [];
    this.fx = [];
    this.updaters = [];
    this.lights = [];
    this.disposables = [];
    this.zMin = this.def.zMin; this.zMax = this.def.zMax;
    this.waterY = null;
    this.B = new Batcher();
    this.def.build(this);
    this.B.build(this.group);
    for (const m of this.movables) m.settle(this.colliders); // seat props on their floor, no spawn drop
    scene.add(this.group);
    this.built = true;
  }
  /* ---- builder helpers (local x coordinates; ox added here) ---- */
  batch(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
    this.B.add(geo, mat, x + this.ox, y, z, rx, ry, rz, sx, sy, sz);
  }
  solid(x, y, z, w, h, d, surface = 'wood') {
    const c = makeCollider(x + this.ox, y, z, w, h, d, surface);
    this.colliders.push(c);
    return c;
  }
  box(mat, x, y, z, w, h, d, surface = 'wood', segs = 2) {
    const g = scaleUV(new THREE.BoxGeometry(w, h, d, segs, segs, segs), Math.max(w, h, d) / 2.4);
    this.batch(g, mat, x, y + h / 2, z);
    return this.solid(x, y, z, w, h, d, surface);
  }
  floorBoards(x, y, w, d, surface = 'wood', mat = MAT.woodWet) {
    this.batch(GF.floorBoards(w, d, 0.5, 5 + this.index * 3), mat, x, y - 0.03, 0);
    return this.solid(x, y - 0.2, 0, w, 0.2, d, surface);
  }
  wallSlab(x, y, z, w, h, seed, mat = MAT.brick, thick = 0.3) {
    this.batch(GF.wallSlab(w, h, seed, 0.05, thick), mat, x, y + h / 2, z);
  }
  /* doorway wall: perpendicular to x-axis, with an opening */
  doorWall(x, { doorW = 1.6, doorH = 1.4, wallH = 7, depth = 6.5, mat = MAT.brick, surface = 'stone' } = {}) {
    const t = 0.5;
    // lintel above the door
    this.batch(scaleUV(new THREE.BoxGeometry(t, wallH - doorH, depth, 1, 3, 3), depth / 2.6, (wallH - doorH) / 2.6), mat, x, doorH + (wallH - doorH) / 2, 0);
    this.solid(x, doorH, 0, t, wallH - doorH, depth, surface);
    // z-side jambs
    const sideD = (depth - doorW) / 2;
    if (sideD > 0.05) {
      for (const s of [-1, 1]) {
        const zc = s * (doorW / 2 + sideD / 2);
        this.batch(scaleUV(new THREE.BoxGeometry(t, doorH, sideD, 1, 2, 2), sideD / 2.6, doorH / 2.6), mat, x, doorH / 2, zc);
        this.solid(x, 0, zc, t, doorH, sideD, surface);
      }
    }
  }
  lamp(x, y, z, opts = {}) {
    const l = new Lamp(x + this.ox, y, z, Object.assign({ floorY: this.def.floorY || 0 }, opts));
    this.group.add(l.group);
    if (l.decal) this.group.add(l.decal);
    this.lamps.push(l);
    this.lights.push(l.light);
    return l;
  }
  moon(intensity = 2.2) {
    const d = new THREE.DirectionalLight(new THREE.Color(0x44586a), intensity * 6);
    d.position.set(this.ox + this.def.width / 2 - 10, 14, -8);
    this.group.add(d, d.target);
    d.target.position.set(this.ox + this.def.width / 2, 0, 0);
    this.lights.push(d);
    return d;
  }
  ambient(color = 0x16222a, intensity = 0.5, groundColor = 0x0a0c0e) {
    const h = new THREE.HemisphereLight(new THREE.Color(color), new THREE.Color(groundColor), intensity * 14);
    this.group.add(h);
    this.lights.push(h);
    return h;
  }
  movable(kind, x, y, z, opts = {}) {
    let mesh, w, h, d;
    const m2_billboards = this.billboards;
    if (kind === 'crate') {
      w = opts.w || 0.5; h = opts.h || 0.5; d = opts.d || 0.5;
      mesh = new THREE.Mesh(GF.crate(w, h, d, 6 + x | 0), opts.mat || MAT.wood);
      opts.mass = opts.mass ?? 1.2;
      // a rope girdle is the only tell — no glow, read it by its lashings
      const rope = new THREE.Mesh(new THREE.TorusGeometry(w * 0.74, 0.018, 10, 48), MAT.sack);
      rope.position.y = h * 0.52;
      mesh.add(rope);
      const rope2 = new THREE.Mesh(new THREE.TorusGeometry(w * 0.74, 0.018, 10, 48), MAT.sack);
      rope2.position.y = h * 0.52; rope2.rotation.y = Math.PI / 2;
      mesh.add(rope2);
    } else if (kind === 'can') {
      const r = opts.r || 0.13; h = opts.h || 0.34; w = d = r * 2;
      mesh = new THREE.Mesh(GF.can(r, h), MAT.rust);
      opts.mass = opts.mass ?? 0.25; opts.surface = 'metal';
    } else if (kind === 'key') {
      w = 0.5; h = 0.16; d = 0.1;
      const parts = [
        xformGeo(new THREE.TorusGeometry(0.09, 0.025, 12, 32), -0.18, 0.08, 0),
        xformGeo(new THREE.CylinderGeometry(0.022, 0.022, 0.34, 16), 0.02, 0.08, 0, 0, 0, Math.PI / 2),
        xformGeo(new THREE.BoxGeometry(0.05, 0.09, 0.03), 0.16, 0.045, 0),
        xformGeo(new THREE.BoxGeometry(0.04, 0.07, 0.03), 0.09, 0.05, 0),
      ];
      mesh = new THREE.Mesh(mergeGeometries(parts), MAT.rust);
      opts.mass = opts.mass ?? 2.6; opts.surface = 'metal'; opts.kickable = false;
    } else { // plain block
      w = opts.w || 0.4; h = opts.h || 0.4; d = opts.d || 0.4;
      mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d, 2, 2, 2), opts.mat || MAT.woodDark);
    }
    mesh.geometry.translate(0, h / 2, 0);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.position.set(x + this.ox, y, z);
    this.group.add(mesh);
    const m = new Movable(mesh, w, h, d, x + this.ox, y, z, opts);
    m.kind = kind;
    this.movables.push(m);
    this.disposables.push(mesh.geometry);
    return m;
  }
  chain(x, yTop, yBottom, z = 0) {
    const links = Math.ceil((yTop - yBottom) / 0.155);
    const mesh = new THREE.Mesh(GF.chainLinks(links, 0.05, 0.014), MAT.metalDark);
    mesh.position.set(x + this.ox, yTop, z);
    mesh.castShadow = true;
    this.group.add(mesh);
    this.disposables.push(mesh.geometry);
    this.climbables.push({ x: x + this.ox, z, yTop: yTop - 0.1, yBottom: Math.max(0, yBottom) });
    return mesh;
  }
  hook(x, y, z, rodLen = 1.1) {
    const g = new THREE.Group();
    g.position.set(x + this.ox, y, z);
    const links = Math.ceil(rodLen / 0.155);
    const chain = new THREE.Mesh(GF.chainLinks(links, 0.05, 0.014), MAT.metalDark);
    g.add(chain);
    const hookM = new THREE.Mesh(GF.hook(1.4), MAT.rust);
    hookM.position.y = -rodLen + 0.15;
    g.add(hookM);
    g.traverse(o => { if (o.isMesh) o.castShadow = true; });
    this.group.add(g);
    this.hooks.push({ pivot: new THREE.Vector3(x + this.ox, y, z), len: rodLen + 0.55, mesh: g });
    return g;
  }
  hideZone(x, y, z, w, h, d) {
    this.hideZones.push(makeCollider(x + this.ox, y, z, w, h, d));
  }
  maskZone(x, y, z, w, h, d) {
    this.maskZones.push(makeCollider(x + this.ox, y, z, w, h, d));
  }
  interact(x, y, z, onUse, opts = {}) {
    const it = { pos: new THREE.Vector3(x + this.ox, y, z), onUse, radius: opts.radius || 0.55, repeat: opts.repeat, used: false };
    this.interactables.push(it);
    return it;
  }
  stub(x, y, z, id) {
    if (SAVE.data.stubs[id]) return;
    const parts = [
      xformGeo(new THREE.TorusGeometry(0.035, 0.016, 12, 24), 0, 0.115, 0),
      xformGeo(new THREE.TorusGeometry(0.028, 0.015, 12, 24), 0, 0.05, 0),
    ];
    const mesh = new THREE.Mesh(mergeGeometries(parts), MAT.emberStub);
    mesh.position.set(x + this.ox, y, z);
    this.group.add(mesh);
    this.disposables.push(mesh.geometry);
    const baseY = y;
    this.updaters.push((dt, world) => {
      mesh.position.y = baseY + Math.sin(world.time * 1.7 + x) * 0.012;
      mesh.rotation.y += dt * 0.8;
    });
    this.interact(x, y, z, (world) => {
      SAVE.data.stubs[id] = true; SAVE.write();
      mesh.visible = false;
      world.onEvent('stub', mesh.position);
    }, { radius: 0.45 });
  }
  water(x, w, y = -0.05, deadly = true) {
    const geo = new THREE.PlaneGeometry(w, 8, 1, 1);
    const mat = MAT.water.clone();
    mat.bumpMap = canvasTexture('waterB', 512, (c, s) => paintHeightFromFBM(c, s, 314, 8, 1.6), { linear: true });
    mat.bumpScale = 0.06;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(x + this.ox, y, 0);
    this.group.add(mesh);
    this.disposables.push(geo, mat);
    this.updaters.push((dt, world) => {
      mat.bumpMap.offset.x = world.time * 0.018;
      mat.bumpMap.offset.y = Math.sin(world.time * 0.12) * 0.06;
      mesh.position.y = y + Math.sin(world.time * 0.5) * 0.012;
    });
    if (deadly) this.waterY = y;
    return mesh;
  }
  actor(a) {
    this.actors.push(a);
    this.group.add(a.root);
    return a;
  }
  onUpdate(fn) { this.updaters.push(fn); }
  activeColliders() {
    const list = this.colliders.slice();
    for (const m of this.movables) if (!m.dragged || true) list.push(m.asCollider());
    if (this._extraColliders) list.push(...this._extraColliders);
    return list;
  }
  update(dt, world) {
    for (const l of this.lamps) l.update(dt, world.time);
    for (const m of this.movables) {
      m.update(dt, this.colliders);
      if (m.landEvent > 0) {
        world.emitSound(m.pos, m.landEvent * (CONFIG.noise.surfaces[m.surface] ?? 1) * 0.8);
        world.onEvent('thud', m.pos, m.landEvent);
      }
    }
    for (const a of this.actors) a.update(dt, world);
    for (const f of this.fx) f.update(dt, world.time);
    for (const u of this.updaters) u(dt, world);
    if (this.billboards.length && world.cam) {
      for (const b of this.billboards) b.quaternion.copy(world.cam.quaternion);
    }
  }
  dispose(scene) {
    if (!this.built) return;
    scene.remove(this.group);
    this.group.traverse(o => {
      if (o.isMesh || o.isPoints) {
        if (o.geometry) o.geometry.dispose();
      }
    });
    for (const d of this.disposables) if (d && d.dispose) d.dispose();
    for (const a of this.actors) if (a.dispose) a.dispose();
    this.built = false;
    this.group = null;
  }
}

/* ============================== SAVE ===================================== */
const SAVE = {
  key: 'hollow_tide_save_v1',
  data: { room: 0, stubs: new Array(10).fill(false) },
  read() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) {
        const d = JSON.parse(raw);
        if (typeof d.room === 'number' && Array.isArray(d.stubs)) {
          this.data.room = clamp(d.room, 0, 12);
          this.data.stubs = d.stubs.slice(0, 10).concat(new Array(Math.max(0, 10 - d.stubs.length)).fill(false));
          return true;
        }
      }
    } catch (e) { /* corrupted save — start fresh */ }
    return false;
  },
  write() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
  clear() { try { localStorage.removeItem(this.key); } catch (e) {} this.data = { room: 0, stubs: new Array(10).fill(false) }; },
};

    R.batch(new THREE.BoxGeometry(6, 12, 6), MAT.voidBlack, 12, 5, -13);
    for (let i = 0; i < 12; i++) {

      const disp = new THREE.Group();
      const cageParts = [
        xformGeo(new THREE.TorusGeometry(0.028, 0.004, 8, 32), 0, 0.075, 0, Math.PI / 2),

        xformGeo(new THREE.CylinderGeometry(0.0028, 0.0028, 0.075, 8), -0.026, 0.0375, 0),

      const dispGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 1.1), MAT.glowDecal.clone());

      disp.add(dispGlow);

      R.group.add(disp);
      R.disposables.push(disp.children[0].geometry, dispFlame.geometry, dispGlow.geometry, dispGlow.material);

    R.doorWall(30, { doorW: 3.4, doorH: 1.9, wallH: 9, mat: MAT.woodDark, surface: 'wood' });

    const spillGlow = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 4.4), MAT.glowDecal.clone());
    spillGlow.material.opacity = 0.2;
    spillGlow.rotation.x = -Math.PI / 2;

    R.group.add(spillGlow); R.disposables.push(spillGlow.geometry, spillGlow.material);

    R.onUpdate((dt, world) => {
      if (!woke) { woke = true; world.rig.pushIn(1.4, 4.2); world.rig.hold(1.8); }
    });
  },
});
