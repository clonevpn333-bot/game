<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>HOLLOW TIDE</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#04060a; }
  #game { display:block; width:100%; height:100%; }
  #boot {
    position:fixed; inset:0; background:#04060a; z-index:10;
    font-family:Georgia, 'Times New Roman', serif; color:#8a97a0;
    transition:opacity 2.2s ease; user-select:none;
  }
  #keyart { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #shade { position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 42%, rgba(4,6,10,0.18) 0%, rgba(4,6,10,0.55) 62%, rgba(4,6,10,0.88) 100%); }
  #bootInner {
    position:relative; z-index:1; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-shadow:0 2px 20px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.8);
  }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot h1 {
    font-size:clamp(28px, 6vw, 64px); font-weight:normal; letter-spacing:0.55em;
    margin:0 0 0.4em 0.55em; color:#c9d4da; text-shadow:0 0 24px rgba(255,179,64,0.12);
  }
  #boot .sub { font-size:12px; letter-spacing:0.4em; opacity:0.45; margin-bottom:3.5em; }
  #boot .opt { font-size:13px; letter-spacing:0.35em; padding:10px 26px; margin:6px; cursor:pointer;
    border:1px solid rgba(138,151,160,0.3); background:rgba(4,6,10,0.45); opacity:0.85; }
  #boot .opt:hover { opacity:1; border-color:rgba(255,179,64,0.5); color:#e8d9b0; }
  #boot .keys { position:absolute; bottom:26px; font-size:10px; letter-spacing:0.22em; opacity:0.4; }
  .settings { margin-top:2.6em; display:grid; grid-template-columns:auto 170px auto; gap:9px 14px;
    font-size:10px; letter-spacing:0.3em; opacity:0.85; align-items:center;
    background:rgba(4,6,10,0.45); padding:14px 20px; border:1px solid rgba(138,151,160,0.16); }
  .settings input[type=range] { -webkit-appearance:none; appearance:none; width:170px; height:3px;
    background:rgba(138,151,160,0.35); border-radius:2px; outline:none; cursor:pointer; }
  .settings input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
    width:11px; height:11px; border-radius:50%; background:#ffb340; box-shadow:0 0 8px rgba(255,179,64,0.6); }
  .settings input[type=range]::-moz-range-thumb { width:11px; height:11px; border:none; border-radius:50%; background:#ffb340; }
  .settings .val { min-width:3.5em; text-align:right; opacity:0.7; font-size:9px; }
  #err { position:fixed; inset:auto 0 0 0; z-index:20; color:#b05545; background:rgba(4,6,10,0.9);
    font:12px monospace; padding:8px 14px; display:none; white-space:pre-wrap; }
</style>

<body>
<canvas id="game"></canvas>
<div id="boot">
  <canvas id="keyart" width="1600" height="900"></canvas>
  <div id="shade"></div>
  <div id="bootInner">
    <h1>HOLLOW TIDE</h1>
    <div class="sub">A SMALL THING IN A DROWNED PLACE</div>

      <span>QUALITY</span><input type="range" id="setQuality" min="0" max="2" step="1" value="2"><span class="val" id="valQuality">HIGH</span>

      <span>BRIGHTNESS</span><input type="range" id="setBright" min="60" max="150" step="5" value="100"><span class="val" id="valBright">100%</span>
      <span>VOLUME</span><input type="range" id="setVol" min="0" max="100" step="5" value="80"><span class="val" id="valVol">80%</span>
    </div>
    <div class="keys">MOVE&nbsp;WASD&nbsp;&nbsp;·&nbsp;&nbsp;JUMP&nbsp;SPACE&nbsp;&nbsp;·&nbsp;&nbsp;GRAB&nbsp;E&nbsp;&nbsp;·&nbsp;&nbsp;SPRINT&nbsp;SHIFT&nbsp;&nbsp;·&nbsp;&nbsp;SNEAK&nbsp;C&nbsp;&nbsp;·&nbsp;&nbsp;LANTERN&nbsp;Q</div>
  </div>
</div>
<div id="err"></div>
<script type="module">
/* ============================================================================
   HOLLOW TIDE — an atmospheric miniature-horror platformer.
   Single file. Three.js r160. All geometry, textures and audio are procedural.
   ----------------------------------------------------------------------------
   MODULE INDEX:  BOOT · CONFIG · UTILS · MERGE · TEXTURES · MATERIALS ·
                  GEO_FACTORY · CHARACTERS · PHYSICS · INPUT · AI · CAMERA ·
                  FX · ROOMS · AUDIO · POST · SAVE · GAME_LOOP · SELF_TEST
   ========================================================================== */

/* ============================== BOOT ===================================== */
async function loadThree() {
  const sources = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
    './vendor/three.module.min.js',
  ];
  let lastErr = null;
  for (const src of sources) {
    try { return await import(src); } catch (e) { lastErr = e; }
  }
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'Could not load Three.js (offline and no vendor copy beside this file).\n' + lastErr;
  throw lastErr;
}
const THREE = await loadThree();

const PARAMS = new URLSearchParams(location.search);
const TEST_MODE = PARAMS.get('test') === '1';

/* ============================== CONFIG =================================== */
const CONFIG = {
  palette: {
    abyss:      new THREE.Color(0x04060a),   // fog / void
    nightTeal:  new THREE.Color(0x0a1216),
    brine:      new THREE.Color(0x0d181c),
    rustBrown:  new THREE.Color(0x241a12),
    mud:        new THREE.Color(0x1a140e),
    boneGrey:   new THREE.Color(0x3a3f42),
    sack:       new THREE.Color(0x35322a),
    wax:        new THREE.Color(0x4a453a),
    ember:      new THREE.Color(0xd4551a),   // the raincoat — accent 1
    emberGlow:  new THREE.Color(0xff5a15),
    tungsten:   new THREE.Color(0xffb340),   // the bulbs — accent 2
    tungstenHot:new THREE.Color(0xffc966),
    milk:       new THREE.Color(0xb8b4a4),
    blackWater: new THREE.Color(0x050709),
  },
  player: {
    height: 0.55, radius: 0.12,
    walkSpeed: 1.7, sprintSpeed: 2.9, sneakSpeed: 0.72, crawlSpeed: 0.55, dragFactor: 0.55,
    accel: 14.0, airAccel: 5.0, jumpVel: 3.35, gravity: 13.5,
    stepUp: 0.16, grabReach: 0.30, ledgeReachLo: 0.28, ledgeReachHi: 0.62,
    zMin: -2.2, zMax: 2.2,
  },
  noise: { sneak: 0.06, walk: 0.34, sprint: 0.85, crawl: 0.04, land: 0.55, drag: 0.5, lanternRaise: 0.30,
           surfaces: { wood: 1.0, metal: 1.7, stone: 0.9, cloth: 0.25, water: 1.4, sand: 0.5, flesh: 0.8 } },
  warden: { patrolSpeed: 1.05, investigateSpeed: 1.7, huntSpeed: 3.3, hearRadius: 9.5,
            grabRange: 0.85, loseInterest: 8.0, height: 4.0 },
  renderer_: { sweepSpeed: 1.35, alertSpeed: 3.9, feelRadius: { still: 0.0, crawl: 0.9, sneak: 1.6, walk: 4.2, sprint: 7.5 },
               grabRange: 0.7, calm: 5.0 },
  cam: { damp: 3.2, parallax: 0.4, fovBase: 34 },
  fog: { density: 0.055 },
  budget: { maxLights: 3, shadowMap: 2048 },
  fade: { death: 1.2 },
};
const PAL = CONFIG.palette;

/* ============================== UTILS ==================================== */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// Seeded 2D value noise + fbm (used for all displacement work).
function makeNoise2D(seed) {
  const rand = mulberry32(seed);
  const perm = new Uint8Array(512);
  const grad = new Float32Array(256);
  for (let i = 0; i < 256; i++) { perm[i] = i; grad[i] = rand(); }
  for (let i = 255; i > 0; i--) { const j = (rand() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
  const val = (ix, iy) => grad[perm[(perm[ix & 255] + iy) & 255]];
  return function noise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = val(ix, iy), b = val(ix + 1, iy), c = val(ix, iy + 1), d = val(ix + 1, iy + 1);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
  };
}
function makeFBM(seed, octaves = 4) {
  const n = makeNoise2D(seed);
  return function fbm(x, y) {
    let f = 0, amp = 0.5, freq = 1, norm = 0;
    for (let i = 0; i < octaves; i++) { f += amp * n(x * freq, y * freq); norm += amp; amp *= 0.5; freq *= 2.03; }
    return f / norm;
  };
}
const NOISE = makeNoise2D(1337);
const FBM = makeFBM(7331, 4);

/* ============================== MERGE ====================================
   Minimal BufferGeometry merge (replaces examples/jsm BufferGeometryUtils).
   Supports position/normal/uv non-indexed or indexed inputs; output indexed
   only when every input is indexed with matching attribute sets.           */
function mergeGeometries(geoms) {
  if (!geoms.length) return null;
  const attrNames = Object.keys(geoms[0].attributes);
  const useIndex = geoms.every(g => g.index !== null);
  const merged = new THREE.BufferGeometry();
  for (const name of attrNames) {
    let total = 0;
    for (const g of geoms) total += g.attributes[name].count;
    const itemSize = geoms[0].attributes[name].itemSize;
    const arr = new Float32Array(total * itemSize);
    let off = 0;
    for (const g of geoms) {
      const src = g.attributes[name];
      arr.set(src.array.subarray(0, src.count * itemSize), off);
      off += src.count * itemSize;
    }
    merged.setAttribute(name, new THREE.BufferAttribute(arr, itemSize));
  }
  if (useIndex) {
    let totalIdx = 0;
    for (const g of geoms) totalIdx += g.index.count;
    const idx = new Uint32Array(totalIdx);
    let off = 0, vertOff = 0;
    for (const g of geoms) {
      const src = g.index;
      for (let i = 0; i < src.count; i++) idx[off + i] = src.array[i] + vertOff;
      off += src.count;
      vertOff += g.attributes.position.count;
    }
    merged.setIndex(new THREE.BufferAttribute(idx, 1));
  }
  return merged;
}
// Bake a mesh-local transform into a clone of a geometry, then merge later.
function xformGeo(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const g = geo.clone();
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz));
  m.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(sx, sy, sz));
  g.applyMatrix4(m);
  return g;
}

/* ============================== TEXTURES =================================
   Every map in the game is painted here on offscreen canvases.             */
const TexCache = new Map();
function canvasTexture(key, size, painter, opts = {}) {
  if (TexCache.has(key)) return TexCache.get(key);
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  painter(ctx, size);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  if (opts.repeat) tex.repeat.set(opts.repeat[0], opts.repeat[1]);
  tex.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  TexCache.set(key, tex);
  return tex;
}

// --- painters ---------------------------------------------------------------
function paintGrime(ctx, s, base = '#141a1c', streak = '#0a0e10', rand = mulberry32(21)) {
  ctx.fillStyle = base; ctx.fillRect(0, 0, s, s);
  // blotches
  for (let i = 0; i < 240; i++) {
    const x = rand() * s, y = rand() * s, r = 4 + rand() * (s / 8);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.03 + rand() * 0.10;
    g.addColorStop(0, `rgba(8,10,12,${a})`);
    g.addColorStop(1, 'rgba(8,10,12,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  // vertical drip streaks
  ctx.strokeStyle = streak;
  for (let i = 0; i < 90; i++) {
    const x = rand() * s, y0 = rand() * s * 0.6, len = s * (0.1 + rand() * 0.5);
    ctx.globalAlpha = 0.04 + rand() * 0.09;
    ctx.lineWidth = 1 + rand() * 3;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + (rand() - 0.5) * 8, y0 + len); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function paintRust(ctx, s, rand = mulberry32(55)) {
  ctx.fillStyle = '#20191a'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 500; i++) {
    const x = rand() * s, y = rand() * s, r = 2 + rand() * 26;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const warm = rand();
    const col = warm > 0.72 ? '90,48,22' : (warm > 0.4 ? '52,36,26' : '24,20,20');
    g.addColorStop(0, `rgba(${col},${0.06 + rand() * 0.16})`);
    g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  // scratches
  for (let i = 0; i < 60; i++) {
    ctx.strokeStyle = `rgba(120,80,50,${0.04 + rand() * 0.07})`;
    ctx.lineWidth = 0.5 + rand();
    ctx.beginPath();
    const x = rand() * s, y = rand() * s;
    ctx.moveTo(x, y); ctx.lineTo(x + (rand() - 0.5) * 90, y + (rand() - 0.5) * 24); ctx.stroke();
  }
}
function paintWood(ctx, s, tone = [46, 34, 22], rand = mulberry32(99)) {
  ctx.fillStyle = `rgb(${tone[0]},${tone[1]},${tone[2]})`;
  ctx.fillRect(0, 0, s, s);
  const plankW = s / 6;
  for (let p = 0; p < 6; p++) {
    const px = p * plankW;
    const shade = (rand() - 0.5) * 14;
    ctx.fillStyle = `rgba(${tone[0] + shade},${tone[1] + shade * 0.8},${tone[2] + shade * 0.5},0.55)`;
    ctx.fillRect(px, 0, plankW, s);
    // grain lines
    for (let i = 0; i < 26; i++) {
      const gx = px + rand() * plankW;
      ctx.strokeStyle = `rgba(12,9,6,${0.10 + rand() * 0.18})`;
      ctx.lineWidth = 0.6 + rand() * 1.6;
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      let x = gx;
      for (let y = 0; y <= s; y += s / 14) { x += (rand() - 0.5) * 5; ctx.lineTo(clamp(x, px + 1, px + plankW - 1), y); }
      ctx.stroke();
    }
    // knots
    for (let k = 0; k < 2; k++) {
      if (rand() < 0.5) continue;
      const kx = px + plankW * (0.25 + rand() * 0.5), ky = rand() * s, kr = 3 + rand() * 7;
      ctx.strokeStyle = 'rgba(10,7,4,0.5)';
      for (let r = kr; r > 0; r -= 1.6) { ctx.beginPath(); ctx.ellipse(kx, ky, r, r * 1.6, 0, 0, 7); ctx.stroke(); }
    }
    // plank seam
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(px - 1, 0, 2, s);
  }
  paintGrime(ctx, s, 'rgba(0,0,0,0)', '#05070a', rand);
}
function paintConcrete(ctx, s, rand = mulberry32(202)) {
  ctx.fillStyle = '#191d1e'; ctx.fillRect(0, 0, s, s);
  const img = ctx.getImageData(0, 0, s, s);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rand() - 0.5) * 16;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
  paintGrime(ctx, s, 'rgba(0,0,0,0)', '#070a0c', rand);
  // cracks
  for (let i = 0; i < 10; i++) {
    ctx.strokeStyle = `rgba(6,8,9,${0.35 + rand() * 0.3})`;
    ctx.lineWidth = 0.8 + rand() * 1.2;
    ctx.beginPath();
    let x = rand() * s, y = rand() * s;
    ctx.moveTo(x, y);
    for (let jj = 0; jj < 9; jj++) { x += (rand() - 0.5) * 60; y += rand() * 40; ctx.lineTo(x, y); }
    ctx.stroke();
  }
}
function paintCloth(ctx, s, base = [53, 50, 42], rand = mulberry32(77)) {
  ctx.fillStyle = `rgb(${base[0]},${base[1]},${base[2]})`; ctx.fillRect(0, 0, s, s);
  ctx.globalAlpha = 0.16;
  for (let y = 0; y < s; y += 3) { ctx.fillStyle = (y / 3) % 2 ? '#000' : '#666'; ctx.fillRect(0, y, s, 1); }
  for (let x = 0; x < s; x += 3) { ctx.fillStyle = (x / 3) % 2 ? '#000' : '#555'; ctx.fillRect(x, 0, 1, s); }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 40; i++) { // stains
    const x = rand() * s, y = rand() * s, r = 8 + rand() * 50;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(14,12,8,${0.08 + rand() * 0.12})`); g.addColorStop(1, 'rgba(14,12,8,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
}
function paintBandage(ctx, s, rand = mulberry32(303)) {
  ctx.fillStyle = '#5c5648'; ctx.fillRect(0, 0, s, s);
  // wrapped strips
  for (let y = 0; y < s; y += 22) {
    const off = (rand() - 0.5) * 8;
    ctx.fillStyle = `rgba(${70 + rand() * 20},${64 + rand() * 18},${50 + rand() * 14},0.9)`;
    ctx.fillRect(0, y + off, s, 18);
    ctx.fillStyle = 'rgba(20,16,10,0.55)';
    ctx.fillRect(0, y + off + 17, s, 3);
    ctx.fillStyle = 'rgba(255,250,230,0.05)';
    ctx.fillRect(0, y + off + 1, s, 2);
  }
  // salt crust + seep stains
  for (let i = 0; i < 90; i++) {
    const x = rand() * s, y = rand() * s, r = 2 + rand() * 14;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    if (rand() < 0.6) { g.addColorStop(0, `rgba(200,196,180,${0.05 + rand() * 0.1})`); g.addColorStop(1, 'rgba(200,196,180,0)'); }
    else { g.addColorStop(0, `rgba(60,44,24,${0.08 + rand() * 0.14})`); g.addColorStop(1, 'rgba(60,44,24,0)'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
}
function paintRaincoat(ctx, s, rand = mulberry32(404)) {
  ctx.fillStyle = '#c24d16'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 160; i++) { // worn patches & wet sheen variation
    const x = rand() * s, y = rand() * s, r = 4 + rand() * 30;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = rand() < 0.55;
    g.addColorStop(0, dark ? `rgba(90,32,8,${0.05 + rand() * 0.12})` : `rgba(255,120,40,${0.03 + rand() * 0.08})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  // seams
  ctx.strokeStyle = 'rgba(40,14,4,0.5)'; ctx.lineWidth = 2;
  for (const fy of [0.25, 0.5, 0.75]) { ctx.beginPath(); ctx.moveTo(0, s * fy); ctx.lineTo(s, s * fy); ctx.stroke(); }
}
function paintWax(ctx, s, rand = mulberry32(505)) {
  ctx.fillStyle = '#8a8272'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 260; i++) {
    const x = rand() * s, y = rand() * s, r = 3 + rand() * 22;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const v = rand();
    const col = v > 0.6 ? '160,150,128' : (v > 0.3 ? '110,100,84' : '70,62,50');
    g.addColorStop(0, `rgba(${col},${0.05 + rand() * 0.12})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  // veins
  for (let i = 0; i < 26; i++) {
    ctx.strokeStyle = `rgba(70,60,54,${0.06 + rand() * 0.08})`;
    ctx.lineWidth = 0.6 + rand() * 1.4;
    ctx.beginPath();
    let x = rand() * s, y = rand() * s; ctx.moveTo(x, y);
    for (let jj = 0; jj < 7; jj++) { x += (rand() - 0.5) * 46; y += (rand() - 0.5) * 46; ctx.lineTo(x, y); }
    ctx.stroke();
  }
}
function paintRadial(ctx, s, inner = 'rgba(255,190,110,0.55)', outer = 'rgba(255,190,110,0)') {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, inner);
  g.addColorStop(0.35, inner.replace(/[\d.]+\)$/, m => (parseFloat(m) * 0.4) + ')'));
  g.addColorStop(1, outer);
  ctx.clearRect(0, 0, s, s);

function paintHeightFromFBM(ctx, s, seed, scale = 6, contrast = 1) {
  const fbm = makeFBM(seed, 5);
  const img = ctx.createImageData(s, s);
  const d = img.data;
  for (let y = 0; y < s; y++) {
    for (let x = 0; x < s; x++) {
      let v = fbm(x / s * scale, y / s * scale);
      v = clamp(0.5 + (v - 0.5) * contrast, 0, 1);
      const i = (y * s + x) * 4;
      d[i] = d[i + 1] = d[i + 2] = v * 255; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* ============================== GEO_FACTORY ============================== */
// Displace vertices along their normals with seeded fbm, then rebuild normals.
function displaceGeo(geo, seed, amp, freq = 3) {
  const fbm = makeFBM(seed, 4);
  const pos = geo.attributes.position;
  if (!geo.attributes.normal) geo.computeVertexNormals();
  const nor = geo.attributes.normal;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const d = (fbm(x * freq + z * 0.7, y * freq + z * 1.3) * 2 - 1) * amp;
    pos.setXYZ(i, x + nor.getX(i) * d, y + nor.getY(i) * d, z + nor.getZ(i) * d);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}
function scaleUV(geo, su, sv = su) {
  const uv = geo.attributes.uv;
  if (uv) for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  return geo;
}
function latheProfile(pts, radial = 64) {
  const v2 = pts.map(p => new THREE.Vector2(Math.max(0.0001, p[0]), p[1]));
  return new THREE.LatheGeometry(v2, radial);
}

      const g = new THREE.BoxGeometry(0.28 - t0 * 0.1, len * 1.06, 0.55 - t0 * 0.2, 1, 2, 1);
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
      parts.push(xformGeo(g, mx, my, 0, 0, 0, -Math.atan2(x1 - x0, y1 - y0)));
    }
    const g = mergeGeometries(parts);
    displaceGeo(g, seed, 0.05, 0.8);
    return g;
  },
  bone(len = 1, seed = 16) {
    const parts = [];
    parts.push(xformGeo(new THREE.CylinderGeometry(0.05 * len, 0.06 * len, len, 24), 0, len / 2, 0));
    parts.push(xformGeo(new THREE.SphereGeometry(0.09 * len, 24, 16), 0.02, len, 0));
    parts.push(xformGeo(new THREE.SphereGeometry(0.08 * len, 24, 16), -0.03, 0, 0));
    const g = mergeGeometries(parts);
    displaceGeo(g, seed, 0.01 * len, 5);
    return g;
  },
  shelf(w = 3, levels = 3, depth = 0.7, hStep = 1.0) {
    const parts = [];
    for (let i = 0; i < levels; i++)
      parts.push(xformGeo(new THREE.BoxGeometry(w, 0.07, depth, 3, 1, 1), 0, (i + 1) * hStep, 0));
    for (const cx of [-1, 1]) for (const cz of [-1, 1])
      parts.push(xformGeo(new THREE.BoxGeometry(0.09, levels * hStep + 0.2, 0.09), cx * (w / 2 - 0.05), (levels * hStep) / 2 + 0.05, cz * (depth / 2 - 0.05)));
    return mergeGeometries(parts);
  },
  sackBlob(r = 0.5, seed = 17) {
    const g = new THREE.SphereGeometry(r, 32, 24);
    g.scale(1, 1.25, 0.9);
    displaceGeo(g, seed, r * 0.18, 2.2 / r);
    return g;
  },
  finger(len, r, curl = 0.5, segs = 3) { // curled finger, merged segments
    const parts = [];
    let x = 0, y = 0, ang = 0;
    for (let i = 0; i < segs; i++) {
      const sl = len * (0.42 - i * 0.09);
      const sr = r * (1 - i * 0.22);
      const g = new THREE.CylinderGeometry(sr * 0.85, sr, sl, 24, 1);
      const midAng = ang + curl * 0.5;
      const mx = x + Math.sin(midAng) * sl / 2, my = y - Math.cos(midAng) * sl / 2;
      parts.push(xformGeo(g, mx, my, 0, 0, 0, -midAng));
      x += Math.sin(midAng) * sl; y -= Math.cos(midAng) * sl;
      ang += curl;
    }
    parts.push(xformGeo(new THREE.SphereGeometry(r * 0.5, 16, 12), x, y, 0));
    return mergeGeometries(parts);
  },
};

/* Static batcher — one draw call per material for everything that never moves. */
class Batcher {
  constructor() { this.byMat = new Map(); }
  add(geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
    if (!this.byMat.has(mat)) this.byMat.set(mat, []);
    this.byMat.get(mat).push(xformGeo(geo, x, y, z, rx, ry, rz, sx, sy, sz));
  }
  build(group, { shadows = true } = {}) {
    const meshes = [];
    for (const [mat, geos] of this.byMat) {
      const merged = mergeGeometries(geos);
      for (const g of geos) g.dispose();
      const mesh = new THREE.Mesh(merged, mat);
      mesh.castShadow = shadows;
      mesh.receiveShadow = true;
      group.add(mesh);
      meshes.push(mesh);
    }
    this.byMat.clear();
    return meshes;
  }
}

/* Eight — 55cm of child under an ember raincoat. Rig origin at the feet,
   model faces +Z; root.rotation.y steers her. Every joint is a Group so the
   walk cycle can be driven procedurally.                                    */
class Eight {
  constructor() {
    this.root = new THREE.Group();
    this.root.name = 'eight';
    const j = this.j = {};

    // --- hips & legs: long enough to read human below the coat hem ---
    j.hips = new THREE.Group(); j.hips.position.y = 0.285; this.root.add(j.hips);
    const mkLeg = (side) => {
      const hip = new THREE.Group(); hip.position.set(0.041 * side, -0.005, 0); j.hips.add(hip);
      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.0245, 0.021, 0.14, 64), MAT.dark);
      thigh.position.y = -0.07; hip.add(thigh);
      const knee = new THREE.Group(); knee.position.y = -0.14; hip.add(knee);
      const shin = new THREE.Mesh(mergeGeometries([
        xformGeo(new THREE.CylinderGeometry(0.02, 0.017, 0.13, 64), 0, -0.065, 0),
        xformGeo(new THREE.BoxGeometry(0.042, 0.026, 0.075, 2, 1, 2), 0, -0.132, 0.016),
      ]), MAT.dark);
      knee.add(shin);
      return { hip, knee };
    };
    j.legL = mkLeg(-1); j.legR = mkLeg(1);

    // --- torso ---
    j.torso = new THREE.Group(); j.torso.position.y = 0.005; j.hips.add(j.torso);
    const chest = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.115, 16, 64), MAT.dark);
    chest.position.y = 0.115; j.torso.add(chest);

    // --- the raincoat: slim shell, hem above the knee ---
    const coatPts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40; // t=0 hem … t=1 collar
      const r = lerp(0.082, 0.047, Math.pow(t, 0.85)) * (1 + 0.004 * Math.sin(t * 24) * (1 - t));
      coatPts.push([r, t * 0.185]);
    }
    const coatShell = new THREE.Mesh(latheProfile(coatPts, 128), MAT.raincoat);
    coatShell.position.y = 0.045; j.torso.add(coatShell);
    j.coat = [];
    const panelGeo = (arc) => {
      const g = new THREE.CylinderGeometry(0.079, 0.092, 0.07, 48, 3, true, -arc / 2, arc);
      g.translate(0, -0.035, 0);
      return g;
    };
    for (const [ang, arc] of [[0, 1.7], [2.4, 1.35], [-2.4, 1.35]]) {
      const pnl = new THREE.Group(); pnl.position.y = 0.05; pnl.rotation.y = ang;
      pnl.add(new THREE.Mesh(panelGeo(arc), MAT.raincoat));
      j.torso.add(pnl); j.coat.push(pnl);
    }

    // --- arms ---
    const mkArm = (side) => {
      const sh = new THREE.Group(); sh.position.set(0.068 * side, 0.185, 0); j.torso.add(sh);
      const up = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.0155, 0.095, 48), MAT.raincoat);
      up.position.y = -0.0475; sh.add(up);
      const el = new THREE.Group(); el.position.y = -0.095; sh.add(el);
      const handParts = [xformGeo(new THREE.CylinderGeometry(0.0145, 0.0125, 0.082, 48), 0, -0.041, 0)];
      for (let f = 0; f < 3; f++)
        handParts.push(xformGeo(GF.finger(0.042, 0.0055, 0.5, 3), (f - 1) * 0.009, -0.082, 0.003));
      handParts.push(xformGeo(GF.finger(0.03, 0.0055, 0.7, 2), 0.013 * side, -0.075, 0.006, 0, 0, -0.5 * side));
      const fore = new THREE.Mesh(mergeGeometries(handParts), MAT.dark);
      el.add(fore);
      const grip = new THREE.Group(); grip.position.set(0, -0.095, 0.013); el.add(grip);
      return { sh, el, grip };
    };
    j.armL = mkArm(-1); j.armR = mkArm(1);

    // --- head under a peaked hood; the face stays in shadow ---
    j.head = new THREE.Group(); j.head.position.y = 0.24; j.torso.add(j.head);
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.047, 64, 48), MAT.voidBlack);
    skull.position.y = 0.026; j.head.add(skull);
    const face = new THREE.Mesh(new THREE.SphereGeometry(0.0395, 64, 48), MAT.voidBlack);
    face.position.set(0, 0.024, 0.017); j.head.add(face);
    const hoodPts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      const r = 0.0585 * Math.sin(Math.PI * (0.10 + t * 0.62)) * (1 + 0.04 * (1 - t));
      hoodPts.push([Math.max(0.003, r), t * 0.118]);
    }
    const hood = new THREE.Mesh(latheProfile(hoodPts, 128), MAT.raincoat);
    hood.position.y = -0.012; hood.rotation.x = 0.32; j.head.add(hood);
    const peak = new THREE.Mesh(new THREE.ConeGeometry(0.019, 0.062, 48), MAT.raincoat);
    peak.position.set(0, 0.078, -0.058); peak.rotation.x = -1.45; j.head.add(peak);
    const collar = new THREE.Mesh(new THREE.TorusGeometry(0.043, 0.011, 16, 64), MAT.raincoat);
    collar.position.y = -0.015; collar.rotation.x = Math.PI / 2 - 0.15; j.head.add(collar);

    // --- the storm lantern, carried in the left hand ---
    j.lantern = new THREE.Group();
    const cage = [];
    cage.push(xformGeo(new THREE.TorusGeometry(0.028, 0.004, 8, 32), 0, 0, 0, Math.PI / 2));
    cage.push(xformGeo(new THREE.TorusGeometry(0.024, 0.004, 8, 32), 0, -0.075, 0, Math.PI / 2));
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * Math.PI * 2;
      cage.push(xformGeo(new THREE.CylinderGeometry(0.0028, 0.0028, 0.075, 8),
        Math.cos(a) * 0.026, -0.0375, Math.sin(a) * 0.026));
    }
    cage.push(xformGeo(new THREE.CylinderGeometry(0.006, 0.017, 0.016, 16), 0, 0.008, 0));
    cage.push(xformGeo(new THREE.TorusGeometry(0.012, 0.0035, 8, 24), 0, 0.028, 0)); // carry loop
    const cageMesh = new THREE.Mesh(mergeGeometries(cage), MAT.metalDark);
    j.lantern.add(cageMesh);
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.024, 0.07, 24, 1, true),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(0x887755), transparent: true, opacity: 0.22, roughness: 0.1, side: THREE.DoubleSide }));
    glass.position.y = -0.038; j.lantern.add(glass);
    this.flame = new THREE.Mesh(new THREE.PlaneGeometry(0.028, 0.045), MAT.flame.clone());
    this.flame.position.y = -0.05; j.lantern.add(this.flame);
    this.lightL = new THREE.PointLight(new THREE.Color(0xffb340), 6, 4.5, 1.8);
    this.lightL.position.y = -0.045; j.lantern.add(this.lightL);
    j.lantern.position.set(0, -0.02, 0.01);
    j.armL.grip.add(j.lantern);

    this.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });

    // --- animation state ---
    this.phase = 0;             // stride phase
    this.bobAmp = 0;
    this.coatSwayX = 0; this.coatSwayV = 0;
    this.leanZ = 0;
    this.breath = 0;
    this.exhaustion = 0;
    this.lanternRaise = 0;      // 0 carried low … 1 held high
    this.faceAngle = Math.PI / 2;
    this.prevVX = 0;
    this.stepEvent = false;     // set true on footfall frames (audio hook)
    this.boneCount = this.countBones();
  }
  countBones() {
    let n = 0;
    this.root.traverse(o => { if (o.isGroup) n++; });
    return n;
  }
  /* Per-frame pose. ctx = { state, moveMode, vel, grounded, speedNorm,
     hangT, mantleT, climbPhase, swingAngle, dragging, dt, time } */
  pose(ctx) {
    const j = this.j, dt = ctx.dt, t = ctx.time;
    const spd = ctx.speedNorm;              // 0..1 of sprint speed
    this.stepEvent = false;

    // facing
    const v = ctx.vel;
    const hSpeed = Math.hypot(v.x, v.z);
    if (hSpeed > 0.15 && ctx.state !== 'hang' && ctx.state !== 'climb') {
      const target = Math.atan2(v.x, v.z);
      let d = target - this.faceAngle;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      this.faceAngle += d * Math.min(1, dt * 10);
    }
    this.root.rotation.y = this.faceAngle;

    // stride phase advances with distance travelled
    const strideLen = ctx.moveMode === 'sprint' ? 0.42 : ctx.moveMode === 'sneak' ? 0.2 : 0.3;
    if (ctx.grounded && hSpeed > 0.05) {
      const prev = this.phase;
      this.phase += (hSpeed / strideLen) * dt * Math.PI;
      if (Math.floor(this.phase / Math.PI) !== Math.floor(prev / Math.PI)) this.stepEvent = true;
    }
    const ph = this.phase;

    // exhaustion builds while sprinting
    if (ctx.moveMode === 'sprint' && hSpeed > 1) this.exhaustion = Math.min(1, this.exhaustion + dt * 0.14);
    else this.exhaustion = Math.max(0, this.exhaustion - dt * 0.09);

    this.breath += dt * (1.1 + this.exhaustion * 2.2);
    const br = Math.sin(this.breath * Math.PI * 2) * (0.2 + this.exhaustion);

    // coat sway spring (responds to acceleration)
    const ax = (v.x * Math.sin(this.faceAngle) + v.z * Math.cos(this.faceAngle)) - this.prevVX;
    this.prevVX = (v.x * Math.sin(this.faceAngle) + v.z * Math.cos(this.faceAngle));
    this.coatSwayV += (-this.coatSwayX * 60 - this.coatSwayV * 8 - ax * 26) * dt;
    this.coatSwayX += this.coatSwayV * dt;
    this.coatSwayX = clamp(this.coatSwayX, -0.6, 0.6);

    const P = { hipsY: 0.285, hipsRX: 0, headRX: 0, armSwing: 0, legSwing: 0, kneeBend: 0,
                armRaiseL: 0, armRaiseR: 0, bob: 0, lean: 0 };

    if (ctx.state === 'ground') {
      if (ctx.moveMode === 'crawl') {
        P.hipsY = 0.155; P.hipsRX = 1.15; P.headRX = -0.95;
        P.legSwing = Math.sin(ph) * 0.5; P.kneeBend = 1.5;
        P.armSwing = Math.sin(ph + Math.PI) * 0.6; P.armRaiseL = P.armRaiseR = -1.2;
      } else if (ctx.moveMode === 'crouch') {
        // held crouch — hunkered low and still, arms drawn in, head tucked
        P.hipsY = 0.205 + Math.sin(this.breath * Math.PI * 2) * 0.003;
        P.hipsRX = 0.5; P.headRX = -0.4;
        P.kneeBend = 1.15; P.armRaiseL = 0.45; P.armRaiseR = 0.45;
        P.armSwing = 0; P.legSwing = 0;
      } else if (hSpeed < 0.08) {
        // idle — breathing; exhausted idle stoops and heaves
        P.hipsY = 0.285 - this.exhaustion * 0.02 + Math.sin(this.breath * Math.PI * 2) * 0.002;
        P.hipsRX = 0.04 + this.exhaustion * 0.3;
        P.headRX = -0.05 - this.exhaustion * 0.25 + br * 0.02;
        P.armSwing = 0; P.legSwing = 0;
        P.armRaiseL = 0.05 + br * 0.015; P.armRaiseR = 0.05 + br * 0.015;
      } else {
        const sneak = ctx.moveMode === 'sneak' ? 1 : 0;
        const sprint = ctx.moveMode === 'sprint' ? 1 : 0;
        P.hipsY = 0.285 - sneak * 0.055 - sprint * 0.004;
        P.hipsRX = 0.06 + sneak * 0.42 + sprint * 0.22;
        P.headRX = -0.06 - sneak * 0.3 - sprint * 0.1;
        P.legSwing = Math.sin(ph) * (0.5 + sprint * 0.45 - sneak * 0.18);
        P.kneeBend = 0.35 + sneak * 0.5 + sprint * 0.25;
        P.armSwing = Math.sin(ph + Math.PI) * (0.42 + sprint * 0.5 - sneak * 0.28);
        P.bob = Math.abs(Math.sin(ph)) * (0.011 + sprint * 0.008);
        P.lean = sprint * 0.1;
      }
      if (ctx.dragging) { P.hipsRX = 0.3; P.armRaiseL = -1.35; P.armRaiseR = -1.35; P.armSwing = 0; }
    } else if (ctx.state === 'air') {
      P.hipsY = 0.285; P.hipsRX = 0.15;
      P.legSwing = 0.35; P.kneeBend = 0.9;
      P.armRaiseL = 0.8; P.armRaiseR = 0.8; P.headRX = 0.1;
    } else if (ctx.state === 'hang') {
      P.hipsY = 0.285; P.hipsRX = -0.12;
      P.armRaiseL = Math.PI - 0.25; P.armRaiseR = Math.PI - 0.25;
      P.legSwing = Math.sin(t * 2.2) * 0.12; P.kneeBend = 0.5; P.headRX = 0.35;
    } else if (ctx.state === 'mantle') {
      const mt = ctx.mantleT;
      P.hipsRX = lerp(-0.1, 0.9, mt); P.armRaiseL = P.armRaiseR = lerp(Math.PI - 0.3, -0.4, mt);
      P.kneeBend = lerp(0.4, 1.6, Math.sin(mt * Math.PI));
    } else if (ctx.state === 'climb') {
      const cp = ctx.climbPhase;
      P.hipsRX = 0.1;
      P.armRaiseL = Math.PI - 0.4 + Math.sin(cp) * 0.35;
      P.armRaiseR = Math.PI - 0.4 - Math.sin(cp) * 0.35;
      P.legSwing = Math.sin(cp) * 0.4; P.kneeBend = 1.1; P.headRX = 0.4;
    } else if (ctx.state === 'swing') {
      P.armRaiseL = P.armRaiseR = Math.PI - 0.2;
      P.legSwing = 0.2; P.kneeBend = 0.7; P.hipsRX = ctx.swingLean || 0;
    }

    // apply pose (critically damped-ish lerp keeps transitions soft)
    const k = Math.min(1, dt * 14);
    j.hips.position.y = lerp(j.hips.position.y, P.hipsY + P.bob, k);
    j.hips.rotation.x = lerp(j.hips.rotation.x, P.hipsRX + P.lean, k);
    j.head.rotation.x = lerp(j.head.rotation.x, P.headRX, k);
    j.head.rotation.z = lerp(j.head.rotation.z, this.coatSwayX * 0.1, k);
    j.legL.hip.rotation.x = lerp(j.legL.hip.rotation.x, P.legSwing - P.hipsRX, k);
    j.legR.hip.rotation.x = lerp(j.legR.hip.rotation.x, -P.legSwing - P.hipsRX, k);
    j.legL.knee.rotation.x = lerp(j.legL.knee.rotation.x, Math.max(0, P.kneeBend * (0.3 + 0.7 * Math.max(0, -Math.sin(ph)))), k);
    j.legR.knee.rotation.x = lerp(j.legR.knee.rotation.x, Math.max(0, P.kneeBend * (0.3 + 0.7 * Math.max(0, Math.sin(ph)))), k);
    j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, P.armSwing - P.armRaiseL, k);
    j.armR.sh.rotation.x = lerp(j.armR.sh.rotation.x, -P.armSwing - P.armRaiseR, k);
    j.armL.el.rotation.x = lerp(j.armL.el.rotation.x, ctx.state === 'ground' ? -0.35 : -0.15, k);
    j.armR.el.rotation.x = lerp(j.armR.el.rotation.x, ctx.state === 'ground' ? -0.35 : -0.15, k);

    // lantern raise (left arm overrides when held aloft)
    this.lanternRaise = damp(this.lanternRaise, ctx.lanternUp ? 1 : 0, 8, dt);
    if (this.lanternRaise > 0.02) {
      j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, -2.5 * this.lanternRaise, this.lanternRaise);
      j.armL.el.rotation.x = lerp(j.armL.el.rotation.x, -0.3, this.lanternRaise);
    }
    this.lightL.intensity = lerp(6, 15, this.lanternRaise) * (0.92 + 0.08 * Math.sin(t * 11) + 0.05 * NOISE(t * 3, 0.5));
    this.lightL.distance = lerp(4.5, 9.0, this.lanternRaise);
    this.flame.scale.setScalar(0.9 + 0.18 * Math.sin(t * 13) + 0.1 * NOISE(t * 7, 3));

    // coat panels: swing + inertia
    const coatBase = [0.12 + P.hipsRX * 0.5, 0.1, 0.1];
    for (let i = 0; i < 3; i++) {
      const p = j.coat[i];
      const flare = clamp(hSpeed * 0.22, 0, 0.5);
      p.rotation.x = lerp(p.rotation.x, coatBase[i] + flare + this.coatSwayX * (i === 0 ? 0.9 : -0.55), k);
    }
    // lantern hangs plumb-ish
    const wq = new THREE.Quaternion();
    j.armL.grip.getWorldQuaternion(wq);
    j.lantern.quaternion.copy(wq.invert());
  }
  dispose() {
    this.root.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  }
}

/* --- The Warden — four metres of stooped custodian. Hears, barely sees. --- */
class Warden {
  constructor(waypoints, opts = {}) {
    this.waypoints = waypoints;
    this.opts = opts;
    this.root = new THREE.Group(); this.root.name = 'warden';
    const j = this.j = {};

    j.pelvis = new THREE.Group(); j.pelvis.position.y = 1.55; this.root.add(j.pelvis);
    const pelvisMesh = new THREE.Mesh(displaceGeo(new THREE.SphereGeometry(0.42, 72, 48), 41, 0.05, 3), MAT.sack);
    pelvisMesh.scale.set(1, 0.8, 0.9); j.pelvis.add(pelvisMesh);

    // legs
    const mkLeg = (side) => {
      const hip = new THREE.Group(); hip.position.set(0.26 * side, -0.1, 0); j.pelvis.add(hip);
      const thigh = new THREE.Mesh(displaceGeo(new THREE.CylinderGeometry(0.17, 0.13, 0.75, 72), 42 + side, 0.015, 4), MAT.sack);
      thigh.position.y = -0.375; hip.add(thigh);
      const knee = new THREE.Group(); knee.position.y = -0.75; hip.add(knee);
      const shinParts = mergeGeometries([
        xformGeo(displaceGeo(new THREE.CylinderGeometry(0.12, 0.1, 0.68, 72), 43 + side, 0.012, 4), 0, -0.34, 0),
        xformGeo(new THREE.BoxGeometry(0.26, 0.14, 0.52, 2, 1, 3), 0, -0.65, 0.1), // heavy boot
      ]);
      const shin = new THREE.Mesh(shinParts, MAT.dark); knee.add(shin);
      return { hip, knee };
    };
    j.legL = mkLeg(-1); j.legR = mkLeg(1);

    // stooped spine & chest
    j.spine = new THREE.Group(); j.spine.position.y = 0.15; j.spine.rotation.x = 0.62; j.pelvis.add(j.spine);
    const chestGeo = displaceGeo(new THREE.SphereGeometry(0.55, 72, 48), 44, 0.06, 2.2);
    chestGeo.scale(1.05, 1.25, 0.85);
    const chest = new THREE.Mesh(chestGeo, MAT.sack);
    chest.position.y = 0.72; j.spine.add(chest);
    // sagging shoulder hump
    const hump = new THREE.Mesh(displaceGeo(new THREE.SphereGeometry(0.38, 72, 48), 45, 0.05, 3), MAT.sack);
    hump.position.set(0, 1.05, -0.18); hump.scale.set(1.2, 0.8, 1); j.spine.add(hump);
    // apron of stitched hide
    const apron = new THREE.Mesh(displaceGeo(new THREE.PlaneGeometry(0.85, 1.6, 6, 10), 46, 0.04, 2), MAT.cloth);
    apron.position.set(0, 0.15, 0.42); apron.rotation.x = -0.5; j.spine.add(apron);
    // vertebrae shoving through the sackcloth of his back
    for (let i = 0; i < 7; i++) {

    const grot = mulberry32(4141);
    for (let i = 0; i < 20; i++) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.02 + grot() * 0.05, 20, 14), MAT.wax);
      const a = grot() * Math.PI * 2, rr = 0.4 + grot() * 0.3;

    // his ring of trade: gaffs and keys knocking at the hip
    const beltParts = [xformGeo(new THREE.TorusGeometry(0.48, 0.035, 12, 64), 0, 0, 0, Math.PI / 2)];
    for (let i = 0; i < 5; i++) {
      const a = -0.8 + i * 0.4;
      beltParts.push(xformGeo(GF.hook(0.85), Math.sin(a) * 0.44, -0.1, Math.cos(a) * 0.44));
    }
    beltParts.push(xformGeo(new THREE.TorusGeometry(0.11, 0.028, 10, 32), 0.4, -0.28, 0.25)); // a great key's bow
    beltParts.push(xformGeo(new THREE.CylinderGeometry(0.024, 0.024, 0.34, 16), 0.4, -0.5, 0.25));
    const belt = new THREE.Mesh(mergeGeometries(beltParts), MAT.rust);
    belt.position.y = -0.02;
    j.pelvis.add(belt);

    // arms that reach the floor
    const mkArm = (side) => {
      const sh = new THREE.Group(); sh.position.set(0.58 * side, 1.05, 0.05); j.spine.add(sh);
      const up = new THREE.Mesh(displaceGeo(new THREE.CylinderGeometry(0.13, 0.1, 1.05, 72), 47 + side, 0.014, 4), MAT.sack);
      up.position.y = -0.52; sh.add(up);
      const el = new THREE.Group(); el.position.y = -1.05; sh.add(el);
      const fore = new THREE.Mesh(displaceGeo(new THREE.CylinderGeometry(0.09, 0.075, 1.1, 72), 48 + side, 0.012, 4), MAT.skin);
      fore.position.y = -0.55; el.add(fore);
      const wrist = new THREE.Group(); wrist.position.y = -1.1; el.add(wrist);
      const handParts = [xformGeo(new THREE.BoxGeometry(0.2, 0.26, 0.09, 2, 2, 1), 0, -0.13, 0)];
      for (let f = 0; f < 5; f++) { // half-metre fingers, three joints each
        const fg = GF.finger(0.52, 0.026, 0.42, 3);
        handParts.push(xformGeo(fg, (f - 2) * 0.042, -0.24, 0, 0, 0, (f - 2) * 0.09));
        handParts.push(xformGeo(new THREE.SphereGeometry(0.034, 20, 14), (f - 2) * 0.042, -0.25, 0.012)); // swollen knuckles
      }
      const hand = new THREE.Mesh(mergeGeometries(handParts), MAT.skin);
      wrist.add(hand);
      return { sh, el, wrist };
    };
    j.armL = mkArm(-1); j.armR = mkArm(1);

    // bandaged head, one milky lamp-eye
    j.neck = new THREE.Group(); j.neck.position.set(0, 1.32, 0.28); j.spine.add(j.neck);
    j.head = new THREE.Group(); j.neck.add(j.head);
    const headPts = [];
    for (let i = 0; i <= 34; i++) {
      const t = i / 34;
      let r = 0.34 * Math.sin(Math.PI * (0.04 + t * 0.92));
      r *= 1 + 0.06 * Math.sin(t * 22) + 0.04 * Math.sin(t * 9 + 2); // lumpy wrap
      headPts.push([Math.max(0.003, r), (t - 0.45) * 0.78]);
    }
    const head = new THREE.Mesh(latheProfile(headPts, 96), MAT.bandage);
    head.rotation.x = 0.25; j.head.add(head);
    for (let i = 0; i < 5; i++) { // loose bandage hoops
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.30 - i * 0.02, 0.022, 8, 48), MAT.bandage);
      ring.position.y = -0.12 + i * 0.09;
      ring.rotation.x = Math.PI / 2 + (i % 2 ? 0.28 : -0.2);
      ring.rotation.y = i * 0.7;
      j.head.add(ring);
    }
    // trailing bandage tail
    const tail = new THREE.Mesh(displaceGeo(new THREE.PlaneGeometry(0.09, 0.9, 2, 8), 49, 0.03, 3), MAT.bandage);
    tail.position.set(0.2, -0.3, -0.24); tail.rotation.x = 0.4; j.head.add(tail);
    const tail2 = new THREE.Mesh(displaceGeo(new THREE.PlaneGeometry(0.07, 1.25, 2, 10), 50, 0.035, 3), MAT.bandage);
    tail2.position.set(-0.16, -0.5, -0.18); tail2.rotation.x = 0.55; tail2.rotation.z = 0.2; j.head.add(tail2);
    // the wrap gapes at the jaw: a stitched-over mouth that never opens
    const gape = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.02, 10, 40, Math.PI * 0.8), MAT.dark);
    gape.position.set(0.02, -0.14, 0.27); gape.rotation.set(0.5, 0.2, Math.PI * 1.05); j.head.add(gape);
    this.eye = new THREE.Mesh(new THREE.SphereGeometry(0.085, 32, 24), MAT.eyeLamp);
    this.eye.position.set(0.1, 0.06, 0.30); j.head.add(this.eye);
    this.eyeLight = new THREE.SpotLight(new THREE.Color(0xd8cfa0), 36, 13, 0.38, 0.5, 1.4);
    this.eyeLight.position.copy(this.eye.position);
    this.eyeTarget = new THREE.Object3D();
    this.eyeTarget.position.set(0.3, -2, 4);
    j.head.add(this.eyeLight, this.eyeTarget);
    this.eyeLight.target = this.eyeTarget;

    this.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

    // AI state
    this.state = 'patrol';
    this.wpIndex = 0;
    this.waitT = 0;
    this.stimulus = null;        // Vector3 of last heard thing
    this.stimulusAge = 99;
    this.phase = 0;
    this.stepEvent = false;
    this.lungeT = 0;
    this.recoverT = 0;
    this.searchT = 0;
    this.faceAngle = 0;
    this.frozen = 0;             // finale: the great lens can pin him
    this.boneCount = (() => { let n = 0; this.root.traverse(o => { if (o.isGroup) n++; }); return n; })();
  }
  hear(pos, loudness) {
    const d = this.root.position.distanceTo(pos);
    const radius = loudness * CONFIG.warden.hearRadius;
    if (d < radius) {
      this.stimulus = pos.clone();
      this.stimulusAge = 0;
      if (this.state === 'patrol' || this.state === 'search') this.state = 'investigate';
      if (d < radius * 0.45 || this.state === 'hunt') { this.state = 'hunt'; }
      return true;
    }
    return false;
  }
  update(dt, world) {
    const C = CONFIG.warden;
    const p = this.root.position;
    const player = world.player;
    this.stimulusAge += dt;
    this.stepEvent = false;
    if (this.seizing) return;                 // frozen mid-grab; the frame loop drives the pose
    if (this.frozen > 0) { this.frozen -= dt; this.poseBody(dt, world.time, 0, true); return; }
    const prevHunting = this.state === 'hunt' || this.state === 'lunge';
    // the task he was set to — hauling, hanging, sweeping — when nothing else calls
    if (this.task && (this.state === 'patrol')) this.task(dt, world);

    // lantern held high is a beacon to his eye
    if (player.lanternUp && !player.hidden) {
      const d = p.distanceTo(player.pos);
      if (d < 8.5) { this.stimulus = player.pos.clone(); this.stimulusAge = 0; this.state = 'hunt'; }
    }
    // point blank: he feels her breath
    if (!player.hidden && p.distanceTo(player.pos) < 1.5 && player.moveMode !== 'crawl') {
      this.stimulus = player.pos.clone(); this.stimulusAge = 0; this.state = 'hunt';
    }

    let speed = 0, target = null;
    if (this.state === 'patrol') {
      const wp = this.waypoints[this.wpIndex];
      target = new THREE.Vector3(wp.x, 0, wp.z);
      speed = C.patrolSpeed;
      if (p.distanceTo(target) < 0.4) {
        this.waitT += dt;
        if (this.waitT > (wp.wait || 1.5)) { this.waitT = 0; this.wpIndex = (this.wpIndex + 1) % this.waypoints.length; }
        speed = 0;
      }
    } else if (this.state === 'investigate') {
      target = this.stimulus; speed = C.investigateSpeed;
      if (target && p.distanceTo(target) < 0.7) { this.state = 'search'; this.searchT = 0; }
      if (this.stimulusAge > C.loseInterest) this.state = 'patrol';
    } else if (this.state === 'search') {
      this.searchT += dt; speed = 0;
      if (this.searchT > 3.5) this.state = 'patrol';
    } else if (this.state === 'hunt') {
      if (!player.hidden) { this.stimulus = player.pos.clone(); this.stimulusAge = 0; }
      target = this.stimulus; speed = C.huntSpeed;
      const d = p.distanceTo(player.pos);
      if (!player.hidden && d < 2.4 && this.lungeT <= 0 && this.recoverT <= 0) {
        this.state = 'lunge'; this.lungeT = 0.32; // windup
        world.onEvent('wardenLunge', p);
      }
      if (this.stimulusAge > C.loseInterest) { this.state = 'search'; this.searchT = 0; }
      if (target && player.hidden && p.distanceTo(target) < 0.8) { this.state = 'search'; this.searchT = 0; }
    } else if (this.state === 'lunge') {
      this.lungeT -= dt;
      if (this.lungeT <= 0 && this.lungeT > -0.42) {
        // the dash itself
        const dir = new THREE.Vector3().subVectors(player.pos, p); dir.y = 0;
        if (dir.lengthSq() > 0.001) dir.normalize();
        p.addScaledVector(dir, 7.2 * dt);
        if (!player.hidden && p.distanceTo(player.pos) < C.grabRange + 0.35) world.killPlayer('warden', this);
      } else if (this.lungeT <= -0.42) {
        this.state = 'hunt'; this.recoverT = 1.1;
      }
      speed = 0; target = null;
    }
    this.recoverT = Math.max(0, this.recoverT - dt);

    // walk toward target
    let moving = 0;
    if (target && speed > 0) {
      const dir = new THREE.Vector3().subVectors(target, p); dir.y = 0;
      const dist = dir.length();
      if (dist > 0.05) {
        dir.normalize();
        const bounds = this.opts.bounds;
        p.addScaledVector(dir, Math.min(speed, dist / dt) * dt);
        if (bounds) { p.x = clamp(p.x, bounds[0], bounds[1]); }
        p.z = clamp(p.z, -2.0, 2.0);
        const targetAngle = Math.atan2(dir.x, dir.z);
        let dd = targetAngle - this.faceAngle;
        while (dd > Math.PI) dd -= Math.PI * 2;
        while (dd < -Math.PI) dd += Math.PI * 2;
        this.faceAngle += dd * Math.min(1, dt * 3.2);
        moving = speed;
        const prev = this.phase;
        this.phase += speed * dt * 1.15;
        if (Math.floor(this.phase / Math.PI) !== Math.floor(prev / Math.PI)) {
          this.stepEvent = true;
          world.onEvent('wardenStep', p, this.state === 'hunt' ? 1 : 0.6);
        }
      }
    }
    // catch on contact while hunting
    if (this.state === 'hunt' && !player.hidden && p.distanceTo(player.pos) < C.grabRange) world.killPlayer('warden', this);
    // the moment he first fixes on her — a bark and the strings drop in
    const nowHunting = this.state === 'hunt' || this.state === 'lunge';
    if (nowHunting && !prevHunting) world.onEvent('wardenSpot', p);
    this.root.rotation.y = this.faceAngle;
    this.poseBody(dt, world.time, moving);
  }
  /* The grab: he stoops, folds her up in one hand, lifts her to the milk-eye.
     Her body is scripted onto a rising arc; the arm poses to follow her. */
  seize(dt, eight, t, world) {
    const j = this.j, k = Math.min(1, dt * 9), p = this.root.position;
    const side = (eight.capturedX ?? eight.root.position.x) >= p.x ? 1 : -1;
    this.faceAngle = damp(this.faceAngle, side > 0 ? Math.PI / 2 : -Math.PI / 2, 9, dt);
    this.root.rotation.y = this.faceAngle;
    const reach = smoothstep(0, 0.5, t);        // stoop and reach down
    const lift = smoothstep(0.55, 1.4, t);      // haul her up to his face
    // arm rakes down to her, then folds up
    j.spine.rotation.x = lerp(j.spine.rotation.x, 0.98 - lift * 0.55, k);
    j.armR.sh.rotation.x = lerp(j.armR.sh.rotation.x, lerp(0.15, -1.35, lift), k);
    j.armR.sh.rotation.z = lerp(j.armR.sh.rotation.z, -0.45 - side * 0.15, k);
    j.armR.el.rotation.x = lerp(j.armR.el.rotation.x, lerp(-0.1, -2.0, lift), k);
    j.armR.wrist.rotation.x = lerp(j.armR.wrist.rotation.x, -0.5, k);
    j.head.rotation.x = lerp(j.head.rotation.x, 0.1 - lift * 0.35, k);
    j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, -0.3 + reach * 0.2, k);
    // scripted pickup arc: from where she was caught, up to chest/face height, drawn in
    const groundY = eight.capturedY ?? 0.05;
    const targetY = groundY + lift * 2.35;                    // rise to ~2.4m at his chest
    const targetX = p.x + side * lerp(0.75, 0.42, lift);       // drawn in toward the body
    eight.root.position.x = damp(eight.root.position.x, targetX, 10, dt);
    eight.root.position.y = damp(eight.root.position.y, targetY, 10, dt);
    eight.root.position.z = damp(eight.root.position.z, p.z + 0.35, 8, dt);
    eight.root.rotation.z = damp(eight.root.rotation.z, side * 0.6, 6, dt);
    eight.j.legL.hip.rotation.x = Math.sin(t * 11) * 0.5 * (1 - lift * 0.7);
    eight.j.legR.hip.rotation.x = -Math.sin(t * 11) * 0.5 * (1 - lift * 0.7);
    this.poseBody(dt, world.time, 0);
  }
  poseBody(dt, t, moving, frozenPose = false) {
    const j = this.j, ph = this.phase;
    const k = Math.min(1, dt * 7);
    const hunting = this.state === 'hunt' || this.state === 'lunge';
    // when stopped on his rounds he stoops to his work — hauling, groping the dark for children
    const busy = !hunting && !frozenPose && moving <= 0 && this.state === 'patrol';
    if (busy) {
      const w = Math.sin(t * 1.3), w2 = Math.sin(t * 1.3 + 1.4);
      j.pelvis.position.y = lerp(j.pelvis.position.y, 1.42, k);
      j.spine.rotation.x = lerp(j.spine.rotation.x, 1.15 + w * 0.08, k);
      j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, -1.5 + w * 0.5, k);
      j.armR.sh.rotation.x = lerp(j.armR.sh.rotation.x, -1.5 + w2 * 0.5, k);
      j.armL.sh.rotation.z = lerp(j.armL.sh.rotation.z, 0.4, k);
      j.armR.sh.rotation.z = lerp(j.armR.sh.rotation.z, -0.4, k);
      j.armL.el.rotation.x = lerp(j.armL.el.rotation.x, -0.9, k);
      j.armR.el.rotation.x = lerp(j.armR.el.rotation.x, -0.9, k);
      j.head.rotation.x = lerp(j.head.rotation.x, 0.3, k);
      j.head.rotation.y = lerp(j.head.rotation.y, Math.sin(t * 0.9) * 0.4, k);
      j.legL.hip.rotation.x = lerp(j.legL.hip.rotation.x, 0, k);
      j.legR.hip.rotation.x = lerp(j.legR.hip.rotation.x, 0, k);
      this.eyeLight.intensity = 22 * (0.9 + 0.1 * Math.sin(t * 6));
      return;
    }
    const sway = Math.sin(ph) * (moving > 0 ? 1 : 0);
    j.pelvis.position.y = lerp(j.pelvis.position.y, 1.55 + Math.abs(Math.cos(ph)) * 0.045 * (moving > 0 ? 1 : 0), k);
    j.pelvis.rotation.z = lerp(j.pelvis.rotation.z, sway * 0.06, k);
    j.spine.rotation.x = lerp(j.spine.rotation.x, frozenPose ? 0.2 : (hunting ? 0.94 : 0.62) + Math.sin(t * 0.6) * 0.02, k);
    j.legL.hip.rotation.x = lerp(j.legL.hip.rotation.x, sway * 0.5, k);
    j.legR.hip.rotation.x = lerp(j.legR.hip.rotation.x, -sway * 0.5, k);
    j.legL.knee.rotation.x = lerp(j.legL.knee.rotation.x, Math.max(0, -Math.sin(ph)) * 0.7, k);
    j.legR.knee.rotation.x = lerp(j.legR.knee.rotation.x, Math.max(0, Math.sin(ph)) * 0.7, k);
    // arms: knuckle-dragging pendulums; in hunt they rake forward
    const armBase = hunting ? -0.85 : -0.12;
    j.armL.sh.rotation.x = lerp(j.armL.sh.rotation.x, armBase + sway * 0.32, k);
    j.armR.sh.rotation.x = lerp(j.armR.sh.rotation.x, armBase - sway * 0.32, k);
    j.armL.sh.rotation.z = lerp(j.armL.sh.rotation.z, 0.12 + (hunting ? 0.35 : 0), k);
    j.armR.sh.rotation.z = lerp(j.armR.sh.rotation.z, -0.12 - (hunting ? 0.35 : 0), k);
    j.armL.el.rotation.x = lerp(j.armL.el.rotation.x, hunting ? -0.5 : -0.06, k);
    j.armR.el.rotation.x = lerp(j.armR.el.rotation.x, hunting ? -0.5 : -0.06, k);
    j.armL.wrist.rotation.x = lerp(j.armL.wrist.rotation.x, 0.4, k);
    j.armR.wrist.rotation.x = lerp(j.armR.wrist.rotation.x, 0.4, k);
    // head casts about, hunting for sound
    const scan = this.state === 'search' || this.state === 'investigate' ? Math.sin(t * 1.4) * 0.8 : Math.sin(t * 0.5) * 0.22;
    j.head.rotation.y = lerp(j.head.rotation.y, scan, k * 0.7);
    j.head.rotation.x = lerp(j.head.rotation.x, hunting ? -0.25 : 0.15, k);
    this.eyeLight.intensity = (hunting ? 68 : 30) * (0.9 + 0.1 * Math.sin(t * 17) + 0.06 * NOISE(t * 5, 8));
    if (this.frozen > 0) this.eyeLight.intensity = 8;
  }
  dispose() { this.root.traverse(o => { if (o.isMesh) o.geometry.dispose(); }); }
}

class RendererTwin {

      const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.034, 0.9, 72), MAT.wax);
      fore.position.y = -0.45; el.add(fore);
      const wrist = new THREE.Group(); wrist.position.y = -0.9; el.add(wrist);
      const handParts = [xformGeo(new THREE.BoxGeometry(0.16, 0.2, 0.05, 2, 2, 1), 0, -0.1, 0)];
      for (let f = 0; f < 5; f++) {
