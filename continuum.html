 {id:'HALFTONE',role:'Breaker',acc:['paper','ink'],hp:175,armor:0,shield:25,

 {id:'LULLABY',role:'Mender',acc:['cyan','violet'],hp:200,armor:0,shield:25,

  primary:'TUNING FORK',q:'RESONANCE PULSE',e:'DISSONANCE',x:'HUSH'},
 {id:'VERDANT',role:'Mender',acc:['acid','paper'],hp:200,armor:0,shield:0,

  primary:'SEED POD',q:'BRAMBLE ZONE',e:'VINE PULL',x:'BLOOMFALL'}
];
const HERO_BY_ID={};for(let i=0;i<ROSTER.length;i++)HERO_BY_ID[ROSTER[i].id]=ROSTER[i];

const MAPS=[
 {id:'FERROUS POINT',mode:'DOCK ESCORT / PAYLOAD'},
 {id:'NEON CATHEDRAL',mode:'CONTROL POINT / VERTICALITY'},
 {id:'SPLITROCK OBSERVATORY',mode:'HYBRID / CAPTURE THEN PUSH'}
];

const COMBOS=[
 {id:'SUPERHEATED',a:'TECTON',b:'SOLSTICE'},
 {id:'PIN AND PUNISH',a:'RIVET',b:'NOCTURN'},
 {id:'DEAD AIR',a:'VOLTAIC',b:'LULLABY'},
 {id:'IGNITION',a:'HALFTONE',b:'SOLSTICE'},
 {id:'SPORE BURST',a:'VERDANT',b:'TECTON'},
 {id:'LIVE COVER',a:'RIVET',b:'VOLTAIC'}
];

const CURRENCY='SHARDS';

const CONTROLS=[['MOVE','W A S D'],['LOOK','ARROWS / DRAG'],['JUMP','SPACE'],
 ['ABILITY','Q E SHIFT F'],['ULTIMATE','X'],['SHOP','B'],['SCORE','TAB'],
 ['HERO PREVIEW','1..8'],['3RD PERSON','V']];

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setClearColor(PAL.paper,1);
renderer.autoClear=false;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(PAL.paper);
scene.fog=new THREE.Fog(PAL.paper,70,260);
const camera=new THREE.PerspectiveCamera(90,window.innerWidth/window.innerHeight,0.05,600);
camera.rotation.order='YXZ';

const vmScene=new THREE.Scene();
const vmCamera=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.01,12);

function addLights(s,keyDir){
  const hemi=new THREE.HemisphereLight(PAL.paper,PAL.violet,0.36);
  s.add(hemi);
  const key=new THREE.DirectionalLight(PAL.paper,0.74);
  key.position.copy(keyDir);
  s.add(key);
  const fill=new THREE.DirectionalLight(PAL.cyan,0.16);
  fill.position.set(-keyDir.x,keyDir.y*0.4,-keyDir.z);
  s.add(fill);
  const under=new THREE.DirectionalLight(PAL.violet,0.20);
  under.position.set(0,-1,0);
  s.add(under);
}
addLights(scene,new THREE.Vector3(0.55,1,0.35));
addLights(vmScene,new THREE.Vector3(0.4,0.8,0.9));

const GEO={};
function key(){let s='';for(let i=0;i<arguments.length;i++)s+=(Math.round(arguments[i]*1e4)/1e4)+'_';return s;}
function gBox(w,h,d){const k='B'+key(w,h,d);if(!GEO[k])GEO[k]=new THREE.BoxGeometry(w,h,d);return GEO[k];}
function gCyl(rt,rb,h,seg){seg=seg||8;const k='C'+key(rt,rb,h,seg);
  if(!GEO[k]){const g=new THREE.CylinderGeometry(rt,rb,h,seg);g.translate(0,h/2,0);GEO[k]=g;}return GEO[k];}
function gCylC(rt,rb,h,seg){seg=seg||10;const k='K'+key(rt,rb,h,seg);
  if(!GEO[k])GEO[k]=new THREE.CylinderGeometry(rt,rb,h,seg);return GEO[k];}
function gSph(r,seg){seg=seg||8;const k='S'+key(r,seg);
  if(!GEO[k])GEO[k]=new THREE.SphereGeometry(r,seg,Math.max(4,seg>>1));return GEO[k];}
function gCylD(rt,rb,h,seg){seg=seg||8;const k='D'+key(rt,rb,h,seg);
  if(!GEO[k]){const g=new THREE.CylinderGeometry(rt,rb,h,seg);g.translate(0,-h*0.5,0);GEO[k]=g;}return GEO[k];}
function gCone(r,h,seg){seg=seg||8;const k='N'+key(r,h,seg);
  if(!GEO[k]){const g=new THREE.ConeGeometry(r,h,seg);g.translate(0,h/2,0);GEO[k]=g;}return GEO[k];}

const MATS={};
function mat(c){if(!MATS[c])MATS[c]=new THREE.MeshLambertMaterial({color:c});return MATS[c];}
const EMATS={};
function emat(c){if(!EMATS[c])EMATS[c]=new THREE.MeshLambertMaterial({color:0x000000,emissive:c});return EMATS[c];}
const INK_HULL=new THREE.MeshLambertMaterial({color:0x000000,emissive:PAL.ink,side:THREE.BackSide});

function outline(mesh,s){
  const o=new THREE.Mesh(mesh.geometry,INK_HULL);
  const k=s||1.03;o.scale.set(k,k,k);o.matrixAutoUpdate=false;o.updateMatrix();
  mesh.add(o);return o;
}

const COL=[];
function collider(x,y,z,w,h,d){
  COL.push({ax:x-w*0.5,bx:x+w*0.5,ay:y-h*0.5,by:y+h*0.5,az:z-d*0.5,bz:z+d*0.5});
}

const worldGroup=new THREE.Group();scene.add(worldGroup);
function block(w,h,d,x,y,z,c,opt){
  opt=opt||0;
  const m=new THREE.Mesh(gBox(w,h,d),mat(c));
  m.position.set(x,y,z);
  worldGroup.add(m);
  if(!(opt&1))outline(m,1+Math.min(0.05,0.11/Math.max(w,h,d)));
  if(!(opt&2))collider(x,y,z,w,h,d);
  m.matrixAutoUpdate=false;m.updateMatrix();
  return m;
}
function stairs(x,y,z,w,run,steps,rise,dir,c){
  for(let i=0;i<steps;i++){
    const h=rise*(i+1);
    const px=dir===0?x+(i+0.5)*run:(dir===2?x-(i+0.5)*run:x);
    const pz=dir===1?z+(i+0.5)*run:(dir===3?z-(i+0.5)*run:z);
    const sw=(dir===0||dir===2)?run:w, sd=(dir===0||dir===2)?w:run;
    block(sw,h,sd,px,y+h*0.5,pz,c);
  }
}

const packs=[];
function healthPack(x,y,z){
  const g=new THREE.Group();g.position.set(x,y+0.45,z);
  const a=new THREE.Mesh(gBox(0.9,0.28,0.28),mat(PAL.paper));g.add(a);outline(a,1.06);
  const b=new THREE.Mesh(gBox(0.28,0.9,0.28),mat(PAL.paper));g.add(b);outline(b,1.06);
  const c=new THREE.Mesh(gBox(0.34,0.34,0.34),emat(PAL.red));g.add(c);
  worldGroup.add(g);
  packs.push({g:g,active:true,t:0,x:x,y:y,z:z});
}

function decal(w,d,x,y,z,c,rot){
  const m=new THREE.Mesh(gBox(w,0.04,d),mat(c));
  m.position.set(x,y+0.02,z);if(rot)m.rotation.y=rot;
  m.matrixAutoUpdate=false;m.updateMatrix();worldGroup.add(m);
}
function panelDecal(x,y,z,w,h,ry,c){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry||0;
  const p=new THREE.Mesh(gBox(w,h,0.08),mat(PAL.paper));g.add(p);outline(p,1.03);
  const s=new THREE.Mesh(gBox(w*0.62,h*0.2,0.14),emat(c));s.position.set(0,h*0.22,0.04);g.add(s);
  const s2=new THREE.Mesh(gBox(w*0.34,h*0.16,0.14),emat(PAL.ink));s2.position.set(-w*0.12,-h*0.2,0.04);g.add(s2);
  g.updateMatrix();worldGroup.add(g);
}

function buildFerrousPoint(){
  block(180,2,120,0,-1,0,PAL.ink,0);
  for(let i=-4;i<=4;i++)decal(178,0.5,0,0,i*13,PAL.ink);
  for(let i=-20;i<=20;i++)decal(1.6,2.4,i*5,0,0,PAL.gold);
  decal(6,6,-52,0,0,PAL.cyan);decal(6,6,52,0,0,PAL.red);

  const CY=PAL.cyan,RD=PAL.red,PP=PAL.paper,IK=PAL.ink,GD=PAL.gold;
  for(const side of [-1,1]){
    const sx=side*64,c=side<0?CY:RD;
    block(1.6,10,36,sx+side*11,5,0,IK,0);
    block(24,1.2,2.0,sx,9.4,-17,PP,0);
    block(24,1.2,2.0,sx,9.4,17,PP,0);
    block(22,10,1.6,sx,5,-17.2,PP,0);
    block(22,10,1.6,sx,5,17.2,PP,0);
    block(24,1.0,36,sx,10.5,0,PP,0);
    block(1.6,10,10,sx-side*11,5,-14,PP,0);
    block(1.6,10,10,sx-side*11,5,14,PP,0);
    decal(18,3.6,sx,0,0,c);
    block(3,6,0.6,sx,3,-16.2,c,2);
    block(3,6,0.6,sx,3,16.2,c,2);
    healthPack(sx+side*3,0,-9);
    healthPack(sx+side*3,0,9);
    panelDecal(sx+side*10.0,5.6,0,7,4,side<0?-Math.PI*0.5:Math.PI*0.5,c);
  }

  block(3,14,30,-40,7,-33,PP,0);
  block(3,14,30,40,7,33,PP,0);
  block(3,10,26,-38,5,34,PP,0);
  block(3,10,26,38,5,-34,PP,0);

  block(2.2,11,26,0,5.5,-30,PP,0);
  block(2.2,11,26,0,5.5,30,PP,0);
  block(2.2,11,10,0,5.5,-12,PP,0);
  block(2.2,11,10,0,5.5,12,PP,0);
  block(2.2,2.2,10,0,9.9,0,GD,0);
  panelDecal(1.4,6,-17.4,6,5,0,GD);
  panelDecal(-1.4,6,17.4,6,5,Math.PI,GD);

  block(30,0.7,10,0,11.4,0,PP,0);
  block(30,1.5,0.5,0,12.4,-4.9,IK,0);
  block(30,1.5,0.5,0,12.4,4.9,IK,0);
  stairs(-27,0,-12,7,1.1,10,1.14,0,PP);
  stairs(27,0,12,7,1.1,10,1.14,2,PP);
  block(6,11.4,12,-17,5.7,-9,PP,0);
  block(6,11.4,12,17,5.7,9,PP,0);
  healthPack(0,11.75,0);

  const crates=[[-30,0,14],[-27,0,17],[-30,2.6,15.5],[-18,0,-20],[-15,0,-23],
   [-18,2.6,-21.5],[16,0,20],[19,0,23],[16,2.6,21.5],[28,0,-16],[25,0,-19],
   [28,2.6,-17.5],[-8,0,-38],[8,0,38],[-46,0,-24],[46,0,24],[-22,0,34],[22,0,-34]];
  for(let i=0;i<crates.length;i++){
    const c=crates[i];
    block(2.6,2.6,2.6,c[0],c[1]+1.3,c[2],i%3===0?GD:PP,0);
  }

  for(const s of [-1,1]){

const POSE_KEYS=['px','py','pz','rx','ry','rz','wx','wy','wz','c0','c1','c2','c3','tc','ts','sp'];
function newPose(src){
  const o={};
  for(let i=0;i<POSE_KEYS.length;i++){const k=POSE_KEYS[i];o[k]=(src&&src[k]!==undefined)?src[k]:0;}
  if(src&&src.c){for(let i=0;i<4;i++)o['c'+i]=src.c[i];}
  return o;
}
function poseCopy(a,b){for(let i=0;i<POSE_KEYS.length;i++)b[POSE_KEYS[i]]=a[POSE_KEYS[i]];}
function poseLerp(cur,tgt,k){for(let i=0;i<POSE_KEYS.length;i++){const K=POSE_KEYS[i];cur[K]+=(tgt[K]-cur[K])*k;}}
function poseAdd(cur,add,w){for(let i=0;i<POSE_KEYS.length;i++){const K=POSE_KEYS[i];cur[K]+=add[K]*w;}}

function applyPose(h,p){
  const s=h.s;
  h.root.position.set((h.bx+p.px)*s,h.by+p.py,h.bz+p.pz);
  h.root.rotation.set(h.brx+p.rx,(h.bry+p.ry)*s,(h.brz+p.rz)*s);
  h.wrist.rotation.set(p.wx,p.wy*s,p.wz*s);
  for(let i=0;i<4;i++){
    const c=p['c'+i],j=h.f[i];
    j[0].rotation.x=0.07+c*1.00;
    j[0].rotation.z=-FING[i].sp*(0.05+p.sp*0.15)*s;
    j[1].rotation.x=0.10+c*1.36;
    j[2].rotation.x=0.05+c*0.90;
  }
  h.tb[0].rotation.set(0.22+p.tc*0.22,(0.70-p.ts*0.18)*s,(-0.95+p.ts*0.40)*s);
  h.tb[1].rotation.x=0.12+p.tc*0.82;
  h.tb[2].rotation.x=0.10+p.tc*0.72;
}

function buildHumanoid(id){
  const cfg=BODY[id],sk=cfg.skin,su=cfg.suit,tr=cfg.trim;
  const b=cfg.bulk,sw=cfg.sw,swm=1+(sw-1)*0.55;
  const root=new THREE.Group();
  const R={};
  root.scale.setScalar(cfg.h/1.80);

  R.hips=pivot(root,0,0.92,0);
  jointS(R.hips,0.098*b,su,1.24,0.80,0.96);
  boxAt(R.hips,0.208*b,0.140,0.156*b,0,-0.048,0,su);
  boxAt(R.hips,0.194*b,0.044,0.150*b,0,0.024,0,tr);

  R.spine1=pivot(R.hips,0,0.070,0);
  const ab1=limbU(R.spine1,0.100,0.104*b,0.116*b,su);ab1.scale.z=0.86;
  R.spine2=pivot(R.spine1,0,0.100,0);
  const ab2=limbU(R.spine2,0.106,0.116*b,0.134*b,su);ab2.scale.z=0.84;

  R.chest=pivot(R.spine2,0,0.106,0);
  const rib=limbU(R.chest,0.222,0.136*b,0.172*b*swm,su);rib.scale.z=0.76;
  const trap=jointS(R.chest,0.168*b*swm,su,1.0,0.60,0.78);trap.position.y=0.196;
  for(let i=0;i<2;i++){
    const s=i===0?1:-1;
    const pec=boxAt(R.chest,0.104*b,0.082,0.050*b,s*0.060*b,0.164,-0.076*b,su);
    pec.rotation.x=0.22;
    const lat=jointS(R.chest,0.068*b,su,0.72,1.55,0.70);
    lat.position.set(s*0.128*b*swm,0.108,0.010);
  }
  boxAt(R.chest,0.120*b,0.048,0.034,0,0.068,-0.102*b,tr);

  R.neck=pivot(R.chest,0,0.234,0);
  limbU(R.neck,0.072,0.052*b,0.048*b,sk);
  R.head=pivot(R.neck,0,0.072,0.004);
  R.head.scale.setScalar(7.5/cfg.heads);
  buildHead(R.head,cfg);
  SHELLS[cfg.shell](R.head,cfg);

  R.clav=[];R.uarm=[];R.farm=[];R.hand=[];R.fing=[];
  for(let i=0;i<2;i++){
    const s=i===0?1:-1;
    const cl=pivot(R.chest,s*0.058*swm,0.196,0);
    jointS(cl,0.058*b,su,1,0.8,1);
    limbD(cl,0.022,0.058*b,0.064*b,su);
    const ua=pivot(cl,s*0.170*b*sw,0.004,0);
    jointS(ua,0.080*b,su,1.08,1.22,1.02);
    limbD(ua,0.292,0.070*b,0.050*b,su);
    const bi=jointS(ua,0.058*b,su,1.0,1.6,0.95);bi.position.set(0,-0.110,-0.012);
    const fa=pivot(ua,0,-0.292,0);
    jointS(fa,0.052*b,sk);
    limbD(fa,0.262,0.052*b,0.036*b,sk);
    const hn=pivot(fa,0,-0.262,0);
    jointS(hn,0.040*b,su);
    boxAt(hn,0.070*b,0.098,0.044*b,0,-0.052,0,su);
    const fg=[];
    for(let f=0;f<4;f++){
      const g=pivot(hn,(f-1.5)*0.021*b,-0.100,0);
      limbD(g,0.052,0.011*b,0.008*b,su,1.08);fg.push(g);
    }
    const th=pivot(hn,s*0.034*b,-0.064,0.012);
    th.rotation.z=-s*0.7;limbD(th,0.040,0.012*b,0.009*b,su,1.08);fg.push(th);
    ua.rotation.z=s*(0.07+cfg.stance);
    fa.rotation.x=-0.18;
    R.clav.push(cl);R.uarm.push(ua);R.farm.push(fa);R.hand.push(hn);R.fing.push(fg);
  }

  R.thigh=[];R.shin=[];R.foot=[];R.toe=[];
  for(let i=0;i<2;i++){
    const s=i===0?1:-1;
    const tg=pivot(R.hips,s*0.090*b,-0.058,0);
    jointS(tg,0.086*b,su,1,1.04,1);
    limbD(tg,0.455,0.094*b,0.064*b,su);
    const q=jointS(tg,0.074*b,su,1.0,1.5,0.94);q.position.set(0,-0.150,-0.012);
    const sh=pivot(tg,0,-0.455,0);
    jointS(sh,0.064*b,su);
    limbD(sh,0.375,0.068*b,0.044*b,su);
    const cf=jointS(sh,0.056*b,su,0.90,1.55,0.85);cf.position.set(0,-0.112,0.026);
    const ft=pivot(sh,0,-0.375,0);
    jointS(ft,0.046*b,tr);
    boxAt(ft,0.108*b,0.086,0.212,0,-0.042,-0.048,tr);
    const to=pivot(ft,0,-0.068,-0.140);
    boxAt(to,0.104*b,0.056,0.076,0,-0.014,-0.032,tr);
    tg.rotation.z=s*0.03;
    R.thigh.push(tg);R.shin.push(sh);R.foot.push(ft);R.toe.push(to);
  }

  if(cfg.crouch){
    R.hips.position.y-=cfg.crouch;
    for(let i=0;i<2;i++){
      R.thigh[i].rotation.x=cfg.crouch*2.7;
      R.shin[i].rotation.x=-cfg.crouch*5.0;
      R.foot[i].rotation.x=cfg.crouch*2.3;
    }
  }
  if(cfg.lean){R.spine1.rotation.x=cfg.lean*0.30;R.spine2.rotation.x=cfg.lean*0.34;R.neck.rotation.x=-cfg.lean*0.52;}
  if(KITS[id])KITS[id](R,cfg);

  const hum={id:id,root:root,rig:R,cfg:cfg,t:Math.random()*6,
    aimY:0,aimX:0,hit:0,hitSide:1,cast:null,castT:0,castDur:0.4,swing:0,
    speed:0,strafe:0,air:0,vy:0,land:0,deadT:0,hp:100,hpMax:100};
  capturePivots(hum);
  HUMANS.push(hum);
  return hum;
}

function capturePivots(h){
  const P=[],R=h.rig;
  function pu(o){P.push({o:o,x:o.rotation.x,y:o.rotation.y,z:o.rotation.z});}
  pu(R.hips);pu(R.spine1);pu(R.spine2);pu(R.chest);pu(R.neck);pu(R.head);
  for(let i=0;i<2;i++){
    pu(R.clav[i]);pu(R.uarm[i]);pu(R.farm[i]);pu(R.hand[i]);
    pu(R.thigh[i]);pu(R.shin[i]);pu(R.foot[i]);pu(R.toe[i]);
  }
  h.pv=P;h.hipY=R.hips.position.y;h.cyc=0;
}
function resetRig(h){
  const P=h.pv;
  for(let i=0;i<P.length;i++){const p=P[i];p.o.rotation.set(p.x,p.y,p.z);}
  h.rig.hips.position.y=h.hipY;h.rig.hips.position.x=0;h.rig.hips.position.z=0;
  h.root.rotation.x=0;h.root.rotation.z=0;
}

function animateHumanoid(h,dt){
  h.t+=dt;
  resetRig(h);
  if(h.deadT>0){h.deadT+=dt;poseDeath(h);return;}
  const R=h.rig,sp=h.speed||0;
  if(h.land>0)h.land=Math.max(0,h.land-dt*4.0);
  if(h.air>0){poseAir(h);}
  else if(sp>0.45){poseWalk(h,dt,sp,sp>7.2);}
  else{poseIdle(h,dt);}
  if(h.land>0)poseLand(h);

  const st=Math.max(-1,Math.min(1,h.strafe||0));
  R.hips.rotation.z+=-st*0.13;R.chest.rotation.z+=st*0.07;R.head.rotation.z+=st*0.05;

  const ax=Math.max(-1.2,Math.min(1.2,h.aimX||0)),ay=Math.max(-1.5,Math.min(1.5,h.aimY||0));
  R.spine1.rotation.x+=ax*0.10;R.spine2.rotation.x+=ax*0.16;
  R.chest.rotation.x+=ax*0.26;R.neck.rotation.x+=ax*0.22;R.head.rotation.x+=ax*0.34;
  R.spine1.rotation.y+=ay*0.12;R.spine2.rotation.y+=ay*0.18;
  R.chest.rotation.y+=ay*0.30;R.head.rotation.y+=ay*0.36;

  if(h.cast){
    h.castT+=dt;
    const p=h.castT/h.castDur;
    if(p>=1){h.cast=null;}
    else{
      const tab=CASTS[h.id],fn=(tab&&tab[h.cast])||CAST_DEFAULT;
      fn(R,p,bell(p),h);
    }
  }
  if(h.hit>0){
    h.hit=Math.max(0,h.hit-dt*2.4);
    const q=h.hit,osc=Math.sin(q*24)*q;
    R.spine2.rotation.y+=osc*0.45*h.hitSide;
    R.chest.rotation.x+=-q*0.34;R.head.rotation.x+=-q*0.46;
    R.head.rotation.z+=osc*0.55*h.hitSide;
    for(let i=0;i<2;i++)R.uarm[i].rotation.x+=q*0.30;
  }
}

const PR=0.36,PH=1.80,EYE=1.62;
function canStand(x,y,z){
  for(let i=0;i<COL.length;i++){const c=COL[i];
    if(x+PR<=c.ax||x-PR>=c.bx)continue;
    if(y+PH<=c.ay||y>=c.by)continue;
    if(z+PR<=c.az||z-PR>=c.bz)continue;
    return false;}
  return true;
}
function sweep(ax,amt){
  const p=player.pos;p[ax]+=amt;
  for(let i=0;i<COL.length;i++){
    const c=COL[i];
    if(p.x+PR<=c.ax||p.x-PR>=c.bx)continue;
    if(p.y+PH<=c.ay||p.y>=c.by)continue;
    if(p.z+PR<=c.az||p.z-PR>=c.bz)continue;
    if(ax==='y'){
      if(amt>0){p.y=c.ay-PH;}else{p.y=c.by;player.grounded=true;player.coyote=0.12;}
      player.vel.y=0;
    }else{
      const rise=c.by-p.y;
      if(rise>0.02&&rise<=0.62&&canStand(p.x,c.by,p.z)){p.y=c.by;continue;}
      if(ax==='x'){p.x=amt>0?c.ax-PR:c.bx+PR;player.vel.x=0;}
      else{p.z=amt>0?c.az-PR:c.bz+PR;player.vel.z=0;}
    }
  }
}

function rayBox(ox,oy,oz,dx,dy,dz,c,maxT){
  let t0=0,t1=maxT;
  let ta,tb,q;
  if(Math.abs(dx)<1e-6){if(ox<c.ax||ox>c.bx)return -1;}
  else{ta=(c.ax-ox)/dx;tb=(c.bx-ox)/dx;if(ta>tb){q=ta;ta=tb;tb=q;}
    if(ta>t0)t0=ta;if(tb<t1)t1=tb;if(t0>t1)return -1;}
  if(Math.abs(dy)<1e-6){if(oy<c.ay||oy>c.by)return -1;}
  else{ta=(c.ay-oy)/dy;tb=(c.by-oy)/dy;if(ta>tb){q=ta;ta=tb;tb=q;}
    if(ta>t0)t0=ta;if(tb<t1)t1=tb;if(t0>t1)return -1;}
  if(Math.abs(dz)<1e-6){if(oz<c.az||oz>c.bz)return -1;}
  else{ta=(c.az-oz)/dz;tb=(c.bz-oz)/dz;if(ta>tb){q=ta;ta=tb;tb=q;}
    if(ta>t0)t0=ta;if(tb<t1)t1=tb;if(t0>t1)return -1;}
  return t0;
}
function worldBlocked(ox,oy,oz,dx,dy,dz,dist){
  for(let i=0;i<COL.length;i++){
    const t=rayBox(ox,oy,oz,dx,dy,dz,COL[i],dist);
    if(t>=0&&t<dist)return true;
  }
  return false;
}
function raySphere(ox,oy,oz,dx,dy,dz,cx,cy,cz,r){
  const ex=cx-ox,ey=cy-oy,ez=cz-oz;
  const t=ex*dx+ey*dy+ez*dz;
  if(t<0)return -1;
  const d2=ex*ex+ey*ey+ez*ez-t*t,rr=r*r;
  if(d2>rr)return -1;
  return t-Math.sqrt(rr-d2);
}
function pickTarget(range,wantTeam){
  camera.getWorldDirection(_fw);
  const o=camera.position;
  let best=null,bt=range,head=false;
  for(let i=0;i<TARGETS.length;i++){
    const g=TARGETS[i];
    if(g.deadT>0)continue;
    if(wantTeam&&g.team!==wantTeam)continue;
    const gx=g.root.position.x,gy=g.root.position.y,gz=g.root.position.z;
    let t=raySphere(o.x,o.y,o.z,_fw.x,_fw.y,_fw.z,gx,gy+1.66,gz,0.26);
    let hd=true;
    if(t<0||t>bt){t=raySphere(o.x,o.y,o.z,_fw.x,_fw.y,_fw.z,gx,gy+1.05,gz,0.48);hd=false;}
    if(t>=0&&t<bt){best=g;bt=t;head=hd;}
  }
  if(best&&worldBlocked(o.x,o.y,o.z,_fw.x,_fw.y,_fw.z,bt-0.15))return null;
  return best?{g:best,t:bt,head:head}:null;
}

function hurt(g,amt,head){

  const dmg=head?amt*2:amt;
  g.hp-=dmg;

  popDamage(g.root.position.x,g.root.position.y+1.5,g.root.position.z,
    Math.round(dmg)+(head?'!':''),head?'crit':'');
  fxBurst(g.root.position.x,g.root.position.y+1.2,g.root.position.z,head?PAL.red:PAL.gold,head?1.3:0.9);
  player.ult=Math.min(1,player.ult+dmg*0.0011);
  if(g.hp<=0){g.hp=0;g.deadT=0.001;g.respawn=6;showBanner('ELIMINATED',700);
    player.ult=Math.min(1,player.ult+0.06);}
}
function healUnit(g,amt){
  if(g.deadT>0)return;
  if(g.hp>=g.hpMax)return;
  const a=Math.min(amt,g.hpMax-g.hp);
  g.hp+=a;
  popDamage(g.root.position.x,g.root.position.y+1.5,g.root.position.z,'+'+Math.round(a),'heal');
  player.ult=Math.min(1,player.ult+a*0.0009);
}

function meleeSwing(k){
  camera.getWorldDirection(_fw);
  const o=player.pos;
  let any=false;
  for(let i=0;i<TARGETS.length;i++){
    const g=TARGETS[i];
    if(g.deadT>0||g.team!=='enemy')continue;
    const dx=g.root.position.x-o.x,dz=g.root.position.z-o.z,dy=g.root.position.y-o.y;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d>k.range||Math.abs(dy)>2.2)continue;
    const dot=(dx*_fw.x+dz*_fw.z)/Math.max(0.001,d);
    if(dot<1-(k.arc||0.55))continue;
    hurt(g,k.dmg,false);any=true;
  }
  fxBurst(o.x+_fw.x*2.0,o.y+1.3,o.z+_fw.z*2.0,PAL.gold,1.1);
  return any;
}

function aimPoint(maxD){
  camera.getWorldDirection(_fw);
  const o=camera.position;
  let best=maxD;
  for(let i=0;i<COL.length;i++){
    const t=rayBox(o.x,o.y,o.z,_fw.x,_fw.y,_fw.z,COL[i],maxD);
    if(t>=0&&t<best)best=t;
  }
  _mz.copy(o).addScaledVector(_fw,best);
  return _mz;
}

function useAbility(slot){
  if(!started)return;
  const K=kitOf(player.hero),k=K[slot];
  if(!k)return;
  if(slot==='X'){
    if(player.ult<1)return;
    player.ult=0;
  }else{
    if(player.cd[slot]>0)return;
    player.cd[slot]=k.cd||0;
    player.cdMax[slot]=k.cd||1;
  }
  const dur=k.cast||0.42;
  vm.cast=dur;vm.castSlot=slot;
  if(playerHum){playerHum.cast=slot;playerHum.castT=0;playerHum.castDur=dur;playerHum.swing++;}
  const t=k.t;
  camera.getWorldDirection(_fw);
  const o=player.pos;

  if(t==='melee'){meleeSwing(k);vm.recoilV+=5.0;}
  else if(t==='hitscan'){shootHitscan(k);}
  else if(t==='beam'){}
  else if(t==='wall'){
    const p=aimPoint(9);
    spawnWall(p.x,0,p.z,Math.atan2(_fw.x,_fw.z)+Math.PI*0.5,k.dur);
    showBanner('STONE WALL',800);
  }
  else if(t==='slam'){
    fxRing(o.x,0,o.z,k.radius,PAL.gold);
    for(let i=0;i<TARGETS.length;i++){
      const g=TARGETS[i];
      if(g.deadT>0||g.team!=='enemy')continue;
      const dx=g.root.position.x-o.x,dz=g.root.position.z-o.z;
      if(dx*dx+dz*dz>k.radius*k.radius)continue;
      hurt(g,k.dmg,false);g.vy=6.0;g.air=0.75;
    }
    showBanner('GROUND SLAM',800);
  }
  else if(t==='blink'){
    const sx=o.x,sz=o.z;
    for(let s=1;s<=10;s++){
      const nx=o.x+_fw.x*(k.dist*s/10),nz=o.z+_fw.z*(k.dist*s/10);
      if(!canStand(nx,o.y,nz))break;
      o.x=nx;o.z=nz;
    }
    for(let s=0;s<6;s++){
      fxBurst(sx+(o.x-sx)*s/6,o.y+1.0,sz+(o.z-sz)*s/6,PAL.cyan,0.7);
    }
    showBanner('BLINK DASH',700);
  }
  else if(t==='field'){
    const p=aimPoint(16);
    spawnField(p.x,0,p.z,k.radius,k.dur,PAL.cyan,'static');
    showBanner('STATIC FIELD',800);
  }
  else if(t==='dodge'){
    let ax=0,az=0;
    if(keys.KeyA)ax-=1;if(keys.KeyD)ax+=1;if(keys.KeyS)az-=1;if(keys.KeyW)az+=1;
    const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
    let vx=(-sy)*az+cy*ax,vz=(-cy)*az+(-sy)*ax;
    if(!ax&&!az){vx=_fw.x;vz=_fw.z;}
    const L=Math.sqrt(vx*vx+vz*vz)||1;
    player.vel.x=vx/L*17;player.vel.z=vz/L*17;player.vel.y=2.4;
    showBanner('DODGE',600);
  }
  else if(t==='brace'){
    player.brace=k.dur;showBanner('BRACE',800);
  }
  else if(t==='aoeheal'){
    fxRing(o.x,0,o.z,k.radius,PAL.cyan);
    spawnField(o.x,0,o.z,k.radius,2.2,PAL.cyan,'heal');
    player.hp=Math.min(player.hpMax,player.hp+k.heal*0.5);
    for(let i=0;i<TARGETS.length;i++){
      const g=TARGETS[i];
      if(g.team!=='ally')continue;
      const dx=g.root.position.x-o.x,dz=g.root.position.z-o.z;
      if(dx*dx+dz*dz<=k.radius*k.radius)healUnit(g,k.heal);
    }
    showBanner('RESONANCE PULSE',800);
  }
  else if(t==='silence'){
    const p=aimPoint(18);
    fxRing(p.x,0,p.z,k.radius,PAL.violet);
    for(let i=0;i<TARGETS.length;i++){
      const g=TARGETS[i];
      if(g.deadT>0||g.team!=='enemy')continue;
      const dx=g.root.position.x-p.x,dz=g.root.position.z-p.z;
      if(dx*dx+dz*dz<=k.radius*k.radius){g.silence=k.dur;hurt(g,12,false);}
    }
    showBanner('DISSONANCE',800);
  }
  else if(t==='surge'){
    player.hp=Math.min(player.hpMax,player.hp+k.heal);
    fxRing(o.x,0,o.z,5,PAL.cyan);
    for(let i=0;i<TARGETS.length;i++)if(TARGETS[i].team==='ally')healUnit(TARGETS[i],k.heal);
    showBanner('SURGE',700);
  }
  else if(t==='ultspikes'){
    ultCallout('TECTONIC RISE');
    for(let i=0;i<12;i++){
      const a=i/12*Math.PI*2,r=4+((i*7)%5);
      const it=spikePool.get();it.life=1.2;
      it.o.visible=true;it.o.position.set(o.x+Math.cos(a)*r,0,o.z+Math.sin(a)*r);
      it.o.scale.y=0.05;
    }
    for(let i=0;i<TARGETS.length;i++){
      const g=TARGETS[i];
      if(g.deadT>0||g.team!=='enemy')continue;
      const dx=g.root.position.x-o.x,dz=g.root.position.z-o.z;
      if(dx*dx+dz*dz<=110){hurt(g,k.dmg,false);g.vy=7.5;g.air=0.9;}
    }
  }
  else if(t==='ultline'){
    ultCallout('THUNDERLINE');
    const sx=o.x,sz=o.z;
    for(let s=1;s<=14;s++){
      const nx=o.x+_fw.x*(18*s/14),nz=o.z+_fw.z*(18*s/14);
      if(!canStand(nx,o.y,nz))break;
      o.x=nx;o.z=nz;
    }
    fxBolt(sx,o.y+1.1,sz,o.x,o.y+1.1,o.z,PAL.cyan);
    for(let i=0;i<TARGETS.length;i++){
      const g=TARGETS[i];
      if(g.deadT>0||g.team!=='enemy')continue;
      const dx=g.root.position.x-o.x,dz=g.root.position.z-o.z;
      if(dx*dx+dz*dz<=144){
        hurt(g,k.dmg,false);
        fxBolt(o.x,o.y+1.2,o.z,g.root.position.x,g.root.position.y+1.2,g.root.position.z,PAL.cyan);
      }
    }
  }
  else if(t==='ulthush'){
    ultCallout('HUSH');
    player.hp=player.hpMax;player.overheal=6;
    fxRing(o.x,0,o.z,14,PAL.cyan);
    for(let i=0;i<TARGETS.length;i++)if(TARGETS[i].team==='ally')healUnit(TARGETS[i],250);
  }
}

function shootHitscan(k){
  const hit=pickTarget(k.range||60,null);
  camera.getWorldDirection(_fw);
  const o=camera.position;
  const ex=o.x+_fw.x*(hit?hit.t:40),ey=o.y+_fw.y*(hit?hit.t:40),ez=o.z+_fw.z*(hit?hit.t:40);
  fxBolt(o.x+_fw.x*0.9,o.y-0.16,o.z+_fw.z*0.9,ex,ey,ez,PAL.cyan);
  vm.recoilV+=6.2;
  if(!hit)return;
  if(hit.g.team==='ally')return;
  hurt(hit.g,k.dmg,hit.head);
  if(k.chain){
    let from=hit.g,n=0;
    for(let i=0;i<TARGETS.length&&n<k.chain;i++){
      const g=TARGETS[i];
      if(g===hit.g||g.deadT>0||g.team!=='enemy')continue;
      const dx=g.root.position.x-from.root.position.x,dz=g.root.position.z-from.root.position.z;
      if(dx*dx+dz*dz>k.chainR*k.chainR)continue;
      fxBolt(from.root.position.x,from.root.position.y+1.2,from.root.position.z,
        g.root.position.x,g.root.position.y+1.2,g.root.position.z,PAL.cyan);
      hurt(g,k.dmg*0.6,false);
      from=g;n++;
    }
  }
}

function ultCallout(txt){
  const w=document.getElementById('ultwipe');
  w.textContent=txt;w.classList.remove('go');
  void w.offsetWidth;
  w.classList.add('go');
  if(playerHum){playerHum.cast='X';playerHum.castT=0;playerHum.castDur=1.1;}
  vm.ult=1.1;
}

let beamTick=0;
function updateBeam(dt){
  const K=kitOf(player.hero);
  const b=ensureBeam();
  if(K.P.t!=='beam'||!mouseHeld||!started){b.visible=false;return;}
  const hit=pickTarget(K.P.range,null);
  camera.getWorldDirection(_fw);
  const o=camera.position;
  const d=hit?hit.t:K.P.range;
  const ex=o.x+_fw.x*d,ey=o.y+_fw.y*d,ez=o.z+_fw.z*d;
  b.visible=true;
  b.material=emat(hit&&hit.g.team==='ally'?PAL.cyan:PAL.violet);
  b.position.set((o.x+ex)*0.5,(o.y-0.15+ey)*0.5,(o.z+ez)*0.5);
  b.scale.set(1,1,d);
  b.lookAt(ex,ey,ez);
  beamTick-=dt;
  if(beamTick<=0&&hit){
    beamTick=0.28;
    if(hit.g.team==='ally')healUnit(hit.g,K.P.heal*0.28);
    else hurt(hit.g,K.P.dmg*0.28,hit.head);
  }
  if(playerHum&&!playerHum.cast){playerHum.cast='P';playerHum.castT=0;playerHum.castDur=0.2;}
}

let playerHum=null,thirdPerson=false;
function makeAvatar(id){
  if(playerHum){
    scene.remove(playerHum.root);
    const i=HUMANS.indexOf(playerHum);if(i>=0)HUMANS.splice(i,1);
  }
  playerHum=buildHumanoid(id);
  scene.add(playerHum.root);
}

function stepTargets(dt){
  for(let i=0;i<TARGETS.length;i++){
    const g=TARGETS[i];
    const P=g.root.position;
    if(g.deadT>0){
      g.respawn-=dt;
      if(g.respawn<=0){
        g.deadT=0;g.hp=g.hpMax;P.set(g.homeX,0,g.homeZ);g.root.rotation.z=0;g.root.rotation.x=0;
      }
      g.speed=0;continue;
    }
    if(g.slow>0)g.slow-=dt;
    if(g.silence>0)g.silence-=dt;
    if(g.air>0){
      g.air-=dt;g.vy-=23*dt;P.y+=g.vy*dt;
      if(P.y<=0){P.y=0;g.vy=0;g.air=0;g.land=1;}
    }
    if(g.pRange>0&&g.air<=0){
      const sp=(g.slow>0?1.3:3.1);
      P.z+=g.pDir*sp*dt;
      if(P.z>g.homeZ+g.pRange){g.pDir=-1;}
      if(P.z<g.homeZ-g.pRange){g.pDir=1;}
      g.speed=sp;
      g.root.rotation.y=g.pDir>0?Math.PI:0;
    }else{g.speed=0;}
    if(g.team==='ally'&&g.hp>g.hpMax*0.25){g.hp-=dt*7;}
    const dx=player.pos.x-P.x,dz=player.pos.z-P.z;
    let want=Math.atan2(dx,dz)+Math.PI;
    let d=want-g.root.rotation.y;
    while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
    g.aimY=Math.max(-1.2,Math.min(1.2,d));
    g.aimX=-0.1;
  }
}

function updateThirdPerson(){
  if(!thirdPerson)return;
  const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  const fx=-sy,fz=-cy;
  let back=5.6;
  for(let s=1;s<=10;s++){
    const t=back*s/10;
    if(!canStand(player.pos.x-fx*t,player.pos.y+0.8,player.pos.z-fz*t)){back=t*0.82;break;}
  }
  camera.position.set(player.pos.x-fx*back+cy*0.62,player.pos.y+2.10+player.pitch*-1.6,
    player.pos.z-fz*back-sy*0.62);
}

function clamp(v,a,b){return v<a?a:(v>b?b:v);}

let hudT=0,fpsAcc=0,fpsN=0;
function updateHUD(dt){
  hudT-=dt;fpsAcc+=dt;fpsN++;
  if(hudT>0)return;
  hudT=0.14;
  document.getElementById('hpBar').style.transform='scaleX('+(player.hp/player.hpMax)+')';
  document.getElementById('arBar').style.transform='scaleX('+(player.armorMax?player.armor/player.armorMax:0)+')';
  document.getElementById('ulBar').style.transform='scaleX('+player.ult+')';
  document.getElementById('vitText').textContent='HP '+Math.round(player.hp)+' / '+player.hpMax+
    '  ARMOR '+Math.round(player.armor)+'  ULT '+Math.round(player.ult*100)+'%';
  document.getElementById('fps').textContent='FPS '+Math.round(fpsN/Math.max(fpsAcc,0.0001));
  fpsAcc=0;fpsN=0;
}

function updateMove(dt){
  let ax=0,az=0;
  if(keys.KeyW)az+=1;if(keys.KeyS)az-=1;
  if(keys.KeyA)ax-=1;if(keys.KeyD)ax+=1;
  const look=2.3*dt;
  if(keys.ArrowLeft){player.yaw+=look;lookDX-=look*260;}
  if(keys.ArrowRight){player.yaw-=look;lookDX+=look*260;}
  if(keys.ArrowUp){player.pitch+=look*0.8;lookDY-=look*200;}
  if(keys.ArrowDown){player.pitch-=look*0.8;lookDY+=look*200;}
  player.pitch=clamp(player.pitch,-1.45,1.45);

  const pureFwd=az>0&&ax===0&&player.grounded;
  player.fwdTime=pureFwd?player.fwdTime+dt:0;
  player.sprint=player.fwdTime>0.65;

  const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  _fw.set(-sy,0,-cy);_rt.set(cy,0,-sy);
  _wish.set(0,0,0).addScaledVector(_fw,az).addScaledVector(_rt,ax);
  if(_wish.lengthSq()>0)_wish.normalize();

  const target=player.sprint?9.3:6.2;
  const accel=player.grounded?58:14;
  const v=player.vel;
  v.x+=(_wish.x*target-v.x)*Math.min(1,accel*dt);
  v.z+=(_wish.z*target-v.z)*Math.min(1,accel*dt);
  if(player.grounded&&_wish.lengthSq()===0){
    const f=Math.max(0,1-11*dt);v.x*=f;v.z*=f;
  }
  if(keys.Space&&(player.grounded||player.coyote>0)){
    v.y=8.4;player.grounded=false;player.coyote=0;
  }
  v.y-=23*dt;
  if(v.y<-42)v.y=-42;

  player.coyote-=dt;
  player.grounded=false;
  sweep('x',v.x*dt);
  sweep('z',v.z*dt);
  sweep('y',v.y*dt);
  if(player.pos.y<-25){player.pos.copy(SPAWNS[0]);v.set(0,0,0);}
}

function updatePacks(dt){
  for(let i=0;i<packs.length;i++){
    const p=packs[i];
    p.g.rotation.y+=dt*1.4;
    if(!p.active){
      p.t-=dt;p.g.scale.setScalar(Math.max(0.001,1-p.t/12));
      if(p.t<=0){p.active=true;p.g.visible=true;p.g.scale.setScalar(1);}
      continue;
    }
    const dx=p.x-player.pos.x,dy=p.y+0.45-(player.pos.y+0.9),dz=p.z-player.pos.z;
    if(dx*dx+dy*dy+dz*dz<3.4&&player.hp<player.hpMax){
      player.hp=Math.min(player.hpMax,player.hp+75);
      player.ult=Math.min(1,player.ult+0.05);
      p.active=false;p.t=12;p.g.visible=false;
      showBanner('HEALTH PACK',700);
    }
  }
}

function updateViewmodel(dt){
  let st='idle';
  const sp=Math.sqrt(player.vel.x*player.vel.x+player.vel.z*player.vel.z);
  if(vm.ult>0){st='ult';vm.ult-=dt;}
  else if(vm.cast>0){st='cast';vm.cast-=dt;}
  else if(player.sprint&&sp>4){st='sprint';}
  else if(sp>0.7){st='walk';}
  vm.state=st;
  const tgt=st==='ult'?vm.poseUlt:st==='cast'?vm.poseCast:
    st==='sprint'?vm.poseSprint:st==='walk'?vm.poseWalk:vm.poseRest;

  const k=1-Math.exp(-13*dt);
  poseLerp(vm.cur[0],tgt,k);poseLerp(vm.cur[1],tgt,k);

  const tx=clamp(-lookDX*0.0016,-0.055,0.055);
  const ty=clamp(lookDY*0.0013,-0.045,0.045);
  lookDX*=Math.max(0,1-9*dt);lookDY*=Math.max(0,1-9*dt);
  vm.vsx+=((tx-vm.sx)*150-vm.vsx*17)*dt;vm.sx+=vm.vsx*dt;
  vm.vsy+=((ty-vm.sy)*150-vm.vsy*17)*dt;vm.sy+=vm.vsy*dt;

  const bk=clamp(sp/6.2,0,1.3);
  vm.bob+=dt*(3.6+sp*1.15);
  vm.bx=Math.sin(vm.bob)*0.0115*bk;
  vm.by=Math.cos(vm.bob*2)*0.0095*bk;

  vm.recoilV-=(vm.recoil*300+vm.recoilV*25)*dt;
  vm.recoil+=vm.recoilV*dt;

  const uw=st==='ult'?clamp(vm.ult*1.6,0,1):0;
  for(let i=0;i<2;i++){
    const h=vm.hands[i];
    applyPose(h,vm.cur[i]);
    h.root.position.x+=vm.sx+vm.bx;
    h.root.position.y+=vm.sy+vm.by-vm.recoil*0.016;
    h.root.position.z+=vm.recoil*0.030;
    h.root.rotation.x+=-vm.recoil*0.20+vm.sy*0.85;
    h.root.rotation.y+=vm.sx*1.5;
    h.root.rotation.z+=vm.sx*0.6*h.s;
  }
  vmRoot.position.set(0,uw*0.02,uw*0.05);
  sparkPool.step(dt);tracerPool.step(dt);
}

function syncAvatar(dt){
  if(!playerHum)return;
  const h=playerHum;
  h.root.position.set(player.pos.x,player.pos.y,player.pos.z);
  h.root.rotation.y=player.yaw;
  h.root.visible=thirdPerson;
  const vx=player.vel.x,vz=player.vel.z;
  h.speed=Math.sqrt(vx*vx+vz*vz);
  h.vy=player.vel.y;
  h.air=player.grounded?0:1;
  if(player.grounded&&!player.wasGround)h.land=1;
  player.wasGround=player.grounded;
  const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  h.strafe=(vx*cy-vz*sy)/6.2;
  h.aimX=-player.pitch;h.aimY=0;
}

let last=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;

  updateMove(dt);
  updatePacks(dt);
  stepTargets(dt);
  stepWalls(dt);
  stepFields(dt);
  stepFX(dt);
  syncAvatar(dt);
  for(let i=0;i<HUMANS.length;i++)animateHumanoid(HUMANS[i],dt);
  updateViewmodel(dt);
  updateCooldowns(dt);
  updateHUD(dt);

  if(player.brace>0)player.brace-=dt;
  if(player.overheal>0)player.overheal-=dt;
  player.ult=Math.min(1,player.ult+dt*0.012);

  camera.position.set(player.pos.x,player.pos.y+EYE,player.pos.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  updateThirdPerson();
  updateBeam(dt);
  updateDamageNums(dt);

  renderer.clear();
  renderer.render(scene,camera);
  if(!thirdPerson){
    renderer.clearDepth();
    renderer.render(vmScene,vmCamera);
  }
}

const SIL_RT=new THREE.WebGLRenderTarget(64,96);
const SIL_BUF=new Uint8Array(64*96*4);
function silMask(id){
  const h=buildHumanoid(id);HUMANS.pop();
  const tmp=new THREE.Scene();tmp.add(h.root);tmp.overrideMaterial=SIL_MAT;
  const cam=new THREE.PerspectiveCamera(30,64/96,0.1,60);
  cam.position.set(0,1.05,5.6);cam.lookAt(0,1.05,0);
  renderer.setRenderTarget(SIL_RT);
  renderer.setClearColor(PAL.paper,1);renderer.clear();
  renderer.render(tmp,cam);
  renderer.readRenderTargetPixels(SIL_RT,0,0,64,96,SIL_BUF);
  renderer.setRenderTarget(null);
  let m='';
  for(let i=0;i<64*96;i++)m+=(SIL_BUF[i*4]<120?'1':'0');
  return m;
}
function silhouette(on){
  worldGroup.visible=!on;vmRoot.visible=!on;
  scene.overrideMaterial=on?SIL_MAT:null;
  scene.fog=on?null:FOG;
}
const FOG=scene.fog;
const DISPLAY=[];
function spawnDisplay(id,x,y,z,ry){
  const h=buildHumanoid(id);
  h.root.position.set(x,y,z);h.root.rotation.y=ry;
  scene.add(h.root);DISPLAY.push(h);return h;
}
spawnTarget('NOCTURN',-30,-6,'enemy',7);
spawnTarget('RIVET',-24,8,'enemy',5);
spawnTarget('HALFTONE',-38,12,'enemy',9);
spawnTarget('SOLSTICE',-46,-12,'ally',0);
spawnTarget('VERDANT',-44,4,'ally',6);

window.CONTINUUM={THREE:THREE,silhouette:silhouette,silMask:silMask,HUMANS:HUMANS,DISPLAY:DISPLAY,
  buildHumanoid:buildHumanoid,spawnDisplay:spawnDisplay,BODY:BODY,worldGroup:worldGroup,
  TARGETS:TARGETS,useAbility:useAbility,KIT:KIT,kitOf:kitOf,
  setThird:function(v){thirdPerson=v;camera.fov=v?70:90;camera.updateProjectionMatrix();},
  avatar:function(){return playerHum;},scene:scene,vmScene:vmScene,camera:camera,vmCamera:vmCamera,
  renderer:renderer,player:player,vm:vm,setHero:setHero,COL:COL,packs:packs,
  ROSTER:ROSTER,PAL:PAL,MAPS:MAPS,COMBOS:COMBOS,fire:fire,showBanner:showBanner,begin:begin};

setHero('TECTON');
player.pos.copy(SPAWNS[0]);player.pos.y=0.02;
animate();
</script>
