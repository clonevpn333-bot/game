<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GETAWAY!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;font-family:Rajdhani,'Segoe UI',sans-serif;color:#fff;user-select:none}
#game canvas{display:block}
#boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1022 0%,#05060a 70%);z-index:100;transition:opacity .6s}
#boot.done{opacity:0;pointer-events:none}
.boot-logo{font-family:Anton,Impact,sans-serif;font-size:min(14vw,140px);letter-spacing:.04em;font-style:italic;background:linear-gradient(180deg,#fff 0%,#ffd36b 55%,#ff5a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:skewX(-8deg);filter:drop-shadow(0 6px 30px rgba(255,90,42,.45))}
.boot-logo span{color:#ff3b2f;-webkit-text-fill-color:#ff3b2f}
.boot-bar{width:min(420px,70vw);height:4px;background:#222;margin-top:24px;overflow:hidden;transform:skewX(-20deg)}
#boot-fill{height:100%;width:0;background:linear-gradient(90deg,#ff3b2f,#ffd36b);transition:width .3s}
#boot-msg{margin-top:14px;opacity:.7;letter-spacing:.2em;text-transform:uppercase;font-size:13px}
:root{--gold:#ffd36b;--red:#ff3b2f;--cyan:#5ad1ff;--ink:#0b0e13;--glass:rgba(10,14,20,.62)}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui .interactive,#ui .menu,#ui button{pointer-events:auto}
kbd{display:inline-block;min-width:18px;padding:1px 6px;border:1px solid rgba(255,255,255,.6);border-bottom-width:3px;border-radius:4px;font:700 13px Rajdhani;margin:0 3px;background:rgba(0,0,0,.35)}
.hud{position:absolute;inset:0;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hud-obj{position:absolute;top:28px;left:50%;transform:translate(-50%,-20px) skewX(-10deg);opacity:0;transition:all .45s cubic-bezier(.2,1.4,.4,1);text-align:center;background:linear-gradient(90deg,transparent,var(--glass) 15%,var(--glass) 85%,transparent);padding:8px 70px}
.hud-obj.in{opacity:1;transform:translate(-50%,0) skewX(-10deg)}
.hud-obj-text{font:400 28px Anton,Impact,sans-serif;letter-spacing:.05em;color:#fff}
.hud-obj-text::before{content:'▶ ';color:var(--gold)}
.hud-obj-sub{font:600 15px Rajdhani;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.hud-timer{position:absolute;top:108px;left:50%;transform:translateX(-50%);font:400 42px Anton;letter-spacing:.05em;display:none}
.hud-timer.urgent{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.12)}}
.hud-wanted{position:absolute;top:22px;right:32px;font-size:34px;letter-spacing:4px;transition:opacity .3s}
.hud-wanted .star{color:rgba(255,255,255,.2);display:inline-block;transition:all .3s}
.hud-wanted .star.on{color:var(--gold);text-shadow:0 0 12px rgba(255,211,107,.8)}
.hud-wanted.search .star.on{animation:blink .6s infinite}
.hud-wanted.flash .star.on{animation:starpop .5s}
@keyframes blink{50%{color:#3b7bff;text-shadow:0 0 12px #3b7bff}}
@keyframes starpop{40%{transform:scale(1.6)}}
.hud-wanted-label{position:absolute;top:66px;right:34px;font:700 13px Rajdhani;letter-spacing:.25em;color:#9fb4ff}
.hud-money{position:absolute;top:84px;right:32px;font:400 26px Anton;color:#7bd88f;letter-spacing:.04em}
.hud-minimap{position:absolute;left:28px;bottom:42px;width:230px;height:230px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.6)}
.hud-bars{position:absolute;left:36px;bottom:20px;width:214px;display:flex;gap:6px}
.hud-bars .bar{flex:1;height:7px;background:rgba(0,0,0,.5);transform:skewX(-20deg);overflow:hidden}
.hud-bars .fill{height:100%;transition:width .2s}
.hud-bars .hp .fill{background:linear-gradient(90deg,#4fd16b,#a6f07a)} .hud-bars .hp.low .fill{background:var(--red);animation:blink2 .5s infinite alternate}
.hud-bars .ar .fill{background:linear-gradient(90deg,#3fa9ff,#9fd8ff)}
@keyframes blink2{to{opacity:.4}}
.hud-district{position:absolute;left:280px;bottom:44px;font:400 22px Anton;letter-spacing:.12em;opacity:0;color:#fff}
.hud-district.in{animation:distin 4s forwards}
@keyframes distin{0%{opacity:0;transform:translateX(-20px)}10%,75%{opacity:.9;transform:none}100%{opacity:0}}
.hud-speedo{position:absolute;right:20px;bottom:10px;width:260px;height:200px}
.hud-weapon{position:absolute;right:36px;bottom:30px;text-align:right}
.hud-weapon .w-name{font:700 14px Rajdhani;letter-spacing:.25em;color:var(--gold)}
.hud-weapon .w-ammo{font:400 40px Anton}.hud-weapon small{font-size:20px;opacity:.6}.hud-weapon i{font:700 13px Rajdhani;color:var(--red);font-style:normal}
.hud-cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;transition:opacity .15s}
.hud-cross::before,.hud-cross::after{content:'';position:absolute;background:#fff;box-shadow:0 0 3px #000}
.hud-cross::before{left:10px;top:0;width:2px;height:22px}.hud-cross::after{top:10px;left:0;height:2px;width:22px}
.hud-cross.aim{transform:scale(.8)}
.hud-hitmark{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;opacity:0;background:conic-gradient(from 45deg,#fff 0 4%,transparent 4% 25%,#fff 25% 29%,transparent 29% 50%,#fff 50% 54%,transparent 54% 75%,#fff 75% 79%,transparent 79%);border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 45%,#000 46%);mask:radial-gradient(circle,transparent 45%,#000 46%)}
.hud-hitmark.head{filter:hue-rotate(-50deg) saturate(8)}
.hud-prompt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);font:600 18px Rajdhani;background:var(--glass);padding:6px 18px;border-left:3px solid var(--gold);opacity:0;transition:opacity .2s}
.hud-warn{position:absolute;left:50%;top:36%;transform:translateX(-50%);font:400 26px Anton;color:var(--red);letter-spacing:.08em;opacity:0;transition:opacity .2s;animation:blink2 .4s infinite alternate}
.hud-feed{position:absolute;left:28px;top:40%;width:360px}
.hud-feed .note{background:var(--glass);border-left:3px solid var(--cyan);padding:6px 12px;margin-bottom:6px;font:600 15px Rajdhani;animation:notein .35s;transition:all .5s}
.hud-feed .note.intel{border-color:#3b7bff}.hud-feed .note.pickup{border-color:#7bd88f}.hud-feed .note.out{opacity:0;transform:translateX(-30px)}
@keyframes notein{from{opacity:0;transform:translateX(-30px)}}
.hud-subs{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);max-width:62vw;text-align:center;font:600 21px Rajdhani;background:rgba(0,0,0,.45);padding:6px 16px;opacity:0;transition:opacity .25s}
.hud-subs.in{opacity:1}.hud-subs .who{font:400 18px Anton;letter-spacing:.1em;margin-right:10px}
.hud-big{position:absolute;left:0;right:0;top:32%;text-align:center;opacity:0;transform:scale(1.4);transition:all .35s cubic-bezier(.2,1.4,.4,1)}
.hud-big.in{opacity:1;transform:none}
.hud-big .t{font:400 min(13vw,120px) Anton;letter-spacing:.04em;font-style:italic;transform:skewX(-8deg);color:#fff}
.hud-big.gold .t{background:linear-gradient(180deg,#fff,var(--gold) 60%,#ff8a2a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hud-big.red .t{color:var(--red)} .hud-big.blue .t{color:#7aa8ff}
.hud-big .s{font:700 18px Rajdhani;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.hud-stunt{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center}
.hud-stunt .pop{font:400 30px Anton;letter-spacing:.06em;font-style:italic;animation:pop 1.8s forwards;color:#fff}
.hud-stunt .pop b{color:var(--gold)}
@keyframes pop{0%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(1.15)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.hud-fps{position:absolute;right:8px;top:4px;font:12px monospace;opacity:.6}
/* ---------- menus ---------- */
.menu{position:absolute;inset:0;display:flex;color:#fff}
.menu.bg{background:linear-gradient(90deg,rgba(5,6,10,.92) 0%,rgba(5,6,10,.55) 45%,rgba(5,6,10,0) 75%)}
.menu.dim{background:rgba(5,6,10,.72);backdrop-filter:blur(6px)}
.logo{font:400 min(12vw,128px) Anton,Impact;letter-spacing:.03em;font-style:italic;transform:skewX(-8deg);background:linear-gradient(180deg,#fff 0%,#ffd36b 55%,#ff5a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 26px rgba(255,90,42,.45));line-height:1}
.logo span{-webkit-text-fill-color:#ff3b2f}
.tagline{font:700 15px Rajdhani;letter-spacing:.42em;color:var(--gold);margin:6px 0 34px 6px;text-transform:uppercase}
.mm-left{padding:7vh 0 0 6vw;width:520px;max-width:90vw}
.mbtn{display:block;width:100%;text-align:left;background:none;border:none;color:#fff;font:400 34px Anton;letter-spacing:.06em;padding:6px 0 6px 18px;cursor:pointer;position:relative;transition:all .18s;font-style:italic;opacity:.78}
.mbtn small{font:600 13px Rajdhani;letter-spacing:.2em;color:var(--gold);margin-left:12px;font-style:normal;vertical-align:middle}
.mbtn:hover,.mbtn.sel{opacity:1;padding-left:34px;color:var(--gold)}
.mbtn:hover::before,.mbtn.sel::before{content:'';position:absolute;left:0;top:50%;width:22px;height:4px;background:var(--red);transform:skewX(-30deg)}
.mbtn.primary{font-size:48px;opacity:1}
.mbtn:disabled{opacity:.25;cursor:default}
.panel{margin:auto;width:min(1100px,92vw);max-height:86vh;overflow:auto;background:linear-gradient(180deg,rgba(18,22,30,.94),rgba(8,10,14,.96));border-top:4px solid var(--red);padding:28px 36px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.panel h2{font:400 46px Anton;letter-spacing:.05em;margin:0 0 4px;font-style:italic}
.panel h3{font:700 14px Rajdhani;letter-spacing:.35em;color:var(--gold);margin:22px 0 10px;text-transform:uppercase}
.panel .sub{font:600 15px Rajdhani;opacity:.7;margin-bottom:12px;letter-spacing:.06em}
.back{position:absolute;right:30px;top:24px;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;font:700 14px Rajdhani;letter-spacing:.2em;padding:8px 18px;cursor:pointer}
.back:hover{border-color:var(--gold);color:var(--gold)}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.mcard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:12px 14px;cursor:pointer;transition:all .15s;position:relative;min-height:92px}
.mcard:hover{background:rgba(255,211,107,.1);border-color:var(--gold);transform:translateY(-2px)}
.mcard .n{font:400 30px Anton;color:var(--red);float:right;opacity:.85}.mcard .t{font:400 22px Anton;letter-spacing:.04em}.mcard .d{font:500 13px Rajdhani;opacity:.7;margin-top:4px;line-height:1.25}
.mcard .rec{font:700 12px Rajdhani;color:var(--gold);margin-top:6px;letter-spacing:.1em}
.mcard.locked{opacity:.32;cursor:default}.mcard.locked:hover{transform:none;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
.mcard.soon .n::after{content:' · IN DEVELOPMENT';font:700 10px Rajdhani;letter-spacing:.1em;color:#888;vertical-align:middle}
.mcard .grade{position:absolute;right:12px;bottom:8px;font:400 26px Anton;color:var(--gold)}
.row{display:flex;align-items:center;gap:16px;margin:8px 0;font:600 16px Rajdhani}
.row label{width:220px;opacity:.8;letter-spacing:.05em}
.row input[type=range]{flex:1;accent-color:var(--gold)} .row select,.row button.opt{background:#1a1f28;color:#fff;border:1px solid #333;padding:6px 10px;font:600 15px Rajdhani}
.garage{display:flex;gap:20px}.garage .list{width:300px}.garage .gi{padding:8px 12px;cursor:pointer;border-left:3px solid transparent;font:400 20px Anton;letter-spacing:.04em;opacity:.8}
.garage .gi:hover,.garage .gi.sel{border-color:var(--gold);opacity:1;background:rgba(255,211,107,.06)}.garage .gi.locked{opacity:.3}
.garage .gi small{display:block;font:600 12px Rajdhani;letter-spacing:.15em;color:var(--gold)}
.garage .stats{flex:1}.stat{margin:10px 0;font:600 14px Rajdhani;letter-spacing:.12em}.stat .b{height:8px;background:rgba(255,255,255,.1);margin-top:4px;transform:skewX(-20deg)}.stat .b i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:34px;height:34px;border:2px solid rgba(255,255,255,.3);cursor:pointer;transform:skewX(-10deg)}.swatch.sel{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
.tracks .tr{display:flex;align-items:center;gap:14px;padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
.tracks .tr:hover,.tracks .tr.playing{background:rgba(255,211,107,.07)}.tracks .tr .tt{font:400 22px Anton;flex:1;letter-spacing:.04em}.tracks .tr .mm{font:600 13px Rajdhani;opacity:.6}.tracks .tr.locked{opacity:.3;cursor:default}
.viz{height:70px;display:flex;align-items:flex-end;gap:3px;margin:12px 0}.viz i{flex:1;background:linear-gradient(0deg,var(--red),var(--gold));min-height:2px}
.results .grade{font:400 140px Anton;font-style:italic;color:var(--gold);float:right;line-height:1;margin-top:-10px;text-shadow:0 0 40px rgba(255,211,107,.5)}
.results table{border-collapse:collapse;font:600 18px Rajdhani;margin-top:10px}.results td{padding:5px 30px 5px 0}.results td:last-child{color:var(--gold);text-align:right}
.results .best{font:700 13px Rajdhani;color:#7bd88f;letter-spacing:.2em}
.btnrow{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap}
.bigbtn{background:var(--red);color:#fff;border:none;font:400 24px Anton;letter-spacing:.06em;padding:10px 28px;cursor:pointer;transform:skewX(-10deg);transition:all .15s}
.bigbtn.alt{background:rgba(255,255,255,.1)}.bigbtn:hover{background:var(--gold);color:#111}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 18vh 7vw;pointer-events:none}
.intro .num{font:400 120px Anton;color:var(--red);line-height:.9;font-style:italic;animation:slidein .7s cubic-bezier(.2,1.2,.4,1)}
.intro .ttl{font:400 min(9vw,96px) Anton;letter-spacing:.04em;font-style:italic;animation:slidein .8s .1s both cubic-bezier(.2,1.2,.4,1)}
.intro .act{font:700 16px Rajdhani;letter-spacing:.4em;color:var(--gold);animation:slidein .8s .2s both}
.intro .skip{position:absolute;right:30px;bottom:30px;font:600 14px Rajdhani;letter-spacing:.2em;opacity:.7}
@keyframes slidein{from{opacity:0;transform:translateX(-80px)}}
.press{font:700 20px Rajdhani;letter-spacing:.4em;animation:blink2 .9s infinite alternate;margin-top:30px}
.controls{font:600 14px Rajdhani;opacity:.8;line-height:1.9;columns:2}
.fail .t{color:var(--red)}
.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font:600 14px Rajdhani;opacity:.6;letter-spacing:.15em}
.hud.cine .hud-minimap,.hud.cine .hud-bars,.hud.cine .hud-speedo,.hud.cine .hud-weapon,.hud.cine .hud-cross,.hud.cine .hud-wanted,.hud.cine .hud-money,.hud.cine .hud-prompt,.hud.cine .hud-district,.hud.cine .hud-wanted-label{opacity:0!important;transition:opacity .4s}
.hud-wp{position:absolute;width:0;height:0;pointer-events:none;transition:opacity .2s}
.hud-wp .wp-dia{position:absolute;left:-11px;top:-11px;width:18px;height:18px;border:3px solid #ffc23a;transform:rotate(45deg);box-shadow:0 0 14px #ffb21e,inset 0 0 8px #ffb21e;animation:wpp 1s infinite}
.hud-wp .wp-dist{position:absolute;left:-50px;width:100px;top:16px;text-align:center;font:700 16px Rajdhani;color:#ffd36b;letter-spacing:.08em}
.hud-wp .wp-arrow{display:none;position:absolute;left:-14px;top:-40px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:22px solid #ffc23a;transform-origin:14px 40px;filter:drop-shadow(0 0 6px #ffb21e)}
.hud-wp.off .wp-arrow{display:block}
@keyframes wpp{50%{transform:rotate(45deg) scale(1.25)}}
.hud.cine .hud-wp{opacity:0!important}

</style>
  
</head>

  <div id="ui"></div>

    <div class="boot-logo">GETAWAY<span>!</span></div>
    <div class="boot-bar"><div id="boot-fill"></div></div>
    <div id="boot-msg">Building Port Sol…</div>
  </div>
