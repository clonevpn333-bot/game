<!DOCTYPE html><html><head><style>body{margin:0}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script></head>
<body><script type="module">
import * as THREE from 'three';
import { Human, HumanRenderer, LOOKS, randomLook } from '../src/characters/humanoid.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x9fb4c8);

const hs = states.map(([st, sp], i) => { const h = new Human(i === 0 ? LOOKS.kit : i % 3 === 0 ? LOOKS.police() : randomLook(), { x: (i % 8) * 2.2 - 7.7, y: (1 - Math.floor(i / 8)) * 2.4, z: 0, yaw: +(new URLSearchParams(location.search).get('yaw') || 1.2) });
  h.state = st === 'aimP' || st === 'aimR' || st === 'sprint' ? 'run' : st; if (st === 'walk' || st === 'run' || st === 'sprint') h.state = 'idle'; h.speed = sp;
  if (st === 'aimP') { h.speed = 0; h.state = 'idle'; h.aim = { kind: 'pistol', pitch: 0 }; } if (st === 'aimR') { h.speed = 0; h.state = 'idle'; h.aim = { kind: 'rifle', pitch: 0.1 }; } if (i === 2) h.carryBag = true; if (st === 'flee') h.state = 'flee'; return h; });
for (let k = 0; k < 20; k++) hs.forEach((h) => h.animate(0.03));

</script></body></html>
