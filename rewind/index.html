<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Rewind</title>
<link rel="preconnect" href="https://www.tiktok.com" crossorigin>
<link rel="dns-prefetch" href="https://lf16-tiktok-web.tiktokcdn-us.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23a78bff%27/%3E%3Cpath d=%27M21 11a7 7 0 1 0 2 5%27 fill=%27none%27 stroke=%27%230a0612%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="y2020" data-period="2020">
<div class="bg" aria-hidden="true">
  <div class="bg-wash"></div>
  <canvas id="atmo"></canvas>
  <div class="bg-grain"></div>
  <div class="bg-vignette"></div>
</div>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Menu">
    <div class="brand"><span class="brand-mark">↺</span><span class="brand-name">rewind<i>.</i></span></div>

    <nav class="rail-sec" aria-label="Eras">
      <h3>Go to</h3>
      <div id="eraList" class="era-list"></div>
    </nav>
    <section class="rail-sec" aria-label="Moods">
      <h3>Mood</h3>
      <div id="moodList" class="mood-list"></div>
    </section>
    <section class="rail-sec" aria-label="Vibes"><h3>Vibes</h3><div class="chips" id="chips" role="toolbar" aria-label="Vibe filters"></div></section>
    <section class="rail-sec" aria-label="Timeline"><h3>Timeline</h3><div class="timeline" id="timeline" aria-label="Timeline"></div></section>
    <section class="rail-sec" aria-label="Collections">
      <h3>Collections</h3>
      <div id="collList" class="coll-list"></div>
    </section>
    <section class="rail-sec rail-tools">
      <button type="button" data-open="search"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg>Search<kbd>/</kbd></button>
      <button type="button" id="btnFavs"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg>Favorites<span class="count" id="favCount">0</span></button>
      <button type="button" data-open="add"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Add videos</button>
      <button type="button" data-open="health"><svg viewBox="0 0 24 24"><use href="#i-pulse"/></svg>Library health</button>
      <button type="button" data-open="settings"><svg viewBox="0 0 24 24"><use href="#i-sliders"/></svg>Atmosphere</button>
      <button type="button" data-open="help"><svg viewBox="0 0 24 24"><use href="#i-key"/></svg>Shortcuts<kbd>?</kbd></button>
    </section>
    <p class="rail-foot" id="sessionLine"></p>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="stage" id="stage">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" type="button" aria-label="Open menu"><svg viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
      <button class="btn-transport" id="btnTransport" type="button"><span class="orb"></span><span><b>Transport me</b><small>random era · random video</small></span></button>
      <div class="era-title" id="eraTitle" aria-live="polite"></div>
      <button class="icon-btn" data-open="search" type="button" aria-label="Search"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg></button>
    </header>

    <section class="feed" id="feed" aria-label="Video feed">
      <div class="frame" id="frame">
        <div class="frame-inner" id="frameInner">
          <div class="player-host" id="playerHost"></div>
          <div class="shield" id="shield" aria-hidden="true"></div>



          <div class="state skeleton" id="stSkeleton" hidden>
            <div class="sk-glow"></div>
            <div class="sk-lines"><i></i><i></i><i></i></div>
            <p class="state-title" id="skTitle">Tuning in…</p>
            <p class="state-sub" id="skSub">Waiting for TikTok’s player</p>
            <button type="button" class="btn ghost" id="skSkip" hidden>Skip this one</button>
          </div>
          <div class="state tap" id="stTap" hidden>
            <button type="button" class="tap-btn" id="btnTap" aria-label="Play video"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg></button>
            <p class="state-sub">Tap to play</p>
          </div>
          <div class="state panel" id="stPanel" hidden></div>
          <button type="button" class="sound-hint" id="soundHint" hidden><svg viewBox="0 0 24 24"><use href="#i-vol"/></svg>Tap for sound</button>
          <div class="skipbar" id="skipbar" hidden><span id="skipText"></span><button type="button" id="skipCancel">Stay</button></div>
          <div class="heart-burst" id="burst" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg></div>
        </div>


        <div class="meta" id="meta">
          <div class="meta-top"><span class="pill era-pill" id="metaEra"></span><span class="meta-date" id="metaDate"></span><span class="status-dot" id="metaStatus"></span></div>
          <div class="meta-creator" id="metaCreator"></div>
          <div class="meta-title" id="metaTitle"></div>
          <div class="meta-tags" id="metaTags"></div>
        </div>
        <div class="actions" id="actions">
          <button type="button" id="actFav" class="act" aria-label="Favorite (F)" title="Favorite (F)"><svg viewBox="0 0 24 24"><use href="#i-heart"/></svg></button>
          <button type="button" id="actSimilar" class="act" aria-label="Similar vibe" title="Similar vibe"><svg viewBox="0 0 24 24"><use href="#i-spark"/></svg></button>
          <button type="button" id="actMute" class="act" aria-label="Mute (M)" title="Mute (M)"><svg viewBox="0 0 24 24"><use href="#i-vol"/></svg></button>
          <button type="button" id="actShuffle" class="act" aria-label="Shuffle (S)" title="Shuffle (S)"><svg viewBox="0 0 24 24"><use href="#i-shuffle"/></svg></button>
          <a id="actOpen" class="act" target="_blank" rel="noopener noreferrer" aria-label="Open on TikTok" title="Open on TikTok (O)"><svg viewBox="0 0 24 24"><use href="#i-out"/></svg></a>
        </div>
      </div>

      <button type="button" class="nav nav-prev" id="btnPrev" aria-label="Previous video"><svg viewBox="0 0 24 24"><use href="#i-up"/></svg></button>
      <button type="button" class="nav nav-next" id="btnNext" aria-label="Next video"><svg viewBox="0 0 24 24"><use href="#i-down"/></svg></button>
    </section>
  </main>

  <aside class="side" id="side" aria-label="Details">
    <section class="card-sec">
      <h3>Now in</h3>
      <div class="now" id="nowBig"></div>
      <p class="muted" id="nowSub"></p>
      <p class="session" id="sessionBig"></p>
    </section>
    <section class="card-sec">
      <h3>Position <span class="muted" id="posText"></span></h3>
      <input type="range" id="scrub" min="1" max="1" value="1" aria-label="Scrub through this feed">
    </section>
    <section class="card-sec grow">
      <h3>Similar vibe</h3>
      <div id="similarList" class="vlist"></div>
      <h3 class="sp">Up next</h3>
      <div id="nextList" class="vlist"></div>
    </section>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="warp" id="warp" aria-hidden="true"><div class="warp-in"><small>transporting to</small><b id="warpText"></b></div></div>
<div class="modal-root" id="modalRoot" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.7 8 3.6 5 6.7 5c1.9 0 3.6 1 5.3 3 1.7-2 3.4-3 5.3-3 3.1 0 5 3 3.9 6.100-1.7 4.800-9.2 9.400-9.2 9.4z" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 105.1 13l4.7 4.7 1.400-1.400-4.700-4.7A7.5 7.5 0 0010.5 3zm0 2a5.5 5.5 0 110 11 5.5 5.5 0 010-11z" fill="currentColor"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z" fill="currentColor"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.500-6 4 12 2.500-6H21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.900-5.1L5 10l5.100-1.9zM18.5 15l.9 2.1 2.100.9-2.100.9-.9 2.100-.9-2.100-2.100-.9 2.100-.9z" fill="currentColor"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9.5l5 5M21 9.5l-5 5" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3.5c4 0 5 10 9 10H20M4 17h3.5c1.5 0 2.500-1.3 3.500-3M14 8.5c.8-1 1.700-1.5 2.800-1.5H20M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<noscript><p style="padding:2rem;color:#fff">rewind. needs JavaScript to run.</p></noscript>
<script src="js/core.js"></script>
<script src="data/library.js"></script>
<script src="js/store.js"></script>
<script src="js/player.js"></script>
<script src="js/atmosphere.js"></script>
<script src="js/ambience.js"></script>
<script src="js/app.js"></script>
</body>
</html>
