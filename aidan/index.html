<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Calling of Aidan</title>
<style>
:root{color-scheme:dark;--ink:#f1e7df;--dim:#b9a39e;--red:#ee7767;--gold:#f4cda0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a090e;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;overscroll-behavior:none}
#wrap,#stage{position:fixed;inset:0;overflow:hidden;background:#0a090e}
#stage{isolation:isolate}
#wrap:fullscreen{width:100%;height:100%;background:#0a090e}
#c{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,#05020830 0 1px,transparent 1px 4px)}
button{font:600 12px/1.4 ui-monospace,Menlo,Consolas,monospace;cursor:pointer;touch-action:manipulation;color:inherit}
button:focus-visible{outline:2px solid #ffd58d;outline-offset:4px}
#tools{position:absolute;z-index:6;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:6px}
#tools button,#skip{background:#100d16e8;border:1px solid #8f6d6b;padding:8px 11px;font-size:10px;letter-spacing:.07em}
#tools button:hover,#skip:hover{background:#452328}
#obj,#met{position:absolute;z-index:2;top:max(50px,calc(env(safe-area-inset-top) + 44px));font-size:clamp(10px,1.15vw,14px);line-height:1.55;text-shadow:0 1px 2px #000,0 1px 6px #000;pointer-events:none}
#obj{left:max(14px,4%);max-width:49%;white-space:pre-line;color:var(--gold)}
#met{right:max(14px,4%);max-width:46%;text-align:right}
#met b{color:#ff827a;font-weight:600}#met i{color:#a6dbcd;font-style:normal}
.bar{display:inline-block;width:7em;height:.75em;vertical-align:middle;background:#201923;border:1px solid #9c6870}
.bar span{display:block;height:100%;background:#d8555d}
#sub,#hint{position:absolute;left:5%;right:5%;z-index:3;text-align:center;text-shadow:0 2px 3px #000,0 0 10px #000;pointer-events:none}
#sub{top:24%;font-size:clamp(11px,1.5vw,17px);color:#ffe0d0;opacity:0;transition:opacity .2s}
#hint{bottom:8%;color:var(--gold);font-size:clamp(11px,1.4vw,15px)}
#card{position:absolute;inset:0;z-index:4;display:grid;place-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;background:#09070cd9;padding:0 5%}
#card .b{font-family:Georgia,serif;font-size:clamp(27px,5.5vw,78px);letter-spacing:.06em;line-height:1.15}
#card .s{font-size:clamp(10px,1.4vw,15px);color:var(--red);letter-spacing:.22em;margin-top:1em;line-height:1.6}
#card.sfx .b{color:var(--red)}
#caption{position:absolute;z-index:4;bottom:8%;left:8%;right:8%;margin:0;text-align:center;font:italic clamp(15px,2vw,26px)/1.3 Georgia,serif;text-shadow:0 2px 4px #000,0 0 12px #000;color:#ffeade}
#skip{position:absolute;right:3%;bottom:3%;z-index:6}
#menu{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:12px 5%;background:linear-gradient(90deg,#08070de8 6%,#0e0b12c9 43%,#0d09073b 88%)}
#menu.title{align-items:flex-start;text-align:left;padding-left:8vw}
#menu h1{font:normal clamp(34px,min(9vw,15vh),126px)/.85 Georgia,serif;letter-spacing:-.065em;margin:.07em 0 .12em;color:var(--ink);text-shadow:0 4px 26px #080407}
#menu h1 em{font-weight:normal;color:#f08976}
#menu:not(.title) h1{font-size:clamp(32px,min(6vw,15vh),87px);line-height:.95}
#menu p{margin:0;max-width:42em;color:#e1c3b7;line-height:1.65;font-size:clamp(10px,1.15vw,14px)}
#menu .eyebrow,#menu .tally{font-size:clamp(9px,1vw,12px);letter-spacing:.2em;text-transform:uppercase;color:#e2b29e}
#menu .tally{margin-top:4px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}
.title .actions{justify-content:flex-start}
.mb{font-weight:bold;font-size:clamp(10px,1.15vw,13px);letter-spacing:.1em;padding:12px 17px;background:#f48975;color:#190b0f;border:1px solid #ffb297}
.mb.alt{color:var(--ink);background:#16101bdd;border-color:#785a66}
.mb:hover{filter:brightness(1.16)}
#dlg{position:absolute;z-index:5;bottom:max(32px,6vh);left:50%;transform:translateX(-50%);width:min(91%,840px);max-height:81%;overflow:auto;padding:13px 19px;background:#100d16f4;border:1px solid #84565f;border-left:3px solid var(--red);box-shadow:0 12px 45px #000b;font-size:clamp(12px,1.45vw,17px);line-height:1.5;cursor:pointer}
#dn{display:inline-block;color:white;font-size:.72em;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;margin-bottom:5px}
#dt{white-space:pre-wrap;padding-right:18px}#dt.n{color:#dfc8cd}
#dc{display:grid;gap:5px}#dc:empty{display:none}
#dc button{text-align:left;line-height:1.35;font-size:inherit;background:#201621;color:#ffdfbf;border:1px solid #66424e;padding:7px 11px}
#dc button:hover{background:#462631}
#more{position:absolute;right:12px;bottom:10px;color:var(--gold);visibility:hidden;font-size:.72em}
#pad{position:absolute;z-index:5;bottom:max(8px,env(safe-area-inset-bottom));left:3%;right:3%;display:none;gap:6px;pointer-events:none}
#pad button{flex:1;padding:12px 2px;font-size:clamp(10px,2.3vw,13px);background:#1e1423ed;border:1px solid #8d666a;pointer-events:auto;touch-action:none}
#pad button.on,#pad button:active{background:#67333c}
#pad .a{margin-left:4vw}
#foot{position:absolute;z-index:2;bottom:10px;left:4%;right:4%;text-align:center;color:#cab2ad;font-size:clamp(8px,1vw,11px);text-shadow:0 2px 5px #000;pointer-events:none}
@media(pointer:coarse),(max-width:720px){
 #pad.active{display:flex}
 #wrap.play #foot{display:none}
 #wrap.play #hint{bottom:20%}
 #wrap.play #dlg{bottom:62px}
 #menu .actions{margin:3px 0}
 .mb{padding:8px 11px}
}
@media(orientation:portrait){
 #obj,#met{top:calc(50% - 38vw)}
 #sub{top:calc(50% - 27vw)}
 #dlg,#wrap.play #dlg{bottom:max(65px,calc(50% - 56vw))}
 #hint,#wrap.play #hint{bottom:calc(50% - 35vw)}
 #menu.title{justify-content:flex-start;padding-top:17vh}
 #menu h1{font-size:clamp(30px,12vw,90px)}
 #caption{bottom:calc(50% - 42vw)}
}
@media(max-height:450px) and (orientation:landscape){
 #tools{top:5px}
 #tools button,#skip{padding:4px 7px}
 #obj,#met{top:35px}
 #pad button{padding:6px 2px}
 #wrap.play #dlg{bottom:42px}
 #dlg{padding:8px 12px}
 #menu{gap:5px}
}

 if(p){

   p.phase=phase;
