<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism Runner</title>
<style>
html,body{margin:0;height:100%;background:#12172a;overflow:hidden;color:#e6edf3;
  font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;top:10px;padding:4px 9px;border-radius:6px;
  background:rgba(6,9,18,.55);font-variant-numeric:tabular-nums}
#title{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;
  align-items:center;justify-content:center;background:rgba(6,9,18,.66);text-align:center}
#title b{font-size:34px;letter-spacing:.16em;color:#58d0a0}
#boot{position:absolute;inset:0;display:grid;place-items:center;background:#12172a;
  color:#58d0a0;letter-spacing:.2em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<div id="title"><b>PRISM RUNNER</b><span>A/D lanes · SPACE jump — press ENTER</span></div>
<div id="boot">STARTING</div>

<script src="../../engine/teardown.js"></script>
<script src="../../engine/pool.js"></script>
<script src="../../engine/loop.js"></script>
<script src="../../engine/resscale.js"></script>
<script src="../../engine/bridge.js"></script>
<script src="js/main.js"></script>
</body>
</html>
