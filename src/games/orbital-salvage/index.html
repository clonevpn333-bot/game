<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Salvage</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden}
#stage{position:absolute;inset:0;display:grid;place-items:center}
#layers{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9}
/* Two stacked canvases: the starfield is painted once on resize, the dynamic
   layer is the only one cleared per frame (§1.3, 2D-specific). */
#stars,#dyn{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
#boot{position:absolute;inset:0;display:grid;place-items:center;color:#58d0a0;
      font:600 14px ui-monospace,monospace;letter-spacing:.2em}
</style>
</head>
<body>
<div id="stage"><div id="layers">
  <canvas id="stars"></canvas>
  <canvas id="dyn"></canvas>
  <div id="boot">LOADING</div>
</div></div>

<script src="../../engine/teardown.js"></script>
<script src="../../engine/pool.js"></script>
<script src="../../engine/loop.js"></script>
<script src="../../engine/resscale.js"></script>
<script src="../../engine/bridge.js"></script>
<script src="js/main.js"></script>
</body>
</html>
