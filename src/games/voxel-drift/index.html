<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Drift</title>
<style>
html,body{margin:0;height:100%;background:#8db4e0;overflow:hidden;
  font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;
  pointer-events:none;opacity:.85}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;
  box-shadow:0 0 2px rgba(0,0,0,.6)}
#cross::before{left:6px;top:0;width:2px;height:14px}
#cross::after{left:0;top:6px;width:14px;height:2px}
#hud{position:absolute;left:10px;top:8px;padding:4px 8px;border-radius:6px;
  background:rgba(8,12,18,.55);text-shadow:0 1px 2px rgba(0,0,0,.5)}
#hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  padding:7px 14px;border-radius:8px;background:rgba(8,12,18,.62);white-space:nowrap}
#keys{position:absolute;right:10px;top:8px;padding:4px 8px;border-radius:6px;
  background:rgba(8,12,18,.55);text-align:right;line-height:1.6;opacity:.9}
#boot{position:absolute;inset:0;display:grid;place-items:center;background:#0d1117;
  color:#58d0a0;letter-spacing:.2em;padding:24px;text-align:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="cross"></div>
<div id="hud"></div>
<div id="keys">WASD move · SPACE jump · F fly<br>LMB break · RMB place · 1-6 block</div>
<div id="hint"></div>
<div id="boot">GENERATING TERRAIN</div>

<script src="../../engine/teardown.js"></script>
<script src="../../engine/pool.js"></script>
<script src="../../engine/loop.js"></script>
<script src="../../engine/resscale.js"></script>
<script src="../../engine/bridge.js"></script>
<script src="js/mesher.js"></script>
<script src="js/gfx.js"></script>
<script src="js/main.js"></script>
</body>
</html>
