<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Summit</title><style>/* Summit UI. Same restrained language as the arcade shell: dark, quiet, brass. */
:root {
  --bg: #06070a; --panel: rgba(12,14,18,0.86); --panel-solid: #0d0f14;
  --line: rgba(255,255,255,0.09); --line-2: rgba(255,255,255,0.18);
  --text: #edeff4; --dim: #99a0ae; --dimmer: #656c7a;
  --accent: #e9c68c; --accent-ink: #1a1206;
  --good: #6fd69b; --warn: #ffc46b; --bad: #ff6b6b; --cold: #7fd4ff; --hot: #ff9d4a;
  --r: 14px; --ease: cubic-bezier(.16,1,.3,1);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
  --serif: "Instrument Serif", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }
canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.hide { display: none !important; }

#ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#ui > * { pointer-events: auto; }
.pass { pointer-events: none !important; }

/* ---------- shared chrome ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 99px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--line-2); font-size: 13.5px; font-weight: 550;
  transition: transform .16s var(--ease), background .16s, border-color .16s, box-shadow .2s;
}
.btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.11); }
.btn:active { transform: none; }
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn--primary:hover { background: #f6d9a6; box-shadow: 0 10px 34px -10px rgba(233,198,140,.5); }
.btn--ghost { background: transparent; border-color: var(--line); color: var(--dim); }
.btn--ghost:hover { color: var(--text); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.eyebrow { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: 500; }
.mono { font-family: var(--mono); }

/* ---------- full-screen panels ---------- */
.screen {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
  background: radial-gradient(120% 90% at 50% 0%, rgba(10,12,17,.72), rgba(4,5,8,.95));
  backdrop-filter: blur(16px) saturate(.85);
  animation: fadeIn .4s var(--ease) both;
}
@keyframes fadeIn { from { opacity: 0; } }
.card {
  width: min(880px, calc(100vw - 44px)); max-height: 88vh; overflow: auto;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 24px; padding: 34px 36px;
  box-shadow: 0 40px 120px -30px #000; animation: rise .5s var(--ease) both;
}
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.card h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 4.4vw, 52px); letter-spacing: -.02em; line-height: 1.02; }
.card h2 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 4px; }
.card p { color: var(--dim); font-size: 14px; line-height: 1.6; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row--end { justify-content: flex-end; }
.sep { height: 1px; background: var(--line); margin: 22px 0; }
.field {
  display: flex; align-items: center; gap: 10px; padding: 0 15px; height: 44px; border-radius: 12px;
  background: rgba(255,255,255,.04); border: 1px solid var(--line);
}
.field:focus-within { border-color: var(--line-2); }
.field input { background: none; border: 0; outline: none; width: 100%; font-size: 14px; }
.field input::placeholder { color: var(--dimmer); }
.code { font-family: var(--mono); letter-spacing: .34em; font-size: 30px; color: var(--accent); }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
.crosshair {
  position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
  border-radius: 99px; background: rgba(255,255,255,.72); box-shadow: 0 0 0 1.5px rgba(0,0,0,.45);
  transition: opacity .2s, transform .2s var(--ease);
}
.vitals { position: absolute; left: 26px; bottom: 26px; width: 260px; display: grid; gap: 9px; }
.bar { height: 7px; border-radius: 6px; background: rgba(255,255,255,.10); overflow: hidden; position: relative; }
.bar i { display: block; height: 100%; width: 100%; transform-origin: left; transition: transform .12s linear, background .3s; }
.bar--stam i { background: linear-gradient(90deg, #e9c68c, #ffe6bd); }
.bar--hp i { background: linear-gradient(90deg, #d95757, #ff8b8b); }
.bar--food i { background: linear-gradient(90deg, #8fc46b, #c6e6a2); }
.bar__label { display: flex; justify-content: space-between; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.temp { height: 7px; border-radius: 6px; background: linear-gradient(90deg, #4aa8ff, #6fd69b 45%, #ffb14a 78%, #ff5a3c); position: relative; }
.temp b { position: absolute; top: -3px; width: 3px; height: 13px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1.5px rgba(0,0,0,.5); transition: left .2s var(--ease); }

.altitude { position: absolute; right: 28px; top: 50%; transform: translateY(-50%); width: 78px; height: min(58vh, 460px); }
.altitude__track { position: absolute; right: 20px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.13); border-radius: 2px; }
.altitude__band { position: absolute; right: 17px; width: 8px; border-radius: 3px; opacity: .55; }
.altitude__me { position: absolute; right: 8px; width: 26px; height: 2px; background: var(--accent); box-shadow: 0 0 10px rgba(233,198,140,.9); transition: bottom .18s linear; }
.altitude__mate { position: absolute; right: 14px; width: 14px; height: 2px; background: rgba(255,255,255,.55); transition: bottom .2s linear; }
.altitude__read { position: absolute; right: 34px; text-align: right; font-family: var(--mono); font-size: 13px; transform: translateY(50%); }
.altitude__read span { display: block; font-size: 9.5px; letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }

.team { position: absolute; left: 26px; top: 24px; display: grid; gap: 8px; width: 230px; }
.mate { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px); }
.mate__dot { width: 8px; height: 8px; border-radius: 99px; background: var(--good); flex: none; }
.mate__dot.is-down { background: var(--warn); }
.mate__dot.is-dead { background: var(--dimmer); }
.mate__dot.is-off { background: var(--bad); }
.mate__name { font-size: 12.5px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mate__bar { width: 54px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.mate__bar i { display: block; height: 100%; background: var(--accent); }
.mate__alt { font-family: var(--mono); font-size: 11px; color: var(--dim); min-width: 40px; text-align: right; }

.statuses { position: absolute; left: 26px; bottom: 132px; display: flex; gap: 7px; }
.status { padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; background: rgba(0,0,0,.55); border: 1px solid currentColor; backdrop-filter: blur(8px); }

.prompt {
  position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%);
  padding: 10px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  font-size: 13.5px; backdrop-filter: blur(14px); white-space: nowrap;
  animation: fadeIn .18s var(--ease) both;
}
.prompt b { color: var(--accent); }
.prompt__hold { display: block; height: 3px; margin-top: 7px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
.prompt__hold i { display: block; height: 100%; background: var(--accent); width: 0; }

.belt { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 7px; }
.slot {
  width: 60px; height: 60px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  display: grid; place-items: center; text-align: center; backdrop-filter: blur(12px); position: relative;
  transition: transform .18s var(--ease), border-color .18s;
}
.slot.is-empty { opacity: .35; }
.slot:hover { transform: translateY(-3px); border-color: var(--line-2); }
.slot__key { position: absolute; top: 4px; left: 6px; font-family: var(--mono); font-size: 9.5px; color: var(--dimmer); }
.slot__n { position: absolute; bottom: 4px; right: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--accent); }
.slot__name { font-size: 10px; line-height: 1.15; padding: 0 5px; color: var(--dim); }
.belt__weight { align-self: center; margin-left: 12px; font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
.belt__weight.is-over { color: var(--bad); }

.feed { position: absolute; right: 28px; bottom: 26px; width: 300px; display: grid; gap: 6px; justify-items: end; }
.feed__line { padding: 7px 12px; border-radius: 9px; background: rgba(8,9,12,.7); border: 1px solid var(--line); font-size: 12px; backdrop-filter: blur(10px); animation: fadeIn .25s var(--ease) both; }
.feed__line b { color: var(--accent); }

.banner { position: absolute; left: 50%; top: 16%; transform: translateX(-50%); text-align: center; }
.banner h2 { font-family: var(--serif); font-size: clamp(26px, 4vw, 46px); letter-spacing: -.02em; text-shadow: 0 3px 24px rgba(0,0,0,.7); }
.banner p { color: var(--dim); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
.banner.is-out { animation: bannerOut 1.1s var(--ease) forwards; }
@keyframes bannerOut { to { opacity: 0; transform: translate(-50%, -16px); } }

.netstat { position: absolute; right: 28px; top: 24px; font-family: var(--mono); font-size: 11px; color: var(--dimmer); text-align: right; }
.netstat b { color: var(--good); font-weight: 500; }
.netstat b.is-bad { color: var(--bad); }

.wheel { position: fixed; inset: 0; display: grid; place-items: center; z-index: 25; }
.wheel__ring { position: relative; width: 320px; height: 320px; }
.wheel__item {
  position: absolute; width: 92px; height: 62px; margin: -31px 0 0 -46px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px;
  backdrop-filter: blur(12px); transition: transform .16s var(--ease), border-color .16s, background .16s;
}
.wheel__item.is-hot { background: var(--accent); color: var(--accent-ink); border-color: transparent; transform: scale(1.12); font-weight: 700; }

.chat { position: absolute; left: 26px; bottom: 200px; width: 340px; display: grid; gap: 5px; }
.chat__line { font-size: 12.5px; color: var(--text); text-shadow: 0 1px 4px #000; }
.chat__line b { color: var(--accent); }
.chat__input { margin-top: 6px; }

.vig { position: fixed; inset: 0; pointer-events: none; z-index: 5; transition: opacity .5s; }
.vig--hurt { box-shadow: inset 0 0 180px 40px rgba(180,20,20,.55); opacity: 0; }
.vig--cold { box-shadow: inset 0 0 200px 60px rgba(90,170,255,.35); opacity: 0; }
.vig--tired { box-shadow: inset 0 0 150px 30px rgba(0,0,0,.55); opacity: 0; }

/* ---------- lobby / shop / results ---------- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.list { display: grid; gap: 8px; }
.rowitem { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
.rowitem b { font-size: 13.5px; }
.rowitem span { color: var(--dim); font-size: 12.5px; }
.rowitem__tag { margin-left: auto; font-size: 11px; color: var(--dim); }
.tile {
  padding: 14px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid var(--line);
  cursor: pointer; transition: transform .18s var(--ease), border-color .18s, background .18s;
}
.tile:hover { transform: translateY(-2px); border-color: var(--line-2); }
.tile.is-on { border-color: var(--accent); background: rgba(233,198,140,.10); }
.tile.is-locked { opacity: .55; }
.tile__name { font-size: 13px; font-weight: 600; }
.tile__price { font-size: 11.5px; color: var(--accent); font-family: var(--mono); }
.swatch { height: 44px; border-radius: 9px; margin-bottom: 9px; border: 1px solid rgba(255,255,255,.14); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.badge { display: flex; gap: 12px; align-items: center; padding: 13px 15px; border-radius: 13px; background: rgba(233,198,140,.08); border: 1px solid rgba(233,198,140,.3); }
.badge b { font-size: 13.5px; }
.badge span { color: var(--dim); font-size: 12px; }
.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
.stats th { text-align: left; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-weight: 500; padding: 8px 10px; }
.stats td { padding: 11px 10px; border-top: 1px solid var(--line); }
.stats tr td:first-child { font-weight: 600; }
.wallet { font-family: var(--mono); color: var(--accent); font-size: 14px; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 40; transition: opacity .6s; }
.loading__inner { text-align: center; }
.loading h1 { font-family: var(--serif); font-size: 54px; letter-spacing: -.02em; }
.loading p { color: var(--dim); font-size: 13px; margin-top: 8px; }
.loading__bar { width: 220px; height: 3px; background: rgba(255,255,255,.1); border-radius: 3px; margin: 22px auto 0; overflow: hidden; }
.loading__bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s var(--ease); }
</style></head>
