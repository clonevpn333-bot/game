// Minecraft 26.1+ is unobfuscated: the new "net.fabricmc.fabric-loom" plugin
// does not remap the game or mods, there is no mappings dependency, and
// plain implementation/api configurations replace modImplementation/modApi.
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the repositories needed for Minecraft and Fabric artifacts.
    // GeckoLib publishes to Cloudsmith; Modrinth's maven is the fallback.
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Keyframed animation: real windups, blending and easing, which vanilla's
    // model system cannot express. The published version for a given Minecraft
    // release is not guessable, and a wrong guess fails the whole build at
    // resolution time - which stops the jar being published at all. So the
    // version is opt-in: `none` builds without it and still ships the geometry
    // and animation files, and CI prints the versions that really exist.
    if (project.geckolib_version != "none") {
        implementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        gildedseam {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
