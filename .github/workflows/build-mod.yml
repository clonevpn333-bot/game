name: Build Amberblight jar

# The mod jar is built here rather than by hand: GitHub's runners can reach
# the Fabric and Mojang maven repositories, so this is the authoritative
# build. Every push produces a downloadable jar, and the "latest" prerelease
# always points at the newest one.

on:
  push:
    branches:
      - "claude/minecraft-infection-mod-**"
    paths:
      - "gilded-seam/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gilded-seam

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gilded-seam/**/*.gradle', 'gilded-seam/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # On failure, print just the lines that say what broke, at the very end
      # of the log, so a failed build is cheap to diagnose.
      - name: Build
        run: |
          set +e
          ./gradlew --no-daemon build > /tmp/build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "===== BUILD FAILED ====="
            echo "total errors: $(grep -c 'error:' /tmp/build.log)"
            echo "----- distinct messages (count first) -----"
            grep -oE 'error: .*' /tmp/build.log | sed 's/error: //' | sort | uniq -c | sort -rn | head -40
            echo "----- distinct missing symbols -----"
            grep -oE 'symbol: +(method|class|variable) .*' /tmp/build.log | sort | uniq -c | sort -rn | head -40
            echo "----- first sites -----"
            grep -oE '[A-Za-z0-9_]+\.java:[0-9]+: error: [^\n]*' /tmp/build.log | head -45
            echo "----- non-compile failures -----"
            grep -E 'FAILURE:|What went wrong|Could not (find|resolve|get)|Plugin \[id' /tmp/build.log | head -15
            echo "===== END ====="
          fi
          exit $code

      - name: Show what was produced
        run: ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: amberblight-jar
          path: gilded-seam/build/libs/*.jar
          if-no-files-found: error

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest-blight --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-blight "$jar" \
            --title "Amberblight - latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7} for Minecraft 26.2 (Fabric). Drop the jar in .minecraft/mods alongside Fabric API." \
            --prerelease
