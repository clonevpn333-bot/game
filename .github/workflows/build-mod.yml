name: Build Amberblight jar

# The mod jar is built here rather than by hand: GitHub's runners can reach
# the Fabric and Mojang maven repositories, so this is the authoritative
# build. Every push produces a downloadable jar, and the "latest" prerelease
# always points at the newest one.

on:
  push:
    branches:
      - "claude/minecraft-infection-mod-**"
    paths:
      - "gilded-seam/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A run that hangs is worse than a run that fails: it burns minutes, it
    # holds the queue, and it never tells anyone anything. Nothing here has
    # ever legitimately taken half an hour.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gilded-seam

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gilded-seam/**/*.gradle', 'gilded-seam/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # Which GeckoLib actually exists for this Minecraft version is not
      # guessable, and guessing wrong fails resolution before a single line is
      # compiled - which stops the jar being published at all. So ask, every
      # run, and never block the build on the answer.
      - name: GeckoLib versions
        continue-on-error: true
        run: |
          set +e
          mc=$(grep -oP '(?<=^minecraft_version=).*' gradle.properties)
          echo "minecraft_version = $mc"
          for art in "geckolib-fabric-$mc" "geckolib-fabric" "geckolib"; do
            url="https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/$art/maven-metadata.xml"
            hit=$(curl -sL -o /tmp/meta.xml -w "%{http_code}" "$url")
            echo "[$hit] $art"
            [ "$hit" = "200" ] && grep -oE "<version>[^<]+</version>" /tmp/meta.xml | tail -12
          done
          echo "----- cloudsmith package search -----"
          curl -sL "https://api.cloudsmith.io/v1/packages/geckolib3/geckolib/?query=geckolib-fabric-$mc&page_size=30" \
            | grep -oE '"(name|version)": *"[^"]*"' | paste - - | head -30
          echo "----- modrinth -----"
          curl -sL "https://api.modrinth.com/v2/project/geckolib/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22$mc%22%5D" \
            | grep -oE '"(version_number|id)": *"[^"]*"' | head -20
          exit 0

      # On failure, print just the lines that say what broke, at the very end
      # of the log, so a failed build is cheap to diagnose.
      - name: Build
        run: |
          set +e
          ./gradlew --no-daemon build > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== BUILD FAILED (oracle first, errors last) ====="
            echo "----- API ORACLE: locating classes in the resolved Minecraft jar -----"
            jar=$(find ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -iE "minecraft" | grep -viE "sources|javadoc" | head -1)
            echo "jar: $jar"
            if [ -n "$jar" ]; then
              unzip -l "$jar" | grep -oE "net/minecraft/[A-Za-z0-9/_]*/(ResourceLocation|Cow|Pig|Chicken|Spider|Creeper|Sheep|Zombie|AbstractSkeleton|AbstractVillager|Villager|IronGolem|WaterAnimal|ServerLevelAccessor|ThrowableItemProjectile|SpawnEggItem|ServerBossEvent|Monster|PathfinderMob)\\.class" | sort -u | head -50
              echo "----- API ORACLE: net.minecraft.resources -----"
              unzip -l "$jar" | grep -oE "net/minecraft/resources/[A-Za-z0-9_$]*\\.class" | sort -u | head -25
              echo "----- API ORACLE: anything named like a resource id -----"
              unzip -l "$jar" | grep -oE "net/minecraft/[A-Za-z0-9/_]*/(Identifier|ResourceKey|ResourceLocation)\\.class" | sort -u | head -10
              echo "----- API ORACLE: constructors -----"
              echo "### EntityRenderState fields"
              javap -p -cp "$jar" net.minecraft.client.renderer.entity.state.LivingEntityRenderState 2>/dev/null | grep -iE "walk|attack|age|Rot" | head -12
              echo "### ModelPart members"
              javap -p -cp "$jar" net.minecraft.client.model.geom.ModelPart 2>/dev/null | grep -iE "hasChild|getChild|visible" | head -6
              echo "### ThrowableItemProjectile constructors"
              javap -p -cp "$jar" net.minecraft.world.entity.projectile.throwableitemprojectile.ThrowableItemProjectile 2>/dev/null | grep -E "ThrowableItemProjectile\(" | head -6
              echo "### LevelAccessor day time"
              javap -p -cp "$jar" net.minecraft.world.level.LevelAccessor 2>/dev/null | grep -iE "day|time" | head -6
              echo "### Identifier factories"
              javap -p -cp "$jar" net.minecraft.resources.Identifier 2>/dev/null | grep -E "fromNamespaceAndPath|parse|of\(" | head -10
              echo "### Item.Properties (spawn egg / component binding)"
              javap -p -cp "$jar" 'net.minecraft.world.item.Item$Properties' 2>/dev/null | grep -iE "spawn|egg|Properties [a-z]" | head -20
              echo "### Vec3 statics"
              javap -p -cp "$jar" net.minecraft.world.phys.Vec3 2>/dev/null | grep -iE "atCenterOf|atLowerCornerOf|static" | head -8
              echo "### EntityType statics"
              javap -p -cp "$jar" net.minecraft.world.entity.EntityType 2>/dev/null | grep -iE "static|Builder" | head -10
                echo "### spawn eggs: how does an entity get into the world"
              javap -p -cp "$jar" net.minecraft.world.entity.EntityType 2>/dev/null | grep -E "spawn\(|create\(" | head -8
              echo "--- EntitySpawnReason constants"
              javap -p -cp "$jar" net.minecraft.world.entity.EntitySpawnReason 2>/dev/null | grep -E "public static final" | head -14
              echo "--- SpawnEggItem"
              javap -p -cp "$jar" net.minecraft.world.item.SpawnEggItem 2>/dev/null | head -12
              echo "--- Entity placement + creative check"
              javap -p -cp "$jar" net.minecraft.world.entity.Entity 2>/dev/null | grep -E "snapTo|moveTo|setPos\(" | head -6
              javap -p -cp "$jar" net.minecraft.world.entity.player.Player 2>/dev/null | grep -iE "infinite|creative|abilities" | head -6
              echo "### block hooks that keep moving"
              javap -p -cp "$jar" net.minecraft.world.level.block.state.BlockBehaviour 2>/dev/null | grep -E "entityInside|stepOn" | head -4
              javap -p -cp "$jar" 'net.minecraft.world.level.block.state.BlockBehaviour$Properties' 2>/dev/null | grep -iE "ollis" | head -4
              echo "### item use animation enum"
              unzip -l "$jar" | grep -oE "net/minecraft/world/item/(ItemUseAnimation|UseAnim)\.class" | sort -u
            echo "----- API ORACLE: member signatures -----"
              for c in net.minecraft.world.level.Level net.minecraft.core.BlockPos net.minecraft.world.entity.player.Player net.minecraft.world.item.SpawnEggItem net.minecraft.server.level.ServerBossEvent; do
                echo "### $c"
                javap -cp "$jar" "$c" 2>/dev/null | grep -iE "isClientSide|getRandom|random|center|Message|public $(echo $c | sed 's/.*\.//')" | head -12
              done
            fi
            echo "total errors: $(grep -c 'error:' /tmp/build.log)"
            echo "----- distinct messages (count first) -----"
            grep -oE 'error: .*' /tmp/build.log | sed 's/error: //' | sort | uniq -c | sort -rn | head -40
            echo "----- distinct missing symbols -----"
            grep -oE 'symbol: +(method|class|variable) .*' /tmp/build.log | sort | uniq -c | sort -rn | head -40
            echo "----- sample sites -----"
            grep -oE '[A-Za-z0-9_]+\.java:[0-9]+: error: [^\n]*' /tmp/build.log | sort -u | head -12
            echo "----- non-compile failures -----"
            grep -E 'FAILURE:|What went wrong|Could not (find|resolve|get)|Plugin \[id' /tmp/build.log | head -15
            echo "===== END ====="
          fi
          exit $status

      - name: Show what was produced
        run: ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: amberblight-jar
          path: gilded-seam/build/libs/*.jar
          if-no-files-found: error

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest-blight --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-blight "$jar" \
            --title "Amberblight - latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7} for Minecraft 26.2 (Fabric). Drop the jar in .minecraft/mods alongside Fabric API." \
            --prerelease

      # The same argument as the model dump, applied to datapack JSON. The
      # server refused to load with "Unknown registry key ...:
      # minecraft:random_patch" and "No key has_ender_dragon_fight" - both of
      # them schema drift, and both of them things the jar knows the answer to,
      # because it ships its own worldgen data. Reading Mojang's file for the
      # thing we are copying beats guessing at what the field is called now.
      - name: Worldgen schema, straight out of the jar
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set +e
          jar=$(find ~/.gradle/caches -name "*.jar" 2>/dev/null \
            | grep -iE "minecraft" | grep -viE "sources|javadoc" \
            | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q "data/minecraft/dimension_type/" && echo {}' \
            | head -1)
          echo "data jar: $jar"
          [ -z "$jar" ] && exit 0
          echo "===== a vanilla dimension_type, in full ====="
          unzip -p "$jar" data/minecraft/dimension_type/the_nether.json
          echo "===== feature types actually registered ====="
          for f in $(unzip -l "$jar" \
                | grep -oE "data/minecraft/worldgen/configured_feature/[A-Za-z0-9_]+\.json"); do
            unzip -p "$jar" "$f" 2>/dev/null | tr -d ' \n' | grep -oE '"type":"[a-z0-9_:]+"' | head -1
          done | sort -u
          echo "===== placement modifier types actually used ====="
          for f in $(unzip -l "$jar" \
                | grep -oE "data/minecraft/worldgen/placed_feature/[A-Za-z0-9_]+\.json" | head -60); do
            unzip -p "$jar" "$f" 2>/dev/null | tr -d ' \n' | grep -oE '"type":"[a-z0-9_:]+"'
          done | sort -u
          echo "===== the animation API, as it actually is ====="
          # The mod plays animations through vanilla's keyframe system
          # (AnimationDefinition.bake -> KeyframeAnimation.apply). Driving a
          # *cyclic* one off walk speed needs whichever method 26.2 spells
          # that with, and guessing at it is a build per guess.
          cjar=$(find ~/.gradle/caches -name "*.jar" 2>/dev/null \
            | grep -iE "minecraft" | grep -viE "sources|javadoc" \
            | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q "net/minecraft/client/animation/KeyframeAnimation.class" && echo {}' \
            | head -1)
          for c in net.minecraft.client.animation.KeyframeAnimation \
                   net.minecraft.client.animation.AnimationDefinition \
                   net.minecraft.client.animation.AnimationChannel \
                   net.minecraft.client.animation.KeyframeAnimations \
                   net.minecraft.client.model.EntityModel; do
            echo "--- $c"
            javap -p -cp "$cjar" "$c" 2>&1 | head -30
          done
          echo "===== a vanilla advancement that filters on entity type ====="
          # Two of the mod's advancements fail with "Unknown registry key in
          # entity_sub_predicate_type: minecraft:type", which means the entity
          # predicate now dispatches sub-predicates on `type` and the entity
          # *type* match has moved to some other key. Mojang's own kill
          # advancements say which one.
          for f in $(unzip -l "$jar" \
                | grep -oE "data/minecraft/advancement/[A-Za-z0-9_/]+\.json"); do
            unzip -p "$jar" "$f" 2>/dev/null | grep -q "player_killed_entity" \
              && { echo "--- $f"; unzip -p "$jar" "$f"; break; }
          done
          echo "===== a vanilla random-patch-shaped feature, in full ====="
          for cand in patch_grass_plain patch_sugar_cane patch_dead_bush flower_default; do
            p="data/minecraft/worldgen/configured_feature/$cand.json"
            unzip -l "$jar" | grep -q "$p" && { echo "--- $cand"; unzip -p "$jar" "$p"; break; }
          done

      # Guessing at a Warden's proportions produces something that is not a
      # Warden. The real numbers are inside the jar, as code, in each model's
      # createBodyLayer() - so call it and walk what comes back. The dump is
      # uploaded as an artifact and becomes the source for the boss models.
      - name: Dump vanilla model geometry
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e
          # Entity models are CLIENT classes. minecraft-common.jar does not
          # contain them, so every minecraft jar goes on the classpath, not
          # just the first one found.
          jars=$(find ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -iE "minecraft" | grep -viE "sources|javadoc" | sort -u)
          echo "minecraft jars:"; echo "$jars"
          [ -z "$jars" ] && exit 0
          jar=$(echo "$jars" | tr '\n' ':')
          deps=$(find ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -iE "joml|guava|datafixerupper|fastutil|slf4j|gson|brigadier|authlib|netty|commons|log4j|oshi|jopt|lwjgl|text2speech|blocklist|logging" | tr '\n' ':')
          mkdir -p /tmp/oracle
          javac -nowarn -cp "$jar$deps" -d /tmp/oracle tools/oracle/DumpModels.java 2>&1 | tail -5
          # Six of the twenty had no static factory on the class itself -
          # vanilla keeps some layer definitions on sibling holders. Rather
          # than hunt each one, enumerate every model class in the client jar
          # and let the dumper skip the ones with nothing to call. One sweep,
          # every mob, and it stays correct when Mojang moves things again.
          : > /tmp/classes.txt
          for j in $jars; do
            unzip -l "$j" 2>/dev/null \
              | grep -oE "net/minecraft/client/model/[A-Za-z0-9/_]*\.class" \
              | grep -v '\$' >> /tmp/classes.txt
          done
          sort -u -o /tmp/classes.txt /tmp/classes.txt
          echo "model classes found: $(wc -l < /tmp/classes.txt)"
          names=$(sed 's#/#.#g; s#\.class$##' /tmp/classes.txt | tr '\n' ' ')
          echo "dumping: $names"
          # There used to be a javap survey here that printed the static
          # LayerDefinition factories on every class - and it was pasted in
          # twice. Two hundred and twenty classes, several jars each, two
          # passes: about fifteen hundred JVM starts, which took this step past
          # half an hour and left it running long after the build it belonged
          # to had finished. It was scaffolding from before the dumper could
          # report for itself, and the dumper's own per-model error line says
          # the same thing more precisely and for free.
          timeout 240 java -cp "$jar$deps:/tmp/oracle" DumpModels $names > /tmp/vanilla-models.json 2>/tmp/dump.err
          echo "dump exit: $? (124 = timed out)"
          # The warm-up prints why a utility class failed to initialise, and
          # that is the root cause of every downstream "Could not initialize
          # class" - so print enough of it to read the stack trace, not five
          # lines of the tail.
          echo "--- stderr ---"; head -60 /tmp/dump.err
          echo "--- bytes: $(wc -c < /tmp/vanilla-models.json) ---"
          # The dump used to be echoed bone by bone - thousands of lines, back
          # when it was the only way to get the geometry off the runner. It is
          # committed to the branch now, so all that printing does is bury
          # every other step's output past the end of any readable log tail.
          # A summary and the failures; the data is in the file.
          echo "=====VANILLA-MODELS-BEGIN====="
          python3 -c 'import json; d=json.load(open("/tmp/vanilla-models.json"))["models"]; ok=[k for k,v in d.items() if "error" not in v]; print(len(ok),"models dumped,",sum(len(d[k]["bones"]) for k in ok),"bones"); [print("ERR",k.split(".")[-1],v["error"][:160]) for k,v in d.items() if "error" in v]'
          echo "=====VANILLA-MODELS-END====="
          mkdir -p oracle-out && cp /tmp/vanilla-models.json oracle-out/ 2>/dev/null
          exit 0

      - name: Upload vanilla model dump
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-models
          path: gilded-seam/oracle-out/vanilla-models.json
          if-no-files-found: warn

      # Commit the dump back to the branch. Scraping 20 models out of a log is
      # miserable and lossy; having the file in the tree means the bench can
      # build hosts straight from vanilla geometry. [skip ci] stops this from
      # re-triggering the workflow it runs inside.
      - name: Commit the model dump
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          [ -s oracle-out/vanilla-models.json ] || exit 0
          mkdir -p tools/oracle
          cp oracle-out/vanilla-models.json tools/oracle/vanilla-models.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/oracle/vanilla-models.json
          git diff --cached --quiet && echo "dump unchanged" && exit 0
          git commit -m "Vanilla model geometry, dumped from the ${GITHUB_SHA::7} jar [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed; artifact still uploaded"
          exit 0

      # The mod compiled and shipped for weeks without anyone knowing whether a
      # world would actually generate with it installed. It would not. So boot a
      # real dedicated server, let it build a world, and read the log: "Done ("
      # only appears once generation finished and the server is accepting
      # players. This is the test that catches a datapack that hangs rather
      # than throws.
      - name: Does a world actually generate
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          {
            echo "online-mode=false"
            echo "max-tick-time=-1"
            echo "level-name=smoke"
            echo "sync-chunk-writes=false"
          } > run/server.properties
          # A Minecraft server does not stop by itself, so waiting on it always
          # cost the full timeout - ten minutes per build to learn something
          # the log states in the first thirty seconds. Start it, watch the
          # log, and stop the moment it has answered: "Done (" means the world
          # generated, and the process dying on its own means it did not.
          ./gradlew --no-daemon runServer > /tmp/server.log 2>&1 &
          gradle=$!
          answer=""
          for i in $(seq 1 120); do
            if grep -q 'Done (' /tmp/server.log; then answer="generated"; break; fi
            if grep -q "can't proceed with server load" /tmp/server.log; then
              answer="datapack"; break
            fi
            kill -0 "$gradle" 2>/dev/null || { answer="died"; break; }
            sleep 5
          done
          kill -TERM "$gradle" 2>/dev/null
          pkill -f "net.minecraft" 2>/dev/null
          wait "$gradle" 2>/dev/null
          echo "===== SERVER SMOKE TEST ====="
          echo "--- verdict after $((i * 5))s: ${answer:-timed out}"
          if [ "$answer" = "generated" ]; then
            echo "WORLD GENERATED OK"
            grep -m1 'Done (' /tmp/server.log
          else
            echo "WORLD DID NOT FINISH GENERATING"
          fi
          echo "----- last preparing/loading lines -----"
          grep -iE "Preparing|Loading|level|dimension|datapack|registry" /tmp/server.log | tail -20
          echo "----- exceptions -----"
          grep -iE "Exception|Caused by|ERROR\]|FATAL|failed to load|Missing|Unknown|could not" /tmp/server.log \
            | grep -viE "advancement|recipe book" | head -30
          echo "----- our own log lines -----"
          grep -i "gilded\|amberblight\|seam" /tmp/server.log | head -15
          echo "===== END SMOKE ====="
          exit 0
