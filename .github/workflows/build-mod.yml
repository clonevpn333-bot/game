name: Build Amberblight jar

# The mod jar is built here rather than by hand: GitHub's runners can reach
# the Fabric and Mojang maven repositories, so this is the authoritative
# build. Every push produces a downloadable jar, and the "latest" prerelease
# always points at the newest one.

on:
  push:
    branches:
      - "claude/minecraft-infection-mod-**"
    paths:
      - "gilded-seam/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gilded-seam

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle and Loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            gilded-seam/.gradle/loom-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('gilded-seam/**/*.gradle', 'gilded-seam/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Show what was produced
        run: ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: amberblight-jar
          path: gilded-seam/build/libs/*.jar
          if-no-files-found: error

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release delete latest-blight --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-blight "$jar" \
            --title "Amberblight - latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7} for Minecraft 26.2 (Fabric). Drop the jar in .minecraft/mods alongside Fabric API." \
            --prerelease
