name: CI

on:
  # Every push to a branch that has this file (the repository's other branches
  # hold unrelated projects with their own workflows).
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  accuracy:
    name: Engine accuracy (clean tier)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:accuracy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accuracy-report
          path: docs/accuracy/

  web-e2e:
    name: Website end-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @binderready/web exec playwright install --with-deps chromium
      - run: pnpm --filter @binderready/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-results
          path: apps/web/test-results/

  showcase-screenshots:
    name: Design showcase screenshots
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @binderready/design exec playwright-core install --with-deps chromium
      - run: pnpm screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-screenshots
          path: docs/screenshots/phase-0/

  desktop:
    name: Desktop app (Rust checks, OCR accuracy, end-to-end)
    runs-on: ubuntu-24.04
    needs: checks
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: System libraries (WebKitGTK, Tesseract, libheif, corpus tools)
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libclang-dev
          libtesseract-dev libleptonica-dev tesseract-ocr-eng
          libheif-dev libheif-plugin-libde265 libheif-plugin-x265 libheif-examples
          poppler-utils qpdf imagemagick webkit2gtk-driver xvfb xdotool xclip
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @binderready/desktop fetch:pdfium
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --release
      - name: Native OCR engines type-check for Windows and macOS
        working-directory: apps/desktop/src-tauri/native-ocr
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
          cargo clippy --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy --target aarch64-apple-darwin -- -D warnings
      - name: Build the app and the ingest CLI
        run: |
          pnpm --filter @binderready/desktop tauri build --no-bundle
          cargo build --release --bin binderready-ingest --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Corpus (clean, scanned, photo)
        working-directory: packages/corpus
        run: |
          node src/generate.ts
          node src/degrade.ts --tier scanned
          node src/degrade.ts --tier photo
          node src/two-year.ts
      - name: Accuracy through the desktop pipeline
        working-directory: packages/corpus
        run: |
          node src/harness.ts --tier scanned
          node src/harness.ts --tier photo
          node src/bench.ts
      - run: cargo install tauri-driver --locked
      - run: pnpm --filter @binderready/desktop exec playwright-core install --with-deps chromium
      - name: End-to-end (real app over WebDriver, export verified page by page)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" node apps/desktop/scripts/e2e.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-results
          path: |
            docs/accuracy/
            docs/export-sizes.md
            docs/screenshots/phase-3/
            docs/screenshots/phase-4/
            docs/screenshots/phase-5/
