name: Publish Nova Arcade

# The Pages API refuses to let a workflow token create the site
# ("Resource not accessible by integration"), but pushing to a branch named
# gh-pages makes GitHub build and publish it. So that is what this does.

on:
  push:
    branches: ["claude/nova-arcade-hub-ngu35n", "live", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build the single-file version
        run: |
          npm install --no-audit --no-fund
          node tools/bundle.js
          cp dist/nova-arcade.html site/nova-arcade.html
          touch site/.nojekyll

      - name: Publish site/ to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f site
          git commit -m "build $GITHUB_SHA" || echo "nothing new to commit"
          git push -f origin "$(git subtree split --prefix=site)":refs/heads/gh-pages
