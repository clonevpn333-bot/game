name: Deploy Nova Arcade to GitHub Pages

on:
  push:
    branches: ["claude/nova-arcade-hub-ngu35n", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the single-file version
        run: |
          npm ci --omit=optional || npm install
          node tools/bundle.js
          cp dist/nova-arcade.html site/nova-arcade.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
