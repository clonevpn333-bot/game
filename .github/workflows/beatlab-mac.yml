name: BeatLab Mac app

on:
  push:
    paths:
      - 'beatlab/**'
      - '.github/workflows/beatlab-mac.yml'
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: beatlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build BeatLab.app for Apple Silicon and Intel
        run: npm run mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: BeatLab-mac
          path: |
            beatlab/dist/*.dmg
            beatlab/dist/*.zip
          if-no-files-found: error
