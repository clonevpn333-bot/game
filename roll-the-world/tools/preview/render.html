<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Roll the World preview</title>
<style>
  html, body { margin: 0; background: #1a1240; font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; }
  .label { position: absolute; color: #fff; text-align: center; font-size: 15px; font-weight: 800;
           text-shadow: 0 2px 0 #261a4a, 0 0 6px #261a4a; pointer-events: none; }
  .label small { display: block; font-size: 12px; font-weight: 700; }
  #title { position: absolute; left: 24px; top: 14px; color: #fff; font-size: 34px; font-weight: 900;
           text-shadow: 0 3px 0 #261a4a; letter-spacing: 1px; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="wrap"><div id="title"></div></div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const params = new URLSearchParams(location.search);
const mode = params.get("mode");
const data = await (await fetch("/data.json")).json();
const W = Number(params.get("w") || 1600), H = Number(params.get("h") || 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("wrap").appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const RARITY = { Common: "#c9d3dd", Uncommon: "#7be08f", Rare: "#6fb6ff", Epic: "#c98bff", Legendary: "#ffd23f" };

// --- Assembled mesh groups -> three.js (same triangles the game feeds to EditableMesh) --------
// Roblox materials are approximated with procedural grayscale textures multiplied by the color.
function makeTexture(kind) {
  const size = 256, c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const img = g.createImageData(size, size);
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const noise = new Float32Array(size * size).map(() => rnd());
  const blur = (x, y, r) => { let s = 0, n = 0; for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { s += noise[((y + dy + size) % size) * size + ((x + dx + size) % size)]; n++; } return s / n; };
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    let v = 1;
    const n1 = noise[y * size + x];
    if (kind === "wood") { const l = blur(x, Math.floor(y / 6) * 6, 1); v = 0.84 + 0.1 * Math.sin((x * 0.06 + l * 6) * 3) + 0.06 * (n1 - 0.5); }
    else if (kind === "planks") { const plank = Math.floor(y / 32); v = 0.82 + 0.08 * Math.sin(x * 0.05 + plank * 7 + blur(x, y, 1) * 4) + (y % 32 < 2 ? -0.25 : 0) + 0.05 * (n1 - .5) + (plank % 2) * 0.04; }
    else if (kind === "fabric") { v = 0.86 + ((x % 4 < 2) !== (y % 4 < 2) ? 0.07 : -0.03) + 0.06 * (n1 - .5); }
    else if (kind === "grass") { v = 0.78 + 0.3 * (blur(x, y, 1) - 0.5) + 0.18 * (n1 - .5); }
    else if (kind === "speckle") { v = 0.86 + 0.22 * (blur(x, y, 2) - 0.5) + (n1 > 0.97 ? -0.18 : 0); }
    else if (kind === "marble") { const t = Math.sin((x + y) * 0.03 + blur(x, y, 3) * 12); v = 0.93 + 0.07 * Math.pow(Math.abs(t), 6) * -2 + 0.03 * (n1 - .5); }
    else if (kind === "metal") { v = 0.9 + 0.08 * (blur(x, Math.floor(y), 0) - 0.5) + 0.06 * (noise[(y * size + (x * 3) % size)] - 0.5); }
    else if (kind === "foil") { v = 0.85 + 0.25 * (blur(x, y, 2) - 0.5); }
    v = Math.max(0, Math.min(1, v)) * 255;
    const o = (y * size + x) * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = v; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
const MAT_TEX = { Wood: "wood", WoodPlanks: "planks", Fabric: "fabric", Grass: "grass", Sand: "speckle", Ground: "speckle",
  Pebble: "speckle", Slate: "speckle", Rock: "speckle", Sandstone: "speckle", Pavement: "speckle", Marble: "marble",
  Granite: "speckle", Metal: "metal", DiamondPlate: "metal", Foil: "foil" };
const texCache = {};
function texFor(mat) { const k = MAT_TEX[mat]; if (!k) return null; return texCache[k] || (texCache[k] = makeTexture(k)); }

const matCache = new Map();
function material(color, mat, transparency, neon) {
  const key = color + mat + transparency + neon;
  if (matCache.has(key)) return matCache.get(key);
  const c = new THREE.Color(color);
  const m = new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0, envMapIntensity: 0.5, vertexColors: true });
  const tex = texFor(mat);
  if (tex) m.map = tex;
  if (neon || mat === "Neon") { m.emissive = c.clone(); m.emissiveIntensity = 1.6; m.roughness = 1; m.vertexColors = false; }
  if (mat === "Glass") { m.transparent = true; m.opacity = Math.min(0.5, 1 - transparency); m.roughness = 0.04; m.envMapIntensity = 1.4; }
  if (mat === "Foil" || mat === "Metal" || mat === "DiamondPlate") { m.metalness = 0.8; m.roughness = 0.28; m.envMapIntensity = 1.2; }
  if (["Fabric", "Wood", "WoodPlanks", "Grass", "Sand", "Ground", "Pebble", "Slate", "Rock", "Sandstone"].includes(mat)) m.roughness = 0.88;
  if (mat === "SmoothPlastic") m.roughness = 0.42;
  if (mat === "Marble" || mat === "Granite") m.roughness = 0.25;
  if (transparency > 0 && mat !== "Glass") { m.transparent = true; m.opacity = 1 - transparency; }
  matCache.set(key, m);
  return m;
}
function groupMesh(g) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(g.v, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(g.no, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(g.uv, 2));
  const col = new Float32Array(g.s.length * 3);
  g.s.forEach((s, i) => { col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = s; });
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.setIndex(g.i.map((i) => i - 1));
  const mesh = new THREE.Mesh(geo, material(g.c, g.m, g.t, g.n));
  mesh.castShadow = !g.n && g.t < 0.5;
  mesh.receiveShadow = true;
  return mesh;
}
function buildModel(groups) {
  const root = new THREE.Group();
  for (const g of groups) root.add(groupMesh(g));
  return root;
}
const geoCache = new Map();
function wedgeGeometry() {
  const g = new THREE.BufferGeometry();
  const x = 0.5, y = 0.5, z = 0.5;
  const v = [ -x,-y,-z, x,-y,-z, x,-y,z, -x,-y,-z, x,-y,z, -x,-y,z,  -x,-y,z, x,-y,z, x,y,z, -x,-y,z, x,y,z, -x,y,z,
    -x,-y,-z, -x,y,z, x,y,z, -x,-y,-z, x,y,z, x,-y,-z,  -x,-y,-z, -x,-y,z, -x,y,z, x,-y,-z, x,y,z, x,-y,z ];
  g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
  g.computeVertexNormals();
  return g;
}
function baseGeometry(shape) {
  if (geoCache.has(shape)) return geoCache.get(shape);
  let g;
  if (shape === "Block") g = new THREE.BoxGeometry(1, 1, 1);
  else if (shape === "Cylinder") { g = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); g.rotateZ(Math.PI / 2); }
  else if (shape === "Ball") g = new THREE.SphereGeometry(0.5, 24, 16);
  else g = wedgeGeometry();
  // Box UVs in "studs/4" so procedural textures tile like Roblox materials (scaled per mesh below).
  geoCache.set(shape, g);
  return g;
}
function mapMaterial(color, mat, transparency) {
  const m = material(color, mat, transparency, mat === "Neon").clone();
  m.vertexColors = false;
  return m;
}
function lights(scene, strength = 1, sunDir = new THREE.Vector3(0.6, 1, 0.45), extent = 60) {
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x6b5a8f, 0.9 * strength));
  const sun = new THREE.DirectionalLight(0xfff1dd, 2.4 * strength);
  sun.position.copy(sunDir.clone().multiplyScalar(extent * 3));
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const c = sun.shadow.camera;
  c.left = -extent; c.right = extent; c.top = extent; c.bottom = -extent; c.near = 1; c.far = extent * 8;
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  scene.environment = envTex;
}
// Full-frame render with bloom (Roblox's BloomEffect equivalent).
// Direct render (an EffectComposer chain double-encoded gamma under swiftshader and washed
// everything out, which misrepresented the in-game look).
function renderPost(scene, cam) {
  renderer.render(scene, cam);
}
function bounds(obj) { return new THREE.Box3().setFromObject(obj); }

function label(x, y, w, html) {
  const d = document.createElement("div");
  d.className = "label";
  d.style.left = x + "px"; d.style.top = y + "px"; d.style.width = w + "px";
  d.innerHTML = html;
  document.getElementById("wrap").appendChild(d);
}

// --- Modes -------------------------------------------------------------------------------------
if (mode === "gallery") {
  const kit = params.get("kit");
  const page = Number(params.get("page") || 0);
  const cols = 6, rows = 4, per = cols * rows;
  const list = Object.entries(data.props).filter(([, d]) => d.kit === kit).sort((a, b) => a[1].size - b[1].size);
  const slice = list.slice(page * per, page * per + per);
  document.getElementById("title").textContent = params.get("title") || kit;
  renderer.setScissorTest(true);
  renderer.setClearColor(0x1a1240);
  renderer.clear();
  const top = 64, cw = W / cols, ch = (H - top) / rows;
  slice.forEach(([uid, def], i) => {
    const cx = (i % cols) * cw, cy = top + Math.floor(i / cols) * ch;
    const scene = new THREE.Scene();
    const model = buildModel(def.groups);
    scene.add(model);
    const b = bounds(model), size = b.getSize(new THREE.Vector3()), center = b.getCenter(new THREE.Vector3());
    const radius = Math.max(size.length() / 2, 0.5);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(radius * 1.4, 48), new THREE.MeshStandardMaterial({ color: 0x3a2d78, roughness: 0.9 }));
    floor.rotation.x = -Math.PI / 2; floor.position.set(center.x, b.min.y - 0.01, center.z); floor.receiveShadow = true;
    scene.add(floor);
    lights(scene, 1, new THREE.Vector3(0.5, 1, 0.7), radius * 1.6);
    const cam = new THREE.PerspectiveCamera(30, cw / (ch - 34), radius * 0.1, radius * 20);
    const dir = new THREE.Vector3(0.75, 0.55, 1).normalize();
    cam.position.copy(center).add(dir.multiplyScalar(radius / Math.sin(THREE.MathUtils.degToRad(15)) * 1.02));
    cam.lookAt(center);
    const glY = H - (cy + ch);
    renderer.setViewport(cx + 4, glY + 34, cw - 8, ch - 38);
    renderer.setScissor(cx + 4, glY + 34, cw - 8, ch - 38);
    renderer.setClearColor(new THREE.Color("#2a1f5c"));
    renderer.clear();
    renderer.render(scene, cam);
    label(cx, cy + ch - 36, cw, `${def.name}<small style="color:${RARITY[def.rarity]}">${def.rarity} · ${def.size.toFixed(1)} cm</small>`);
  });
} else if (mode === "nana") {
  document.getElementById("title").textContent = "Nana Nova";
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#2a1f5c");
  const chair = buildModel(data.chair); chair.rotation.y = Math.PI; scene.add(chair);
  const nana = buildModel(data.nana); nana.rotation.y = Math.PI; nana.position.set(0, 4.6, -0.3); scene.add(nana);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.MeshStandardMaterial({ color: 0x96e28c, roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // Stars in the background.
  const starGeo = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i < 600; i++) pts.push((Math.random() - 0.5) * 300, Math.random() * 150, -60 - Math.random() * 80);
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xfff3b0, size: 0.8 })));
  lights(scene, 1, new THREE.Vector3(0.4, 1, -0.8), 20);
  const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 1000);
  cam.position.set(9, 12, -24); cam.lookAt(0, 7.5, 0);
  renderPost(scene, cam, 0.5);
} else if (mode === "map") {
  const map = data.maps[params.get("kit")];
  document.getElementById("title").textContent = params.get("title") || params.get("kit");
  const scene = new THREE.Scene();
  const L = map.lighting;
  scene.background = new THREE.Color(L.FogColor);
  scene.fog = new THREE.Fog(new THREE.Color(L.FogColor), 900, 4200);
  for (const g of map.geometry) {
    if ((g.transparency || 0) >= 0.99) continue;
    const shape = g.shape === "Wedge" ? "Wedge" : g.shape === "Cylinder" ? "Cylinder" : g.shape === "Ball" ? "Ball" : "Block";
    const m = mapMaterial(g.color, g.material, g.transparency || 0);
    if (m.map) { m.map = m.map.clone(); m.map.needsUpdate = true; m.map.repeat.set(Math.max(g.size[0], g.size[2]) / 16, Math.max(g.size[1], g.size[2]) / 16); }
    const mesh = new THREE.Mesh(baseGeometry(shape), m);
    mesh.scale.set(g.size[0], g.size[1], g.size[2]);
    mesh.position.set(g.pos[0], g.pos[1], g.pos[2]);
    mesh.rotation.order = "YZX";
    mesh.rotation.y = THREE.MathUtils.degToRad(g.yaw);
    mesh.rotation.z = THREE.MathUtils.degToRad(g.roll || 0);
    mesh.castShadow = g.kind !== "tile" && g.kind !== "floor" && g.kind !== "path" && g.kind !== "rug" && g.kind !== "water";
    mesh.receiveShadow = true;
    scene.add(mesh);
  }
  const templates = new Map();
  for (const [uid, x, y, z, yaw, scale] of map.props) {
    let t = templates.get(uid);
    if (!t) { t = buildModel(data.props[String(uid)].groups); templates.set(uid, t); }
    const m = t.clone();
    m.position.set(x, y, z); m.rotation.y = -yaw; m.scale.setScalar(scale);
    scene.add(m);
  }
  const view = params.get("view") || "overview";
  const sp = map.spawn;
  let cam;
  if (view === "overview") {
    lights(scene, 1.05, new THREE.Vector3(0.55, 1, 0.35), map.arenaHalf * 1.3);
    cam = new THREE.PerspectiveCamera(40, W / H, 5, 8000);
    cam.position.set(map.arenaHalf * 0.95, map.arenaHalf * 1.25, map.arenaHalf * 1.55);
    cam.lookAt(0, 0, -40);
  } else {
    // Ball's-eye view right at spawn: what a new player sees in their first second.
    lights(scene, 1.05, new THREE.Vector3(0.55, 1, 0.35), 160);
    cam = new THREE.PerspectiveCamera(70, W / H, 0.3, 5000);
    cam.position.set(sp[0] - 4, sp[1] + 9, sp[2] + 28);
    cam.lookAt(sp[0] + 2, sp[1] + 2, sp[2] - 30);
    // The player's ball (classic shell) with a few stuck props for scale.
    const ball = new THREE.Mesh(new THREE.SphereGeometry(1.5, 40, 24), new THREE.MeshStandardMaterial({ color: 0xff7a45, roughness: 0.35, envMap: envTex }));
    ball.position.set(sp[0] - 2, sp[1] + 1.5, sp[2] + 16); ball.castShadow = true; scene.add(ball);
  }
  renderPost(scene, cam, 0.3);
}
document.body.dataset.done = "1";
</script>
</body>
