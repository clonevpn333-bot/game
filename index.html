            const got = Save.has(a.id);
            ctx.fillStyle = got ? 'rgba(255,210,63,0.18)' : 'rgba(255,255,255,0.05)';
            U.roundRect(ctx, 240, y, CFG.W - 480, 52, 10); ctx.fill();
            U.text(ctx, got ? '✔' : '🔒', 268, y + 26, '700 22px system-ui', got ? PAL.qualGreen : '#888', 'center');
            U.text(ctx, a.name, 300, y + 19, '800 18px system-ui', got ? PAL.gold : '#cfd6e6', 'left');
            U.text(ctx, a.desc, 300, y + 39, '600 14px system-ui', '#cfd6e6', 'left');
            y += 60;
        }
        this._btn(ctx, 'menu', '‹ BACK', CFG.W / 2 - 110, CFG.H - 78, 220, 52, { color: '#ff8fb0', text: PAL.ink });
    },

    // ================================================== HUD
    drawHUD(ctx, round) {
        // round chip
        ctx.fillStyle = 'rgba(20,15,40,0.55)';
        U.roundRect(ctx, 16, 16, 320, 56, 12); ctx.fill();
        U.text(ctx, round.def.name, 28, 38, '800 22px system-ui', '#fff', 'left');
        const catCol = { Race: '#5ad1ff', Survival: '#ffd23f', Final: '#ff5fa2' }[round.category] || '#fff';
        U.text(ctx, round.category.toUpperCase(), 28, 60, '800 14px system-ui', catCol, 'left');

        // counter (right)
        ctx.fillStyle = 'rgba(20,15,40,0.55)';
        U.roundRect(ctx, CFG.W - 276, 16, 260, 56, 12); ctx.fill();
        if (round.kind === 'race') {
            U.text(ctx, 'QUALIFIED', CFG.W - 146, 36, '800 14px system-ui', PAL.qualGreen, 'center');
            U.text(ctx, `${round.qualifiedCount} / ${round.qualifyCount}`, CFG.W - 146, 58, '900 22px system-ui', '#fff', 'center');
        } else if (round.kind === 'survival') {
            U.text(ctx, 'SURVIVE', CFG.W - 146, 36, '800 14px system-ui', PAL.gold, 'center');
            U.text(ctx, U.timeStr(round.timer) + '   ·   ' + round.aliveSoFar() + ' left', CFG.W - 146, 58, '900 20px system-ui', '#fff', 'center');
        } else {
            U.text(ctx, 'BEANS LEFT', CFG.W - 146, 36, '800 14px system-ui', PAL.pink, 'center');
            U.text(ctx, '' + round.aliveSoFar(), CFG.W - 146, 58, '900 22px system-ui', '#fff', 'center');
        }

        // controls hint + emote bar
        ctx.fillStyle = 'rgba(20,15,40,0.45)';
        U.roundRect(ctx, 16, CFG.H - 52, 470, 38, 10); ctx.fill();
        U.text(ctx, 'WASD move · SPACE jump · SHIFT dive · J grab · 1-4 gesture',
            24, CFG.H - 33, '700 14px system-ui', '#fff', 'left');
    },

    // ================================================== ROUND INTRO CARD
    drawIntro(ctx, round) {
        const tIn = CFG.INTRO_TIME - round.phaseT;
        ctx.fillStyle = 'rgba(10,8,24,0.55)';
        ctx.fillRect(0, 0, CFG.W, CFG.H);
        const pop = U.clamp(tIn * 3, 0, 1);
        ctx.save();
        ctx.translate(CFG.W / 2, CFG.H / 2 - 40);
        ctx.scale(pop, pop);
        const catCol = { Race: '#5ad1ff', Survival: '#ffd23f', Final: '#ff5fa2' }[round.category] || '#fff';
        U.text(ctx, round.category.toUpperCase(), 0, -70, '800 26px system-ui', catCol, 'center', PAL.ink, 6);
        U.text(ctx, round.def.name, 0, 0, '900 76px system-ui', PAL.gold, 'center', PAL.ink, 10);
        ctx.restore();
        U.text(ctx, round.def.tagline, CFG.W / 2, CFG.H / 2 + 60, '600 22px system-ui', '#fff', 'center', PAL.ink, 5);

        if (round.phaseT < CFG.COUNTDOWN) {
            const n = Math.ceil(round.phaseT);
            U.text(ctx, n > 0 ? '' + n : 'GO!', CFG.W / 2, CFG.H / 2 + 150, '900 70px system-ui', '#fff', 'center', PAL.ink, 9);
        }
        if (round.def.qualify)
            U.text(ctx, `Top ${round.def.qualify} qualify`, CFG.W / 2, CFG.H - 80, '700 20px system-ui', PAL.qualGreen, 'center', PAL.ink, 4);
    },

    // ================================================== ENDING OVERLAY (in-world)
    drawEndingOverlay(ctx, round) {
        if (!round.result) return;
        const o = round.result.outcome;
        if (o === 'qualify') {
            const pulse = 1 + Math.sin(Date.now() / 120) * 0.04;
            ctx.save(); ctx.translate(CFG.W / 2, 130); ctx.scale(pulse, pulse);
            U.text(ctx, 'QUALIFIED!', 0, 0, '900 72px system-ui', PAL.qualGreen, 'center', PAL.ink, 10);
            ctx.restore();
            U.text(ctx, round.bigTease ? 'Style points! 😎' : `You placed #${round.result.place}`,
                CFG.W / 2, 188, '700 22px system-ui', '#fff', 'center', PAL.ink, 4);
        } else if (o === 'win') {
            U.text(ctx, '👑 VICTORY 👑', CFG.W / 2, 120, '900 70px system-ui', PAL.gold, 'center', PAL.ink, 10);
        } else {
            U.text(ctx, 'ELIMINATED', CFG.W / 2, 130, '900 70px system-ui', PAL.elimRed, 'center', PAL.ink, 10);
        }
    },

    // ================================================== ELIMINATED SCREEN
    drawEliminated(ctx, info) {
        this._begin();
        const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
        g.addColorStop(0, '#3a2350'); g.addColorStop(1, '#1c1430');
        ctx.fillStyle = g; ctx.fillRect(0, 0, CFG.W, CFG.H);
        U.text(ctx, 'ELIMINATED', CFG.W / 2, 180, '900 76px system-ui', PAL.elimRed, 'center', PAL.ink, 10);
        U.text(ctx, `Knocked out in ${info.roundName} — placed #${info.place}`,
            CFG.W / 2, 270, '700 26px system-ui', '#fff', 'center');
        U.text(ctx, `You cleared ${info.roundsCleared} of ${info.totalRounds} rounds`,
            CFG.W / 2, 312, '600 20px system-ui', '#cfd6e6', 'center');
        this._btn(ctx, 'play', '↻  PLAY AGAIN', CFG.W / 2 - 330, 420, 300, 66);
        this._btn(ctx, 'menu', '☰  MAIN MENU', CFG.W / 2 + 30, 420, 300, 66, { color: '#5ad1ff' });
        this.drawToasts(ctx);
    },

    // ================================================== VICTORY SCREEN
    drawVictory(ctx, info, t) {
        this._begin();
        const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
        g.addColorStop(0, '#7b46d6'); g.addColorStop(1, '#ff5fa2');
        ctx.fillStyle = g; ctx.fillRect(0, 0, CFG.W, CFG.H);
        // confetti rain
        for (let i = 0; i < 60; i++) {
            const x = (i * 97 + (t * 120 + i * i) % CFG.W) % CFG.W;
            const y = ((t * 180 + i * 53) % (CFG.H + 40));
            ctx.fillStyle = ['#ffd23f', '#5ad1ff', '#46d36a', '#fff'][i % 4];
            ctx.fillRect(x, y, 7, 11);
        }
        const bob = Math.sin(t * 3) * 8;
        U.text(ctx, '👑', CFG.W / 2, 150 + bob, '120px system-ui', '#fff', 'center');
        U.text(ctx, 'WINNER WINNER!', CFG.W / 2, 280, '900 70px system-ui', PAL.gold, 'center', PAL.ink, 11);
        U.text(ctx, 'You grabbed the Crown!', CFG.W / 2, 340, '700 26px system-ui', '#fff', 'center', PAL.ink, 4);
        U.text(ctx, `Crowns: ${Save.data.crowns}   ·   Win Streak: ${Save.data.streak}`,
            CFG.W / 2, 386, '800 22px system-ui', '#ffe9c2', 'center', PAL.ink, 4);
        this._btn(ctx, 'play', '↻  PLAY AGAIN', CFG.W / 2 - 330, 460, 300, 66);
        this._btn(ctx, 'menu', '☰  MAIN MENU', CFG.W / 2 + 30, 460, 300, 66, { color: '#5ad1ff' });
        this.drawToasts(ctx);
    },
};

</script>
<script>
/* =================== js/game.js =================== */
'use strict';

/* =====================================================================
   game.js — boot, main loop, screen state machine and Show progression.
   Screens: menu | customize | howto | trophies | playing | eliminated | victory
   ===================================================================== */

const Game = {
    canvas: null,
    ctx: null,
    last: 0,
    t: 0,
    screen: 'menu',
    show: null,        // { index, beans, round }
    player: null,
    info: null,        // payload for eliminated / victory screens

    init() {
        this.canvas = document.getElementById('gc');
        this.canvas.width = CFG.W;
        this.canvas.height = CFG.H;
        this.ctx = this.canvas.getContext('2d');

        Input.init(this.canvas);
        Save.load();

        this.screen = 'menu';
        requestAnimationFrame(ts => this._loop(ts));
    },

    _loop(ts) {
        let dt = this.last ? (ts - this.last) / 1000 : 0;
        this.last = ts;
        dt = Math.min(dt, 0.05);
        this.t += dt;

        this._update(dt);
        this._render();
        Input.flush();
        requestAnimationFrame(t2 => this._loop(t2));
    },

    // ------------------------------------------------------------------
    _update(dt) {
        UI.update(dt);

        if (this.screen === 'playing') {
            const r = this.show.round;
            r.update(dt);
            if (r.done) this.finishRound();
            if (Input.esc) this.toMenu();
            return;
        }

        // menu-style screens
        if (Input.mouse.clicked) {
            const id = UI.pick(Input.mouse.x, Input.mouse.y);
            if (id) this._onButton(id);
        }
        if (this.screen === 'menu' && Input.confirm) this.startShow();
        if (this.screen !== 'menu' && Input.esc) this.toMenu();
    },

    _render() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, CFG.W, CFG.H);
        switch (this.screen) {
            case 'menu':      UI.drawMenu(ctx, this.t); break;
            case 'customize': UI.drawCustomize(ctx, this.t); break;
            case 'howto':     UI.drawHowTo(ctx, this.t); break;
            case 'trophies':  UI.drawTrophies(ctx, this.t); break;
            case 'eliminated':UI.drawEliminated(ctx, this.info); break;
            case 'victory':   UI.drawVictory(ctx, this.info, this.t); break;
            case 'playing': {
                const r = this.show.round;
                r.draw(ctx);
                if (r.phase === 'intro') UI.drawIntro(ctx, r);
                else {
                    UI.drawHUD(ctx, r);
                    if (r.phase === 'ending') UI.drawEndingOverlay(ctx, r);
                }
                UI.drawToasts(ctx);
                break;
            }
        }
    },

    // ------------------------------------------------------------------
    _onButton(id) {
        if (id === 'play')      { this.startShow(); return; }
        if (id === 'customize') { this.screen = 'customize'; return; }
        if (id === 'howto')     { this.screen = 'howto'; return; }
        if (id === 'trophies')  { this.screen = 'trophies'; return; }
        if (id === 'menu')      { this.toMenu(); return; }

        if (id.startsWith('cyc:')) {
            const [, key, dir] = id.split(':');
            const arrays = { color: COLORS, pattern: PATTERNS, faceplate: FACEPLATES, upper: COSTUMES_UPPER, lower: COSTUMES_LOWER };
            const arr = arrays[key];
            const n = arr.length;
            Save.data[key] = (Save.data[key] + (dir === '1' ? 1 : -1) + n) % n;
            Save.save(); Save.checkHeadTurner();
            return;
        }
        if (id.startsWith('emote:')) {
            const [, slot, dir] = id.split(':');
            const i = +slot, n = EMOTES.length;
            Save.data.emotes[i] = (Save.data.emotes[i] + (dir === '1' ? 1 : -1) + n) % n;
            Save.save();
            return;
        }
    },

    toMenu() { this.screen = 'menu'; this.show = null; },

    // ---- Show lifecycle ----------------------------------------------
    startShow() {
        const beans = this._makeField();
        this.show = { index: 0, beans, round: null };
        this.loadRound(0);
    },

    loadRound(i) {
        for (const b of this.show.beans) this._resetBean(b);
        this.show.index = i;
        this.show.round = Rounds.create(SHOW[i], this.show.beans);
        this.screen = 'playing';
    },

    finishRound() {
        const r = this.show.round;
        const res = r.result;

        if (res.outcome === 'qualify') {
            Save.unlock('first_qual');
            if (r.bigTease) Save.unlock('big_tease');
            if (r.category === 'Survival') Save.unlock('survivor');
            const survivors = r.beans.filter(b => b.alive && !b.eliminated);
            this.show.beans = survivors;
            this.loadRound(this.show.index + 1);
            return;
        }

        if (res.outcome === 'win') {
            const flawless = !this.player.everRagdolled;
            Save.recordWin(flawless);
            this.info = {};
            this.screen = 'victory';
            return;
        }

        // eliminate
        Save.recordLoss();
        this.info = {
            roundName: r.def.name,
            place: res.place,
            roundsCleared: this.show.index,
            totalRounds: SHOW.length,
        };
        this.screen = 'eliminated';
    },

    // ---- Field / beans -----------------------------------------------
    _makeField() {
        const beans = [];
        this.player = new Bean({
            x: 0, y: 0, isPlayer: true, name: 'You',
            appearance: Save.appearance(), emoteList: Save.emoteList(),
        });
        beans.push(this.player);

        const names = U.shuffle(BEAN_NAMES.slice());
        for (let i = 0; i < CFG.FIELD_SIZE - 1; i++) {
            beans.push(new Bean({
                x: 0, y: 0, name: names[i % names.length],
                appearance: this._randomAppearance(),
                emoteList: [U.pick(EMOTES), U.pick(EMOTES), U.pick(EMOTES), U.pick(EMOTES)],
            }));
        }
        return beans;
    },

    _randomAppearance() {
        return {
            color: U.pick(COLORS).hex,
            pattern: U.pick(PATTERNS).type,
            upper: U.pick(COSTUMES_UPPER).prop,
            lower: U.pick(COSTUMES_LOWER).prop,
            visor: U.pick(FACEPLATES).visor,
        };
    },

    _resetBean(b) {
        b.vx = 0; b.vy = 0; b.z = 0; b.vz = 0; b.facing = -Math.PI / 2;
        b.alive = true; b.finished = false; b.qualified = false;
        b.eliminated = false; b.falling = false; b.place = 0;
        b.diveT = 0; b.proneT = 0; b.diveCd = 0; b.ragdoll = 0; b.spin = 0; b.squash = 1;
        b.grabbing = null; b.grabbedBy = null; b.grabT = 0;
        b.emoteT = 0; b.emoteAnim = null; b.emoteName = null; b.justEmoted = 99;
        b.ai = { mx: 0, my: 0, jump: false, dive: false };
        b.aiTimer = 0; b.aiJumpLock = 0; b.aiTarget = { x: 0, y: 0 };
        // NOTE: everRagdolled persists across the whole show (Flawless trophy)
    },
};

window.addEventListener('load', () => Game.init());

</script>
<!-- GAME:END -->

<script>
    // Hide the loading screen once everything is parsed; game.js boots on load.
    document.getElementById('loading').style.display = 'none';
</script>
