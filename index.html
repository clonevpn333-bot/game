              '" data-act="settings-tab" data-val="' + list[i][0] + '">' + list[i][1] + '</button>';
    }
    tabs.innerHTML = html;
    body.innerHTML = this['settings_' + this.settingsTab]();
    this.bindSettingInputs(body);
    if (this.settingsTab === 'crosshair') this.drawXhairPreview();
  };

  function slider(key, label, min, max, step, val, hint) {
    return '<div class="setting"><label>' + label + '</label>' +
      '<input type="range" data-set="' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '">' +
      '<span class="val" data-valfor="' + key + '">' + (Math.round(val * 100) / 100) + '</span>' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }
  function toggle(key, label, val, hint) {
    return '<div class="setting"><label>' + label + '</label>' +
      '<input type="checkbox" data-set="' + key + '"' + (val ? ' checked' : '') + '><span class="val"></span>' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }
  function picker(key, label, options, val, hint) {
    var o = '';
    for (var i = 0; i < options.length; i++) {
      o += '<option value="' + options[i][0] + '"' + (String(val) === String(options[i][0]) ? ' selected' : '') +
           '>' + options[i][1] + '</option>';
    }
    return '<div class="setting"><label>' + label + '</label><select data-set="' + key + '">' + o + '</select>' +
      '<span class="val"></span>' + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }

  UI.prototype.bindSettingInputs = function (body) {
    var self = this, g = this.game;
    var inputs = body.querySelectorAll('[data-set]');
    for (var i = 0; i < inputs.length; i++) {
      (function (inp) {
        var key = inp.getAttribute('data-set');
        var handler = function () {
          var val;
          if (inp.type === 'checkbox') val = inp.checked;
          else if (inp.tagName === 'SELECT') {
            val = inp.value;
            if (/^-?\d+(\.\d+)?$/.test(val)) val = parseFloat(val);
          } else val = parseFloat(inp.value);
          g.setSetting(key, val);
          var lbl = body.querySelector('[data-valfor="' + key + '"]');
          if (lbl) lbl.textContent = Math.round(val * 100) / 100;
          if (key.indexOf('crosshair') === 0) self.drawXhairPreview();
        };
        inp.addEventListener('input', handler);
        inp.addEventListener('change', handler);
      })(inputs[i]);
    }
    var colors = el('xhairColors');
    if (colors) {
      var palette = ['#39ff6a', '#ffffff', '#ff3b3b', '#4aa8ff', '#ffd000', '#ff00d0', '#00e5ff', '#ff7a2f'];
      colors.innerHTML = '';
      for (var c = 0; c < palette.length; c++) {
        (function (col) {
          var sw = mk('div');
          sw.style.cssText = 'width:22px;height:22px;border-radius:3px;cursor:pointer;background:' + col +
            ';border:2px solid ' + (self.settings.crosshair.color === col ? '#fff' : 'transparent');
          sw.addEventListener('click', function () {
            g.setSetting('crosshair.color', col);
            self.renderSettings();
          });
          colors.appendChild(sw);
        })(palette[c]);
      }
    }
    var mic = el('micTestBtn');
    if (mic) mic.addEventListener('click', function () { g.enableVoice(true); });
  };

  UI.prototype.beginBind = function (key, node) {
    var self = this;
    if (this.listenKey) return;
    this.listenKey = { key: key, node: node };
    node.classList.add('listening');
    node.textContent = 'Press a key…';
    var finish = function (code) {
      node.classList.remove('listening');
      self.listenKey = null;
      if (code) self.game.setKey(key, code);
      node.textContent = keyLabel(self.settings.keys[key]);
      doc.removeEventListener('keydown', kd, true);
      doc.removeEventListener('mousedown', md, true);
    };
    var kd = function (e) {
      e.preventDefault(); e.stopPropagation();
      finish(e.code === 'Escape' ? null : e.code);
    };
    var md = function (e) {
      e.preventDefault(); e.stopPropagation();
      var names = ['MouseLeft', 'MouseMiddle', 'MouseRight', 'Mouse3', 'Mouse4'];
      finish(names[e.button] || null);
    };
    setTimeout(function () {
      doc.addEventListener('keydown', kd, true);
      doc.addEventListener('mousedown', md, true);
    }, 20);
  };

  /* ---------------------------------------------------------------
   * Buy menu
   * ------------------------------------------------------------- */
  UI.prototype.openBuy = function () {
    if (this.buyOpen) return;
    this.buyOpen = true;
    this.n.buymenu.classList.remove('hidden');
    this.renderBuy();
  };
  UI.prototype.closeBuy = function () {
    this.buyOpen = false;
    this.n.buymenu.classList.add('hidden');
  };
  UI.prototype.toggleBuy = function () { this.buyOpen ? this.closeBuy() : this.openBuy(); };

  UI.prototype.renderBuy = function () {
    if (!this.buyOpen) return;
    var g = this.game, p = g.localPlayer;
    if (!p) return;
    this.n.buyMoney.textContent = '$' + p.money;

    var cats = W.BUY_CATEGORIES;
    var ch = '';
    for (var i = 0; i < cats.length; i++) {
      ch += '<div class="bcat' + (this.buyCat === cats[i].key ? ' on' : '') +
        '" data-act="buy-cat" data-val="' + cats[i].key + '">' + cats[i].label +
        '<kbd>' + (i + 1) + '</kbd></div>';
    }
    this.n.buycats.innerHTML = ch;

    var cat = null;
    for (var c = 0; c < cats.length; c++) if (cats[c].key === this.buyCat) cat = cats[c];
    if (!cat) cat = cats[0];

    var ih = '';
    var n = 0;
    for (var k = 0; k < cat.items.length; k++) {
      var w = W.get(cat.items[k]);
      if (!w || w.teams.indexOf(p.team) < 0) continue;
      n++;
      var check = P.canBuy(p, w.id, g.world, g.rules, g.match ? g.match.isBuyTime(p) : true);
      var price = P.priceFor(p, w);
      var owned = (p.primary && p.primary.id === w.id) || (p.secondary && p.secondary.id === w.id) ||
                  (w.gear === 'kit' && p.kit) || (w.gear === 'helmet' && p.helmet) ||
                  (w.gear === 'armor' && p.armor > 0);
      ih += '<div class="bitem' + (check.ok ? '' : ' cant') + (owned ? ' owned' : '') +
        '" data-act="' + (check.ok ? 'buy' : 'none') + '" data-val="' + w.id + '" data-info="' + w.id + '">' +
        '<div class="n">' + esc(w.name) + '</div>' +
        '<div class="c">' + (W.classLabel[w.cls] || w.cls) + '</div>' +
        '<div class="p">$' + price + '</div><kbd>' + n + '</kbd></div>';
    }
    this.n.buyitems.innerHTML = ih || '<div class="dim">Nothing available to your team here.</div>';

    var self = this;
    var items = this.n.buyitems.querySelectorAll('[data-info]');
    for (var q = 0; q < items.length; q++) {
      (function (node) {
        node.addEventListener('mouseenter', function () { self.showBuyInfo(node.getAttribute('data-info')); });
      })(items[q]);
    }
    this.showBuyInfo(this.buyHover || (cat.items[0] || 'kr47'));
    this.updateBuyLoadout();
  };

  UI.prototype.showBuyInfo = function (id) {
    var w = W.get(id);
    if (!w) return;
    this.buyHover = id;
    var body = '<h4>' + esc(w.name) + '</h4><div class="cls">' + (W.classLabel[w.cls] || w.cls) + '</div>';
    body += '<p>' + esc(w.desc || '') + '</p>';
    function bar(label, val, max, display) {
      var pct = M.clamp(val / max, 0, 1) * 100;
      return '<div class="statrow"><span>' + label + '</span><span class="bar"><i style="width:' + pct + '%"></i></span>' +
             '<span class="v">' + display + '</span></div>';
    }
    if (w.cls !== 'gear' && w.cls !== 'grenade') {
      body += bar('Damage', w.dmg * (w.pellets || 1), 200, String(Math.round(w.dmg * (w.pellets || 1))));
      body += bar('Fire rate', w.rpm, 900, w.rpm + '/m');
      body += bar('Armour pen', w.armorPen * 100, 100, Math.round(w.armorPen * 100) + '%');
      body += bar('Wall pen', (w.pen || 0) * 100, 100, Math.round((w.pen || 0) * 100) + '%');
      body += bar('Accuracy', 100 - M.clamp((w.inaccStand || 0.05) * 22, 0, 95), 100,
                  Math.round(100 - M.clamp((w.inaccStand || 0.05) * 22, 0, 95)) + '');
      body += bar('Mobility', (w.speed / 6.5) * 100, 100, Math.round(w.speed * 10) / 10 + ' m/s');
      body += bar('Magazine', w.mag, 100, w.mag + ' / ' + w.reserve);
      body += '<div class="statrow"><span>Kill reward</span><span class="bar"></span><span class="v">$' + (w.killAward || 300) + '</span></div>';
    } else if (w.cls === 'grenade') {
      if (w.dmg) body += bar('Damage', w.dmg, 100, String(w.dmg));
      if (w.radius) body += bar('Radius', w.radius, 20, w.radius + ' m');
      if (w.duration) body += bar('Duration', w.duration, 20, w.duration + ' s');
      body += '<div class="statrow"><span>Carry limit</span><span class="bar"></span><span class="v">' + (w.max || 1) + '</span></div>';
    }
    body += '<div id="buyloadout"></div>';
    this.n.buyinfo.innerHTML = body;
    this.updateBuyLoadout();
  };

  UI.prototype.updateBuyLoadout = function () {
    var lo = el('buyloadout');
    var p = this.game.localPlayer;
    if (!lo || !p) return;
    var nades = p.grenades.map(function (g) {
      return esc(W.get(g.id).name) + (g.count > 1 ? ' x' + g.count : '');
    }).join(', ') || '—';
    lo.innerHTML = '<div class="lo-row"><span>Primary</span><b>' + (p.primary ? esc(W.get(p.primary.id).name) : '—') + '</b></div>' +
      '<div class="lo-row"><span>Secondary</span><b>' + (p.secondary ? esc(W.get(p.secondary.id).name) : '—') + '</b></div>' +
      '<div class="lo-row"><span>Armour</span><b>' + (p.armor > 0 ? (p.helmet ? 'Vest + helmet' : 'Vest') : '—') + '</b></div>' +
      '<div class="lo-row"><span>Grenades</span><b>' + nades + '</b></div>' +
      (p.team === C.TEAM.DEF ? '<div class="lo-row"><span>Defuse kit</span><b>' + (p.kit ? 'Yes' : '—') + '</b></div>' : '');
  };

  UI.prototype.buyByNumber = function (n) {
    var cats = W.BUY_CATEGORIES, p = this.game.localPlayer;
    if (!p) return;
    var cat = null;
    for (var c = 0; c < cats.length; c++) if (cats[c].key === this.buyCat) cat = cats[c];
    if (!cat) return;
    var idx = 0;
    for (var k = 0; k < cat.items.length; k++) {
      var w = W.get(cat.items[k]);
      if (!w || w.teams.indexOf(p.team) < 0) continue;
      idx++;
      if (idx === n) { this.game.buy(w.id); this.renderBuy(); return; }
    }
  };
  UI.prototype.buyCatByNumber = function (n) {
    var cats = W.BUY_CATEGORIES;
    if (cats[n - 1]) { this.buyCat = cats[n - 1].key; this.renderBuy(); }
  };

  UI.prototype.renderScoreboard = function () {
    var g = this.game, m = g.match;
    if (!m) return;
    var infoA = C.TEAM_INFO[1], infoD = C.TEAM_INFO[2];
    var html = '<div class="sbhead"><div class="score">' +
      '<span class="a">' + esc(infoA.name) + ' ' + m.score[1] + '</span><span class="dim">:</span>' +
      '<span class="d">' + m.score[2] + ' ' + esc(infoD.name) + '</span></div>' +
      '<div class="meta">' + esc(CS.Maps.get(g.mapId).name) + ' · ' +
      esc((C.MODE_PRESETS[m.rules.mode] || {}).label || '') + '<br>Round ' + m.round +
      (m.overtimeRound ? ' · Overtime ' + m.overtimeRound : '') + '</div></div>';

    for (var t = 1; t <= 2; t++) {
      var info = C.TEAM_INFO[t];
      var list = m.teamPlayers(t).slice().sort(function (a, b) {
        return (b.kills - b.deaths) - (a.kills - a.deaths) || b.kills - a.kills || b.damage - a.damage;
      });
      var money = 0;
      for (var q = 0; q < list.length; q++) money += list[q].money;
      html += '<div class="sbteam ' + (t === 1 ? 'att' : 'def') + '"><div class="tt">' + esc(info.name) +
        ' · ' + list.length + ' players · $' + money + ' team economy</div>' +
        '<table class="sbt"><thead><tr><th>Player</th><th>K</th><th>A</th><th>D</th><th>+/-</th>' +
        '<th>ADR</th><th>HS%</th><th>MVP</th><th>$</th><th>Ping</th></tr></thead><tbody>';
      for (var i = 0; i < list.length; i++) {
        var p = list[i];

          '<td>' + p.kills + '</td><td>' + p.assists + '</td><td>' + p.deaths + '</td>' +
          '<td>' + (p.kills - p.deaths > 0 ? '+' : '') + (p.kills - p.deaths) + '</td>' +
          '<td>' + adr + '</td><td>' + hs + '</td><td>' + p.mvps + '</td>' +
          '<td>$' + p.money + '</td><td>' + (p.bot ? '—' : Math.round(p.ping)) + '</td></tr>';

      }

      n.ammoCount.innerHTML = slot.mag + ' <small>/ ' + slot.reserve + '</small>';

    // teammates
    var mh = '';

      var mwName = mw && W.get(mw) ? W.get(mw).name : '';
      mh += '<div class="mate' + (mp.alive ? '' : ' dead') + '">' +

        '<span class="wp">' + esc(mwName.split(' ')[0]) + '</span></div>';

    else if (p.defusing > 0) {
      var need = p.kit ? m.rules.defuseTimeKit : m.rules.defuseTime;
      prog = { label: 'Defusing' + (p.kit ? ' (kit)' : ''), v: p.defusing / need, cls: 'defuse' };
    }
    if (prog) {
      n.progress.classList.remove('hidden');
      n.progress.classList.toggle('defuse', prog.cls === 'defuse');
      n.progressLabel.textContent = prog.label;
      n.progressBar.style.width = M.clamp(prog.v, 0, 1) * 100 + '%';
    } else {
      n.progress.classList.add('hidden');

    // centre hint
    var hint = '';
    if (m.phase === C.PHASE.FREEZE && m.isBuyTime(p)) {
      hint = 'Press <span class="key">' + keyLabel(this.settings.keys.buy) + '</span> to buy';
    } else if (p.bomb && g.world.siteAt(p.pos.x, p.pos.y + 0.1, p.pos.z)) {
      hint = 'Hold <span class="key">' + keyLabel(this.settings.keys.use) + '</span> to plant';
    } else if (m.bomb && m.bomb.planted && p.team === C.TEAM.DEF &&
               M.vdistXZ(p.pos, { x: m.bomb.x, z: m.bomb.z }) < 1.6) {
      hint = 'Hold <span class="key">' + keyLabel(this.settings.keys.use) + '</span> to defuse';

      hint = 'Press <span class="key">' + keyLabel(this.settings.keys.use) + '</span> to pick up ' + esc(g.nearPickup);

    if (dead) {
      var tgt = g.spectateTarget;

      n.deadinfo.textContent = m.rules.respawn ? 'Respawning…' : 'You are dead — waiting for the round to end';

      this.n.buyMoney.textContent = '$' + p.money;

  /* ---------------------------------------------------------------
   * Crosshair
   * ------------------------------------------------------------- */
  UI.prototype.drawCrosshair = function (spreadPx) {
    var cv = this.n.xhair, ctx = this.xctx;
    if (!ctx) return;
    var c = this.settings.crosshair;
    var dpr = Math.min(root.devicePixelRatio || 1, 2);
    var size = 220;
    if (cv.width !== size * dpr) { cv.width = cv.height = size * dpr; cv.style.width = cv.style.height = size + 'px'; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    var cx = size / 2, cy = size / 2;

    var gap = c.gap;
    if (c.style === 'dynamic' || c.style === 'classic') gap += (spreadPx || 0) * c.dynamicScale;
    var len = c.size, th = Math.max(0.5, c.thickness);

    ctx.globalAlpha = c.alpha;
    function line(x0, y0, x1, y1, color, width) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    var arms = [];
    if (c.style !== 'dot') {
      arms.push([cx - gap - len, cy, cx - gap, cy]);
      arms.push([cx + gap, cy, cx + gap + len, cy]);
      if (!c.tStyle) arms.push([cx, cy - gap - len, cx, cy - gap]);
      arms.push([cx, cy + gap, cx, cy + gap + len]);
    }
    if (c.outline > 0) {
      for (var i = 0; i < arms.length; i++) {
        line(arms[i][0], arms[i][1], arms[i][2], arms[i][3], 'rgba(0,0,0,0.85)', th + c.outline * 2);
      }
      if (c.dot || c.style === 'dot') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(cx - th / 2 - c.outline, cy - th / 2 - c.outline, th + c.outline * 2, th + c.outline * 2);
      }
    }
    for (var k = 0; k < arms.length; k++) {
      line(arms[k][0], arms[k][1], arms[k][2], arms[k][3], c.color, th);
    }
    if (c.dot || c.style === 'dot') {
      ctx.fillStyle = c.color;
      ctx.fillRect(cx - th / 2, cy - th / 2, th, th);
    }
    ctx.globalAlpha = 1;
  };

  UI.prototype.drawXhairPreview = function () {
    var box = el('xhairPreview');
    if (!box) return;
    var cv = box.querySelector('canvas');
    if (!cv) { cv = mk('canvas'); box.appendChild(cv); }
    var w = box.clientWidth || 400, h = 150;
    var dpr = Math.min(root.devicePixelRatio || 1, 2);
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var c = this.settings.crosshair;
    var cx = w / 2, cy = h / 2;
    var gap = c.gap, len = c.size, th = Math.max(0.5, c.thickness);
    ctx.globalAlpha = c.alpha;
    var arms = [];
    if (c.style !== 'dot') {
      arms.push([cx - gap - len, cy, cx - gap, cy]);
      arms.push([cx + gap, cy, cx + gap + len, cy]);
      if (!c.tStyle) arms.push([cx, cy - gap - len, cx, cy - gap]);
      arms.push([cx, cy + gap, cx, cy + gap + len]);
    }
    function stroke(color, width) {
      ctx.strokeStyle = color; ctx.lineWidth = width;
      for (var i = 0; i < arms.length; i++) {
        ctx.beginPath(); ctx.moveTo(arms[i][0], arms[i][1]); ctx.lineTo(arms[i][2], arms[i][3]); ctx.stroke();
      }
    }
    if (c.outline > 0) stroke('rgba(0,0,0,.85)', th + c.outline * 2);
    stroke(c.color, th);
    if (c.dot || c.style === 'dot') {
      if (c.outline > 0) { ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillRect(cx - th / 2 - c.outline, cy - th / 2 - c.outline, th + c.outline * 2, th + c.outline * 2); }
      ctx.fillStyle = c.color; ctx.fillRect(cx - th / 2, cy - th / 2, th, th);
    }
    ctx.globalAlpha = 1;
  };

  /* ---------------------------------------------------------------
   * Radar
   * ------------------------------------------------------------- */
  UI.prototype.prepareRadar = function (map) {
    if (this.radarCache[map.id]) { this.radarBase = this.radarCache[map.id]; return; }
    var S = 512;
    var cv = doc.createElement('canvas');
    cv.width = cv.height = S;
    var ctx = cv.getContext('2d');
    var b = map.bounds;
    var span = Math.max(b.x1 - b.x0, b.z1 - b.z0);
    var s = S / span;
    ctx.clearRect(0, 0, S, S);
    ctx.fillStyle = 'rgba(18,24,32,0.85)';
    ctx.fillRect(0, 0, S, S);
    for (var i = 0; i < map.boxes.length; i++) {
      var box = map.boxes[i];
      if (box.max.y < 0.75) continue;      // floors add nothing to a top-down view
      if (box.min.y > 7) continue;
      var lum = M.clamp(0.32 + box.max.y / 12, 0.3, 0.85);
      ctx.fillStyle = 'rgba(' + Math.round(120 * lum) + ',' + Math.round(134 * lum) + ',' + Math.round(152 * lum) + ',0.95)';
      ctx.fillRect((box.min.x - b.x0) * s, (box.min.z - b.z0) * s,
                   Math.max(1, (box.max.x - box.min.x) * s), Math.max(1, (box.max.z - box.min.z) * s));
    }
    for (var k = 0; k < map.sites.length; k++) {
      var site = map.sites[k];
      ctx.strokeStyle = 'rgba(255,140,60,.9)'; ctx.lineWidth = 2;
      ctx.strokeRect((site.min.x - b.x0) * s, (site.min.z - b.z0) * s,
                     (site.max.x - site.min.x) * s, (site.max.z - site.min.z) * s);
      ctx.fillStyle = 'rgba(255,160,80,.95)';
      ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(site.name, (site.center.x - b.x0) * s, (site.center.z - b.z0) * s + 9);
    }
    this.radarCache[map.id] = { canvas: cv, scale: s, b: b, size: S };
    this.radarBase = this.radarCache[map.id];
  };

  UI.prototype.drawRadar = function (scene) {
    var ctx = this.rctx, base = this.radarBase;
    if (!ctx || !base) return;
    var g = this.game;
    var view = g.spectateTarget || g.localPlayer;
    if (!view) return;
    var cv = this.n.radar;
    var dpr = Math.min(root.devicePixelRatio || 1, 2);
    var size = 190;
    if (cv.width !== size * dpr) { cv.width = cv.height = size * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    // fixed pixels-per-metre so every map reads at the same zoom
    var pxPerM = 3.9 * (this.settings.hud.radarScale || 1);
    var k = pxPerM / base.scale;
    var cx = size / 2, cy = size / 2;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, size / 2 - 1, 0, 6.283); ctx.clip();

    ctx.translate(cx, cy);
    ctx.rotate(view.yaw - Math.PI / 2);
    var px = (view.pos.x - base.b.x0) * base.scale;
    var pz = (view.pos.z - base.b.z0) * base.scale;
    ctx.scale(k, k);
    ctx.translate(-px, -pz);
    ctx.drawImage(base.canvas, 0, 0);
    ctx.restore();

    // world position -> radar pixel, rotated so "up" is where you are facing
    function project(x, z) {
      var dx = (x - view.pos.x) * pxPerM, dz = (z - view.pos.z) * pxPerM;
      var a = view.yaw - Math.PI / 2;
      var ca = Math.cos(a), sa = Math.sin(a);
      return [cx + dx * ca - dz * sa, cy + dx * sa + dz * ca];
    }

    var m = g.match;
    if (m) {
      for (var i = 0; i < m.players.length; i++) {
        var p = m.players[i];
        if (!p.alive) continue;
        var mine = p.team === view.team;
        if (!mine && !g.radarSeesEnemy(p)) continue;
        var pt = project(p.pos.x, p.pos.z);
        if (pt[0] < -10 || pt[0] > size + 10 || pt[1] < -10 || pt[1] > size + 10) continue;
        var info = C.TEAM_INFO[p.team];
        ctx.save();
        ctx.translate(pt[0], pt[1]);
        ctx.rotate(-(p.yaw - view.yaw));
        ctx.fillStyle = p === view ? '#ffffff' : info.color;
        ctx.beginPath();
        ctx.moveTo(0, -5); ctx.lineTo(3.6, 4); ctx.lineTo(0, 2); ctx.lineTo(-3.6, 4);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      if (m.bomb && (m.bomb.planted || m.bomb.dropped)) {
        var bp = project(m.bomb.x, m.bomb.z);
        ctx.fillStyle = m.bomb.planted ? '#ff4438' : '#ffb020';
        ctx.beginPath(); ctx.arc(bp[0], bp[1], 4, 0, 6.283); ctx.fill();
      }
      for (var s2 = 0; s2 < m.nades.smokes.length; s2++) {
        var sm = m.nades.smokes[s2];
        var sp = project(sm.pos.x, sm.pos.z);
        ctx.fillStyle = 'rgba(210,215,220,' + (0.28 * sm.opacity) + ')';
        ctx.beginPath(); ctx.arc(sp[0], sp[1], sm.radius * pxPerM, 0, 6.283);
        ctx.fill();
      }
      for (var f2 = 0; f2 < m.nades.fires.length; f2++) {
        var fi = m.nades.fires[f2];
        var fp = project(fi.pos.x, fi.pos.z);
        ctx.fillStyle = 'rgba(255,120,40,' + (0.4 * fi.grow) + ')';
        ctx.beginPath(); ctx.arc(fp[0], fp[1], 3, 0, 6.283); ctx.fill();
      }
    }

    this.n.callout.textContent = g.world ? g.world.calloutAt(view.pos.x, view.pos.z) : '';
  };

  UI.prototype.addKill = function (entry) {
    if (!this.settings.hud.killfeed) return;
    var node = mk('div', 'kf' + (entry.mine ? ' mine' : ''));
    var aCls = entry.aTeam === 1 ? 'a' : 'd';
    var vCls = entry.vTeam === 1 ? 'a' : 'd';
    var icons = (entry.pen ? '<span class="icon" title="through a wall">▤</span>' : '') +
                (entry.thruSmoke ? '<span class="icon" title="through smoke">☁</span>' : '') +
                (entry.noscope ? '<span class="icon" title="no scope">◎</span>' : '') +
                (entry.hs ? '<span class="icon" title="headshot">✜</span>' : '');
    node.innerHTML = (entry.assist ? '<span class="' + aCls + '">' + esc(entry.assist) + '</span><span class="w">+</span>' : '') +
      '<span class="' + aCls + '">' + esc(entry.attacker) + '</span>' +
      '<span class="w">' + esc(entry.weapon) + '</span>' + icons +
      '<span class="' + vCls + '">' + esc(entry.victim) + '</span>';
    this.n.killfeed.appendChild(node);
    var self = this;
    this.killfeedItems.push(node);
    while (this.killfeedItems.length > 6) {
      var old = this.killfeedItems.shift();
      if (old.parentNode) old.parentNode.removeChild(old);
    }
    setTimeout(function () {
      node.classList.add('fade');
      setTimeout(function () {
        if (node.parentNode) node.parentNode.removeChild(node);
        var idx = self.killfeedItems.indexOf(node);
        if (idx >= 0) self.killfeedItems.splice(idx, 1);
      }, 450);
    }, 7000);
  };

    if (this.ui.inMenu() || !this.running) return;

    if (this.ui.buyOpen) {
      if (code === 'KeyB') { this.ui.closeBuy(); return; }
      var n = parseInt(code.replace('Digit', ''), 10);
      if (code.indexOf('Digit') === 0 && n >= 1 && n <= 9) {
        if (e && e.shiftKey) this.ui.buyCatByNumber(n); else this.ui.buyByNumber(n);
        return;
      }
      return;
    }

    if (code === k.buy) { if (this.canBuyNow()) this.ui.openBuy(); else this.ui.toast('You can only buy in the buy zone during buy time.', 'bad'); return; }
    if (code === k.scoreboard) { this.ui.toggleScoreboard(true); return; }
    if (code === k.chatAll) { this.ui.openChat(false); return; }
    if (code === k.chatTeam) { this.ui.openChat(true); return; }
    if (code === k.slot1) this.wantSlot = 1;
    if (code === k.slot2) this.wantSlot = 2;
    if (code === k.slot3) this.wantSlot = 3;
    if (code === k.slot4) this.wantSlot = 4;
    if (code === k.slot5) this.wantSlot = 5;
  };

  Game.prototype.onKeyUp = function (code) {
    if (code === this.settings.keys.scoreboard) this.ui.toggleScoreboard(false);
  };

  Game.prototype.canBuyNow = function () {
    var p = this.localPlayer;
    if (!p || !p.alive || !this.match) return false;
    return this.match.isBuyTime(p) && this.world.inBuyZone(p.team, p.pos.x, p.pos.y, p.pos.z);
  };

  /* Build this frame's command from raw input. */
  Game.prototype.buildCommand = function (dt) {
    var k = this.settings.keys, ks = this.keys;
    var p = this.localPlayer;
    var blocked = this.ui.inMenu() || this.ui.buyOpen || !!this.ui.chatMode || this.paused;

    // look
    var sens = this.settings.sensitivity;
    if (p && p.scoped) sens *= (this.settings.zoomSensRatio || 1) / Math.max(1, P.zoomFactor(p));
    if (!blocked) {
      this.view.yaw -= this.mouse.dx * sens * M_YAW;
      this.view.pitch -= this.mouse.dy * sens * M_YAW * (this.settings.invertY ? -1 : 1);
    }
    this.mouse.dx = 0; this.mouse.dy = 0;
    this.view.yaw = M.wrapPI(this.view.yaw);
    this.view.pitch = M.clamp(this.view.pitch, -Math.PI / 2 + 0.015, Math.PI / 2 - 0.015);

    var cmd = {
      forward: 0, side: 0, jump: false, duck: false, walk: false,
      yaw: this.view.yaw, pitch: this.view.pitch,
      attack: false, attack2: false, reload: false, use: false, drop: false,
      inspect: false, slot: 0, wheel: 0, lastWeapon: false, seq: ++this.cmdSeq
    };
    if (blocked) { this.mouse.wheel = 0; this.wantSlot = 0; return cmd; }

    if (ks[k.forward]) cmd.forward += 1;
    if (ks[k.back]) cmd.forward -= 1;
    if (ks[k.right]) cmd.side += 1;
    if (ks[k.left]) cmd.side -= 1;
    cmd.jump = !!ks[k.jump];
    cmd.duck = !!ks[k.duck];
    cmd.walk = !!ks[k.walk];
    cmd.reload = !!ks[k.reload];
    cmd.use = !!ks[k.use];
    cmd.drop = !!ks[k.drop];
    cmd.inspect = !!ks[k.inspect];
    cmd.lastWeapon = !!ks[k.lastWeapon];
    cmd.attack = this.mouse.left;
    cmd.attack2 = this.mouse.right;
    cmd.slot = this.wantSlot || 0;
    cmd.wheel = this.mouse.wheel;
    this.wantSlot = 0;
    this.mouse.wheel = 0;
    return cmd;
  };

  /* ---------------------------------------------------------------
   * Match lifecycle
   * ------------------------------------------------------------- */
  Game.prototype.chooseMode = function (mode) {
    this.pendingMode = mode;
    if (mode === 'aim') this.pendingMap = 'arena';
    else if (CS.Maps.competitive.indexOf(this.pendingMap) < 0) this.pendingMap = 'bazaar';
  };
  Game.prototype.setMap = function (id) { this.pendingMap = id; };

  Game.prototype.makeRules = function () {
    var r = C.deepMerge(C.deepClone(C.DEFAULT_RULES), {});
    var preset = C.MODE_PRESETS[this.pendingMode];
    if (preset) r = C.deepMerge(r, C.deepClone(preset.rules));
    r.mode = this.pendingMode;
    return r;
  };

  Game.prototype.startSolo = function () {
    var self = this;
    this.online = false;
    this.isHost = true;
    this.rules = this.makeRules();
    this.ui.setLoading(0.1, 'Loading ' + CS.Maps.get(this.pendingMap).name);
    setTimeout(function () {
      self.prepareMap(self.pendingMap, function () {
        self.beginMatch();
        self.ui.hideLoading();
      });
    }, 30);
  };

  Game.prototype.beginMatch = function () {
    var self = this;
    this.match = new CS.Match({ map: this.map, world: this.world, rules: this.rules });
    this.rules = this.match.rules;

    var me = P.create({ id: this.localId, name: this.settings.name, local: true });
    me.team = this.pendingMode === 'aim' ? C.TEAM.DEF : C.TEAM.ATT;
    me.charId = me.team === C.TEAM.ATT ? this.settings.charATT : this.settings.charDEF;
    me.gloveId = this.settings.glove;
    this.match.addPlayer(me);
    this.localPlayer = me;

    if (this.online) {
      for (var i = 0; i < this.lobbyPlayers.length; i++) {
        var lp = this.lobbyPlayers[i];
        if (lp.id === this.localId || lp.bot) continue;
        var rp = P.create({ id: lp.id, name: lp.name, team: lp.team });
        rp.charId = lp.charId; rp.gloveId = lp.glove;
        this.match.addPlayer(rp);
      }
    }

    if (this.rules.botFill && this.pendingMode !== 'aim') {
      var size = this.rules.teamSize;
      if (this.pendingMode === 'deathmatch') size = Math.min(5, size);
      this.match.fillBots(size, this.rules.botDifficulty);
    }
    // balance the human onto a team that needs one
    this.match.balanceTeams();

    this.match.startWarmup(this.pendingMode === 'aim' || this.pendingMode === 'deathmatch' ? 2 : 5);
    this.view.yaw = me.yaw; this.view.pitch = 0;
    this.renderer.clearTransient();
    this.ui.show(null);
    this.running = true;
    this.paused = false;
    this.audio.init();
    this.audio.resume();
    this.audio.stopAmbience();
    this.requestLock();
    this.ui.toast(CS.Maps.get(this.mapId).name + ' — ' + (C.MODE_PRESETS[this.rules.mode] || {}).label, 'good');
  };

  Game.prototype.pause = function () {
    if (!this.running) return;
    this.paused = true;
    this.ui.show('pause');
    if (doc.exitPointerLock) doc.exitPointerLock();
  };
  Game.prototype.resume = function () {
    if (!this.running) { this.ui.show('mainmenu'); return; }
    this.paused = false;
    this.ui.show(null);
    this.requestLock();
  };
  Game.prototype.quitToMenu = function () {
    this.running = false;
    this.paused = false;
    this.match = null;
    this.localPlayer = null;
    if (this.online) this.leaveMatch();
    if (doc.exitPointerLock) doc.exitPointerLock();
    this.ui.show('mainmenu');
    this.audio.setMuffle(0);
    this.audio.startAmbience();
  };
  Game.prototype.playAgain = function () {
    if (this.online && this.isHost) { this.hostStart(); return; }
    this.startSolo();
  };

  /* ---------------------------------------------------------------
   * Online
   * ------------------------------------------------------------- */
  Game.prototype.createMatch = function () {
    var self = this;
    this.online = true;
    this.isHost = true;
    this.rules = this.makeRules();
    this.roomCode = C.makeRoomCode(5);
    this.localReady = true;
    this.lobbyPlayers = [{
      id: this.localId, name: this.settings.name, team: C.TEAM.ATT, ready: true, host: true,
      charId: this.settings.charATT, glove: this.settings.glove
    }];
    this.lobbyStatus = 'Opening room…';
    this.ui.show('lobby');
    this.setupNetHandlers();
    this.net.host(this.roomCode);
  };

  Game.prototype.joinMatch = function (code) {
    this.online = true;
    this.isHost = false;
    this.roomCode = code;
    this.localReady = false;
    this.lobbyPlayers = [];
    this.lobbyStatus = 'Connecting…';
    this.localId = 'p' + Math.random().toString(36).slice(2, 8);
    this.ui.show('lobby');
    this.setupNetHandlers();
    this.net.join(code);
  };

  Game.prototype.setupNetHandlers = function () {
    var self = this;
    this.net.handlers = {};
    this.net.on('ready', function () {
      self.lobbyStatus = 'Room open — share the code';
      self.ui.renderLobby();
    });
    this.net.on('codeTaken', function () {
      self.roomCode = C.makeRoomCode(5);
      self.net.close();
      self.net.host(self.roomCode);
    });
    this.net.on('connecting', function () { self.lobbyStatus = 'Finding host…'; self.ui.renderLobby(); });
    this.net.on('joinFailed', function (why) {
      self.ui.toast(why, 'bad');
      self.lobbyStatus = why;
      self.ui.renderLobby();
    });
    this.net.on('error', function (why) {
      self.ui.toast(why, 'bad');
      self.lobbyStatus = why + ' — you can still play offline with bots.';
      self.ui.renderLobby();
    });
    this.net.on('signalLost', function () {
      self.ui.toast('Lost the signalling server. Existing connections keep working.', 'bad');
    });
    this.net.on('open', function (peerId) { self.onPeerOpen(peerId); });
    this.net.on('close', function (peerId, why) { self.onPeerClose(peerId, why); });
    this.net.on('message', function (peerId, msg) { self.onNetMessage(peerId, msg); });
    this.net.on('voiceStream', function (peerId, stream) { self.voice.attachStream(peerId, stream); });
  };

  Game.prototype.onPeerOpen = function (peerId) {
    if (this.isHost) {
      this.net.send(peerId, { t: 'welcome', code: this.roomCode, proto: C.PROTOCOL }, true);
    } else {
      this.net.send(peerId, {
        t: 'hello', proto: C.PROTOCOL, id: this.localId, name: this.settings.name,
        charATT: this.settings.charATT, charDEF: this.settings.charDEF, glove: this.settings.glove
      }, true);
      this.lobbyStatus = 'Connected — waiting in the lobby';
      this.ui.renderLobby();
    }
  };

  Game.prototype.onPeerClose = function (peerId, why) {
    var pid = this.remote[peerId];
    if (pid) {
      if (this.isHost && this.match) {
        var pl = this.match.byId[pid];
        if (pl) {
          this.ui.addChat({ sys: true, text: pl.name + ' disconnected' });
          // a disconnected player becomes a bot so the round can finish
          if (this.match.phase !== C.PHASE.WARMUP) {
            pl.bot = true;
            CS.Bots.attach(pl, this.rules.botDifficulty);
            pl.name = pl.name + ' (bot)';
          } else {
            this.match.removePlayer(pid);
          }
        }
      }
      this.lobbyPlayers = this.lobbyPlayers.filter(function (p) { return p.id !== pid; });
      delete this.remote[peerId];
      delete this.peerOf[pid];
      this.voice.detach(peerId);
      if (this.isHost) this.broadcastLobby();
      this.ui.renderLobby();
    }
    if (!this.isHost && peerId === this.net.hostId) {
      this.ui.toast('Lost connection to the host.', 'bad');
      this.lobbyStatus = 'Disconnected from host';
      if (this.running) this.quitToMenu();
    }
  };

  Game.prototype.peerIdOf = function (player) { return this.peerOf[player.id] || null; };

  Game.prototype.onNetMessage = function (peerId, msg) {
    var self = this;
    switch (msg.t) {
      case 'welcome':
        break;
      case 'hello':
        if (!this.isHost) return;
        if (msg.proto !== C.PROTOCOL) {
          this.net.send(peerId, { t: 'kick', why: 'Different game version — both players need to reload.' }, true);
          return;
        }
        this.remote[peerId] = msg.id;
        this.peerOf[msg.id] = peerId;
        var team = this.smallestTeam();
        this.lobbyPlayers.push({
          id: msg.id, name: String(msg.name || 'Player').slice(0, 18), team: team, ready: false,
          charId: team === C.TEAM.ATT ? msg.charATT : msg.charDEF, glove: msg.glove
        });
        this.ui.addChat({ sys: true, text: msg.name + ' joined' });
        this.broadcastLobby();
        this.ui.renderLobby();
        break;
      case 'kick':
        this.ui.toast(msg.why || 'Removed from the match.', 'bad');
        this.leaveMatch();
        break;
      case 'lobby':
        if (this.isHost) return;
        this.lobbyPlayers = msg.players;
        this.rules = msg.rules;
        this.pendingMap = msg.map;
        this.pendingMode = msg.rules.mode;
        this.mapVotes = msg.votes || {};
        var me = this.lobbyPlayers.filter(function (p) { return p.id === self.localId; })[0];
        if (me) this.localReady = me.ready;
        this.lobbyStatus = 'In lobby';
        this.ui.renderLobby();
        this.net.peerList().forEach(function (pid) { self.net.connectPeer(pid); });
        break;
      case 'ready':
        if (!this.isHost) return;
        this.setLobbyField(this.remote[peerId], 'ready', !!msg.v);
        this.broadcastLobby();
        this.ui.renderLobby();
        break;
      case 'team':
        if (!this.isHost) return;
        this.setLobbyField(this.remote[peerId], 'team', msg.v);
        this.broadcastLobby();
        this.ui.renderLobby();
        break;
      case 'start':
        if (this.isHost) return;
        this.rules = msg.rules;
        this.pendingMap = msg.map;
        this.lobbyPlayers = msg.players;
        this.clientStart();
        break;
      case 'cmd': {
        if (!this.isHost || !this.match) return;
        var pid = this.remote[peerId];
        if (!pid) return;
        var pl = this.match.byId[pid];
        if (!pl) return;
        var clean = sanitizeCommand(msg.c);
        if (!clean) return;
        // the host decides where the shot came from — clients only send intent
        clean.lagTime = this.match.time - (this.net.pingOf(peerId) / 1000) - C.INTERP_DELAY;
        pl.ping = this.net.pingOf(peerId);
        pl.afk = 0;
        this.pendingCommands[pid] = clean;
        break;
      }
      case 'buy': {
        if (!this.isHost || !this.match) return;
        var bp = this.match.byId[this.remote[peerId]];
        if (!bp) return;
        if (typeof msg.id !== 'string' || !W.get(msg.id)) return;
        // buy spam would let a client brute-force the economy checks
        var now = this.match.time;
        if (bp._buyWindow === undefined || now - bp._buyWindow > 1) { bp._buyWindow = now; bp._buyCount = 0; }
        if (++bp._buyCount > 12) return;
        this.match.buyFor(bp, msg.id);
        break;
      }
      case 'snap':
        if (this.isHost) return;
        this.applySnapshot(msg);
        break;
      case 'ev':
        if (this.isHost) return;
        for (var i = 0; i < msg.e.length; i++) this.handleEvent(msg.e[i], true);
        break;
      case 'chat':
        this.onChat(msg, peerId);
        break;
      case 'vote':
        if (!this.isHost) return;
        this.mapVotes[this.remote[peerId]] = msg.map;
        this.broadcastLobby();
        break;
    }
  };

  /* Clients are never trusted with positions, health or damage — only with a
   * command struct, and even that is bounds-checked before it is simulated. */
  var CMD_BOOLS = ['jump', 'duck', 'walk', 'attack', 'attack2', 'reload', 'use', 'drop', 'inspect', 'lastWeapon'];
  function sanitizeCommand(c) {
    if (!c || typeof c !== 'object') return null;
    var out = {};
    var f = +c.forward, sd = +c.side, yaw = +c.yaw, pitch = +c.pitch;
    if (!isFinite(yaw) || !isFinite(pitch)) return null;
    out.forward = isFinite(f) ? M.clamp(f, -1, 1) : 0;
    out.side = isFinite(sd) ? M.clamp(sd, -1, 1) : 0;
    out.yaw = M.wrapPI(yaw);
    out.pitch = M.clamp(pitch, -Math.PI / 2, Math.PI / 2);
    for (var i = 0; i < CMD_BOOLS.length; i++) out[CMD_BOOLS[i]] = !!c[CMD_BOOLS[i]];
    var slot = c.slot | 0;
    out.slot = (slot >= 1 && slot <= 5) ? slot : 0;
    var wheel = c.wheel | 0;
    out.wheel = M.clamp(wheel, -1, 1);
    out.seq = c.seq | 0;
    return out;
  }

  Game.prototype.smallestTeam = function () {
    var a = 0, d = 0;
    for (var i = 0; i < this.lobbyPlayers.length; i++) {
      if (this.lobbyPlayers[i].team === C.TEAM.ATT) a++; else d++;
    }
    return a <= d ? C.TEAM.ATT : C.TEAM.DEF;
  };
  Game.prototype.setLobbyField = function (id, field, value) {
    for (var i = 0; i < this.lobbyPlayers.length; i++) {
      if (this.lobbyPlayers[i].id === id) { this.lobbyPlayers[i][field] = value; return; }
    }
  };
  Game.prototype.broadcastLobby = function () {
    if (!this.isHost) return;
    this.net.broadcast({
      t: 'lobby', players: this.lobbyPlayers, rules: this.rules,
      map: this.pendingMap, votes: this.mapVotes
    }, true);
  };

  Game.prototype.toggleReady = function () {
    this.localReady = !this.localReady;
    if (this.isHost) {
      this.setLobbyField(this.localId, 'ready', this.localReady);
      this.broadcastLobby();
    } else {
      this.net.broadcast({ t: 'ready', v: this.localReady }, true);
    }
    this.ui.renderLobby();
  };
  Game.prototype.requestTeam = function (team) {
    if (this.isHost) {
      this.setLobbyField(this.localId, 'team', team);
      this.broadcastLobby();
      if (this.match) {
        var p = this.match.byId[this.localId];
        if (p) this.match.setTeam(p, team);
      }
    } else {
      this.net.broadcast({ t: 'team', v: team }, true);
    }
    this.ui.renderLobby();
  };
  Game.prototype.voteMap = function (id) {
    if (this.isHost) { this.pendingMap = id; this.broadcastLobby(); }
    else this.net.broadcast({ t: 'vote', map: id }, true);
    this.ui.renderLobby();
  };
  Game.prototype.addBot = function (team) {
    if (!this.isHost) return;
    var name = CS.Bots.nextName();
    this.lobbyPlayers.push({ id: 'bot' + Math.random().toString(36).slice(2, 7), name: name,
      team: team, ready: true, bot: true, skill: this.rules.botDifficulty });
    this.broadcastLobby();
    this.ui.renderLobby();
  };
  Game.prototype.removeBot = function () {
    if (!this.isHost) return;
    for (var i = this.lobbyPlayers.length - 1; i >= 0; i--) {
      if (this.lobbyPlayers[i].bot) { this.lobbyPlayers.splice(i, 1); break; }
    }
    this.broadcastLobby();
    this.ui.renderLobby();
  };
  Game.prototype.setRule = function (key, value) {
    if (!this.isHost) return;
    this.rules[key] = value;
    if (key === 'winRounds') {
      this.rules.maxRounds = (value - 1) * 2;
      this.rules.halftimeAt = value - 1;
    }
    this.broadcastLobby();
  };

  Game.prototype.hostStart = function () {
    var self = this;
    if (!this.isHost) return;
    this.rules.mode = this.pendingMode;
    this.net.broadcast({ t: 'start', rules: this.rules, map: this.pendingMap, players: this.lobbyPlayers }, true);
    this.ui.setLoading(0.2, 'Loading map');
    setTimeout(function () {
      self.prepareMap(self.pendingMap, function () {
        self.beginMatchOnline();
        self.ui.hideLoading();
      });
    }, 30);
  };

  Game.prototype.clientStart = function () {
    var self = this;
    this.ui.setLoading(0.2, 'Loading map');
    setTimeout(function () {
      self.prepareMap(self.pendingMap, function () {
        self.beginMatchOnline();
        self.ui.hideLoading();
      });
    }, 30);
  };

  Game.prototype.beginMatchOnline = function () {
    this.match = new CS.Match({ map: this.map, world: this.world, rules: this.rules });
    this.rules = this.match.rules;

    for (var i = 0; i < this.lobbyPlayers.length; i++) {
      var lp = this.lobbyPlayers[i];
      var p = P.create({ id: lp.id, name: lp.name, team: lp.team, local: lp.id === this.localId, bot: !!lp.bot });
      p.charId = lp.team === C.TEAM.ATT ? (lp.charId || 'syn_default') : (lp.charId || 'van_default');
      p.gloveId = lp.glove || 'default';
      if (lp.bot && this.isHost) CS.Bots.attach(p, lp.skill || this.rules.botDifficulty);
      this.match.addPlayer(p);
      if (lp.id === this.localId) this.localPlayer = p;
    }
    if (!this.localPlayer) {
      var me = P.create({ id: this.localId, name: this.settings.name, team: C.TEAM.ATT, local: true });
      this.match.addPlayer(me);
      this.localPlayer = me;
    }
    if (this.isHost && this.rules.botFill) this.match.fillBots(this.rules.teamSize, this.rules.botDifficulty);

    this.match.startWarmup(6);
    this.view.yaw = this.localPlayer.yaw;
    this.renderer.clearTransient();
    this.ui.show(null);
    this.running = true; this.paused = false;
    this.audio.init(); this.audio.resume(); this.audio.stopAmbience();
    this.requestLock();
    if (this.settings.voiceEnabled) this.enableVoice(false);
  };

  Game.prototype.leaveMatch = function () {
    this.net.close();
    this.voice.stop();
    this.online = false;
    this.running = false;
    this.match = null;
    this.lobbyPlayers = [];
    this.ui.show('mainmenu');
  };

  /* ---------------------------------------------------------------
   * Snapshots
   * ------------------------------------------------------------- */
  Game.prototype.sendSnapshot = function () {
    if (!this.isHost || !this.match || !this.online) return;
    var m = this.match;
    var players = [];
    for (var i = 0; i < m.players.length; i++) players.push(P.snapshot(m.players[i]));
    var meta = [];
    for (var k = 0; k < m.players.length; k++) {
      var p = m.players[k];
      meta.push([p.id, p.money, p.kills, p.deaths, p.assists, p.score, p.mvps,
                 Math.round(p.damage), p.headshots, Math.round(p.ping),
                 p.primary ? p.primary.id : 0, p.primary ? p.primary.mag : 0, p.primary ? p.primary.reserve : 0,
                 p.secondary ? p.secondary.id : 0, p.secondary ? p.secondary.mag : 0, p.secondary ? p.secondary.reserve : 0,
                 p.grenades.map(function (g) { return g.id + ':' + g.count; }).join(','),
                 p.kit ? 1 : 0, p.cur]);
    }
    this.net.broadcast({
      t: 'snap', tm: m.time, p: players, m: meta, s: m.stateSnapshot(),
      d: m.droppedWeapons.map(function (d) { return [d.id, d.wid, d.x, d.y, d.z, d.yaw]; }),
      g: m.nades.smokes.map(function (s) { return [s.id, s.pos.x, s.pos.y, s.pos.z, s.radius, s.opacity]; }),
      f: m.nades.fires.map(function (f) { return [f.id, f.pos.x, f.pos.y, f.pos.z, f.radius, f.grow]; }),
      n: m.nades.proj.map(function (g) { return [g.id, g.wid, g.pos.x, g.pos.y, g.pos.z, g.spin]; })
    }, false);
  };

  Game.prototype.applySnapshot = function (msg) {
    var m = this.match;
    if (!m) return;
    this.serverTime = msg.tm;

    var seen = {};

        if (e.im) {
          for (var q = 0; q < e.im.length; q++) {
            var im = e.im[q];
            R.spawnImpact(im[0], im[1], im[2], im[3], im[4], im[5], im[6], 1);
            A.impact(im[6], im[0], im[1], im[2]);
          }
        } else if (e.impacts) {
          for (var s = 0; s < e.impacts.length; s++) {
            var ip = e.impacts[s];
            R.spawnImpact(ip.x, ip.y, ip.z, ip.nx, ip.ny, ip.nz, ip.box ? ip.box.mat : 'concrete', ip.power);
            A.impact(ip.box ? ip.box.mat : 'concrete', ip.x, ip.y, ip.z);
          }
        }
        if (!isLocal && e.ex !== undefined) {
          R.tracers.add(e.ox, e.oy, e.oz, e.ex, e.ey, e.ez, 300, 0.05);
          // whiz-by when the round passes close to the camera
          if (view) {
            var closest = this.pointSegDist(view.pos.x, view.pos.y + view.eye, view.pos.z,
                                            e.ox, e.oy, e.oz, e.ex, e.ey, e.ez);
            if (closest < 2.6 && closest > 0.3) A.bulletWhiz(view.pos.x, view.pos.y + view.eye, view.pos.z);
          }
        }
        break;
      }
      case 'melee': {
        if (e.id === (lp && lp.id)) {
          this.vm.anim = 'fire'; this.vm.animT = 0;
          this.vm.kick = Math.min(1.2, this.vm.kick + 0.8);
          A.local(e.hit ? 'hitmarker' : 'switch');
        } else {
          A.impact('metal', e.x, e.y, e.z);
        }
        break;
      }
      case 'hurt': {
        var victim = m.byId[e.v], attacker = e.a ? m.byId[e.a] : null;
        if (e.target) {
          R.spawnBlood(e.x, e.y, e.z, 0, 0.4, 0, e.dmg, null);
          A.impact('wood', e.x, e.y, e.z);
        }
        if (victim) {
          var dir = attacker ? {
            x: victim.pos.x - attacker.pos.x, y: 0.35, z: victim.pos.z - attacker.pos.z
          } : { x: 0, y: 1, z: 0 };
          var dl = Math.sqrt(dir.x * dir.x + dir.z * dir.z) || 1;
          R.spawnBlood(e.x, e.y, e.z, dir.x / dl * 0.6, dir.y, dir.z / dl * 0.6, e.dmg, this.world);
          A.fleshHit(e.x, e.y, e.z, e.group === 0, e.armor > 0);
          victim.hitFlash = 0.35;
        }
        if (attacker === lp && victim !== lp) {
          this.ui.hitmarker(false, e.group === 0);
          A.local(e.group === 0 ? 'headshot' : 'hitmarker');
          var pt = this.projectToScreen(e.x, e.y, e.z);
          if (pt) this.ui.damageNumber(pt[0], pt[1], e.dmg, e.group === 0);
        }
        if (victim === lp) {
          this.hurtFlash = 1;
          A.local('hurt');
          this.ui.setOverlay('dmg', Math.min(0.85, (e.dmg / 60)));
        }
        break;
      }
      case 'kill': {
        var vp = m.byId[e.v], ap = e.a ? m.byId[e.a] : null;
        if (vp) {
          R.addCorpse(vp, this.world,
            vp.charId || (vp.team === C.TEAM.ATT ? 'syn_default' : 'van_default'), vp.gloveId || 'default');
        }
        var wName = e.wid ? (W.get(e.wid) ? W.get(e.wid).name : e.wid) : 'world';
        this.ui.addKill({
          attacker: ap ? ap.name : 'World', victim: vp ? vp.name : '?',
          aTeam: ap ? ap.team : 0, vTeam: vp ? vp.team : 0,
          weapon: wName, hs: e.hs, pen: e.pen, thruSmoke: e.thruSmoke, noscope: e.noscope,
          assist: e.assist && m.byId[e.assist] ? m.byId[e.assist].name : null,
          mine: ap === lp || vp === lp
        });
        if (ap === lp && vp !== lp) {
          A.local('kill');
          this.ui.hitmarker(true, e.hs);
          if (e.streak >= 3) this.ui.toast(e.streak + ' in a row', 'good');
        }
        if (vp === lp) {
          A.local('death');
          this.ui.setOverlay('dmg', 1);
          this.spectateIndex = 0;
        }
        break;
      }
      case 'step': {
        var sp = m.byId[e.id];
        if (sp === lp && !this.freeCam) break;
        A.footstep(e.surf, e.x, e.y, e.z, e.vol);
        break;
      }
      case 'jump': if (m.byId[e.id] !== lp) A.footstep('concrete', e.x, e.y, e.z, 0.5); break;
      case 'land': if (e.hard) A.footstep('concrete', e.x, e.y, e.z, 1); break;
      case 'throw': A.throwSound(e.x || 0, e.y || 0, e.z || 0); break;
      case 'smoke': A.smokePop(e.x, e.y, e.z); break;
      case 'fire': A.explosion(e.x, e.y, e.z, 0.35); break;
      case 'he':
        R.spawnExplosion(e.x, e.y, e.z, e.radius || 7, this.world);
        A.explosion(e.x, e.y, e.z, 1);
        break;
      case 'flash':
        R.particles.spawn({ x: e.x, y: e.y, z: e.z, size: 0.4, size2: 6, life: 0.25,
                            tile: CS.FX.T.GLOW, r: 1, g: 1, b: 1, a: 1, a2: 0, drag: 0 });
        break;
      case 'flashed':
        if (e.id === (lp && lp.id)) {
          lp.flashAmount = e.amount; lp.flashTime = e.hold;
          A.flashbang(e.amount);
        }
        break;
      case 'bombPlanted':
        this.ui.banner('Bomb planted', 'Site ' + e.site, '', '#ff5a3c');
        A.local('pin');
        this.bombBeepT = 0;
        break;
      case 'bombDefused': this.ui.banner('Bomb defused', '', '', C.TEAM_INFO[2].color); break;
      case 'bombExploded':
        R.spawnExplosion(e.x, e.y + 0.5, e.z, 14, this.world);
        A.explosion(e.x, e.y, e.z, 1.6);
        break;
      case 'plantStart': if (e.id !== (lp && lp.id)) A.plantBeep(e.x, e.y, e.z); break;
      case 'defuseStart': if (e.id !== (lp && lp.id)) A.defuseWire(0, 0, 0); break;
      case 'roundStart':
        this.ui.hideBanner();
        A.local('roundStart');
        this.renderer.decals.clear();
        this.renderer.corpses.length = 0;
        this.ui.addChat({ sys: true, text: 'Round ' + e.round + ' — ' + m.score[1] + ' : ' + m.score[2] });
        break;
      case 'roundLive': this.ui.banner('Go', '', '', '#ffffff'); break;
      case 'roundEnd': {
        var info = C.TEAM_INFO[e.winner];
        var reason = { elimination: 'Team eliminated', bomb: 'Explosive detonated',
                       defused: 'Bomb defused', time: 'Time expired' }[e.reason] || '';
        var won = lp && e.winner === lp.team;
        this.ui.banner(info ? info.name + ' win' : 'Round draw', reason,
          e.mvp && m.byId[e.mvp] ? '★ MVP  ' + m.byId[e.mvp].name : '', info ? info.color : '');
        A.local(won ? 'win' : 'lose');
        if (e.mvp === (lp && lp.id)) setTimeout(function () { A.local('mvp'); }, 700);
        break;
      }
      case 'halftime':
        this.ui.banner('Half time', 'Swapping sides', '', '#ffffff');
        if (lp) { this.view.yaw = lp.yaw; }
        break;
      case 'overtime': this.ui.banner('Overtime', 'First to three', '', '#ff7a2f'); break;
      case 'matchEnd': {
        var winInfo = C.TEAM_INFO[e.winner];
        this.ui.banner(winInfo ? winInfo.name + ' take the match' : 'Draw',
                       m.score[1] + ' — ' + m.score[2], '', winInfo ? winInfo.color : '');
        var self = this;
        setTimeout(function () {
          if (doc.exitPointerLock) doc.exitPointerLock();
          if (m.rules.mode === 'aim' && m.aimStats) self.ui.showAimStats(m.aimStats, m.time);
          else self.ui.showResults(m, lp ? lp.team : 0);
        }, 3200);
        break;
      }
      case 'spawn':
        if (e.id === (lp && lp.id)) {
          this.ui.setOverlay('dmg', 0);
          this.view.yaw = lp.yaw; this.view.pitch = 0;
          this.freeCam = null; this.spectateTarget = null;
          this.vm.anim = 'deploy'; this.vm.animT = 0;
        }
        break;
      case 'targetDown':
        R.particles.spawn({ x: e.x, y: e.y + 1.2, z: e.z, size: 0.3, size2: 1.6, life: 0.4,
                            tile: CS.FX.T.RING, r: 1, g: e.head ? 0.85 : 0.4, b: 0.3, a: 0.9, a2: 0, drag: 0 });
        A.local(e.head ? 'headshot' : 'kill');
        break;
      case 'dry': if (e.id === (lp && lp.id)) A.local('dry'); break;
      case 'pickup': if (e.id === (lp && lp.id)) A.local('pickup'); break;
      case 'join': if (!fromNet) break; this.ui.addChat({ sys: true, text: e.name + ' joined' }); break;
      case 'leave': this.ui.addChat({ sys: true, text: e.name + ' left' }); break;
    }
  };

  Game.prototype.spawnRemoteMuzzle = function (shooter, e) {
    var R = this.renderer;
    R.particles.spawn({
      x: e.ox + e.dx * 0.55, y: e.oy + e.dy * 0.55 - 0.1, z: e.oz + e.dz * 0.55,
      size: 0.34, size2: 0.1, life: 0.06, tile: CS.FX.T.FLASH,
      r: 1, g: 0.9, b: 0.6, a: 1, a2: 0, drag: 0, rot: Math.random() * 6.28
    });
    R.spawnShell(e.ox + e.dx * 0.2, e.oy - 0.1, e.oz + e.dz * 0.2,
      (Math.random() - 0.5) * 2 + e.dz * 1.5, 1.6 + Math.random(), (Math.random() - 0.5) * 2 - e.dx * 1.5);
  };

  Game.prototype.onLocalShotFx = function (p, w, eye, end) {
    var R = this.renderer, vm = this.vm;
    this.audio.gunshot(w, eye.x, eye.y, eye.z, true);
    vm.flash = 1;
    vm.flashRot = Math.random() * 6.28;
    vm.kick = Math.min(1.4, vm.kick + 0.55 + (w.recoilScale || 1) * 0.3);
    vm.kickYaw += (Math.random() - 0.5) * 0.06;
    vm.anim = 'fire'; vm.animT = 0;
    R.tracers.add(eye.x + 0.1, eye.y - 0.12, eye.z, end.x, end.y, end.z, 340, 0.04);
    if (w.cls !== 'shotgun' || Math.random() < 0.5) {
      var side = this.settings.viewmodelSide || 1;
      var rx = Math.sin(this.camera.yaw), rz = Math.cos(this.camera.yaw);
      R.spawnShell(eye.x + rx * 0.25 * side, eye.y - 0.18, eye.z + rz * 0.25 * side,
        rx * (2 + Math.random()) * side, 1.8 + Math.random(), rz * (2 + Math.random()) * side);
    }
  };

  Game.prototype.pointSegDist = function (px, py, pz, ax, ay, az, bx, by, bz) {
    var dx = bx - ax, dy = by - ay, dz = bz - az;
    var l2 = dx * dx + dy * dy + dz * dz;
    if (l2 < 1e-6) return Math.sqrt((px - ax) * (px - ax) + (py - ay) * (py - ay) + (pz - az) * (pz - az));
    var t = M.clamp(((px - ax) * dx + (py - ay) * dy + (pz - az) * dz) / l2, 0, 1);
    var cx = ax + dx * t - px, cy = ay + dy * t - py, cz = az + dz * t - pz;
    return Math.sqrt(cx * cx + cy * cy + cz * cz);
  };

  Game.prototype.projectToScreen = function (x, y, z) {
    var Mat4 = CS.Mat4;
    var vp = this.renderer.viewProj;
    var w = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
    if (w <= 0.05) return null;
    var cx = (vp[0] * x + vp[4] * y + vp[8] * z + vp[12]) / w;
    var cy = (vp[1] * x + vp[5] * y + vp[9] * z + vp[13]) / w;
    if (cx < -1.2 || cx > 1.2 || cy < -1.2 || cy > 1.2) return null;
    var rect = this.renderer.canvas.getBoundingClientRect();
    return [(cx * 0.5 + 0.5) * rect.width, (-cy * 0.5 + 0.5) * rect.height];
  };

  /* ---------------------------------------------------------------
   * Camera
   * ------------------------------------------------------------- */
  Game.prototype.updateCamera = function (dt) {
    var p = this.spectateTarget || this.localPlayer;
    var cam = this.camera;

    if (this.freeCam) {
      var fc = this.freeCam;
      var f = M.angleVectors(this.view.yaw, this.view.pitch);
      var speed = (this.keys[this.settings.keys.walk] ? 3 : 9) * dt;
      var side = { x: Math.sin(this.view.yaw), y: 0, z: Math.cos(this.view.yaw) };
      var fwd = (this.keys[this.settings.keys.forward] ? 1 : 0) - (this.keys[this.settings.keys.back] ? 1 : 0);
      var str = (this.keys[this.settings.keys.right] ? 1 : 0) - (this.keys[this.settings.keys.left] ? 1 : 0);
      fc.x += (f.x * fwd + side.x * str) * speed;
      fc.y += (f.y * fwd) * speed + (this.keys[this.settings.keys.jump] ? speed : 0);
      fc.z += (f.z * fwd + side.z * str) * speed;
      cam.x = fc.x; cam.y = fc.y; cam.z = fc.z;
      cam.yaw = this.view.yaw; cam.pitch = this.view.pitch; cam.roll = 0; cam.zoom = 1;
      return;
    }
    if (!p) return;

    var isLocal = (p === this.localPlayer) && p.alive;
    var aim = isLocal ? P.aimAngles(p) : { yaw: p.yaw, pitch: p.pitch };
    cam.yaw = aim.yaw + (isLocal ? p.viewPunchYaw * M.DEG * 0.5 : 0);
    cam.pitch = M.clamp(aim.pitch + (isLocal ? p.viewPunchPitch * M.DEG * 0.5 : 0), -1.55, 1.55);

    // head bob and strafe roll
    var speed = P.speed2D(p);
    var moveFrac = M.clamp(speed / C.MAX_SPEED, 0, 1);
    this.bobT = (this.bobT || 0) + dt * speed * 1.5;
    var bobY = p.onGround ? Math.abs(Math.sin(this.bobT)) * 0.022 * moveFrac : 0;
    var bobX = p.onGround ? Math.sin(this.bobT * 0.5) * 0.016 * moveFrac : 0;

    var rightDot = 0;
    if (speed > 0.2) {
      var rx = Math.sin(p.yaw), rz = Math.cos(p.yaw);
      rightDot = (p.vel.x * rx + p.vel.z * rz) / C.MAX_SPEED;
    }
    this.rollTarget = M.clamp(-rightDot * 0.028, -0.03, 0.03);
    cam.roll = M.damp(cam.roll || 0, this.rollTarget, 0.002, dt);

    cam.x = p.pos.x + bobX * 0.4;
    cam.y = p.pos.y + p.eye + bobY;
    cam.z = p.pos.z;

    // nudge the camera out of geometry when very close to a wall
    cam.zoom = isLocal ? P.zoomFactor(p) : 1;
    this.ui.setScope(isLocal && p.scoped, p.scopeLevel);
    this.vm.hidden = (isLocal && p.scoped) || !isLocal;
  };

  Game.prototype.updateSpectate = function (dt) {
    var lp = this.localPlayer, m = this.match;
    if (!lp || lp.alive) { this.spectateTarget = null; this.freeCam = null; return; }
    var mates = m.teamPlayers(lp.team, true);
    if (this.keys[this.settings.keys.jump] && !this.freeCam) {
      this.freeCam = { x: this.camera.x, y: this.camera.y, z: this.camera.z };
      this.spectateTarget = null;
      return;
    }
    if (!mates.length) { this.spectateTarget = null; return; }
    if (this.mouse.left && !this.specClick) { this.spectateIndex++; this.specClick = true; this.freeCam = null; }
    else if (this.mouse.right && !this.specClick) { this.spectateIndex--; this.specClick = true; this.freeCam = null; }
    else if (!this.mouse.left && !this.mouse.right) this.specClick = false;
    if (this.freeCam) return;
    this.spectateIndex = ((this.spectateIndex % mates.length) + mates.length) % mates.length;
    this.spectateTarget = mates[this.spectateIndex];
    if (this.spectateTarget) {
      this.view.yaw = this.spectateTarget.yaw;
      this.view.pitch = this.spectateTarget.pitch;
    }
  };

  /* ---------------------------------------------------------------
   * Viewmodel
   * ------------------------------------------------------------- */
  Game.prototype.updateViewmodel = function (dt) {
    var vm = this.vm, p = this.localPlayer;
    if (!p) return;
    var w = P.curWeapon(p);
    var slot = P.curSlot(p);

    if (vm.lastWeapon !== w.id) {
      vm.lastWeapon = w.id;
      vm.anim = 'deploy'; vm.animT = 0;
      if (this.audio.ready) this.audio.local('switch');
    }
    // reload sound cues, driven off the reload timer
    var reloading = p.reloadTimer > 0;
    if (reloading && !this._wasReloading) {
      this.audio.local('magOut');
      var self = this, total = Math.max(0.2, w.reload || 2.2);
      clearTimeout(this._magInT);
      this._magInT = setTimeout(function () { self.audio.local('magIn'); }, total * 620);
    }
    if (!reloading && this._wasReloading && w.bolt) this.audio.local('bolt');
    this._wasReloading = reloading;
    vm.weaponId = w.id === 'bomb' ? null : w.id;
    vm.skin = (this.settings.skins && this.settings.skins[w.id]) || 'factory';
    vm.glove = this.settings.glove;
    vm.hidden = vm.hidden || !p.alive || !vm.weaponId;

    vm.animT += dt;
    if (p.reloadTimer > 0 && vm.anim !== 'reload') { vm.anim = 'reload'; vm.animT = 0; }
    if (p.inspectTimer > 0 && vm.anim !== 'inspect') { vm.anim = 'inspect'; vm.animT = 0; }

    // sway follows the mouse with a spring
    var dYaw = M.angleDelta(vm.lastYaw === undefined ? this.view.yaw : vm.lastYaw, this.view.yaw);
    var dPitch = this.view.pitch - (vm.lastPitch === undefined ? this.view.pitch : vm.lastPitch);
    vm.lastYaw = this.view.yaw; vm.lastPitch = this.view.pitch;
    vm.swayX = M.damp(vm.swayX + dYaw * 0.55, 0, 0.0001, dt);
    vm.swayY = M.damp(vm.swayY + dPitch * 0.55, 0, 0.0001, dt);
    vm.swayX = M.clamp(vm.swayX, -0.22, 0.22);
    vm.swayY = M.clamp(vm.swayY, -0.22, 0.22);

    // walking bob
    var speed = P.speed2D(p);
    var frac = M.clamp(speed / C.MAX_SPEED, 0, 1);
    vm.bobT += dt * (1.5 + speed * 1.4);
    var bobEnabled = this.settings.viewmodelBob;
    var bx = bobEnabled ? Math.sin(vm.bobT) * 0.018 * frac : 0;
    var by = bobEnabled ? Math.abs(Math.cos(vm.bobT)) * 0.014 * frac : 0;
    if (!p.onGround) { by -= M.clamp(p.vel.y * 0.01, -0.05, 0.05); }

    vm.kick = M.damp(vm.kick, 0, 0.00004, dt);
    vm.kickYaw = M.damp(vm.kickYaw, 0, 0.0001, dt);
    vm.flash = Math.max(0, vm.flash - dt * 22);

    // base pose, tuned per weapon class so silhouettes differ
    var base = { x: 0.135, y: -0.125, z: -0.50, scale: 0.60 };
    if (w.cls === 'pistol') { base.x = 0.115; base.y = -0.115; base.z = -0.40; base.scale = 0.72; }
    else if (w.cls === 'knife') { base.x = 0.145; base.y = -0.13; base.z = -0.36; base.scale = 0.85; }
    else if (w.cls === 'sniper') { base.x = 0.130; base.y = -0.115; base.z = -0.54; base.scale = 0.55; }
    else if (w.cls === 'shotgun') { base.x = 0.135; base.y = -0.13; base.z = -0.50; base.scale = 0.58; }
    else if (w.cls === 'heavy') { base.x = 0.150; base.y = -0.14; base.z = -0.54; base.scale = 0.55; }
    else if (w.cls === 'grenade') { base.x = 0.155; base.y = -0.165; base.z = -0.38; base.scale = 0.95; }

    var ax = 0, ay = 0, az = 0, apitch = 0, ayaw = 0, aroll = 0;
    var t = vm.animT;
    if (vm.anim === 'deploy') {
      var dT = M.clamp(t / Math.max(0.15, w.deploy || 0.4), 0, 1);
      var e = 1 - Math.pow(1 - dT, 3);
      ay -= (1 - e) * 0.22; az += (1 - e) * 0.12; apitch -= (1 - e) * 0.8;
      if (dT >= 1) vm.anim = null;
    } else if (vm.anim === 'reload') {
      var total = Math.max(0.2, w.reload || 2.2);
      var rT = M.clamp(t / total, 0, 1);
      var dip = Math.sin(rT * Math.PI);
      ay -= dip * 0.12;
      apitch -= dip * 0.5;
      ayaw += Math.sin(rT * Math.PI * 2) * 0.2;
      az += dip * 0.04;
      if (p.reloadTimer <= 0) vm.anim = null;
    } else if (vm.anim === 'inspect') {
      var iT = M.clamp(t / 2.0, 0, 1);
      ayaw += Math.sin(iT * Math.PI * 2) * 1.1;
      apitch += Math.sin(iT * Math.PI) * 0.5;
      ay -= Math.sin(iT * Math.PI) * 0.06;
      if (iT >= 1) vm.anim = null;
    } else if (vm.anim === 'fire') {
      if (t > 0.12) vm.anim = null;
    }

    az += vm.kick * 0.042;
    apitch += vm.kick * 0.12;
    ayaw += vm.kickYaw;

    vm.x = base.x + bx - vm.swayX * 0.32 + ax;
    vm.y = base.y + by - vm.swayY * 0.22 + ay;
    vm.z = base.z + az;
    vm.scale = base.scale;
    vm.yaw = -vm.swayX * 0.45 + ayaw * 0.28;
    vm.pitch = vm.swayY * 0.4 + apitch * 0.22;
    vm.roll = aroll;
    var muzzle = (w.cls === 'sniper' ? 0.88 : w.cls === 'pistol' ? 0.20 : w.cls === 'knife' ? 0.0 : 0.60);
    vm.flashPos = [vm.x, vm.y + 0.03, vm.z - muzzle * base.scale];
    vm.tint = null;
  };

  Game.prototype.crosshairSpread = function () {
    var p = this.localPlayer;
    if (!p || !p.alive) return 0;
    var cone = P.inaccuracy(p);
    // convert the cone angle to pixels at the current FOV
    var h = this.renderer.canvas.clientHeight || 720;
    var hFov = (this.settings.fov || 90) * M.DEG;
    var aspect = (this.renderer.canvas.clientWidth || 1280) / h;
    var vFov = 2 * Math.atan(Math.tan(hFov / 2) / Math.max(0.3, aspect)) / (this.camera.zoom || 1);
    var px = Math.tan(cone) / Math.tan(vFov / 2) * (h / 2);
    return M.clamp(px, 0, 90);
  };

  /* ---------------------------------------------------------------
   * Audio world state
   * ------------------------------------------------------------- */
  Game.prototype.updateAudioWorld = function (dt) {
    var A = this.audio, m = this.match;
    var view = this.spectateTarget || this.localPlayer;
    if (!view || !A.ready) return;
    A.setListener(this.camera.x, this.camera.y, this.camera.z, this.camera.yaw, this.world);

    // flash deafness eases off with the blindness
    var lp = this.localPlayer;
    if (lp && lp.flashAmount > 0.02) A.setMuffle(lp.flashAmount * 0.85);
    else if (A.muffle > 0.02) A.setMuffle(Math.max(0, A.muffle - dt * 0.7));

    // bomb beeps accelerate as the timer runs down
    if (m.bomb && m.bomb.planted && !m.bomb.defused && !m.bomb.exploded) {
      var frac = 1 - M.clamp(m.phaseTime / m.rules.bombTime, 0, 1);
      var interval = M.lerp(1.0, 0.12, frac * frac);
      this.bombBeepT -= dt;
      if (this.bombBeepT <= 0) {
        this.bombBeepT = interval;
        A.bombBeep(m.bomb.x, m.bomb.y, m.bomb.z, frac);
      }
    }
    // fire ambience
    var nearest = null;
    for (var i = 0; i < m.nades.fires.length; i++) {
      var d = M.vdist(view.pos, m.nades.fires[i].pos);
      if (nearest === null || d < nearest) nearest = d;
    }
    A.updateFireLoop(nearest);
  };

  Game.prototype.updateVoiceState = function () {
    var self = this;
    var lp = this.localPlayer;
    var held = !!this.keys[this.settings.keys.voice];
    var talk = this.settings.voiceEnabled && this.voice.enabled &&
               (this.settings.pushToTalk ? held : true) && !this.ui.chatMode;
    this.voice.setTransmitting(talk);

    var m = this.match;
    this.voice.applyRouting(lp ? lp.team : 0, function (peerId) {
      var pid = self.remote[peerId];
      var p = pid && m ? m.byId[pid] : null;
      return p ? p.team : 0;
    });

    var st = this.ui.n.pttstate;
    if (st) {
      if (!this.settings.voiceEnabled) st.textContent = '';
      else if (!this.voice.enabled) st.textContent = 'Mic off';
      else { st.textContent = talk ? 'TRANSMITTING' : ('Hold ' + CS.keyLabel(this.settings.keys.voice)); }
      st.className = talk ? 'on' : '';
    }
    var hud = this.ui.n.voicehud;
    if (!hud || !m) return;
    var speaking = [];
    for (var peerId in this.voice.peers) {
      if (!this.voice.speaking(peerId)) continue;
      var id = this.remote[peerId];
      var sp = id ? m.byId[id] : null;
      if (sp) speaking.push(sp.name);
    }
    var key = (talk ? '1' : '0') + '|' + speaking.join(',');
    if (key === this._voiceHudKey) return;
    this._voiceHudKey = key;
    var html = '<div id="pttstate" class="' + (talk ? 'on' : '') + '">' + (st ? st.textContent : '') + '</div>';
    for (var q = 0; q < speaking.length; q++) {
      html += '<div class="vspeak"><span class="mic"></span>' + speaking[q] + '</div>';
    }
    hud.innerHTML = html;
    this.ui.n.pttstate = doc.getElementById('pttstate');
  };

  /* ---------------------------------------------------------------
   * Screen overlays
   * ------------------------------------------------------------- */
  Game.prototype.updateOverlays = function (dt) {
    var lp = this.localPlayer, ui = this.ui;
    if (!lp) return;

    // flashbang
    var f = lp.flashAmount || 0;
    ui.setOverlay('flash', f);

    // damage vignette decays
    this.hurtFlash = Math.max(0, (this.hurtFlash || 0) - dt * 1.6);
    var dmgNode = ui.n.dmg;
    if (dmgNode) {
      var cur = parseFloat(dmgNode.style.opacity || 0);
      dmgNode.style.opacity = Math.max(0, cur - dt * 1.5);
    }
    // low health vignette
    var low = lp.alive ? M.clamp((38 - lp.health) / 38, 0, 1) : 0;
    ui.setOverlay('lowhp', low * (0.55 + 0.25 * Math.sin(this.match.time * 4)));
    // burning
    var burning = lp.alive && this.match.time - (lp.burnTime || -99) < 0.35;
    ui.setOverlay('burn', burning ? 0.75 : 0);

    // pickup prompt
    this.nearPickup = null;
    if (lp.alive && this.match.droppedWeapons) {
      for (var i = 0; i < this.match.droppedWeapons.length; i++) {
        var d = this.match.droppedWeapons[i];
        if (M.vdist(lp.pos, { x: d.x, y: d.y, z: d.z }) < 1.6) {
          var wd = W.get(d.wid);
          if (wd && ((wd.slot === 1 && !lp.primary) || (wd.slot === 2 && !lp.secondary))) {
            this.nearPickup = wd.name;
            break;
          }
        }
      }
      if (!this.nearPickup && this.match.bomb && this.match.bomb.dropped &&
          lp.team === C.TEAM.ATT &&
          M.vdist(lp.pos, { x: this.match.bomb.x, y: this.match.bomb.y, z: this.match.bomb.z }) < 1.6) {
        this.nearPickup = 'the explosive';
      }
    }
    // fade hit flashes on bodies
    var m = this.match;
    for (var k = 0; k < m.players.length; k++) {
      if (m.players[k].hitFlash) m.players[k].hitFlash = Math.max(0, m.players[k].hitFlash - dt * 2.4);
    }
  };

  /* ---------------------------------------------------------------
   * Boot
   * ------------------------------------------------------------- */
  function start() {
    var game = new CS.Game();
    root.BREACHPOINT = game;
    game.boot();
  }
  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', start);
  else start();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
