    var loadout = p.dmLoadout || (p.team === C.TEAM.ATT ? 'kr47' : 'ar4');
    P.giveWeapon(p, loadout);
    P.giveWeapon(p, p.team === C.TEAM.ATT ? 'raider9' : 'cobra57');
    p.armor = C.MAX_ARMOR; p.helmet = true;
    if (full && this.rules.mode !== 'aim') {
      P.giveWeapon(p, 'he'); P.giveWeapon(p, 'flash'); P.giveWeapon(p, 'smoke');
    }
    P.switchTo(p, 'primary');
  };

  Match.prototype.assignBomb = function () {
    if (!this.map.sites.length) return;
    var att = this.teamPlayers(C.TEAM.ATT, true);
    if (!att.length) return;
    for (var i = 0; i < att.length; i++) att[i].bomb = false;
    var pick = att[(Math.random() * att.length) | 0];
    pick.bomb = true;
    this.bombCarrier = pick;
    this.emit({ t: 'bombAssigned', id: pick.id });
  };

  Match.prototype.isBuyTime = function (p) {
    if (this.rules.infiniteMoney) return true;
    if (this.rules.mode === 'deathmatch' || this.rules.mode === 'aim') return true;
    if (this.phase === PH.WARMUP) return true;
    if (this.phase === PH.FREEZE) return true;
    if (this.phase !== PH.LIVE) return false;
    var elapsed = this.rules.roundTime - this.phaseTime;
    return elapsed <= this.rules.buyTime;
  };

  Match.prototype.endRound = function (winner, reason) {
    if (this.phase === PH.ENDED || this.matchOver) return;
    this.phase = PH.ENDED;
    this.phaseTime = 5.0;
    this.roundWinner = winner;
    this.roundReason = reason;
    if (winner) this.score[winner]++;

    this.awardEconomy(winner, reason);
    var mvp = this.pickMVP(winner, reason);
    if (mvp) { mvp.mvps++; mvp.score += 1; }

    this.emit({
      t: 'roundEnd', winner: winner, reason: reason, round: this.round,
      score: { 1: this.score[1], 2: this.score[2] }, mvp: mvp ? mvp.id : null
    });

    this.stats.rounds.push({
      round: this.round, winner: winner, reason: reason,
      score1: this.score[1], score2: this.score[2]
    });
  };

  Match.prototype.awardEconomy = function (winner, reason) {
    if (this.rules.mode === 'deathmatch' || this.rules.mode === 'aim') return;
    var loser = winner === C.TEAM.ATT ? C.TEAM.DEF : C.TEAM.ATT;
    var E = C.ECON;
    var winAmount = E.winElim;
    if (reason === 'bomb') winAmount = E.winBomb;
    else if (reason === 'defused') winAmount = E.winDefuse;
    else if (reason === 'time') winAmount = E.winTimeCT;

    var i, p;
    var winners = this.teamPlayers(winner);
    for (i = 0; i < winners.length; i++) P.addMoney(winners[i], winAmount, this.rules);

    this.lossStreak[winner] = Math.max(0, this.lossStreak[winner] - 1);
    var streak = Math.min(this.lossStreak[loser], E.lossLadder.length - 1);
    var lossAmount = E.lossLadder[streak];
    if (this.rules.lossBonusFloor) lossAmount = Math.max(lossAmount, this.rules.lossBonusFloor);
    this.lossStreak[loser] = Math.min(E.lossLadder.length - 1, this.lossStreak[loser] + 1);

    var losers = this.teamPlayers(loser);
    for (i = 0; i < losers.length; i++) {
      var extra = 0;
      if (loser === C.TEAM.ATT && this.bomb && this.bomb.planted) extra = E.plantBonusT;
      P.addMoney(losers[i], lossAmount + extra, this.rules);
    }
  };

  Match.prototype.pickMVP = function (winner, reason) {
    if (reason === 'bomb' && this.bomb && this.bomb.planterId && this.byId[this.bomb.planterId]) return this.byId[this.bomb.planterId];
    if (reason === 'defused' && this.bomb && this.bomb.defuserId && this.byId[this.bomb.defuserId]) return this.byId[this.bomb.defuserId];
    var best = null, bestScore = -1;
    var list = this.teamPlayers(winner);
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var s = p.roundKills * 100 + p.roundDamage;
      if (s > bestScore) { bestScore = s; best = p; }
    }
    return bestScore > 0 ? best : null;
  };

  Match.prototype.checkRoundEnd = function () {
    if (this.phase !== PH.LIVE) return;
    if (this.rules.mode === 'deathmatch' || this.rules.mode === 'aim') return;

    var attAlive = this.teamPlayers(C.TEAM.ATT, true).length;
    var defAlive = this.teamPlayers(C.TEAM.DEF, true).length;
    var planted = this.bomb && this.bomb.planted;

    if (!planted && attAlive === 0 && this.teamCount(C.TEAM.ATT) > 0) { this.endRound(C.TEAM.DEF, 'elimination'); return; }
    if (defAlive === 0 && this.teamCount(C.TEAM.DEF) > 0) { this.endRound(C.TEAM.ATT, 'elimination'); return; }
    if (planted && defAlive === 0) { this.endRound(C.TEAM.ATT, 'elimination'); return; }

    if (this.phaseTime <= 0 && !planted) { this.endRound(C.TEAM.DEF, 'time'); return; }
  };

  Match.prototype.advancePhase = function () {
    var r = this.rules;
    switch (this.phase) {
      case PH.WARMUP:
        if (r.mode === 'deathmatch' || r.mode === 'aim') {
          this.phase = PH.LIVE; this.phaseTime = r.roundTime;
          this.round = 1;
          if (r.mode === 'aim') this.initAimMode();
          this.emit({ t: 'roundStart', round: 1, score: this.score });
        } else this.beginRound();
        break;
      case PH.FREEZE:
        this.phase = PH.LIVE;
        this.phaseTime = r.roundTime;
        this.emit({ t: 'roundLive', round: this.round });
        break;
      case PH.LIVE:
        if (r.mode === 'deathmatch' || r.mode === 'aim') this.endMatchByScore();
        else this.checkRoundEnd();
        break;
      case PH.ENDED:
        if (this.checkMatchEnd()) break;
        if (this.needsHalftime()) { this.doHalftime(); break; }
        this.beginRound();
        break;
      case PH.HALFTIME:
        this.beginRound();
        break;
    }
  };

  Match.prototype.needsHalftime = function () {
    var r = this.rules;
    if (!r.halftimeAt || this.sideSwapped) return false;
    return (this.score[1] + this.score[2]) >= r.halftimeAt;
  };

  Match.prototype.doHalftime = function () {
    this.sideSwapped = true;
    this.phase = PH.HALFTIME;
    this.phaseTime = 10;
    var tmp = this.score[1]; this.score[1] = this.score[2]; this.score[2] = tmp;
    var ls = this.lossStreak[1]; this.lossStreak[1] = this.lossStreak[2]; this.lossStreak[2] = ls;
    for (var i = 0; i < this.players.length; i++) {
      var p = this.players[i];
      if (p.team === C.TEAM.ATT) p.team = C.TEAM.DEF;
      else if (p.team === C.TEAM.DEF) p.team = C.TEAM.ATT;
      P.clearInventory(p);
      p.money = this.rules.startMoney;
    }
    this.emit({ t: 'halftime', score: { 1: this.score[1], 2: this.score[2] } });
  };

  Match.prototype.checkMatchEnd = function () {
    var r = this.rules;
    if (r.mode === 'deathmatch' || r.mode === 'aim') return false;
    var need = r.winRounds;
    if (this.overtimeRound > 0) {
      // regulation is a draw at maxRounds/2 each; every OT adds otMaxRounds/2 + 1
      need = Math.floor(r.maxRounds / 2) + (Math.floor(r.otMaxRounds / 2) + 1) * this.overtimeRound;
    }
    if (this.score[1] >= need || this.score[2] >= need) {
      this.finishMatch(this.score[1] > this.score[2] ? C.TEAM.ATT : C.TEAM.DEF);
      return true;
    }
    var played = this.score[1] + this.score[2];
    var maxPlayed = r.maxRounds + this.overtimeRound * r.otMaxRounds;
    if (played >= maxPlayed) {
      if (this.score[1] === this.score[2]) {
        if (r.overtime) { this.startOvertime(); return true; }
        this.finishMatch(0); return true;
      }
      this.finishMatch(this.score[1] > this.score[2] ? C.TEAM.ATT : C.TEAM.DEF);
      return true;
    }
    return false;
  };

  Match.prototype.startOvertime = function () {
    this.overtimeRound++;
    this.sideSwapped = false;
    this.phase = PH.HALFTIME;
    this.phaseTime = 10;
    for (var i = 0; i < this.players.length; i++) {
      var p = this.players[i];
      if (p.team === C.TEAM.ATT) p.team = C.TEAM.DEF;
      else if (p.team === C.TEAM.DEF) p.team = C.TEAM.ATT;
      P.clearInventory(p);
      p.money = this.rules.otStartMoney;
    }
    var tmp = this.score[1]; this.score[1] = this.score[2]; this.score[2] = tmp;
    this.lossStreak[1] = this.lossStreak[2] = 0;
    this.rules.halftimeAt = 0;
    this.emit({ t: 'overtime', n: this.overtimeRound, score: { 1: this.score[1], 2: this.score[2] } });
  };

  Match.prototype.endMatchByScore = function () {
    var w = this.dmScore[1] === this.dmScore[2] ? 0 : (this.dmScore[1] > this.dmScore[2] ? C.TEAM.ATT : C.TEAM.DEF);
    this.finishMatch(w);
  };

  Match.prototype.finishMatch = function (winner) {
    this.matchOver = true;
    this.phase = PH.MATCH_END;
    this.phaseTime = 30;
    this.matchResult = { winner: winner, score: { 1: this.score[1], 2: this.score[2] } };
    this.emit({ t: 'matchEnd', winner: winner, score: { 1: this.score[1], 2: this.score[2] } });
  };

  /* ---------------------------------------------------------------
   * Bomb
   * ------------------------------------------------------------- */
  Match.prototype.dropBomb = function (p) {
    if (!p || !p.bomb) return;
    p.bomb = false;
    this.bombCarrier = null;
    var y = this.world.dropToFloor(p.pos.x, p.pos.y + 0.5, p.pos.z, 6) || p.pos.y;
    this.bomb = this.bomb || {};
    this.bomb.dropped = true;
    this.bomb.x = p.pos.x; this.bomb.y = y + 0.08; this.bomb.z = p.pos.z;
    this.emit({ t: 'bombDropped', x: this.bomb.x, y: this.bomb.y, z: this.bomb.z });
  };

  Match.prototype.pickupBomb = function (p) {
    if (p.team !== C.TEAM.ATT || !this.bomb || !this.bomb.dropped || this.bomb.planted) return false;
    var d = M.vdist(p.pos, { x: this.bomb.x, y: this.bomb.y, z: this.bomb.z });
    if (d > 1.5) return false;
    this.bomb.dropped = false;
    p.bomb = true;
    this.bombCarrier = p;
    this.emit({ t: 'bombPickup', id: p.id });
    return true;
  };

  Match.prototype.updatePlant = function (p, cmd, dt) {
    if (!p.bomb || !p.alive || this.phase !== PH.LIVE) { p.planting = 0; return; }
    if (this.bomb && this.bomb.planted) { p.planting = 0; return; }
    var canPlant = cmd.use && p.onGround && P.speed2D(p) < 0.9 &&
                   this.world.siteAt(p.pos.x, p.pos.y + 0.1, p.pos.z);
    if (!canPlant) {
      if (p.planting > 0) this.emit({ t: 'plantAbort', id: p.id });
      p.planting = 0;
      return;
    }
    if (p.planting === 0) this.emit({ t: 'plantStart', id: p.id, x: p.pos.x, y: p.pos.y, z: p.pos.z });
    p.planting += dt;
    if (p.planting >= this.rules.plantTime) {
      var site = this.world.siteAt(p.pos.x, p.pos.y + 0.1, p.pos.z);
      p.planting = 0; p.bomb = false;
      this.bombCarrier = null;
      this.bomb = {
        planted: true, dropped: false,
        x: p.pos.x, y: this.world.dropToFloor(p.pos.x, p.pos.y + 0.5, p.pos.z, 3) + 0.05, z: p.pos.z,
        plantTime: this.time, site: site ? site.name : '?',
        planterId: p.id, defusing: 0, defuserId: null, beepTimer: 0
      };
      this.phaseTime = this.rules.bombTime;
      P.addMoney(p, C.ECON.plantReward, this.rules);
      p.score += 2;
      this.emit({ t: 'bombPlanted', id: p.id, site: this.bomb.site, x: this.bomb.x, y: this.bomb.y, z: this.bomb.z });
      for (var bi = 0; bi < this.players.length; bi++) {
        var b = this.players[bi];
        if (b.ai) { b.ai.alertUntil = 0; b.ai.path = null; b.ai.pathGoal = null; b.ai.holdSpot = null; }
      }
    }
  };

  Match.prototype.updateDefuse = function (p, cmd, dt) {
    var b = this.bomb;
    if (!b || !b.planted || p.team !== C.TEAM.DEF || !p.alive) { p.defusing = 0; return; }
    var d = M.vdistXZ(p.pos, { x: b.x, z: b.z });
    var dy = Math.abs(p.pos.y - b.y);
    var can = cmd.use && d < 1.5 && dy < 1.6 && p.onGround && P.speed2D(p) < 0.9;
    if (!can) {
      if (p.defusing > 0) { this.emit({ t: 'defuseAbort', id: p.id }); b.defusing = 0; b.defuserId = null; }
      p.defusing = 0;
      return;
    }
    if (p.defusing === 0) this.emit({ t: 'defuseStart', id: p.id, kit: p.kit });
    p.defusing += dt;
    b.defusing = p.defusing;
    b.defuserId = p.id;
    var need = p.kit ? this.rules.defuseTimeKit : this.rules.defuseTime;
    b.defuseNeed = need;
    if (p.defusing >= need) {
      p.defusing = 0;
      b.defused = true;
      P.addMoney(p, C.ECON.defuseReward, this.rules);
      p.score += 2;
      this.emit({ t: 'bombDefused', id: p.id });
      this.endRound(C.TEAM.DEF, 'defused');
    }
  };

  Match.prototype.explodeBomb = function () {
    var b = this.bomb;
    b.exploded = true;
    this.emit({ t: 'bombExploded', x: b.x, y: b.y, z: b.z });
    for (var i = 0; i < this.players.length; i++) {
      var p = this.players[i];
      if (!p.alive) continue;
      var dist = M.vdist(p.pos, { x: b.x, y: b.y, z: b.z });
      var radius = 25;
      if (dist > radius) continue;
      var dmg = 500 * Math.pow(1 - dist / radius, 1.6);
      if (dmg <= 0) continue;
      P.applyDamage(p, dmg, 0, null, C.HITGROUP.CHEST, this.time);
      if (!p.alive) this.onDeath(p, null, W.get('he'), C.HITGROUP.CHEST, false, false);
    }
    this.endRound(C.TEAM.ATT, 'bomb');
  };

  /* ---------------------------------------------------------------
   * Damage & death
   * ------------------------------------------------------------- */
  Match.prototype.dealDamage = function (victim, attacker, weapon, healthDmg, armorDmg, hitgroup, penetrated) {
    if (!victim.alive) return;
    if (victim.spawnProtect > 0) return;
    var friendly = attacker && attacker !== victim && attacker.team === victim.team;
    if (friendly) {
      if (!this.rules.friendlyFire) return;
      healthDmg *= this.rules.friendlyFireScale;
      armorDmg *= this.rules.friendlyFireScale;
    }
    var applied = P.applyDamage(victim, healthDmg, armorDmg, attacker ? attacker.id : null, hitgroup, this.time);
    if (attacker && attacker !== victim && !friendly) {
      attacker.damage += applied; attacker.roundDamage += applied;
    }
    this.emit({
      t: 'hurt', v: victim.id, a: attacker ? attacker.id : null,
      dmg: Math.round(applied), group: hitgroup, hp: Math.round(victim.health),
      armor: Math.round(victim.armor), pen: !!penetrated, wid: weapon ? weapon.id : null,
      x: victim.pos.x, y: victim.pos.y + victim.height * 0.6, z: victim.pos.z
    });
    if (!victim.alive) {
      this.onDeath(victim, attacker, weapon, hitgroup, hitgroup === C.HITGROUP.HEAD, penetrated);
    }
  };

  Match.prototype.onDeath = function (victim, attacker, weapon, hitgroup, headshot, penetrated) {
    victim.alive = false;
    victim.deaths++;
    victim.killStreak = 0;
    victim.deathTime = this.time;
    victim.deathPos = { x: victim.pos.x, y: victim.pos.y, z: victim.pos.z };
    victim.deathYaw = victim.yaw;
    victim.deathDir = attacker ? Math.atan2(-(victim.pos.z - attacker.pos.z), victim.pos.x - attacker.pos.x) : victim.yaw;

    // assist: anyone who did >= 40 damage and is not the killer
    var assistId = null, bestAssist = 0;
    for (var k in victim.hurtBy) {
      if (attacker && k === attacker.id) continue;
      if (victim.hurtBy[k] >= 40 && victim.hurtBy[k] > bestAssist) { bestAssist = victim.hurtBy[k]; assistId = k; }
    }
    if (assistId && this.byId[assistId]) { this.byId[assistId].assists++; this.byId[assistId].score += 1; }

    if (attacker && attacker !== victim) {
      var friendly = attacker.team === victim.team;
      if (friendly) {
        attacker.kills--; attacker.score -= 2;
        P.addMoney(attacker, -300, this.rules);
      } else {
        attacker.kills++; attacker.roundKills++; attacker.killStreak++;
        attacker.score += 2;
        if (headshot) attacker.headshots++;
        var award = (weapon && weapon.killAward) || 300;
        P.addMoney(attacker, award, this.rules);
        if (this.rules.mode === 'deathmatch') this.dmScore[attacker.team]++;
      }
    }

    // drop what they were carrying
    if (this.rules.mode !== 'deathmatch' && this.rules.mode !== 'aim') {
      this.dropInventory(victim);
    }
    if (victim.bomb) this.dropBomb(victim);

    this.emit({
      t: 'kill', a: attacker ? attacker.id : null, v: victim.id,
      wid: weapon ? weapon.id : null, hs: !!headshot, pen: !!penetrated,
      assist: assistId, x: victim.pos.x, y: victim.pos.y, z: victim.pos.z,
      dir: victim.deathDir, streak: attacker ? attacker.killStreak : 0,
      noscope: attacker ? (weapon && weapon.scope && !attacker.scoped) : false,
      thruSmoke: attacker ? G.smokeBlocks(this.nades, attacker.pos.x, attacker.pos.y + attacker.eye, attacker.pos.z, victim.pos.x, victim.pos.y + victim.eye, victim.pos.z) : false
    });

    // a dead teammate is a callout: the rest of the team rotates to the fight
    for (var bi = 0; bi < this.players.length; bi++) {
      var b = this.players[bi];
      if (!b.ai || !b.alive) continue;
      if (b.team === victim.team) CS.Bots.alert(b, victim.pos.x, victim.pos.y, victim.pos.z, this.time, 7.0);
      else if (attacker && b.team === attacker.team && b !== attacker) {
        CS.Bots.alert(b, victim.pos.x, victim.pos.y, victim.pos.z, this.time, 3.0);
      }
    }

    victim.respawnAt = this.time + (this.rules.respawnDelay || 2.5);
    this.checkRoundEnd();
  };

  Match.prototype.dropInventory = function (p) {
    var item = p.primary || p.secondary;
    if (!item) return;
    var w = W.get(item.id);
    if (!w) return;
    this.droppedWeapons.push({
      id: this.nextDropId++, wid: item.id, mag: item.mag, reserve: item.reserve,
      x: p.pos.x, y: this.world.dropToFloor(p.pos.x, p.pos.y + 0.6, p.pos.z, 4) + 0.1, z: p.pos.z,
      yaw: p.yaw, born: this.time
    });
    if (p.primary) p.primary = null; else p.secondary = null;
  };

  Match.prototype.killPlayer = function (p, attacker, weapon, reason) {
    if (!p.alive) return;
    p.health = 0; p.alive = false;
    this.onDeath(p, attacker, weapon, C.HITGROUP.CHEST, false, false);
  };

  /* ---------------------------------------------------------------
   * Lag compensation: rewind every hitbox to where the shooter saw it
   * ------------------------------------------------------------- */
  Match.prototype.recordHistory = function () {
    var frame = { time: this.time, pos: {} };
    for (var i = 0; i < this.players.length; i++) {
      var p = this.players[i];
      frame.pos[p.id] = { x: p.pos.x, y: p.pos.y, z: p.pos.z, h: p.height, alive: p.alive };
    }
    this.history.push(frame);
    while (this.history.length && this.time - this.history[0].time > C.HISTORY_SECONDS) this.history.shift();
  };

  Match.prototype.rewind = function (targetTime, exceptId) {
    if (!this.history.length) return null;
    targetTime = M.clamp(targetTime, this.time - C.LAGCOMP_MAX, this.time);
    var a = null, b = null;
    for (var i = this.history.length - 1; i >= 0; i--) {
      if (this.history[i].time <= targetTime) { a = this.history[i]; b = this.history[i + 1] || a; break; }
    }
    if (!a) { a = this.history[0]; b = this.history[0]; }
    var t = (b.time - a.time) > 1e-5 ? (targetTime - a.time) / (b.time - a.time) : 0;
    var saved = [];
    for (var k = 0; k < this.players.length; k++) {
      var p = this.players[k];
      if (p.id === exceptId) continue;
      var pa = a.pos[p.id], pb = b.pos[p.id] || pa;
      if (!pa) continue;
      saved.push({ p: p, x: p.pos.x, y: p.pos.y, z: p.pos.z, h: p.height });
      p.pos.x = pa.x + (pb.x - pa.x) * t;
      p.pos.y = pa.y + (pb.y - pa.y) * t;
      p.pos.z = pa.z + (pb.z - pa.z) * t;
      p.height = pa.h + (pb.h - pa.h) * t;
    }
    return saved;
  };

  Match.prototype.restore = function (saved) {
    if (!saved) return;
    for (var i = 0; i < saved.length; i++) {
      var s = saved[i];
      s.p.pos.x = s.x; s.p.pos.y = s.y; s.p.pos.z = s.z; s.p.height = s.h;
    }
  };

  /* ---------------------------------------------------------------
   * Firing
   * ------------------------------------------------------------- */
  var _dir = { x: 0, y: 0, z: 0 }, _fwd = { x: 0, y: 0, z: 0 }, _eye = { x: 0, y: 0, z: 0 };

  Match.prototype.resolveShot = function (shooter, shot, lagTime) {
    var w = shot.weapon;
    P.eyePos(shooter, _eye);

    if (shot.melee) { this.resolveMelee(shooter, shot); return; }
    if (shot.dryFire) { this.emit({ t: 'dry', id: shooter.id }); return; }

    M.angleVectors(shot.yaw, shot.pitch, _fwd);
    var saved = (lagTime !== undefined && !shooter.bot) ? this.rewind(lagTime, shooter.id) : null;

    var impacts = [];
    var hitAny = false, hitGroups = [];
    var maxDist = 140;
    if (this.aimStats) this.aimStats.shots += shot.pellets;

    for (var pel = 0; pel < shot.pellets; pel++) {
      W.spreadDir(_dir, _fwd, shot.cone, shot.seed, pel);
      if (this.targets.length && this.hitTarget(_eye, _dir, shooter)) { hitAny = true; continue; }
      var r = this.world.traceBullet(_eye.x, _eye.y, _eye.z, _dir.x, _dir.y, _dir.z,
                                     maxDist, w, this.players, shooter.id);
      for (var i = 0; i < r.impacts.length; i++) {
        if (!r.impacts[i].exit) impacts.push(r.impacts[i]);
      }
      for (var h = 0; h < r.hits.length; h++) {
        var hit = r.hits[h];
        var victim = hit.player;
        if (!victim.alive) continue;
        if (victim.team === shooter.team && !this.rules.friendlyFire) continue;
        var dmg = W.resolveDamage(w, hit.dist, hit.group, victim.armor, victim.helmet, hit.power);
        this.dealDamage(victim, shooter, w, dmg.health, dmg.armor, hit.group, hit.power < 0.99);
        hitAny = true;
        hitGroups.push(hit.group);
      }
      if (pel === 0) {
        shot.endX = r.end.x; shot.endY = r.end.y; shot.endZ = r.end.z;
      }
    }
    this.restore(saved);

    this.alertBots(shooter, _eye.x, _eye.y, _eye.z, w.silenced ? 16 : 42, 3.5);

    this.emit({
      t: 'shot', id: shooter.id, wid: w.id,
      ox: _eye.x, oy: _eye.y, oz: _eye.z,
      dx: _fwd.x, dy: _fwd.y, dz: _fwd.z,
      ex: shot.endX, ey: shot.endY, ez: shot.endZ,
      cone: shot.cone, seed: shot.seed, pellets: shot.pellets,
      silenced: !!w.silenced, hit: hitAny, impacts: impacts,
      groups: hitGroups
    });
  };

  /* Pop-up targets for the training range. */
  Match.prototype.hitTarget = function (eye, dir, shooter) {
    var best = null, bestT = 140;
    for (var i = 0; i < this.targets.length; i++) {
      var t = this.targets[i];
      if (!t.alive) continue;
      var h = this.world.rayPlayer(eye.x, eye.y, eye.z, dir.x, dir.y, dir.z, bestT,
                                   t.x, t.y, t.z, t.height);
      if (h) { bestT = h.t; best = { t: t, group: h.group }; }
    }
    if (!best) return false;
    var wall = this.world.rayWorld(eye.x, eye.y, eye.z, dir.x, dir.y, dir.z, bestT);
    if (wall) return false;
    var head = best.group === C.HITGROUP.HEAD;
    best.t.hp -= head ? 100 : 34;
    if (this.aimStats) {
      this.aimStats.hits++;
      var react = this.time - best.t.born;
      this.aimStats.reactSum += react; this.aimStats.reactN++;
    }
    this.emit({
      t: 'hurt', v: 'target' + best.t.id, a: shooter.id, dmg: head ? 100 : 34,
      group: best.group, hp: Math.max(0, best.t.hp), armor: 0, target: true,
      x: best.t.x, y: best.t.y + best.t.height * 0.6, z: best.t.z
    });
    if (best.t.hp <= 0) {
      best.t.alive = false;
      if (this.aimStats) this.aimStats.kills++;
      shooter.kills++;
      this.emit({ t: 'targetDown', x: best.t.x, y: best.t.y, z: best.t.z, head: head });
    }
    return true;
  };

  Match.prototype.resolveMelee = function (shooter, shot) {
    var w = shot.weapon;
    P.eyePos(shooter, _eye);
    var aim = P.aimAngles(shooter);
    M.angleVectors(aim.yaw, aim.pitch, _fwd);
    var range = w.range || 1.35;
    var best = null, bestT = range;
    for (var i = 0; i < this.players.length; i++) {
      var v = this.players[i];
      if (!v.alive || v === shooter) continue;
      if (v.team === shooter.team && !this.rules.friendlyFire) continue;
      var ph = this.world.rayPlayer(_eye.x, _eye.y, _eye.z, _fwd.x, _fwd.y, _fwd.z, range,
                                    v.pos.x, v.pos.y, v.pos.z, v.height);
      if (ph && ph.t < bestT) { bestT = ph.t; best = { v: v, group: ph.group }; }
    }
    var wallHit = this.world.rayWorld(_eye.x, _eye.y, _eye.z, _fwd.x, _fwd.y, _fwd.z, range);
    if (wallHit && (!best || wallHit.t < bestT)) best = null;

    this.emit({ t: 'melee', id: shooter.id, secondary: shot.secondary, hit: !!best,
                x: _eye.x + _fwd.x * bestT, y: _eye.y + _fwd.y * bestT, z: _eye.z + _fwd.z * bestT });
    if (!best) return;

    var v = best.v;
    // behind the victim = backstab
    var toV = { x: v.pos.x - shooter.pos.x, y: 0, z: v.pos.z - shooter.pos.z };
    M.vnorm(toV, toV);
    var vf = M.angleVectors(v.yaw, 0);
    var behind = (vf.x * toV.x + vf.z * toV.z) > 0.45;
    var base = shot.secondary ? (behind ? w.secondaryBackstab : w.secondaryDmg) : (behind ? w.backstab : w.dmg);
    var dmg = W.resolveDamage({ dmg: base, rangeMod: 1, armorPen: w.armorPen, pellets: 1 }, 0, best.group, v.armor, v.helmet, 1);
    this.dealDamage(v, shooter, w, dmg.health, dmg.armor, best.group, false);
  };

  /* ---------------------------------------------------------------
   * Per-player command processing
   * ------------------------------------------------------------- */
  Match.prototype.applyCommand = function (p, cmd, dt) {
    if (!cmd) cmd = { forward: 0, side: 0, yaw: p.yaw, pitch: p.pitch };
    var frozen = (this.phase === PH.FREEZE || this.phase === PH.ENDED || this.phase === PH.HALFTIME ||
                  this.phase === PH.MATCH_END);

    if (!p.alive) { p.planting = 0; p.defusing = 0; return; }

    P.move(p, cmd, this.world, dt, frozen);
    P.updateWeapon(p, dt);

    if (p.pendingFallDamage) {
      this.dealDamage(p, null, null, p.pendingFallDamage, 0, C.HITGROUP.LEG, false);
      this.emit({ t: 'land', id: p.id, hard: true, x: p.pos.x, y: p.pos.y, z: p.pos.z });
      p.pendingFallDamage = 0;
      if (!p.alive) return;
    }
    if (p.justJumped) { this.emit({ t: 'jump', id: p.id, x: p.pos.x, y: p.pos.y, z: p.pos.z }); p.justJumped = false; }

    // footsteps
    var interval = P.footstepInterval(p);
    if (p.stepDist >= interval) {
      p.stepDist = 0;
      var vol = P.footstepVolume(p);
      if (vol > 0.02) {
        var below = this.world.rayWorld(p.pos.x, p.pos.y + 0.2, p.pos.z, 0, -1, 0, 1.0);
        var surf = below ? (below.box.mat || 'concrete') : 'concrete';
        p.lastSurface = surf;
        this.emit({ t: 'step', id: p.id, x: p.pos.x, y: p.pos.y, z: p.pos.z, surf: surf, vol: vol });
      }
    }

    if (frozen) { p.triggerHeld = !!cmd.attack; return; }

    // weapon selection
    if (cmd.slot && cmd.slot !== p.lastSlotCmd) { P.switchSlotNumber(p, cmd.slot); }
    p.lastSlotCmd = cmd.slot;
    if (cmd.wheel) { P.nextWeapon(p, cmd.wheel > 0 ? 1 : -1); }
    if (cmd.lastWeapon && !p.lastWeaponHeld) { P.switchTo(p, p.lastSlot); }
    p.lastWeaponHeld = !!cmd.lastWeapon;

    if (cmd.reload && !p.reloadHeld) P.startReload(p);
    p.reloadHeld = !!cmd.reload;
    if (P.needsReload(p) && !p.reloadTimer && cmd.attack) P.startReload(p);

    if (cmd.drop && !p.dropHeld) {
      var dropped = P.dropCurrent(p);
      if (dropped && dropped.id !== 'bomb') {
        this.droppedWeapons.push({
          id: this.nextDropId++, wid: dropped.id, mag: dropped.mag, reserve: dropped.reserve,
          x: p.pos.x, y: p.pos.y + 0.9, z: p.pos.z, yaw: p.yaw, born: this.time,
          vx: Math.cos(p.yaw) * 3.2, vy: 1.2, vz: -Math.sin(p.yaw) * 3.2
        });
        this.emit({ t: 'drop', id: p.id, wid: dropped.id });
      } else if (dropped && dropped.id === 'bomb') {
        this.dropBomb(p);
      }
    }
    p.dropHeld = !!cmd.drop;

    if (cmd.inspect && !p.inspectHeld && P.canAct(p)) { p.inspectTimer = 2.0; this.emit({ t: 'inspect', id: p.id }); }
    p.inspectHeld = !!cmd.inspect;

    // scope
    var wdef = P.curWeapon(p);
    if (cmd.attack2 && !p.attack2Held) {
      if (wdef.scope) P.toggleScope(p);
    }

    // use: plant / defuse / pick up
    if (cmd.use) {
      this.pickupBomb(p);
      this.tryPickupWeapon(p);
    }
    this.updatePlant(p, cmd, dt);
    this.updateDefuse(p, cmd, dt);

    // throwing grenades
    var isNade = p.cur.indexOf('nade:') === 0;
    if (isNade) {
      var slot = P.curSlot(p);
      if ((cmd.attack || cmd.attack2) && p.deployTimer <= 0) {
        p.nadeCharge = (p.nadeCharge || 0) + dt;
        p.nadeMode = cmd.attack2 ? (cmd.attack ? 0.32 : 0.58) : 1.0;
      } else if (p.nadeCharge > 0) {
        var power = p.nadeMode || 1.0;
        var aim2 = P.aimAngles(p);
        var dirv = M.angleVectors(aim2.yaw, aim2.pitch);
        P.eyePos(p, _eye);
        G.throwGrenade(this.nades, p, slot.id, _eye, dirv, power, this.time);
        this.emit({ t: 'throw', id: p.id, wid: slot.id, power: power });
        slot.count--;
        p.nadeCharge = 0;
        if (slot.count <= 0) {
          for (var gi = 0; gi < p.grenades.length; gi++) if (p.grenades[gi] === slot) { p.grenades.splice(gi, 1); break; }
          var list = P.slotList(p);
          P.switchTo(p, list[0] || 'knife');
        } else {
          p.deployTimer = 0.55;
        }
      }
    } else if (wdef.cls !== 'bomb') {
      // firing
      if (cmd.attack) {
        var shot = P.tryFire(p, false);
        if (shot) this.resolveShot(p, shot, cmd.lagTime);
      } else {
        P.releaseTrigger(p);
      }
      if (cmd.attack2 && !wdef.scope && wdef.cls === 'knife') {
        var shot2 = P.tryFire(p, true);
        if (shot2) this.resolveShot(p, shot2, cmd.lagTime);
      }
      if (cmd.attack2 && wdef.burst && !p.attack2Held) p.burstLeft = wdef.burst;
      if (p.burstLeft > 0 && wdef.burst) {
        var shot3 = P.tryFire(p, true);
        if (shot3 && !shot3.dryFire) { p.burstLeft--; this.resolveShot(p, shot3, cmd.lagTime); }
        else if (shot3) p.burstLeft = 0;
      }
    }
    p.attack2Held = !!cmd.attack2;
    p.useHeld = !!cmd.use;
  };

  /* Noise propagation to bot ears. Gunfire carries; suppressed fire does not. */
  Match.prototype.alertBots = function (source, x, y, z, radius, weight) {
    for (var i = 0; i < this.players.length; i++) {
      var b = this.players[i];
      if (!b.ai || !b.alive || b === source) continue;
      if (b.team === source.team) continue;
      if (M.vdist(b.pos, { x: x, y: y, z: z }) > radius) continue;
      CS.Bots.alert(b, x, y, z, this.time, weight);
    }
  };

  Match.prototype.tryPickupWeapon = function (p) {
    for (var i = 0; i < this.droppedWeapons.length; i++) {
      var d = this.droppedWeapons[i];
      var dist = M.vdist(p.pos, { x: d.x, y: d.y, z: d.z });
      if (dist > 1.6) continue;
      if (P.pickup(p, { id: d.wid, mag: d.mag, reserve: d.reserve })) {
        this.droppedWeapons.splice(i, 1);
        this.emit({ t: 'pickup', id: p.id, wid: d.wid });
        return true;
      }
    }
    return false;
  };

  /* ---------------------------------------------------------------
   * Aim training
   * ------------------------------------------------------------- */
  Match.prototype.initAimMode = function () {
    this.aimStats = { shots: 0, hits: 0, kills: 0, startTime: this.time, reactSum: 0, reactN: 0, best: 0 };
    this.targets = [];
    for (var i = 0; i < 5; i++) this.spawnTarget();
  };

  /* Targets only spawn where a shooter can actually see them — no pop-ups
   * hidden behind a crate, which would just feel unfair. */
  Match.prototype.spawnTarget = function () {
    var shooters = this.players.filter(function (p) { return p.alive; });
    var from = shooters.length ? shooters[(Math.random() * shooters.length) | 0] : null;
    var eye = from ? { x: from.pos.x, y: from.pos.y + from.eye, z: from.pos.z } : { x: 0, y: 1.6, z: 0 };
    var best = null;
    for (var attempt = 0; attempt < 24; attempt++) {
      var a = Math.random() * Math.PI * 2, r = 7 + Math.random() * 13;
      var x = M.clamp(eye.x + Math.cos(a) * r, -20, 20);
      var z = M.clamp(eye.z + Math.sin(a) * r, -20, 20);
      var y = this.world.dropToFloor(x, 9, z, 14);
      if (!this.world.standClear(x, y, z, C.PLAYER_RADIUS, C.STAND_HEIGHT)) continue;
      if (!this.world.losWorld(eye.x, eye.y, eye.z, x, y + 1.25, z)) continue;
      best = { x: x, y: y, z: z };
      break;
    }
    if (!best) {
      var w = this.world.randomWalkable();
      best = { x: w.x, y: w.y, z: w.z };
    }
    this.targets.push({
      id: this.nextDropId++, x: best.x, y: best.y, z: best.z, height: 1.83,
      born: this.time, alive: true, hp: 100, bob: Math.random() * 6.28
    });
  };

  Match.prototype.updateAim = function (dt) {
    for (var i = this.targets.length - 1; i >= 0; i--) {
      var t = this.targets[i];
      if (!t.alive) { this.targets.splice(i, 1); this.spawnTarget(); continue; }
      if (this.time - t.born > 6.5) { this.targets.splice(i, 1); this.spawnTarget(); }
    }
    while (this.targets.length < 5) this.spawnTarget();
  };

  /* ---------------------------------------------------------------
   * Main tick
   * ------------------------------------------------------------- */
  Match.prototype.tick = function (dt, commands) {
    this.time += dt;
    var i, p;

    if (this.phaseTime > 0) this.phaseTime -= dt;

    this.recordHistory();

    for (i = 0; i < this.players.length; i++) {
      p = this.players[i];
      if (p.team !== C.TEAM.ATT && p.team !== C.TEAM.DEF) continue;
      if (!p.alive) {
        if ((this.rules.respawn || this.rules.mode === 'aim' || this.phase === PH.WARMUP) &&
            p.respawnAt && this.time >= p.respawnAt && this.phase === PH.LIVE) {
          this.respawnPlayer(p);
        }
        continue;
      }
      var cmd = p.bot ? CS.Bots.think(p, this, dt, this.time) : (commands ? commands[p.id] : null);
      this.applyCommand(p, cmd, dt);
    }

    // grenades
    var gev = [];
    G.update(this.nades, this.world, dt, this.time, this.players, gev);
    for (i = 0; i < gev.length; i++) this.handleGrenadeEvent(gev[i]);

    // burning
    for (i = 0; i < this.players.length; i++) {
      p = this.players[i];
      if (!p.alive) continue;
      var fire = G.fireDamage(this.nades, p, dt);
      if (fire) {
        var src = this.byId[fire.owner] || null;
        this.dealDamage(p, src, W.get('molotov'), fire.dmg, 0, C.HITGROUP.LEG, false);
        p.burnTime = this.time;
      }
    }

    // dropped weapons fall to the ground
    for (i = 0; i < this.droppedWeapons.length; i++) {
      var d = this.droppedWeapons[i];
      if (d.vy !== undefined) {
        d.vy -= C.GRAVITY * dt;
        d.x += (d.vx || 0) * dt; d.y += d.vy * dt; d.z += (d.vz || 0) * dt;
        var floor = this.world.dropToFloor(d.x, d.y + 0.4, d.z, 3);
        if (d.y <= floor + 0.08) { d.y = floor + 0.08; delete d.vy; d.vx = d.vz = 0; }
      }
    }

    if (this.rules.mode === 'aim') this.updateAim(dt);

    // bomb timer
    if (this.bomb && this.bomb.planted && !this.bomb.defused && !this.bomb.exploded) {
      if (this.phaseTime <= 0) this.explodeBomb();
    }

    if (this.phaseTime <= 0) {
      this.phaseTime = 0;
      this.advancePhase();
    } else {
      this.checkRoundEnd();
    }
  };

  Match.prototype.respawnPlayer = function (p) {
    var list = this.map.dmSpawns || this.map.spawns[p.team];
    var spot = null, bestScore = -1;
    // pick the spawn furthest from any living enemy
    for (var i = 0; i < list.length; i++) {
      var s = list[i], worst = 1e9;
      for (var k = 0; k < this.players.length; k++) {
        var o = this.players[k];
        if (!o.alive || o.team === p.team) continue;
        worst = Math.min(worst, M.vdist(s, o.pos));
      }
      if (worst > bestScore) { bestScore = worst; spot = s; }
    }
    P.spawn(p, spot || list[0], false);
    this.giveDefaultLoadout(p, true);
    p.spawnProtect = 1.2;
    p.respawnAt = 0;
    this.emit({ t: 'spawn', id: p.id, x: p.pos.x, y: p.pos.y, z: p.pos.z });
  };

  Match.prototype.handleGrenadeEvent = function (ev) {
    var i, p;
    if (ev.t === 'he') {
      for (i = 0; i < this.players.length; i++) {
        p = this.players[i];
        if (!p.alive) continue;
        var raw = G.explosionDamage(ev, p, this.world);
        if (raw <= 0) continue;
        var owner = this.byId[ev.owner] || null;
        var dmg = W.resolveDamage(W.get('he'), 0, C.HITGROUP.CHEST, p.armor, p.helmet, raw / W.get('he').dmg);
        this.dealDamage(p, owner, W.get('he'), dmg.health, dmg.armor, C.HITGROUP.CHEST, false);
      }
    } else if (ev.t === 'flash') {
      for (i = 0; i < this.players.length; i++) {
        p = this.players[i];
        if (!p.alive) continue;
        var fx = G.flashEffect(ev, p, this.world);
        if (!fx) continue;
        if (fx.amount > p.flashAmount) { p.flashAmount = fx.amount; p.flashTime = fx.hold; }
        this.emit({ t: 'flashed', id: p.id, amount: fx.amount, hold: fx.hold, by: ev.owner });
      }
    }
    this.emit(ev);
  };

  /* ---------------------------------------------------------------
   * Bots
   * ------------------------------------------------------------- */
  Match.prototype.buyFor = function (p, id) {
    return P.buy(p, id, this.world, this.rules, this.isBuyTime(p));
  };

  Match.prototype.addBot = function (team, difficulty, name) {
    var B = CS.Bots;
    var p = P.create({ name: name || B.nextName(), team: team, bot: true });
    B.attach(p, difficulty || this.rules.botDifficulty);
    this.addPlayer(p);
    if (this.phase !== PH.WARMUP && this.phase !== PH.MATCH_END) {
      var list = this.map.spawns[team] || this.map.spawns[1];
      P.spawn(p, list[(this.teamCount(team) - 1) % list.length], false);
      P.giveWeapon(p, team === C.TEAM.ATT ? 'gs18' : 'sentinel');
      p.alive = this.phase === PH.FREEZE;
    }
    return p;
  };

  Match.prototype.fillBots = function (perTeam, difficulty) {
    for (var t = 1; t <= 2; t++) {
      var have = this.teamCount(t);
      for (var i = have; i < perTeam; i++) this.addBot(t, difficulty);
    }
  };

  Match.prototype.removeBots = function (count) {
    for (var i = this.players.length - 1; i >= 0 && count > 0; i--) {
      if (this.players[i].bot) { this.removePlayer(this.players[i].id); count--; }
    }
  };

  /* Attackers commit to one site per round; defenders spread across both. */
  Match.prototype.planRound = function () {
    this.attPlan = Math.random() < 0.5 ? 'a' : 'b';
    var def = this.teamPlayers(C.TEAM.DEF);
    var toggle = 0;
    var assign = {};
    for (var i = 0; i < def.length; i++) {
      assign[def[i].id] = (toggle++ % 2 === 0) ? 'hold_a' : 'hold_b';
    }
    this.defAssign = function (p) { return assign[p.id] || 'hold_a'; };
    for (var k = 0; k < this.players.length; k++) {
      var pl = this.players[k];
      if (pl.ai) {
        pl.ai.plan = null; pl.ai.planAt = 0;
        pl.ai.holdSpot = null; pl.ai.roamSpot = null; pl.ai.roamGoalTag = null;
        pl.ai.path = null; pl.ai.pathGoal = null; pl.ai.target = null;
        pl.ai.lastKnown = null; pl.ai.alertUntil = 0; pl.ai.buyDone = false;
        pl.ai.aimYaw = pl.yaw; pl.ai.aimPitch = 0;
      }
    }
  };

  /* Serialisable state for clients. */
  Match.prototype.stateSnapshot = function () {
    return {
      time: this.time, round: this.round, phase: this.phase, phaseTime: this.phaseTime,
      score: this.score, winner: this.roundWinner, reason: this.roundReason,
      swapped: this.sideSwapped, ot: this.overtimeRound, over: this.matchOver,
      bomb: this.bomb ? {
        planted: !!this.bomb.planted, dropped: !!this.bomb.dropped,
        x: this.bomb.x, y: this.bomb.y, z: this.bomb.z, site: this.bomb.site,
        defusing: this.bomb.defusing || 0, defuseNeed: this.bomb.defuseNeed || 10,
        defuserId: this.bomb.defuserId || null
      } : null,
      dmScore: this.dmScore
    };
  };

  CS.Match = Match;
})(typeof window !== 'undefined' ? window : globalThis);

/* =============================================================
 * BREACHPOINT — bot AI
 *
 * Bots drive the exact same command struct a human produces, so
 * they obey every movement, recoil and accuracy rule players do.
 * Difficulty changes perception and aim, never the physics.

(function (root) {
  'use strict';
  var CS = (root.CS = root.CS || {});
  var M = CS.M, C = CS.C, W = CS.W, P = CS.P, G = CS.G;

  var B = {};

  B.DIFFICULTY = {
    easy:   { label: 'Easy',   react: 0.62, aimSpeed: 4.5,  error: 4.2, spray: 0.10, fov: 1.55, hearing: 14, burst: 0.55, peek: 0.25, nade: 0.10, crouch: 0.15, preAim: 0.2, memory: 2.0 },
    normal: { label: 'Normal', react: 0.36, aimSpeed: 8.0,  error: 2.0, spray: 0.42, fov: 1.75, hearing: 20, burst: 0.72, peek: 0.45, nade: 0.30, crouch: 0.35, preAim: 0.5, memory: 4.0 },
    hard:   { label: 'Hard',   react: 0.22, aimSpeed: 13.0, error: 1.0, spray: 0.70, fov: 1.95, hearing: 26, burst: 0.85, peek: 0.7,  nade: 0.55, crouch: 0.5,  preAim: 0.75, memory: 6.0 },
    expert: { label: 'Expert', react: 0.14, aimSpeed: 19.0, error: 0.45, spray: 0.92, fov: 2.1, hearing: 30, burst: 0.95, peek: 0.9,  nade: 0.75, crouch: 0.6,  preAim: 0.9, memory: 9.0 }
  };

  var BOT_NAMES = [
    'Ash', 'Kestrel', 'Vulture', 'Mako', 'Pike', 'Rook', 'Slate', 'Tundra',
    'Vector', 'Wisp', 'Onyx', 'Quartz', 'Drift', 'Ember', 'Falk', 'Grit',
    'Halo', 'Iris', 'Jolt', 'Krait'
  ];
  var nameCursor = 0;
  B.nextName = function () { return 'BOT ' + BOT_NAMES[(nameCursor++) % BOT_NAMES.length]; };

  B.attach = function (p, difficulty) {
    var d = B.DIFFICULTY[difficulty] || B.DIFFICULTY.normal;
    p.bot = true;
    p.botSkill = difficulty || 'normal';
    p.ai = {
      d: d,
      state: 'idle',
      path: null, pathIndex: 0, pathGoal: null, repathAt: 0,
      target: null, targetSeenAt: -99, targetLostAt: -99, lastKnown: null,
      reactAt: 0, engageSince: 0,
      aimYaw: p.yaw, aimPitch: 0,
      aimErrX: 0, aimErrY: 0, aimErrT: 0,
      burstLeft: 0, burstRest: 0,
      strafeDir: Math.random() < 0.5 ? 1 : -1, strafeT: 0,
      holdSpot: null, roamSpot: null,
      wantDuck: false, wantWalk: false,
      nadeCooldown: 0, plan: null, planAt: 0,
      alertUntil: 0, alertPos: null,
      jumpCd: 0, stuckT: 0, lastPos: { x: 0, y: 0, z: 0 },
      buyDone: false, personality: Math.random()
    };

  };

  /* ---------------------------------------------------------------
   * Buying
   * ------------------------------------------------------------- */
  var BUY_TIERS = {
    1: [ // attackers
      { min: 5000, gun: 'kr47', armor: 'kevlarHelmet', nades: ['smoke', 'flash', 'he'] },
      { min: 4400, gun: 'kr47', armor: 'kevlarHelmet', nades: ['flash', 'he'] },
      { min: 3700, gun: 'kr47', armor: 'kevlarHelmet', nades: [] },
      { min: 2800, gun: 'nomadAR', armor: 'kevlar', nades: ['flash'] },
      { min: 2200, gun: 'viper10', armor: 'kevlar', nades: [] },
      { min: 1300, gun: 'raider9', armor: 'kevlar', nades: [] },
      { min: 700,  gun: 'raider9', armor: null, nades: ['flash'] },
      { min: 0,    gun: null, armor: null, nades: [] }
    ],
    2: [ // defenders
      { min: 5400, gun: 'ar4', armor: 'kevlarHelmet', kit: true, nades: ['smoke', 'flash', 'he'] },
      { min: 4700, gun: 'ar4', armor: 'kevlarHelmet', kit: true, nades: ['flash'] },
      { min: 4100, gun: 'ar4', armor: 'kevlarHelmet', kit: true, nades: [] },
      { min: 3600, gun: 'ar4', armor: 'kevlarHelmet', nades: [] },
      { min: 2600, gun: 'marshal', armor: 'kevlar', nades: ['flash'] },
      { min: 2000, gun: 'waspMP', armor: 'kevlar', nades: [] },
      { min: 1300, gun: 'cobra57', armor: 'kevlar', nades: [] },
      { min: 700,  gun: 'cobra57', armor: null, nades: ['flash'] },
      { min: 0,    gun: null, armor: null, nades: [] }
    ]
  };

  B.buyPhase = function (p, match) {
    var ai = p.ai;
    if (ai.buyDone) return;
    var rules = match.rules;
    if (!match.isBuyTime(p)) return;
    if (!match.world.inBuyZone(p.team, p.pos.x, p.pos.y, p.pos.z)) return;

    var tiers = BUY_TIERS[p.team] || BUY_TIERS[1];
    var tier = tiers[tiers.length - 1];
    for (var i = 0; i < tiers.length; i++) {
      if (p.money >= tiers[i].min) { tier = tiers[i]; break; }
    }
    // AWP-loving personality occasionally splurges
    if (ai.personality > 0.86 && p.money >= 5300 && !p.primary) {
      match.buyFor(p, 'apex700'); match.buyFor(p, 'kevlarHelmet');
      ai.buyDone = true; return;
    }
    if (tier.gun && !p.primary) match.buyFor(p, tier.gun);
    else if (tier.gun && p.primary && W.get(p.primary.id).cls === 'pistol') match.buyFor(p, tier.gun);
    if (tier.armor) match.buyFor(p, tier.armor);
    if (tier.kit) match.buyFor(p, 'defuseKit');
    for (var n = 0; n < tier.nades.length; n++) match.buyFor(p, tier.nades[n]);
    ai.buyDone = true;
  };

  /* ---------------------------------------------------------------
   * Perception
   * ------------------------------------------------------------- */
  function visible(match, p, e) {
    var eye = { x: p.pos.x, y: p.pos.y + p.eye, z: p.pos.z };
    var tgt = { x: e.pos.x, y: e.pos.y + e.height * 0.72, z: e.pos.z };
    var dx = tgt.x - eye.x, dy = tgt.y - eye.y, dz = tgt.z - eye.z;
    var dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (dist > 90) return 0;
    var f = M.angleVectors(p.ai.aimYaw, p.ai.aimPitch);
    var dot = (f.x * dx + f.y * dy + f.z * dz) / (dist || 1);
    var fovCos = Math.cos(p.ai.d.fov);
    if (dot < fovCos) return 0;
    if (!match.world.canSee(eye.x, eye.y, eye.z, tgt.x, tgt.y, tgt.z, match.nades.smokes)) {
      // try the feet and the head before deciding they are hidden
      if (!match.world.canSee(eye.x, eye.y, eye.z, e.pos.x, e.pos.y + 0.25, e.pos.z, match.nades.smokes)) return 0;
    }
    return dist;
  }

  function hears(match, p, e) {
    // running enemies within hearing range give away their position
    if (!e.alive) return false;
    var sp = P.speed2D(e);
    if (e.walking || sp < C.MAX_SPEED * 0.42) return false;
    return M.vdist(p.pos, e.pos) < p.ai.d.hearing;
  }

  B.perceive = function (p, match, now) {
    var ai = p.ai;
    var best = null, bestDist = 1e9;
    for (var i = 0; i < match.players.length; i++) {
      var e = match.players[i];
      if (!e.alive || e.team === p.team || e === p) continue;
      var dist = visible(match, p, e);
      if (dist > 0) {
        // prefer whoever is closest and most exposed
        var score = dist - (e.health < 50 ? 8 : 0);
        if (score < bestDist) { bestDist = score; best = e; }
      } else if (hears(match, p, e)) {
        if (now > ai.alertUntil - 1) {
          ai.alertUntil = now + 3.0;
          ai.alertPos = { x: e.pos.x, y: e.pos.y, z: e.pos.z };
        }
      }
    }

    if (best) {
      if (ai.target !== best) {
        ai.target = best;
        ai.reactAt = now + ai.d.react * (0.75 + Math.random() * 0.5);
        ai.engageSince = now;
      }
      ai.targetSeenAt = now;
      ai.lastKnown = { x: best.pos.x, y: best.pos.y, z: best.pos.z };
    } else if (ai.target && now - ai.targetSeenAt > ai.d.memory) {
      ai.target = null;
    }

    // getting shot spins you toward the attacker
    if (p.lastAttacker && match.byId[p.lastAttacker] && now - (p.lastHurtTime || -99) < 0.35) {
      var a = match.byId[p.lastAttacker];
      if (a.alive && a.team !== p.team) {
        ai.alertUntil = Math.max(ai.alertUntil, now + 3.5);
        ai.alertPos = { x: a.pos.x, y: a.pos.y, z: a.pos.z };
        if (!ai.target) { ai.target = a; ai.reactAt = now + ai.d.react * 0.6; ai.targetSeenAt = now - 0.2; }
      }
    }
  };

  /* ---------------------------------------------------------------
   * Objective selection
   * ------------------------------------------------------------- */
  function chooseGoal(p, match, now) {
    var ai = p.ai, world = match.world;
    var bomb = match.bomb;

    if (p.team === C.TEAM.ATT) {
      if (bomb && bomb.planted) {
        // defend the plant: hold near the bomb
        if (!ai.holdSpot || M.vdist(ai.holdSpot, { x: bomb.x, y: bomb.y, z: bomb.z }) > 14) {
          ai.holdSpot = pickNear(world, bomb.x, bomb.y, bomb.z, 6.5);
        }
        return ai.holdSpot;
      }
      if (bomb && bomb.dropped && !p.bomb) {
        var anyCarrier = match.bombCarrier;
        if (!anyCarrier) return { x: bomb.x, y: bomb.y, z: bomb.z };
      }
      if (!ai.plan || now > ai.planAt) {
        ai.plan = (ai.personality < 0.5) ? 'a' : 'b';
        // the whole team should commit to the same site
        if (match.attPlan) ai.plan = match.attPlan;
        ai.planAt = now + 999;
      }
      var tag = ai.plan === 'a' ? 'plant_a' : 'plant_b';
      var spots = world.nodesWithTag(tag);
      if (!spots.length) spots = world.nodesWithTag(ai.plan === 'a' ? 'site_a' : 'site_b');
      if (!spots.length) return null;
      if (!ai.roamSpot || ai.roamGoalTag !== tag) {
        ai.roamSpot = spots[(Math.random() * spots.length) | 0];
        ai.roamGoalTag = tag;
      }
      return ai.roamSpot;
    }

    // defenders
    if (bomb && bomb.planted) {
      return { x: bomb.x, y: bomb.y, z: bomb.z };
    }
    if (!ai.holdSpot) {
      var side = ai.personality < 0.5 ? 'hold_a' : 'hold_b';
      if (match.defAssign) side = match.defAssign(p);
      var hs = world.nodesWithTag(side);
      if (!hs.length) hs = world.nodesWithTag(side === 'hold_a' ? 'site_a' : 'site_b');
      ai.holdSpot = hs.length ? hs[(Math.random() * hs.length) | 0] : null;
    }
    if (ai.alertUntil > now && ai.alertPos) {
      return ai.alertPos;
    }
    return ai.holdSpot;
  }

  function pickNear(world, x, y, z, radius) {
    var id = world.nearestNode(x + (Math.random() - 0.5) * radius, y, z + (Math.random() - 0.5) * radius);
    if (id < 0) return { x: x, y: y, z: z };
    return { x: world.nav.x[id], y: world.nav.y[id], z: world.nav.z[id] };
  }

  /* ---------------------------------------------------------------
   * Steering
   * ------------------------------------------------------------- */
  function followPath(p, match, cmd, now, dt) {
    var ai = p.ai, world = match.world;
    var goal = ai.pathGoal;
    if (!goal) return false;

    if (!ai.path || now > ai.repathAt) {
      ai.path = world.findPath(p.pos.x, p.pos.y, p.pos.z, goal.x, goal.y, goal.z);
      ai.pathIndex = 1;
      ai.repathAt = now + 1.2 + Math.random() * 0.8;
      if (!ai.path) { ai.repathAt = now + 2.0; return false; }
    }
    if (!ai.path || ai.pathIndex >= ai.path.length) return false;

    var node = ai.path[ai.pathIndex];
    var d = M.vdistXZ(p.pos, node);
    if (d < 0.9) {
      ai.pathIndex++;
      if (ai.pathIndex >= ai.path.length) { ai.path = null; return false; }
      node = ai.path[ai.pathIndex];
    }

    var dx = node.x - p.pos.x, dz = node.z - p.pos.z;
    var len = Math.sqrt(dx * dx + dz * dz) || 1;
    setMove(p, cmd, dx / len, dz / len, 1);

    // jump up ledges the path wants us to climb
    if (node.y > p.pos.y + 0.5 && d < 1.6 && p.onGround && ai.jumpCd <= 0) {
      cmd.jump = true; ai.jumpCd = 0.6;
    }
    return true;
  }

  /* Convert a world-space direction into forward/side relative to aim yaw. */
  function setMove(p, cmd, wx, wz, scale) {
    var yaw = p.ai.aimYaw;
    var fx = Math.cos(yaw), fz = -Math.sin(yaw);
    var rx = Math.sin(yaw), rz = Math.cos(yaw);
    cmd.forward = (wx * fx + wz * fz) * scale;
    cmd.side = (wx * rx + wz * rz) * scale;
  }

  /* ---------------------------------------------------------------
   * Aiming
   * ------------------------------------------------------------- */
  function aimAt(p, match, target, dt, now, precise) {
    var ai = p.ai;
    var eye = { x: p.pos.x, y: p.pos.y + p.eye, z: p.pos.z };
    var aimHeight = target.height ? target.height * (precise ? 0.88 : 0.72) : 1.2;
    var tx = target.pos ? target.pos.x : target.x;
    var ty = (target.pos ? target.pos.y : target.y) + aimHeight;
    var tz = target.pos ? target.pos.z : target.z;

    // lead a moving target slightly
    if (target.vel) {
      var dist = M.vdist(eye, { x: tx, y: ty, z: tz });
      var lead = M.clamp(dist / 120, 0, 0.12) * (0.4 + ai.d.spray * 0.6);
      tx += target.vel.x * lead; tz += target.vel.z * lead;
    }

    var dx = tx - eye.x, dy = ty - eye.y, dz = tz - eye.z;
    var horiz = Math.sqrt(dx * dx + dz * dz);
    var wantYaw = Math.atan2(-dz, dx);
    var wantPitch = Math.atan2(dy, horiz);

    // aim error wobble, refreshed a few times a second
    ai.aimErrT -= dt;
    if (ai.aimErrT <= 0) {
      ai.aimErrT = 0.18 + Math.random() * 0.22;
      var err = ai.d.error * M.DEG * (1 + (p.flashAmount || 0) * 4);
      ai.aimErrX = (Math.random() - 0.5) * 2 * err;
      ai.aimErrY = (Math.random() - 0.5) * 2 * err * 0.6;
    }
    wantYaw += ai.aimErrX;
    wantPitch += ai.aimErrY;

    // compensate for accumulated recoil — this is what "spray control" is
    wantYaw -= p.recoilYaw * M.DEG * ai.d.spray;
    wantPitch -= p.recoilPitch * M.DEG * ai.d.spray;

    var speed = ai.d.aimSpeed * dt;
    // snap faster when the target is already near the crosshair
    var delta = Math.abs(M.angleDelta(ai.aimYaw, wantYaw));
    var k = M.clamp(speed * (1 + (delta < 0.12 ? 2.2 : 0)), 0, 1);
    ai.aimYaw = ai.aimYaw + M.angleDelta(ai.aimYaw, wantYaw) * k;
    ai.aimPitch = ai.aimPitch + (wantPitch - ai.aimPitch) * k;
    ai.aimPitch = M.clamp(ai.aimPitch, -1.45, 1.45);
    return delta;
  }

  function lookAlong(p, dir, dt, rate) {
    var ai = p.ai;
    var wantYaw = Math.atan2(-dir.z, dir.x);
    var k = M.clamp(rate * dt, 0, 1);
    ai.aimYaw += M.angleDelta(ai.aimYaw, wantYaw) * k;
    ai.aimPitch += (0 - ai.aimPitch) * k;
  }

  /* ---------------------------------------------------------------
   * Main think
   * ------------------------------------------------------------- */
  B.think = function (p, match, dt, now) {
    var ai = p.ai;
    if (!ai) return null;
    var cmd = {
      forward: 0, side: 0, jump: false, duck: false, walk: false,
      yaw: ai.aimYaw, pitch: ai.aimPitch,
      attack: false, attack2: false, reload: false, use: false, slot: 0
    };
    if (!p.alive) return cmd;

    ai.jumpCd = Math.max(0, ai.jumpCd - dt);
    ai.nadeCooldown = Math.max(0, ai.nadeCooldown - dt);

    if (match.phase === C.PHASE.FREEZE) {
      B.buyPhase(p, match);
      cmd.yaw = ai.aimYaw; cmd.pitch = ai.aimPitch;
      return cmd;
    }
    if (match.phase !== C.PHASE.LIVE) { cmd.yaw = ai.aimYaw; cmd.pitch = ai.aimPitch; return cmd; }
    ai.buyDone = false;

    B.perceive(p, match, now);

    // reload when safe
    if (P.needsReload(p) && !ai.target) cmd.reload = true;
    var slot = P.curSlot(p);
    if (slot && slot.mag !== undefined && slot.mag === 0) {
      if (slot.reserve > 0) cmd.reload = true;
      else if (p.secondary && p.cur === 'primary') cmd.slot = 2;
    }
    if (!p.primary && !p.secondary && p.cur !== 'knife') cmd.slot = 3;
    if (p.primary && p.cur !== 'primary' && !ai.throwing && p.cur.indexOf('nade:') !== 0) cmd.slot = 1;

    // burning: run away from fire
    var fire = G.fireDamage(match.nades, p, dt);
    if (fire) {
      var away = { x: p.pos.x, z: p.pos.z };
      var nearest = null, nd = 1e9;
      for (var f = 0; f < match.nades.fires.length; f++) {
        var ff = match.nades.fires[f];
        var d2 = M.vdistXZ(p.pos, ff.pos);
        if (d2 < nd) { nd = d2; nearest = ff; }
      }
      if (nearest) {
        var ax = p.pos.x - nearest.pos.x, az = p.pos.z - nearest.pos.z;
        var al = Math.sqrt(ax * ax + az * az) || 1;
        setMove(p, cmd, ax / al, az / al, 1);
        cmd.yaw = ai.aimYaw; cmd.pitch = ai.aimPitch;
        return cmd;
      }
    }

    if (ai.throwing) {
      if (B.stepThrow(p, match, cmd, dt, now)) { cmd.yaw = ai.aimYaw; cmd.pitch = ai.aimPitch; return cmd; }
    }

    var target = ai.target;
    var engaged = target && target.alive && now >= ai.reactAt && (now - ai.targetSeenAt) < 0.9;

    if (engaged) {
      B.combat(p, match, cmd, target, dt, now);
    } else {
      B.navigate(p, match, cmd, dt, now);
    }

    // anti-stuck
    var moved = M.vdistXZ(p.pos, ai.lastPos);
    if ((cmd.forward || cmd.side) && moved < 0.02 * 60 * dt) ai.stuckT += dt; else ai.stuckT = 0;
    ai.lastPos.x = p.pos.x; ai.lastPos.y = p.pos.y; ai.lastPos.z = p.pos.z;
    if (ai.stuckT > 0.6) {
      ai.path = null; ai.repathAt = 0;
      cmd.side = ai.strafeDir; cmd.forward = 0.4;
      if (ai.jumpCd <= 0) { cmd.jump = true; ai.jumpCd = 0.7; }
      if (ai.stuckT > 1.6) { ai.strafeDir *= -1; ai.stuckT = 0; ai.roamSpot = null; ai.holdSpot = null; }
    }

    cmd.yaw = ai.aimYaw;
    cmd.pitch = ai.aimPitch;
    return cmd;
  };

  B.combat = function (p, match, cmd, target, dt, now) {
    var ai = p.ai;
    var dist = M.vdist(p.pos, target.pos);
    var w = P.curWeapon(p);
    var precise = dist > 8 && w.cls !== 'shotgun';
    var delta = aimAt(p, match, target, dt, now, precise);

    // scope in with snipers at range
    if (w.scope && dist > 14 && !p.scoped && delta < 0.4) cmd.attack2 = true;
    if (w.scope && dist < 8 && p.scoped) cmd.attack2 = true;

    // movement: strafe to make yourself hard to hit, stop to shoot accurately
    ai.strafeT -= dt;
    if (ai.strafeT <= 0) { ai.strafeT = 0.35 + Math.random() * 0.5; ai.strafeDir *= -1; }

    var wantStop = delta < 0.09 && dist > 4;
    if (wantStop) {
      cmd.forward = 0; cmd.side = 0;
      if (ai.d.crouch > Math.random() * 1.2 && dist > 10) cmd.duck = true;
    } else {
      var tx = target.pos.x - p.pos.x, tz = target.pos.z - p.pos.z;
      var tl = Math.sqrt(tx * tx + tz * tz) || 1;
      tx /= tl; tz /= tl;
      var approach = dist > 16 ? 0.3 : (dist < 5 ? -0.5 : 0);
      // strafe perpendicular to the enemy
      var px = -tz * ai.strafeDir, pz = tx * ai.strafeDir;
      setMove(p, cmd, tx * approach + px * 0.9, tz * approach + pz * 0.9, 1);
    }

    // only shoot when the crosshair is actually on them and they are visible
    var canShoot = delta < (dist > 25 ? 0.035 : 0.09) && p.deployTimer <= 0 && p.reloadTimer <= 0;
    var slot = P.curSlot(p);
    if (slot && slot.mag !== undefined && slot.mag <= 0) canShoot = false;

    if (canShoot) {
      if (w.auto) {
        // burst discipline: better bots tap at range, hold at close range
        ai.burstRest -= dt;
        if (ai.burstLeft <= 0 && ai.burstRest <= 0) {
          var maxBurst = dist < 8 ? 30 : (dist < 18 ? 7 : 3);
          ai.burstLeft = Math.max(1, Math.round(maxBurst * (0.45 + ai.d.burst * 0.75)));
        }
        if (ai.burstLeft > 0) {
          cmd.attack = true;
          if (p.fireTimer <= 0) ai.burstLeft--;            // one decrement per round fired
          if (ai.burstLeft <= 0) ai.burstRest = 0.12 + (1 - ai.d.burst) * 0.45;
        }
      } else {
        cmd.attack = true;
      }
    }

    // pop a flash over cover instead of walking into a held angle
    if (ai.nadeCooldown <= 0 && dist > 11 && dist < 34 && Math.random() < ai.d.nade * dt * 0.9) {
      if (B.wantNade(p, match, 'flash', target.pos, 0.22)) ai.nadeCooldown = 9;
    }
  };

  /* Queue a grenade throw at `aimAt` with an upward arc. Returns true if started. */
  B.wantNade = function (p, match, gtype, at, loft) {
    var ai = p.ai;
    var id = null;
    for (var i = 0; i < p.grenades.length; i++) {
      var g = W.get(p.grenades[i].id);
      if (g && g.gtype === gtype && p.grenades[i].count > 0) { id = p.grenades[i].id; break; }
    }
    if (!id) return false;
    ai.throwing = { key: 'nade:' + id, at: { x: at.x, y: at.y, z: at.z }, loft: loft, t: 0, stage: 0 };
    return true;
  };

  /* Drive an in-progress throw: select, aim, release. */
  B.stepThrow = function (p, match, cmd, dt, now) {
    var ai = p.ai, th = ai.throwing;
    th.t += dt;
    if (p.cur !== th.key) {
      if (!P.switchTo(p, th.key)) { ai.throwing = null; return false; }
      th.t = 0;
      return true;
    }
    var eye = { x: p.pos.x, y: p.pos.y + p.eye, z: p.pos.z };
    var dx = th.at.x - eye.x, dz = th.at.z - eye.z;
    var horiz = Math.sqrt(dx * dx + dz * dz) || 1;
    var wantYaw = Math.atan2(-dz, dx);
    var wantPitch = th.loft;
    ai.aimYaw += M.angleDelta(ai.aimYaw, wantYaw) * M.clamp(9 * dt, 0, 1);
    ai.aimPitch += (wantPitch - ai.aimPitch) * M.clamp(9 * dt, 0, 1);
    cmd.forward = 0; cmd.side = 0;
    if (p.deployTimer > 0) return true;
    if (Math.abs(M.angleDelta(ai.aimYaw, wantYaw)) > 0.08 && th.t < 1.2) { cmd.attack = true; return true; }

    gl.uniform3fv(this.progSkin.u.uSunDir, this.sunDir);
    gl.uniform3f(this.progSkin.u.uSunCol, this.sunCol[0] * this.sunI, this.sunCol[1] * this.sunI, this.sunCol[2] * this.sunI);
    gl.uniform3f(this.progSkin.u.uAmbient, this.ambient[0] * this.ambI, this.ambient[1] * this.ambI, this.ambient[2] * this.ambI);
    gl.uniform3fv(this.progSkin.u.uFogColor, this.fogColor);
    gl.uniform2f(this.progSkin.u.uFogRange, this.env.fogNear, this.env.fogFar * q.fogDensity);
    gl.uniform1f(this.progSkin.u.uContrast, 1.06);
    gl.uniform4f(this.progSkin.u.uTint, 0, 0, 0, 0);
    gl.uniform1f(this.progSkin.u.uRim, 0);
  };

  Renderer.prototype.drawSkinned = function (mesh, model, bones, tint, rim) {
    var gl = this.gl;
    gl.uniformMatrix4fv(this.progSkin.u.uModel, false, model);
    gl.uniformMatrix4fv(this.progSkin.u.uBones, false, bones || this.identityBones);
    if (tint) gl.uniform4f(this.progSkin.u.uTint, tint[0], tint[1], tint[2], tint[3]);
    else gl.uniform4f(this.progSkin.u.uTint, 0, 0, 0, 0);
    gl.uniform1f(this.progSkin.u.uRim, rim || 0);
    mesh.draw(this.progSkin);
    this.drawCalls++;
  };

  Renderer.prototype.drawEntities = function (scene) {
    var gl = this.gl, cam = scene.camera;
    this.beginSkin(cam);

    var i, p, model = this.model;
    var settings = this.settings;
    var localTeam = scene.local ? scene.local.team : 0;

    for (i = 0; i < scene.players.length; i++) {
      p = scene.players[i];
      if (!p.alive) continue;
      if (scene.local && p === scene.local && !scene.thirdPerson) continue;
      if (p.animSeed === undefined) p.animSeed = Math.random() * 10;

      var dist = M.vdist(cam, p.pos);
      if (dist > 180) continue;

      var bones = this.poseCharacter(p, scene.time, false, 0);
      Mat4.identity(model);
      Mat4.translate(model, model, p.pos.x, p.pos.y, p.pos.z);
      Mat4.rotateY(model, model, p.yaw);

      var charId = p.charId || (p.team === C.TEAM.ATT ? 'syn_default' : 'van_default');
      var mesh = this.charMesh(charId, p.gloveId || 'default', !!p.helmet);
      // enemies get a subtle rim light so silhouettes read against busy geometry
      var enemy = localTeam && p.team !== localTeam;
      var ti = C.TEAM_INFO[p.team];
      var rc = ti ? Geo.hexToRgb(ti.color) : [1, 1, 1];
      var tint = [rc[0], rc[1], rc[2], p.hitFlash ? Math.min(0.55, p.hitFlash) : 0];
      this.drawSkinned(mesh, model, bones, tint, enemy ? 0.5 : 0.22);

      // held weapon
      var wid = p.netWeapon || (P.curSlot(p) ? P.curWeapon(p).id : null);
      if (wid && wid !== 'bomb') {
        var wm = this.weaponMesh(wid, (settings.skins && settings.skins[wid]) || 'factory');
        Mat4.multiply(this.tmp, model, this.boneMats[11]);
        this.drawSkinned(wm, this.tmp, this.identityBones, null, 0);
      }
      if (p.bomb) {
        Mat4.identity(this.tmp2);
        Mat4.translate(this.tmp2, this.tmp2, p.pos.x, p.pos.y, p.pos.z);
        Mat4.rotateY(this.tmp2, this.tmp2, p.yaw);
        Mat4.translate(this.tmp2, this.tmp2, -0.18, 0.95 - (p.duckAmount || 0) * 0.42, 0);
        this.drawSkinned(this.simpleMesh('bomb', Geo.buildBomb), this.tmp2, this.identityBones, null, 0.3);
      }
    }

    // corpses
    for (i = 0; i < this.corpses.length; i++) {
      var c = this.corpses[i];
      var cb = this.poseCharacter(c.p, scene.time, true, c.t);
      Mat4.identity(model);
      Mat4.translate(model, model, c.x, c.y, c.z);
      Mat4.rotateY(model, model, c.yaw);
      this.drawSkinned(this.charMesh(c.charId, c.gloveId, c.helmet), model, cb, [0.25, 0.05, 0.05, 0.12], 0.15);
    }

    // dropped weapons
    if (scene.dropped) {
      for (i = 0; i < scene.dropped.length; i++) {
        var d = scene.dropped[i];
        Mat4.identity(model);
        Mat4.translate(model, model, d.x, d.y + 0.06, d.z);
        Mat4.rotateY(model, model, d.yaw || 0);
        Mat4.rotateZ(model, model, 0.06);
        this.drawSkinned(this.weaponMesh(d.wid, 'factory'), model, this.identityBones, null, 0.35);
      }
    }

    // planted / dropped bomb
    if (scene.bomb && (scene.bomb.planted || scene.bomb.dropped)) {
      Mat4.identity(model);
      Mat4.translate(model, model, scene.bomb.x, scene.bomb.y, scene.bomb.z);
      Mat4.rotateY(model, model, scene.time * 0.3);
      var blink = scene.bomb.planted ? (Math.sin(scene.time * 14) * 0.5 + 0.5) : 0;
      this.drawSkinned(this.simpleMesh('bomb', Geo.buildBomb), model, this.identityBones,
                       [1, 0.2, 0.15, blink * 0.5], 0.7);
    }

    // aim-training targets
    if (scene.targets) {
      for (i = 0; i < scene.targets.length; i++) {
        var t = scene.targets[i];
        Mat4.identity(model);
        Mat4.translate(model, model, t.x, t.y, t.z);
        Mat4.rotateY(model, model, Math.sin(scene.time + t.bob) * 0.5);
        this.drawSkinned(this.simpleMesh('target', Geo.buildTarget), model, this.identityBones, null, 0.4);
      }
    }

    // live grenades in flight
    if (scene.nades) {
      for (i = 0; i < scene.nades.proj.length; i++) {
        var g = scene.nades.proj[i];
        Mat4.identity(model);
        Mat4.translate(model, model, g.pos.x, g.pos.y, g.pos.z);
        Mat4.rotateY(model, model, g.spin);
        Mat4.rotateZ(model, model, g.spin * 1.7);
        this.drawSkinned(this.weaponMesh(g.wid, 'factory'), model, this.identityBones, null, 0.4);
      }
    }
  };

  /* ---------------------------------------------------------------
   * Effects pass
   * ------------------------------------------------------------- */
  Renderer.prototype.drawEffects = function (scene, cam) {
    var gl = this.gl;
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    var fx = cp * cy, fy = sp, fz = -cp * sy;
    var rl = Math.sqrt(fz * fz + fx * fx) || 1;
    var rx = -fz / rl, ry = 0, rz = fx / rl;
    var ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;

    var b = this.sprites;
    b.begin();

    // ground shadows for every visible body
    var i, p;
    for (i = 0; i < scene.players.length; i++) {
      p = scene.players[i];
      if (!p.alive) continue;
      if (scene.local && p === scene.local && !scene.thirdPerson) continue;
      var gy = scene.world ? scene.world.dropToFloor(p.pos.x, p.pos.y + 0.3, p.pos.z, 4) : p.pos.y;
      var h = M.clamp(1 - (p.pos.y - gy) / 3, 0.25, 1);
      b.addOriented(p.pos.x, gy + 0.02, p.pos.z, 1.25 * h, FX.T.SHADOW, 0, 0, 0, 0.55 * h, 1, 0, 0, 0, 0, 1);
    }
    for (i = 0; i < this.corpses.length; i++) {
      var c = this.corpses[i];
      b.addOriented(c.x, c.gy + 0.02, c.z, 1.6, FX.T.SHADOW, 0, 0, 0, 0.45, 1, 0, 0, 0, 0, 1);
    }

    this.decals.draw(b);

    // fire
    if (scene.nades) {
      for (i = 0; i < scene.nades.fires.length; i++) {
        var f = scene.nades.fires[i];
        if (f.grow <= 0.02) continue;
        var puffs = this.quality === 'low' ? 3 : 6;
        for (var k = 0; k < puffs; k++) {
          var a = (k / puffs) * 6.283 + scene.time * 0.8 + f.id;
          var rr = f.radius * (0.25 + 0.6 * ((k * 37 % 11) / 11));
          var px = f.pos.x + Math.cos(a) * rr, pz = f.pos.z + Math.sin(a) * rr;
          var flick = 0.6 + 0.4 * Math.sin(scene.time * 11 + k * 2.1 + f.id);
          var hgt = 0.35 + flick * 0.65;
          b.add(px, f.pos.y + hgt * 0.5, pz, (0.9 + flick * 0.5) * f.grow, FX.T.FIRE,
                1, 0.72, 0.34, 0.72 * f.grow, 0, rx, ry, rz, ux, uy, uz);
        }
        b.addOriented(f.pos.x, f.pos.y + 0.03, f.pos.z, f.radius * 2.1, FX.T.SCORCH,
                      0.6, 0.25, 0.08, 0.4 * f.grow, 1, 0, 0, 0, 0, 1);
      }

      // smoke volumes — deterministic puff cloud so they look stable, not boiling
      var segs = (C.QUALITY_PRESETS[this.quality] || C.QUALITY_PRESETS.high).smokeSegments;
      for (i = 0; i < scene.nades.smokes.length; i++) {
        var sm = scene.nades.smokes[i];
        if (sm.opacity <= 0.01) continue;
        for (var s = 0; s < segs; s++) {
          var h1 = M.hash01(sm.id, s * 3 + 1), h2 = M.hash01(sm.id, s * 3 + 2), h3 = M.hash01(sm.id, s * 3 + 3);
          var theta = h1 * 6.283, phi = Math.acos(2 * h2 - 1);
          var rad = sm.radius * 0.78 * Math.pow(h3, 0.38);
          var px2 = sm.pos.x + Math.sin(phi) * Math.cos(theta) * rad;
          var py2 = sm.pos.y + Math.cos(phi) * rad * 0.82;
          var pz2 = sm.pos.z + Math.sin(phi) * Math.sin(theta) * rad;
          var drift = Math.sin(scene.time * 0.5 + s) * 0.06;
          b.add(px2 + drift, py2, pz2, sm.radius * 1.45, s % 3 === 0 ? FX.T.SMOKE2 : FX.T.PUFF,
                0.80, 0.81, 0.83, sm.opacity * 0.42, h1 * 6.283 + scene.time * 0.08,
                rx, ry, rz, ux, uy, uz);
        }
      }
    }

    this.particles.draw(b, rx, ry, rz, ux, uy, uz);
    this.tracers.draw(b, cam.x, cam.y, cam.z);

    // shells
    for (i = 0; i < this.shells.length; i++) {
      var sh = this.shells[i];
      b.add(sh.x, sh.y, sh.z, 0.05, FX.T.SHELL, 1, 1, 1, M.clamp((sh.max - sh.t) * 2, 0, 1),
            sh.rot, rx, ry, rz, ux, uy, uz, 2.2);
    }

    gl.useProgram(this.progSprite.p);
    gl.uniformMatrix4fv(this.progSprite.u.uViewProj, false, this.viewProj);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.atlasTex);
    gl.uniform1i(this.progSprite.u.uAtlas, 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    b.flush(this.progSprite);
    this.drawCalls++;
    gl.enable(gl.CULL_FACE);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  };

  /* ---------------------------------------------------------------
   * Viewmodel
   * ------------------------------------------------------------- */
  Renderer.prototype.drawViewmodel = function (scene, aspect) {
    var gl = this.gl;
    var vm = scene.viewmodel;
    var cam = scene.camera;
    if (vm.hidden) return;

    var vmFov = (this.settings.viewmodelFov || 68) * M.DEG;
    var vFov = 2 * Math.atan(Math.tan(vmFov / 2) / Math.max(0.3, aspect));
    // Viewmodel lives in plain camera space: -Z forward, +X right, +Y up.
    Mat4.perspective(this.viewProj, vFov, aspect, 0.01, 12);

    gl.clear(gl.DEPTH_BUFFER_BIT);
    this.beginSkin({ x: 0, y: 0, z: 0 });
    gl.uniformMatrix4fv(this.progSkin.u.uViewProj, false, this.viewProj);
    // viewmodel lighting is view-relative so it never goes flat black indoors
    gl.uniform3f(this.progSkin.u.uSunDir, 0.42, 0.68, 0.60);
    gl.uniform3f(this.progSkin.u.uSunCol, this.sunCol[0] * 0.85, this.sunCol[1] * 0.85, this.sunCol[2] * 0.85);
    gl.uniform3f(this.progSkin.u.uAmbient, this.ambient[0] * (this.ambI + 0.35),
                 this.ambient[1] * (this.ambI + 0.35), this.ambient[2] * (this.ambI + 0.35));
    gl.uniform2f(this.progSkin.u.uFogRange, 900, 1000);

    var side = this.settings.viewmodelSide === undefined ? 1 : this.settings.viewmodelSide;
    var model = this.model;
    Mat4.identity(model);
    // model space: +X forward, +Y up, +Z right. Camera space: -Z forward, +X right.
    Mat4.translate(model, model, (vm.x) * side, vm.y, vm.z);
    Mat4.rotateY(model, model, Math.PI * 0.5 + vm.yaw * side);
    Mat4.rotateX(model, model, vm.roll * side);
    Mat4.rotateZ(model, model, vm.pitch);
    Mat4.scale(model, model, vm.scale, vm.scale, vm.scale * side);

    if (side < 0) gl.frontFace(gl.CW);
    if (vm.weaponId) {
      var mesh = this.weaponMesh(vm.weaponId, vm.skin || 'factory');
      this.drawSkinned(mesh, model, this.identityBones, vm.tint || null, 0.25);
      if (!vm.noHands) {
        this.drawSkinned(this.simpleMesh('hands_' + (vm.glove || 'default'), function () {
          return Geo.buildHands(vm.glove || 'default');
        }), model, this.identityBones, null, 0.2);
      }
    }
    gl.frontFace(gl.CCW);
    gl.uniform2f(this.progSkin.u.uFogRange, this.env.fogNear, this.env.fogFar);

    // muzzle flash sits in view space too so it never clips into a wall
    if (vm.flash > 0) {
      var b = this.sprites;
      b.begin();
      var fpos = vm.flashPos || [0.55, -0.05, -0.9];
      b.add(fpos[0] * side, fpos[1], fpos[2], 0.34 + vm.flash * 0.5, FX.T.FLASH,
            1, 0.92, 0.66, Math.min(1, vm.flash * 1.6), vm.flashRot || 0,
            1, 0, 0, 0, 1, 0);
      gl.useProgram(this.progSprite.p);
      gl.uniformMatrix4fv(this.progSprite.u.uViewProj, false, this.viewProj);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, this.atlasTex);
      gl.uniform1i(this.progSprite.u.uAtlas, 0);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.depthMask(false);
      gl.disable(gl.CULL_FACE);
      b.flush(this.progSprite);
      gl.enable(gl.CULL_FACE);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
      this.drawCalls++;
    }
  };

  /* ---------------------------------------------------------------
   * Effect spawners
   * ------------------------------------------------------------- */
  Renderer.prototype.spawnImpact = function (x, y, z, nx, ny, nz, mat, power) {
    var surf = C.SURF[mat] || C.SURF.concrete;
    var col = Geo.hexToRgb(surf.dust);
    var q = C.QUALITY_PRESETS[this.quality] || C.QUALITY_PRESETS.high;
    var n = Math.round((4 + Math.random() * 4) * q.particles);
    for (var i = 0; i < n; i++) {
      var sx = nx + (Math.random() - 0.5) * 1.3;
      var sy = ny + (Math.random() - 0.5) * 1.3 + 0.3;
      var sz = nz + (Math.random() - 0.5) * 1.3;
      var sp = 1.4 + Math.random() * 3.4;
      this.particles.spawn({
        x: x, y: y, z: z, vx: sx * sp, vy: sy * sp, vz: sz * sp,
        size: 0.035 + Math.random() * 0.05, size2: 0.16 + Math.random() * 0.14,
        life: 0.32 + Math.random() * 0.4, tile: FX.T.DUST,
        r: col[0], g: col[1], b: col[2], a: 0.62, a2: 0, grav: 5.5, drag: 2.4,
        spin: (Math.random() - 0.5) * 6
      });
    }
    // a couple of sparks off hard surfaces
    if (surf.hard > 0.8) {
      for (var s = 0; s < 3; s++) {
        this.particles.spawn({
          x: x, y: y, z: z,
          vx: nx * 3 + (Math.random() - 0.5) * 4, vy: ny * 3 + Math.random() * 3, vz: nz * 3 + (Math.random() - 0.5) * 4,
          size: 0.09, size2: 0.02, life: 0.16 + Math.random() * 0.16, tile: FX.T.SPARK,
          r: 1, g: 0.86, b: 0.5, a: 1, a2: 0, grav: 9, drag: 1.2, aspect: 0.3,
          rot: Math.random() * 6.28, spin: 8
        });
      }
    }
    this.decals.add(x, y, z, nx, ny, nz, 0.16 + Math.random() * 0.07,
                    surf.hard > 1.05 ? FX.T.CRACK : FX.T.HOLE, 1, 1, 1, 0.92, 0);
  };

  Renderer.prototype.spawnBlood = function (x, y, z, dx, dy, dz, amount, world) {
    var q = C.QUALITY_PRESETS[this.quality] || C.QUALITY_PRESETS.high;
    var n = Math.round(M.clamp(amount * 0.28, 3, 14) * q.particles);
    for (var i = 0; i < n; i++) {
      this.particles.spawn({
        x: x, y: y, z: z,
        vx: dx * (1 + Math.random() * 3) + (Math.random() - 0.5) * 2.2,
        vy: dy * 2 + Math.random() * 2.0,
        vz: dz * (1 + Math.random() * 3) + (Math.random() - 0.5) * 2.2,
        size: 0.05 + Math.random() * 0.06, size2: 0.03,
        life: 0.45 + Math.random() * 0.45, tile: FX.T.BLOOD,
        r: 0.75, g: 0.08, b: 0.09, a: 0.95, a2: 0, grav: 9.5, drag: 1.1, bounce: 0
      });
    }
    // a puff that reads instantly as "you hit them"
    this.particles.spawn({
      x: x, y: y, z: z, vx: dx, vy: dy + 0.3, vz: dz,
      size: 0.18, size2: 0.5, life: 0.28, tile: FX.T.SPLAT,
      r: 0.62, g: 0.05, b: 0.06, a: 0.6, a2: 0, drag: 3
    });
    if (world) {
      var h = world.rayWorld(x, y, z, dx, dy - 0.3, dz, 3.5);
      if (h) this.decals.add(h.x, h.y, h.z, h.nx, h.ny, h.nz, 0.35 + Math.random() * 0.3,
                             FX.T.SPLAT, 1, 1, 1, 0.72, 26);
    }
  };

  Renderer.prototype.spawnExplosion = function (x, y, z, radius, world) {
    var q = C.QUALITY_PRESETS[this.quality] || C.QUALITY_PRESETS.high;
    var n = Math.round(26 * q.particles);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, e = Math.random() * 1.2 - 0.1;
      var sp = 4 + Math.random() * 12;
      this.particles.spawn({
        x: x, y: y, z: z,
        vx: Math.cos(a) * Math.cos(e) * sp, vy: Math.sin(e) * sp + 2, vz: Math.sin(a) * Math.cos(e) * sp,
        size: 0.25, size2: 1.5 + Math.random(), life: 0.5 + Math.random() * 0.7,
        tile: i % 3 === 0 ? FX.T.FIRE : FX.T.PUFF,
        r: i % 3 === 0 ? 1 : 0.55, g: i % 3 === 0 ? 0.7 : 0.53, b: i % 3 === 0 ? 0.28 : 0.5,
        a: 0.85, a2: 0, grav: 1.5, drag: 1.8, spin: (Math.random() - 0.5) * 3
      });
    }
    this.particles.spawn({ x: x, y: y, z: z, size: 0.6, size2: radius * 1.6, life: 0.28,
                           tile: FX.T.RING, r: 1, g: 0.9, b: 0.7, a: 0.8, a2: 0, drag: 0 });
    if (world) {
      var h = world.rayWorld(x, y, z, 0, -1, 0, 4);
      if (h) this.decals.add(h.x, h.y, h.z, h.nx, h.ny, h.nz, radius * 0.8, FX.T.SCORCH, 1, 1, 1, 0.8, 45);
    }
  };

  Renderer.prototype.spawnShell = function (x, y, z, vx, vy, vz) {
    if (this.shells.length > 60) this.shells.shift();
    this.shells.push({ x: x, y: y, z: z, vx: vx, vy: vy, vz: vz, t: 0, max: 2.2, rot: Math.random() * 6.28, spin: 12 });
  };

  Renderer.prototype.addCorpse = function (p, world, charId, gloveId) {
    if (this.corpses.length > 12) this.corpses.shift();
    var gy = world ? world.dropToFloor(p.pos.x, p.pos.y + 0.4, p.pos.z, 5) : p.pos.y;
    this.corpses.push({
      p: { pitch: 0, duckAmount: 0, vel: { x: 0, y: 0, z: 0 }, netSpeed: 0, animPhase: 0, animSeed: 0, local: false },
      x: p.pos.x, y: p.pos.y, z: p.pos.z, gy: gy, yaw: p.yaw,
      charId: charId, gloveId: gloveId, helmet: p.helmet, t: 0, life: 22,
      vy: 0, slideX: (p.deathDir !== undefined ? Math.cos(p.deathDir) : 0) * 1.2,
      slideZ: (p.deathDir !== undefined ? -Math.sin(p.deathDir) : 0) * 1.2
    });
  };

  Renderer.prototype.updateFX = function (dt, world) {
    this.particles.update(dt, world);
    this.decals.update(dt);
    this.tracers.update(dt);

    var i;
    for (i = this.shells.length - 1; i >= 0; i--) {
      var s = this.shells[i];
      s.t += dt;
      if (s.t > s.max) { this.shells.splice(i, 1); continue; }
      s.vy -= C.GRAVITY * dt;
      var nx = s.x + s.vx * dt, ny = s.y + s.vy * dt, nz = s.z + s.vz * dt;
      if (world && s.vy < 0) {
        var floor = world.dropToFloor(nx, s.y + 0.2, nz, 1.2);
        if (ny <= floor + 0.02) { ny = floor + 0.02; s.vy *= -0.32; s.vx *= 0.5; s.vz *= 0.5; }
      }
      s.x = nx; s.y = ny; s.z = nz;
      s.rot += s.spin * dt;
    }
    for (i = this.corpses.length - 1; i >= 0; i--) {
      var c = this.corpses[i];
      c.t += dt;
      if (c.t > c.life) { this.corpses.splice(i, 1); continue; }
      // slump to the floor and slide a little in the direction of the shot
      var k = Math.exp(-4 * dt);
      c.x += c.slideX * dt; c.z += c.slideZ * dt;
      c.slideX *= k; c.slideZ *= k;

      ctx.fillRect(ox + (box.min.x - b.x0) * s, oz + (box.min.z - b.z0) * s,
