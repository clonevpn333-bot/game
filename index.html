<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Arcade</title>
<meta name="description" content="A game library that launches instantly and holds frame rate on a Chromebook.">
<meta name="theme-color" content="#060709">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="portal/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="portal/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Critical shell styles inline: first paint needs zero round trips. -->
<style>
:root{
  --bg:#060709;--bg-deep:#030405;--surface:#0C0E12;--surface-2:#14171E;--surface-3:#1C2029;
  --line:rgba(255,255,255,.075);--line-strong:rgba(255,255,255,.15);
  --text:#EDEFF4;--text-2:#B4B9C6;--dim:#7E8493;--dimmer:#565C6B;
  --accent:#E9C68C;--accent-deep:#B4884A;--accent-ink:#1A1206;
  --cool:#7FA2FF;--good:#6FD69B;--bad:#FF6B6B;
  --font-display:"Instrument Serif","Times New Roman",Georgia,serif;
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --bar:60px;--gut:clamp(18px,4vw,56px);--r:12px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--font-ui);
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  height:var(--bar);padding:0 var(--gut);background:rgba(6,7,9,.94);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text);
  font-weight:650;letter-spacing:.005em;white-space:nowrap}
.brand svg{width:22px;height:22px;flex:none}
.spacer{flex:1}
.skeleton{padding:0 var(--gut)}
.skeleton .sk-hero{height:min(56vh,460px);border-radius:0;margin:0 calc(var(--gut) * -1);
  background:linear-gradient(100deg,#0C0E12 30%,#14171E 50%,#0C0E12 70%);
  background-size:220% 100%;animation:sheen 1.5s linear infinite}
.skeleton .sk-row{display:flex;gap:14px;margin-top:34px}
.skeleton .sk-row i{flex:0 0 clamp(210px,22vw,290px);height:186px;border-radius:12px;
  background:linear-gradient(100deg,#0C0E12 30%,#14171E 50%,#0C0E12 70%);
  background-size:220% 100%;animation:sheen 1.5s linear infinite}
@keyframes sheen{to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.skeleton .sk-hero,.skeleton .sk-row i{animation:none}}
</style>
<link rel="stylesheet" href="portal/css/shell.css">
</head>
<body data-route="library">

<header class="topbar">
  <a class="brand" href="#/" aria-label="Nova Arcade home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0C0E12"/><path d="M9 23V9l14 14V9" stroke="#E9C68C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Nova Arcade</span>
  </a>
  <span class="spacer"></span>
  <input id="search" class="search" type="search" placeholder="Search  /" aria-label="Search games" autocomplete="off" spellcheck="false">
  <span id="net-badge" class="net-badge" role="status" hidden></span>
  <button id="install" class="btn btn--ghost btn--sm" hidden>Install</button>
  <a class="btn btn--ghost btn--sm" href="#/links" title="Generate shareable game links">Links</a>
  <a class="btn btn--ghost btn--sm" href="#/diagnostics" title="Device support and cache">Device</a>
</header>

<main id="view">
  <div class="skeleton" aria-hidden="true">
    <div class="sk-hero"></div>
    <div class="sk-row"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</main>

<noscript>
  <p style="padding:24px;max-width:60ch">Nova Arcade launches games in sandboxed frames and needs JavaScript. The bundles under <code>games/</code> are self-contained and open directly.</p>
</noscript>

<script type="module" src="portal/js/shell.js"></script>
</body>
</html>
