                    ctx.beginPath(); ctx.ellipse(p[0] * W, p[1] * H, p[2], p[2] * 0.8, 1.1, 0, 6.283); ctx.fill();
                }
                break;
            }
            case 'tiger':
                ctx.strokeStyle = dk; ctx.lineWidth = 16; ctx.lineCap = 'round';
                for (let i = -1; i < 8; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, i * 34);
                    ctx.quadraticCurveTo(W / 2, i * 34 - 26, W, i * 34);
                    ctx.stroke();
                }
                break;
            case 'star':
                for (let yy = 0; yy < 4; yy++) for (let xx = 0; xx < 4; xx++)
                    star(xx * 64 + 32, yy * 64 + 32, 22, 9, 5, lt);
                break;
            case 'tiedye': {
                const g = ctx.createRadialGradient(W / 2, H / 2, 4, W / 2, H / 2, W * 0.7);
                g.addColorStop(0, 'rgba(255,255,255,0.85)');
                g.addColorStop(0.35, this._shadeStr(base, 0.35));
                g.addColorStop(0.65, base);
                g.addColorStop(1, dk);
                ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                break;
            }
            case 'galaxy': {
                const g = ctx.createLinearGradient(0, 0, W, H);
                g.addColorStop(0, '#2b1d5e'); g.addColorStop(0.5, '#6a32c8'); g.addColorStop(1, '#1b1340');
                ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 60; i++) {
                    ctx.globalAlpha = 0.4 + Math.random() * 0.6;
                    ctx.beginPath();
                    ctx.arc(Math.random() * W, Math.random() * H, Math.random() * 1.8 + 0.4, 0, 6.283);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                break;
            }
            default: return null;
        }
        const tex = new THREE.CanvasTexture(cv);
        return tex;
    }

    _shadeStr(base, amt) { return '#' + this._shade(base, amt).getHexString(); }

    // Mesh-based pattern fallback (no canvas). Thin accents on the body.
    _buildPatternMeshes(type, base) {
        const r = this.r, R = this.bodyR;
        const dkMat = this._mat(null, { color: this._shade(base, -0.28), roughness: 0.6 });
        const ltMat = this._mat(null, { color: this._shade(base, 0.4), roughness: 0.6 });
        const add = (geo, mat, x, y, z, rx, ry, rz) => {
            const m = new THREE.Mesh(this._geo(geo), mat);
            m.position.set(x, y, z);
            if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
            m.castShadow = true;
            this._patternGroup.add(m);
        };
        const surf = R * 1.005;
        switch (type) {
            case 'stripes':
                for (let i = -2; i <= 2; i++)
                    add(new THREE.BoxGeometry(r * 0.18, this.bodyH + R, r * 0.05),
                        dkMat, 0, 0, 0, 0, i * 0.5, 0);
                break;
            case 'spots':
                for (const p of [[0.5, 0.3], [-0.6, 0.8], [0.2, -0.5], [-0.3, -0.1], [0.7, -0.9]]) {
                    const a = p[0] * Math.PI, h = p[1] * r * 0.9;
                    add(new THREE.SphereGeometry(r * 0.2, 8, 8), dkMat,
                        Math.cos(a) * surf, h, Math.sin(a) * surf);
                }
                break;
            case 'star':
                add(new THREE.ConeGeometry(r * 0.45, r * 0.12, 5), ltMat,
                    0, 0, surf, Math.PI / 2, 0, 0);
                break;
            case 'galaxy':
            case 'tiedye':
            case 'camo':
            case 'tiger':
            case 'check':
            default:
                // belt-style accent ring so something is visibly different
                add(new THREE.TorusGeometry(R * 0.98, r * 0.12, 6, 18), dkMat, 0, 0, 0, Math.PI / 2, 0, 0);
                break;
        }
    }

    /* ----- FACE --------------------------------------------------- */
    _buildFace() {
        const r = this.r;
        this.face = new THREE.Group();
        // Face sits on the front (+Z) upper portion of the body.
        this.face.position.set(0, this._bodyCenterY + r * 0.35, this.bodyR * 0.62);
        this.bodyScale.add(this.face);

        // visor band — a flattened rounded box across the eyes
        this.visorMat = this._mat('visor', {
            color: new THREE.Color(this.appearance.visor),
            roughness: 0.25, metalness: 0.1,
            emissive: new THREE.Color(this.appearance.visor).multiplyScalar(0.12),
        });
        const visorGeo = this._geo(new THREE.BoxGeometry(r * 1.5, r * 0.72, r * 0.5));
        const visor = new THREE.Mesh(visorGeo, this.visorMat);
        visor.position.z = -r * 0.12;
        visor.castShadow = true;
        this.face.add(visor);

        // eyes: white spheres with dark pupils, on a small pivot so they
        // can squash for blinking and the pupils can track movement.
        const whiteMat = this._mat('eyeWhite', { color: new THREE.Color('#ffffff'), roughness: 0.4 });
        const pupilMat = this._mat('pupil', { color: new THREE.Color('#22203a'), roughness: 0.5 });
        const eyeGeo = this._geo(new THREE.SphereGeometry(r * 0.22, 12, 12));
        const pupilGeo = this._geo(new THREE.SphereGeometry(r * 0.1, 10, 10));

        this.eyes = [];
        for (const side of [+1, -1]) {
            const eye = new THREE.Group();
            eye.position.set(side * r * 0.34, 0, r * 0.2);
            const white = new THREE.Mesh(eyeGeo, whiteMat);
            white.scale.z = 0.6;
            eye.add(white);
            const pupil = new THREE.Mesh(pupilGeo, pupilMat);
            pupil.position.z = r * 0.16;
            eye.add(pupil);
            this.face.add(eye);
            this.eyes.push({ group: eye, pupil });
        }

        // pink cheek dots
        const cheekMat = this._mat('cheek', {
            color: new THREE.Color('#ff7896'), roughness: 0.7,
            transparent: true, opacity: 0.65,
        });
        const cheekGeo = this._geo(new THREE.CircleGeometry(r * 0.17, 12));
        for (const side of [+1, -1]) {
            const ch = new THREE.Mesh(cheekGeo, cheekMat);
            ch.position.set(side * r * 0.6, -r * 0.32, r * 0.2);
            this.face.add(ch);
        }
    }

    /* ----- ARM ---------------------------------------------------- */
    _buildArm(side) {
        const r = this.r;
        const pivot = new THREE.Group();
        // shoulder location on the side of the upper body
        pivot.position.set(side * this.bodyR * 0.95, this._bodyCenterY + r * 0.15, 0);
        // default rest: arms hang slightly out & down. We rotate around Z
        // for the "out" angle and X for fwd/back swing.
        const armMat = this._mat('arm', { color: new THREE.Color(this.appearance.color), roughness: 0.62 });
        this._materials['arm' + (side > 0 ? 'L' : 'R')] = armMat;
        // a small capsule nub hanging from the pivot (pivot at top of nub)
        const len = r * 0.85;
        const geo = this._geo(new THREE.CapsuleGeometry(r * 0.26, len, 4, 10));
        const mesh = new THREE.Mesh(geo, armMat);
        mesh.position.y = -(len * 0.5 + r * 0.26);   // hang below pivot
        mesh.castShadow = true;
        pivot.add(mesh);
        // little hand tip (lighter) for personality
        const hand = new THREE.Mesh(
            this._geo(new THREE.SphereGeometry(r * 0.28, 8, 8)),
            this._mat(null, { color: this._shade(this.appearance.color, 0.18), roughness: 0.6 })
        );
        hand.position.y = -(len + r * 0.26);
        hand.castShadow = true;
        pivot.add(hand);
        pivot.userData.side = side;
        return { pivot, mesh, hand, len };
    }

    /* ----- LEG ---------------------------------------------------- */
    _buildLeg(side) {
        const r = this.r;
        const pivot = new THREE.Group();
        // hip near the bottom of the body, slightly inset
        pivot.position.set(side * this.bodyR * 0.45, r * 0.62, 0);
        const legMat = this._mat('leg', { color: this._shade(this.appearance.color, -0.18), roughness: 0.65 });
        const len = r * 0.5;
        const geo = this._geo(new THREE.CapsuleGeometry(r * 0.27, len, 4, 10));
        const mesh = new THREE.Mesh(geo, legMat);
        mesh.position.y = -(len * 0.5 + r * 0.27);
        mesh.castShadow = true;
        pivot.add(mesh);
        // foot
        const foot = new THREE.Mesh(
            this._geo(new THREE.SphereGeometry(r * 0.3, 8, 8)),
            legMat
        );
        foot.scale.set(1.1, 0.7, 1.3);
        foot.position.set(0, -(len + r * 0.27), r * 0.08);
        foot.castShadow = true;
        pivot.add(foot);
        return { pivot, mesh, foot, len };
    }

    /* ----- UPPER COSTUME ------------------------------------------ */
    _buildUpper(prop) {
        const r = this.r;
        if (this.upperGroup) { this.headPivot.remove(this.upperGroup); this._disposeNode(this.upperGroup); }
        this.upperGroup = new THREE.Group();
        // sit atop the head; head top is roughly here in headPivot-local space
        this.upperGroup.position.y = this.bodyR * 0.55;
        this.headPivot.add(this.upperGroup);
        const g = this.upperGroup;
        const M = (col, opts) => this._mat(null, Object.assign({ color: new THREE.Color(col), roughness: 0.5 }, opts || {}));
        const add = (geo, mat, x, y, z, rx, ry, rz) => {
            const m = new THREE.Mesh(this._geo(geo), mat);
            m.position.set(x || 0, y || 0, z || 0);
            if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
            m.castShadow = true; g.add(m); return m;
        };
        switch (prop) {
            case 'party':
                add(new THREE.ConeGeometry(r * 0.5, r * 1.1, 16), M('#ff5fa2'), 0, r * 0.55, 0);
                add(new THREE.SphereGeometry(r * 0.18, 10, 10), M('#ffd23f', { emissive: new THREE.Color('#5a3a00') }), 0, r * 1.15, 0);
                break;
            case 'cap':
                add(new THREE.SphereGeometry(r * 0.62, 12, 10, 0, Math.PI * 2, 0, Math.PI / 2),
                    M('#e6395a'), 0, r * 0.05, 0);
                // backwards brim points -Z (behind)
                add(new THREE.BoxGeometry(r * 0.7, r * 0.12, r * 0.5), M('#e6395a'), 0, r * 0.04, -r * 0.7);
                break;
            case 'pigeon': {
                add(new THREE.SphereGeometry(r * 0.6, 14, 12), M('#cfd6df'), 0, r * 0.45, 0);
                add(new THREE.ConeGeometry(r * 0.16, r * 0.5, 8), M('#ff9447'), 0, r * 0.42, r * 0.55, Math.PI / 2, 0, 0);
                for (const s of [+1, -1]) {
                    const eye = add(new THREE.SphereGeometry(r * 0.09, 8, 8), M('#222'), s * r * 0.22, r * 0.6, r * 0.4);
                    eye.castShadow = false;
                }
                break;
            }
            case 'bee':
                for (const s of [+1, -1]) {
                    add(new THREE.CylinderGeometry(r * 0.04, r * 0.04, r * 0.7, 6),
                        M('#222'), s * r * 0.25, r * 0.35, 0, 0, 0, s * 0.3);
                    add(new THREE.SphereGeometry(r * 0.13, 8, 8), M('#ffd23f', { emissive: new THREE.Color('#5a4a00') }),
                        s * r * 0.42, r * 0.72, 0);
                }
                break;
            case 'cat':
                for (const s of [+1, -1])
                    add(new THREE.ConeGeometry(r * 0.26, r * 0.6, 4), M('#9a6cff'),
                        s * r * 0.4, r * 0.45, 0, 0, Math.PI / 4, 0);
                break;
            case 'pirate':
                add(new THREE.CylinderGeometry(r * 0.78, r * 0.92, r * 0.18, 18), M('#23203a'), 0, r * 0.1, 0);
                add(new THREE.SphereGeometry(r * 0.55, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2.2), M('#23203a'), 0, r * 0.18, 0);
                add(new THREE.SphereGeometry(r * 0.12, 8, 8), M('#ffffff', { emissive: new THREE.Color('#333') }), 0, r * 0.3, r * 0.45);
                break;
            case 'dino':
                // back spikes: place them down the spine, not just head.
                this.headPivot.remove(this.upperGroup);
                this.bodyScale.add(this.upperGroup);
                this.upperGroup.position.set(0, 0, -this.bodyR * 0.7);
                for (let i = 0; i < 4; i++) {
                    const sz = 0.5 - i * 0.07;
                    add(new THREE.ConeGeometry(r * 0.22, r * (0.7 * sz + 0.3), 4),
                        M('#46d36a'),
                        0, this._bodyCenterY + r * 0.7 - i * r * 0.55, -i * r * 0.05,
                        0.35, Math.PI / 4, 0);
                }
                break;
            case 'crown':
                add(new THREE.CylinderGeometry(r * 0.55, r * 0.55, r * 0.32, 16),
                    M('#ffd23f', { metalness: 0.6, roughness: 0.25, emissive: new THREE.Color('#3a2a00') }),
                    0, r * 0.2, 0);
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    add(new THREE.ConeGeometry(r * 0.12, r * 0.3, 4),
                        M('#ffd23f', { metalness: 0.6, roughness: 0.25, emissive: new THREE.Color('#3a2a00') }),
                        Math.cos(a) * r * 0.5, r * 0.45, Math.sin(a) * r * 0.5);
                }
                // a gem
                add(new THREE.SphereGeometry(r * 0.12, 8, 8),
                    M('#ff4d6d', { emissive: new THREE.Color('#5a0010') }), 0, r * 0.22, r * 0.55);
                break;
            default: break;
        }
    }

    /* ----- LOWER COSTUME ------------------------------------------ */
    _buildLower(prop) {
        const r = this.r;
        if (this.lowerGroup) { this.bodyScale.remove(this.lowerGroup); this._disposeNode(this.lowerGroup); }
        this.lowerGroup = new THREE.Group();
        this.bodyScale.add(this.lowerGroup);
        const g = this.lowerGroup;
        this._rocketFlames = null;
        const M = (col, opts) => this._mat(null, Object.assign({ color: new THREE.Color(col), roughness: 0.5 }, opts || {}));
        const add = (parent, geo, mat, x, y, z, rx, ry, rz) => {
            const m = new THREE.Mesh(this._geo(geo), mat);
            m.position.set(x || 0, y || 0, z || 0);
            if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
            m.castShadow = true; parent.add(m); return m;
        };
        switch (prop) {
            case 'shoes':
                for (const s of [+1, -1]) {
                    const sh = add(g, new THREE.SphereGeometry(r * 0.34, 10, 10), M('#f25c54'),
                        s * this.bodyR * 0.45, r * 0.18, r * 0.12);
                    sh.scale.set(1.15, 0.7, 1.5);
                    // attach to the matching leg so shoes move with the run cycle
                    g.remove(sh);
                    (s > 0 ? this.legL : this.legR).pivot.add(sh);
                    sh.position.set(0, -(this.legL.len + r * 0.27), r * 0.14);
                }
                break;
            case 'tutu':
                add(g, new THREE.TorusGeometry(r * 1.05, r * 0.32, 8, 18), M('#ff8fd0', { transparent: true, opacity: 0.9 }),
                    0, r * 0.95, 0, Math.PI / 2, 0, 0).scale.set(1, 0.6, 1);
                break;
            case 'tail': {
                const tail = add(g, new THREE.ConeGeometry(r * 0.45, r * 1.7, 8), M('#46d36a'),
                    0, r * 0.7, -this.bodyR * 0.9, -Math.PI / 2.3, 0, 0);
                this._tail = tail;            // gentle wag in update
                break;
            }
            case 'rocket': {
                this._rocketFlames = [];
                for (const s of [+1, -1]) {
                    const boot = add(g, new THREE.CylinderGeometry(r * 0.34, r * 0.4, r * 0.55, 12), M('#c0c6d0', { metalness: 0.5, roughness: 0.3 }),
                        s * this.bodyR * 0.45, r * 0.32, 0);
                    const flame = add(g, new THREE.ConeGeometry(r * 0.3, r * 0.8, 10),
                        M('#ff7a2c', { emissive: new THREE.Color('#ff5a1c'), transparent: true, opacity: 0.92 }),
                        s * this.bodyR * 0.45, -r * 0.2, 0, Math.PI, 0, 0);
                    const core = add(g, new THREE.ConeGeometry(r * 0.15, r * 0.5, 8),
                        M('#ffd23f', { emissive: new THREE.Color('#ffcf3f'), transparent: true, opacity: 0.95 }),
                        s * this.bodyR * 0.45, -r * 0.12, 0, Math.PI, 0, 0);
                    this._rocketFlames.push(flame, core);
                }
                break;
            }
            case 'gold':
                for (const s of [+1, -1]) {
                    const sh = add(g, new THREE.SphereGeometry(r * 0.36, 10, 10),
                        M('#ffd23f', { metalness: 0.7, roughness: 0.22, emissive: new THREE.Color('#3a2a00') }),
                        0, 0, 0);
                    sh.scale.set(1.15, 0.75, 1.55);
                    g.remove(sh);
                    (s > 0 ? this.legL : this.legR).pivot.add(sh);
                    sh.position.set(0, -(this.legL.len + r * 0.27), r * 0.14);
                }
                break;
            default: break;
        }
    }

    /* =================================================================
       LIVE APPEARANCE SWAP
       ================================================================= */
    setAppearance(appearance) {
        if (!appearance) return;
        const prev = this.appearance;
        this.appearance = Object.assign({}, prev, appearance);

        // colour-driven materials
        if (this._materials.body) this._materials.body.color.set(this.appearance.color);
        if (this._materials.armL) this._materials.armL.color.set(this.appearance.color);
        if (this._materials.armR) this._materials.armR.color.set(this.appearance.color);
        if (this._materials.leg) this._materials.leg.color.copy(this._shade(this.appearance.color, -0.18));
        if (this._materials.visor) {
            this._materials.visor.color.set(this.appearance.visor);
            this._materials.visor.emissive.copy(new THREE.Color(this.appearance.visor).multiplyScalar(0.12));
        }

        // pattern: rebuild only when it (or base colour) changed
        if (appearance.pattern !== undefined && appearance.pattern !== prev.pattern ||
            appearance.color !== undefined && appearance.color !== prev.color) {
            this._buildPattern();
        }
        // costumes: rebuild only on change
        if (appearance.upper !== undefined && appearance.upper !== prev.upper) this._buildUpper(this.appearance.upper);
        if (appearance.lower !== undefined && appearance.lower !== prev.lower) this._buildLower(this.appearance.lower);
    }

    /* =================================================================
       UPDATE — position, orient, animate
       ================================================================= */
    update(bean, dt, t) {
        if (!bean) return;
        dt = (typeof dt === 'number' && dt > 0) ? Math.min(dt, 0.1) : 0.016;
        t = (typeof t === 'number') ? t : (this._t + dt);
        this._t = t;
        const r = this.r;

        // ---- world placement (the critical mapping) -----------------
        this.root.position.set(bean.x || 0, bean.z || 0, bean.y || 0);
        this.root.rotation.y = Math.PI / 2 - (bean.facing || 0);

        // ---- derived state ------------------------------------------
        const speed = Math.hypot(bean.vx || 0, bean.vy || 0);
        const grounded = !!bean.grounded;
        const airborne = (bean.z || 0) > 1 && !bean.falling;
        const diveT = bean.diveT || 0;
        const proneT = bean.proneT || 0;
        const ragdoll = bean.ragdoll || 0;
        const falling = !!bean.falling;
        const squash = (typeof bean.squash === 'number') ? bean.squash : 1;
        const emote = bean.emoteAnim || null;
        const emoteT = bean.emoteT || 0;
        const canEmote = emote && emoteT > 0 && grounded && ragdoll <= 0 && diveT <= 0 && !falling;

        // smoothing helper
        const P = this.pose;
        const lp = (key, target, rate) => { P[key] += (target - P[key]) * Math.min(1, rate * dt); };
        // direct exponential blend toward 0 baseline for unused DOFs
        const RATE = 14;       // general pose blend speed

        // ---- build TARGET pose (start from neutral each frame) -------
        const T = this._target || (this._target = {});
        for (const k in P) T[k] = 0;
        T.sx = 1; T.sy = 1; T.sz = 1; T.eyeOpen = 1; T.armScale = 1;
        // default rest: arms out a touch
        T.armLRoll = 0.18; T.armRRoll = 0.18;

        // ===== priority chain: ragdoll/fall > dive/prone > airborne >
        //       emote > run > idle. Each writes targets; blending = smooth.
        let handledBody = false;

        if (ragdoll > 0 || falling) {
            this._poseRagdoll(bean, T, dt, t);
            handledBody = true;
        } else if (diveT > 0) {
            this._poseDive(bean, T, diveT);
            handledBody = true;
        } else if (proneT > 0) {
            this._posePone(bean, T, proneT);
            handledBody = true;
        }

        if (!handledBody) {
            if (airborne) this._poseAir(bean, T, squash);

            if (canEmote) {
                this._poseEmote(emote, T, emoteT, dt, t);
            } else if (!airborne) {
                if (speed > 6) this._poseRun(bean, T, speed, dt, t);
                else this._poseIdle(bean, T, dt, t);
            }
            // squash & stretch from sim (combine multiplicatively with pose)
            this._applySquash(T, squash, airborne);
        } else {
            this._spinExtra = 0; // reset emote spin when interrupted
            this._emotePhase = 0;
        }

        // eye blink overrides everything (cheap, always)
        if (typeof bean.blink === 'number' && bean.blink < 0.12) T.eyeOpen = 0.12;

        // pupils track movement direction (in body-local +Z forward space)
        // logical movement dir relative to facing -> mostly forward; add a
        // little horizontal lead based on velocity heading vs facing.
        let lookX = 0;
        if (speed > 4) {
            const moveAng = Math.atan2(bean.vy || 0, bean.vx || 0);
            const rel = this._angDiff(bean.facing || 0, moveAng);
            lookX = Math.max(-1, Math.min(1, rel * 0.8 + Math.sin(t * 0.7) * 0.05));
        } else {
            lookX = Math.sin(t * 0.6) * 0.25;     // idle gaze wander
        }
        T.lookX = lookX;
        T.lookY = -0.15 + (airborne ? 0.3 : 0);

        // ---- blend pose toward targets ------------------------------
        for (const k in P) {
            // scale & eye values blend a touch faster for snappy squash
            const rate = (k === 'sx' || k === 'sy' || k === 'sz' || k === 'eyeOpen') ? RATE * 1.6 : RATE;
            lp(k, T[k], rate);
        }

        // ---- commit pose to scene graph -----------------------------
        this._commit(bean, dt, t, { ragdoll, falling, diveT, proneT });
    }

    /* ---- pose generators ---------------------------------------- */
    _poseIdle(bean, T, dt, t) {
        this._idlePhase += dt * 2.0;
        const ph = this._idlePhase;
        // gentle breathe: body scales subtly + slight bob handled in commit
        T.sy = 1 + Math.sin(ph) * 0.03;
        T.sx = 1 - Math.sin(ph) * 0.02;
        T.sz = 1 - Math.sin(ph) * 0.02;
        // tiny sway
        T.bodyRoll = Math.sin(ph * 0.5) * 0.04;
        T.headRoll = Math.sin(ph * 0.5 + 0.4) * 0.05;
        T.headYaw = Math.sin(ph * 0.33) * 0.08;
        // arms dangle with faint motion
        T.armLRoll = 0.2 + Math.sin(ph) * 0.03;
        T.armRRoll = 0.2 - Math.sin(ph) * 0.03;
        T.armLPitch = Math.sin(ph * 0.7) * 0.04;
        T.armRPitch = -Math.sin(ph * 0.7) * 0.04;
        this._breatheBob = Math.sin(ph) * (this.r * 0.05);
    }

    _poseRun(bean, T, speed, dt, t) {
        // cadence & amplitude scale with speed
        const sp = Math.min(speed, 320);
        const cadence = 6 + sp * 0.035;       // rad/s
        this._runPhase += dt * cadence;
        const ph = this._runPhase;
        const amp = Math.min(1, 0.35 + sp / 320);   // 0.35..1

        const swing = Math.sin(ph) * amp;
        const swing2 = Math.sin(ph + Math.PI) * amp;
        // legs swing opposite each other
        T.legLPitch = swing * 0.9;
        T.legRPitch = swing2 * 0.9;
        // arms counter-swing
        T.armLPitch = swing2 * 0.7;
        T.armRPitch = swing * 0.7;
        T.armLRoll = 0.12; T.armRRoll = 0.12;
        // body bob (twice per cycle) + forward lean
        this._runBob = Math.abs(Math.sin(ph)) * (this.r * 0.12) * amp;
        T.bodyPitch = -(0.12 + amp * 0.18);    // lean forward (negative pitch = nose down +Z)
        T.bodyRoll = Math.sin(ph) * 0.06 * amp;
        T.headPitch = (0.06 + amp * 0.06);     // counter the lean so face stays up
        T.headYaw = Math.sin(ph) * 0.04;
    }

    _poseAir(bean, T, squash) {
        // legs tuck up, slight stretch (combined with squash in _applySquash)
        T.legTuck = 1;
        T.legLPitch = -1.0;
        T.legRPitch = -1.0;
        // arms out for balance
        T.armLRoll = 0.6; T.armRRoll = 0.6;
        T.armLPitch = -0.2; T.armRPitch = -0.2;
        const rising = (bean.vz || 0) > 0;
        T.bodyPitch = rising ? -0.1 : 0.05;
    }

    _poseDive(bean, T, diveT) {
        // pitch whole body forward ~70 deg, arms thrown forward (superman)
        const k = Math.min(1, diveT / 0.42);       // 1 at start of dive
        T.bodyPitch = -1.22 * (0.4 + 0.6 * k);     // up to ~ -70deg (nose toward +Z)
        T.armLRoll = 1.5; T.armRRoll = 1.5;        // arms up to horizontal
        T.armLPitch = -1.3; T.armRPitch = -1.3;    // and thrown forward
        T.legLPitch = 0.5; T.legRPitch = 0.5;      // legs trail back
        T.legTuck = 0.3;
        T.headPitch = 0.5;                         // look forward
        T.sx = 1.12; T.sy = 0.92; T.sz = 1.12;     // slight flatten/stretch
    }

    _posePone(bean, T, proneT) {  // prone = flattened, lying down, recovering
        const k = Math.min(1, proneT / 0.4);       // 1 right after landing
        // flattened: wider & shorter, face-down then popping back up as k->0
        T.bodyPitch = -1.35 * k;                   // lying forward
        T.sx = 1 + 0.25 * k;
        T.sy = 1 - 0.25 * k;
        T.sz = 1 + 0.15 * k;
        T.armLRoll = 1.2 * k; T.armRRoll = 1.2 * k;
        T.armLPitch = -0.8 * k; T.armRPitch = -0.8 * k;
        T.legLPitch = 0.3 * k; T.legRPitch = 0.3 * k;
        T.headPitch = 0.4 * k;
    }

    _poseRagdoll(bean, T, dt, t) {
        // limbs flail loosely; the actual tumble rotation is applied in commit
        // using bean.spin across multiple axes.
        const f = t * 9;
        T.armLPitch = Math.sin(f * 1.3) * 1.4;
        T.armRPitch = Math.sin(f * 1.1 + 2) * 1.4;
        T.armLRoll = 0.5 + Math.sin(f * 0.9) * 0.7;
        T.armRRoll = 0.5 + Math.sin(f * 0.8 + 1) * 0.7;
        T.legLPitch = Math.sin(f * 1.2 + 1) * 1.1;
        T.legRPitch = Math.sin(f * 1.05) * 1.1;
        T.legTuck = 0.4;
        T.headRoll = Math.sin(f * 0.7) * 0.4;
        T.headPitch = Math.sin(f * 0.6) * 0.3;
        T.eyeOpen = 0.3;                            // dazed
        T.sx = 1.05; T.sy = 0.96;
    }

    _poseEmote(anim, T, emoteT, dt, t) {
        // fade-in/out factor so emote starts/ends gently (1.8s total)
        const total = 1.8;
        const age = total - emoteT;
        const fade = Math.min(1, Math.min(age, emoteT) * 3.5);
        this._emotePhase += dt;
        const ph = this._emotePhase;
        const blend = (base, val) => base + (val - base) * fade;

        switch (anim) {
            case 'wave': {
                // raise right arm and wave it
                T.armRRoll = blend(0.18, 2.5);
                T.armRPitch = blend(0, -0.2);
                T.armRYaw = Math.sin(ph * 9) * 0.5 * fade;
                T.headRoll = Math.sin(ph * 9) * 0.06 * fade;
                T.armLRoll = 0.18;
                break;
            }
            case 'dance': {
                // chicken dance: bob side to side + flap arms like wings
                const side = Math.sin(ph * 6);
                T.bodyRoll = side * 0.22 * fade;
                T.headRoll = side * 0.18 * fade;
                const flap = Math.abs(Math.sin(ph * 6)) * fade;
                T.armLRoll = blend(0.18, 1.3 + flap * 0.5);
                T.armRRoll = blend(0.18, 1.3 + flap * 0.5);
                T.armLPitch = -flap * 0.3; T.armRPitch = -flap * 0.3;
                this._danceBob = Math.abs(side) * this.r * 0.12;
                break;
            }
            case 'crouch': {
                // repeated squat (t-bag)
                const c = (Math.sin(ph * 7) * 0.5 + 0.5) * fade;
                T.crouch = c;
                T.sy = 1 - c * 0.3; T.sx = 1 + c * 0.18; T.sz = 1 + c * 0.1;
                T.legLPitch = c * 0.6; T.legRPitch = c * 0.6;
                T.armLPitch = c * 0.4; T.armRPitch = c * 0.4;
                break;
            }
            case 'think': {
                // tilt head, right hand (arm) to chin
                T.headRoll = blend(0, 0.35);
                T.headPitch = blend(0, 0.12);
                T.armRRoll = blend(0.18, 1.55);
                T.armRPitch = blend(0, -1.0);
                T.armRYaw = blend(0, -0.6);
                T.armRScale = 1;
                T.armLRoll = 0.1;
                T.bodyRoll = blend(0, 0.05) + Math.sin(ph) * 0.01;
                break;
            }
            case 'flex': {
                // both arms up flexing, body puffs
                T.armLRoll = blend(0.18, 1.6);
                T.armRRoll = blend(0.18, 1.6);
                T.armLPitch = blend(0, -1.7);     // forearms up
                T.armRPitch = blend(0, -1.7);
                T.armLYaw = 0.6; T.armRYaw = -0.6;
                const puff = (0.6 + Math.sin(ph * 4) * 0.4) * fade;
                T.puff = puff;
                T.sx = 1 + puff * 0.12; T.sz = 1 + puff * 0.12; T.sy = 1 + puff * 0.04;
                T.bodyPitch = -0.05;
                break;
            }
            case 'spin': {
                // spin the whole bean around Y once or twice over the emote
                // accumulate extra yaw; eased so it does ~2 turns then settles.
                const turns = 2;
                const target = turns * Math.PI * 2 * Math.min(1, age / (total * 0.8));
                this._spinExtra = target;
                T.armLRoll = 0.9; T.armRRoll = 0.9;   // arms out while spinning
                T.armLPitch = 0.2; T.armRPitch = 0.2;
                this._danceBob = Math.abs(Math.sin(age / total * Math.PI)) * this.r * 0.15;
                break;
            }
            case 'point': {
                // thrust right arm forward pointing
                T.armRRoll = blend(0.18, 1.4);
                T.armRPitch = blend(0, -1.45);    // point forward (+Z)
                T.armRScale = blend(1, 1.15);
                T.bodyPitch = blend(0, -0.12);    // lean into the point
                T.headPitch = 0.1;
                T.armLRoll = 0.12; T.armLPitch = 0.2;
                break;
            }
            case 'heart': {
                // arms make a heart overhead, gentle bounce
                T.armLRoll = blend(0.18, 2.7);
                T.armRRoll = blend(0.18, 2.7);
                T.armLPitch = blend(0, -0.5);
                T.armRPitch = blend(0, -0.5);
                T.armLYaw = blend(0, 0.7); T.armRYaw = blend(0, -0.7);
                T.armScale = blend(1, 0.85);
                this._danceBob = (Math.sin(ph * 4) * 0.5 + 0.5) * this.r * 0.1 * fade;
                T.headPitch = -0.08;
                break;
            }
            default: break;
        }
        // separate per-arm scale used by think/point
        if (T.armRScale === undefined) T.armRScale = 1;
    }

    _applySquash(T, squash, airborne) {
        // bean.squash ~1; <1 squashed wider/shorter, >1 taller/thinner.
        // Combine with any pose-driven scale already in T (multiplicative).
        let sy = squash;
        let sxz = 1 / Math.sqrt(Math.max(0.0001, squash));   // preserve volume
        if (airborne) { sy *= 1.04; sxz *= 0.98; }
        T.sy *= sy;
        T.sx *= sxz;
        T.sz *= sxz;
    }

    /* ---- commit pose to the scene graph ------------------------- */
    _commit(bean, dt, t, st) {
        const r = this.r, P = this.pose;

        // --- tumble (ragdoll / falling): rotate on multiple axes -----
        if (st.ragdoll > 0 || st.falling) {
            const s = bean.spin || 0;
            this.tumble.rotation.set(s * 1.0, s * 0.6, s * 0.8);
        } else {
            // ease tumble back to zero so recovery isn't a snap
            const e = this.tumble.rotation;
            e.x += (0 - e.x) * Math.min(1, 12 * dt);
            e.y += (0 - e.y) * Math.min(1, 12 * dt);
            e.z += (0 - e.z) * Math.min(1, 12 * dt);
        }

        // --- body lean / dive pitch (around X = pitch in world) ------
        // We pitch about X so the bean tips toward +Z (its forward).
        this.lean.rotation.x = P.bodyPitch;
        this.lean.rotation.z = P.bodyRoll;

        // --- spin-emote: extra yaw on root (kept separate from facing) -
        // Apply on top of the facing-derived yaw set in update().
        if (this._spinExtra) this.root.rotation.y += this._spinExtra;

        // --- vertical bob (breathe / run / crouch / emote bounce) ----
        let bobY = 0;
        bobY += this._breatheBob || 0;
        bobY += this._runBob || 0;
        bobY += this._danceBob || 0;
        bobY -= (P.crouch || 0) * r * 0.5;
        this.bob.position.y = bobY;
        // decay one-shot bob accumulators so stale frames don't linger
        this._breatheBob = (this._breatheBob || 0) * 0.6;
        this._runBob = (this._runBob || 0) * 0.5;
        this._danceBob = (this._danceBob || 0) * 0.5;

        // --- body squash/stretch + puff ------------------------------
        const puff = 1 + (P.puff || 0) * 0;   // puff already folded into sx/sz
        this.bodyScale.scale.set(P.sx, P.sy, P.sz);

        // --- head ----------------------------------------------------
        this.headPivot.rotation.set(P.headPitch, P.headYaw, P.headRoll);
        if (this.face) this.face.rotation.set(P.headPitch * 0.6, P.headYaw * 0.6, P.headRoll * 0.6);

        // --- arms ----------------------------------------------------
        // pivot rotation: roll (Z) raises out to side, pitch (X) swings f/b,
        // yaw (Y) twists. Left arm is +X side, mirror the roll sign.
        const aL = this.armL.pivot, aR = this.armR.pivot;
        aL.rotation.set(P.armLPitch, P.armLYaw, +P.armLRoll);
        aR.rotation.set(P.armRPitch, P.armRYaw, -P.armRRoll);
        const armScale = P.armScale || 1;
        const rArmScale = (this._target && this._target.armRScale) || 1;
        this.armL.pivot.scale.y = armScale;
        this.armR.pivot.scale.y = armScale * rArmScale;

        // --- legs ----------------------------------------------------
        const tuck = P.legTuck || 0;
        const lL = this.legL.pivot, lR = this.legR.pivot;
        lL.rotation.set(P.legLPitch, 0, 0);
        lR.rotation.set(P.legRPitch, 0, 0);
        // tuck pulls feet up toward the body (raise hip pivot)
        lL.position.y = r * 0.62 + tuck * r * 0.35;
        lR.position.y = r * 0.62 + tuck * r * 0.35;

        // --- eyes: blink (scale Y) + pupil tracking ------------------
        for (const e of this.eyes) {
            e.group.scale.y = Math.max(0.08, P.eyeOpen);
            e.pupil.position.x = P.lookX * r * 0.1;
            e.pupil.position.y = P.lookY * r * 0.06;
        }

        // --- prop flourishes -----------------------------------------
        if (this._tail) {
            this._tail.rotation.z = Math.sin(t * 4) * 0.18;   // wag
        }
        if (this._rocketFlames) {
            const flick = 0.7 + Math.sin(t * 30) * 0.3;
            for (const f of this._rocketFlames) {
                f.scale.y = flick;
                if (f.material) f.material.opacity = 0.7 + Math.sin(t * 24 + f.id) * 0.2;
            }
        }
    }

    /* ---- small math helpers ------------------------------------- */
    _angDiff(a, b) {
        let d = b - a;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return d;
    }

    /* =================================================================
       DISPOSAL
       ================================================================= */
    _disposeNode(node) {
        node.traverse((o) => {
            if (o.geometry && o.geometry.dispose) o.geometry.dispose();
            if (o.material) {
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                for (const m of mats) { if (m.map && m.map.dispose) m.map.dispose(); if (m.dispose) m.dispose(); }
            }
        });
    }

    dispose() {
        for (const d of this._disposables) { if (d && d.dispose) d.dispose(); }
        for (const k in this._textures) { const tx = this._textures[k]; if (tx && tx.dispose) tx.dispose(); }
        if (this._patternTex && this._patternTex.dispose) this._patternTex.dispose();
        this._disposables = [];
        this._materials = {};
        this._textures = {};
    }
}

// Make available without modules (browser global / Node global) without
// using `export`. In the game this file is concatenated/loaded so the bare
// class declaration is enough; this guard just helps the self-test eval.
if (typeof module !== 'undefined' && module.exports) {
    module.exports = BeanView;
}

/* =================== view_world =================== */
/* =====================================================================
   view_world.js — the 3D world for Bean Royale (Fall Guys tribute).
   Procedural Three.js (r160) scene graph: NO external assets, NO WebGL
   renderer calls. We only build / update Object3D graphs.

   Coordinate mapping (sim is top-down logical X/Y, Z = height; world is
   Y-up):  logical (x, y) at height z  ->  world (x, z, y).
   "Up the race course" is decreasing logical y  (toward world -Z).

   Top-level symbols (no import/export/require; `THREE` is a free var):
     setupEnvironment(scene) -> {sun, hemi, sky, update(dt,t)}
     makeObstacleView(ob)    -> {object3d, update(ob,dt,t), dispose()}
     class CourseView        -> course geometry per round
   ===================================================================== */

/* logical (x, y) at height z -> world Vector3 (x, z, y) */
const W = (x, y, z = 0) => new THREE.Vector3(x, z, y);

/* ---------------------------------------------------------------------
   Small shared helpers
   ------------------------------------------------------------------- */

// parse a CSS hex / named color into a THREE.Color (safe fallback).
function col(c, fallback) {
    try {
        if (c instanceof THREE.Color) return c.clone();
        if (c == null) return new THREE.Color(fallback != null ? fallback : 0xffffff);
        return new THREE.Color(c);
    } catch (e) {
        return new THREE.Color(fallback != null ? fallback : 0xffffff);
    }
}

// lighten (t>0) / darken (t<0) a color toward white / black.
function shade(c, t) {
    const out = c.clone();
    if (t >= 0) out.lerp(new THREE.Color(0xffffff), t);
    else out.lerp(new THREE.Color(0x000000), -t);
    return out;
}

// standard playful material.
function mat(color, opts) {
    opts = opts || {};
    return new THREE.MeshStandardMaterial(Object.assign({
        color: col(color, 0xffffff),
        roughness: opts.roughness != null ? opts.roughness : 0.62,
        metalness: opts.metalness != null ? opts.metalness : 0.04,
    }, opts.emissive != null ? { emissive: col(opts.emissive, 0x000000) } : {},
       opts.emissiveIntensity != null ? { emissiveIntensity: opts.emissiveIntensity } : {},
       opts.transparent ? { transparent: true } : {},
       opts.opacity != null ? { opacity: opts.opacity } : {},
       opts.side != null ? { side: opts.side } : {}));
}

// flag a mesh (and descendants) to cast / receive shadows.
function shadowy(obj, cast, receive) {
    obj.traverse((o) => {
        if (o.isMesh) {
            if (cast != null) o.castShadow = cast;
            if (receive != null) o.receiveShadow = receive;
        }
    });
    return obj;
}

// recursively dispose geometries + materials under a root.
function disposeTree(root) {
    if (!root) return;
    root.traverse((o) => {
        if (o.geometry && o.geometry.dispose) o.geometry.dispose();
        if (o.material) {
            const ms = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of ms) {
                if (m.map && m.map.dispose) m.map.dispose();
                if (m.dispose) m.dispose();
            }
        }
    });
    if (root.parent) root.parent.remove(root);
}

/* ---------------------------------------------------------------------
   ENVIRONMENT — lights, sky dome, fog.
   ------------------------------------------------------------------- */
function setupEnvironment(scene) {
    // --- soft hemisphere ambient (sky tint over ground tint) ---
    const hemi = new THREE.HemisphereLight(0xbfeaff, 0xf3b9e0, 0.85);
    hemi.position.set(0, 1600, 0);
    scene.add(hemi);

    // --- gentle fill so shadowed sides aren't muddy ---
    const ambient = new THREE.AmbientLight(0xffffff, 0.18);
    scene.add(ambient);

    // --- the sun: directional key light with a big shadow frustum ---
    const sun = new THREE.DirectionalLight(0xfff4e0, 2.0);
    sun.position.set(-700, 1500, 900);     // up & to the side, behind start
    sun.target.position.set(0, 0, -200);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const sc = sun.shadow.camera;
    sc.left = -1400; sc.right = 1400;
    sc.top = 1400; sc.bottom = -1400;
    sc.near = 10; sc.far = 4200;
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 1.0;
    scene.add(sun);
    scene.add(sun.target);

    // --- sky dome: big back-side sphere with vertical gradient ---
    const skyColTop = new THREE.Color(0x5ad1ff);   // PAL.skyTop
    const skyColBot = new THREE.Color(0xd8f4ff);   // brighter near horizon
    const skyGeo = new THREE.SphereGeometry(6000, 32, 16);
    let skyMat;
    if (typeof document !== 'undefined' && document.createElement) {
        // gradient via CanvasTexture (browser path)
        const cv = document.createElement('canvas');
        cv.width = 8; cv.height = 256;
        const g2d = cv.getContext('2d');
        const grad = g2d.createLinearGradient(0, 0, 0, 256);
        grad.addColorStop(0.0, '#3aa9ff');   // zenith
        grad.addColorStop(0.55, '#7fd8ff');
        grad.addColorStop(1.0, '#dff6ff');    // horizon
        g2d.fillStyle = grad;
        g2d.fillRect(0, 0, 8, 256);
        const tex = new THREE.CanvasTexture(cv);
        tex.needsUpdate = true;
        skyMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false });
    } else {
        // Node / headless fallback: solid sky-blue
        skyMat = new THREE.MeshBasicMaterial({ color: skyColTop.clone().lerp(skyColBot, 0.4), side: THREE.BackSide, fog: false, depthWrite: false });
    }
    const sky = new THREE.Mesh(skyGeo, skyMat);
    sky.name = 'sky';
    sky.renderOrder = -1000;
    scene.add(sky);

    // also set a background color so the clear is pleasant even before sky draws
    scene.background = skyColTop.clone().lerp(skyColBot, 0.35);

    // --- gentle fog for depth (light blue) ---
    scene.fog = new THREE.Fog(0xbfe8ff, 1400, 5200);

    // --- a few drifting puffy clouds (cheap, decorative) ---
    const clouds = new THREE.Group();
    clouds.name = 'clouds';
    const cloudMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 1.0, metalness: 0.0,
        emissive: 0xffffff, emissiveIntensity: 0.25, fog: false,
    });
    const cloudSeeds = [];
    for (let i = 0; i < 7; i++) {
        const puff = new THREE.Group();
        const lobes = 3 + (i % 3);
        for (let j = 0; j < lobes; j++) {
            const r = 120 + ((i * 53 + j * 37) % 90);
            const m = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), cloudMat);
            m.position.set((j - lobes / 2) * 130, ((i + j) % 2) * 40, (j % 2) * 60);
            m.scale.set(1, 0.6, 1);
            puff.add(m);
        }
        const ang = (i / 7) * Math.PI * 2;
        const dist = 2600 + (i % 4) * 350;
        puff.position.set(Math.cos(ang) * dist, 1500 + (i % 3) * 260, Math.sin(ang) * dist - 600);
        clouds.add(puff);
        cloudSeeds.push({ puff, baseX: puff.position.x, speed: 8 + (i % 5) * 3 });
    }
    scene.add(clouds);

    return {
        sun, hemi, sky, clouds, ambient,
        update(dt, t) {
            t = t || 0;
            // drift clouds slowly along world X, wrapping around.
            for (const cs of cloudSeeds) {
                cs.puff.position.x = cs.baseX + Math.sin(t * 0.02 + cs.baseX) * 60 + (t * cs.speed) % 6000;
                if (cs.puff.position.x > 4200) cs.puff.position.x -= 8400;
            }
        },
    };
}

/* ---------------------------------------------------------------------
   OBSTACLE VIEWS
   makeObstacleView(ob) dispatches on ob.kind.  Each returns
   { object3d, update(ob,dt,t), dispose() }.
   ------------------------------------------------------------------- */

// arms of a spinner sit higher when it's an overhead bar vs a low sweeper.
function spinnerLift(ob) {
    return (ob.height != null && ob.height < 200) ? 10 : 34;
}

function makeSpinner(ob) {
    const group = new THREE.Object3D();
    group.position.copy(W(ob.cx, ob.cy, 0));

    const color = col(ob.color, 0xff5fa2);
    const thick = ob.thick || 18;
    const len = ob.len || 200;
    const arms = Math.max(1, ob.arms || 2);
    const lift = spinnerLift(ob);

    // central post from ground up to the arms, + a hub.
    const postMat = mat(shade(color, -0.25), { roughness: 0.5 });
    const post = new THREE.Mesh(new THREE.CylinderGeometry(thick * 0.6, thick * 0.8, lift + thick, 16), postMat);
    post.position.set(0, (lift + thick) / 2, 0);
    group.add(post);

    // the rotor carries the arms; we spin THIS about world Y.
    const rotor = new THREE.Object3D();
    rotor.position.set(0, lift + thick * 0.5, 0);
    group.add(rotor);

    const hubMat = mat(shade(color, -0.15), { roughness: 0.45, metalness: 0.1 });
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(thick * 1.1, thick * 1.1, thick * 1.3, 20), hubMat);
    rotor.add(hub);

    // each arm is a long box laid along +X, then rotated about Y into place.
    const armMat = mat(color, { roughness: 0.5, metalness: 0.06 });
    const capMat = mat(shade(color, 0.35), { roughness: 0.4 });
    for (let i = 0; i < arms; i++) {
        const a = (i * Math.PI * 2) / arms;           // matches sim _ends()
        const arm = new THREE.Object3D();
        arm.rotation.y = -a;   // logical angle a -> world -Y rotation (X/Y -> X/Z handedness)
        const bar = new THREE.Mesh(new THREE.BoxGeometry(len, thick, thick * 1.15), armMat);
        bar.position.set(len / 2, 0, 0);
        arm.add(bar);
        // rounded paddle cap at the tip for a toy look.
        const cap = new THREE.Mesh(new THREE.SphereGeometry(thick * 0.85, 14, 10), capMat);
        cap.position.set(len, 0, 0);
        arm.add(cap);
        rotor.add(arm);
    }

    shadowy(group, true, true);

    const view = {
        object3d: group,
        update(o, dt, t) {
            // sim drives ob.angle; mirror it. logical +angle (CCW in X/Y)
            // becomes -rotation.y in world (X right, Z = +logical-y).
            rotor.rotation.y = -((o && o.angle != null) ? o.angle : ob.angle || 0);
        },
        dispose() { disposeTree(group); },
    };
    view.update(ob, 0, 0);
    return view;
}

function makeHammer(ob) {
    const group = new THREE.Object3D();
    const cx = ob.cx, cy = ob.cy;
    const amp = ob.amp || 280;
    const headR = ob.headR || 30;
    // pivot height: hang the pendulum from a tower above the lane.
    const pivotH = Math.max(180, headR * 4 + 120);

    // support tower beside the lane so the pivot has something to hang from.
    const towerMat = mat(0x6a5acd, { roughness: 0.6 });
    const tower = new THREE.Mesh(new THREE.BoxGeometry(26, pivotH, 26), towerMat);
    tower.position.copy(W(cx - amp - 60, cy, pivotH / 2));
    group.add(tower);
    const tower2 = tower.clone();
    tower2.position.copy(W(cx + amp + 60, cy, pivotH / 2));
    group.add(tower2);
    // cross-beam between towers.
    const beam = new THREE.Mesh(new THREE.BoxGeometry((amp + 60) * 2, 22, 22), towerMat);
    beam.position.copy(W(cx, cy, pivotH));
    group.add(beam);

    // pivot pivots in the world ZX? No: head sweeps along logical X at depth cy,
    // so it swings in the world X/Y(height) plane -> rotate about world Z.
    const pivot = new THREE.Object3D();
    pivot.position.copy(W(cx, cy, pivotH));
    group.add(pivot);

    const armLen = pivotH - headR * 1.2;
    const armMat = mat(0x9a8cff, { roughness: 0.5, metalness: 0.1 });
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, armLen, 12), armMat);
    // cylinder default is along +Y; we want it hanging down from pivot.
    arm.position.set(0, -armLen / 2, 0);
    pivot.add(arm);

    const headMat = mat(0xffd23f, { roughness: 0.35, metalness: 0.2, emissive: 0x6b4a00, emissiveIntensity: 0.15 });
    const head = new THREE.Mesh(new THREE.SphereGeometry(headR, 22, 16), headMat);
    head.position.set(0, -armLen, 0);
    pivot.add(head);
    // a couple of "studs" so the swinging head reads as a mace.
    const studMat = mat(shade(col(0xffd23f), -0.2), { metalness: 0.3 });
    for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const stud = new THREE.Mesh(new THREE.ConeGeometry(headR * 0.28, headR * 0.5, 8), studMat);
        stud.position.set(Math.cos(a) * headR, -armLen + Math.sin(a) * headR, 0);
        stud.rotation.z = -a + Math.PI / 2;
        pivot.add(stud);
    }

    shadowy(group, true, true);

    // map a pendulum phase so head world-X = cx + sin(phase)*amp.
    // pivot rotates about world Z by angle theta; head sits at depth = arm*sin(theta)?
    // We instead drive a swing angle from asin(sin(phase)) clamped, so the head's
    // X offset = armLen*sin(theta). To honor amp exactly we scale: theta from
    // desired x-offset = sin(phase)*amp -> theta = asin(clamp(x/armLen)).
    function applyPhase(phase) {
        const desiredX = Math.sin(phase) * amp;
        const ratio = Math.max(-1, Math.min(1, desiredX / armLen));
        const theta = Math.asin(ratio);
        // rotate pivot about world Z so the down-hanging arm swings in X.
        pivot.rotation.z = theta;
    }

    const view = {
        object3d: group,
        update(o, dt, t) { applyPhase((o && o.phase != null) ? o.phase : (ob.phase || 0)); },
        dispose() { disposeTree(group); },
    };
    view.update(ob, 0, 0);
    return view;
}

function makeDoorWall(ob) {
    const group = new THREE.Object3D();
    const thick = ob.thick || 26;
    const doorH = 230;                     // tall enough that you can't peek over
    const y = ob.y;

    // door-frame posts at each end.
    const postMat = mat(0x5a4632, { roughness: 0.8 });
    const postGeo = new THREE.BoxGeometry(thick * 0.7, doorH + 40, thick + 18);
    for (const px of [ob.x0, ob.x1]) {
        const post = new THREE.Mesh(postGeo, postMat);
        post.position.copy(W(px, y, (doorH + 40) / 2));
        group.add(post);
    }

    // one swinging panel per segment. We parent each panel to a hinge so a
    // "broken" panel can swing open instead of just vanishing.
    const panelMat = mat(0xcaa46a, { roughness: 0.7, metalness: 0.05 });
    const panelInsetMat = mat(shade(col(0xcaa46a), 0.18), { roughness: 0.65 });
    const knobMat = mat(0xffd23f, { roughness: 0.3, metalness: 0.4 });
    const panels = [];
    for (const s of ob.segs) {
        const w = s.x1 - s.x0;
        const hinge = new THREE.Object3D();
        // hinge at the segment's left edge, on the ground.
        hinge.position.copy(W(s.x0, y, 0));
        group.add(hinge);

        const panel = new THREE.Object3D();
        panel.position.set(0, 0, 0);
        hinge.add(panel);

        const board = new THREE.Mesh(new THREE.BoxGeometry(w - 6, doorH, thick), panelMat);
        board.position.set(w / 2, doorH / 2, 0);
        panel.add(board);
        // recessed inset rectangle for a paneled-door look.
        const inset = new THREE.Mesh(new THREE.BoxGeometry((w - 6) * 0.62, doorH * 0.72, thick * 0.4), panelInsetMat);
        inset.position.set(w / 2, doorH / 2, thick * 0.42);
        panel.add(inset);
        const inset2 = inset.clone();
        inset2.position.set(w / 2, doorH / 2, -thick * 0.42);
        panel.add(inset2);
        // door knob near the free edge.
        const knob = new THREE.Mesh(new THREE.SphereGeometry(7, 12, 10), knobMat);
        knob.position.set(w - 12, doorH * 0.5, thick * 0.5 + 4);
        panel.add(knob);

        panels.push({ seg: s, hinge, panel, board, openT: 0, dropped: false });
    }

    shadowy(group, true, true);

    const view = {
        object3d: group,
        update(o, dt, t) {
            const segs = (o && o.segs) ? o.segs : ob.segs;
            for (let i = 0; i < panels.length; i++) {
                const p = panels[i];
                const seg = segs[i] || p.seg;
                if (seg.broken) {
                    // swing open + slowly tip away once broken.
                    p.openT = Math.min(1, p.openT + (dt || 0.016) * 4.5);
                    p.hinge.rotation.y = -p.openT * (Math.PI * 0.62);   // swing about hinge
                    p.panel.rotation.z = -p.openT * 0.15;               // slight sag
                    p.board.visible = true;
                } else {
                    p.openT = 0;
                    p.hinge.rotation.y = 0;
                    p.panel.rotation.z = 0;
                    p.board.visible = true;
                }
            }
        },
        dispose() { disposeTree(group); },
    };
    view.update(ob, 0, 0);
    return view;
}

function makeBouncePad(ob) {
    const group = new THREE.Object3D();
    group.position.copy(W(ob.x, ob.y, 0));
    const r = ob.r || 38;

    // a low cushioned disc: base ring + springy top dome we squash over time.
    const baseMat = mat(0xff3f86, { roughness: 0.5 });
    const base = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.05, r * 1.15, 8, 28), baseMat);
    base.position.set(0, 4, 0);
    group.add(base);

    // the bouncy part — its scale.y pulses.
    const padMat = mat(0xff5fa2, { roughness: 0.35, metalness: 0.05, emissive: 0x5a1030, emissiveIntensity: 0.2 });
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.92, 16, 28), padMat);
    pad.position.set(0, 14, 0);
    group.add(pad);

    // white rim accent.
    const rimMat = mat(0xffffff, { roughness: 0.4 });
    const rim = new THREE.Mesh(new THREE.TorusGeometry(r * 0.98, 3.2, 8, 28), rimMat);
    rim.rotation.x = Math.PI / 2;
    rim.position.set(0, 22, 0);
    group.add(rim);

    // a chevron/arrow on top hinting "bounce up".
    const arrowMat = mat(0xffffff, { roughness: 0.4, emissive: 0xffffff, emissiveIntensity: 0.15 });
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(r * 0.42, r * 0.5, 4), arrowMat);
    arrow.position.set(0, 30, 0);
    arrow.rotation.y = Math.PI / 4;
    group.add(arrow);

    shadowy(group, true, true);

    const baseY = 14;
    const view = {
        object3d: group,
        update(o, dt, t) {
            // sim resets BouncePad.t to 0 on bounce; we don't get t here,
            // so animate a gentle idle breathing + a time-based pulse so the
            // pad always looks springy/alive.
            const tt = t || 0;
            const breathe = 0.06 * Math.sin(tt * 3.0 + ob.x * 0.01);
            const sQ = 1 + breathe;          // squash factor
            pad.scale.y = sQ;
            pad.position.y = baseY - (1 - sQ) * 8;
            arrow.position.y = 30 + breathe * 14 + 2 * Math.sin(tt * 3.0 + ob.x * 0.01 + 1.2);
            arrow.rotation.y = Math.PI / 4 + tt * 0.6;
        },
        dispose() { disposeTree(group); },
    };
    view.update(ob, 0, 0);
    return view;
}

function makeHex(ob) {
    const group = new THREE.Object3D();
    const size = ob.size || 33;
    const depth = 26;                       // prism thickness (height of tile)
    group.position.copy(W(ob.cx, ob.cy, 0));

    const color = col(ob.color, 0x9a8cff);
    // CylinderGeometry with 6 radial segments == a hexagonal prism.
    // point-up to match sim's hexagon (a = π/3*i - π/2).
    const topMat = mat(color, { roughness: 0.55, metalness: 0.04 });
    const sideMat = mat(shade(color, -0.18), { roughness: 0.6 });
    const geo = new THREE.CylinderGeometry(size, size, depth, 6);
    // group materials: index 0 = side, 1 = top cap, 2 = bottom cap.
    const tile = new THREE.Mesh(geo, [sideMat, topMat, sideMat]);
    tile.position.set(0, depth / 2, 0);
    tile.rotation.y = Math.PI / 6;           // flat-top -> point-up orientation
    group.add(tile);

    // a thin bright bevel cap on top for the glossy candy look.
    const bevelMat = mat(shade(color, 0.3), { roughness: 0.35, emissive: shade(color, -0.4), emissiveIntensity: 0.1 });
    const bevel = new THREE.Mesh(new THREE.CylinderGeometry(size * 0.82, size * 0.9, depth * 0.18, 6), bevelMat);
    bevel.position.set(0, depth + depth * 0.06, 0);
    bevel.rotation.y = Math.PI / 6;
    group.add(bevel);

    shadowy(group, true, true);

    const baseY = group.position.y;
    let fallV = 0;            // accumulated drop velocity once dissolving/gone
    const view = {
        object3d: group,
        update(o, dt, t) {
            const state = (o && o.state) ? o.state : ob.state || 'solid';
            const d = dt || 0.016;
            if (state === 'solid') {
                group.position.y = baseY;
                group.position.x = ob.cx;        // (world X == logical x)
                group.rotation.y = 0;
                group.visible = true;
                tile.material[1].opacity = 1; tile.material[0].opacity = 1;
                fallV = 0;
            } else if (state === 'dissolving') {
                // shake horizontally + begin sinking & fading.
                const tt = t || 0;
                group.position.x = ob.cx + Math.sin(tt * 38) * 2.2;
                fallV += d * 120;
                group.position.y = baseY - fallV * 0.15;
                group.visible = true;
                // fade the caps a touch.
                for (const m of tile.material) {
                    m.transparent = true;
                    m.opacity = Math.max(0.35, m.opacity - d * 0.6);
                }
            } else { // 'gone'
                // drop away fast, then hide.
                fallV += d * 600;
                group.position.y = baseY - 200 - fallV;
                group.visible = group.position.y > baseY - 900;
            }
        },
        dispose() { disposeTree(group); },
    };
    view.update(ob, 0, 0);
    return view;
}

function makeObstacleView(ob) {
    switch (ob && ob.kind) {
        case 'spinner':   return makeSpinner(ob);
        case 'hammer':    return makeHammer(ob);
        case 'doorwall':  return makeDoorWall(ob);
        case 'bouncepad': return makeBouncePad(ob);
        case 'hex':       return makeHex(ob);
        default: {
            // unknown kind: harmless empty group so the engine never crashes.
            const g = new THREE.Object3D();
            return { object3d: g, update() {}, dispose() { disposeTree(g); } };
        }
    }
}

/* ---------------------------------------------------------------------
   COURSE VIEW — static round geometry.
   ------------------------------------------------------------------- */

// A reusable animated "slime" plane (pink, faint emissive shimmer).
function makeSlime(cx, cy, w, h, y) {
    const slimeMat = new THREE.MeshStandardMaterial({
        color: 0xd23bb0,
        roughness: 0.35,
        metalness: 0.0,
        emissive: 0x9c1f86,
        emissiveIntensity: 0.35,
    });
    const geo = new THREE.PlaneGeometry(w, h, 1, 1);
    const mesh = new THREE.Mesh(geo, slimeMat);
    mesh.rotation.x = -Math.PI / 2;          // lay flat on world XZ
    mesh.position.set(cx, y != null ? y : -2, cy);
    mesh.receiveShadow = true;
    return { mesh, slimeMat };
}

class CourseView {
    constructor(round) {
        this._root = new THREE.Object3D();
        this._root.name = 'course';
        this._disposables = [];
        this._anim = [];                  // [{fn}] called each update
        this._round = round || {};
        const kind = (round && round.kind) || 'race';
        if (kind === 'race') this._buildRace(round);
        else if (kind === 'survival') this._buildSurvival(round);
        else if (kind === 'final') this._buildFinal(round);
        else this._buildRace(round);
    }

    get object3d() { return this._root; }

    _add(obj) { this._root.add(obj); return obj; }

    // ---------------- RACE: long pastel track + curbs + finish + start ----
    _buildRace(r) {
        const minX = r.minX != null ? r.minX : 200;
        const maxX = r.maxX != null ? r.maxX : 1080;
        const minY = r.minY != null ? r.minY : 240;
        const maxY = r.maxY != null ? r.maxY : 2680;
        const finishY = r.finishY != null ? r.finishY : (minY + 180);
        const cx = r.cx != null ? r.cx : (minX + maxX) / 2;
        const w = maxX - minX;
        const len = maxY - minY;

        // --- the track slab (pastel blue), slightly raised over slime ---
        const trackMat = mat(0x7fd0ff, { roughness: 0.85, metalness: 0.0 });
        const track = new THREE.Mesh(new THREE.BoxGeometry(w, 18, len), trackMat);
        track.position.copy(W(cx, (minY + maxY) / 2, 9));
        track.receiveShadow = true;
        this._add(track);

        // subtle centre lane stripe (dashed look via a thin lighter slab).
        const stripeMat = mat(shade(col(0x7fd0ff), 0.22), { roughness: 0.8 });
        const dashLen = 90, gap = 70;
        for (let yy = minY + 60; yy < maxY - 60; yy += dashLen + gap) {
            const seg = Math.min(dashLen, maxY - 60 - yy);
            if (seg <= 0) break;
            const dash = new THREE.Mesh(new THREE.BoxGeometry(10, 2, seg), stripeMat);
            dash.position.copy(W(cx, yy + seg / 2, 18.6));
            dash.receiveShadow = true;
            this._add(dash);
        }

        // --- raised side walls / curbs ---
        const curbH = 70, curbT = 26;
        const curbMatA = mat(0xff5fa2, { roughness: 0.6 });   // candy pink
        const curbMatB = mat(0xffd23f, { roughness: 0.6 });   // gold accent stripe on top
        for (const side of [-1, 1]) {
            const wx = side < 0 ? minX - curbT / 2 : maxX + curbT / 2;
            const wall = new THREE.Mesh(new THREE.BoxGeometry(curbT, curbH, len), curbMatA);
            wall.position.copy(W(wx, (minY + maxY) / 2, curbH / 2));
            shadowy(wall, true, true);
            this._add(wall);
            const cap = new THREE.Mesh(new THREE.BoxGeometry(curbT + 6, 12, len), curbMatB);
            cap.position.copy(W(wx, (minY + maxY) / 2, curbH + 6));
            shadowy(cap, true, true);
            this._add(cap);
        }

        // --- decorative pink SLIME planes flanking the track (deadly look) ---
        const slimePad = 1400;
        for (const side of [-1, 1]) {
            const sx = side < 0 ? minX - slimePad / 2 - curbT : maxX + slimePad / 2 + curbT;
            const s = makeSlime(sx, (minY + maxY) / 2, slimePad, len + 800, -4);
            this._add(s.mesh);
            this._registerSlime(s);
        }
        // slime caps beyond the finish + behind the start too.
        const sFront = makeSlime(cx, minY - 500, w + slimePad * 2 + 400, 1000, -4);
        this._add(sFront.mesh); this._registerSlime(sFront);

        // --- CHECKERED finish line at logical depth finishY ---
        this._add(this._buildCheckerLine(minX, maxX, finishY, 19, 28));
        // finish gantry arch + "FINISH" banner bar.
        this._add(this._buildGantry(minX, maxX, finishY, 0xffd23f, 'finish'));

        // --- START gate near maxY ---
        const startY = maxY - 150;
        this._add(this._buildGantry(minX, maxX, startY, 0x7b46d6, 'start'));
        // start floor band.
        const bandMat = mat(0x7b46d6, { roughness: 0.6, emissive: 0x2a0f55, emissiveIntensity: 0.2 });
        const band = new THREE.Mesh(new THREE.BoxGeometry(w, 3, 26), bandMat);
        band.position.copy(W(cx, startY, 19.5));
        band.receiveShadow = true;
        this._add(band);
    }

    // black/white checker strip laid flat across the track at depth `dy`.
    _buildCheckerLine(minX, maxX, dy, yLevel, sq) {
        const g = new THREE.Object3D();
        const w = maxX - minX;
        const cols = Math.ceil(w / sq);
        const rows = 2;
        const black = mat(0x1c1c22, { roughness: 0.7 });
        const white = mat(0xf4f4f8, { roughness: 0.7 });
        for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
                const m = ((i + j) & 1) ? black : white;
                const cw = Math.min(sq, w - i * sq);
                if (cw <= 0) continue;
                const cell = new THREE.Mesh(new THREE.BoxGeometry(cw, 2, sq), m);
                cell.position.copy(W(minX + i * sq + cw / 2, dy - sq + j * sq + sq / 2, yLevel));
                cell.receiveShadow = true;
                g.add(cell);
            }
        }
        return g;
    }

    // a simple arch (two posts + top beam) with a colored banner bar.
    _buildGantry(minX, maxX, dy, color, label) {
        const g = new THREE.Object3D();
        const h = 300, postT = 26;
        const postMat = mat(shade(col(color), -0.2), { roughness: 0.5, metalness: 0.1 });
        for (const px of [minX - 6, maxX + 6]) {
            const post = new THREE.Mesh(new THREE.CylinderGeometry(postT * 0.5, postT * 0.6, h, 12), postMat);
            post.position.copy(W(px, dy, h / 2));
            shadowy(post, true, true);
            g.add(post);
        }
        const beamMat = mat(color, { roughness: 0.45, emissive: shade(col(color), -0.5), emissiveIntensity: 0.25 });
        const span = (maxX + 6) - (minX - 6);
        const beam = new THREE.Mesh(new THREE.BoxGeometry(span, 56, 30), beamMat);
        beam.position.copy(W((minX + maxX) / 2, dy, h - 28));
        shadowy(beam, true, true);
        g.add(beam);
        // little flags along the beam for festivity.
        const flagCols = [0xff5fa2, 0xffd23f, 0x46d36a, 0x5ad1ff, 0xb06bff];
        const n = 9;
        for (let i = 0; i < n; i++) {
            const fm = mat(flagCols[i % flagCols.length], { roughness: 0.6, side: THREE.DoubleSide });
            const flag = new THREE.Mesh(new THREE.ConeGeometry(16, 26, 3), fm);
            const fx = minX + (i + 0.5) * (span / n);
            flag.position.copy(W(fx, dy, h - 60));
            flag.rotation.x = Math.PI / 2;
            g.add(flag);
        }
        return g;
    }

    // ---------------- SURVIVAL: hovering disc over animated slime --------
    _buildSurvival(r) {
        const P = r.platform || { cx: (r.cx != null ? r.cx : 640), cy: 380, r: 300 };
        const R = P.r || 300;

        // wide slime sea below.
        const sea = makeSlime(P.cx, P.cy, 4200, 4200, -40);
        this._add(sea.mesh);
        this._registerSlime(sea, true);

        // the platform disc hovering above the slime.
        const platH = 36;
        const platMat = mat(0x8be0ff, { roughness: 0.7, metalness: 0.0 });
        const disc = new THREE.Mesh(new THREE.CylinderGeometry(R, R * 1.02, platH, 64), platMat);
        disc.position.copy(W(P.cx, P.cy, 6));
        disc.receiveShadow = true;
        disc.castShadow = true;
        this._add(disc);

        // glossy top inlay ring + rim accent.
        const inlayMat = mat(shade(col(0x8be0ff), 0.18), { roughness: 0.5 });
        const inlay = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.86, R * 0.86, 4, 64), inlayMat);
        inlay.position.copy(W(P.cx, P.cy, 6 + platH / 2 + 1));
        inlay.receiveShadow = true;
        this._add(inlay);
        const rimMat = mat(0xff5fa2, { roughness: 0.5 });
        const rim = new THREE.Mesh(new THREE.TorusGeometry(R, 10, 12, 64), rimMat);
        rim.rotation.x = Math.PI / 2;
        rim.position.copy(W(P.cx, P.cy, 6 + platH / 2));
        shadowy(rim, true, true);
        this._add(rim);

        // a soft underside cone so the disc reads as a floating island.
        const underMat = mat(shade(col(0x8be0ff), -0.35), { roughness: 0.8 });
        const under = new THREE.Mesh(new THREE.ConeGeometry(R * 0.95, 160, 48), underMat);
        under.position.copy(W(P.cx, P.cy, 6 - platH / 2 - 80));
        under.rotation.x = Math.PI;           // point downward
        this._add(under);
    }

    // ---------------- FINAL: wide slime pit + border frame ---------------
    _buildFinal(r) {
        const minX = r.minX != null ? r.minX : 300;
        const maxX = r.maxX != null ? r.maxX : 980;
        const minY = r.minY != null ? r.minY : 130;
        const maxY = r.maxY != null ? r.maxY : 630;
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        const w = maxX - minX, h = maxY - minY;

        // wide pink slime pit spanning (and overhanging) the arena.
        const pit = makeSlime(cx, cy, w + 1400, h + 1400, -60);
        this._add(pit.mesh);
        this._registerSlime(pit, true);

        // a subtle raised border frame around the play field (decorative).
        const frameMat = mat(0x7b46d6, { roughness: 0.55, metalness: 0.1, emissive: 0x2a0f55, emissiveIntensity: 0.15 });
        const ft = 40, fh = 70;
        const pad = 60;
        const fx0 = minX - pad, fx1 = maxX + pad, fy0 = minY - pad, fy1 = maxY + pad;
        const fw = fx1 - fx0, fhh = fy1 - fy0;
        // four rails.
        const railNS = new THREE.BoxGeometry(fw + ft, fh, ft);
        const railEW = new THREE.BoxGeometry(ft, fh, fhh + ft);
        const top = new THREE.Mesh(railNS, frameMat); top.position.copy(W(cx, fy0, fh / 2));
        const bot = new THREE.Mesh(railNS, frameMat); bot.position.copy(W(cx, fy1, fh / 2));
        const left = new THREE.Mesh(railEW, frameMat); left.position.copy(W(fx0, cy, fh / 2));
        const right = new THREE.Mesh(railEW, frameMat); right.position.copy(W(fx1, cy, fh / 2));
        for (const m of [top, bot, left, right]) { shadowy(m, true, true); this._add(m); }

        // gold corner caps for polish.
        const capMat = mat(0xffd23f, { roughness: 0.4, metalness: 0.3 });
        for (const [gx, gy] of [[fx0, fy0], [fx1, fy0], [fx0, fy1], [fx1, fy1]]) {
            const cap = new THREE.Mesh(new THREE.SphereGeometry(ft * 0.7, 16, 12), capMat);
            cap.position.copy(W(gx, gy, fh));
            shadowy(cap, true, true);
            this._add(cap);
        }
    }

    // register a slime surface for shimmer animation + disposal.
    _registerSlime(s, strong) {
        this._disposables.push(s.mesh);
        const baseE = s.slimeMat.emissiveIntensity;
        const amp = strong ? 0.22 : 0.14;
        this._anim.push((dt, t) => {
            const tt = t || 0;
            s.slimeMat.emissiveIntensity = baseE + Math.sin(tt * 1.6) * amp;
            // gentle hue wobble for a living-slime feel.
            const hueShift = 0.02 * Math.sin(tt * 0.7);
            s.slimeMat.emissive.setHSL(0.86 + hueShift, 0.7, 0.32);
        });
    }

    update(round, dt, t) {
        if (round) this._round = round;
        for (const fn of this._anim) fn(dt, t);
    }

    dispose() {
        disposeTree(this._root);
        this._disposables.length = 0;
        this._anim.length = 0;
    }
}

/* =================== game =================== */
'use strict';

/* =====================================================================
   game.js — HEADLESS show/round controller for the 3D build.
   No rendering here: the 3D engine polls Game.screen / Game.show.round
   and builds views; the DOM UI calls these methods via hooks.
   ===================================================================== */

const Game = {
    screen: 'menu',     // menu | customize | howto | trophies | playing | eliminated | victory
    show: null,         // { index, beans, round }
    player: null,
    info: null,

    init() {
        Save.load();
        this.screen = 'menu';
    },

    // Driven by the engine every frame.
    update(dt) {
        if (this.screen === 'playing') {
            const r = this.show.round;
            r.update(dt);
            if (r.done) this.finishRound();
        }
    },

    // ---- UI hooks -----------------------------------------------------
    cycleCosmetic(slot, dir) {
        const arrays = { color: COLORS, pattern: PATTERNS, faceplate: FACEPLATES, upper: COSTUMES_UPPER, lower: COSTUMES_LOWER };
        const arr = arrays[slot]; if (!arr) return;
        const n = arr.length;
        Save.data[slot] = (Save.data[slot] + (dir > 0 ? 1 : -1) + n) % n;
        Save.save(); Save.checkHeadTurner();
    },
    cycleEmote(i, dir) {
        const n = EMOTES.length;
        Save.data.emotes[i] = (Save.data.emotes[i] + (dir > 0 ? 1 : -1) + n) % n;
        Save.save();
    },

    toMenu() { this.screen = 'menu'; this.show = null; },

    // ---- Show lifecycle ----------------------------------------------
    startShow() {
        const beans = this._makeField();
        this.show = { index: 0, beans, round: null };
        this.loadRound(0);
    },

    loadRound(i) {
        for (const b of this.show.beans) this._resetBean(b);
        this.show.index = i;
        this.show.round = Rounds.create(SHOW[i], this.show.beans);
        this.screen = 'playing';
    },

    finishRound() {
        const r = this.show.round;
        const res = r.result;

        if (res.outcome === 'qualify') {
            Save.unlock('first_qual');
            if (r.bigTease) Save.unlock('big_tease');
            if (r.category === 'Survival') Save.unlock('survivor');
            const survivors = r.beans.filter(b => b.alive && !b.eliminated);
            this.show.beans = survivors;
            this.loadRound(this.show.index + 1);
            return;
        }

        if (res.outcome === 'win') {
            const flawless = !this.player.everRagdolled;
            Save.recordWin(flawless);
            this.info = { crowns: Save.data.crowns, streak: Save.data.streak };
            this.screen = 'victory';
            return;
        }

        Save.recordLoss();
        this.info = {
            roundName: r.def.name, place: res.place,
            roundsCleared: this.show.index, totalRounds: SHOW.length,
        };
        this.screen = 'eliminated';
    },

    // ---- Field / beans -----------------------------------------------
    _makeField() {
        const beans = [];
        this.player = new Bean({
            x: 0, y: 0, isPlayer: true, name: 'You',
            appearance: Save.appearance(), emoteList: Save.emoteList(),
        });
        beans.push(this.player);

        const names = U.shuffle(BEAN_NAMES.slice());
        for (let i = 0; i < CFG.FIELD_SIZE - 1; i++) {
            beans.push(new Bean({
                x: 0, y: 0, name: names[i % names.length],
                appearance: this._randomAppearance(),
                emoteList: [U.pick(EMOTES), U.pick(EMOTES), U.pick(EMOTES), U.pick(EMOTES)],
            }));
        }
        return beans;
    },

    _randomAppearance() {
        return {
            color: U.pick(COLORS).hex,
            pattern: U.pick(PATTERNS).type,
            upper: U.pick(COSTUMES_UPPER).prop,
            lower: U.pick(COSTUMES_LOWER).prop,
            visor: U.pick(FACEPLATES).visor,
        };
    },

    _resetBean(b) {
        b.vx = 0; b.vy = 0; b.z = 0; b.vz = 0; b.facing = -Math.PI / 2;
        b.alive = true; b.finished = false; b.qualified = false;
        b.eliminated = false; b.falling = false; b.place = 0;
        b.diveT = 0; b.proneT = 0; b.diveCd = 0; b.ragdoll = 0; b.spin = 0; b.squash = 1;
        b.grabbing = null; b.grabbedBy = null; b.grabT = 0;
        b.emoteT = 0; b.emoteAnim = null; b.emoteName = null; b.justEmoted = 99;
        b.ai = { mx: 0, my: 0, jump: false, dive: false };
        b.aiTimer = 0; b.aiJumpLock = 0; b.aiTarget = { x: 0, y: 0 };
        // everRagdolled persists across the whole show (Flawless trophy)
    },
};
