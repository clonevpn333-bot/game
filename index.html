'use strict';

/* =====================================================================
   ui.js — DOM/HTML overlay on top of the WebGL canvas: title menu,
   customise, how-to, trophies, in-game HUD and result screens.
   Fall Guys "bubblegum" look: rounded candy cards, bold type, soft shadows.
   ===================================================================== */

const UI = {
    data: null, hooks: null, els: {}, _toasts: [],

    rarity(r) {
        return { common: '#b9c2cc', uncommon: '#46d36a', rare: '#3fa9ff', epic: '#b06bff', legendary: '#ffd23f' }[r] || '#fff';
    },

    _el(tag, cls, html) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        return e;
    },
    _btn(label, cls, onClick) {
        const b = this._el('button', 'br-btn ' + (cls || ''), label);
        b.onclick = onClick;
        return b;
    },

    mount(root, data, hooks) {
        this.data = data; this.hooks = hooks;
        this._injectCSS();

        this.layer = this._el('div', 'br-layer');
        root.appendChild(this.layer);

        // big panels
        for (const id of ['menu', 'customize', 'howto', 'trophies', 'eliminated', 'victory']) {
            const p = this._el('div', 'br-panel br-' + id);
            this.els[id] = p; this.layer.appendChild(p);
        }
        // play overlays
        this.els.hud = this._el('div', 'br-hud'); this.layer.appendChild(this.els.hud);
        this.els.intro = this._el('div', 'br-intro'); this.layer.appendChild(this.els.intro);
        this.els.banner = this._el('div', 'br-banner'); this.layer.appendChild(this.els.banner);
        this.els.toasts = this._el('div', 'br-toasts'); this.layer.appendChild(this.els.toasts);

        this._buildHUD();
        this.hideAll();
    },

    hideAll() {
        for (const k in this.els) if (k !== 'toasts') this.els[k].style.display = 'none';
    },
    _showBig(id) {
        this.hideAll();
        this.els[id].style.display = 'flex';
    },

    // ================================================== MENU
    showMenu() {
        const s = this.hooks.getSave();
        const p = this.els.menu; p.innerHTML = '';
        p.appendChild(this._el('div', 'br-title', 'BEAN<span>ROYALE</span>'));
        p.appendChild(this._el('div', 'br-sub', 'A Fall Guys tribute — dive, bounce &amp; grab your way to the Crown!'));
        const col = this._el('div', 'br-col');
        col.appendChild(this._btn('▶  PLAY SHOW', 'br-big', this.hooks.onPlay));
        col.appendChild(this._btn('🎨  CUSTOMISE', 'br-blue', this.hooks.onCustomize));
        col.appendChild(this._btn('🏆  TROPHIES', 'br-purple', this.hooks.onTrophies));
        col.appendChild(this._btn('?  HOW TO PLAY', 'br-pink', this.hooks.onHowTo));
        p.appendChild(col);
        p.appendChild(this._el('div', 'br-foot',
            `Crowns: ${s.crowns} &nbsp;·&nbsp; Win Streak: ${s.streak} &nbsp;·&nbsp; Best: ${s.bestStreak}`));
        this._showBig('menu');
    },

    // ================================================== CUSTOMISE
    showCustomize() {
        this._renderCustomize();
        this._showBig('customize');
    },
    _renderCustomize() {
        const s = this.hooks.getSave(), d = this.data, p = this.els.customize;
        p.innerHTML = '';
        p.appendChild(this._el('div', 'br-h', 'CUSTOMISE YOUR BEAN'));
        const wrap = this._el('div', 'br-cust-wrap');

        // preview box (engine mounts a 3D canvas here)
        this.els.preview = this._el('div', 'br-preview');
        wrap.appendChild(this.els.preview);

        const right = this._el('div', 'br-cust-right');
        const slots = [
            ['color', 'Colour', d.COLORS, s.color, x => x.name],
            ['pattern', 'Pattern', d.PATTERNS, s.pattern, x => x.name],
            ['faceplate', 'Faceplate', d.FACEPLATES, s.faceplate, x => x.name],
            ['upper', 'Upper', d.COSTUMES_UPPER, s.upper, x => x.name],
            ['lower', 'Lower', d.COSTUMES_LOWER, s.lower, x => x.name],
        ];
        for (const [key, label, arr, idx, namer] of slots) {
            const cur = arr[idx];
            const row = this._el('div', 'br-slot');
            row.appendChild(this._el('span', 'br-slot-label', label));
            row.appendChild(this._btn('‹', 'br-arrow', () => { this.hooks.onCycle(key, -1); this._renderCustomize(); }));
            const v = this._el('span', 'br-slot-val', namer(cur) + `<em style="color:${this.rarity(cur.rarity)}">${cur.rarity}</em>`);
            v.style.color = this.rarity(cur.rarity);
            row.appendChild(v);
            row.appendChild(this._btn('›', 'br-arrow', () => { this.hooks.onCycle(key, 1); this._renderCustomize(); }));
            right.appendChild(row);
        }
        // emotes
        right.appendChild(this._el('div', 'br-h2', 'GESTURE LOADOUT &nbsp;(keys 1–4)'));
        const erow = this._el('div', 'br-emotes');
        for (let i = 0; i < 4; i++) {
            const em = d.EMOTES[s.emotes[i]];
            const cell = this._el('div', 'br-emote');
            cell.appendChild(this._el('div', 'br-emote-name', (i + 1) + '· ' + em.name));
            const ctr = this._el('div', 'br-emote-ctr');
            ctr.appendChild(this._btn('‹', 'br-arrow sm', () => { this.hooks.onEmoteCycle(i, -1); this._renderCustomize(); }));
            ctr.appendChild(this._el('span', 'br-emote-snd', '♪ ' + em.sound));
            ctr.appendChild(this._btn('›', 'br-arrow sm', () => { this.hooks.onEmoteCycle(i, 1); this._renderCustomize(); }));
            cell.appendChild(ctr);
            erow.appendChild(cell);
        }
        right.appendChild(erow);
        wrap.appendChild(right);
        p.appendChild(wrap);

        const bar = this._el('div', 'br-cust-bar');
        bar.appendChild(this._btn('‹ BACK', 'br-pink', this.hooks.onMenu));
        bar.appendChild(this._btn('START SHOW ▶', 'br-big', this.hooks.onPlay));
        p.appendChild(bar);
    },
    previewContainer() { return this.els.preview; },

    // ================================================== HOW TO
    showHowTo() {
        const p = this.els.howto; p.innerHTML = '';
        p.appendChild(this._el('div', 'br-h', 'HOW TO PLAY'));
        const rows = [
            ['Move', 'WASD / Arrow Keys'], ['Jump', 'Space — hop sweepers &amp; low bars'],
            ['Dive', 'Shift — fast lunge (then a slow recovery)'], ['Grab', 'J / L — grab a rival; release to fling'],
            ['Gesture', '1–4 — perform your equipped emotes'], ['Goal', 'Qualify each round until one bean takes the Crown.'],
        ];
        const list = this._el('div', 'br-howlist');
        for (const [k, v] of rows) {
            const r = this._el('div', 'br-howrow');
            r.appendChild(this._el('span', 'br-howk', k));
            r.appendChild(this._el('span', 'br-howv', v));
            list.appendChild(r);
        }
        p.appendChild(list);
        p.appendChild(this._el('div', 'br-h2', 'ROUNDS'));
        const rl = this._el('div', 'br-howlist');
        for (const def of this.data.SHOW) {
            const r = this._el('div', 'br-howrow');
            r.appendChild(this._el('span', 'br-howk', def.name));
            r.appendChild(this._el('span', 'br-howv', `[${def.category}] ${def.tagline}`));
            rl.appendChild(r);
        }
        p.appendChild(rl);
        p.appendChild(this._btn('‹ BACK', 'br-pink', this.hooks.onMenu));
        this._showBig('howto');
    },

    // ================================================== TROPHIES
    showTrophies() {
        const s = this.hooks.getSave(), p = this.els.trophies; p.innerHTML = '';
        p.appendChild(this._el('div', 'br-h', '🏆 TROPHIES'));
        p.appendChild(this._el('div', 'br-sub2', `Crowns ${s.crowns} · Best Streak ${s.bestStreak}`));
        const list = this._el('div', 'br-trlist');
        for (const a of this.data.ACHIEVEMENTS) {
            const got = !!s.achievements[a.id];
            const r = this._el('div', 'br-trophy' + (got ? ' got' : ''));
            r.appendChild(this._el('span', 'br-tricon', got ? '✔' : '🔒'));
            const tx = this._el('div', 'br-trtext');
            tx.appendChild(this._el('div', 'br-trname', a.name));
            tx.appendChild(this._el('div', 'br-trdesc', a.desc));
            r.appendChild(tx);
            list.appendChild(r);
        }
        p.appendChild(list);
        p.appendChild(this._btn('‹ BACK', 'br-pink', this.hooks.onMenu));
        this._showBig('trophies');
    },

    // ================================================== HUD
    _buildHUD() {
        const h = this.els.hud;
        this.els.hudName = this._el('div', 'br-chip br-left');
        this.els.hudCount = this._el('div', 'br-chip br-right');
        this.els.hudHint = this._el('div', 'br-hint',
            'WASD move · SPACE jump · SHIFT dive · J grab · 1-4 gesture');
        h.appendChild(this.els.hudName); h.appendChild(this.els.hudCount); h.appendChild(this.els.hudHint);
    },
    showHUD() {
        for (const id of ['menu', 'customize', 'howto', 'trophies', 'eliminated', 'victory']) this.els[id].style.display = 'none';
        this.els.intro.style.display = 'none';
        this.els.banner.style.display = 'none';
        this.els.hud.style.display = 'block';
    },
    updateHUD(hud) {
        const cat = { Race: '#5ad1ff', Survival: '#ffd23f', Final: '#ff5fa2' }[hud.category] || '#fff';
        this.els.hudName.innerHTML = `<b>${hud.name}</b><span style="color:${cat}">${hud.category.toUpperCase()}</span>`;
        let r;
        if (hud.kind === 'race') r = `<span style="color:#46d36a">QUALIFIED</span><b>${hud.qualifiedCount} / ${hud.qualifyCount}</b>`;
        else if (hud.kind === 'survival') r = `<span style="color:#ffd23f">SURVIVE</span><b>${this._t(hud.timer)} · ${hud.aliveCount} left</b>`;
        else r = `<span style="color:#ff5fa2">BEANS LEFT</span><b>${hud.aliveCount}</b>`;
        this.els.hudCount.innerHTML = r;
    },
    _t(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); },

    // ================================================== INTRO CARD
    showIntro(intro) {
        for (const id of ['menu', 'customize', 'howto', 'trophies', 'eliminated', 'victory']) this.els[id].style.display = 'none';
        this.els.hud.style.display = 'none';
        const cat = { Race: '#5ad1ff', Survival: '#ffd23f', Final: '#ff5fa2' }[intro.category] || '#fff';
        const cd = intro.countdown == null ? '' : `<div class="br-count">${intro.countdown > 0 ? intro.countdown : 'GO!'}</div>`;
        const q = intro.qualify ? `<div class="br-qual">Top ${intro.qualify} qualify</div>` : '';
        this.els.intro.innerHTML =
            `<div class="br-intro-card"><div class="br-intro-cat" style="color:${cat}">${intro.category.toUpperCase()}</div>` +
            `<div class="br-intro-name">${intro.name}</div>` +
            `<div class="br-intro-tag">${intro.tagline}</div>${q}${cd}</div>`;
        this.els.intro.style.display = 'flex';
    },

    // ================================================== ENDING BANNER
    showEndingBanner(res) {
        let txt, col, sub = '';
        if (res.outcome === 'qualify') { txt = 'QUALIFIED!'; col = '#46d36a'; sub = res.bigTease ? 'Style points! 😎' : 'You placed #' + res.place; }
        else if (res.outcome === 'win') { txt = '👑 VICTORY 👑'; col = '#ffd23f'; }
        else { txt = 'ELIMINATED'; col = '#ff4d6d'; }
        this.els.banner.innerHTML = `<div class="br-banner-in" style="color:${col}">${txt}<div class="br-banner-sub">${sub}</div></div>`;
        this.els.banner.style.display = 'flex';
    },

    // ================================================== RESULT SCREENS
    showEliminated(info) {
        const p = this.els.eliminated; p.innerHTML = '';
        p.appendChild(this._el('div', 'br-result-big', 'ELIMINATED'));
        p.appendChild(this._el('div', 'br-result-sub', `Knocked out in ${info.roundName} — placed #${info.place}`));
        p.appendChild(this._el('div', 'br-result-sub2', `You cleared ${info.roundsCleared} of ${info.totalRounds} rounds`));
        const bar = this._el('div', 'br-col br-row');
        bar.appendChild(this._btn('↻ PLAY AGAIN', 'br-big', this.hooks.onPlay));
        bar.appendChild(this._btn('☰ MAIN MENU', 'br-blue', this.hooks.onMenu));
        p.appendChild(bar);
        this._showBig('eliminated');
    },
    showVictory(info) {
        const s = this.hooks.getSave(), p = this.els.victory; p.innerHTML = '';
        p.appendChild(this._el('div', 'br-crown', '👑'));
        p.appendChild(this._el('div', 'br-result-big', 'WINNER WINNER!'));
        p.appendChild(this._el('div', 'br-result-sub', 'You grabbed the Crown!'));
        p.appendChild(this._el('div', 'br-result-sub2', `Crowns: ${s.crowns} · Win Streak: ${s.streak}`));
        const bar = this._el('div', 'br-col br-row');
        bar.appendChild(this._btn('↻ PLAY AGAIN', 'br-big', this.hooks.onPlay));
        bar.appendChild(this._btn('☰ MAIN MENU', 'br-blue', this.hooks.onMenu));
        p.appendChild(bar);
        // confetti
        const conf = this._el('div', 'br-confetti');
        for (let i = 0; i < 40; i++) {
            const c = this._el('i');
            c.style.left = Math.random() * 100 + '%';
            c.style.background = ['#ffd23f', '#5ad1ff', '#46d36a', '#fff', '#ff5fa2'][i % 5];

/* =================== engine =================== */
'use strict';

/* =====================================================================
   engine.js — Three.js core. Owns renderer/scene/camera/lights, builds
   the 3D scene for each round from the (headless) sim, drives every view
   each frame, runs the camera, in-world FX, the DOM UI and the live
   customise preview.  THREE is imported once by the host module.
   ===================================================================== */

const Engine = {
    MAXFX: 500,

    start() {
        const host = document.getElementById('app');
        const loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';
        // renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        host.appendChild(renderer.domElement);
        this.renderer = renderer;

        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 8000);
        this.camera.position.set(0, 400, 600);
        this.env = setupEnvironment(this.scene);

        // persistent FX points
        this.fxGeo = new THREE.BufferGeometry();
        this.fxPos = new Float32Array(this.MAXFX * 3);
        this.fxCol = new Float32Array(this.MAXFX * 3);
        this.fxGeo.setAttribute('position', new THREE.BufferAttribute(this.fxPos, 3));
        this.fxGeo.setAttribute('color', new THREE.BufferAttribute(this.fxCol, 3));
        this.fxPoints = new THREE.Points(this.fxGeo,
            new THREE.PointsMaterial({ size: 11, vertexColors: true, sizeAttenuation: true }));
        this.fxPoints.frustumCulled = false;
        this.scene.add(this.fxPoints);

        this.roundGroup = null;
        this.beanViews = new Map();
        this.obViews = [];
        this.courseView = null;
        this._lastRound = null;
        this._lastScreen = null;
        this._lastPhase = null;
        this._camPos = new THREE.Vector3(0, 600, 800);
        this._camLook = new THREE.Vector3();
        this._tmpC = new THREE.Color();

        // input + sim + ui
        Input.init(renderer.domElement);
        Game.init();
        UI.mount(host, {
            COLORS, PATTERNS, FACEPLATES, COSTUMES_UPPER, COSTUMES_LOWER, EMOTES, ACHIEVEMENTS, SHOW,
        }, {
            onPlay: () => Game.startShow(),
            onCustomize: () => { Game.screen = 'customize'; },
            onHowTo: () => { Game.screen = 'howto'; },
            onTrophies: () => { Game.screen = 'trophies'; },
            onMenu: () => Game.toMenu(),
            onCycle: (slot, dir) => Game.cycleCosmetic(slot, dir),
            onEmoteCycle: (i, dir) => Game.cycleEmote(i, dir),
            getSave: () => Save.data,
        });

        window.addEventListener('resize', () => this._resize());
        this._clock = performance.now();
        this._t = 0;
        requestAnimationFrame(ts => this._loop(ts));
    },

    _resize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        if (this.preview) {
            const box = UI.previewContainer();
            if (box) { this.preview.renderer.setSize(box.clientWidth, box.clientHeight, false);
                this.preview.camera.aspect = box.clientWidth / Math.max(1, box.clientHeight);
                this.preview.camera.updateProjectionMatrix(); }
        }
    },

    _loop(ts) {
        let dt = (ts - this._clock) / 1000; this._clock = ts;
        dt = Math.min(dt, 0.05); this._t += dt;

        Game.update(dt);
        this._syncScreen();
        if (Game.screen === 'playing') this._updatePlaying(dt, this._t);
        if (Game.screen === 'customize') this._updatePreview(dt, this._t);

        // achievement toasts
        while (Save.newlyUnlocked.length) UI.toast(Save.newlyUnlocked.shift());

        this.env && this.env.update && this.env.update(dt, this._t);
        this.renderer.render(this.scene, this.camera);
        Input.flush();
        requestAnimationFrame(t2 => this._loop(t2));
    },

    // ---- screen / round transitions ----------------------------------
    _syncScreen() {
        if (Game.screen === 'playing') {
            if (Game.show.round !== this._lastRound) { this._buildRound(Game.show.round); this._lastRound = Game.show.round; }
        } else if (this._lastRound) {
            this._teardownRound(); this._lastRound = null;
        }
        if (Game.screen !== this._lastScreen) {
            this._lastScreen = Game.screen;
            switch (Game.screen) {
                case 'menu': UI.showMenu(); break;
                case 'customize': UI.showCustomize(); this._mountPreview(); break;
                case 'howto': UI.showHowTo(); break;
                case 'trophies': UI.showTrophies(); break;
                case 'eliminated': UI.showEliminated(Game.info); break;
                case 'victory': UI.showVictory(Game.info); break;
                case 'playing': this._lastPhase = null; break;
            }
        }
        // Esc returns to menu from play
        if (Game.screen === 'playing' && Input.esc) Game.toMenu();
    },

    _buildRound(round) {
        this._teardownRound();
        const g = new THREE.Group();
        this.courseView = new CourseView(round);
        g.add(this.courseView.object3d);

        this.obViews = [];
        const allOb = round.obstacles.concat(round.tiles || []);
        for (const ob of allOb) {
            const v = makeObstacleView(ob);
            this.obViews.push({ ob, v });
            g.add(v.object3d);
        }
        this.beanViews = new Map();
        for (const b of round.beans) {
            const bv = new BeanView(b.appearance);
            this.beanViews.set(b, bv);
            g.add(bv.object3d);
        }
        this.scene.add(g);
        this.roundGroup = g;
        this._lastPhase = null;
    },

    _teardownRound() {
        if (this.roundGroup) { this.scene.remove(this.roundGroup); }
        if (this.courseView) this.courseView.dispose && this.courseView.dispose();
        for (const { v } of this.obViews) v.dispose && v.dispose();
        for (const bv of this.beanViews.values()) bv.dispose && bv.dispose();
        this.roundGroup = null; this.courseView = null; this.obViews = []; this.beanViews = new Map();
    },

    // ---- per-frame play update ---------------------------------------
    _updatePlaying(dt, t) {
        const round = Game.show.round;
        // beans
        for (const b of round.beans) {
            const bv = this.beanViews.get(b);
            if (!bv) continue;
            if (b.gone) { bv.object3d.visible = false; continue; }
            bv.object3d.visible = true;
            bv.update(b, dt, t);
        }
        // obstacles + tiles
        for (const { ob, v } of this.obViews) v.update(ob, dt, t);
        this.courseView && this.courseView.update(round, dt, t);

        this._updateFx(round);
        this._camera(round, dt);
        this._hud(round);
    },

    _updateFx(round) {
        const fx = round.fx || [];
        const n = Math.min(fx.length, this.MAXFX);
        for (let i = 0; i < n; i++) {
            const p = fx[i];
            this.fxPos[i * 3] = p.x; this.fxPos[i * 3 + 1] = p.z; this.fxPos[i * 3 + 2] = p.y;
            this._tmpC.set(p.color || '#ffffff');
            this.fxCol[i * 3] = this._tmpC.r; this.fxCol[i * 3 + 1] = this._tmpC.g; this.fxCol[i * 3 + 2] = this._tmpC.b;
        }
        this.fxGeo.setDrawRange(0, n);
        this.fxGeo.attributes.position.needsUpdate = true;
        this.fxGeo.attributes.color.needsUpdate = true;
    },

    // ---- camera -------------------------------------------------------
    _camera(round, dt) {
        const p = round.player;
        let pos, look;
        if (round.kind === 'race') {
            const px = p.x, py = p.z, pz = p.y;          // world coords
            pos = new THREE.Vector3(px * 0.6, py + 300, pz + 430);
            look = new THREE.Vector3(px * 0.6, py + 40, pz - 230);
        } else {
            const cx = round.platform && round.platform.r ? round.platform.cx : (round.minX + round.maxX) / 2;
            const cy = round.platform && round.platform.r ? round.platform.cy : (round.minY + round.maxY) / 2;
            const r = round.platform && round.platform.r ? round.platform.r : 360;
            // bias a little toward the player so you can find your bean
            const bx = U.lerp(cx, p.x, 0.18), bz = U.lerp(cy, p.y, 0.18);
            pos = new THREE.Vector3(bx, 560 + r * 0.6, cy + r + 360);
            look = new THREE.Vector3(bx, 30, bz);
        }
        const k = 1 - Math.pow(0.0015, dt);
        this._camPos.lerp(pos, k); this._camLook.lerp(look, k);
        this.camera.position.copy(this._camPos);
        this.camera.lookAt(this._camLook);
    },

    // ---- HUD / intro / banner ----------------------------------------
    _hud(round) {
        const phase = round.phase;
        if (phase !== this._lastPhase) {
            this._lastPhase = phase;
            if (phase === 'intro') {
                UI.showIntro({ name: round.def.name, category: round.category, tagline: round.def.tagline,
                    qualify: round.def.qualify || null, countdown: null });
            } else if (phase === 'go') {
                UI.showHUD();
            } else if (phase === 'ending') {
                UI.showHUD(); UI.showEndingBanner(round.result);
            }
        }
        if (phase === 'go' || phase === 'ending') {
            UI.updateHUD({
                name: round.def.name, category: round.category, kind: round.kind,
                qualifiedCount: round.qualifiedCount, qualifyCount: round.qualifyCount,
                timer: round.timer, aliveCount: round.aliveSoFar(), place: round.player.place,
            });
        }
    },

    // ---- customise live 3D preview -----------------------------------
    _mountPreview() {
        const box = UI.previewContainer();
        if (!box) return;
        if (!this.preview) {
            const pr = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            pr.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            pr.shadowMap.enabled = true; pr.shadowMap.type = THREE.PCFSoftShadowMap;
            pr.outputColorSpace = THREE.SRGBColorSpace; pr.toneMapping = THREE.ACESFilmicToneMapping;
            const sc = new THREE.Scene();
            const hemi = new THREE.HemisphereLight(0xffffff, 0x556680, 1.0);
            const dir = new THREE.DirectionalLight(0xffffff, 1.6); dir.position.set(60, 120, 90);
            sc.add(hemi); sc.add(dir);
            const cam = new THREE.PerspectiveCamera(45, 1, 1, 1000);
            cam.position.set(0, 34, 110); cam.lookAt(0, 22, 0);
            this.preview = { renderer: pr, scene: sc, camera: cam, bean: null, sig: '', fake: {
                x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, facing: 0, r: 17, grounded: true,
                diveT: 0, proneT: 0, ragdoll: 0, spin: 0, falling: false, squash: 1,
                emoteAnim: null, emoteT: 0, blink: 3, isPlayer: true, name: 'You' } };
        }
        if (this.preview.renderer.domElement.parentElement !== box) {
            box.appendChild(this.preview.renderer.domElement);
        }
        const w = box.clientWidth || 300, h = box.clientHeight || 430;
        this.preview.renderer.setSize(w, h, false);
        this.preview.camera.aspect = w / h; this.preview.camera.updateProjectionMatrix();
    },

    _updatePreview(dt, t) {
        const pv = this.preview; if (!pv) return;
        const sig = JSON.stringify(Save.appearance());
        if (sig !== pv.sig) {
            pv.sig = sig;
            if (!pv.bean) { pv.bean = new BeanView(Save.appearance()); pv.scene.add(pv.bean.object3d); }
            else pv.bean.setAppearance(Save.appearance());
        }
        pv.fake.facing = t * 0.7;                 // slowly turn
        pv.fake.blink = (Math.floor(t) % 4 === 0 && t % 1 < 0.12) ? 0.05 : 3;
        pv.bean && pv.bean.update(pv.fake, dt, t);
        pv.renderer.render(pv.scene, pv.camera);
    },
};

window.addEventListener('load', () => Engine.start());
</script>
