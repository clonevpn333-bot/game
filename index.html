<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="description" content="Breachpoint — a browser-based 5v5 tactical shooter. Bomb defusal, buy phase, recoil patterns, bots and peer-to-peer multiplayer. No downloads, no plugins.">
<title>Breachpoint — 5v5 Tactical FPS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e13'/%3E%3Cpath d='M16 5v22M5 16h22' stroke='%23ff7a2f' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2339ff6a' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* ============================================================
   BREACHPOINT — interface styles
   ============================================================ */
:root{
  --bg:#0b0e13; --bg2:#11161e; --bg3:#161d27; --line:#232c39; --line2:#2e3947;
  --fg:#e7edf5; --fg2:#9daabb; --fg3:#66748a;
  --att:#e0a53a; --att-dim:#7a5a1c; --def:#4aa8ff; --def-dim:#1f5583;
  --good:#4ade80; --warn:#fbbf24; --bad:#f05555; --hp:#e8eef7;
  --accent:#ff7a2f;
  --radius:4px; --shadow:0 8px 32px rgba(0,0,0,.55);
  --font:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{user-select:none;cursor:default}
button,input,select,textarea{font:inherit;color:inherit}
canvas{display:block}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- layout roots ---------- */
#gl{position:fixed;inset:0;width:100%;height:100%;background:#0b0e13}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui > *{pointer-events:auto}
.hidden{display:none !important}
.nopointer{pointer-events:none !important}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 40%,#18202c,#080a0e 70%)}
#loading .logo{font-size:min(9vw,64px);font-weight:800;letter-spacing:.24em;
  text-transform:uppercase;background:linear-gradient(100deg,var(--att),#fff 45%,var(--def));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#loading .bar{width:min(360px,70vw);height:3px;background:#1d2631;border-radius:2px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--att),var(--accent));
  transition:width .25s ease}
#loading .status{color:var(--fg3);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#loading .tip{color:var(--fg3);font-size:12px;max-width:420px;text-align:center;line-height:1.6;opacity:.8}

/* ---------- generic controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border:1px solid var(--line2);border-radius:var(--radius);
  background:linear-gradient(180deg,#1b2330,#141b25);color:var(--fg);cursor:pointer;
  font-weight:600;font-size:14px;letter-spacing:.02em;transition:.12s;white-space:nowrap}
.btn:hover{background:linear-gradient(180deg,#26303f,#1a222e);border-color:#3d4a5c;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,#ff9448,#e9631a);border-color:#ff9d5c;color:#160c04}
.btn.primary:hover{background:linear-gradient(180deg,#ffa55f,#f4702a)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{border-color:#7a2a2a;color:#ff9c9c}
.btn.danger:hover{background:#2a1414}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.wide{width:100%}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
input[type=text],input[type=number],select{padding:9px 12px;background:#0e131a;
  border:1px solid var(--line2);border-radius:var(--radius);outline:none;width:100%}
input[type=text]:focus,select:focus{border-color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#212a36;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;
  border-radius:50%;background:var(--accent);border:2px solid #0e131a}
input[type=range]::-moz-range-track{height:4px;background:#212a36;border-radius:2px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:2px solid #0e131a;border-radius:50%;background:var(--accent)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.muted{color:var(--fg2)}
.dim{color:var(--fg3)}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;background:#1b2330;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);font-weight:700}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;z-index:60;
  background:radial-gradient(ellipse at 20% 0%,#18202c 0%,#0a0d12 55%)}
.screen.overlay{background:rgba(6,9,13,.92);backdrop-filter:blur(6px)}
.screen-head{display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:20px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.brand span{font-size:11px;color:var(--fg3);letter-spacing:.12em}
.screen-body{flex:1;overflow-y:auto;padding:28px;scrollbar-width:thin}
.screen-body::-webkit-scrollbar{width:9px}
.screen-body::-webkit-scrollbar-thumb{background:#26303d;border-radius:5px}
.screen-foot{padding:14px 28px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

.wrap{max-width:1080px;margin:0 auto;width:100%}
.panel{background:linear-gradient(180deg,rgba(22,29,39,.9),rgba(14,19,26,.9));
  border:1px solid var(--line);border-radius:6px;padding:20px}
.panel + .panel{margin-top:16px}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--fg2);margin-bottom:14px}

/* main menu */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 34px}
.hero .title{font-size:min(11vw,78px);font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  background:linear-gradient(100deg,var(--att) 5%,#ffffff 45%,var(--def) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.hero .sub{color:var(--fg2);letter-spacing:.16em;text-transform:uppercase;font-size:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.mode-card{position:relative;border:1px solid var(--line);border-radius:6px;padding:18px;
  background:linear-gradient(180deg,#171f2a,#0f141c);cursor:pointer;transition:.14s;overflow:hidden}
.mode-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.mode-card .k{font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;font-weight:700}
.mode-card .n{font-size:19px;font-weight:700;margin:6px 0 4px}
.mode-card .d{font-size:12.5px;color:var(--fg2);line-height:1.5}
.mode-card::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;
  background:radial-gradient(circle,rgba(255,122,47,.14),transparent 70%)}

/* map picker */
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.map-card{border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;
  background:#11161e;transition:.14s;position:relative}
.map-card:hover{border-color:var(--line2);transform:translateY(-2px)}
.map-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.map-card canvas{width:100%;height:104px;display:block;background:#0c1016}
.map-card .info{padding:10px 12px}
.map-card .info b{display:block;font-size:14px}
.map-card .info span{font-size:11.5px;color:var(--fg3);line-height:1.4;display:block;margin-top:3px}
.map-card .votes{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);
  border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700}

/* lobby */
.lobby-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team-col{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.team-col .th{padding:10px 14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px}
.team-col.att .th{background:linear-gradient(180deg,rgba(224,165,58,.25),rgba(224,165,58,.06));color:var(--att)}
.team-col.def .th{background:linear-gradient(180deg,rgba(74,168,255,.25),rgba(74,168,255,.06));color:var(--def)}
.slot{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px}
.slot .dot{width:7px;height:7px;border-radius:50%;background:var(--fg3);flex:none}
.slot .dot.ready{background:var(--good);box-shadow:0 0 8px var(--good)}
.slot .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .bot{font-size:10.5px;color:var(--fg3);border:1px solid var(--line2);padding:1px 5px;border-radius:3px}
.slot.empty{color:var(--fg3);font-style:italic}
.code-box{display:flex;align-items:center;gap:10px;background:#0d1219;border:1px dashed var(--line2);
  border-radius:6px;padding:14px 16px}
.code-box .code{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.22em;color:var(--accent)}
.chatlog{height:190px;overflow-y:auto;background:#0c1016;border:1px solid var(--line);
  border-radius:4px;padding:8px;font-size:12.5px;line-height:1.55}
.chatlog div{margin-bottom:2px;word-break:break-word}

/* settings */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 16px;border:none;background:none;color:var(--fg3);cursor:pointer;
  font-weight:600;font-size:13px;border-bottom:2px solid transparent}
.tab:hover{color:var(--fg2)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.setting{display:grid;grid-template-columns:200px 1fr 62px;gap:14px;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(35,44,57,.5)}
.setting:last-child{border-bottom:none}
.setting > label{font-size:13.5px;color:var(--fg)}
.setting .val{text-align:right;color:var(--fg2);font-family:var(--mono);font-size:12.5px}
.setting .hint{grid-column:1/-1;font-size:11.5px;color:var(--fg3);margin-top:-4px}
.keybind{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:#0e131a;font-size:13px}
.keybind b{font-family:var(--mono);font-size:12px;color:var(--accent);padding:2px 8px;
  background:#161d27;border-radius:3px;min-width:74px;text-align:center;cursor:pointer}
.keybind b.listening{background:var(--accent);color:#150b03;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.keys-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
#xhairPreview{width:100%;height:150px;background:
  repeating-conic-gradient(#161d27 0% 25%,#111720 0% 50%) 50%/22px 22px;border-radius:4px;border:1px solid var(--line)}

/* cosmetics */
.skin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.skin{border:1px solid var(--line);border-radius:5px;padding:10px;cursor:pointer;background:#10151d;transition:.12s}
.skin:hover{border-color:var(--line2)}
.skin.sel{border-color:var(--accent);background:#181d26}
.skin .sw{height:30px;border-radius:3px;margin-bottom:8px}
.skin b{font-size:12.5px;display:block}
.skin span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.r-common{color:#9daabb}.r-uncommon{color:#5b9bd5}.r-rare{color:#8a6bd8}
.r-epic{color:#d668c8}.r-legendary{color:#e0a53a}

/* ============================================================
   HUD
   ============================================================ */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--font);z-index:20}
#hud .panelish{background:rgba(9,12,17,.62);border:1px solid rgba(52,64,80,.6);border-radius:4px}

/* top bar */
#topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;align-items:stretch;gap:2px;border-radius:5px;overflow:hidden;
  background:rgba(8,11,16,.72);border:1px solid rgba(52,64,80,.55);box-shadow:0 4px 18px rgba(0,0,0,.45)}
#topbar .side{display:flex;flex-direction:column;justify-content:center;align-items:center;
  min-width:78px;padding:5px 12px}
#topbar .side .sc{font-size:26px;font-weight:800;line-height:1}
#topbar .side .nm{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:2px}
#topbar .side.att{background:linear-gradient(180deg,rgba(224,165,58,.22),transparent);color:var(--att)}
#topbar .side.def{background:linear-gradient(180deg,rgba(74,168,255,.22),transparent);color:var(--def)}
#topbar .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 18px;min-width:110px}
#topbar .clock{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#topbar .clock.urgent{color:var(--bad);animation:pulse .8s infinite}
#topbar .phase{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-top:3px}
#topbar .alive{display:flex;gap:3px;margin-top:5px}
#topbar .alive i{width:6px;height:6px;border-radius:50%;background:#39445a;display:block}
#topbar .alive i.on.att{background:var(--att)}
#topbar .alive i.on.def{background:var(--def)}

/* bomb strip */
#bombstrip{position:absolute;top:74px;left:50%;transform:translateX(-50%);
  padding:5px 16px;border-radius:4px;background:rgba(140,20,16,.85);
  font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;box-shadow:0 3px 14px rgba(0,0,0,.5)}
#bombstrip .t{font-variant-numeric:tabular-nums;font-size:15px}
#bombstrip.def{background:rgba(30,95,150,.9)}

/* health / armour */
#vitals{position:absolute;left:22px;bottom:22px;display:flex;align-items:flex-end;gap:16px}
.vital{display:flex;align-items:baseline;gap:7px}
.vital .ico{font-size:13px;opacity:.75}
.vital .num{font-size:34px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 8px rgba(0,0,0,.8)}
.vital.hp .num{color:var(--hp)}
.vital.hp.low .num{color:var(--bad)}
.vital.ar .num{font-size:24px;color:#8fc3f0}
#vitals .bars{position:absolute;left:2px;bottom:-8px;width:230px;height:3px;background:rgba(255,255,255,.1);border-radius:2px}
#vitals .bars i{display:block;height:100%;background:var(--hp);border-radius:2px;transition:width .18s}
#vitals .bars i.low{background:var(--bad)}
#kitbadge{margin-left:4px;font-size:10px;letter-spacing:.1em;color:var(--def);
  border:1px solid rgba(74,168,255,.5);border-radius:3px;padding:2px 6px;text-transform:uppercase}

/* ammo / weapon */
#ammo{position:absolute;right:22px;bottom:22px;text-align:right}
#ammo .wname{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);margin-bottom:2px}
#ammo .count{font-size:36px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 8px rgba(0,0,0,.8)}
#ammo .count small{font-size:19px;color:var(--fg3);font-weight:600}
#ammo .count.empty{color:var(--bad)}
#ammo .nades{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
#ammo .nade{width:26px;height:26px;border-radius:3px;border:1px solid rgba(90,104,124,.55);
  background:rgba(10,14,20,.6);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;position:relative}
#ammo .nade.on{border-color:var(--accent);background:rgba(255,122,47,.2)}
#ammo .nade i{position:absolute;bottom:-4px;right:-3px;background:#0d1219;border-radius:6px;
  font-size:9px;padding:0 3px;font-style:normal;border:1px solid var(--line2)}

/* money */
#money{position:absolute;left:22px;bottom:78px;display:flex;align-items:center;gap:8px}
#money .amt{font-size:22px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums;
  text-shadow:0 2px 8px rgba(0,0,0,.8)}
#money .delta{font-size:14px;font-weight:700;opacity:0;transition:opacity .2s}
#money .delta.show{opacity:1}
#money .delta.plus{color:var(--good)}#money .delta.minus{color:var(--bad)}
#teamecon{position:absolute;left:22px;bottom:108px;font-size:11px;color:var(--fg3);letter-spacing:.06em}

/* killfeed */
#killfeed{position:absolute;top:14px;right:16px;display:flex;flex-direction:column;
  align-items:flex-end;gap:3px;max-width:min(46vw,520px)}
.kf{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:3px;
  background:rgba(8,11,16,.68);font-size:12.5px;font-weight:600;animation:kfin .18s ease}
@keyframes kfin{from{opacity:0;transform:translateX(14px)}}
.kf.fade{opacity:0;transition:opacity .4s}
.kf .a{color:var(--att)}.kf .d{color:var(--def)}
.kf .w{color:var(--fg2);font-size:11px;letter-spacing:.04em}
.kf .icon{font-size:13px;opacity:.9}
.kf.mine{outline:1px solid rgba(255,122,47,.7)}

/* radar */
#radar{position:absolute;top:12px;left:12px;width:190px;height:190px;
  border-radius:5px;background:rgba(8,11,16,.6);border:1px solid rgba(52,64,80,.6);overflow:hidden}
#radar canvas{width:100%;height:100%}
#radar .callout{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--fg2);text-shadow:0 1px 3px #000}

/* teammates */
#mates{position:absolute;left:12px;top:212px;display:flex;flex-direction:column;gap:3px;width:190px}
.mate{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:3px;
  background:rgba(8,11,16,.55);font-size:11.5px}
.mate .hpb{flex:1;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.mate .hpb i{display:block;height:100%;background:var(--good)}
.mate.dead{opacity:.4}
.mate .vm{color:var(--good);font-size:10px}
.mate .nm{width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mate .wp{font-size:9.5px;color:var(--fg3);width:38px;text-align:right;overflow:hidden}

/* crosshair + hitmarker */
#xhair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
#hitmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
#hitmark.on{animation:hm .28s ease-out}
@keyframes hm{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}

/* damage numbers */
.dmgnum{position:absolute;font-weight:800;font-size:17px;pointer-events:none;
  text-shadow:0 2px 6px #000;animation:dn 1s ease-out forwards}
@keyframes dn{0%{opacity:1;transform:translateY(0) scale(.85)}
  20%{transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

/* overlays */
#flashoverlay{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#dmgoverlay{position:fixed;inset:0;pointer-events:none;z-index:29;opacity:0;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(150,10,10,.75) 100%);transition:opacity .28s}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:28;opacity:0;
  background:radial-gradient(ellipse at center,transparent 48%,rgba(120,0,0,.55) 100%)}
#burnoverlay{position:fixed;inset:0;pointer-events:none;z-index:28;opacity:0;
  background:radial-gradient(ellipse at 50% 110%,rgba(255,110,20,.5),transparent 60%)}
#scopeoverlay{position:fixed;inset:0;pointer-events:none;z-index:27;display:none}
#scopeoverlay .lens{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,
  transparent 0,transparent 29%,rgba(0,0,0,.97) 31%)}

#scopeoverlay .cross .h{left:0;right:0;top:50%;height:1px}
#scopeoverlay .cross .v{top:0;bottom:0;left:50%;width:1px}

/* banners */
#banner{position:absolute;top:24%;left:50%;transform:translateX(-50%);text-align:center;
  pointer-events:none;opacity:0;transition:opacity .3s}
#banner.show{opacity:1}
#banner .big{font-size:min(6.6vw,52px);font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  text-shadow:0 4px 26px rgba(0,0,0,.85)}
#banner .small{font-size:15px;color:var(--fg2);letter-spacing:.08em;margin-top:6px}
#banner .mvp{margin-top:14px;font-size:14px;color:var(--att);letter-spacing:.1em}
#centertext{position:absolute;top:57%;left:50%;transform:translateX(-50%);text-align:center;
  font-size:14px;letter-spacing:.06em;color:var(--fg);text-shadow:0 2px 8px #000;pointer-events:none}
#centertext .key{display:inline-block;padding:1px 7px;border:1px solid var(--fg2);border-radius:3px;
  font-family:var(--mono);font-size:12px;margin:0 2px}

/* progress ring (plant / defuse) */
#progress{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:230px;text-align:center}
#progress .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;color:var(--fg2)}
#progress .track{height:6px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
#progress .track i{display:block;height:100%;background:var(--accent);width:0}
#progress.defuse .track i{background:var(--def)}

/* chat */
#chatbox{position:absolute;left:16px;bottom:150px;width:min(430px,42vw);max-height:190px;
  overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.chatline{font-size:12.5px;padding:3px 8px;background:rgba(8,11,16,.6);border-radius:3px;
  width:fit-content;max-width:100%;word-break:break-word;animation:kfin .2s}
.chatline.fade{opacity:0;transition:opacity .5s}
.chatline .who.att{color:var(--att)}.chatline .who.def{color:var(--def)}
.chatline .scope{color:var(--good);font-size:11px}
.chatline.sys{color:var(--fg2);font-style:italic}
#chatinput{position:absolute;left:16px;bottom:118px;width:min(430px,42vw);display:none}
#chatinput.on{display:block}
#chatinput input{background:rgba(8,11,16,.92);border:1px solid var(--accent)}
#chatinput .pfx{position:absolute;left:9px;top:9px;font-size:12px;color:var(--accent);
  text-transform:uppercase;letter-spacing:.08em;pointer-events:none}
#chatinput.team input{padding-left:62px}
#chatinput.all input{padding-left:52px}

/* voice indicator */
#voicehud{position:absolute;right:22px;bottom:150px;display:flex;flex-direction:column;
  align-items:flex-end;gap:4px}
.vspeak{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:3px;
  background:rgba(8,11,16,.65)}
.vspeak .mic{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
#pttstate{font-size:11px;color:var(--fg3);letter-spacing:.08em}
#pttstate.on{color:var(--good)}

/* buy menu */
#buymenu{position:fixed;inset:0;z-index:50;background:rgba(6,9,13,.9);display:flex;flex-direction:column}
#buymenu .bhead{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
  border-bottom:1px solid var(--line)}
#buymenu .bhead .money{font-size:24px;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums}
#buymenu .bbody{flex:1;display:grid;grid-template-columns:186px 1fr 290px;overflow:hidden}
#buycats{border-right:1px solid var(--line);padding:12px;overflow-y:auto}
.bcat{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:4px;
  cursor:pointer;font-size:13.5px;font-weight:600;color:var(--fg2)}
.bcat:hover{background:#161d27;color:var(--fg)}
.bcat.on{background:#1d2634;color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.bcat kbd{font-family:var(--mono);font-size:11px;color:var(--fg3);border:1px solid var(--line2);
  border-radius:3px;padding:0 5px}
#buyitems{padding:14px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));
  gap:10px;align-content:start}
.bitem{border:1px solid var(--line);border-radius:5px;padding:11px 13px;cursor:pointer;
  background:linear-gradient(180deg,#151b24,#0f141b);transition:.12s;position:relative}
.bitem:hover{border-color:var(--accent);transform:translateY(-2px)}
.bitem.cant{opacity:.42;cursor:not-allowed;transform:none}
.bitem.owned{border-color:var(--good)}
.bitem .n{font-size:13.5px;font-weight:700}
.bitem .c{font-size:10.5px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.bitem .p{position:absolute;right:12px;top:11px;font-weight:700;color:var(--good);font-size:13.5px}
.bitem kbd{position:absolute;right:12px;bottom:9px;font-family:var(--mono);font-size:10.5px;color:var(--fg3)}
#buyinfo{border-left:1px solid var(--line);padding:16px;overflow-y:auto}
#buyinfo h4{font-size:17px;margin-bottom:3px}
#buyinfo .cls{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:12px}
#buyinfo p{font-size:12.5px;color:var(--fg2);line-height:1.6;margin-bottom:14px}
.statrow{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;
  font-size:11.5px;margin-bottom:6px;color:var(--fg2)}
.statrow .bar{height:4px;background:#1b2330;border-radius:2px;overflow:hidden}
.statrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb266)}
.statrow .v{text-align:right;font-family:var(--mono);color:var(--fg)}
#buyloadout{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.lo-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;color:var(--fg2)}
.lo-row b{color:var(--fg)}

/* scoreboard */
#scoreboard{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;
  background:rgba(5,8,12,.86);backdrop-filter:blur(3px)}
#scoreboard .sb{width:min(980px,94vw);max-height:92vh;overflow-y:auto;
  background:linear-gradient(180deg,#131922,#0c1017);border:1px solid var(--line);border-radius:7px}
.sbhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.sbhead .score{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:800}
.sbhead .score .a{color:var(--att)}.sbhead .score .d{color:var(--def)}
.sbhead .meta{text-align:right;font-size:12px;color:var(--fg3);line-height:1.6}
.sbteam{padding:0 0 8px}
.sbteam .tt{padding:10px 22px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sbteam.att .tt{color:var(--att);background:linear-gradient(90deg,rgba(224,165,58,.16),transparent)}
.sbteam.def .tt{color:var(--def);background:linear-gradient(90deg,rgba(74,168,255,.16),transparent)}
table.sbt{width:100%;border-collapse:collapse;font-size:13px}
table.sbt th{text-align:right;padding:5px 10px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:600}
table.sbt th:first-child,table.sbt td:first-child{text-align:left;padding-left:22px;width:34%}
table.sbt td{padding:6px 10px;text-align:right;border-top:1px solid rgba(35,44,57,.45);font-variant-numeric:tabular-nums}
table.sbt tr.me{background:rgba(255,122,47,.09)}
table.sbt tr.dead td:first-child{opacity:.5}
table.sbt .pname{display:flex;align-items:center;gap:7px}
table.sbt .pname .mv{color:var(--att);font-size:11px}
table.sbt .pname .bt{font-size:9.5px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--fg3)}
.roundhist{display:flex;gap:2px;padding:12px 22px;flex-wrap:wrap;border-top:1px solid var(--line)}
.roundhist i{width:13px;height:13px;border-radius:2px;background:#212a36;display:block}
.roundhist i.a{background:var(--att)}.roundhist i.d{background:var(--def)}

/* spectator */
#spectate{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);text-align:center}
#spectate .who{font-size:16px;font-weight:700}
#spectate .hint{font-size:11.5px;color:var(--fg3);margin-top:3px;letter-spacing:.06em}
#deadinfo{position:absolute;top:46%;left:50%;transform:translateX(-50%);text-align:center;
  font-size:13px;color:var(--fg2);letter-spacing:.06em}

/* perf / net */
#perf{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:11px;
  color:var(--fg3);text-align:right;line-height:1.5;text-shadow:0 1px 2px #000}
#perf b{color:var(--good)}#perf b.bad{color:var(--bad)}#perf b.mid{color:var(--warn)}

/* toast */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:70;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{padding:8px 16px;border-radius:4px;background:rgba(12,16,22,.95);border:1px solid var(--line2);
  font-size:13px;animation:tin .22s ease;box-shadow:var(--shadow)}
.toast.bad{border-color:#7a2a2a;color:#ffb4b4}
.toast.good{border-color:#2a7a4a;color:#b4ffd0}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* menus over game */
#pausemenu .wrap{max-width:420px;margin-top:8vh}

@media (max-width:820px){
  .lobby-grid{grid-template-columns:1fr}
  #buymenu .bbody{grid-template-columns:140px 1fr}
  #buyinfo{display:none}
  #radar{width:130px;height:130px}
  #mates{top:150px;width:130px}
  .setting{grid-template-columns:130px 1fr 52px}
  #topbar .side{min-width:60px}
}

<body>

<canvas id="gl"></canvas>

<div id="loading">
  <div class="logo">Breachpoint</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div class="status" id="loadStatus">Loading</div>
  <div class="tip" id="loadTip">Attackers plant, defenders defuse. Stand still to shoot straight —
    movement wrecks your accuracy, and every rifle has a spray pattern worth learning.</div>
</div>

<div id="ui"></div>

<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b0e13;color:#e7edf5;font-family:system-ui;text-align:center;padding:24px">
    Breachpoint needs JavaScript enabled.
  </div>
</noscript>

<script>

/* ===== 00_math.js ===== */
/* =============================================================
 * BREACHPOINT — core math
 * Pure logic. No THREE, no DOM. Testable in node.
 * Units: meters, seconds, radians (unless noted "deg").
 * ============================================================= */
(function (root) {
  'use strict';
  var CS = (root.CS = root.CS || {});

  var M = {};

  M.EPS = 1e-6;
  M.DEG = Math.PI / 180;
  M.RAD = 180 / Math.PI;

  M.clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  M.lerp = function (a, b, t) { return a + (b - a) * t; };
  M.sign = function (v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); };
  M.smoothstep = function (t) { t = M.clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  /* Frame-rate independent exponential approach. `rate` = fraction remaining after 1s. */
  M.damp = function (a, b, rate, dt) { return b + (a - b) * Math.pow(rate, dt); };

  /* Wrap radians to (-PI, PI] */
  M.wrapPI = function (a) {
    a = a % (Math.PI * 2);
    if (a > Math.PI) a -= Math.PI * 2;
    if (a <= -Math.PI) a += Math.PI * 2;
    return a;
  };
  M.angleDelta = function (from, to) { return M.wrapPI(to - from); };
  M.lerpAngle = function (a, b, t) { return a + M.angleDelta(a, b) * t; };

  /* ---------------- Vec3 (plain objects {x,y,z}) ---------------- */
  function V(x, y, z) { return { x: x || 0, y: y || 0, z: z || 0 }; }
  M.v = V;
  M.vset = function (o, x, y, z) { o.x = x; o.y = y; o.z = z; return o; };
  M.vcopy = function (o, a) { o.x = a.x; o.y = a.y; o.z = a.z; return o; };
  M.vclone = function (a) { return V(a.x, a.y, a.z); };
  M.vadd = function (o, a, b) { o.x = a.x + b.x; o.y = a.y + b.y; o.z = a.z + b.z; return o; };
  M.vsub = function (o, a, b) { o.x = a.x - b.x; o.y = a.y - b.y; o.z = a.z - b.z; return o; };
  M.vscale = function (o, a, s) { o.x = a.x * s; o.y = a.y * s; o.z = a.z * s; return o; };
  M.vmad = function (o, a, b, s) { o.x = a.x + b.x * s; o.y = a.y + b.y * s; o.z = a.z + b.z * s; return o; };
  M.vdot = function (a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; };
  M.vcross = function (o, a, b) {
    var x = a.y * b.z - a.z * b.y, y = a.z * b.x - a.x * b.z, z = a.x * b.y - a.y * b.x;
    o.x = x; o.y = y; o.z = z; return o;
  };
  M.vlen = function (a) { return Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z); };
  M.vlen2 = function (a) { return a.x * a.x + a.y * a.y + a.z * a.z; };
  M.vdist = function (a, b) { var dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z; return Math.sqrt(dx * dx + dy * dy + dz * dz); };
  M.vdist2 = function (a, b) { var dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z; return dx * dx + dy * dy + dz * dz; };
  M.vdistXZ = function (a, b) { var dx = a.x - b.x, dz = a.z - b.z; return Math.sqrt(dx * dx + dz * dz); };
  M.vnorm = function (o, a) {
    var l = M.vlen(a);
    if (l < M.EPS) { o.x = 0; o.y = 0; o.z = 0; return o; }
    o.x = a.x / l; o.y = a.y / l; o.z = a.z / l; return o;
  };
  M.vlerp = function (o, a, b, t) {
    o.x = a.x + (b.x - a.x) * t; o.y = a.y + (b.y - a.y) * t; o.z = a.z + (b.z - a.z) * t; return o;
  };

  /* yaw/pitch (radians) -> unit forward vector.
   * yaw 0 looks down +X, increasing yaw turns toward -Z (right-handed, Y up). */
  M.angleVectors = function (yaw, pitch, out) {
    out = out || V();
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    out.x = cp * cy;
    out.y = sp;
    out.z = -cp * sy;
    return out;
  };
  M.vectorAngles = function (v) {
    var len = Math.sqrt(v.x * v.x + v.z * v.z);
    return { yaw: Math.atan2(-v.z, v.x), pitch: Math.atan2(v.y, len) };
  };

  /* Build an orthonormal basis around forward (for spread cones). */
  M.basisFromForward = function (f, right, up) {
    // world up
    var ux = 0, uy = 1, uz = 0;
    if (Math.abs(f.y) > 0.999) { ux = 1; uy = 0; uz = 0; }
    // right = normalize(cross(f, worldUp))
    var rx = f.y * uz - f.z * uy, ry = f.z * ux - f.x * uz, rz = f.x * uy - f.y * ux;
    var rl = Math.sqrt(rx * rx + ry * ry + rz * rz) || 1;
    right.x = rx / rl; right.y = ry / rl; right.z = rz / rl;
    // up = cross(right, f)
    up.x = right.y * f.z - right.z * f.y;
    up.y = right.z * f.x - right.x * f.z;
    up.z = right.x * f.y - right.y * f.x;
    return right;
  };

  /* ---------------- RNG ---------------- */
  M.mulberry32 = function (seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), 1 | t);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  /* Deterministic per-(seed,index) value in [0,1) — used for shot spread so that
   * host and client agree without sharing RNG state. */
  M.hash01 = function (a, b) {
    var h = Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B);
    h ^= Math.imul(b + 0x165667B1, 0xC2B2AE35);
    h ^= h >>> 13; h = Math.imul(h, 0x27D4EB2F); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };

  /* ---------------- AABB ---------------- */
  /* Box shape: {min:{x,y,z}, max:{x,y,z}} */
  M.aabb = function (cx, cy, cz, hx, hy, hz) {
    return { min: V(cx - hx, cy - hy, cz - hz), max: V(cx + hx, cy + hy, cz + hz) };
  };
  M.aabbOverlap = function (a, b) {
    return a.min.x < b.max.x && a.max.x > b.min.x &&
           a.min.y < b.max.y && a.max.y > b.min.y &&
           a.min.z < b.max.z && a.max.z > b.min.z;
  };
  M.aabbContainsPoint = function (a, p) {
    return p.x >= a.min.x && p.x <= a.max.x &&
           p.y >= a.min.y && p.y <= a.max.y &&
           p.z >= a.min.z && p.z <= a.max.z;
  };
  M.aabbClosestPoint = function (out, a, p) {
    out.x = M.clamp(p.x, a.min.x, a.max.x);
    out.y = M.clamp(p.y, a.min.y, a.max.y);
    out.z = M.clamp(p.z, a.min.z, a.max.z);
    return out;
  };

  /* Ray vs AABB slab test.
   * Returns null or {t, nx, ny, nz} where t is distance along `dir` (dir must be unit). */
  var _rayHit = { t: 0, nx: 0, ny: 0, nz: 0 };
  M.rayAABB = function (ox, oy, oz, dx, dy, dz, box, maxT) {
    var tmin = 0, tmax = maxT;
    var axisMin = 0, signMin = 0;
    var inv, t1, t2, tmp;

    // X
    if (Math.abs(dx) < 1e-9) {
      if (ox < box.min.x || ox > box.max.x) return null;
    } else {
      inv = 1 / dx;
      t1 = (box.min.x - ox) * inv; t2 = (box.max.x - ox) * inv;
      var sx = -1;
      if (t1 > t2) { tmp = t1; t1 = t2; t2 = tmp; sx = 1; }
      if (t1 > tmin) { tmin = t1; axisMin = 0; signMin = sx; }
      if (t2 < tmax) tmax = t2;
      if (tmin > tmax) return null;
    }
    // Y
    if (Math.abs(dy) < 1e-9) {
      if (oy < box.min.y || oy > box.max.y) return null;
    } else {
      inv = 1 / dy;
      t1 = (box.min.y - oy) * inv; t2 = (box.max.y - oy) * inv;
      var sy = -1;
      if (t1 > t2) { tmp = t1; t1 = t2; t2 = tmp; sy = 1; }
      if (t1 > tmin) { tmin = t1; axisMin = 1; signMin = sy; }
      if (t2 < tmax) tmax = t2;
      if (tmin > tmax) return null;
    }
    // Z
    if (Math.abs(dz) < 1e-9) {
      if (oz < box.min.z || oz > box.max.z) return null;
    } else {
      inv = 1 / dz;
      t1 = (box.min.z - oz) * inv; t2 = (box.max.z - oz) * inv;
      var sz = -1;
      if (t1 > t2) { tmp = t1; t1 = t2; t2 = tmp; sz = 1; }
      if (t1 > tmin) { tmin = t1; axisMin = 2; signMin = sz; }
      if (t2 < tmax) tmax = t2;
      if (tmin > tmax) return null;
    }
    if (tmax < 0) return null;
    _rayHit.t = tmin;
    _rayHit.nx = axisMin === 0 ? signMin : 0;
    _rayHit.ny = axisMin === 1 ? signMin : 0;
    _rayHit.nz = axisMin === 2 ? signMin : 0;
    return _rayHit;
  };

  /* Segment vs sphere — used for smoke occlusion. Returns true if the segment
   * passes within `r` of `c`. */
  M.segmentSphere = function (ax, ay, az, bx, by, bz, c, r) {
    var dx = bx - ax, dy = by - ay, dz = bz - az;
    var fx = ax - c.x, fy = ay - c.y, fz = az - c.z;
    var A = dx * dx + dy * dy + dz * dz;
    if (A < M.EPS) return (fx * fx + fy * fy + fz * fz) <= r * r;
    var t = -(fx * dx + fy * dy + fz * dz) / A;
    t = M.clamp(t, 0, 1);
    var px = fx + dx * t, py = fy + dy * t, pz = fz + dz * t;
    return (px * px + py * py + pz * pz) <= r * r;
  };

  /* Length of the portion of segment AB that lies inside sphere(c,r). */
  M.segmentSphereDepth = function (ax, ay, az, bx, by, bz, c, r) {
    var dx = bx - ax, dy = by - ay, dz = bz - az;

      cur: 'knife', lastSlot: 'knife',

      fireTimer: 0, reloadTimer: 0, reloadStage: 0, deployTimer: 0,
      recoilIndex: 0, recoilYaw: 0, recoilPitch: 0, recoilTime: 0,
      fireSpread: 0, shotSeed: (Math.random() * 0x7fffffff) | 0, shotCount: 0,
      triggerHeld: false, burstLeft: 0, burstTimer: 0, chargeTime: 0,
      scoped: false, scopeLevel: 0, inspectTimer: 0,

      planting: 0, defusing: 0, useHeld: false,
      flashAmount: 0, flashTime: 0,
      burnTime: 0, burnSource: null,

      kills: 0, deaths: 0, assists: 0, score: 0, mvps: 0,
      damage: 0, headshots: 0, roundKills: 0, roundDamage: 0,
      hurtBy: {},
      lastAttacker: null,

  };

  /* ---------------------------------------------------------------
   * Inventory helpers
   * ------------------------------------------------------------- */
  P.slotFor = function (p, key) {
    if (key === 'primary') return p.primary;
    if (key === 'secondary') return p.secondary;
    if (key === 'knife') return p.knife;
    if (key === 'bomb') return p.bomb ? { id: 'bomb' } : null;
    if (key.indexOf('nade:') === 0) {
      var id = key.slice(5);
      for (var i = 0; i < p.grenades.length; i++) if (p.grenades[i].id === id) return p.grenades[i];

    return null;
  };
  P.curSlot = function (p) { return P.slotFor(p, p.cur); };
  P.curWeapon = function (p) {
    var s = P.curSlot(p);
    if (!s) return W.get('knife');
    if (s.id === 'bomb') return { id: 'bomb', name: 'Explosive', cls: 'bomb', speed: 6.35, deploy: 0.4 };
    return W.get(s.id) || W.get('knife');
  };

  P.grenadeCount = function (p) {
    var n = 0;

    return n;
  };

  P.giveWeapon = function (p, id, mag, reserve) {
    var w = W.get(id);

      p.grenades.push({ id: id, count: 1 });
      return true;

    var item = { id: id, mag: mag === undefined ? w.mag : mag, reserve: reserve === undefined ? w.reserve : reserve };
    if (w.slot === 1) { p.primary = item; P.switchTo(p, 'primary'); }
    else if (w.slot === 2) { p.secondary = item; if (!p.primary) P.switchTo(p, 'secondary'); }
    else if (w.slot === 3) p.knife = item;

  P.clearInventory = function (p) {

  /* Ordered list of selectable slots — drives the weapon wheel and 1..5 keys. */
  P.slotList = function (p) {
    var list = [];
    if (p.primary) list.push('primary');
    if (p.secondary) list.push('secondary');
    list.push('knife');
    for (var i = 0; i < p.grenades.length; i++) if (p.grenades[i].count > 0) list.push('nade:' + p.grenades[i].id);
    if (p.bomb) list.push('bomb');
    return list;
  };

  P.switchTo = function (p, key) {

    if (!s) return false;
    if (s.count !== undefined && s.count <= 0) return false;

    p.reloadTimer = 0; p.reloadStage = 0;
    p.recoilIndex = 0; p.fireSpread = 0;
    p.scoped = false; p.scopeLevel = 0;
    p.burstLeft = 0; p.chargeTime = 0; p.inspectTimer = 0;
    return true;
  };

  P.switchSlotNumber = function (p, n) {
    if (n === 1) return P.switchTo(p, 'primary');
    if (n === 2) return P.switchTo(p, 'secondary');

    if (n === 4) {
      // cycle through grenades
      var list = [];
      for (var i = 0; i < p.grenades.length; i++) if (p.grenades[i].count > 0) list.push('nade:' + p.grenades[i].id);
      if (!list.length) return false;

  /* ---------------------------------------------------------------
   * Spawning

    p.pos.x = spot.x; p.pos.y = spot.y; p.pos.z = spot.z;
    p.vel.x = p.vel.y = p.vel.z = 0;
    if (spot.yaw !== undefined) p.yaw = spot.yaw;
    p.pitch = 0;
    p.alive = true;
    p.health = C.MAX_HEALTH;
    p.onGround = false;
    p.ducking = false; p.duckAmount = 0;
    p.height = C.STAND_HEIGHT; p.eye = C.EYE_STAND;
    p.recoilYaw = p.recoilPitch = 0; p.recoilIndex = 0; p.fireSpread = 0;
    p.viewPunchYaw = p.viewPunchPitch = 0;
    p.flashAmount = 0; p.flashTime = 0; p.burnTime = 0;
    p.planting = 0; p.defusing = 0;
    p.scoped = false; p.scopeLevel = 0;
    p.deployTimer = 0.3; p.reloadTimer = 0; p.fireTimer = 0;
    p.roundKills = 0; p.roundDamage = 0;
    p.hurtBy = {}; p.lastAttacker = null;

  };

  /* ---------------------------------------------------------------
   * Movement — Source-style accelerate / friction / air control
   * ------------------------------------------------------------- */
  function accelerate(vel, wx, wz, wishSpeed, accel, dt) {
    var current = vel.x * wx + vel.z * wz;
    var addSpeed = wishSpeed - current;
    if (addSpeed <= 0) return;
    var accelSpeed = accel * wishSpeed * dt;
    if (accelSpeed > addSpeed) accelSpeed = addSpeed;
    vel.x += wx * accelSpeed;
    vel.z += wz * accelSpeed;
  }

  function airAccelerate(vel, wx, wz, wishSpeed, dt) {
    var wish = Math.min(wishSpeed, C.AIR_WISH_CAP);
    var current = vel.x * wx + vel.z * wz;
    var addSpeed = wish - current;
    if (addSpeed <= 0) return;
    var accelSpeed = C.AIR_ACCELERATE * wishSpeed * dt;
    if (accelSpeed > addSpeed) accelSpeed = addSpeed;
    vel.x += wx * accelSpeed;
    vel.z += wz * accelSpeed;
  }

  function friction(vel, dt) {
    var speed = Math.sqrt(vel.x * vel.x + vel.z * vel.z);
    if (speed < 0.05) { vel.x = 0; vel.z = 0; return; }
    var control = speed < C.STOP_SPEED ? C.STOP_SPEED : speed;
    var drop = control * C.FRICTION * dt;
    var newSpeed = Math.max(0, speed - drop) / speed;
    vel.x *= newSpeed; vel.z *= newSpeed;
  }

  P.maxSpeed = function (p) {
    var w = P.curWeapon(p);
    var s = w.speed || C.MAX_SPEED;
    if (p.scoped && w.scopeSpeed) s *= w.scopeSpeed;
    if (p.walking) s *= C.WALK_SCALE;
    if (p.ducking) s *= C.CROUCH_SCALE;
    if (p.planting > 0 || p.defusing > 0) s = 0;
    return s;
  };

  P.speed2D = function (p) { return Math.sqrt(p.vel.x * p.vel.x + p.vel.z * p.vel.z); };

  /* cmd: { forward, side, jump, duck, walk, yaw, pitch, dt } */
  P.move = function (p, cmd, world, dt, frozen) {
    if (!p.alive) return;

    p.yaw = cmd.yaw; p.pitch = cmd.pitch;

    // --- duck state
    var wantDuck = !!cmd.duck;
    p.walking = !!cmd.walk;
    var duckTarget = wantDuck ? 1 : 0;
    if (!wantDuck && p.duckAmount > 0) {
      // block standing up under low ceilings
      if (!world.canUncrouch(p.pos.x, p.pos.y, p.pos.z)) duckTarget = 1;
    }
    var duckRate = dt / C.DUCK_TIME;
    if (p.duckAmount < duckTarget) p.duckAmount = Math.min(duckTarget, p.duckAmount + duckRate);
    else if (p.duckAmount > duckTarget) p.duckAmount = Math.max(duckTarget, p.duckAmount - duckRate);
    p.ducking = p.duckAmount > 0.5;
    p.height = M.lerp(C.STAND_HEIGHT, C.CROUCH_HEIGHT, p.duckAmount);
    p.eye = M.lerp(C.EYE_STAND, C.EYE_CROUCH, p.duckAmount);

    if (frozen) { p.vel.x = 0; p.vel.z = 0; cmd = { forward: 0, side: 0, jump: false, duck: cmd.duck, walk: cmd.walk, yaw: cmd.yaw, pitch: cmd.pitch }; }

    // --- wish direction in world space
    var f = cmd.forward || 0, s = cmd.side || 0;
    var len = Math.sqrt(f * f + s * s);
    var wx = 0, wz = 0;
    if (len > 0.001) {
      f /= Math.max(1, len); s /= Math.max(1, len);
      var cy = Math.cos(p.yaw), sy = Math.sin(p.yaw);
      // forward = (cos yaw, -sin yaw); right = (sin yaw, cos yaw)
      wx = cy * f + sy * s;
      wz = -sy * f + cy * s;
      var wl = Math.sqrt(wx * wx + wz * wz);
      if (wl > 0.0001) { wx /= wl; wz /= wl; }
    }
    var wishSpeed = (len > 0.001 ? 1 : 0) * P.maxSpeed(p);

    p.jumpCooldown = Math.max(0, p.jumpCooldown - dt);
    p.landTimer = Math.max(0, p.landTimer - dt);

    if (p.onGround) {
      friction(p.vel, dt);
      accelerate(p.vel, wx, wz, wishSpeed, C.ACCELERATE, dt);
      p.vel.y = 0;
      if (cmd.jump && p.jumpCooldown <= 0 && !frozen) {
        p.vel.y = C.JUMP_SPEED;
        p.onGround = false;
        p.jumpCooldown = C.JUMP_COOLDOWN;
        p.justJumped = true;
      }
    } else {
      airAccelerate(p.vel, wx, wz, wishSpeed, dt);
      p.vel.y -= C.GRAVITY * dt;
      var air = Math.sqrt(p.vel.x * p.vel.x + p.vel.z * p.vel.z);
      if (air > C.MAX_AIR_SPEED) { var k = C.MAX_AIR_SPEED / air; p.vel.x *= k; p.vel.z *= k; }
    }

    var preVelY = p.vel.y;
    var wasAir = !p.onGround;
    world.moveEntity(p, dt, C.PLAYER_RADIUS, p.height, C.STEP_HEIGHT);

    if (wasAir && p.onGround) {
      p.landTimer = 0.35;
      var impact = -preVelY;
      if (impact > C.FALL_DAMAGE_START) {
        p.pendingFallDamage = (impact - C.FALL_DAMAGE_START) * C.FALL_DAMAGE_SCALE;
      }
    }

    // footstep accumulator (audio is emitted by the caller)
    var sp = P.speed2D(p);
    if (p.onGround && sp > 0.4) p.stepDist += sp * dt;
    else if (!p.onGround) p.stepDist = 0;
  };

  /* Distance between footfalls — walking is silent, running is loud. */
  P.footstepInterval = function (p) {
    var sp = P.speed2D(p);
    if (sp < 0.6) return 1e9;
    return M.clamp(2.05 - sp * 0.06, 1.35, 2.0);
  };
  P.footstepVolume = function (p) {
    var sp = P.speed2D(p), mx = C.MAX_SPEED;
    if (p.walking || sp < mx * 0.42) return 0;            // shift-walk makes no sound
    return M.clamp((sp / mx - 0.4) * 1.7, 0, 1);
  };

  /* ---------------------------------------------------------------
   * Weapon state machine
   * ------------------------------------------------------------- */
  P.canAct = function (p) {
    return p.alive && p.deployTimer <= 0 && p.reloadTimer <= 0;
  };

  P.updateWeapon = function (p, dt) {
    p.fireTimer = Math.max(0, p.fireTimer - dt);
    p.deployTimer = Math.max(0, p.deployTimer - dt);
    p.burstTimer = Math.max(0, p.burstTimer - dt);
    p.inspectTimer = Math.max(0, p.inspectTimer - dt);
    p.spawnProtect = Math.max(0, p.spawnProtect - dt);

    var w = P.curWeapon(p);

    if (p.reloadTimer > 0) {
      p.reloadTimer -= dt;
      if (p.reloadTimer <= 0) P.finishReload(p);
    }

    // recoil recovery — the view walks back to where you were aiming
    var rec = w.recovery || 0.32;
    if (p.recoilTime > 0) p.recoilTime -= dt;
    if (p.recoilTime <= 0) {
      var k = Math.pow(0.0008, dt / Math.max(0.05, rec));
      p.recoilYaw *= k; p.recoilPitch *= k;
      if (Math.abs(p.recoilYaw) < 0.002) p.recoilYaw = 0;
      if (Math.abs(p.recoilPitch) < 0.002) p.recoilPitch = 0;
      if (p.recoilYaw === 0 && p.recoilPitch === 0) p.recoilIndex = 0;
    }

    // firing inaccuracy bleeds off
    if (w.inaccDecay !== undefined) {
      p.fireSpread *= Math.pow(w.inaccDecay, dt);
      if (Math.abs(p.fireSpread) < 0.004) p.fireSpread = 0;
    }

    // cosmetic flinch
    p.viewPunchYaw = M.damp(p.viewPunchYaw, 0, 0.0001, dt);
    p.viewPunchPitch = M.damp(p.viewPunchPitch, 0, 0.0001, dt);

    // flash blindness
    if (p.flashAmount > 0) {
      p.flashTime -= dt;
      if (p.flashTime <= 0) p.flashAmount = Math.max(0, p.flashAmount - dt * 1.35);
    }
  };

  P.needsReload = function (p) {
    var s = P.curSlot(p); var w = P.curWeapon(p);
    return s && s.mag !== undefined && w.mag > 0 && s.mag <= 0 && s.reserve > 0;
  };

  P.startReload = function (p) {
    if (!P.canAct(p)) return false;
    var s = P.curSlot(p), w = P.curWeapon(p);
    if (!s || s.mag === undefined || w.mag <= 0) return false;
    if (s.mag >= w.mag || s.reserve <= 0) return false;

    if (w.shellReload) { p.reloadStage = 1; p.reloadTimer = w.reload; }

  P.finishReload = function (p) {
    var s = P.curSlot(p), w = P.curWeapon(p);
    if (!s || s.mag === undefined) return;
    if (w.shellReload) {
      // one shell at a time: keep going until full or the trigger interrupts
      if (s.mag < w.mag && s.reserve > 0) { s.mag++; s.reserve--; }

    return false;
  };

  /* Current cone half-angle in radians. */
  P.inaccuracy = function (p) {
    var w = P.curWeapon(p);

      maxSpeed: C.MAX_SPEED,
      onGround: p.onGround,

      fireSpread: p.fireSpread,
      scoped: p.scoped,
      justLanded: p.landTimer > 0
    });

  /* Aim direction including accumulated recoil. */
  P.aimAngles = function (p) {

  P.eyePos = function (p, out) {

  /* Attempt to fire. Returns a shot descriptor the caller resolves, or null. */
  P.tryFire = function (p, secondary) {
    if (!p.alive || p.deployTimer > 0) return null;
    var w = P.curWeapon(p);
    var s = P.curSlot(p);

    if (w.cls === 'grenade') return null;         // grenades are thrown, not fired
    if (w.id === 'bomb') return null;

    if (p.reloadTimer > 0) {
      if (!P.cancelReload(p)) return null;
    }
    if (p.fireTimer > 0) return null;

    if (w.cls === 'knife') {
      p.fireTimer = 60 / (secondary ? (w.secondaryRpm || 70) : w.rpm);
      return { melee: true, secondary: !!secondary, weapon: w };
    }

    if (s.mag !== undefined && s.mag <= 0) {
      p.fireTimer = 0.2;
      return { dryFire: true, weapon: w };
    }

    // semi-auto guns need the trigger released between shots; a burst is exempt
    if (!w.auto && p.triggerHeld && !(secondary && p.burstLeft > 0)) return null;

    if (s.mag !== undefined) s.mag--;
    p.fireTimer = (secondary && w.burst && p.burstLeft > 1) ? w.interval * 0.62 : w.interval;
    if (!secondary) p.triggerHeld = true;

    var aim = P.aimAngles(p);
    var cone = P.inaccuracy(p);

      yaw: aim.yaw, pitch: aim.pitch,
      cone: cone,
      seed: (p.shotSeed + p.shotCount * 2654435761) | 0,

      pellets: w.pellets || 1,
      recoilIndex: p.recoilIndex

    p.recoilIndex++;

    p.recoilPitch += step.y;

      w.inaccFireMin !== undefined ? w.inaccFireMin : 0, w.inaccFireMax || 6);

    if (p.scoped && (w.cls === 'sniper') && w.bolt) {

  /* ---------------------------------------------------------------
   * Damage
   * ------------------------------------------------------------- */
  P.applyDamage = function (p, healthDmg, armorDmg, attackerId, hitgroup, now) {
    if (!p.alive) return 0;
    var before = p.health;
    p.armor = Math.max(0, p.armor - armorDmg);
    p.health -= healthDmg;
    if (attackerId && attackerId !== p.id) {
      p.hurtBy[attackerId] = (p.hurtBy[attackerId] || 0) + Math.min(before, healthDmg);
      p.lastAttacker = attackerId;
      p.lastHurtTime = now;
    }
    // aim flinch — enough to feel, not enough to be uncontrollable
    var flinch = Math.min(2.2, healthDmg * 0.045);
    p.viewPunchPitch -= flinch;
    p.viewPunchYaw += (M.hash01(p.shotCount, (now * 1000) | 0) - 0.5) * flinch * 1.4;
    if (p.health <= 0) { p.health = 0; p.alive = false; }
    return Math.min(before, healthDmg);
  };

  /* ---------------------------------------------------------------
   * Economy / buying
   * ------------------------------------------------------------- */
  P.canBuy = function (p, id, world, rules, inBuyTime) {
    var w = W.get(id);
    if (!w || !p.alive) return { ok: false, why: 'unavailable' };
    if (!inBuyTime) return { ok: false, why: 'Buy time is over' };
    if (!world.inBuyZone(p.team, p.pos.x, p.pos.y, p.pos.z)) return { ok: false, why: 'Not in the buy zone' };
    if (w.teams.indexOf(p.team) < 0) return { ok: false, why: 'Not available to your team' };
    var price = P.priceFor(p, w);
    if (!rules.infiniteMoney && p.money < price) return { ok: false, why: 'Not enough money' };

    if (w.cls === 'grenade') {
      if (P.grenadeCount(p) >= W.MAX_GRENADES) return { ok: false, why: 'Grenade limit reached' };
      for (var i = 0; i < p.grenades.length; i++) {
        if (p.grenades[i].id === id && p.grenades[i].count >= w.max) return { ok: false, why: 'Already carrying the maximum' };
      }
    }
    if (w.gear === 'kit' && p.kit) return { ok: false, why: 'Already have a kit' };
    if (w.gear === 'armor' && p.armor >= C.MAX_ARMOR && !p.helmet) return { ok: false, why: 'Armour already full' };
    if (w.gear === 'helmet' && p.armor >= C.MAX_ARMOR && p.helmet) return { ok: false, why: 'Already fully equipped' };
    return { ok: true, price: price };
  };

  /* Buying a vest you partly own only charges for the helmet. */
  P.priceFor = function (p, w) {
    if (w.gear === 'helmet' && p.armor > 0 && !p.helmet) return 350;
    return w.price;
  };

  P.buy = function (p, id, world, rules, inBuyTime) {
    var check = P.canBuy(p, id, world, rules, inBuyTime);
    if (!check.ok) return check;
    var w = W.get(id);
    if (!rules.infiniteMoney) p.money -= check.price;

    if (w.gear === 'armor') { p.armor = C.MAX_ARMOR; }
    else if (w.gear === 'helmet') { p.armor = C.MAX_ARMOR; p.helmet = true; }
    else if (w.gear === 'kit') { p.kit = true; }
    else {
      var dropped = null;
      if (w.slot === 1 && p.primary) dropped = p.primary;
      if (w.slot === 2 && p.secondary) dropped = p.secondary;
      P.giveWeapon(p, id);
      check.dropped = dropped;
