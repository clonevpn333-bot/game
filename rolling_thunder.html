<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROLLING THUNDER</title>
<style>
:root{
  --amber:#e8a33d; --amber-dim:#a97728; --ink:#e8e4da; --ink-dim:#9a958a;
  --bg:#0a0c0a; --panel:rgba(12,14,12,0.82); --red:#c23b2e; --green:#7da05a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#game{position:fixed;inset:0}
#game canvas{display:block}
.hidden{display:none !important}

/* ---------- generic screens ---------- */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;transition:opacity .45s ease;opacity:1}
.screen.fading{opacity:0;pointer-events:none}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,5,.72) 0%,rgba(4,6,5,.28) 40%,rgba(4,6,5,.78) 100%)}
.screen > .inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:1100px;width:92%}

/* ---------- title / menu ---------- */
.title-block{text-align:center;margin-bottom:38px}
.title-sup{font-size:13px;letter-spacing:.55em;color:var(--amber);text-transform:uppercase;margin-bottom:10px;font-weight:600}
.title-main{font-size:76px;font-weight:900;letter-spacing:.12em;line-height:.95;text-transform:uppercase;
  background:linear-gradient(180deg,#fdf6e3 0%,#e5d9b8 30%,#8f8368 52%,#d9cba4 62%,#5d523c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.9)) drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.title-sub{margin-top:12px;font-size:12px;letter-spacing:.42em;color:var(--ink-dim);text-transform:uppercase}
.title-rule{width:340px;height:2px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.menu-list{display:flex;flex-direction:column;gap:10px;min-width:340px}
.menu-btn{position:relative;display:block;padding:13px 26px;background:linear-gradient(90deg,rgba(20,22,18,.85),rgba(20,22,18,.55));
  border:1px solid rgba(232,163,61,.22);border-left:3px solid rgba(232,163,61,.55);color:var(--ink);
  font-size:15px;letter-spacing:.32em;text-transform:uppercase;font-weight:600;cursor:pointer;text-align:left;
  transition:all .16s ease;outline:none}
.menu-btn:hover,.menu-btn:focus{background:linear-gradient(90deg,rgba(48,40,22,.92),rgba(30,28,18,.6));border-left-color:var(--amber);color:#fff;padding-left:34px}
.menu-btn:disabled{opacity:.35;cursor:default}
.menu-btn:disabled:hover{padding-left:26px}
.menu-foot{margin-top:34px;font-size:11px;letter-spacing:.22em;color:var(--ink-dim);text-transform:uppercase}

/* ---------- panels (mission select / settings) ---------- */
.panel-title{font-size:26px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin-bottom:6px}
.panel-title small{display:block;font-size:11px;letter-spacing:.4em;color:var(--amber);margin-bottom:8px}
.panel{background:var(--panel);border:1px solid rgba(232,163,61,.18);padding:26px 30px;width:100%;backdrop-filter:blur(3px)}
.mission-grid{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:14px}
.mission-card{display:flex;align-items:center;gap:18px;padding:12px 18px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);cursor:pointer;transition:all .15s ease;text-align:left;color:var(--ink);width:100%}
.mission-card:hover:not(.locked){border-color:var(--amber);background:rgba(232,163,61,.08)}
.mission-card.locked{opacity:.4;cursor:default}
.mission-num{font-size:26px;font-weight:900;color:var(--amber);min-width:46px;letter-spacing:.05em}
.mission-info{flex:1}
.mission-name{font-size:16px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.mission-desc{font-size:12px;color:var(--ink-dim);margin-top:3px;letter-spacing:.04em}
.mission-stats{font-size:11px;color:var(--ink-dim);text-align:right;letter-spacing:.08em;line-height:1.6}
.mission-stats b{color:var(--green)}
.back-row{margin-top:22px}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.06);width:100%}
.set-row label{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.set-row .set-val{font-size:12px;color:var(--amber);min-width:52px;text-align:right;font-weight:700}
.set-row input[type=range]{width:230px;accent-color:var(--amber);cursor:pointer}
.seg{display:flex;gap:6px}
.seg button{padding:6px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--ink-dim);
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.seg button.on{background:rgba(232,163,61,.18);border-color:var(--amber);color:#fff}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
#ammo{position:absolute;right:34px;bottom:28px;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.9)}
#ammo .wname{font-size:12px;letter-spacing:.3em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:2px}
#ammo .mag{font-size:40px;font-weight:800;color:#fff;line-height:1}
#ammo .mag span{font-size:17px;color:var(--ink-dim);font-weight:600}
#ammo .gren{font-size:12px;color:var(--ink-dim);margin-top:4px;letter-spacing:.12em}
#compass-wrap{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:420px;height:34px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#compass{width:420px;height:34px}
#obj-list{position:absolute;top:64px;left:34px;max-width:380px}
.obj-item{font-size:13px;letter-spacing:.06em;color:var(--ink);text-shadow:0 1px 3px #000;margin-bottom:5px;display:flex;gap:8px;align-items:baseline}
.obj-item.done{color:var(--ink-dim);text-decoration:line-through}
.obj-item::before{content:"▸";color:var(--amber)}
.obj-item.done::before{content:"✓";color:var(--green)}
#toast{position:absolute;top:23%;left:50%;transform:translateX(-50%);text-align:center;font-size:19px;font-weight:700;
  letter-spacing:.34em;text-transform:uppercase;color:#fff;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .4s}
#toast small{display:block;font-size:11px;letter-spacing:.4em;color:var(--amber);margin-bottom:6px}
#subtitles{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);max-width:760px;width:86%;text-align:center}
#subtitles .line{display:inline-block;background:rgba(0,0,0,.62);padding:8px 18px;font-size:16.5px;line-height:1.45;border-radius:2px}
#subtitles .who{color:var(--amber);font-weight:700;letter-spacing:.06em}
#crosshair{position:absolute;left:50%;top:50%;width:0;height:0}
#crosshair .l{position:absolute;background:rgba(255,255,255,.92);box-shadow:0 0 2px rgba(0,0,0,.8)}
#crosshair .h{width:9px;height:2px;top:-1px}
#crosshair .v{width:2px;height:9px;left:-1px}
#hitmarker{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#hitmarker .m{position:absolute;width:9px;height:2px;background:#fff;box-shadow:0 0 3px #000}
#hitmarker.kill .m{background:#e04c3c}
#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(140,10,6,.55) 78%,rgba(120,4,2,.85) 100%)}
#dmgdir{position:absolute;left:50%;top:50%;width:0;height:0}
.dmg-arc{position:absolute;width:120px;height:120px;left:-60px;top:-60px;opacity:0;
  background:radial-gradient(ellipse 55% 18% at 50% 6%,rgba(220,40,25,.85),transparent 70%);border-radius:50%}
#interact{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:14px;letter-spacing:.2em;color:#fff;
  text-transform:uppercase;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .2s}
#interact b{color:var(--amber);border:1px solid var(--amber);padding:1px 7px;margin-right:8px;border-radius:2px}
.waypoint{position:absolute;pointer-events:none;text-align:center;transform:translate(-50%,-50%)}
.waypoint .diamond{width:13px;height:13px;margin:0 auto;background:rgba(232,163,61,.14);border:2px solid var(--amber);transform:rotate(45deg);box-shadow:0 0 6px rgba(0,0,0,.7)}
.waypoint .dist{font-size:10.5px;color:#ffd68a;text-shadow:0 1px 3px #000;margin-top:5px;letter-spacing:.08em;font-weight:600}
#health-low{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(150,8,4,.9) 100%)}

/* ---------- cinematics ---------- */
#letterbox .bar{position:fixed;left:0;width:100%;height:0;background:#000;z-index:30;transition:height .8s cubic-bezier(.6,0,.3,1)}
#lb-top{top:0}#lb-bot{bottom:0}
#letterbox.on .bar{height:11vh}
#skip-hint{position:fixed;bottom:13vh;right:30px;z-index:31;font-size:11px;letter-spacing:.3em;color:var(--ink-dim);text-transform:uppercase;opacity:0;transition:opacity .5s}
#skip-hint.on{opacity:.85}

#fade{position:fixed;inset:0;background:#000;z-index:60;opacity:1;pointer-events:none;transition:opacity .7s ease}
#fade.slow{transition-duration:1.8s}

/* ---------- mission end ---------- */
.stats-table{margin:20px 0;width:100%;border-collapse:collapse}
.stats-table td{padding:9px 4px;font-size:14px;letter-spacing:.14em;border-bottom:1px solid rgba(255,255,255,.07)}
.stats-table td:last-child{text-align:right;color:var(--amber);font-weight:700}
.big-result{font-size:38px;font-weight:900;letter-spacing:.28em;text-transform:uppercase;color:#fff;margin-bottom:4px}
.big-result.fail{color:var(--red)}

/* ---------- credits ---------- */
#credits-scroll{height:60vh;overflow:hidden;position:relative;width:100%;text-align:center}
#credits-inner{position:absolute;width:100%;left:0}
#credits-inner h3{font-size:13px;letter-spacing:.4em;color:var(--amber);text-transform:uppercase;margin:34px 0 8px}
#credits-inner p{font-size:16px;letter-spacing:.1em;margin:4px 0;color:var(--ink)}

#boot-msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);z-index:5;letter-spacing:.3em;font-size:13px;text-transform:uppercase}
.paused-note{margin-top:26px;font-size:11px;letter-spacing:.24em;color:var(--ink-dim);text-transform:uppercase;line-height:2.1;text-align:center}
kbd{border:1px solid rgba(255,255,255,.25);padding:0 6px;border-radius:2px;color:var(--ink);font-family:inherit}
</style>
</head>
<body>
<div id="game"></div>
<div id="boot-msg">Loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function(){

/* ==================== 00_util.js ==================== */
/* ============================================================
 * ROLLING THUNDER — core utilities
 * RNG, noise, geometry factory (vertex-colored, transformed,
 * mergeable), canvas textures, math helpers.
 * ============================================================ */
const RT = {};
window.RT = RT;

/* ---------- math ---------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smoothstep = (a, b, t) => { t = clamp((t - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
function angleLerp(a, b, t) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU;
  return a + d * t;
}
RT.math = { clamp, lerp, damp, smoothstep, angleLerp };

/* ---------- seeded RNG ---------- */
function RNG(seed) {
  let s = seed >>> 0;
  const f = () => {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (a, b) => a + f() * (b - a);
  f.int = (a, b) => Math.floor(f.range(a, b + 1));
  f.pick = arr => arr[Math.floor(f() * arr.length) % arr.length];
  f.chance = p => f() < p;
  f.spread = m => (f() - 0.5) * 2 * m;
  return f;
}
RT.RNG = RNG;

/* ---------- value noise + fbm (terrain) ---------- */
const _nz = (() => {
  const P = new Uint8Array(512);
  const r = RNG(1337);
  for (let i = 0; i < 256; i++) P[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[256 + i] = P[i];
  const g = (h, x, y) => ((h & 1) ? x : -x) + ((h & 2) ? y : -y);
  return (x, y) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = x * x * (3 - 2 * x), v = y * y * (3 - 2 * y);
    const a = g(P[P[X] + Y], x, y), b = g(P[P[X + 1] + Y], x - 1, y);
    const c = g(P[P[X] + Y + 1], x, y - 1), d = g(P[P[X + 1] + Y + 1], x - 1, y - 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
})();
function fbm(x, y, oct, lac, gain) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += _nz(x * freq, y * freq) * amp;
    norm += amp; amp *= gain; freq *= lac;
  }
  return sum / norm;
}
RT.noise = _nz; RT.fbm = fbm;

/* ============================================================
 * Geometry factory — every helper returns a non-indexed
 * BufferGeometry with position/normal/color, pre-transformed,
 * ready for mergeGeos(). One merged geometry = one draw call.
 * ============================================================ */
const _color = new THREE.Color();
/* authored colors are sRGB hex; renderer outputs sRGB, so store LINEAR
 * values in vertex colors for a faithful round-trip */
RT.lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
function paintGeo(geo, hex, variation) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const n = g.attributes.position.count;
  const cols = new Float32Array(n * 3);
  _color.set(hex).convertSRGBToLinear();
  const r0 = _color.r, g0 = _color.g, b0 = _color.b;
  for (let f = 0; f < n; f += 3) {
    let vr = 1;
    if (variation) vr = 1 + (Math.sin(f * 12.9898) * 43758.5453 % 1) * variation;
    for (let k = 0; k < 3; k++) {
      cols[(f + k) * 3] = clamp(r0 * vr, 0, 1);
      cols[(f + k) * 3 + 1] = clamp(g0 * vr, 0, 1);
      cols[(f + k) * 3 + 2] = clamp(b0 * vr, 0, 1);
    }
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  return g;
}
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v3 = new THREE.Vector3(), _sc = new THREE.Vector3();
function xform(geo, o) {
  if (!o) return geo;
  _e.set(o.rx || 0, o.ry || 0, o.rz || 0, o.ord || 'XYZ');
  _q.setFromEuler(_e);
  _v3.set(o.x || 0, o.y || 0, o.z || 0);
  _sc.set(o.sx != null ? o.sx : (o.s != null ? o.s : 1), o.sy != null ? o.sy : (o.s != null ? o.s : 1), o.sz != null ? o.sz : (o.s != null ? o.s : 1));
  _m4.compose(_v3, _q, _sc);
  geo.applyMatrix4(_m4);
  return geo;
}
/* merge list of non-indexed BufferGeometries (position/normal/color/uv) */
function mergeGeos(list) {
  let total = 0;
  for (const g of list) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3);
  const uv = new Float32Array(total * 2);
  let off = 0;
  for (const g of list) {
    pos.set(g.attributes.position.array, off * 3);
    nor.set(g.attributes.normal.array, off * 3);
    col.set(g.attributes.color.array, off * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, off * 2);
    off += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return out;
}
RT.mergeGeos = mergeGeos;
RT.paintGeo = paintGeo;

const G = {
  box(w, h, d, c, o) { return xform(paintGeo(new THREE.BoxGeometry(w, h, d), c, o && o.vary), o); },
  /* chamfered box: silhouette bevels for weapons/props. ch = chamfer size */
  cbox(w, h, d, ch, c, o) {
    ch = Math.min(ch, w * 0.49, h * 0.49, d * 0.49);
    const sh = new THREE.Shape();
    const hw = w / 2 - ch, hh = h / 2 - ch;
    sh.moveTo(-hw, -hh - ch); sh.lineTo(hw, -hh - ch);
    sh.absarc(hw, -hh, ch, -Math.PI / 2, 0, false);
    sh.lineTo(hw + ch, hh);
    sh.absarc(hw, hh, ch, 0, Math.PI / 2, false);
    sh.lineTo(-hw, hh + ch);
    sh.absarc(-hw, hh, ch, Math.PI / 2, Math.PI, false);
    sh.lineTo(-hw - ch, -hh);
    sh.absarc(-hw, -hh, ch, Math.PI, Math.PI * 1.5, false);
    const g = new THREE.ExtrudeGeometry(sh, { depth: d - 2 * ch, bevelEnabled: true, bevelThickness: ch, bevelSize: ch, bevelSegments: 1, curveSegments: 2 });
    g.translate(0, 0, -(d - 2 * ch) / 2);
    return xform(paintGeo(g, c, o && o.vary), o);
  },
  cyl(rt, rb, h, seg, c, o) { return xform(paintGeo(new THREE.CylinderGeometry(rt, rb, h, seg), c, o && o.vary), o); },
  cylo(rt, rb, h, seg, c, o) { return xform(paintGeo(new THREE.CylinderGeometry(rt, rb, h, seg, 1, true), c, o && o.vary), o); },
  tube(r, h, seg, c, o) { return G.cyl(r, r, h, seg, c, o); },
  cone(r, h, seg, c, o) { return xform(paintGeo(new THREE.ConeGeometry(r, h, seg), c, o && o.vary), o); },
  sph(r, ws, hs, c, o) { return xform(paintGeo(new THREE.SphereGeometry(r, ws, hs), c, o && o.vary), o); },
  sphPart(r, ws, hs, phiLen, c, o) { return xform(paintGeo(new THREE.SphereGeometry(r, ws, hs, 0, TAU, 0, phiLen), c, o && o.vary), o); },
  lathe(pts, seg, c, o) {
    const v = pts.map(p => new THREE.Vector2(p[0], p[1]));
    return xform(paintGeo(new THREE.LatheGeometry(v, seg), c, o && o.vary), o);
  },
  torus(r, t, rs, ts, c, o) { return xform(paintGeo(new THREE.TorusGeometry(r, t, rs, ts), c, o && o.vary), o); },
  plane(w, h, c, o) { return xform(paintGeo(new THREE.PlaneGeometry(w, h), c, o && o.vary), o); },
  /* wedge (triangular prism), apex along +y, length d along z */
  wedge(w, h, d, c, o) {
    const sh = new THREE.Shape();
    sh.moveTo(-w / 2, 0); sh.lineTo(w / 2, 0); sh.lineTo(0, h); sh.closePath();
    const g = new THREE.ExtrudeGeometry(sh, { depth: d, bevelEnabled: false });
    g.translate(0, 0, -d / 2);
    return xform(paintGeo(g, c, o && o.vary), o);
  },
  /* loft: stitch elliptical cross-section rings along y.
   * sections: [{y, rx, rz, x?, z?}] bottom→top. Smooth normals, capped ends. */
  loft(sections, seg, c, o) {
    const pos = [], idx = [];
    for (const s of sections) {
      for (let i = 0; i < seg; i++) {
        const a = (i / seg) * TAU;
        pos.push((s.x || 0) + Math.cos(a) * s.rx, s.y, (s.z || 0) + Math.sin(a) * s.rz);
      }
    }
    for (let r = 0; r < sections.length - 1; r++) {
      for (let i = 0; i < seg; i++) {
        const a = r * seg + i, b = r * seg + (i + 1) % seg;
        const c2 = (r + 1) * seg + i, d = (r + 1) * seg + (i + 1) % seg;
        idx.push(a, c2, b, b, c2, d);
      }
    }
    // caps (fan to centroid)
    const nRings = sections.length;
    const bC = pos.length / 3; pos.push(sections[0].x || 0, sections[0].y, sections[0].z || 0);
    const tC = pos.length / 3; pos.push(sections[nRings - 1].x || 0, sections[nRings - 1].y, sections[nRings - 1].z || 0);
    for (let i = 0; i < seg; i++) {
      idx.push(bC, i, (i + 1) % seg);
      idx.push(tC, (nRings - 1) * seg + (i + 1) % seg, (nRings - 1) * seg + i);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return xform(paintGeo(g, c, o && o.vary), o);
  },
  extrude(shape, depth, c, o, bevel) {

  E.getShakeOffset = function (out) {
    const t2 = trauma * trauma;
    out.x = t2 * 0.045 * (RT.noise(E.time * 34, 7.3));
    out.y = t2 * 0.05 * (RT.noise(E.time * 31, 41.7));
    out.z = t2 * 0.03 * (RT.noise(E.time * 29, 83.1));
    return out;
  };
  Object.defineProperty(E, 'trauma', { get: () => trauma });

  /* ---------- ambient life: high, slow bird flocks drifting across the sky ---------- */
  let flock = null, flockT = 6;
  const flockDir = new THREE.Vector3();
  function makeBird() {
    const grp = new THREE.Group();
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0, 0.55, 0, -0.3, 0.55, 0, 0.3]), 3));
    const mat = new THREE.MeshBasicMaterial({ color: 0x26262c, side: THREE.DoubleSide });
    const R = new THREE.Mesh(wg, mat), L = new THREE.Mesh(wg, mat); L.scale.x = -1;
    grp.add(L, R); grp.userData = { L, R, ph: Math.random() * TAU };
    return grp;
  }
  function initFlock() {
    flock = new THREE.Group();
    for (let i = 0; i < 8; i++) {
      const b = makeBird();
      const row = Math.ceil(i / 2);
      b.position.set((i % 2 ? 1 : -1) * row * 1.7, (Math.random() - .5) * 1.2, row * 1.5);
      b.scale.setScalar(1 + Math.random() * 0.6);
      flock.add(b);
    }
    flock.visible = false; scene.add(flock);
  }
  function spawnFlock(camPos) {
    const ang = Math.random() * TAU;
    flockDir.set(Math.cos(ang), 0, Math.sin(ang));
    flock.position.set(camPos.x - flockDir.x * 280, camPos.y + 48 + Math.random() * 46, camPos.z - flockDir.z * 280);
    flock.rotation.y = Math.atan2(flockDir.x, flockDir.z);
    flock.visible = true; flock.userData.travel = 0;
  }
  E.updateAmbient = function (dt, camPos) {
    if (!(RT.game && (RT.game.state === 'play' || RT.game.state === 'br'))) { if (flock) flock.visible = false; return; }
    if (!flock) initFlock();
    if (!flock.visible) { flockT -= dt; if (flockT <= 0) { flockT = 20 + Math.random() * 28; spawnFlock(camPos); } return; }
    flock.position.addScaledVector(flockDir, 14 * dt);
    flock.userData.travel += 14 * dt;
    for (const b of flock.children) {
      b.userData.ph += dt * 6.5;
      const f = Math.sin(b.userData.ph);
      b.userData.L.rotation.z = f * 0.55; b.userData.R.rotation.z = -f * 0.55;
    }
    if (flock.userData.travel > 600) flock.visible = false;
  };

  /* ---------- main loop ---------- */
  const updaters = [];
  E.onUpdate = fn => updaters.push(fn);
  let last = 0, emaMS = 16;
  E.start = function () {
    const loop = (now) => {
      requestAnimationFrame(loop);
      const raw = Math.min(0.05, (now - last) / 1000 || 0.016);
      last = now;
      emaMS = emaMS * 0.95 + (raw * 1000) * 0.05;
      E.frameMS = emaMS;
      /* auto quality: sustained sub-22fps in-game drops to performance mode once */
      if (RT.settings.autoQuality && RT.settings.quality && RT.game && (RT.game.state === 'play' || RT.game.state === 'br')) {
        E._slowAcc = emaMS > 45 ? (E._slowAcc || 0) + raw : Math.max(0, (E._slowAcc || 0) - raw * 0.5);
        if (E._slowAcc > 4) { E._slowAcc = 0; RT.settings.quality = 0; E.applyQuality(); RT.saveSettings(); if (RT.ui) RT.ui.toastMsg('AUTO-QUALITY → PERFORMANCE'); }
      }
      const dt = raw * E.timeScale;
      E.time += dt;
      trauma = Math.max(0, trauma - raw * 1.7);
      for (const u of updaters) u(dt, raw);
      if (RT.windMats) for (const m of RT.windMats) m.userData.uTime.value = E.time;
      updateParticles(dt); updateTracers(dt); updateDecals(dt); updateLights(dt); updateWeather(raw);
      E.updateAmbient(dt, camera.position);
      renderer.render(scene, camera);
    };
    requestAnimationFrame(loop);
  };

  Object.defineProperties(E, {
    scene: { get: () => scene }, camera: { get: () => camera },
    world: { get: () => world }, renderer: { get: () => renderer },
    sun: { get: () => sun },
  });
  return E;
})();

/* ============================================================
 * Input: pointer lock mouse-look with arrow-key fallback.
 * ============================================================ */
RT.input = (() => {
  const I = { keys: {}, mdx: 0, mdy: 0, fire: false, locked: false, fallback: false, wheel: 0, _rmb: false, _kbAim: false, adsToggle: false, _lastDown: 0 };
  /* effective aim = toggled ADS lock (double-click LMB or RMB toggle it — never a hold) */
  Object.defineProperty(I, 'aim', {
    get() { return this.adsToggle || this._kbAim; },
    set(v) { this._kbAim = !!v; },
  });
  const pressed = {};
  I.pressed = k => { const v = pressed[k]; pressed[k] = false; return v; };
  I.consumeMouse = () => { const r = [I.mdx, I.mdy]; I.mdx = I.mdy = 0; return r; };

  I.keyboardMode = () => RT.settings.controls === 'keyboard';
  I.init = function (dom) {
    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      I.keys[e.code] = true; pressed[e.code] = true;
      if (['Space', 'Tab', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (I.keyboardMode()) {
        if (e.code === 'KeyF') { I.fire = true; pressed.Mouse0 = true; }
        if (e.code === 'KeyQ') { I.aim = true; pressed.Aim = true; }
      }
      if (e.code === 'KeyL') { I.fallback = !I.fallback; if (RT.ui) RT.ui.toastMsg(I.fallback ? 'ARROW-KEY LOOK ENABLED' : 'ARROW-KEY LOOK DISABLED'); }
    });
    document.addEventListener('keyup', e => {
      I.keys[e.code] = false;
      if (e.code === 'KeyF' && I.keyboardMode()) I.fire = false;
      if (e.code === 'KeyQ' && I.keyboardMode()) I.aim = false;
    });
    let lastCX = null, lastCY = null;
    document.addEventListener('mousemove', e => {      // on document so overlays never block look
      if (I.locked) {                                  // pointer locked: movementX/Y are the deltas
        I.mdx += e.movementX || 0; I.mdy += e.movementY || 0; lastCX = lastCY = null; return;
      }
      /* unlocked fallback (e.g. embedded preview): derive deltas from cursor position so
         trackpad/mouse still turns the view even when Pointer Lock is unavailable */
      if (RT.game && (RT.game.state === 'play' || RT.game.state === 'br')) {
        if (lastCX != null) { I.mdx += e.clientX - lastCX; I.mdy += e.clientY - lastCY; }
        lastCX = e.clientX; lastCY = e.clientY;
      } else { lastCX = lastCY = null; }
    });
    dom.addEventListener('mousedown', e => {
      if (!I.locked && RT.game && RT.game.state === 'play') I.lock();   // re-grab pointer lock on click
      if (e.button === 0) {
        I.fire = true; pressed.Mouse0 = true;                        // click fires
        if (!I.keyboardMode()) {                                     // mouse scheme: double-click toggles ADS lock
          const now = performance.now();
          if (now - I._lastDown < 400) { I.adsToggle = !I.adsToggle; if (I.adsToggle) pressed.Aim = true; }
          I._lastDown = now;
        }
      }
      if (e.button === 2) { I.adsToggle = !I.adsToggle; if (I.adsToggle) pressed.Aim = true; pressed.Mouse2 = true; }  // RMB also toggles (no hold)
    });
    dom.addEventListener('mouseup', e => {
      if (e.button === 0 && !(I.keyboardMode() && I.keys.KeyF)) I.fire = false;
    });
    dom.addEventListener('contextmenu', e => e.preventDefault());
    dom.addEventListener('wheel', e => { I.wheel += Math.sign(e.deltaY); });
    document.addEventListener('pointerlockchange', () => {
      I.locked = document.pointerLockElement === dom;
      if (!I.locked && RT.game && RT.game.state === 'play') RT.game.pause();
    });
    document.addEventListener('pointerlockerror', () => {
      I.fallback = true;   // pointer lock blocked (e.g. embedded preview) — mouse look still works unlocked
    });
    I.dom = dom;
  };
  I.lock = () => {
    if (I.keyboardMode()) return;                 // keyboard scheme never locks the pointer
    try { I.dom.requestPointerLock(); } catch (e) { I.fallback = true; }
  };
  I.unlock = () => { I.adsToggle = false; I._rmb = false; if (I.locked) document.exitPointerLock(); };
  return I;
})();


/* ==================== 02_audio.js ==================== */
/* ============================================================
 * Audio: 100% procedural WebAudio. Gunshots, foley, explosions,
 * radio crackle, ambient beds, stingers, menu music.
 * ============================================================ */
RT.audio = (() => {
  const AU = {};
  let ctx = null, master, comp, sfx, amb, mus, duck, verb, verbGain, shaper;
  let noiseBuf = null;
  let ambNodes = [], ambType = null, ambTimer = 0;
  let musicNodes = [], musicOn = false, musicTimer = 0;
  let distantVoices = 0;
  AU._nodes = 0;   // synthesis-layer counter (test hook)

  AU.ensure = function () {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return false; }
    /* mix bus: master gain → compressor glue → destination */
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 5;
    comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = RT.settings.volume; master.connect(comp);
    sfx = ctx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);
    duck = ctx.createGain(); duck.gain.value = 1;          // ambient duck bus
    duck.connect(master);
    amb = ctx.createGain(); amb.gain.value = 0.5; amb.connect(duck);
    mus = ctx.createGain(); mus.gain.value = 0.42; mus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    /* convolution reverb with a GENERATED impulse response:
     * 2s stereo decaying noise burst = outdoor tail */
    const irLen = ctx.sampleRate * 2;
    const ir = ctx.createBuffer(2, irLen, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const cd = ir.getChannelData(ch);
      for (let i = 0; i < irLen; i++) {
        const t = i / irLen;
        cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.4) * Math.exp(-3.2 * t) * 0.5;
      }
    }
    verb = ctx.createConvolver(); verb.buffer = ir;
    verbGain = ctx.createGain(); verbGain.gain.value = 0.6;
    verb.connect(verbGain); verbGain.connect(master);
    /* distortion waveshaper for gunshot cracks */
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 3.2); }
    shaper = ctx.createWaveShaper(); shaper.curve = curve; shaper.connect(sfx);
    return true;
  };
  AU.setVolume = v => { if (master) master.gain.value = v; };

  /* ---------- layer helpers (each = one voice in the stack) ---------- */
  function nLayer(t0, o) {
    if (!ctx) return;
    AU._nodes++;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = (o.rate || 1) * (0.94 + Math.random() * 0.12);
    const f = ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f0, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(25, o.f1), t0 + o.dur);
    f.Q.value = o.q || 0.9;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain, t0 + (o.att || 0.0015));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(g);
    g.connect(o.shaped ? shaper : sfx);
    if (o.verb) { const vs = ctx.createGain(); vs.gain.value = o.verb; g.connect(vs); vs.connect(verb); }
    src.start(t0); src.stop(t0 + o.dur + 0.05);
  }
  function tLayer(t0, o) {
    if (!ctx) return;
    AU._nodes++;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + o.dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain, t0 + (o.att || 0.002));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    osc.connect(g); g.connect(sfx);
    if (o.verb) { const vs = ctx.createGain(); vs.gain.value = o.verb; g.connect(vs); vs.connect(verb); }
    osc.start(t0); osc.stop(t0 + o.dur + 0.05);
  }
  /* gunshots duck the ambient bed ~4dB for 200ms */
  function duckAmbient(t0) {
    if (!ctx) return;
    duck.gain.cancelScheduledValues(t0);
    duck.gain.setTargetAtTime(0.62, t0, 0.012);
    duck.gain.setTargetAtTime(1.0, t0 + 0.2, 0.09);
  }

  function noise(dest, t0, dur, { type = 'lowpass', freq = 1000, q = 1, gain = 0.5, att = 0.002, decay = null, freqEnd = null } = {}) {
    if (!ctx) return;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = 0.7 + Math.random() * 0.6;
    const f = ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(30, freqEnd), t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (decay || dur));
    src.connect(f); f.connect(g); g.connect(dest);
    src.start(t0); src.stop(t0 + dur + 0.05);
  }
  function tone(dest, t0, dur, { type = 'sine', freq = 440, freqEnd = null, gain = 0.4, att = 0.002 } = {}) {
    if (!ctx) return;
    const o = ctx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  const now = () => ctx ? ctx.currentTime : 0;

  /* ---------- weapons: layered synthesis (crack/body/sub/tick/tail) ---------- */
  const SHOT_RECIPES = {
    rifle:   { crackDur: 0.011, crackG: 0.5, bodyDur: 0.085, bodyF: 850, bodyG: 0.55, subF: 42, subDur: 0.055, subG: 0.62, verb: 0.32 },
    dmr:     { crackDur: 0.014, crackG: 0.62, bodyDur: 0.12, bodyF: 700, bodyG: 0.68, subF: 40, subDur: 0.09, subG: 0.8, verb: 0.52 },
    shotgun: { crackDur: 0.012, crackG: 0.45, bodyDur: 0.13, bodyF: 600, bodyG: 0.85, subF: 38, subDur: 0.1, subG: 0.95, verb: 0.42, wide: true },
    pistol:  { crackDur: 0.009, crackG: 0.42, bodyDur: 0.06, bodyF: 1000, bodyG: 0.42, subF: 48, subDur: 0.04, subG: 0.4, verb: 0.16 },
  };
  AU.gunshot = function (profile) {
    if (!AU.ensure()) return;
    const t = now();
    const r = SHOT_RECIPES[profile] || SHOT_RECIPES.rifle;
    const v = 0.96 + Math.random() * 0.08;                              // ±4% per shot
    /* 1. crack: hard-attack HP noise through the waveshaper */
    nLayer(t, { dur: r.crackDur, type: 'highpass', f0: 2500, gain: r.crackG * v, att: 0.001, shaped: true, verb: r.verb * 0.5 });
    /* 2. body: bandpass sweep 800→300 */
    nLayer(t, { dur: r.bodyDur, type: 'bandpass', f0: r.bodyF * v, f1: 300, q: 0.8, gain: r.bodyG * v, verb: r.verb });
    if (r.wide) nLayer(t, { dur: r.bodyDur * 1.3, type: 'bandpass', f0: 420, f1: 200, q: 0.7, gain: r.bodyG * 0.7, verb: r.verb });
    /* 3. sub-thump: pitch-dropping sine, felt more than heard */
    tLayer(t, { f0: r.subF * v, f1: 25, dur: r.subDur, gain: r.subG * v, verb: r.verb * 0.4 });
    /* 4. mechanical tick (bolt cycling) */
    nLayer(t + 0.012, { dur: 0.005, type: 'bandpass', f0: 3200, q: 2.5, gain: 0.16 });
    duckAmbient(t);
  };
  AU.enemyShot = function (dist) {
    if (!AU.ensure()) return;
    if (distantVoices > 6) return;                                      // voice pool cap
    distantVoices++;
    setTimeout(() => { distantVoices--; }, 350);
    const t = now();
    const att = clamp(1 - dist / 120, 0.1, 0.85);
    /* distant = lowpassed body + long tail, no crack */
    nLayer(t, { dur: 0.1 + dist * 0.0006, type: 'lowpass', f0: clamp(1600 - dist * 11, 320, 1600), gain: 0.4 * att, verb: clamp(dist / 90, 0.25, 0.75) });
    tLayer(t, { f0: 46, f1: 26, dur: 0.06, gain: 0.32 * att, verb: 0.2 });
    if (dist < 30) nLayer(t, { dur: 0.008, type: 'highpass', f0: 2600, gain: 0.2, shaped: true });
  };
  AU.allyShot = function () {
    if (!AU.ensure()) return;
    const t = now();
    nLayer(t, { dur: 0.075, type: 'bandpass', f0: 800, f1: 320, gain: 0.3, verb: 0.25 });
    tLayer(t, { f0: 44, f1: 27, dur: 0.045, gain: 0.3 });
  };
  AU.crack = function () {
    /* supersonic near-miss snap: 2ms HP tick */
    if (!ctx) return;
    nLayer(now(), { dur: 0.0025, type: 'highpass', f0: 3600, gain: 0.34, att: 0.0006, shaped: true, verb: 0.12 });
  };
  AU.dryClick = () => { if (AU.ensure()) tone(sfx, now(), 0.03, { type: 'square', freq: 900, gain: 0.12 }); };
  AU.magOut = () => { if (ctx) { tone(sfx, now(), 0.04, { type: 'square', freq: 500, gain: 0.1 }); noise(sfx, now(), 0.05, { freq: 1200, gain: 0.08 }); } };
  AU.magIn = () => { if (ctx) { tone(sfx, now(), 0.05, { type: 'square', freq: 350, gain: 0.14 }); tone(sfx, now() + 0.03, 0.04, { type: 'square', freq: 620, gain: 0.1 }); } };
  AU.boltRack = () => { if (ctx) { noise(sfx, now(), 0.06, { type: 'bandpass', freq: 1800, q: 2, gain: 0.16 }); tone(sfx, now() + 0.05, 0.04, { type: 'square', freq: 800, gain: 0.12 }); } };
  AU.reloadStart = () => { if (ctx) noise(sfx, now(), 0.05, { type: 'bandpass', freq: 900, q: 1.4, gain: 0.1 }); };
  AU.shellLoad = () => { if (ctx) { tone(sfx, now(), 0.035, { type: 'square', freq: 480, gain: 0.1 }); noise(sfx, now(), 0.04, { freq: 900, gain: 0.06 }); } };
  AU.shellTink = () => { if (ctx && Math.random() < 0.6) tone(sfx, now(), 0.05, { type: 'triangle', freq: 3400 + Math.random() * 1800, gain: 0.05 }); };
  AU.hitFeedback = function (kill) {
    if (!ctx) return;
    const t = now();
    tone(sfx, t, 0.045, { type: 'triangle', freq: kill ? 620 : 900, gain: 0.13 });
    if (kill) tone(sfx, t + 0.05, 0.07, { type: 'triangle', freq: 420, gain: 0.13 });
  };
  AU.footstep = function (f) {
    if (!ctx) return;
    const t = now();
    noise(sfx, t, 0.07, { type: 'lowpass', freq: 320 + Math.random() * 200, gain: 0.1 + f * 0.1, decay: 0.06 });
  };
  AU.hurt = function () {
    if (!ctx) return;
    tone(sfx, now(), 0.12, { freq: 160, freqEnd: 70, gain: 0.3 });
    noise(sfx, now(), 0.1, { type: 'lowpass', freq: 500, gain: 0.15, decay: 0.09 });
  };
  AU.explosion = function (dist) {
    if (!AU.ensure()) return;
    const t = now();
    const att = clamp(1 - (dist || 0) / 130, 0.15, 1);
    tone(sfx, t, 1.1, { freq: 55, freqEnd: 26, gain: 0.8 * att });
    noise(sfx, t, 0.7, { type: 'lowpass', freq: 1300 * att + 200, freqEnd: 120, gain: 0.7 * att, decay: 0.6 });
    noise(sfx, t + 0.08, 1.4, { type: 'lowpass', freq: 600, freqEnd: 90, gain: 0.3 * att, decay: 1.3 });
    if (dist < 25) noise(sfx, t, 0.25, { type: 'highpass', freq: 1800, gain: 0.2, decay: 0.2 });
  };
  AU.thunder = function (delay) {
    if (!ctx) return;
    const t = now() + (delay || 0);
    tone(sfx, t, 2.2, { freq: 48, freqEnd: 22, gain: 0.5 });
    noise(sfx, t, 2.8, { type: 'lowpass', freq: 420, freqEnd: 70, gain: 0.4, decay: 2.5 });
    noise(sfx, t + 0.35, 1.4, { type: 'lowpass', freq: 240, gain: 0.22, decay: 1.3 });
  };
  AU.mortarWhistle = function (dur) {
    if (!AU.ensure()) return;
    tone(sfx, now(), dur || 1.1, { type: 'sine', freq: 2400, freqEnd: 700, gain: 0.09 });
  };
  AU.chargeBeep = function (n) {
    if (!ctx) return;
    for (let i = 0; i < (n || 3); i++) tone(sfx, now() + i * 0.5, 0.09, { type: 'square', freq: 1800, gain: 0.07 });
  };
  AU.radioCrackle = function () {
    if (!ctx) return;
    const t = now();
    noise(sfx, t, 0.05, { type: 'highpass', freq: 2200, gain: 0.07 });
    noise(sfx, t + 0.07, 0.03, { type: 'highpass', freq: 3000, gain: 0.05 });
  };
  AU.doorCreak = function () {
    if (!ctx) return;
    tone(sfx, now(), 0.35, { type: 'sawtooth', freq: 180 + Math.random() * 80, freqEnd: 120, gain: 0.045 });
  };
  AU.doorKick = function () {
    if (!ctx) return;
    tone(sfx, now(), 0.09, { freq: 120, freqEnd: 55, gain: 0.4 });
    noise(sfx, now(), 0.14, { type: 'lowpass', freq: 900, gain: 0.3, decay: 0.13 });
  };
  AU.gBounce = () => { if (ctx) tone(sfx, now(), 0.05, { type: 'triangle', freq: 1300 + Math.random() * 500, gain: 0.07 }); };

/* ============================================================
 * Character construction system.

RT.character = (() => {
  const C = {};

  function camo(geo, cols) {
    const arr = geo.attributes.color.array;

    const pos = geo.attributes.position.array;

  /* ---------- hand with individual fingers ----------

      G.box(0.03, 0.09, 0.04, dark, { y: -0.075, z: -0.13, rx: -0.25 }),         // grip
      G.cbox(0.04, 0.06, 0.24, 0.008, g, { z: -0.28, y: 0.005 }),                // stock
      G.box(0.045, 0.09, 0.03, adj(g, 0.85), { z: -0.39, y: -0.005 }),           // buttpad
    ];
    return RT.meshOf(geos, RT.MAT.gun);
  }
  C.buildNPCRifle = buildNPCRifle;

  /* ============================================================
   * buildSoldier(opts)
   * opts: {seed, faction, paletteIdx, headgear, skin, rifle:true}
   * Returns rig {group, j:{joints}, anim, cfg, meshes}
   * Soldier faces +Z. Feet at y=0. Height ~1.78.
   * ============================================================ */
  C.build = function (opts) {
    opts = opts || {};
    const rnd = RNG(opts.seed != null ? opts.seed : (Math.random() * 1e9) | 0);
    const faction = opts.faction || 'ally';
    const pals = UNIFORMS[faction];
    const pal = pals[opts.paletteIdx != null ? opts.paletteIdx % pals.length : rnd.int(0, pals.length - 1)];
    const skin = opts.skin != null ? opts.skin : rnd.pick(SKINS);
    const headgear = opts.headgear || (faction === 'enemy' ? 'helmet' : rnd.pick(['helmet', 'helmet', 'helmet', 'boonie', 'beanie']));
    const gear = pal.gear;
    const MS = RT.MAT.std;

    const group = new THREE.Group();
    const j = {};
    const mk = (name, parent, x, y, z) => {
      const o = new THREE.Object3D();
      o.position.set(x, y, z); parent.add(o); j[name] = o; return o;
    };

    const HIP_Y = 0.94;
    const hips = mk('hips', group, 0, HIP_Y, 0);
    const spine = mk('spine', hips, 0, 0.1, 0);
    const chest = mk('chest', spine, 0, 0.16, 0);
    const neck = mk('neck', chest, 0, 0.245, 0.01);
    const head = mk('head', neck, 0, 0.1, 0);
    const shL = mk('shL', chest, -0.208, 0.19, 0);
    const shR = mk('shR', chest, 0.208, 0.19, 0);
    const elL = mk('elL', shL, 0, -0.285, 0);
    const elR = mk('elR', shR, 0, -0.285, 0);
    const wrL = mk('wrL', elL, 0, -0.26, 0);
    const wrR = mk('wrR', elR, 0, -0.26, 0);
    const hipL = mk('hipL', hips, -0.098, -0.02, 0);
    const hipR = mk('hipR', hips, 0.098, -0.02, 0);
    const kneeL = mk('kneeL', hipL, 0, -0.43, 0);
    const kneeR = mk('kneeR', hipR, 0, -0.43, 0);
    const ankL = mk('ankL', kneeL, 0, -0.4, 0);
    const ankR = mk('ankR', kneeR, 0, -0.4, 0);

    const meshes = [];
    const addM = (parent, geos, mat) => {
      const m = RT.meshOf(geos, mat || MS);
      parent.add(m); meshes.push(m); return m;
    };

    /* pelvis + belt + holster + rear pouch */
    {
      const geos = [];
      geos.push(camo(G.lathe([[0.128, -0.12], [0.15, -0.03], [0.152, 0.06], [0.148, 0.14], [0.06, 0.17]], 12, pal.pt[0], { sz: 0.8 }), pal.pt));
      geos.push(G.torus(0.143, 0.02, 6, 14, 0x3a3428, { y: 0.075, rx: Math.PI / 2, sz: 0.84 })); // belt
      geos.push(G.box(0.045, 0.032, 0.02, 0x8a8a80, { z: 0.124, y: 0.075 }));                  // buckle
      geos.push(G.cbox(0.05, 0.11, 0.045, 0.01, gear, { x: 0.155, y: -0.03, z: 0.03, rz: -0.08 })); // holster
      geos.push(G.cbox(0.09, 0.07, 0.05, 0.01, gear, { z: -0.135, y: 0.0, vary: 0.1 }));       // rear pouch
      addM(hips, geos);
    }
    /* torso: tapered lathe + plate carrier + pouches + radio */
    {
      const geos = [];
      const prof = [[0.14, -0.2], [0.148, -0.12], [0.152, -0.04], [0.16, 0.06], [0.168, 0.16], [0.155, 0.235], [0.1, 0.268], [0.05, 0.276]];
      geos.push(camo(G.lathe(prof, 18, pal.jk[0], { sy: 1, sx: 1.14, sz: 0.72 }), pal.jk));
      // shoulder caps
      geos.push(camo(G.sph(0.072, 10, 8, pal.jk[0], { x: -0.2, y: 0.195, sy: 0.85, sz: 0.85 }), pal.jk));
      geos.push(camo(G.sph(0.072, 10, 8, pal.jk[0], { x: 0.2, y: 0.195, sy: 0.85, sz: 0.85 }), pal.jk));
      // plate carrier front + back
      geos.push(G.cbox(0.27, 0.3, 0.05, 0.02, gear, { z: 0.115, y: 0.1, vary: 0.07 }));
      geos.push(G.cbox(0.27, 0.3, 0.045, 0.02, adj(gear, 0.94), { z: -0.11, y: 0.1, vary: 0.07 }));
      // cummerbund sides
      geos.push(G.box(0.05, 0.2, 0.2, adj(gear, 0.88), { x: -0.168, y: 0.06, vary: 0.08 }));
      geos.push(G.box(0.05, 0.2, 0.2, adj(gear, 0.88), { x: 0.168, y: 0.06, vary: 0.08 }));
      // shoulder straps
      geos.push(G.box(0.06, 0.03, 0.2, adj(gear, 0.8), { x: -0.1, y: 0.265, rx: 0.0, vary: 0.06 }));
      geos.push(G.box(0.06, 0.03, 0.2, adj(gear, 0.8), { x: 0.1, y: 0.265, vary: 0.06 }));
      // 3 mag pouches with flaps
      for (let i = -1; i <= 1; i++) {
        geos.push(G.cbox(0.062, 0.095, 0.04, 0.008, adj(gear, 1.12), { x: i * 0.075, y: -0.01, z: 0.155, vary: 0.09 }));
        geos.push(G.box(0.058, 0.02, 0.048, adj(gear, 0.75), { x: i * 0.075, y: 0.045, z: 0.155 }));
      }
      // admin pouch + radio on chest strap
      geos.push(G.cbox(0.09, 0.06, 0.035, 0.008, adj(gear, 0.9), { x: -0.02, y: 0.17, z: 0.15, vary: 0.06 }));
      geos.push(G.cbox(0.035, 0.085, 0.035, 0.006, 0x2c2e2a, { x: 0.115, y: 0.19, z: 0.135 }));
      geos.push(G.cyl(0.005, 0.005, 0.1, 5, 0x1e201c, { x: 0.13, y: 0.27, z: 0.13 }));         // antenna
      addM(chest, geos);
    }
    /* head + headgear */
    {
      const geos = buildHead(skin, { beard: faction === 'ally' && rnd.chance(0.25) });
      geos.push(...buildHeadgear(headgear, pal.helmet, rnd));
      addM(head, geos, RT.MAT.skin);
    }
    /* arms: upper (sleeve), forearm w/ rolled cuff + hand */
    for (const side of [-1, 1]) {
      const sh = side < 0 ? shL : shR, wp = side < 0 ? elL : elR;
      const upGeos = [camo(G.cyl(0.058, 0.05, 0.3, 12, pal.jk[0], { y: -0.145 }), pal.jk)];
      upGeos.push(G.box(0.075, 0.075, 0.02, adj(gear, 1.05), { x: side * 0.01, y: -0.1, z: side * 0.045, ry: side * 1.2, vary: 0.1 })); // patch/pouch
      addM(sh, upGeos);
      const foGeos = [];
      foGeos.push(camo(G.cyl(0.052, 0.055, 0.06, 10, pal.jk[0], { y: -0.03 }), pal.jk));       // rolled cuff
      foGeos.push(G.cyl(0.045, 0.035, 0.2, 12, skin, { y: -0.16 }));                            // bare forearm
      foGeos.push(G.box(0.055, 0.025, 0.06, 0x2a2c28, { y: -0.245, z: 0.01 }));                 // watch/wrist wrap
      const hand = buildHand(skin, opts.grip != null ? opts.grip : 0.55, side);
      for (const h of hand) xformLocal(h, { y: -0.27 });
      foGeos.push(...hand);
      addM(wp, foGeos, RT.MAT.skin);
    }
    /* legs: thigh, knee pad, calf, boot */
    for (const side of [-1, 1]) {
      const hp = side < 0 ? hipL : hipR, kp = side < 0 ? kneeL : kneeR;
      const thGeos = [camo(G.cyl(0.082, 0.068, 0.44, 12, pal.pt[0], { y: -0.215 }), pal.pt)];
      thGeos.push(camo(G.cbox(0.1, 0.14, 0.045, 0.012, pal.pt[0], { x: side * 0.045, y: -0.26, z: 0.055, vary: 0.12 }), pal.pt)); // cargo pocket
      addM(hp, thGeos);
      const caGeos = [];
      caGeos.push(G.cbox(0.075, 0.1, 0.05, 0.018, adj(gear, 0.8), { y: -0.045, z: 0.055, vary: 0.06 })); // knee pad
      caGeos.push(camo(G.cyl(0.062, 0.05, 0.34, 12, pal.pt[0], { y: -0.2 }), pal.pt));
      caGeos.push(...buildBoot(0x3a332a).map(g => xformLocal(g, { y: -0.31 })));
      addM(kp, caGeos);
    }

    let rifle = null;
    if (opts.rifle !== false) {
      rifle = buildNPCRifle();
      rifle.position.set(0.06, 0.02, 0.28);
      chest.add(rifle);
      meshes.push(rifle);
    }

    const rig = {
      group, j, meshes, rifle, faction,
      cfg: { pal, skin, headgear, seed: opts.seed },
      anim: { mode: 'idle', phase: rnd() * 10, speed: 0, aimPitch: 0, lean: 0,
              flinch: 0, deathT: -1, deathDir: 1, deathSpin: rnd.spread(0.5), crouch: 0, blend: 8 },
    };
    C.pose(rig, 0.016); // settle initial pose
    return rig;
  };

  /* ============================================================
   * Pose engine — writes joint rotations each frame from anim state.
   * ============================================================ */
  const dampR = (o, x, y, z, k, dt) => {
    o.rotation.x = damp(o.rotation.x, x, k, dt);
    o.rotation.y = damp(o.rotation.y, y, k, dt);
    o.rotation.z = damp(o.rotation.z, z, k, dt);
  };

  C.pose = function (rig, dt) {
    const a = rig.anim, j = rig.j;
    const k = a.blend;
    if (a.mode === 'dead' || a.deathT >= 0) return poseDeath(rig, dt);

    a.flinch = Math.max(0, a.flinch - dt * 4);
    const fl = a.flinch;
    const t = RT.engine.time + a.phase * 7;
    const crouch = a.crouch;
    const hipDrop = crouch * 0.34;

    if (a.mode === 'idle' || a.mode === 'guard') {
      const br = Math.sin(t * 1.4) * 0.02; // breathing
      j.hips.position.y = 0.94 - hipDrop;
      dampR(j.hips, 0, 0, 0, k, dt);
      dampR(j.spine, 0.02 + crouch * 0.3, 0, 0, k, dt);
      dampR(j.chest, br + fl * 0.5 + crouch * 0.25, a.lean * 0.3, 0, k, dt);
      dampR(j.neck, -br * 0.5 + a.aimPitch * 0.3, 0, 0, k, dt);
      dampR(j.head, a.aimPitch * 0.3, a.lookYaw || 0, 0, k, dt);
      // rifle held low-ready across chest
      dampR(j.shL, -0.85, 0.35, 0.42, k, dt);
      dampR(j.elL, -1.0, 0.5, 0, k, dt);
      dampR(j.shR, -0.68, -0.15, -0.22, k, dt);
      dampR(j.elR, -0.72, -0.35, 0, k, dt);
      dampR(j.hipL, -0.05 + crouch * -0.9, 0, 0.03, k, dt);
      dampR(j.kneeL, 0.08 + crouch * 1.5, 0, 0, k, dt);
      dampR(j.ankL, -0.03 - crouch * 0.55, 0, 0, k, dt);
      dampR(j.hipR, 0.02 - crouch * 1.15, 0, -0.03, k, dt);
      dampR(j.kneeR, 0.05 + crouch * 1.7, 0, 0, k, dt);
      dampR(j.ankR, -0.02 - crouch * 0.5, 0, 0, k, dt);
      if (rig.rifle) { rig.rifle.position.set(0.09, 0.02, 0.2); rig.rifle.rotation.set(0.7 + fl, -0.35, 0.1); }
    } else if (a.mode === 'brace') {
      /* standing in the aircraft, one hand up gripping the overhead static line, subtle sway */
      const sway = Math.sin(t * 0.8 + a.phase * 3) * 0.05;
      const br = Math.sin(t * 1.5 + a.phase) * 0.02;
      j.hips.position.y = 0.94;
      dampR(j.hips, 0.02, sway * 0.4, sway, k, dt);
      dampR(j.spine, 0.05, 0, -sway * 0.6, k, dt);
      dampR(j.chest, 0.05 + br, sway * 0.3, 0, k, dt);
      dampR(j.neck, 0.04, sway, 0, k, dt);
      dampR(j.head, 0.03 + a.aimPitch * 0.2, (a.lookYaw || 0) + sway * 1.4, 0, k, dt);
      dampR(j.shR, -2.75, -0.15, 0.15, k, dt);    // right arm reaches up to the line
      dampR(j.elR, -0.4, 0.1, 0, k, dt);
      dampR(j.shL, -0.55, 0.25, 0.32, k, dt);     // left hand on the rifle
      dampR(j.elL, -1.05, 0.45, 0, k, dt);
      dampR(j.hipL, -0.06, 0, 0.06, k, dt);
      dampR(j.kneeL, 0.12, 0, 0, k, dt);
      dampR(j.ankL, -0.05, 0, 0, k, dt);
      dampR(j.hipR, 0.05, 0, -0.06, k, dt);
      dampR(j.kneeR, 0.09, 0, 0, k, dt);
      dampR(j.ankR, -0.03, 0, 0, k, dt);
      if (rig.rifle) { rig.rifle.position.set(0.08, -0.05, 0.16); rig.rifle.rotation.set(0.9, -0.4, 0.15); }
    } else if (a.mode === 'skydive') {
      /* freefall arch — belly-down (group tilted by controller), limbs spread star */
      const fl2 = Math.sin(t * 7 + a.phase * 4) * 0.05;
      j.hips.position.y = 0.94;
      dampR(j.hips, 0, 0, 0, k, dt);
      dampR(j.spine, -0.28, 0, 0, k, dt);
      dampR(j.chest, -0.22, 0, 0, k, dt);
      dampR(j.neck, -0.42, 0, 0, k, dt);
      dampR(j.head, -0.32, 0, 0, k, dt);
      dampR(j.shL, -1.95, 1.2, 0.62 + fl2, k, dt);
      dampR(j.elL, -0.55, 0.35, 0, k, dt);
      dampR(j.shR, -1.95, -1.2, -0.62 - fl2, k, dt);
      dampR(j.elR, -0.55, -0.35, 0, k, dt);
      dampR(j.hipL, -0.5, 0.42, 0.22, k, dt);
      dampR(j.kneeL, 0.72 + fl2, 0, 0, k, dt);
      dampR(j.ankL, 0, 0, 0, k, dt);
      dampR(j.hipR, -0.5, -0.42, -0.22, k, dt);
      dampR(j.kneeR, 0.72 - fl2, 0, 0, k, dt);
      dampR(j.ankR, 0, 0, 0, k, dt);
    } else if (a.mode === 'chute') {
      /* hanging under canopy, both hands up on the risers, legs dangling */
      const sway = Math.sin(t * 0.9 + a.phase) * 0.06;
      j.hips.position.y = 0.94;
      dampR(j.hips, 0.05, sway * 0.5, sway, k, dt);
      dampR(j.spine, 0.02, 0, -sway * 0.5, k, dt);
      dampR(j.chest, 0.02, 0, 0, k, dt);
      dampR(j.neck, -0.08, 0, 0, k, dt);
      dampR(j.head, -0.04, sway, 0, k, dt);
      dampR(j.shL, -2.85, 0.35, 0.22, k, dt);
      dampR(j.elL, -0.6, 0.25, 0, k, dt);
      dampR(j.shR, -2.85, -0.35, -0.22, k, dt);
      dampR(j.elR, -0.6, -0.25, 0, k, dt);
      dampR(j.hipL, -0.12, 0.1, 0.05, k, dt);
      dampR(j.kneeL, 0.28 + sway, 0, 0, k, dt);
      dampR(j.hipR, -0.08, -0.1, -0.05, k, dt);
      dampR(j.kneeR, 0.22 - sway, 0, 0, k, dt);
    } else if (a.mode === 'reload') {
      /* shouldered, support hand cycles down to the mag well and back (reads in 3rd person) */
      a.phase += dt * 3.2;
      const rp = Math.sin(a.phase) * 0.5 + 0.5;
      j.hips.position.y = 0.94 - hipDrop;
      dampR(j.spine, 0.04 + crouch * 0.3, 0, 0, k, dt);
      dampR(j.chest, 0.06 + fl * 0.5 - 0.12, -0.3, 0, k, dt);
      dampR(j.neck, 0.14, 0.12, 0, k, dt);
      dampR(j.head, 0.26, 0.1, 0, k, dt);
      dampR(j.shR, -1.0, -0.25, -0.12, k, dt);
      dampR(j.elR, -0.82, -0.4, 0, k, dt);
      dampR(j.shL, -0.7 - rp * 0.55, 0.5, 0.3, k, dt);
      dampR(j.elL, -1.3 - rp * 0.6, 0.6, 0, k, dt);
      dampR(j.hipL, -0.05 - crouch * 0.9, 0, 0.03, k, dt);
      dampR(j.kneeL, 0.1 + crouch * 1.5, 0, 0, k, dt);
      dampR(j.ankL, -0.03, 0, 0, k, dt);
      dampR(j.hipR, 0.02 - crouch * 1.15, 0, -0.03, k, dt);
      dampR(j.kneeR, 0.08 + crouch * 1.7, 0, 0, k, dt);
      dampR(j.ankR, -0.02, 0, 0, k, dt);
      if (rig.rifle) { rig.rifle.position.set(0.1, 0.03, 0.2); rig.rifle.rotation.set(0.2, -0.2, 0.15); }
    } else if (a.mode === 'slide') {
      /* low crouched slide, lead leg forward, trailing leg tucked */
      j.hips.position.y = 0.55;
      dampR(j.hips, -0.5, 0, 0, k, dt);
      dampR(j.spine, 0.22, 0, 0, k, dt);
      dampR(j.chest, 0.16, -0.2, 0, k, dt);
      dampR(j.neck, 0.1, 0, 0, k, dt);
      dampR(j.head, 0.05, 0, 0, k, dt);
      dampR(j.shL, -0.9, 0.4, 0.42, k, dt);
      dampR(j.elL, -1.2, 0.5, 0, k, dt);
      dampR(j.shR, -0.7, -0.2, -0.22, k, dt);
      dampR(j.elR, -1.0, -0.3, 0, k, dt);
      dampR(j.hipL, -1.4, 0.1, 0.1, k, dt);
      dampR(j.kneeL, 0.32, 0, 0, k, dt);
      dampR(j.ankL, -0.1, 0, 0, k, dt);
      dampR(j.hipR, -0.3, -0.1, -0.1, k, dt);
      dampR(j.kneeR, 1.7, 0, 0, k, dt);
      dampR(j.ankR, -0.2, 0, 0, k, dt);
      if (rig.rifle) { rig.rifle.position.set(0.09, 0.02, 0.2); rig.rifle.rotation.set(0.6, -0.3, 0.1); }
    } else if (a.mode === 'walk' || a.mode === 'run') {
      const run = a.mode === 'run';
      const sp = run ? 1 : 0.62;
      a.phase += dt * (run ? 9.5 : 6.4);
      const p = a.phase;
      const swing = run ? 0.78 : 0.5;
      j.hips.position.y = 0.94 - hipDrop - Math.abs(Math.sin(p)) * (run ? 0.05 : 0.028);
      dampR(j.hips, run ? 0.12 : 0.04, 0, Math.sin(p) * 0.05, k, dt);
      dampR(j.spine, (run ? 0.22 : 0.06) + crouch * 0.3, 0, 0, k, dt);
      dampR(j.chest, fl * 0.5 + (run ? 0.1 : 0.02) + crouch * 0.2, Math.sin(p) * (run ? 0.1 : 0.07), 0, k, dt);
      dampR(j.neck, -(run ? 0.18 : 0.04), 0, 0, k, dt);
      dampR(j.head, a.aimPitch * 0.2, a.lookYaw || 0, 0, k, dt);
      const legL = -Math.sin(p) * swing - crouch * 0.5, legR = Math.sin(p) * swing - crouch * 0.5;
      dampR(j.hipL, legL, 0, 0.02, 14, dt);
      dampR(j.hipR, legR, 0, -0.02, 14, dt);
      const kneeLv = Math.max(0.08, Math.sin(p - 0.9) * (run ? 1.25 : 0.75)) + crouch * 0.9;
      const kneeRv = Math.max(0.08, Math.sin(p + Math.PI - 0.9) * (run ? 1.25 : 0.75)) + crouch * 0.9;
      dampR(j.kneeL, kneeLv, 0, 0, 14, dt);
      dampR(j.kneeR, kneeRv, 0, 0, 14, dt);
      dampR(j.ankL, -Math.sin(p) * 0.3 - 0.1, 0, 0, 14, dt);
      dampR(j.ankR, Math.sin(p) * 0.3 - 0.1, 0, 0, 14, dt);
      if (run) { // rifle in both hands pumping slightly
        dampR(j.shL, -0.85 + Math.sin(p) * 0.06, 0.3, 0.4, k, dt);
        dampR(j.elL, -1.2, 0.45, 0, k, dt);
        dampR(j.shR, -0.5 - Math.sin(p) * 0.06, -0.1, -0.25, k, dt);
        dampR(j.elR, -1.1, -0.3, 0, k, dt);
        if (rig.rifle) { rig.rifle.position.set(0.06, -0.02, 0.26); rig.rifle.rotation.set(0.35, -0.2, 0); }
      } else { // patrol carry, arms counter-swing a bit
        dampR(j.shL, -0.8 + Math.sin(p) * 0.12 * sp, 0.3, 0.4, k, dt);
        dampR(j.elL, -1.15, 0.45, 0, k, dt);
        dampR(j.shR, -0.5 - Math.sin(p) * 0.12 * sp, -0.1, -0.25, k, dt);
        dampR(j.elR, -1.0, -0.3, 0, k, dt);
        if (rig.rifle) { rig.rifle.position.set(0.06, 0.0, 0.24); rig.rifle.rotation.set(0.5, -0.25, 0); }
      }
    } else if (a.mode === 'aim') {
      // shouldered rifle pointed forward, pitch follows aimPitch
      const pitch = a.aimPitch;
      j.hips.position.y = 0.94 - hipDrop;
      dampR(j.hips, 0, 0, 0, k, dt);
      dampR(j.spine, 0.04 + crouch * 0.3, 0, 0, k, dt);
      dampR(j.chest, 0.06 + pitch * 0.55 + fl * 0.6, -0.32, 0, k, dt);
      dampR(j.neck, pitch * 0.25, 0.18, 0, k, dt);
      dampR(j.head, pitch * 0.2, 0.14, 0, k, dt);
      dampR(j.shL, -1.28 + pitch * 0.2, 0.55, 0.35, k, dt);
      dampR(j.elL, -0.85, 0.75, 0, k, dt);
      dampR(j.shR, -1.12 + pitch * 0.25, -0.28, -0.12, k, dt);
      dampR(j.elR, -0.7, -0.5, 0, k, dt);
      dampR(j.hipL, -0.12 - crouch * 0.9, 0.12, 0.03, k, dt);
      dampR(j.kneeL, 0.15 + crouch * 1.5, 0, 0, k, dt);
      dampR(j.ankL, -0.06 - crouch * 0.5, 0, 0, k, dt);
      dampR(j.hipR, 0.1 - crouch * 1.15, -0.1, -0.03, k, dt);
      dampR(j.kneeR, 0.1 + crouch * 1.7, 0, 0, k, dt);
      dampR(j.ankR, -0.04 - crouch * 0.5, 0, 0, k, dt);
      if (rig.rifle) {
        rig.rifle.position.set(0.115, 0.115, 0.2);
        rig.rifle.rotation.set(-pitch * 0.92, -0.06, 0);
      }
    }
  };

  /* multi-stage death: stagger → buckle → collapse → settle */
  function poseDeath(rig, dt) {
    const a = rig.anim, j = rig.j;
    if (a.deathT < 0) a.deathT = 0;
    a.deathT += dt;
    const T = a.deathT, dir = a.deathDir; // 1 = backward, -1 = forward
    const s1 = smoothstep(0, 0.22, T);          // stagger hit
    const s2 = smoothstep(0.18, 0.62, T);       // knees buckle
    const s3 = smoothstep(0.5, 1.15, T);        // collapse to ground
    const k = 16;
    j.hips.position.y = 0.94 - s2 * 0.42 - s3 * (dir > 0 ? 0.36 : 0.3);
    const bodyRx = dir > 0 ? -(s1 * 0.25 + s3 * 1.28) : (s1 * 0.2 + s3 * 1.42);
    dampR(j.hips, bodyRx, a.deathSpin * s3, a.deathSpin * 0.4 * s3, k, dt);
    dampR(j.spine, dir > 0 ? -0.15 * s1 : 0.3 * s2, 0, 0, k, dt);
    dampR(j.chest, (dir > 0 ? -0.2 : 0.45) * s2, a.deathSpin * 0.6 * s2, 0, k, dt);
    dampR(j.neck, (dir > 0 ? -0.4 : 0.5) * s3, 0, 0.2 * s3, k, dt);
    dampR(j.head, (dir > 0 ? -0.3 : 0.4) * s3, 0.2 * s3, 0.15 * s3, k, dt);
    dampR(j.shL, -0.9 * s1 - 0.4 * s3, 0.3, 0.5 + 0.8 * s3, k, dt);
    dampR(j.elL, -0.6 - 0.3 * s2 + 0.5 * s3, 0.3, 0, k, dt);
    dampR(j.shR, -1.1 * s1 + 0.2 * s3, -0.2, -0.4 - 0.9 * s3, k, dt);
    dampR(j.elR, -0.8 + 0.5 * s3, -0.3, 0, k, dt);
    dampR(j.hipL, (-0.3 - 0.5 * Math.abs(a.deathSpin)) * s2 + (dir > 0 ? 0.35 : -0.5) * s3, 0.1 * s3, 0.1, k, dt);
    dampR(j.kneeL, 1.3 * s2 - (dir > 0 ? 0.9 : 0.1) * s3, 0, 0, k, dt);
    dampR(j.hipR, (-0.2 - 0.3 * Math.abs(a.deathSpin)) * s2 + (dir > 0 ? 0.3 : -0.4) * s3, -0.12 * s3, -0.1, k, dt);
    dampR(j.kneeR, 1.5 * s2 - (dir > 0 ? 1.1 : 0.2) * s3, 0, 0, k, dt);
    if (rig.rifle && !rig.rifleDropped && T > 0.15) {
      // drop the rifle: detach into world with simple toss
      rig.rifleDropped = true;
      const wp = new THREE.Vector3(); rig.rifle.getWorldPosition(wp);
      const wq = new THREE.Quaternion(); rig.rifle.getWorldQuaternion(wq);
      rig.rifle.parent.remove(rig.rifle);
      rig.rifle.position.copy(wp); rig.rifle.quaternion.copy(wq);
      RT.engine.world.add(rig.rifle);
      const groundY = RT.map && RT.map.heightAt ? RT.map.heightAt(wp.x, wp.z) : 0;
      const drop = { t: 0, vy: 0.5, spin: (Math.random() - 0.5) * 6 };
      const fn = (dt2) => {
        drop.t += dt2; drop.vy -= 9.8 * dt2;
        rig.rifle.position.y += drop.vy * dt2;
        rig.rifle.rotation.z += drop.spin * dt2;
        if (rig.rifle.position.y <= groundY + 0.05) {
          rig.rifle.position.y = groundY + 0.05;
          rig.rifle.rotation.set(Math.PI / 2 * 0.94, rig.rifle.rotation.y, rig.rifle.rotation.z);
          const idx = RT.engine._upd ? 0 : 0; void idx;
          drop.done = true;
        }
        return !drop.done;
      };
      (RT.transients = RT.transients || []).push(fn);
    }
    if (T > 1.6) a.mode = 'dead';
  }

  return C;
})();

      gripL: { pos: [-0.068, -0.052, -0.26], fdir: [0.75, 0.42, -0.12], pdir: [-0.42, 0.86, 0.1], pose: 'support' } };
  }

  /* ---------- sidearm pistol ---------- */
  function buildPistol() {
    const st = [];
    st.push(G.cbox(0.03, 0.045, 0.15, 0.006, GM, { y: -0.012, z: -0.01 }));                    // frame
    st.push(G.cbox(0.03, 0.085, 0.05, 0.007, GM2, { y: -0.068, z: 0.045, rx: -0.28, vary: 0.05 })); // grip
    st.push(G.box(0.033, 0.03, 0.02, adjc(GM2, 1.2), { y: -0.05, z: 0.048, rx: -0.28 }));      // grip panel band
    st.push(G.box(0.008, 0.02, 0.036, GM2, { y: -0.045, z: -0.006 }));                         // trigger guard bottom
    st.push(G.box(0.008, 0.022, 0.006, GM2, { y: -0.036, z: -0.028 }));                        // guard front
    st.push(G.box(0.005, 0.018, 0.007, GM3, { y: -0.032, z: 0.0, rx: 0.15 }));                 // trigger
    st.push(G.box(0.018, 0.012, 0.014, GM2, { y: 0.012, z: 0.075, rx: 0.5 }));                 // hammer
    st.push(G.cyl(0.007, 0.007, 0.02, 8, GM3, { y: -0.005, z: -0.09, rx: Math.PI / 2 }));      // guide rod
    const staticMesh = RT.meshOf(st, RT.MAT.gun);
    // slide (reciprocates)
    const sl = [];
    sl.push(G.cbox(0.032, 0.032, 0.17, 0.006, adjc(GM, 1.12), { y: 0.022, z: -0.015 }));
    for (let i = 0; i < 6; i++) sl.push(G.box(0.034, 0.02, 0.004, GM2, { y: 0.022, z: 0.05 + i * 0.008 })); // serrations
    sl.push(G.box(0.006, 0.012, 0.008, GM2, { y: 0.044, z: 0.068 }));                          // rear sight
    sl.push(G.box(0.004, 0.01, 0.006, GM2, { y: 0.043, z: -0.09 }));                           // front sight
    sl.push(G.cyl(0.009, 0.009, 0.03, 8, GM3, { y: 0.018, z: -0.095, rx: Math.PI / 2 }));      // muzzle/barrel tip
    const action = RT.meshOf(sl, RT.MAT.gun);
    const mg = [G.cbox(0.024, 0.02, 0.04, 0.004, GM2, { y: -0.115, z: 0.052, rx: -0.28 })];    // visible baseplate
    const mag = RT.meshOf(mg, RT.MAT.gun);
    return { staticMesh, mag, action, magHome: mag.position.clone(), slide: true,
      muzzleZ: -0.11, sight: new THREE.Vector3(0, 0.044, 0), ejectPos: new THREE.Vector3(0.02, 0.03, 0.02),
      gripR: { pos: [0.024, -0.075, 0.058], fdir: [-0.9, 0.05, -0.34], pdir: [-1, 0, 0.24], pose: 'trigger' },
      gripL: { pos: [-0.036, -0.088, 0.05], fdir: [0.86, 0.3, -0.2], pdir: [0.55, 0.75, 0.15], pose: 'cup' } };
  }

  /* ============================================================
   * Anatomical first-person arm: gloved hand with staggered
   * knuckles, splayed tapered fingers with rounded tips, opposed
   * thumb, tendon ridges, knuckle pad; lofted tapering forearm
   * with articulated wrist skin; rolled sleeve.
   * Hand local space: wrist at origin, palm faces -z, fingers -y,
   * thumb on side*+x. Curl = rotation about +x (toward palm).
   * ============================================================ */
  const GLOVE = 0x63594a, GLOVE_D = 0x3a352c, GLOVE_PAD = 0x2b2925;

  /* finger data (right hand; x mirrored by side). splay > 0 pushes +x */
  const FDATA = [
    { name: 'index',  p: [0.0295, -0.080, -0.0025], len: 0.074, r: 0.0086, splay: 0.10 },
    { name: 'middle', p: [0.0100, -0.088, -0.0035], len: 0.082, r: 0.0090, splay: 0.02 },
    { name: 'ring',   p: [-0.0095, -0.084, -0.0030], len: 0.076, r: 0.0084, splay: -0.06 },
    { name: 'pinky',  p: [-0.0280, -0.074, -0.0020], len: 0.058, r: 0.0070, splay: -0.15 },
  ];
  /* per-pose curl angles [proximal, middle, distal] per finger + thumb */
  const POSES = {
    trigger: { index: [0.5, 0.4, 0.25], middle: [1.2, 1.25, 0.95], ring: [1.28, 1.28, 0.95], pinky: [1.32, 1.25, 0.9], thumb: [0.55, 0.7], thumbMode: 'wrap' },
    grip:    { index: [1.15, 1.2, 0.9], middle: [1.22, 1.25, 0.95], ring: [1.28, 1.28, 0.95], pinky: [1.32, 1.25, 0.9], thumb: [0.6, 0.75], thumbMode: 'wrap' },
    support: { index: [1.08, 1.15, 0.85], middle: [1.15, 1.22, 0.9], ring: [1.2, 1.22, 0.9], pinky: [1.25, 1.18, 0.85], thumb: [0.1, 0.12], thumbMode: 'rail' },
    open:    { index: [0.22, 0.18, 0.12], middle: [0.25, 0.2, 0.14], ring: [0.28, 0.2, 0.14], pinky: [0.3, 0.22, 0.15], thumb: [0.18, 0.15], thumbMode: 'wrap' },
    cup:     { index: [0.72, 0.85, 0.6], middle: [0.8, 0.9, 0.65], ring: [0.85, 0.9, 0.65], pinky: [0.9, 0.85, 0.6], thumb: [0.3, 0.4], thumbMode: 'rail' },
  };

  const _fq = new THREE.Quaternion(), _fm = new THREE.Matrix4(), _fv = new THREE.Vector3(), _fs = new THREE.Vector3(1, 1, 1);
  const _Y_NEG = new THREE.Vector3(0, -1, 0);
  /* place a -y-built geometry at `from` aiming along `dir` */
  function aimGeo(geo, from, dir) {
    _fq.setFromUnitVectors(_Y_NEG, _fv.copy(dir).normalize());
    _fm.compose(new THREE.Vector3(from.x, from.y, from.z), _fq, _fs);
    geo.applyMatrix4(_fm);
    return geo;
  }
  const rotX = (v, a) => { const y = v.y, z = v.z; v.y = y * Math.cos(a) - z * Math.sin(a); v.z = y * Math.sin(a) + z * Math.cos(a); return v; };
  const rotZ = (v, a) => { const x = v.x, y = v.y; v.x = x * Math.cos(a) - y * Math.sin(a); v.y = x * Math.sin(a) + y * Math.cos(a); return v; };

  function buildGloveHand(side, poseName) {
    const pose = POSES[poseName] || POSES.grip;
    const geos = [];
    const S = (x) => side * x;
    /* --- palm: lofted wedge, wider at knuckles, flattened --- */
    geos.push(G.loft([
      { y: 0.005, rx: 0.030, rz: 0.019 },                       // wrist
      { y: -0.022, rx: 0.0355, rz: 0.0205 },
      { y: -0.050, rx: 0.0425, rz: 0.0215, z: -0.0015 },
      { y: -0.072, rx: 0.0465, rz: 0.0205, z: -0.002 },
      { y: -0.086, rx: 0.0455, rz: 0.018, z: -0.002 },          // knuckle row
    ], 12, GLOVE, { vary: 0.05 }));
    /* thenar (thumb-side) + hypothenar (pinky-side) pads on the palm side */
    geos.push(G.sph(0.0175, 10, 8, adjc(GLOVE, 0.9), { x: S(0.026), y: -0.042, z: -0.0135, sy: 1.5, sz: 0.75 }));
    geos.push(G.sph(0.0145, 10, 8, adjc(GLOVE, 0.88), { x: S(-0.029), y: -0.055, z: -0.011, sy: 1.7, sz: 0.7 }));
    /* back-of-hand tendon ridges to each knuckle */
    for (const f of FDATA) {
      const kx = S(f.p[0]);
      const ang = Math.atan2(kx - S(0.004), 0.07);
      geos.push(G.box(0.0042, 0.062, 0.0035, adjc(GLOVE, 1.12), { x: (kx + S(0.004)) / 2, y: -0.048, z: 0.0175, rz: ang }));
    }
    /* knuckle bumps + knuckle pad plate */
    for (const f of FDATA) geos.push(G.sph(0.0068, 8, 6, GLOVE_PAD, { x: S(f.p[0]), y: f.p[1] + 0.006, z: 0.012, sz: 0.8 }));
    geos.push(G.cbox(0.058, 0.014, 0.012, 0.004, GLOVE_PAD, { x: S(0.002), y: -0.077, z: 0.017, rz: S(-0.12) }));
    /* wrist strap + buckle (no ball joint — strap hides the hand/forearm blend) */
    geos.push(G.torus(0.0315, 0.006, 6, 14, GLOVE_D, { y: 0.012, rx: Math.PI / 2, sz: 0.68 }));
    geos.push(G.box(0.012, 0.008, 0.005, 0x8a8578, { x: S(0.02), y: 0.012, z: -0.021 }));
    /* --- fingers: staggered bases, splay, per-pose curl, rounded tips --- */
    for (const f of FDATA) {
      const curls = pose[f.name];
      const splayEff = f.splay * (1 - curls[0] * 0.55);
      const base = { x: S(f.p[0]), y: f.p[1], z: f.p[2] };
      const segLens = [f.len * 0.42, f.len * 0.32, f.len * 0.26];
      let dir = new THREE.Vector3(0, -1, 0);
      rotZ(dir, S(splayEff));
      let angle = 0;
      let r = f.r;
      let cur = { ...base };
      for (let si = 0; si < 3; si++) {
        angle = curls[si];
        // recompute direction: base splay then accumulated curl about x
        dir.set(0, -1, 0); rotZ(dir, S(splayEff * (1 - si * 0.4)));
        const total = curls.slice(0, si + 1).reduce((a2, b) => a2 + b, 0) * 0.78;
        rotX(dir, -total);
        const L = segLens[si], rTip = r * 0.86;
        const segGeo = G.cyl(rTip, r, L, 8, si === 0 ? GLOVE : adjc(GLOVE, 1 - si * 0.05), { y: -L / 2 });
        geos.push(aimGeo(segGeo, cur, dir));
        // joint blend sphere
        geos.push(G.sph(r * 0.98, 8, 6, adjc(GLOVE, 0.96), { x: cur.x, y: cur.y, z: cur.z }));
        cur = { x: cur.x + dir.x * L, y: cur.y + dir.y * L, z: cur.z + dir.z * L };
        r = rTip;
      }
      geos.push(G.sph(r * 1.02, 8, 6, adjc(GLOVE, 0.92), { x: cur.x, y: cur.y, z: cur.z })); // rounded tip
    }
    /* --- thumb: low on the side, ~45° across, 2 segments --- */
    {
      const tb = { x: S(0.034), y: -0.026, z: -0.006 };
      const tc = pose.thumb;
      const lens = [0.040, 0.034];
      let r = 0.0105;
      let cur = { ...tb };
      for (let si = 0; si < 2; si++) {
        const dir = new THREE.Vector3(0, -1, 0);
        if (pose.thumbMode === 'rail') {
          // thumb lies along the weapon's long axis (local ≈ -x for this basis)
          dir.set(S(0.92), -0.3, -0.28).normalize();
          rotX(dir, -tc[si] * 0.5);
        } else {
          // wrap: across the palm toward -z, opposing the fingers
          rotZ(dir, S(0.95 - si * 0.25));
          rotX(dir, -(0.45 + tc.slice(0, si + 1).reduce((a2, b) => a2 + b, 0)));
        }
        const L = lens[si], rTip = r * 0.84;
        geos.push(aimGeo(G.cyl(rTip, r, L, 8, GLOVE, { y: -L / 2 }), cur, dir));
        geos.push(G.sph(r * 0.98, 8, 6, adjc(GLOVE, 0.95), { x: cur.x, y: cur.y, z: cur.z }));
        cur = { x: cur.x + dir.x * L, y: cur.y + dir.y * L, z: cur.z + dir.z * L };
        r = rTip;
      }
      geos.push(G.sph(r * 1.02, 8, 6, adjc(GLOVE, 0.9), { x: cur.x, y: cur.y, z: cur.z }));
    }
    return geos;
  }

  /* forearm: lofted taper (widest below elbow → flattened-oval wrist),
   * slight bow, skin → rolled cuff → looser sleeve with bunching */
  function buildForearm(side, skin, sleeve) {
    const geos = [];
    geos.push(G.loft([
      { y: 0.005, rx: 0.0305, rz: 0.0195 },                       // wrist (flows from hand)
      { y: 0.045, rx: 0.035, rz: 0.024, z: 0.0015 },
      { y: 0.095, rx: 0.0405, rz: 0.0295, z: 0.003 },
      { y: 0.145, rx: 0.0445, rz: 0.034, z: 0.0035 },
    ], 14, skin, {}));
    /* rolled cuff ring */
    geos.push(G.torus(0.0448, 0.009, 8, 16, adjc(sleeve, 0.92), { y: 0.158, rx: Math.PI / 2, sz: 0.85, vary: 0.08 }));
    /* sleeve: slightly looser than the arm, subtle bunching */
    geos.push(G.loft([
      { y: 0.158, rx: 0.0468, rz: 0.038 },
      { y: 0.215, rx: 0.0495, rz: 0.0415, z: 0.003 },
      { y: 0.275, rx: 0.052, rz: 0.0445, z: 0.005 },
      { y: 0.34, rx: 0.054, rz: 0.047, z: 0.006 },
    ], 14, sleeve, { vary: 0.06 }));
    geos.push(G.torus(0.0505, 0.0025, 5, 14, adjc(sleeve, 0.9), { y: 0.235, rx: Math.PI / 2, sz: 0.88 }));
    geos.push(G.torus(0.0525, 0.0025, 5, 14, adjc(sleeve, 0.87), { y: 0.3, rx: Math.PI / 2, sz: 0.88 }));
    return geos;
  }

  /* orient a hand by explicit basis: fingers point along fdir, palm faces pdir */
  const _bm = new THREE.Matrix4();
  function gripQuat(fdir, pdir) {
    const y = new THREE.Vector3().fromArray(fdir).normalize().negate(); // local -y = fingers
    const z = new THREE.Vector3().fromArray(pdir).normalize().negate(); // local -z = palm
    const x = new THREE.Vector3().crossVectors(y, z).normalize();
    z.crossVectors(x, y).normalize();
    _bm.makeBasis(x, y, z);
    return new THREE.Quaternion().setFromRotationMatrix(_bm);
  }

  function buildArm(side, skin, sleeve, grip, poseName) {
    const grp = new THREE.Group();
    const mk = (pn) => {
      const geos = buildGloveHand(side, pn);
      geos.push(...buildForearm(side, skin, sleeve));
      const m = RT.meshOf(geos, RT.MAT.skin, false);
      if (grip.fdir) m.quaternion.copy(gripQuat(grip.fdir, grip.pdir));
      else m.rotation.fromArray(grip.rot);
      return m;
    };
    const closed = mk(poseName);
    const open = mk('open');
    open.visible = false;
    grp.add(closed); grp.add(open);
    grp.userData.setOpen = v => { closed.visible = !v; open.visible = !!v; };
    return grp;
  }

  /* ---------- weapon configs ---------- */
  const CFG = {
    m4: {
      name: 'M4A3 CARBINE', build: buildM4, auto: true, rpm: 720, dmg: 30, headMul: 2.2,
      mag: 30, reserve: 150, reloadT: 2.3, adsFov: 58, adsZ: -0.23,
      spreadHip: 0.03, spreadAds: 0.004, kick: 0.014, kickYaw: 0.005, vmKick: 0.03,
      hip: [0.16, -0.15, -0.35], sound: 'rifle', tracer: 3,
    },
    dmr: {
      name: 'MK14 DMR', build: buildDMR, auto: false, rpm: 220, dmg: 82, headMul: 3,
      mag: 10, reserve: 50, reloadT: 2.7, adsFov: 26, adsZ: -0.16, scope: true, bolt: true, boltT: 0.75,
      spreadHip: 0.05, spreadAds: 0.0012, kick: 0.045, kickYaw: 0.012, vmKick: 0.07,
      hip: [0.17, -0.16, -0.4], sound: 'dmr', tracer: 1,
    },
    shotgun: {
      name: 'M590 SHOTGUN', build: buildShotgun, auto: false, rpm: 70, dmg: 14, pellets: 8, headMul: 1.5,
      mag: 6, reserve: 42, reloadShell: 0.62, adsFov: 62, adsZ: -0.24, pump: true, pumpT: 0.62,
      spreadHip: 0.055, spreadAds: 0.04, kick: 0.05, kickYaw: 0.012, vmKick: 0.09,
      hip: [0.16, -0.15, -0.36], sound: 'shotgun', tracer: 0, range: 30,
    },
    pistol: {
      name: 'P9 SIDEARM', build: buildPistol, auto: false, rpm: 420, dmg: 34, headMul: 2.4,
      mag: 15, reserve: 90, reloadT: 1.8, adsFov: 66, adsZ: -0.28, slide: true,
      spreadHip: 0.025, spreadAds: 0.006, kick: 0.02, kickYaw: 0.007, vmKick: 0.045,
      hip: [0.15, -0.14, -0.3], sound: 'pistol', tracer: 0,
    },
  };
  W.CFG = CFG;

  /* ---------- state ---------- */
  const built = {};      // id -> assembly
  let vmRoot = null, cur = null, curId = null;
  let loadout = [];      // array of ids
  const ammo = {};       // id -> {mag, res}
  let adsK = 0, adsT = 0, fovPunch = 0, raiseK = 0, switchTo = null;
  let inspectK = 0, inspectT = 0;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  let reloadT = -1, reloadStage = 0, shellsToLoad = 0;
  let cooldown = 0, pumpT = -1, boltT = -1, flashT = 0, slideBack = 0;
  let recP = 0, recY = 0, vmZ = 0, bobT = 0;
  const SKIN_FP = 0xb98e6d, SLEEVE_FP = 0x585c3c;
  W.state = () => ({ curId, adsK, ammo: ammo[curId], reloading: reloadT >= 0, raiseK, inspectK });

  function assemble(id) {
    if (built[id]) return built[id];
    const cfg = CFG[id];
    const parts = cfg.build();
    const root = new THREE.Group();
    root.add(parts.staticMesh);
    if (parts.mag) root.add(parts.mag);
    if (parts.action) root.add(parts.action);
    if (parts.extra) parts.extra.forEach(e => root.add(e));
    parts.staticMesh.castShadow = false; parts.staticMesh.receiveShadow = false;
    // muzzle flash: 3 crossed additive planes + glow
    const fg = new THREE.Group();
    const fmat = new THREE.MeshBasicMaterial({ color: 0xffca66, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    for (let i = 0; i < 3; i++) {
      const p = new THREE.Mesh(starPlane(), fmat);
      p.rotation.z = i * Math.PI / 3;
      fg.add(p);
    }
    const sideP = new THREE.Mesh(starPlane(), fmat);
    sideP.rotation.y = Math.PI / 2; sideP.scale.setScalar(0.6);
    fg.add(sideP);
    fg.position.set(0, cfg.sight ? parts.sight.y - 0.06 : 0.02, parts.muzzleZ - 0.03);
    fg.position.y = id === 'pistol' ? 0.02 : 0.02;
    fg.visible = false;
    root.add(fg);
    // arms
    const armR = buildArm(1, SKIN_FP, SLEEVE_FP, parts.gripR, parts.gripR.pose || 'trigger');
    armR.position.fromArray(parts.gripR.pos);
    const armL = buildArm(-1, SKIN_FP, SLEEVE_FP, parts.gripL, parts.gripL.pose || 'support');
    armL.position.fromArray(parts.gripL.pos);
    root.add(armR); root.add(armL);
    root.traverse(o => { o.castShadow = false; o.receiveShadow = false; if (o.frustumCulled !== undefined) o.frustumCulled = false; });
    const asm = { root, cfg, parts, armR, armL, flash: fg,
      armLHome: armL.position.clone(), armRHome: armR.position.clone() };
    built[id] = asm;
    return asm;
  }
  function starPlane() {
    // 4-point star silhouette plane
    const sh = new THREE.Shape();
    const R = 0.09, r = 0.02;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU, rad = i % 2 === 0 ? R : r;
      const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
      if (i === 0) sh.moveTo(x, y); else sh.lineTo(x, y);
    }
    sh.closePath();
    return new THREE.ShapeGeometry(sh);
  }

  W.init = function () {
    vmRoot = new THREE.Group();
    RT.engine.camera.add(vmRoot);
  };
  W.setVisible = function (v) { if (vmRoot) vmRoot.visible = v; };

  W.setLoadout = function (ids, ammoOverride) {
    loadout = ids.slice();
    for (const id of ids) {
      if (!ammo[id] || ammoOverride) ammo[id] = { mag: CFG[id].mag, res: CFG[id].reserve };
    }
    if (!loadout.includes(curId)) equip(loadout[0], true);
  };
  W.giveAmmo = function (mult) {
    for (const id of loadout) { ammo[id].res = Math.min(CFG[id].reserve, ammo[id].res + Math.ceil(CFG[id].reserve * (mult || 0.5))); }
  };
  /* BR: pick up / upgrade a weapon with rarity mods {dmg,kick,mag} */
  W.mods = {};
  W.modFor = id => W.mods[id] || { dmg: 1, kick: 1, mag: 1 };
  W.addWeapon = function (id, mods, ammoBonus) {
    W.mods[id] = mods || { dmg: 1, kick: 1, mag: 1 };
    if (!loadout.includes(id)) {
      loadout.push(id);
      ammo[id] = { mag: Math.round(CFG[id].mag * W.modFor(id).mag), res: Math.ceil(CFG[id].reserve * 0.5) };
    } else {
      ammo[id].res = Math.min(CFG[id].reserve * 2, ammo[id].res + (ammoBonus || Math.ceil(CFG[id].reserve * 0.4)));
    }
    equip(id);
    if (RT.hud) RT.hud.refreshAmmo();
  };
  W.giveAmmoFor = function (id, n) { if (ammo[id]) ammo[id].res = Math.min(CFG[id].reserve * 2, ammo[id].res + n); };
  W.ammoOf = id => ammo[id];
  W.loadout = () => loadout;

  function equip(id, instant) {
    if (!id || (id === curId && !instant)) return;
    if (instant) {
      if (cur) vmRoot.remove(cur.root);
      const asm = assemble(id);
      if (RT.progress) RT.progress.paintWeapon(asm.root);   // apply selected camo
      vmRoot.add(asm.root);
      cur = asm; curId = id; raiseK = 0.35; switchTo = null;   // raise animates in
      reloadT = -1; pumpT = -1; boltT = -1; cooldown = 0.2;
      if (asm.armL.userData.setOpen) asm.armL.userData.setOpen(false);
      asm._reloadPose = null;
      asm.armL.position.copy(asm.armLHome);
    } else if (curId !== id) {
      switchTo = id; reloadT = -1;
    }
  }
  W.equip = equip;

  /* recoil accessors for player camera */
  W.consumeRecoil = function () { const r = [recP, recY]; recP = 0; recY = 0; return r; };

  let semiLatch = false;
  W.update = function (dt, opts) {
    if (!cur) return;
    opts = opts || {};
    const cfg = cur.cfg;
    const I = RT.input;
    const am = ammo[curId];

    /* switching */
    for (let i = 0; i < loadout.length && i < 4; i++)
      if (I.pressed('Digit' + (i + 1)) && loadout[i] !== curId) equip(loadout[i]);
    if (I.wheel !== 0 && loadout.length > 1) {
      const d = Math.sign(I.wheel); I.wheel = 0;
      const idx = (loadout.indexOf(switchTo || curId) + d + loadout.length) % loadout.length;
      equip(loadout[idx]);
    } else I.wheel = 0;
    if (switchTo) {
      raiseK -= dt / 0.16;               // fast lower
      if (raiseK <= 0) { const t = switchTo; switchTo = null; equip(t, true); raiseK = 0; }
