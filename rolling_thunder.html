    if (minimap) minimap.style.display = 'none';
    const placement = win ? 1 : alive;
    RT.$('end-title').textContent = win ? 'THUNDER CHAMPION' : '#' + placement + ' — ELIMINATED';
    RT.$('end-title').classList.toggle('fail', !win);
    RT.$('st-l-time').textContent = 'TIME SURVIVED';
    RT.$('st-l-kills').textContent = 'ELIMINATIONS';
    RT.$('st-l-acc').textContent = 'DAMAGE DEALT';
    RT.$('st-l-heads').textContent = 'PLACEMENT';
    RT.$('st-time').textContent = RT.fmtTime(matchT);
    RT.$('st-kills').textContent = stats.kills;
    RT.$('st-acc').textContent = Math.round(stats.dmg);
    RT.$('st-heads').textContent = win ? 'CHAMPION' : '#' + placement + ' / 50';
    if (RT.progress) RT.progress.onBRResult(placement, stats.kills, win);
    RT.$('btn-next').disabled = true;
    RT.$('btn-retry').textContent = 'Drop Again';
    RT.$('btn-retry').onclick = () => RT.br.startMatch();
    RT.ui.showHUD(false);
    if (win) {
      RT.engine.timeScale = 0.35;
      setTimeout(() => { RT.engine.timeScale = 1; }, 900);
      RT.fxExplosion(new THREE.Vector3(RT.player.pos.x, RT.player.pos.y + 8, RT.player.pos.z), 4);
      if (RT.game.victoryFlair) RT.game.victoryFlair();
      RT.audio.missionCompleteStinger();
    }
    setTimeout(() => RT.ui.showScreen('end-screen'), win ? 1600 : 700);
  }

  /* fly the transport along the path; empty it of jumpers; retire it off-map */
  function updatePlane(raw) {
    if (!plane || !planeActive) return;
    planeFlightT += raw;
    const pp = planePos(planeFlightT);
    plane.position.copy(pp);
    plane.rotation.set(0, Math.atan2(planeDir.x, planeDir.z), -0.05);
    plane.updateMatrixWorld(true);                 // keep the ride-along camera in sync
    RT.aircraft.update(plane, raw, 1, planeFlightT > 1.2);
    const js = plane.userData.jumpers;
    if (js) for (const jm of js) {
      if (!jm.jumped && planeFlightT > jm.jumpAt) { jm.jumped = true; jm.rig.group.visible = false; }
    }
    RT.aircraft.poseJumpers(plane, raw);
    if (planeFlightT * 62 > 2100) { RT.engine.scene.remove(plane); planeActive = false; if (RT.audio && RT.audio.planeDrone) RT.audio.planeDrone(false); }
  }

  BR.update = function (dt, raw) {
    if (!BR.active && phase !== 'end') return;
    if (planeActive) updatePlane(raw);
    matchT += dt;
    /* time-of-day progression: golden hour → dusk over ~9 minutes */
    BR.duskK = clamp(matchT / 540, 0, 1);
    atmoT -= raw;
    if (atmoT <= 0) {
      atmoT = 3;
      RT.engine.setAtmosphere(goldenAtmo(BR.duskK));
      if (RT.map._bulbOn === undefined && BR.duskK > 0.55) RT.map._bulbOn = true;
    }
    circleUpdate(dt);
    if (phase !== 'fly' && phase !== 'spectate') botsUpdate(dt);
    vehicleUpdate(dt);
    uiT -= raw;
    if (uiT <= 0) {
      uiT = 0.25;
      const total = alive;
      if (leftEl) leftEl.textContent = total + ' ALIVE' + (stats.kills ? ' · ' + stats.kills + ' KILLS' : '');
      drawMinimap();
    }
    /* loot beam shimmer */
    for (const it of lootItems) if (!it.taken) it.grp.rotation.y += dt * 0.8;

    if (phase === 'fly') {
      planeT += dt;
      const cam = RT.engine.camera;
      if (plane && planeActive) {
        /* ride inside the hold, looking aft down the fuselage toward the open ramp */
        const cp = plane.localToWorld(PLANE_CAM.clone());
        const lp = plane.localToWorld(PLANE_LOOK.clone());
        cam.position.copy(cp);
        cam.lookAt(lp);
        RT.player.pos.copy(cp);
      } else {
        const pp = planePos(planeFlightT);
        cam.position.copy(pp); cam.rotation.set(-0.5, Math.atan2(-planeDir.x, -planeDir.z), 0);
        RT.player.pos.copy(pp);
      }
      RT.engine.updateSun(cam.position);
      if (planeT > 2 && (RT.input.pressed('Space') || RT.input.pressed('Mouse0'))) { phase = 'drop'; fallV = 4; deployed = false; RT.weapons.setVisible(false); }
      if (planeFlightT * 62 > 1560) { phase = 'drop'; fallV = 4; deployed = false; }
      /* bots drop along the path */
      for (const b of bots) {
        if (!b.dropped && Math.random() < dt * 0.7 && planeFlightT > 1.5) b.dropped = true;
      }
      return;
    }
    if (phase === 'drop' || phase === 'chute') {
      const p = RT.player.pos;
      fallV = Math.min(fallV + (phase === 'drop' ? 34 : 6) * dt, phase === 'drop' ? 52 : 8.5);
      p.y -= fallV * dt;
      /* steering */
      const I = RT.input;
      const sp = phase === 'drop' ? 13 : 10;
      const yawC = RT.player.yaw;
      const mx = ((I.keys.KeyD ? 1 : 0) - (I.keys.KeyA ? 1 : 0));
      const mz = ((I.keys.KeyS ? 1 : 0) - (I.keys.KeyW ? 1 : 0));
      p.x += (Math.cos(yawC) * mx - Math.sin(yawC) * mz) * sp * dt;
      p.z += (-Math.sin(yawC) * mx - Math.cos(yawC) * mz) * sp * dt;
      /* look control (reuse player look via update? keep simple: arrows/mouse via player.update disabled — manual) */
      let [mdx, mdy] = I.consumeMouse();
      if (I.keyboardMode() || I.fallback) {
        const ls = 1.9 * dt;
        if (I.keys.ArrowLeft) RT.player.yaw += ls; if (I.keys.ArrowRight) RT.player.yaw -= ls;
        if (I.keys.ArrowUp) RT.player.pitch += ls * 0.7; if (I.keys.ArrowDown) RT.player.pitch -= ls * 0.7;
      }
      RT.player.yaw -= mdx * 0.002; RT.player.pitch = clamp(RT.player.pitch - mdy * 0.002, -1.4, phase === 'chute' ? 1.35 : 0.5);
      const cam = RT.engine.camera;
      /* freefall pitch-forward; under canopy the camera settles level */
      const dropTilt = phase === 'drop' ? -0.35 : 0;
      cam.position.set(p.x, p.y, p.z);
      cam.rotation.set(RT.player.pitch + dropTilt, RT.player.yaw, 0);
      RT.engine.updateSun(cam.position);
      const ground = RT.map.groundAt(p.x, p.z, p.y);
      if (phase === 'drop' && (p.y - ground < 80 || (I.pressed('Space') && p.y - ground < 200))) {
        phase = 'chute';
        RT.ui.toastMsg('CHUTE DEPLOYED');
        fallV = Math.min(fallV, 14);
        if (RT.aircraft && !playerChute) { playerChute = RT.aircraft.buildChute(0x3a5740); RT.engine.scene.add(playerChute); chuteDeployT = 0; }
        RT.engine.shake(0.75);          // opening shock
        if (RT.audio && RT.audio.chuteDeploy) RT.audio.chuteDeploy();
      }
      /* canopy above the player: unfurl over ~0.6s, then hang + sway */
      if (playerChute) {
        chuteDeployT += dt;
        const dk = Math.min(1, chuteDeployT / 0.6), es = dk * dk * (3 - 2 * dk);
        playerChute.position.set(p.x, p.y + 1.2, p.z);
        playerChute.rotation.set(0.04 * Math.sin(RT.engine.time * 0.9), RT.player.yaw, 0.05 * Math.sin(RT.engine.time * 0.7));
        playerChute.scale.set(0.2 + 0.8 * es, 0.12 + 0.88 * es, 0.2 + 0.8 * es);
      }
      if (p.y - ground <= 1) {
        p.y = ground;
        phase = 'play';
        RT.game.state = 'play';
        RT.weapons.setVisible(true);
        RT.player.pitch = 0;
        if (playerChute) { RT.engine.scene.remove(playerChute); playerChute = null; }
        RT.ui.toast('FIND WEAPONS', 'LOOT THE BUILDINGS');
        /* bots land */
        for (const b of bots) { b.y = RT.map.groundAt(b.x, b.z, 999); }
      }
      return;
    }
    if (phase === 'spectate') {
      specT -= raw;
      const cam = RT.engine.camera;
      if (killer && !killer.dead) {
        const a = matchT * 0.5;
        cam.position.set(killer.x + Math.cos(a) * 7, killer.y + 3.4, killer.z + Math.sin(a) * 7);
        cam.lookAt(killer.x, killer.y + 1.4, killer.z);
      }
      if (specT <= 0 || RT.input.pressed('Space') || RT.input.pressed('Enter') || RT.input.pressed('Mouse0')) endMatch(false);
      return;
    }
    if (phase === 'play') {
      /* medkit use */
      if (RT.input.pressed('KeyH') && inv.medkits > 0 && medCast < 0 && RT.player.health < 99) {
        medCast = 2.2;
        RT.ui.toastMsg('USING MEDKIT…');
      }
      if (medCast >= 0) {
        medCast -= dt;
        if (medCast < 0) {
          inv.medkits--;
          RT.player.heal ? RT.player.heal(60) : null;
          RT.ui.toastMsg('MEDKIT USED (+60)');
          if (RT.audio) RT.audio.magIn();
        }
      }
      /* victory check */
      if (alive <= 1 && !RT.player.dead) endMatch(true);
    }
  };

  BR.reset = function () {
    /* cleanup on quit to menu */
    BR.active = false;
    phase = 'idle';
    if (storm) { RT.engine.scene.remove(storm); storm = null; }
    if (nextRing) { RT.engine.scene.remove(nextRing); nextRing = null; }
    if (plane) { RT.engine.scene.remove(plane); plane = null; }
    if (playerChute) { RT.engine.scene.remove(playerChute); playerChute = null; }
    planeActive = false;
    if (minimap) minimap.style.display = 'none';
    if (RT.audio) { RT.audio.engineStop(); if (RT.audio.planeDrone) RT.audio.planeDrone(false); }
    RT.engine.setWeather(null);   // clear fog/rain so it doesn't bleed into the campaign
    bots = []; lootItems = []; vehicles = []; curVehicle = null;
    rigPool.length = 0;
  };
  Object.defineProperty(BR, 'phase', { get: () => phase, set: v => { phase = v; } });
  BR.debug = { get bots() { return bots; }, get circle() { return circle; }, spawnLoot, get alive() { return alive; }, set alive(v) { alive = v; }, killBot, endMatch };
  return BR;
})();


/* ==================== 12_progress.js ==================== */
/* ============================================================
 * Tier 2 — progression: XP, ranks, unlockable weapon camos,
 * challenges. Persists inside RT.ui.progress (localStorage).
 * ============================================================ */
RT.progress = (() => {
  const P = {};
  const U = RT.ui;

  /* weapon camos — tint multiplies the gun-body vertex colours */
  const CAMOS = [
    { id: 'default', name: 'Standard', tint: 0xffffff, unlock: { level: 1 } },
    { id: 'woodland', name: 'Woodland', tint: 0x6f7548, unlock: { level: 2 } },
    { id: 'urban', name: 'Urban Fleck', tint: 0x9298a0, unlock: { chal: 'marksman' } },
    { id: 'desert', name: 'Desert', tint: 0xbda06f, unlock: { level: 5 } },
    { id: 'crimson', name: 'Crimson', tint: 0xa23b34, unlock: { chal: 'pyro' } },
    { id: 'midnight', name: 'Midnight', tint: 0x455170, unlock: { level: 9 } },
    { id: 'ember', name: 'Ember', tint: 0xd06a2a, unlock: { level: 13 } },
    { id: 'gold', name: 'Gold Tiger', tint: 0xcaa028, unlock: { chal: 'champion' } },
  ];
  const CAMO_BY = {}; for (const c of CAMOS) CAMO_BY[c.id] = c;

  /* challenges — checked against the running tally */
  const CHALLENGES = [
    { id: 'marksman', name: 'Marksman', desc: 'Land 25 headshots', stat: 'heads', goal: 25, reward: 'Urban Fleck camo', xp: 400 },
    { id: 'pyro', name: 'Pyrotechnic', desc: 'Destroy 15 explosive barrels', stat: 'barrels', goal: 15, reward: 'Crimson camo', xp: 400 },
    { id: 'glazier', name: 'Glazier', desc: 'Shatter 40 windows', stat: 'windows', goal: 40, reward: '600 XP', xp: 600 },
    { id: 'champion', name: 'Thunder Champion', desc: 'Win a THUNDERDROP match', stat: 'brWins', goal: 1, reward: 'Gold Tiger camo', xp: 1500 },
    { id: 'operator', name: 'Seasoned Operator', desc: 'Reach Rank 8', stat: 'level', goal: 8, reward: '800 XP', xp: 800 },
  ];

  const RANKS = ['Recruit', 'Private', 'Corporal', 'Sergeant', 'Staff Sgt.', 'Gunnery Sgt.', 'Lieutenant', 'Captain', 'Major', 'Colonel', 'Commander', 'Vanguard'];
  const xpForRank = lvl => Math.round(600 * lvl * Math.pow(1.18, lvl - 1));   // XP to go from lvl→lvl+1
  function levelFromXP(xp) {
    let lvl = 1, acc = 0;
    while (lvl < 60) { const need = xpForRank(lvl); if (xp < acc + need) break; acc += need; lvl++; }
    return { level: lvl, into: xp - acc, need: xpForRank(lvl) };
  }
  P.rankName = lvl => RANKS[Math.min(lvl, RANKS.length) - 1] + (lvl > RANKS.length ? ' ' + (lvl - RANKS.length + 1) : '');
  P.levelFor = xp => levelFromXP(xp || 0).level;

  function data() {
    const pr = U.progress;
    if (!pr.xp) pr.xp = 0;
    if (!pr.camo) pr.camo = 'default';
    if (!pr.camos) pr.camos = ['default'];
    if (!pr.tally) pr.tally = { heads: 0, barrels: 0, windows: 0, brWins: 0 };
    if (!pr.chalDone) pr.chalDone = {};
    return pr;
  }
  P.currentCamo = () => CAMO_BY[data().camo] || CAMO_BY.default;

  /* ---------- weapon camo painting ---------- */
  const gunCache = {};
  function tintedGun(camo) {
    if (camo.id === 'default') return RT.MAT.gun;
    if (!gunCache[camo.id]) {
      const m = RT.MAT.gun.clone();
      const col = RT.lin ? RT.lin(camo.tint) : new THREE.Color(camo.tint);
      m.color = col.clone().multiplyScalar(1.5);              // lift the multiply off the dark gunmetal base
      m.emissive = col.clone();
      m.emissiveIntensity = 0.16;                             // faint anodized sheen so the finish reads
      m.userData = { isCamo: true };
      gunCache[camo.id] = m;
    }
    return gunCache[camo.id];
  }
  P.paintWeapon = function (root) {
    if (!root) return;
    const gm = tintedGun(P.currentCamo());
    root.traverse(o => {
      if (o.isMesh && (o.material === RT.MAT.gun || (o.material && o.material.userData && o.material.userData.isCamo))) o.material = gm;
    });
  };

  /* ---------- XP + unlock engine ---------- */
  function unlockCamosForLevel(lvl, out) {
    const pr = data();
    for (const c of CAMOS) if (c.unlock.level && c.unlock.level <= lvl && !pr.camos.includes(c.id)) { pr.camos.push(c.id); out.push(c.name + ' camo'); }
  }
  P.addXP = function (amount, label) {
    const pr = data();
    const before = levelFromXP(pr.xp).level;
    pr.xp += amount;
    const after = levelFromXP(pr.xp).level;
    const unlocked = [];
    if (after > before) {
      unlockCamosForLevel(after, unlocked);
      checkChallenges(unlocked);   // level-based challenges
      if (RT.audio && RT.audio.objectiveStinger) RT.audio.objectiveStinger();
      RT.ui.toast('RANK UP', 'Rank ' + after + ' · ' + P.rankName(after));
    }
    for (const u of unlocked) RT.ui.toastMsg && RT.ui.toastMsg('UNLOCKED: ' + u);
    U.saveProgress();
    refreshArmory();
    return { xp: amount, label };
  };
  function checkChallenges(out) {
    const pr = data();
    const lvl = levelFromXP(pr.xp).level;
    for (const ch of CHALLENGES) {
      if (pr.chalDone[ch.id]) continue;
      const val = ch.stat === 'level' ? lvl : (pr.tally[ch.stat] || 0);
      if (val >= ch.goal) {
        pr.chalDone[ch.id] = true;
        if (ch.reward.indexOf('camo') >= 0) {
          const camo = CAMOS.find(c => c.unlock.chal === ch.id);
          if (camo && !pr.camos.includes(camo.id)) { pr.camos.push(camo.id); out.push(camo.name + ' camo'); }
        }
        RT.ui.toast('CHALLENGE COMPLETE', ch.name + ' · +' + ch.xp + ' XP');
        pr.xp += ch.xp;              // direct (avoid re-entrant addXP)
        const nl = levelFromXP(pr.xp).level;
        unlockCamosForLevel(nl, out);
      }
    }
  }
  P.tally = function (stat, n) {
    const pr = data();
    pr.tally[stat] = (pr.tally[stat] || 0) + (n || 1);
    const out = [];
    checkChallenges(out);
    for (const u of out) RT.ui.toastMsg && RT.ui.toastMsg('UNLOCKED: ' + u);
    U.saveProgress(); refreshArmory();
  };

  /* ---------- event hooks ---------- */
  P.onKill = function (headshot, isBR) {
    if (headshot) P.tally('heads', 1);
    P.addXP((isBR ? 40 : 25) + (headshot ? 15 : 0), 'Kill');
  };
  P.onMissionComplete = function (id, time, acc) {
    P.addXP(500 + Math.round(acc * 3), 'Mission ' + id);
  };
  P.onBRResult = function (placement, kills, win) {
    if (win) P.tally('brWins', 1);
    const place = Math.max(1, placement);
    P.addXP((win ? 1000 : Math.round((50 - place) * 12)) + kills * 40, 'THUNDERDROP #' + place);
  };

  /* ---------- armory UI ---------- */
  let built = false;
  function buildArmory() {
    if (built) return; built = true;
    const s = RT.el('div', 'screen fading', document.body);
    s.id = 'armory-screen'; s.classList.add('hidden');
    s.innerHTML = '<div class="scrim"></div><div class="inner">' +
      '<div class="panel-title"><small>Career</small>Armory</div>' +
      '<div class="panel" style="max-width:660px">' +
      '<div id="ar-rank" style="display:flex;align-items:center;gap:16px;margin-bottom:6px"></div>' +
      '<div style="height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin:4px 0 4px">' +
      '<div id="ar-xpbar" style="height:100%;width:0;background:linear-gradient(90deg,#e8a33d,#ffd27a);transition:width .5s"></div></div>' +
      '<div id="ar-xptext" style="font-size:11px;letter-spacing:.14em;color:var(--ink-dim);text-align:right;margin-bottom:16px"></div>' +
      '<div class="menu-foot">Weapon Camo</div>' +
      '<div id="ar-camos" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px"></div>' +
      '<div class="menu-foot">Challenges</div>' +
      '<div id="ar-chal" style="margin:10px 0 6px"></div>' +
      '<div class="back-row"><button class="menu-btn" id="btn-ar-back">Back</button></div></div></div>';
    RT.$('btn-ar-back').onclick = () => U.showMenu();
  }
  function refreshArmory() {
    if (!built || !RT.$('ar-rank')) return;
    const pr = data();
    const li = levelFromXP(pr.xp);
    RT.$('ar-rank').innerHTML =
      '<div style="width:52px;height:52px;border:2px solid var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;' +
      'font-size:22px;font-weight:800;color:var(--amber)">' + li.level + '</div>' +
      '<div><div style="font-size:19px;font-weight:700;letter-spacing:.06em">' + P.rankName(li.level) + '</div>' +
      '<div style="font-size:11px;letter-spacing:.2em;color:var(--ink-dim)">RANK ' + li.level + ' · ' + pr.xp + ' XP TOTAL</div></div>';
    RT.$('ar-xpbar').style.width = Math.round(100 * li.into / li.need) + '%';
    RT.$('ar-xptext').textContent = li.into + ' / ' + li.need + ' XP TO RANK ' + (li.level + 1);
    /* camos */
    const cg = RT.$('ar-camos'); cg.innerHTML = '';
    for (const c of CAMOS) {
      const owned = pr.camos.includes(c.id), sel = pr.camo === c.id;
      const cell = RT.el('div', '', cg);
      const hex = '#' + c.tint.toString(16).padStart(6, '0');
      cell.style.cssText = 'cursor:' + (owned ? 'pointer' : 'default') + ';border:2px solid ' + (sel ? 'var(--amber)' : 'rgba(255,255,255,.14)') +
        ';border-radius:6px;padding:7px;text-align:center;opacity:' + (owned ? '1' : '0.45') + ';transition:border-color .15s';
      cell.innerHTML = '<div style="height:34px;border-radius:4px;background:' + hex + ';box-shadow:inset 0 0 12px rgba(0,0,0,.5)"></div>' +
        '<div style="font-size:10px;letter-spacing:.08em;margin-top:6px;color:' + (owned ? '#fff' : 'var(--ink-dim)') + '">' + (owned ? c.name : '🔒 ' + unlockHint(c)) + '</div>';
      if (owned) cell.onclick = () => { pr.camo = c.id; U.saveProgress(); refreshArmory(); if (RT.audio) RT.audio.uiTick && RT.audio.uiTick(); };
    }
    /* challenges */
    const chEl = RT.$('ar-chal'); chEl.innerHTML = '';
    for (const ch of CHALLENGES) {
      const val = ch.stat === 'level' ? li.level : (pr.tally[ch.stat] || 0);
      const done = pr.chalDone[ch.id], pct = Math.min(100, Math.round(100 * val / ch.goal));
      const row = RT.el('div', '', chEl);
      row.style.cssText = 'margin-bottom:11px';
      row.innerHTML = '<div style="display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em">' +
        '<span style="color:' + (done ? 'var(--amber)' : '#fff') + '">' + (done ? '✓ ' : '') + ch.name + ' — <span style="color:var(--ink-dim)">' + ch.desc + '</span></span>' +
        '<span style="color:var(--ink-dim)">' + Math.min(val, ch.goal) + '/' + ch.goal + '</span></div>' +
        '<div style="height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:4px;overflow:hidden">' +
        '<div style="height:100%;width:' + pct + '%;background:' + (done ? 'var(--amber)' : '#7f9fd8') + '"></div></div>';
    }
  }
  function unlockHint(c) {
    if (c.unlock.level) return 'Rank ' + c.unlock.level;
    const ch = CHALLENGES.find(x => x.id === c.unlock.chal);
    return ch ? ch.name : 'Locked';
  }
  P.refreshArmory = refreshArmory;
  P.openArmory = function () { buildArmory(); refreshArmory(); U.showScreen('armory-screen'); };

  /* easter egg: the Konami code unlocks every weapon camo */
  const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
  let kseq = [];
  function konamiWatch() {
    document.addEventListener('keydown', (e) => {
      kseq.push(e.code); if (kseq.length > KONAMI.length) kseq.shift();
      if (kseq.join() === KONAMI.join()) {
        kseq = [];
        const pr = data();
        let n = 0;
        for (const c of CAMOS) if (!pr.camos.includes(c.id)) { pr.camos.push(c.id); n++; }
        U.saveProgress(); refreshArmory();
        RT.ui.toast('⚡ OVERDRIVE ⚡', n ? 'All weapon camos unlocked' : 'You already have everything, Sergeant');
        if (RT.audio && RT.audio.missionCompleteStinger) RT.audio.missionCompleteStinger();
        if (RT.game && RT.game.victoryFlair && RT.game.state === 'play') RT.game.victoryFlair();
      }
    });
  }

  P.init = function () {
    data();
    buildArmory();
    if (RT.$('btn-armory')) RT.$('btn-armory').onclick = () => P.openArmory();
    refreshArmory();
    konamiWatch();
  };
  return P;
})();

/* ============================================================
 * Tier 5 — Firing Range: a safe practice map with pop-up steel
 * targets, every weapon, and a live hit counter.
 * ============================================================ */
RT.range = (() => {
  const R = {};
  let score = 0, best = 0, hudEl = null, targets = [];

  function buildRange() {
    RT.engine.clearWorld();
    RT.ai.reset();
    const def = {
      atmosphere: RT.missions[0].atmosphere,
      terrain: {
        size: 300, segs: 96, seed: 7, amp: 2.2, rim: 8,
        palette: { lush: 0x5d6b38, lush2: 0x71793f, dirt: 0x77664a, rock: 0x74705f, road: 0x6d6354 },
        flats: [{ x: 0, z: -55, r: 150 }], roads: [], craters: [],
      },
    };
    RT.engine.setAtmosphere(def.atmosphere);
    const terrain = new RT.Terrain(def.terrain);
    const B = new RT.MapBuilder(terrain, 7);
    RT.map = B; RT.map.def = def;
    const P = RT.props;
    /* firing line */
    P.sandbags(B, -5, 6, 0, 6, {});
    P.sandbags(B, 6, 6, 0, 5, {});
    P.crate(B, -10, 7.5, { stack: true });
    P.crate(B, 11, 7.5, {});
    P.explosiveBarrel(B, 16, 8, {});
    P.window(B, -16, B.h(-16, 7) + 1.4, 7, 0, 1.6, 1.3, {});   // a pane to plink
    /* target rows downrange (negative z), bigger the farther out */
    targets = [];
    const rows = [[-12, 3, 1.0], [-28, 4, 1.05], [-55, 4, 1.25], [-100, 3, 1.7]];
    for (const [dz, n, s] of rows) {
      for (let i = 0; i < n; i++) targets.push(P.steelTarget(B, (i - (n - 1) / 2) * 6, dz, { s }));
      P.sign(B, (n / 2) * 6 + 6, dz, 0.2);
    }
    /* backstop berm */
    for (let x = -60; x <= 60; x += 12) P.sandbags(B, x, -120, 0, 13, {});
    P.scatterGrass(B, 2600, 150, 0x5f6c39);
    P.scatterRocks(B, 40, 150);
    RT.engine.world.add(B.finalize());
    RT.engine.setWeather(null);
  }

  function buildHud() {
    if (!hudEl) {
      hudEl = RT.el('div', '', RT.$('hud'));
      hudEl.style.cssText = 'position:absolute;top:78px;left:50%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 1px 5px #000';
    }
    hudEl.style.display = 'block';
    updateHud();
  }
  function updateHud() {
    if (hudEl) hudEl.innerHTML = '<div style="font-size:13px;letter-spacing:.34em;color:var(--amber)">FIRING RANGE</div>' +
      '<div style="font-size:26px;font-weight:800;letter-spacing:.05em">HITS ' + score + (best ? ' <span style="font-size:13px;color:var(--ink-dim)">BEST ' + best + '</span>' : '') + '</div>' +
      '<div style="font-size:11px;color:var(--ink-dim);letter-spacing:.1em">[T] reset · [1–4] weapons · [B] smoke · ESC pause</div>';
  }
  R.onHit = function () { score++; if (score > best) best = score; updateHud(); };
  R.update = function () {
    if (RT.input.pressed('KeyT')) {
      score = 0; updateHud();
      for (const t of targets) { t.hits = 0; if (t.pivot) t.pivot.rotation.x = 0; }
      if (RT.audio) RT.audio.objectiveStinger && RT.audio.objectiveStinger();
    }
  };
  R.exit = function () { if (hudEl) { hudEl.style.display = 'none'; hudEl.innerHTML = ''; } score = 0; };

  R.startRange = function () {
    RT.audio.ensure();
    RT.audio.menuMusic(false);
    RT.ui.hideScreens();
    RT.ui.fade(true);
    RT.ui.showLoading('Firing range — sight in your weapons and warm up.');
    setTimeout(() => {
      buildRange();
      RT.player.init({ x: 0, z: 9, ry: 0 });          // face downrange (−z)
      RT.weapons.setLoadout(['m4', 'dmr', 'shotgun', 'pistol'], true);
      for (const id of ['m4', 'dmr', 'shotgun', 'pistol']) RT.weapons.giveAmmoFor(id, 9999);
      RT.player.grenades = 4;
      RT.game.state = 'play';
      RT.game.missionIdx = -1;
      RT.game._range = true;
      score = 0;
      buildHud();
      RT.ui.showHUD(true);
      RT.ui.hideLoading();
      RT.ui.fade(false, true);
      RT.ui.toast('FIRING RANGE', 'Ring the steel · [T] to reset');
      RT.audio.setAmbient('birds');
      RT.weapons.setVisible(true);
    }, 700);
  };
  return R;
})();


/* ==================== 14_aircraft.js ==================== */
/* ============================================================
 * Section 1 — Drop transport aircraft. Fully modeled: lofted
 * fuselage, high wings with 4 turboprops (spinning props +
 * blur discs), tail, open rear cargo ramp, ribbed interior with
 * jump seats + static line, retracted gear. Plane-local space:
 * +Z = nose forward, +Y = up, origin at the wing box.
 * ============================================================ */
RT.aircraft = (() => {
  const A = {};
  const G = RT.G;

  /* stitch elliptical rings along +Z. rings: [{z, ry, rx, cy}] nose→tail order-agnostic */
  function loftZ(rings, seg, c, o) {
    const pos = [], idx = [];
    for (const s of rings) for (let i = 0; i < seg; i++) {
      const a = (i / seg) * TAU;
      pos.push(Math.cos(a) * s.rx, (s.cy || 0) + Math.sin(a) * s.ry, s.z);
    }
    for (let r = 0; r < rings.length - 1; r++) for (let i = 0; i < seg; i++) {
      const a = r * seg + i, b = r * seg + (i + 1) % seg, c2 = (r + 1) * seg + i, d = (r + 1) * seg + (i + 1) % seg;
      idx.push(a, c2, b, b, c2, d);
    }
    const nose = pos.length / 3; pos.push(0, rings[0].cy || 0, rings[0].z);
    const tail = pos.length / 3; pos.push(0, rings[rings.length - 1].cy || 0, rings[rings.length - 1].z);
    for (let i = 0; i < seg; i++) {
      idx.push(nose, (i + 1) % seg, i);
      idx.push(tail, (rings.length - 1) * seg + i, (rings.length - 1) * seg + (i + 1) % seg);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setIndex(idx); g.computeVertexNormals();
    return RT.paintGeo(g, c, o && o.vary);
  }

  /* NACA-ish airfoil shape in XY: chord along x (0..c), thickness in y */
  function airfoil(chord, thick, camber) {
    const sh = new THREE.Shape();
    const N = 12;
    const pts = [];
    for (let i = 0; i <= N; i++) {                    // upper surface
      const t = i / N, x = t * chord;
      const yt = thick * (1.4845 * Math.sqrt(t) - 0.63 * t - 1.758 * t * t + 1.42 * t * t * t - 0.5 * Math.pow(t, 4));
      pts.push([x, yt + camber * Math.sin(t * Math.PI) * chord]);
    }
    for (let i = N; i >= 0; i--) {                    // lower surface
      const t = i / N, x = t * chord;
      const yt = thick * (1.4845 * Math.sqrt(t) - 0.63 * t - 1.758 * t * t + 1.42 * t * t * t - 0.5 * Math.pow(t, 4));
      pts.push([x, -yt * 0.55 + camber * Math.sin(t * Math.PI) * chord]);
    }
    sh.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) sh.lineTo(p[0], p[1]);
    sh.closePath();
    return sh;
  }

  /* rivet / panel-line skin texture */
  let skinTex = null;
  function makeSkin() {
    if (skinTex) return skinTex;
    skinTex = RT.canvasTex(256, (ctx, s) => {
      ctx.fillStyle = '#e9e7e1'; ctx.fillRect(0, 0, s, s);
      ctx.strokeStyle = 'rgba(120,120,120,0.5)'; ctx.lineWidth = 1;
      for (let y = 0; y < s; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y); ctx.stroke(); }  // panel lines
      for (let x = 0; x < s; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, s); ctx.stroke(); }
      ctx.fillStyle = 'rgba(90,90,90,0.55)';
      for (let y = 4; y < s; y += 32) for (let x = 6; x < s; x += 10) ctx.fillRect(x, y, 1.4, 1.4);            // rivets
      for (let i = 0; i < 30; i++) {                                                                           // grime streaks below seams
        const x = Math.random() * s, y = ((Math.random() * s / 32) | 0) * 32;
        const g = ctx.createLinearGradient(0, y, 0, y + 26);
        g.addColorStop(0, 'rgba(60,58,52,0.32)'); g.addColorStop(1, 'rgba(60,58,52,0)');
        ctx.fillStyle = g; ctx.fillRect(x, y, 2 + Math.random() * 3, 26);
      }
    });
    skinTex.wrapS = skinTex.wrapT = THREE.RepeatWrapping;
    skinTex.repeat.set(4, 4);
    return skinTex;
  }

  A.build = function () {
    const group = new THREE.Group();
    const skinMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.72, metalness: 0.18, map: makeSkin() });
    const detailMat = RT.MAT.metal;
    const body = 0x5f6a52, bodyDk = 0x474f3c, grey = 0x6b6f70, dark = 0x2a2d2a, glassC = 0x10202a;

    /* ---------- fuselage ---------- */
    const rings = [
      { z: 16.2, rx: 0.22, ry: 0.24, cy: 0.28 },      // nose tip
      { z: 15.3, rx: 0.9, ry: 0.95, cy: 0.22 },
      { z: 13.6, rx: 1.65, ry: 1.75, cy: 0.1 },
      { z: 11.0, rx: 2.1, ry: 2.2, cy: 0 },
      { z: 6.0, rx: 2.25, ry: 2.35, cy: 0 },
      { z: 0.0, rx: 2.25, ry: 2.35, cy: 0 },
      { z: -6.0, rx: 2.2, ry: 2.3, cy: 0.05 },
      { z: -10.5, rx: 1.9, ry: 2.05, cy: 0.5 },        // tail begins upsweep
      { z: -14.5, rx: 1.25, ry: 1.5, cy: 1.5 },
      { z: -17.5, rx: 0.7, ry: 0.95, cy: 2.5 },
      { z: -19.5, rx: 0.28, ry: 0.4, cy: 3.1 },        // tail cone
    ];
    const fuse = RT.meshOf(loftZ(rings, 28, body), skinMat);
    group.add(fuse);
    /* belly keel + chine strips (panel relief) */
    group.add(RT.meshOf([
      G.box(0.5, 0.18, 26, bodyDk, { y: -2.3, z: -1.5 }),
      G.box(4.2, 0.12, 0.5, bodyDk, { y: -2.15, z: 8.5 }),
      G.box(4.2, 0.12, 0.5, bodyDk, { y: -2.15, z: -3 }),
    ], skinMat));
    /* cockpit windows + nose */
    group.add(RT.meshOf([
      G.box(1.5, 0.62, 0.1, glassC, { x: 0.95, y: 1.05, z: 14.4, ry: -0.35, rx: -0.15 }),
      G.box(1.5, 0.62, 0.1, glassC, { x: -0.95, y: 1.05, z: 14.4, ry: 0.35, rx: -0.15 }),
      G.box(1.0, 0.6, 0.1, glassC, { x: 0, y: 1.15, z: 15.0, rx: -0.2 }),
    ], RT.MAT.gun2));

    /* ---------- wing (single continuous high wing, full span) ---------- */
    const wing = G.extrude(airfoil(5.4, 0.9, 0.04), 22, body, {});
    wing.rotateY(Math.PI / 2);                          // span → X (±11), chord → −Z
    wing.translate(0, 2.25, 3.4);                       // sits on top of the fuselage, LE forward
    group.add(RT.meshOf([wing], skinMat));
    /* wing-root fairing so it blends into the fuselage */
    group.add(RT.meshOf([G.box(3.4, 1.3, 6.0, body, { y: 1.9, z: 0.9, vary: 0.05 })], skinMat));
    /* flap/aileron seam + wingtip lights */
    for (const sgn of [1, -1]) group.add(RT.meshOf([G.box(9, 0.08, 0.3, bodyDk, { x: sgn * 6.3, y: 2.2, z: -1.5 })], skinMat));
    const wtR = light(0x30ff40, 0.16); wtR.position.set(11, 2.3, 1.0); group.add(wtR);
    const wtL = light(0xff3030, 0.16); wtL.position.set(-11, 2.3, 1.0); group.add(wtL);

    /* ---------- 4 turboprop engines + spinning props ---------- */
    const props = [];
    const engMat = detailMat;
    for (const [sgn, ex] of [[1, 4.2], [1, 9.4], [-1, 4.2], [-1, 9.4]]) {
      const x = sgn * ex;
      const nac = RT.meshOf([
        G.cyl(0.62, 0.72, 3.4, 16, grey, { x, y: 1.55, z: 2.2, rx: Math.PI / 2 }),
        G.torus(0.63, 0.09, 8, 16, dark, { x, y: 1.55, z: 3.9, rx: 0 }),           // intake lip
        G.cyl(0.4, 0.28, 0.7, 12, dark, { x, y: 1.55, z: 0.4, rx: Math.PI / 2 }),  // exhaust
        G.cyl(0.16, 0.16, 1.0, 10, 0x30332f, { x, y: 1.15, z: 3.0, rx: 0.5 }),     // pylon to wing
      ], engMat);
      group.add(nac);
      /* propeller hub + 4 twisted blades */
      const prop = new THREE.Group();
      prop.position.set(x, 1.55, 4.15);
      const hub = RT.meshOf([G.sph(0.28, 12, 10, 0x24261f, {}), G.cyl(0.16, 0.22, 0.5, 10, dark, { z: 0.1, rx: Math.PI / 2 })], engMat);
      prop.add(hub);
      for (let b = 0; b < 4; b++) {
        const blade = RT.meshOf([bladeGeo()], engMat);
        blade.rotation.z = b * Math.PI / 2;
        prop.add(blade);
      }
      /* motion-blur disc (fades in with RPM) */
      const disc = new THREE.Mesh(new THREE.CircleGeometry(1.75, 24),
        new THREE.MeshBasicMaterial({ color: 0x20221c, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
      disc.rotation.y = 0; disc.position.z = 0.05;
      prop.add(disc);
      group.add(prop);
      props.push({ prop, disc });
    }

    /* ---------- tail surfaces ---------- */
    const finShape = new THREE.Shape();                 // trapezoid fin: x=fore-aft, y=height
    finShape.moveTo(0, 0); finShape.lineTo(4.6, 0); finShape.lineTo(3.7, 4.6); finShape.lineTo(2.0, 4.6); finShape.closePath();
    const vstab = G.extrude(finShape, 0.34, body, {});
    vstab.rotateY(-Math.PI / 2);                         // fore-aft → +Z, thickness → X
    vstab.translate(0, 2.5, -19.3);
    group.add(RT.meshOf([vstab], skinMat));
    /* rudder seam */
    group.add(RT.meshOf([G.box(0.4, 4.2, 0.12, bodyDk, { y: 4.6, z: -18.8 })], skinMat));
    /* horizontal stabilizer (T-tail, full span) */
    const hstab = G.extrude(airfoil(2.6, 0.42, 0), 8.6, body, {});
    hstab.rotateY(Math.PI / 2); hstab.translate(0, 6.9, -15.6);
    group.add(RT.meshOf([hstab], skinMat));
    /* nav lights */
    const navR = light(0x30ff40, 0.16); navR.position.set(6.7, 2.1, -0.9); group.add(navR);
    const navL = light(0xff3030, 0.16); navL.position.set(-6.7, 2.1, -0.9); group.add(navL);
    const navT = light(0xffffff, 0.14); navT.position.set(0, 5.4, -16.6); group.add(navT);

    /* ---------- rear cargo ramp (open) + interior ---------- */
    const interior = buildInterior(skinMat);
    group.add(interior.group);

    /* retracted gear doors (belly panels) */
    group.add(RT.meshOf([
      G.box(1.3, 0.08, 2.2, bodyDk, { x: 1.0, y: -2.16, z: 6.5 }),
      G.box(1.3, 0.08, 2.2, bodyDk, { x: -1.0, y: -2.16, z: 6.5 }),
      G.box(1.6, 0.08, 2.6, bodyDk, { y: -2.2, z: -1.5 }),
    ], skinMat));

    group.userData = {
      props, jumpLight: interior.jumpLight, ramp: interior.ramp,
      seatAnchors: interior.seatAnchors, rampLip: interior.rampLip,
    };
    return group;
  };

  function bladeGeo() {
    /* twisted blade: stack of chord sections from root→tip, each rotated (pitch) */
    const rings = [];
    const N = 6;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const r = 0.25 + t * 1.55;                       // radius out
      const chord = 0.42 * (1 - t * 0.55);
      const pitch = (1 - t) * 0.9;                      // twist: coarse at root
      rings.push({ r, chord, pitch, thick: 0.09 * (1 - t * 0.6) });
    }
    const pos = [], idx = [];
    const seg = 2; // leading/trailing edge -> use 4 pts per section (an airfoil-ish quad)
    function sectPts(ring) {
      const c = ring.chord, th = ring.thick, p = ring.pitch;
      const raw = [[-c * 0.35, th], [c * 0.65, 0.01], [c * 0.65, -0.01], [-c * 0.35, -th]];
      return raw.map(([x, y]) => {
        const cx = x * Math.cos(p) - y * Math.sin(p);
        const cy = x * Math.sin(p) + y * Math.cos(p);
        return [cx, ring.r, cy];   // y = radius (blade points +y)
      });
    }
    let prev = null;
    for (const ring of rings) {
      const s = sectPts(ring);
      const base = pos.length / 3;
      for (const p of s) pos.push(p[0], p[1], p[2]);
      if (prev !== null) for (let k = 0; k < 4; k++) {
        const a = prev + k, b = prev + (k + 1) % 4, c2 = base + k, d = base + (k + 1) % 4;
        idx.push(a, c2, b, b, c2, d);
      }
      prev = base;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setIndex(idx); g.computeVertexNormals();
    return RT.paintGeo(g, 0x26281f);
  }

  function buildInterior(skinMat) {
    const grp = new THREE.Group();
    const ribC = 0x555c48, netC = 0x8a2f26, floorC = 0x3a3d36, seatC = 0x3f4a33;
    const geos = [];
    /* ribbed inner wall frames every ~2m along the body (arcs) */
    for (let z = -9; z <= 12; z += 2.2) {
      geos.push(G.torus(2.0, 0.08, 4, 18, ribC, { z, rx: 0, ry: 0 }));   // ring frame (inside)
    }
    /* floor with rollers */
    geos.push(G.box(3.0, 0.12, 24, floorC, { y: -1.5, z: 1 }));
    for (let z = -8; z <= 12; z += 1.4) geos.push(G.cyl(0.09, 0.09, 2.6, 8, 0x8a8f92, { y: -1.4, z, rz: Math.PI / 2 }));
    /* overhead static-line cable + dangling hooks */
    geos.push(G.cyl(0.04, 0.04, 22, 6, 0xaab0b4, { y: 1.7, z: 1, rz: Math.PI / 2 }));
    const seatAnchors = [];
    for (let z = -8; z <= 11; z += 1.5) {
      for (const sgn of [1, -1]) {
        geos.push(G.box(0.05, 0.14, 0.05, 0x2b2b2b, { x: sgn * 0.35, y: 1.5, z }));  // hook
        /* fold-down jump seat */
        geos.push(G.box(0.5, 0.06, 0.42, seatC, { x: sgn * 1.55, y: -0.55, z, ry: sgn > 0 ? -0.15 : 0.15 }));
        geos.push(G.box(0.5, 0.5, 0.05, seatC, { x: sgn * 1.78, y: -0.3, z }));
        seatAnchors.push({ x: sgn * 1.05, y: -1.5, z, side: sgn });
      }
    }
    /* red cargo netting panels on walls */
    for (const sgn of [1, -1]) for (let z = -7; z <= 10; z += 3.4) {
      geos.push(G.box(0.04, 1.2, 2.8, netC, { x: sgn * 1.95, y: 0.2, z }));
    }
    /* strapped crates near the front */
    geos.push(G.box(1.4, 1.0, 1.6, 0x6a5a3e, { x: 0.6, y: -0.95, z: 8.5 }));
    geos.push(G.box(1.2, 0.9, 1.3, 0x5e5236, { x: -0.8, y: -1.0, z: 9.8 }));
    grp.add(RT.meshOf(geos, RT.MAT.std, false));

    /* jump light (red→green) */
    const jl = new THREE.Group();
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff2a1a }));
    bulb.position.set(1.4, 1.4, -6.5); jl.add(bulb);
    const glow = new THREE.PointLight(0xff2a1a, 0.7, 9, 2); glow.position.set(0, 0.5, -4); jl.add(glow);
    grp.add(jl);

    /* rear cargo ramp: pivots at the tail floor, drops open */
    const ramp = new THREE.Group();
    ramp.position.set(0, -1.5, -9.5);
    const rampMesh = RT.meshOf([
      G.box(3.2, 0.16, 4.5, 0x4a4e42, { z: -2.0 }),               // ramp deck
      G.box(0.2, 0.5, 4.5, 0x3a3e34, { x: 1.6, y: 0.25, z: -2 }), // side rails
      G.box(0.2, 0.5, 4.5, 0x3a3e34, { x: -1.6, y: 0.25, z: -2 }),
    ], skinMat, false);
    /* tread grating lines */
    ramp.add(rampMesh);
    ramp.rotation.x = -0.62;                                       // hanging open
    grp.add(ramp);
    /* hydraulic arms */
    grp.add(RT.meshOf([
      G.cyl(0.08, 0.08, 2.2, 8, 0x888c90, { x: 1.5, y: -0.8, z: -10.5, rx: 0.7 }),
      G.cyl(0.08, 0.08, 2.2, 8, 0x888c90, { x: -1.5, y: -0.8, z: -10.5, rx: 0.7 }),
    ], RT.MAT.metal, false));
    const rampLip = new THREE.Vector3(0, -1.55, -13.0);

    return { group: grp, jumpLight: bulb, jumpGlow: glow, ramp, seatAnchors, rampLip };
  }

  function dark(h) { return h; }
  function light(color, r) {
    return new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), new THREE.MeshBasicMaterial({ color, fog: false }));
  }

  /* thin cylinder between two points (suspension lines) */
  function lineSeg(x1, y1, z1, x2, y2, z2, r, c) {
    const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1, len = Math.hypot(dx, dy, dz);
    const g = G.cyl(r, r, len, 5, c, {});
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(dx, dy, dz).normalize());
    const m = new THREE.Matrix4().compose(new THREE.Vector3((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2), q, new THREE.Vector3(1, 1, 1));
    g.applyMatrix4(m);
    return g;
  }

  /* deployable round parachute: canopy dome + gore seams + suspension lines.
     origin at the harness (jumper's back); canopy sits ~H above. */
  A.buildChute = function (col) {
    const g = new THREE.Group();
    const H = 5.2, R = 3.5;
    col = col || 0x3a5740;
    const prof = [];
    for (let i = 0; i <= 8; i++) { const t = i / 8; prof.push([R * Math.cos(t * Math.PI * 0.5), H + Math.sin(t * Math.PI * 0.5) * 1.5]); }
    const canopy = RT.meshOf([G.lathe(prof, 20, col)], RT.MAT.cloth, false);
    canopy.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, side: THREE.DoubleSide });
    g.add(canopy);
    /* gore seam ribs + a few alternating darker panels for readability */
    const ribs = [];
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      ribs.push(lineSeg(R * 0.98 * Math.cos(a), H + 0.05, R * 0.98 * Math.sin(a), 0, H + 1.5, 0, 0.03, i % 2 ? 0x2c4331 : 0x46644b));
    }
    g.add(RT.meshOf(ribs, RT.MAT.std, false));
    /* suspension lines to the harness */
    const lines = [];
    for (let i = 0; i < 12; i++) { const a = (i / 12) * TAU; lines.push(lineSeg(Math.cos(a) * R * 0.9, H - 0.1, Math.sin(a) * R * 0.9, Math.cos(a) * 0.25, 0.5, Math.sin(a) * 0.25, 0.02, 0xd8d2bc)); }
    g.add(RT.meshOf(lines, RT.MAT.std, false));
    g.userData.canopy = canopy;
    return g;
  };

  /* populate the hold with jumpers standing in two rows, gripping the line */
  A.buildJumpers = function (group, count) {
    const jumpers = [];
    for (let i = 0; i < count; i++) {
      const side = i % 2 === 0 ? 1 : -1;
      const idx = Math.floor(i / 2);
      const z = 9.6 - idx * 1.05;
      if (z < -7.5) break;
      const rig = RT.character.build({ seed: 100 + i, faction: 'ally', paletteIdx: i % 3, headgear: i % 4 === 0 ? 'helmet' : 'helmet', mode: 'brace' });
      rig.group.position.set(side * 0.8, -1.44, z);
      rig.group.rotation.y = Math.PI;         // face the ramp (−z)
      rig.anim.mode = 'brace'; rig.anim.phase = Math.random() * 6; rig.anim.blend = 22;
      group.add(rig.group);
      jumpers.push({ rig, homeZ: z, side, jumped: false, order: i });
    }
    group.userData.jumpers = jumpers;
    return jumpers;
  };
  A.poseJumpers = function (group, dt) {
    const js = group.userData.jumpers; if (!js) return;
    for (const jm of js) if (!jm.jumped) RT.character.pose(jm.rig, dt);
  };

  /* animate props (rpm 0..1) and jump light */
  A.update = function (group, dt, rpm, jumpGreen) {
    const ud = group.userData;
    for (const p of ud.props) {
      p.prop.rotation.z += dt * (2 + rpm * 60);
      p.disc.material.opacity = Math.min(0.5, rpm * 0.5);
    }
    if (ud.jumpLight) ud.jumpLight.material.color.setHex(jumpGreen ? 0x22ff33 : 0xff2a1a);
  };

  return A;
})();


})();

</script>
