    /* throttled LOS */
    e.losT -= dt;
    if (e.losT <= 0) { e.losT = 0.22 + Math.random() * 0.15; e.hasLOS = !RT.player.dead && losToPlayer(e); }

    const distP = Math.hypot(p.x - e.x, p.z - e.z);

    switch (e.state) {
      case 'guard':
      case 'patrol': {
        if (e.hasLOS) {
          e.state = 'combat';
          e.lastKnown = { x: p.x, z: p.z };
          bark(e, BARKS_SPOT);
          A.alertGroup(e.group, p);
          if (RT.game) RT.game.onCombatStart();
          break;
        }
        if (e.state === 'patrol') {
          e.patrolWait -= dt;
          if (!e.moveTarget && e.patrolWait <= 0) {
            e.patrolAngle += 1.1 + Math.random();
            e.moveTarget = {
              x: e.home.x + Math.cos(e.patrolAngle) * e.patrolRadius,
              z: e.home.z + Math.sin(e.patrolAngle) * e.patrolRadius,
            };
          }
          if (e.moveTarget) {
            rig.anim.mode = 'walk';
            if (moveToward(e, e.moveTarget.x, e.moveTarget.z, 1.6, dt)) {
              e.moveTarget = null; e.patrolWait = 1.5 + Math.random() * 2.5;
            }
            e.yaw = angleLerp(e.yaw, e.targetYaw || e.yaw, 6 * dt);
          } else rig.anim.mode = 'idle';
        } else {
          rig.anim.mode = 'guard';
          // occasional look-around
          e.yaw += Math.sin(RT.engine.time * 0.3 + e.home.x) * dt * 0.12;
        }
        break;
      }
      case 'alert': {
        e.alertT += dt;
        if (e.hasLOS) { e.state = 'combat'; bark(e, BARKS_SPOT); break; }
        if (e.lastKnown) {
          rig.anim.mode = 'run';
          const arrived = moveToward(e, e.lastKnown.x, e.lastKnown.z, 3.4, dt);
          e.yaw = angleLerp(e.yaw, e.targetYaw || e.yaw, 8 * dt);
          if (arrived || e.alertT > 8) { e.lastKnown = null; }
        } else {
          rig.anim.mode = 'aim';
          rig.anim.aimPitch = 0;
          e.yaw += dt * 0.9; // scan
          if (e.alertT > 13) { e.state = e.patrolRadius ? 'patrol' : 'guard'; e.alertT = 0; }
        }
        break;
      }
      case 'combat': {
        if (e.hasLOS) e.lastKnown = { x: p.x, z: p.z };
        /* suppressed → duck */
        if (e.suppression > 1.6 && e.cover && e.atCover) {
          e.state = 'suppressed'; e.suppressT = 1 + Math.random() * 1.4; break;
        }
        /* fallback when hurt */
        if (e.hp < 32 && !e.fellBack && Math.random() < dt * 0.5) {
          e.fellBack = true; e.cover && (e.cover.claimed = null); e.cover = null; e.atCover = false;
          const away = Math.atan2(e.x - p.x, e.z - p.z);
          e.moveTarget = { x: e.x + Math.sin(away) * 12, z: e.z + Math.cos(away) * 12 };
        }
        if (e.moveTarget) {
          rig.anim.mode = 'run';
          if (moveToward(e, e.moveTarget.x, e.moveTarget.z, 4.2, dt)) e.moveTarget = null;
          e.yaw = angleLerp(e.yaw, e.targetYaw || e.yaw, 8 * dt);
          break;
        }
        if (!e.cover && !e.upstairs) pickCover(e);
        if (e.cover && !e.atCover) {
          rig.anim.mode = 'run';
          const arrived = moveToward(e, e.cover.x, e.cover.z, 4.4, dt);
          e.yaw = angleLerp(e.yaw, e.targetYaw || e.yaw, 8 * dt);
          if (arrived) { e.atCover = true; e.peekT = 0.4 + Math.random() * 0.7; e.peeking = false; }
          break;
        }

        faceTarget(e, p.x, p.z, dt);

            e.peekT = e.peeking ? 1.3 + Math.random() * 0.9 : 0.7 + Math.random() * 1.1 + e.suppression;
          }

          rig.anim.crouch = damp(rig.anim.crouch, e.peeking ? 0.25 : 1, 8, dt);
          if (e.peeking && e.hasLOS) enemyFire(e, dt);
        } else {
          rig.anim.mode = 'aim';
          rig.anim.crouch = damp(rig.anim.crouch, 0, 8, dt);
          if (e.hasLOS) enemyFire(e, dt);

          }
        }
        const dy = (RT.player.eyeY() - (e.y + 1.5));
        rig.anim.aimPitch = clamp(Math.atan2(dy, distP), -0.6, 0.6);
        /* squad flank + grenades */
        maybeFlank(e, dt);
        maybeGrenade(e, dt, distP);
        break;
      }
      case 'suppressed': {

        e.suppressT -= dt;
        if (e.suppressT <= 0) { e.state = 'combat'; e.suppression *= 0.4; }

    rig.group.rotation.y = e.yaw;
    if (e.cone) e.cone.visible = (e.state === 'patrol' || e.state === 'guard');
    RT.character.pose(rig, dt);
  }

  function maybeFlank(e, dt) {
    if (e.flanker || Math.random() > dt * 0.05) return;
    const combatCount = enemies.filter(x => !x.dead && x.state === 'combat' && x.group === e.group).length;
    if (combatCount < 3) return;
    const already = enemies.some(x => x.flanker && !x.dead && x.group === e.group);
    if (already) return;
    e.flanker = true;
    const p = RT.player.pos;
    const side = Math.random() > 0.5 ? 1 : -1;
    const ang = Math.atan2(e.x - p.x, e.z - p.z) + side * 1.5;
    e.cover && (e.cover.claimed = null); e.cover = null; e.atCover = false;
    e.moveTarget = { x: p.x + Math.sin(ang) * 14, z: p.z + Math.cos(ang) * 14 };
    bark(e, BARKS_FLANK);
  }
  function maybeGrenade(e, dt, distP) {
    enemyGrenadeCd -= dt;
    if (enemyGrenadeCd > 0 || distP < 9 || distP > 24 || !e.lastKnown) return;
    if (Math.random() > dt * 0.08) return;
    enemyGrenadeCd = 16 + Math.random() * 10;
    bark(e, BARKS_GREN);
    const p = { ...e.lastKnown };
    const from = new THREE.Vector3(e.x, e.y + 1.6, e.z);
    const geos = [RT.G.sph(0.055, 8, 6, 0x3a4433, {})];
    const m = RT.meshOf(geos, RT.MAT.gun);
    m.position.copy(from);
    RT.engine.scene.add(m);
    const t0 = 1.25;
    const v = new THREE.Vector3((p.x - e.x) / t0, 4.8, (p.z - e.z) / t0);
    let fuse = 2.6;
    (RT.transients = RT.transients || []).push((dt2) => {
      fuse -= dt2;
      v.y -= 9.8 * dt2;
      m.position.x += v.x * dt2; m.position.y += v.y * dt2; m.position.z += v.z * dt2;
      const g = RT.map.groundAt(m.position.x, m.position.z, m.position.y + 0.5);
      if (m.position.y < g + 0.04) { m.position.y = g + 0.04; v.y = Math.abs(v.y) * 0.3; v.x *= 0.5; v.z *= 0.5; }
      if (fuse <= 0) {
        RT.engine.scene.remove(m);
        RT.player.explode(m.position, 5.6, 95);
        return false;
      }
      return true;
    });
  }

  function bark(e, list) {
    if (barkCd > 0) return;
    barkCd = 3.5;
    const d = Math.hypot(e.x - RT.player.pos.x, e.z - RT.player.pos.z);
    if (d < 42 && RT.ui) RT.ui.say('ENEMY', list[(Math.random() * list.length) | 0], 1.8, true);
  }

  /* ---------- allies ---------- */
  function updateAlly(al, dt) {
    const rig = al.rig, p = RT.player.pos;
    if (RT.game && RT.game.cutscene) { rig.anim.mode = 'idle'; RT.character.pose(rig, dt); return; }
    const combat = enemies.some(e => !e.dead && (e.state === 'combat' || e.state === 'suppressed'));
    /* target selection (throttled) */
    al.losT -= dt;
    if (al.losT <= 0) {
      al.losT = 0.4 + Math.random() * 0.3;
      al.target = null;
      let bd = 70;
      for (const e of enemies) {
        if (e.dead || (e.state !== 'combat' && e.state !== 'alert' && e.state !== 'suppressed')) continue;
        const d = Math.hypot(e.x - al.x, e.z - al.z);
        if (d < bd) {
          const hit = RT.map.raycast(al.x, al.y + 1.55, al.z, (e.x - al.x) / d, (e.y + 1.3 - al.y - 1.55) / d, (e.z - al.z) / d, d - 0.5);
          if (!hit) { bd = d; al.target = e; }
        }
      }
    }
    /* movement: follow player at offset, snap to nearby cover in combat */
    const fx = Math.sin(RT.player.yaw), fz = Math.cos(RT.player.yaw);
    const ox = al.offset[0], oz = al.offset[1];
    const want = {
      x: p.x + (fz * ox + fx * oz),
      z: p.z + (-fx * ox + fz * oz),
    };
    const dWant = Math.hypot(want.x - al.x, want.z - al.z);
    if (dWant > (combat ? 7 : 2.6)) {
      rig.anim.mode = dWant > 9 ? 'run' : 'walk';
      const dx2 = want.x - al.x, dz2 = want.z - al.z;
      let mx = dx2 / dWant, mz = dz2 / dWant;
      const probe = RT.map.raycast(al.x, al.y + 1, al.z, mx, 0, mz, 1.3);
      if (probe) { const n = probe.normal; const side = ((mx * -n.z) + (mz * n.x)) >= 0 ? 1 : -1; mx = -n.z * side; mz = n.x * side; }
      const sp = dWant > 9 ? 5.6 : 2.4;
      const nx2 = al.x + mx * sp * dt, nz2 = al.z + mz * sp * dt;
      const ng = RT.map.groundAt(nx2, nz2, al.y + 0.6);
      if (Math.abs(ng - al.y) < 0.95) { al.x = nx2; al.z = nz2; al.y = damp(al.y, ng, 16, dt); }
      al.yaw = al.yaw == null ? 0 : angleLerp(al.yaw, Math.atan2(mx, mz), 8 * dt);
    } else if (al.target) {
      rig.anim.mode = 'aim';
      rig.anim.crouch = damp(rig.anim.crouch || 0, combat && RT.player.crouched ? 0.8 : 0, 6, dt);
      al.yaw = angleLerp(al.yaw || 0, Math.atan2(al.target.x - al.x, al.target.z - al.z), 9 * dt);
      const dy = (al.target.y + 1.4) - (al.y + 1.5);
      rig.anim.aimPitch = clamp(Math.atan2(dy, Math.hypot(al.target.x - al.x, al.target.z - al.z)), -0.5, 0.5);
      /* capped ally damage so the player does the real work */
      al.fireCd -= dt;
      if (al.fireCd <= 0) {
        al.fireCd = 0.5 + Math.random() * 0.8;
        al.muzzle.visible = true;
        setTimeout(() => { al.muzzle.visible = false; }, 40);
        const mp = _v1.set(0, 0, 0);
        al.muzzle.getWorldPosition(mp);
        if (RT.audio) RT.audio.allyShot();
        const e = al.target;
        const dir = _v2.set(e.x - mp.x, (e.y + 1.3) - mp.y, e.z - mp.z).normalize();
        RT.engine.tracer(mp, dir, Math.hypot(e.x - mp.x, e.z - mp.z), 280);
        if (Math.random() < 0.3) A.damageEnemy(e, 13, false, al);
      }
    } else {
      rig.anim.mode = combat ? 'aim' : 'idle';
      al.yaw = angleLerp(al.yaw || 0, RT.player.yaw + Math.PI + (al.offset[0] * 0.14), 4 * dt);
      rig.anim.aimPitch = 0;
    }
    rig.group.position.set(al.x, al.y, al.z);
    rig.group.rotation.y = al.yaw || 0;
    RT.character.pose(rig, dt);
  }

  /* ---------- damage & death ---------- */
  A.damageEnemy = function (e, dmg, headshot, source) {
    if (e.dead) return false;
    e.hp -= dmg * (headshot ? 2.4 : 1);
    e.rig.anim.flinch = 1;
    /* immediate 1-frame jolt; the pose damp blends the recovery */
    e.rig.j.chest.rotation.x -= headshot ? 0.2 : 0.13;
    e.rig.j.head.rotation.z += (Math.random() - 0.5) * 0.24;
    if (e.state === 'guard' || e.state === 'patrol') {
      e.state = 'alert';
      e.lastKnown = { x: RT.player.pos.x, z: RT.player.pos.z };
      A.alertGroup(e.group, RT.player.pos);
    }
    if (e.hp <= 0) {
      e.dead = true;
      e.rig.anim.deathT = 0;
      e.rig.anim.deathDir = Math.random() > 0.35 ? 1 : -1;
      if (e.cover) e.cover.claimed = null;
      if (RT.game) RT.game.onEnemyKilled(e, headshot);
      // nearby squad reacts
      for (const o of enemies) {
        if (o.dead || o === e || o.group !== e.group) continue;
        if (Math.hypot(o.x - e.x, o.z - e.z) < 25) {
          if (o.state === 'guard' || o.state === 'patrol') { o.state = 'alert'; o.lastKnown = { x: RT.player.pos.x, z: RT.player.pos.z }; }
          else if (o.state === 'combat' && o.atCover) o.suppression += 0.7;
        }
      }
      bark(e, BARKS_DEAD);
      return true;
    }
    return false;
  };

  A.explosionAt = function (p, radius, dmg) {
    for (const e of enemies) {
      if (e.dead) continue;
      const d = Math.hypot(e.x - p.x, (e.y + 1) - p.y, e.z - p.z);
      if (d < radius) A.damageEnemy(e, dmg * (1 - d / (radius * 1.15)), false);
      else if (d < radius * 2.2) e.suppression += 1.2;
    }
  };

  A.suppressNear = function (p, r, amt) {
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - p.x, e.z - p.z) < r) e.suppression += amt;
    }
  };

  A.aliveInGroup = g => enemies.filter(e => !e.dead && (g ? e.group === g : true)).length;
  A.inCombat = () => enemies.some(e => !e.dead && (e.state === 'combat' || e.state === 'suppressed' || e.state === 'alert'));

  /* ---------- destructibles: explosive barrels + breakable glass ---------- */
  function raySegAABB(o, d, mn, mx, maxT) {
    let tmin = 0, tmax = maxT;
    const O = [o.x, o.y, o.z], D = [d.x, d.y, d.z], A2 = [mn.x, mn.y, mn.z], B2 = [mx.x, mx.y, mx.z];
    for (let a = 0; a < 3; a++) {
      if (Math.abs(D[a]) < 1e-8) { if (O[a] < A2[a] || O[a] > B2[a]) return -1; }
      else { let t1 = (A2[a] - O[a]) / D[a], t2 = (B2[a] - O[a]) / D[a]; if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; } if (t1 > tmin) tmin = t1; if (t2 < tmax) tmax = t2; if (tmin > tmax) return -1; }
    }
    return tmin > 0.01 ? tmin : -1;
  }
  function shatterGlass(d, px, py, pz) {
    if (d.broken) return;
    d.broken = true; d.mesh.visible = false;
    if (RT.progress) RT.progress.tally('windows', 1);
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * TAU;
      RT.engine.particle(px + (Math.random() - .5) * 0.3, py + (Math.random() - .5) * 0.5, pz + (Math.random() - .5) * 0.3,
        Math.cos(a) * (1 + Math.random() * 2), Math.random() * 2 - 1, Math.sin(a) * (1 + Math.random() * 2),
        { color: 0xc4e2e8, size: 0.05, life: 0.8 + Math.random() * 0.5, grav: -11, drag: 0.8 });
    }
    if (RT.audio) RT.audio.glassBreak();
  }
  function explodeBarrel(d) {
    if (d.exploded) return;
    d.exploded = true; d.mesh.visible = false;
    if (d.col) d.col.disabled = true;
    const p = new THREE.Vector3(d.x, d.y + 0.3, d.z);
    RT.player.explode(p, 6.4, 96);          // FX + player + AI + bots + destructible chain (see PL.explode)
  }
  function blastDestructibles(p, r, dmg, skip) {
    if (!RT.map) return;
    for (const d of RT.map.destructibles) {
      if (d === skip) continue;
      const dd = Math.hypot(d.x - p.x, d.y - p.y, d.z - p.z);
      if (dd > r) continue;
      if (d.kind === 'barrel' && !d.exploded) { d.hp -= dmg * (1 - dd / r); if (d.hp <= 0) setTimeout(() => explodeBarrel(d), 70 + Math.random() * 140); }
      else if (d.kind === 'glass' && !d.broken) shatterGlass(d, d.x, d.y, d.z);
    }
  }
  function hitTarget(d, point) {
    d.hits = (d.hits || 0) + 1;
    if (RT.audio) RT.audio.metalPing();
    for (let i = 0; i < 6; i++)
      RT.engine.particle(point.x, point.y, point.z, (Math.random() - .5) * 3.5, Math.random() * 3 + 1, (Math.random() - .5) * 3.5,
        { color: 0xffe6b0, size: 0.05, life: 0.32, grav: -5, drag: 1 });
    if (RT.range && RT.range.onHit) RT.range.onHit(d);
    if (!d.animating) {
      d.animating = true; let t = 0;
      (RT.transients = RT.transients || []).push((dt) => {
        t += dt;
        const down = t < 0.12 ? t / 0.12 : (t < 1.1 ? 1 : Math.max(0, 1 - (t - 1.1) / 0.25));
        d.pivot.rotation.x = down * 1.5;
        if (t > 1.4) { d.pivot.rotation.x = 0; d.animating = false; return false; }
        return true;
      });
    }
  }
  function damageBarrel(d, dmg, point) {
    if (d.exploded) return;
    d.hp -= dmg;
    if (RT.audio) RT.audio.metalPing();
    for (let i = 0; i < 5; i++)
      RT.engine.particle(point.x, point.y, point.z, (Math.random() - .5) * 3, Math.random() * 3, (Math.random() - .5) * 3,
        { color: 0xffd98a, size: 0.04, life: 0.25, grav: -3, drag: 0.5 });

  }
  RT.blastDestructibles = blastDestructibles;

  /* ---------- player hitscan resolution ---------- */
  RT.combat = {
    explodeBarrel, blastDestructibles, shatterGlass,
    playerShot(org, dir, cfg, muzzleWorld) {
      if (RT.game) RT.game.stats.shots++;
      const maxD = cfg.range || 160;
      const wall = RT.map.raycast(org.x, org.y, org.z, dir.x, dir.y, dir.z, maxD);
      const wallD = wall ? wall.dist : maxD;
      /* bullet penetration through thin cover (never steel barrels / terrain) */
      let penetrated = false;
      if (wall && !wall.normal.terrain && wall.col && wall.col.pen !== false && !wall.col.barrel) {
        const thick = (wall.exit || wall.dist) - wall.dist;
        if (thick > 0.001 && thick < 0.4) penetrated = true;
      }
      const reach = penetrated ? maxD : wallD;
      /* friendly-fire guard: warn instead of damaging */
      for (const al of allies) {
        const rx = al.x - org.x, ry3 = (al.y + 1.15) - org.y, rz = al.z - org.z;
        const t = rx * dir.x + ry3 * dir.y + rz * dir.z;
        if (t < 0 || t > wallD) continue;
        const cx = org.x + dir.x * t - al.x, cy = org.y + dir.y * t - (al.y + 1.0), cz = org.z + dir.z * t - al.z;
        if (Math.hypot(cx, cy * 0.55, cz) < 0.42) {
          if (RT.ui) RT.ui.friendlyWarn();
          return;
        }
      }
      /* vs enemies (campaign) or bots (BR): sphere tests at head/chest/pelvis/knees */
      const targets = (RT.br && RT.br.active) ? RT.br.hittables() : enemies;
      let hitE = null, hitD = reach, hitHead = false;
      for (const e of targets) {
        if (e.dead) continue;
        const zones = [
          [e.x, e.y + 1.56, e.z, 0.14, true],
          [e.x, e.y + 1.18, e.z, 0.26, false],
          [e.x, e.y + 0.85, e.z, 0.24, false],
          [e.x, e.y + 0.4, e.z, 0.22, false],
        ];
        for (const [zx, zy, zz, zr, isHead] of zones) {
          const rx = zx - org.x, ry2 = zy - org.y, rz = zz - org.z;
          const t = rx * dir.x + ry2 * dir.y + rz * dir.z;
          if (t < 0 || t > hitD) continue;
          const cx = org.x + dir.x * t - zx, cy = org.y + dir.y * t - zy, cz = org.z + dir.z * t - zz;
          if (cx * cx + cy * cy + cz * cz < zr * zr) {
            if (t < hitD) { hitD = t; hitE = e; hitHead = isHead; }
            break;
          }
        }
      }
      const wallbang = hitE && penetrated && hitD > wallD;
      /* breakable glass: shatter any pane crossed up to the terminal point (glass never blocks the round) */
      const term = hitE ? hitD : (wall ? wallD : maxD);
      for (const d of RT.map.destructibles) {
        if (d.kind !== 'glass' || d.broken) continue;
        const gt = raySegAABB(org, dir, d.min, d.max, term + 0.4);
        if (gt >= 0) shatterGlass(d, org.x + dir.x * gt, org.y + dir.y * gt, org.z + dir.z * gt);
      }
      /* tracer from muzzle */
      if (cfg.tracer && Math.random() < 1 / cfg.tracer) {
        RT.engine.tracer(muzzleWorld, dir, hitD, 360);
      }
      RT.ai.suppressNear(new THREE.Vector3(org.x + dir.x * hitD, 0, org.z + dir.z * hitD), 5, 0.35);
      if (hitE) {
        if (RT.game) RT.game.stats.hits++;
        const dmgMod = RT.weapons ? RT.weapons.modFor(RT.weapons.state().curId).dmg : 1;
        let dmg = cfg.dmg * dmgMod * (hitHead ? cfg.headMul : 1);
        if (wallbang) dmg *= 0.5;                                 // penetration damage falloff
        dmg *= RT.difficulty().out;                              // difficulty: your outgoing damage
        const killed = (RT.br && RT.br.active)
          ? RT.br.damageBot(hitE, dmg, hitHead, 'player')
          : A.damageEnemy(hitE, dmg, hitHead);
        if (RT.hud) RT.hud.hitmarker(killed);
        // impact puff on body (no gore)
        const hp = new THREE.Vector3(org.x + dir.x * hitD, org.y + dir.y * hitD, org.z + dir.z * hitD);
        for (let i = 0; i < 4; i++)
          RT.engine.particle(hp.x, hp.y, hp.z, (Math.random() - .5) * 1.6, Math.random() * 1.4, (Math.random() - .5) * 1.6,
            { color: 0x5a5148, size: 0.07, life: 0.4, grav: -4, drag: 2 });
        if (wallbang && wall) {                                   // entry spray on the penetrated surface
          const wp = wall.point, wn = wall.normal;
          RT.engine.decal(new THREE.Vector3(wp.x, wp.y, wp.z), new THREE.Vector3(wn.x, wn.y, wn.z), 0.12, 0x26221c, 10);
          for (let i = 0; i < 5; i++)
            RT.engine.particle(wp.x, wp.y, wp.z, (Math.random() - .5) * 3, Math.random() * 2, (Math.random() - .5) * 3, { color: 0xa39a8e, size: 0.05, life: 0.3, grav: -5, drag: 1 });
        }
        if (RT.audio) RT.audio.hitFeedback(killed);
      } else if (wall && wall.col && wall.col.barrel) {
        damageBarrel(wall.col.barrel, cfg.dmg * (RT.weapons ? RT.weapons.modFor(RT.weapons.state().curId).dmg : 1), wall.point);
      } else if (wall && wall.col && wall.col.target) {
        hitTarget(wall.col.target, wall.point);
      } else if (wall) {
        const wp = new THREE.Vector3(wall.point.x, wall.point.y, wall.point.z);
        const wn = new THREE.Vector3(wall.normal.x, wall.normal.y, wall.normal.z);
        const isDirt = !!wall.normal.terrain;
        RT.engine.decal(wp, wn, cfg.pellets ? 0.1 : 0.15, isDirt ? 0x4a4034 : 0x26221c, 10);
        for (let i = 0; i < (isDirt ? 6 : 4); i++)
          RT.engine.particle(wp.x, wp.y, wp.z,
            wn.x * (1.5 + Math.random() * 2) + (Math.random() - .5) * 2, 1 + Math.random() * 2.5, wn.z * (1.5 + Math.random() * 2) + (Math.random() - .5) * 2,
            { color: isDirt ? 0x8a7a5e : 0xa39a8e, size: isDirt ? 0.09 : 0.05, life: 0.5, grav: -7, drag: 1.4 });
        if (!isDirt) for (let i = 0; i < 2; i++)
          RT.engine.particle(wp.x, wp.y, wp.z, wn.x * 3 + (Math.random() - .5) * 4, Math.random() * 3, wn.z * 3 + (Math.random() - .5) * 4,
            { color: 0xffd9a0, size: 0.035, life: 0.22, grav: -3, drag: 0.4 });
      }
    },
  };

  /* ---------- frame update ---------- */
  A.update = function (dt) {
    barkCd -= dt;
    /* cap corpse count */
    let corpses = 0;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.dead && e.rig.anim.mode === 'dead') {
        corpses++;
        if (corpses > 14) {
          if (e.rig.group.parent) e.rig.group.parent.remove(e.rig.group);
          enemies.splice(i, 1);
        }
      }
    }
    const px = RT.player.pos.x, pz = RT.player.pos.z;
    for (const e of enemies) {
      if (A._testFreeze && !e.dead) { RT.character.pose(e.rig, dt); continue; }
      // skip far-away idle enemies (perf)
      if (!e.dead && (e.state === 'guard' || e.state === 'patrol')) {
        const d = Math.hypot(e.x - px, e.z - pz);
        if (d > 130) continue;
      }
      updateEnemy(e, dt);
    }
    for (const al of allies) updateAlly(al, dt);
  };

  return A;
})();

/* ============================================================
 * Mission runtime: sequential objectives with waypoints,
 * checkpoints, timed scripts, wave spawns.
 * ============================================================ */
RT.missionRuntime = (() => {
  const M = {};
  let objectives = [], objIdx = -1, def = null, timers = [];
  M.checkpoint = null;

  M.start = function (missionDef, info) {
    def = missionDef;
    objectives = missionDef.objectives ? missionDef.objectives(M, info) : [];
    objIdx = -1; timers = [];
    RT.ui.setObjectives(objectives);
    M.advance();
  };
  M.after = function (t, fn) { timers.push({ t, fn }); };
  M.say = (who, text, dur) => RT.ui.say(who, text, dur);
  M.obj = () => objectives[objIdx];
  let countdownFail = null;
  M.startTimer = function (sec, onExpire) { RT.ui.setTimer(sec); countdownFail = onExpire; };
  M.stopTimer = function () { RT.ui.clearTimer(); countdownFail = null; };

  M.advance = function () {
    objIdx++;
    const o = objectives[objIdx];
    RT.ui.waypointTargets.length = 0;
    if (!o) { RT.game.missionComplete(); return; }
    o.hidden = false;
    RT.ui.refreshObjectives();
    if (o.text) RT.ui.toast(o.text.toUpperCase(), 'NEW OBJECTIVE');
    if (o.waypoint) {
      const wy = o.waypoint.y != null ? o.waypoint.y : RT.map.groundAt(o.waypoint.x, o.waypoint.z, 999) + 1.6;
      RT.ui.waypointTargets[0] = { x: o.waypoint.x, y: wy, z: o.waypoint.z };
    }
    if (o.onStart) o.onStart(M);
    /* checkpoint at each objective */
    RT.game.saveCheckpoint();
  };

  M.update = function (dt) {
    if (countdownFail) {
      const left = RT.ui.tickTimer(dt);
      if (left <= 0 && left > -1e8) { const fn = countdownFail; countdownFail = null; RT.ui.clearTimer(); fn(); }
    }
    for (let i = timers.length - 1; i >= 0; i--) {
      timers[i].t -= dt;
      if (timers[i].t <= 0) { const fn = timers[i].fn; timers.splice(i, 1); fn(); }
    }
    const o = objectives[objIdx];
    if (!o) return;
    if (o.update) o.update(dt, M);
    if (o.check && o.check(M)) {
      o.done = true;
      RT.ui.refreshObjectives();
      if (o.onDone) o.onDone(M);
      if (RT.audio) RT.audio.objectiveStinger();
      M.advance();
    }
  };

  /* helpers for mission scripts */
  M.reached = (x, z, r) => Math.hypot(RT.player.pos.x - x, RT.player.pos.z - z) < r;
  M.groupDead = g => RT.ai.aliveInGroup(g) === 0;
  M.spawnWave = function (points, group) {
    for (const [x, z] of points) {
      const e = RT.ai.spawnEnemy(x, z, { group });
      e.state = 'alert';
      e.lastKnown = { x: RT.player.pos.x, z: RT.player.pos.z };
    }
  };
  return M;
})();

/* map viewer support (Gate C) */
RT.buildMissionWorld = function (idx) {
  const def = RT.missions[idx];
  RT.engine.setAtmosphere(def.atmosphere);
  const terrain = new RT.Terrain(def.terrain);
  const B = new RT.MapBuilder(terrain, def.terrain.seed);
  RT.map = B;
  RT.map.def = def;
  const info = def.buildMap(B);
  const group = B.finalize();
  RT.engine.world.add(group);
  RT.map.info = info;
  return { B, info, def };
};

/* ============================================================
 * UI: HUD (ammo/compass/objectives/waypoints/subtitles/hitmarker/
 * vignette/interact), menus (main/mission select/settings/pause/
 * mission end/credits), letterbox + fade, progress storage.
 * ============================================================ */
RT.ui = (() => {
  const U = {};
  let hud, subQueue = [], subCur = null, toastT = 0;
  const waypoints = [];

  /* ---------- progress (3 save slots) ---------- */
  U.slot = 0;
  try { U.slot = Math.min(2, Math.max(0, +(localStorage.getItem('rt_slot') || 0) || 0)); } catch (e) {}
  const progKey = () => 'rt_progress_' + U.slot;
  const loadSlot = () => {
    let p = null;
    try {
      let raw = localStorage.getItem(progKey());
      if (!raw && U.slot === 0) raw = localStorage.getItem('rt_progress');   // migrate legacy save
      p = JSON.parse(raw || 'null');
    } catch (e) {}
    U.progress = p || { unlocked: 1, best: {} };
  };
  loadSlot();
  U.saveProgress = () => { try { localStorage.setItem(progKey(), JSON.stringify(U.progress)); } catch (e) {} };
  U.slotSummary = (n) => {
    try {
      const p = JSON.parse(localStorage.getItem('rt_progress_' + n) || (n === 0 ? localStorage.getItem('rt_progress') : null) || 'null');
      if (!p) return 'Empty';
      const lvl = p.xp && RT.progress ? RT.progress.levelFor(p.xp) : 1;
      return 'Mission ' + Math.min(p.unlocked || 1, 5) + ' · Rank ' + lvl;
    } catch (e) { return 'Empty'; }
  };
  U.switchSlot = (n) => {
    if (n === U.slot) return;
    U.saveProgress();
    U.slot = n; try { localStorage.setItem('rt_slot', n); } catch (e) {}
    loadSlot();
    if (RT.progress && RT.progress.refreshArmory) RT.progress.refreshArmory();
    U.renderSlots && U.renderSlots();
    $('btn-continue').disabled = U.progress.unlocked <= 1 && !U.progress.best[1];
  };
  U.resetSlot = () => { U.progress = { unlocked: 1, best: {} }; U.saveProgress(); if (RT.progress && RT.progress.refreshArmory) RT.progress.refreshArmory(); U.renderSlots && U.renderSlots(); };

  /* ---------- build DOM ---------- */
  U.init = function () {
    const body = document.body;

  /* ---------- screen switching ---------- */
  let activeScreen = null;
  U.showScreen = function (id) {
    for (const s of document.querySelectorAll('.screen')) {
      if (s.id === id) {
        s.classList.remove('hidden');
        requestAnimationFrame(() => s.classList.remove('fading'));
      } else {
        s.classList.add('fading');
        setTimeout(() => s.classList.add('hidden'), 460);
      }
    }
    activeScreen = id;
  };
  U.hideScreens = function () {
    for (const s of document.querySelectorAll('.screen')) {
      s.classList.add('fading');
      setTimeout(() => s.classList.add('hidden'), 460);
    }
    activeScreen = null;
  };
  U.showMenu = () => { U.showScreen('main-menu'); $('btn-continue').disabled = U.progress.unlocked <= 1 && !U.progress.best[1]; };
  U.showSettings = (from) => { U._settingsFrom = from; U._syncSettings(); U.showScreen('settings-screen'); };
  U.showCredits = (finale) => {
    U._creditsFinale = finale;
    U.showScreen('credits-screen');
    const inner = $('credits-inner');
    inner.style.transition = 'none'; inner.style.top = finale ? '60vh' : '0px';
    if (finale) {
      requestAnimationFrame(() => {
        inner.style.transition = 'top 36s linear';
        inner.style.top = (-inner.offsetHeight) + 'px';
      });
    }
  };
  U.showMissionSelect = function () {
    const grid = $('mission-grid');
    grid.innerHTML = '';
    RT.missions.forEach((m, i) => {
      const locked = i + 1 > U.progress.unlocked;
      const b = el('button', 'mission-card' + (locked ? ' locked' : ''), grid);
      const best = U.progress.best[m.id];
      b.innerHTML = `<div class="mission-num">${String(i + 1).padStart(2, '0')}</div>` +
        `<div class="mission-info"><div class="mission-name">${m.title}</div><div class="mission-desc">${locked ? 'Locked — complete previous mission' : m.desc}</div></div>` +
        `<div class="mission-stats">${best ? `BEST <b>${RT.fmtTime(best.time)}</b><br>ACC <b>${best.acc}%</b> · KILLS <b>${best.kills}</b>` : (locked ? '🔒' : 'NOT COMPLETED')}</div>`;

  let lastHP = 100;
  U.setHealth = function (h, sinceHurt) {
    const low = $('health-low');
    low.style.opacity = h < 45 ? (1 - h / 45) * (0.72 + Math.sin(RT.engine.time * 6) * 0.15) : 0;
    if (sinceHurt > 1.2) $('vignette').style.opacity = clamp(1.15 - h / 100 - sinceHurt * 0.12, 0, 0.9);
    /* segmented HP bar: 4 × 25, white→red, damage flash, regen pulse */
    const regen = h > lastHP + 0.01;
    const hurt = h < lastHP - 0.1;
    for (let i = 0; i < 4; i++) {
      const segFill = clamp((h - i * 25) / 25, 0, 1);
      const f = $('hp-f' + i);
      if (!f) return;
      f.style.transform = `scaleX(${segFill})`;
      const t = h / 100;
      f.style.background = hurt ? '#fff' : `rgb(${255 - t * 30 | 0},${60 + t * 195 | 0},${55 + t * 185 | 0})`;
      f.style.boxShadow = regen ? '0 0 6px rgba(140,255,160,.8)' : 'none';
    }
    $('hp-num').textContent = Math.ceil(h);
    $('hp-num').style.color = h < 35 ? '#e04c3c' : '#fff';
    lastHP = h;
  };
  let ffT = 0;
  U.friendlyWarn = function () { $('ff-warn').style.opacity = 1; ffT = 0.7; };
  U.damageFrom = function (angle) {
    const d = el('div', 'dmg-arc', $('dmgdir'));

  /* ---------- waypoints ---------- */
  const _wv = new THREE.Vector3();
  U.waypointTargets = [];  // [{x,y,z,label}]
  function updateWaypoints() {
    const cam = RT.engine.camera;
    for (let i = 0; i < waypoints.length; i++) {
      const w = waypoints[i];
      const t = U.waypointTargets[i];
      if (!t) { w.classList.add('hidden'); continue; }
      w.classList.remove('hidden');
      _wv.set(t.x, t.y, t.z).project(cam);
      let x = (_wv.x * 0.5 + 0.5) * innerWidth;
      let y = (-_wv.y * 0.5 + 0.5) * innerHeight;
      const behind = _wv.z > 1;
      if (behind) { x = innerWidth - x; y = innerHeight * 0.86; }
      x = clamp(x, 40, innerWidth - 40);
      y = clamp(y, 60, innerHeight - 80);
      w.style.left = x + 'px'; w.style.top = y + 'px';
      const d = Math.hypot(t.x - RT.player.pos.x, t.z - RT.player.pos.z);
      w.querySelector('.dist').textContent = Math.round(d) + 'm';
      w.style.opacity = d < 4 ? 0.25 : 0.95;
    }
  }

  /* ---------- compass ---------- */
  function drawCompass() {
    const cv = $('compass');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, 420, 34);
    const yaw = RT.player ? RT.player.yaw : 0;
    const heading = ((-yaw) % TAU + TAU) % TAU;
    ctx.font = '600 13px Segoe UI, Arial';
    ctx.textAlign = 'center';
    const pxPerRad = 420 / (Math.PI * 0.9);
    const labels = [['N', 0], ['NE', Math.PI / 4], ['E', Math.PI / 2], ['SE', Math.PI * 0.75], ['S', Math.PI], ['SW', Math.PI * 1.25], ['W', Math.PI * 1.5], ['NW', Math.PI * 1.75]];
    for (const [lab, ang] of labels) {
      let d = ang - heading;
      while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
      const x = 210 + d * pxPerRad;
      if (x < -20 || x > 440) continue;
      ctx.fillStyle = lab.length === 1 ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.55)';
      ctx.fillText(lab, x, 14);
    }
    for (let deg = 0; deg < 360; deg += 15) {
      const ang = deg * DEG;
      let d = ang - heading;
      while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
      const x = 210 + d * pxPerRad;
      if (x < 0 || x > 420) continue;
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.fillRect(x, 20, 1, deg % 45 === 0 ? 7 : 4);
    }
    /* allies: green ticks */
    if (RT.ai) {
      for (const al of RT.ai.allies) {
        const ang = Math.atan2(al.x - RT.player.pos.x, -(al.z - RT.player.pos.z));
        let d = ang - heading;
        while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
        const x = 210 + d * pxPerRad;
        if (x < 4 || x > 416) continue;
        ctx.fillStyle = '#7fe08a';
        ctx.fillRect(x - 1.5, 22, 3, 8);
      }
    }
    /* objective bearing chevrons */
    for (const t of U.waypointTargets) {
      if (!t) continue;
      const ang = Math.atan2(t.x - RT.player.pos.x, -(t.z - RT.player.pos.z));
      let d = ang - heading;
      while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
      const x = clamp(210 + d * pxPerRad, 8, 412);
      ctx.fillStyle = '#e8a33d';
      ctx.beginPath();
      ctx.moveTo(x - 5, 32); ctx.lineTo(x + 5, 32); ctx.lineTo(x, 24);
      ctx.fill();
    }
    /* center tick */
    ctx.fillStyle = '#e8a33d';
    ctx.fillRect(209, 2, 2, 8);
  }

  /* ---------- countdown timer ---------- */
  let timerVal = -1;
  U.setTimer = function (sec) { timerVal = sec; $('timer').style.display = 'block'; };
  U.clearTimer = function () { timerVal = -1; if ($('timer')) $('timer').style.display = 'none'; };
  U.tickTimer = function (dt) {
    if (timerVal < 0) return -1;
    timerVal -= dt;
    const t = Math.max(0, timerVal);
    const e = $('timer');
    e.textContent = RT.fmtTime(t) + (t < 10 ? '.' + Math.floor((t % 1) * 10) : '');
    e.style.color = t < 12 ? (Math.sin(RT.engine.time * 9) > 0 ? '#e04c3c' : '#fff') : '#fff';
    return timerVal;
  };

  /* ---------- teammate indicators: chevron + name + micro HP bar ---------- */
  const allyTags = [];
  const _av = new THREE.Vector3();
  function updateAllyTags(dt) {
    if (!RT.ai) return;
    const allies = RT.ai.allies;
    while (allyTags.length < allies.length) {
      const tag = el('div', '', hud);
      tag.style.cssText = 'position:absolute;pointer-events:none;text-align:center;transform:translate(-50%,-100%);transition:opacity .2s';
      tag.innerHTML = '<div class="aname" style="font-size:10px;letter-spacing:.14em;color:#8fe096;text-shadow:0 1px 3px #000;font-weight:700"></div>' +
        '<div style="color:#8fe096;font-size:9px;line-height:5px">▼</div>' +
        '<div style="width:34px;height:3px;background:rgba(0,0,0,.5);margin:2px auto 0"><div class="ahp" style="height:100%;background:#7fe08a;width:100%"></div></div>';
      allyTags.push({ tag, occlT: 0, occluded: false });
    }
    const cam = RT.engine.camera;
    allies.forEach((al, i) => {
      const t = allyTags[i];
      if (!t) return;
      const d = Math.hypot(al.x - RT.player.pos.x, al.z - RT.player.pos.z);
      _av.set(al.x, al.y + 2.05, al.z).project(cam);
      const behind = _av.z > 1;
      if (behind || d > 70 || RT.game.state !== 'play') { t.tag.style.opacity = 0; return; }
      /* occlusion check at 3Hz — dim but never fully hide within 40m */
      t.occlT -= dt;
      if (t.occlT <= 0) {
        t.occlT = 0.33;
        const dy = (al.y + 1.5) - RT.player.eyeY();
        const d3 = Math.hypot(d, dy);
        t.occluded = !!RT.map.raycast(RT.player.pos.x, RT.player.eyeY(), RT.player.pos.z,
          (al.x - RT.player.pos.x) / d3, dy / d3, (al.z - RT.player.pos.z) / d3, d3 - 0.6);
      }
      t.tag.style.left = ((_av.x * 0.5 + 0.5) * innerWidth) + 'px';
      t.tag.style.top = ((-_av.y * 0.5 + 0.5) * innerHeight) + 'px';
      t.tag.style.opacity = t.occluded ? (d < 40 ? 0.35 : 0) : clamp(1.3 - d / 70, 0.35, 1);
      const sc = clamp(1.25 - d / 60, 0.7, 1.15);
      t.tag.style.transform = `translate(-50%,-100%) scale(${sc})`;
      const nameEl = t.tag.querySelector('.aname');
      if (nameEl.textContent !== al.name) nameEl.textContent = al.name;
      t.tag.querySelector('.ahp').style.width = clamp(al.hp != null ? al.hp : 100, 0, 100) + '%';
      if (al.down) { nameEl.textContent = al.name + ' — DOWN'; nameEl.style.color = '#e8a33d'; }
    });
  }

  /* ---------- per-frame ---------- */
  U.update = function (dt) {
    /* hitmarker fade */
    if (hmT > 0) { hmT -= dt; if (hmT <= 0) $('hitmarker').style.opacity = 0; }
    if (ffT > 0) { ffT -= dt; if (ffT <= 0) $('ff-warn').style.opacity = 0; }
    updateAllyTags(dt);
    /* toast */
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
    /* subtitles */
    if (subCur) {
      subCur.dur -= dt;
      if (subCur.dur <= 0) { subCur = null; $('subtitles').innerHTML = ''; }
    }
    if (!subCur && subQueue.length) {
      subCur = subQueue.shift();
      $('subtitles').innerHTML = `<div class="line"><span class="who">${subCur.who}:</span> ${subCur.text}</div>`;
    }
    if (RT.game && RT.game.state === 'play') {
      drawCompass();
      updateWaypoints();
    }
  };

  return U;
})();
RT.hud = RT.ui; // player/weapons call RT.hud.*


/* ==================== 10_main.js ==================== */
/* ============================================================
 * Game orchestrator: boot, menu backdrop, mission lifecycle,
 * cutscenes, checkpoints, pause, stats, main loop dispatch.

RT.game = (() => {
  const GA = {};

  let checkpoint = null;

  /* ---------- menu backdrop: dawn drift over Mission 1 map ---------- */
  GA.showMenuWorld = function () {
    RT.engine.clearWorld();

    rifle.position.set(-24.6, RT.map.groundAt(-25, 55, 999) + 0.9, 54.6);
    rifle.rotation.set(0.2, 0.7, 1.25);

    const rig = RT.character.build({ faction: 'ally', seed: 5, headgear: 'helmet' });
    rig.group.position.set(-27.5, RT.map.groundAt(-27.5, 53.4, 999), 53.4);
    rig.group.rotation.y = 2.2;
    rig.anim.mode = 'guard';
    RT.engine.world.add(rig.group);
    GA._menuRig = rig;
  };

  function updateMenu(dt) {
    menuDrift += dt;
    const cam = RT.engine.camera;
    const t = menuDrift * 0.021;
    const cx = -20 + Math.sin(t) * 16, cz = 66 + Math.cos(t * 0.8) * 18;
    const cy = RT.map.groundAt(cx, cz, 999) + 3.6 + Math.sin(t * 2.2) * 0.4;
    cam.position.set(cx, cy, cz);
    cam.lookAt(-34, RT.map.groundAt(-34, 68, 999) + 2.2, 68);
    cam.rotation.z = Math.sin(t * 0.7) * 0.012;

  /* ---------- mission lifecycle ---------- */
  GA.startMission = function (idx) {
    if (idx >= RT.missions.length) { GA.quitToMenu(); return; }

    RT.ui.fade(true);
    RT.ui.showLoading();
    setTimeout(() => {
      RT.engine.clearWorld();
      RT.ai.reset();
      const { info, def } = RT.buildMissionWorld(idx);
      GA.info = info; GA.def = def;
      /* spawn actors */
      RT.player.init(info.playerSpawn);
      RT.ai.spawnAllies(info.squad || []);
      for (const g of info.enemies || []) {
        for (let i = 0; i < (g.count || 1); i++) {
          const ox = i === 0 ? 0 : (Math.random() - 0.5) * 6;
          const oz = i === 0 ? 0 : (Math.random() - 0.5) * 6;
          RT.ai.spawnEnemy(g.x + ox, g.z + oz, g);
        }
      }
      RT.weapons.setLoadout(def.loadout, true);
      RT.player.grenades = 4;
      GA.stats = { shots: 0, hits: 0, kills: 0, heads: 0, start: RT.engine.time };
      RT.audio.setAmbient(def.ambient);
      RT.engine.setWeather(def.weather || null);
      RT.ui.clearTimer();
      RT.ui.clearSubtitles();
      RT.ui.hideLoading();
      RT.ui.fade(false, true);

  function beginPlay() {
    RT.missionRuntime.start(GA.def, GA.info);
    RT.ui.showHUD(true);

  GA.doEngage = function () {
    if (GA.state !== 'engage') return;

  function showEngage(text) {

        'background:rgba(0,0,0,.25);cursor:pointer;color:#fff;text-shadow:0 2px 8px #000;text-align:center';
      engageEl.onclick = GA.doEngage;
    }

      `<div class="paused-note" style="margin-top:0">${RT.ui.controlsCard()}</div>`;

  }

  GA.pause = function () {
    if (GA.state !== 'play') return;
    GA.state = 'pause';
    RT.input.unlock();
    if (RT.$('pause-controls')) RT.$('pause-controls').innerHTML = RT.ui.controlsCard();

  GA.resume = function () {

    RT.input.lock();

  GA.resumeFromCutscene = function () {
    RT.weapons.setVisible(true);

    RT.input.lock();

  /* ---------- photo mode: detached free-fly camera ---------- */
  GA.enterPhoto = function () {
    if (GA.state !== 'pause') return;
    const cam = RT.engine.camera;
    GA._photo = { x: cam.position.x, y: cam.position.y, z: cam.position.z, yaw: RT.player.yaw, pitch: RT.player.pitch };
    GA.state = 'photo';

    RT.ui.showPhotoHint(true);

  GA.exitPhoto = function () {
    if (GA.state !== 'photo') return;
    RT.ui.showPhotoHint(false);
    GA.state = 'pause';
    RT.input.unlock();
    if (RT.$('pause-controls')) RT.$('pause-controls').innerHTML = RT.ui.controlsCard();
    RT.ui.showScreen('pause-screen');
  };
  function updatePhoto(dt) {
    const I = RT.input, cam = RT.engine.camera, ph = GA._photo;
    let [mdx, mdy] = I.consumeMouse();
    if (I.keyboardMode() || I.fallback) {
      const ls = 1.5 * dt;
      if (I.keys.ArrowLeft) ph.yaw += ls; if (I.keys.ArrowRight) ph.yaw -= ls;
      if (I.keys.ArrowUp) ph.pitch += ls; if (I.keys.ArrowDown) ph.pitch -= ls;
    }
    ph.yaw -= mdx * 0.002; ph.pitch = clamp(ph.pitch - mdy * 0.002, -1.45, 1.45);
    const sp = (I.keys.ShiftLeft ? 30 : 12) * dt;
    const cy = Math.cos(ph.pitch);
    const fx = -Math.sin(ph.yaw) * cy, fy = Math.sin(ph.pitch), fz = -Math.cos(ph.yaw) * cy;
    const rx = Math.cos(ph.yaw), rz = -Math.sin(ph.yaw);
    const mf = (I.keys.KeyW ? 1 : 0) - (I.keys.KeyS ? 1 : 0);
    const msd = (I.keys.KeyD ? 1 : 0) - (I.keys.KeyA ? 1 : 0);
    const mu = (I.keys.KeyE ? 1 : 0) - (I.keys.KeyQ ? 1 : 0);
    ph.x += (fx * mf + rx * msd) * sp; ph.y += (fy * mf + mu) * sp; ph.z += (fz * mf + rz * msd) * sp;
    cam.position.set(ph.x, ph.y, ph.z);
    cam.rotation.set(ph.pitch, ph.yaw, 0);

    if (I.pressed('KeyP') || I.pressed('Escape')) GA.exitPhoto();
  }
  GA.quitToMenu = function () {

  /* ---------- checkpoints & death ---------- */
  GA.saveCheckpoint = function () {
    checkpoint = {
      player: RT.player.state(),

    GA.cutscene = { curve, lookCurve, t: 0, dur: def.dur || 12, lines: (def.lines || []).slice(), cb, skipT: 0, onUpdate: def.onUpdate };
    GA.state = 'cutscene';
    RT.ui.letterbox(true);
    RT.ui.showHUD(false);
  };
  const _csPos = new THREE.Vector3(), _csLook = new THREE.Vector3();
  function updateCutscene(dt) {
    const cs = GA.cutscene;
    if (!cs) return;
    cs.t += dt;
    const k = smoothstep(0, 1, clamp(cs.t / cs.dur, 0, 1)) * 0.999;
    cs.curve.getPointAt(k, _csPos);
    cs.lookCurve.getPointAt(k, _csLook);
    const cam = RT.engine.camera;
    cam.position.copy(_csPos);
    cam.lookAt(_csLook);
    RT.engine.updateSun(_csPos);
    for (let i = cs.lines.length - 1; i >= 0; i--) {
      if (cs.t >= cs.lines[i].t) {
        RT.ui.say(cs.lines[i].who, cs.lines[i].text);
        cs.lines.splice(i, 1);
      }
    }
    if (cs.onUpdate) cs.onUpdate(cs.t, dt);
    /* skip: hold space */
    if (RT.input.keys.Space) cs.skipT += dt; else cs.skipT = 0;
    if (cs.t >= cs.dur || cs.skipT > 0.55) {
      GA.cutscene = null;
      RT.ui.letterbox(false);
      RT.ui.clearSubtitles();
      const cb = cs.cb;
      if (cb) cb();
    }
  }

  /* ---------- main update ---------- */
  GA.update = function (dt, raw) {
    combatStingerCd -= raw;
    RT.ui.update(raw);
    RT.audio.update(raw);
    /* dynamic combat music (campaign): on during firefights + a short tail after */
    const inCombat = GA.state === 'play' && !(RT.br && RT.br.active) && RT.ai.inCombat && RT.ai.inCombat();
    if (inCombat) GA._combatHold = 5; else if (GA._combatHold > 0) GA._combatHold -= raw;
    if (RT.audio) RT.audio.combatMusic(inCombat || GA._combatHold > 0);
    if (RT.br && (RT.br.active || GA.state === 'br')) RT.br.update(dt, raw);
    if (GA.state === 'br') return;
    if (GA.state === 'menu') { updateMenu(dt); return; }
    if (GA.state === 'cutscene') { updateCutscene(raw); RT.ai.update(dt * 0.25); return; }
    if (GA.state === 'engage') {
      if (RT.input.pressed('Enter') || RT.input.pressed('NumpadEnter')) GA.doEngage();
      return;
    }
    if (GA.state === 'photo') { updatePhoto(dt); return; }
    if (GA.state === 'pause') return;
    /* smoke column beacons */
    if (RT.map && RT.map.smokeSources && (GA.state === 'play' || GA.state === 'cutscene' || GA.state === 'menu' || GA.state === 'engage')) {
      for (const s of RT.map.smokeSources) {
        s.t -= raw;
        if (s.t <= 0) {
          s.t = 0.09;
          RT.engine.particle(s.x + (Math.random() - .5) * 0.8, s.y, s.z + (Math.random() - .5) * 0.8,
            (Math.random() - .5) * 0.6, 2.2 + Math.random() * 1.6, (Math.random() - .5) * 0.6,
            { color: [0x2b2926, 0x3a3733, 0x4a4540][(Math.random() * 3) | 0], size: 0.9 + Math.random() * 0.9, life: 3.4 + Math.random() * 2, grav: 0.75, drag: 0.9, grow: -0.35, alpha: 0.6 });
        }
      }
    }
    if (GA.state === 'dead' && GA._killcam) {
      updateKillcam(dt);
      if (!(RT.br && RT.br.active)) RT.ai.update(dt);
      RT.weapons.updateShells(dt);
      return;
    }
    if (GA.state === 'play' || GA.state === 'dead') {
      RT.player.update(dt);
      const [rp, ry] = RT.weapons.consumeRecoil();
      RT.player.addRecoil(rp, ry);
      RT.weapons.update(dt, {
        speedF: RT.player.speedF, sprinting: RT.player.sprinting,
        lookVelX: 0, lookVelY: 0, dead: RT.player.dead,
      });
      RT.weapons.updateShells(dt);
      if (GA._range) {
        if (RT.range) RT.range.update(dt);
      } else if (!(RT.br && RT.br.active)) {
        RT.ai.update(dt);
        RT.missionRuntime.update(dt);
      }
      RT.ui.refreshAmmo();
      if (RT.input.pressed('Escape')) GA.pause();
    }
  };

  return GA;
})();

/* ============================================================
 * Boot
 * ============================================================ */
function boot() {
  if (typeof THREE === 'undefined') {
    RT.$('boot-msg').textContent = 'FAILED TO LOAD RENDERER — CHECK CONNECTION';
    return;
  }
  RT.engine.init();
  RT.input.init(RT.engine.renderer.domElement);
  RT.ui.init();
  if (RT.progress) RT.progress.init();

  RT.engine.onUpdate((dt, raw) => {
    if (RT.transients) {
      for (let i = RT.transients.length - 1; i >= 0; i--) if (!RT.transients[i](dt)) RT.transients.splice(i, 1);
    }
  });

  if (location.hash) RT.ui.fade(false);
  if (location.hash === '#soldier') { soldierViewer(); return finishBoot(); }
  if (location.hash === '#weapon') { weaponViewer(); return finishBoot(); }
  if (location.hash === '#map') { mapViewer(); return finishBoot(); }
  if (location.hash === '#plane') { planeViewer(); return finishBoot(); }

  RT.weapons.init();
  RT.engine.onUpdate((dt, raw) => RT.game.update(dt, raw));
  RT.game.showMenuWorld();
  /* first user gesture unlocks audio */
  document.addEventListener('pointerdown', () => RT.audio.ensure(), { once: true });

  /* test hooks */
  window.RT_DEBUG = {
    start: i => RT.game.startMission(i),
    state: () => RT.game.state,
    engage: () => { const e = document.querySelector('body > div[style*="cursor: pointer"]'); },
    play: () => { RT.game.state = 'play'; },
    warp: (x, z) => { RT.player.pos.x = x; RT.player.pos.z = z; RT.player.pos.y = RT.map.groundAt(x, z, 999); },
    killAll: g => { for (const e of RT.ai.enemies) if (!e.dead && (!g || e.group === g)) RT.ai.damageEnemy(e, 9999); },
    god: v => { RT.game.godmode = v; },
    skipCutscene: () => { if (RT.game.cutscene) RT.game.cutscene.t = 1e9; },
    look: (yaw, pitch) => { RT.game.testLockLook = true; RT.player.yaw = yaw; RT.player.pitch = pitch || 0; },
    useNearest: () => {
      let best = null, bd = 99;
      const p = RT.player.pos;
      for (const it of RT.map.interact) {
        if (it.used) continue;
        const q = it.getPos ? it.getPos() : it;
        const d = Math.hypot(q.x - p.x, q.z - p.z);
        if (d < bd) { bd = d; best = it; }
      }
      if (best && bd < 7) {
        if (best.door) { best.door.open = true; best.door.target = 1.1; best.door.speed = 12; }
        else if (best.fn) { best.fn(best); if (best.once) best.used = true; }
        return best.label || 'door';
      }
      return null;
    },
  };
  finishBoot();
}

function finishBoot() {
  RT.engine.start();
  RT.$('boot-msg').classList.add('hidden');
  window.RT_BOOT = 'ok';
  console.log('RT boot ok');
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* ---------- Gate C viewer: mission map flyover ---------- */
function mapViewer() {
  const params = new URLSearchParams(location.search);
  const mi = parseInt(params.get('m') || '0', 10);
  RT.buildMissionWorld(mi);
  const cam = RT.engine.camera;
  const cx = parseFloat(params.get('x') || '0');
  const cy = parseFloat(params.get('y') || '90');
  const cz = parseFloat(params.get('z') || '120');
  const lx = parseFloat(params.get('lx') || '0');
  const ly = parseFloat(params.get('ly') || '0');
  const lz = parseFloat(params.get('lz') || '-40');
  cam.position.set(cx, cy, cz);
  cam.lookAt(lx, ly, lz);
  if (params.get('ortho')) {
    /* pseudo-orthographic top-down: narrow FOV from very high, fog off */
    cam.fov = 34; cam.far = 3000; cam.updateProjectionMatrix();
    cam.position.set(parseFloat(params.get('x') || '0'), 620, parseFloat(params.get('z') || '20') + 1);
    cam.lookAt(parseFloat(params.get('x') || '0'), 0, parseFloat(params.get('z') || '20'));
    RT.engine.scene.fog.density = 0.00004;
  }
  if (params.get('ground')) {
    const gx = parseFloat(params.get('x') || '0'), gz = parseFloat(params.get('z') || '120');
    cam.position.set(gx, RT.map.groundAt(gx, gz, 999) + 1.65, gz);
    cam.lookAt(lx, RT.map.groundAt(lx, lz, 999) + 1.4, lz);
  }
  RT.engine.onUpdate(() => RT.engine.updateSun(cam.position));
  window.RT_VIEWER = { map: RT.map };
}

        for (const [wx, wz, wry] of [[C.x - 18, C.z + 132, 0], [C.x + 34, C.z + 132, 0], [208, -12, Math.PI / 2], [M.x - 4, M.z + 20, 0]])
          P.window(B, wx, B.h(wx, wz) + 1.5, wz, wry, 1.7, 1.4, {});

        /* dense instanced 3D forest — Ridgewood core, satellite woods, belts + heavy scatter */
        P.forest(B, {
          seed: 707,

            { x: F.x - 120, z: F.z - 140, r: 90, n: 260 },

  /* --- BR-only props --- */
  function watchtower(B, x, z) {
    const G = RT.G, gy = B.h(x, z);
    const g = [];
    for (const [sx, sz] of [[-1.2, -1.2], [1.2, -1.2], [-1.2, 1.2], [1.2, 1.2]])
      g.push(G.box(0.18, 7, 0.18, 0x5a4a38, { x: x + sx, y: gy + 3.5, z: z + sz, vary: 0.12 }));
    g.push(G.box(3.6, 0.22, 3.6, 0x6b5a42, { x, y: gy + 7, z, vary: 0.1 }));
    for (const s of [-1, 1]) {
      g.push(G.box(3.6, 0.8, 0.12, 0x5e4c38, { x, y: gy + 7.6, z: z + s * 1.74 }));
      g.push(G.box(0.12, 0.8, 3.6, 0x5e4c38, { x: x + s * 1.74, y: gy + 7.6, z }));
    }
    g.push(G.wedge(4.4, 1.4, 4.4, 0x53422f, { x, y: gy + 8.6, z }));
    for (let i = 0; i < 8; i++) g.push(G.box(0.5, 0.06, 0.06, 0x4a3c2c, { x: x + 1.35, y: gy + 0.6 + i * 0.85, z: z + 0.4 }));
    B.buckets.std.push(...g);
    B.collide(x, gy + 3.5, z, 2.6, 7, 2.6);
    B.platform(x - 1.7, z - 1.7, x + 1.7, z + 1.7, gy + 7.12);

  function gasStation(B, x, z) {

  function radioMast(B, x, z) {

  /* ---------------- golden hour → dusk atmosphere ---------------- */
  function goldenAtmo(t) { // t: 0 golden → 1 dusk

    return {
      top: mix(0x3d5a82, 0x151a2e), horizon: mix(0xe8a860, 0x54365a), ground: mix(0x54483a, 0x1a1820),
      sunDir: new THREE.Vector3(-0.72, lerp(0.24, 0.05, t), -0.42),
      sunColor: mix(0xffc070, 0xd06a4a), sunIntensity: lerp(1.9, 0.85, t),
      sunDiscColor: mix(0xffe0b0, 0xff9a70), sunGlow: lerp(0.4, 0.55, t),
      hemiSky: mix(0xc7a578, 0x3d4468), hemiGround: mix(0x4a4238, 0x1c1a22), hemiIntensity: lerp(0.52, 0.4, t),
      fogColor: mix(0xdba86e, 0x2c2438), fogDensity: lerp(0.0022, 0.0034, t),
      exposure: lerp(1.02, 0.94, t), fillIntensity: 0.12,

  /* ---------------- storm wall ---------------- */
  function buildStorm() {
    const tex = RT.canvasTex(256, (ctx, s) => {
      ctx.fillStyle = 'rgba(80,60,160,0.5)'; ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 60; i++) {
        ctx.strokeStyle = `rgba(${150 + Math.random() * 105 | 0},${120 + Math.random() * 80 | 0},255,${0.2 + Math.random() * 0.5})`;
        ctx.lineWidth = 1 + Math.random() * 2.5;
        const x = Math.random() * s;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (Math.random() - 0.5) * 40, s); ctx.stroke();
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(30, 1.2);
    const geo = new THREE.CylinderGeometry(1, 1, 260, 64, 1, true);
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, opacity: 0.5, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false, color: 0x7a5aff,
    });
    storm = new THREE.Mesh(geo, mat);
    storm.position.y = 100;
    storm.renderOrder = 8;
    RT.engine.scene.add(storm);
    /* next-circle ring: thin white torus laid flat */
    nextRing = new THREE.Mesh(new THREE.TorusGeometry(1, 0.002, 6, 96),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, fog: false, depthWrite: false }));
    nextRing.rotation.x = Math.PI / 2;
    nextRing.renderOrder = 7;
    RT.engine.scene.add(nextRing);
  }

  /* ---------------- circle phases ---------------- */
  const PHASES = [
    { wait: 42, shrink: 40, to: 480, dmg: 1 },
    { wait: 30, shrink: 34, to: 300, dmg: 2 },
    { wait: 26, shrink: 28, to: 180, dmg: 4 },
    { wait: 22, shrink: 24, to: 100, dmg: 7 },
    { wait: 18, shrink: 20, to: 45, dmg: 10 },
    { wait: 15, shrink: 24, to: 8, dmg: 14 },
  ];
  const circle = { cx: 0, cz: 0, r: 780, idx: 0, t: 0, shrinking: false, from: 780, tcx: 0, tcz: 0, tr: 480, fcx: 0, fcz: 0 };
  function rollNextCircle() {
    const ph = PHASES[circle.idx];
    circle.tr = ph.to;
    const maxOff = circle.r - ph.to;
    const a = Math.random() * TAU, rr = Math.random() * maxOff * 0.72;
    circle.tcx = clamp(circle.cx + Math.cos(a) * rr, -700 + ph.to, 700 - ph.to);
    circle.tcz = clamp(circle.cz + Math.sin(a) * rr, -700 + ph.to, 700 - ph.to);
  }
  function circleUpdate(dt) {
    circle.t -= dt;
    const ph = PHASES[circle.idx];
    if (!ph) return;
    if (!circle.shrinking && circle.t <= 0) {
      circle.shrinking = true;
      circle.t = ph.shrink;
      circle.from = circle.r; circle.fcx = circle.cx; circle.fcz = circle.cz;
      RT.ui.toast('STORM INCOMING', 'PHASE ' + (circle.idx + 1));
      if (RT.audio) RT.audio.thunder(0.2);
    } else if (circle.shrinking) {
      const k = 1 - clamp(circle.t / ph.shrink, 0, 1);
      circle.r = lerp(circle.from, circle.tr, k);
      circle.cx = lerp(circle.fcx, circle.tcx, k);
      circle.cz = lerp(circle.fcz, circle.tcz, k);
      if (circle.t <= 0) {
        circle.shrinking = false;
        circle.idx++;
        if (PHASES[circle.idx]) { circle.t = PHASES[circle.idx].wait; rollNextCircle(); RT.ui.toast('CIRCLE CLOSED', 'NEXT MARKED'); }
      }
    }
    /* visuals */
    storm.scale.set(circle.r, 1, circle.r);
    storm.position.x = circle.cx; storm.position.z = circle.cz;
    storm.material.map.offset.y -= dt * 0.25;
    storm.material.opacity = 0.42 + Math.sin(matchT * 2.2) * 0.08;
    nextRing.scale.set(circle.tr, circle.tr, 1);
    nextRing.position.set(circle.tcx, RT.map.terrain.heightAt(circle.tcx, circle.tcz) + 1.2, circle.tcz);
    /* player storm damage + fx */
    const p = RT.player.pos;
    const dToC = Math.hypot(p.x - circle.cx, p.z - circle.cz);
    const outside = dToC > circle.r;
    BR._stormT = (BR._stormT || 0) - dt;
    if (outside && phase !== 'fly' && phase !== 'drop' && phase !== 'chute' && !RT.player.dead) {
      if (BR._stormT <= 0) {
        BR._stormT = 1;
        RT.player.damage(ph.dmg, null);
        if (RT.audio) RT.audio.stormRumble(0.8);
      }
      RT.ui.pulseVignette(0.85);
    } else if (Math.abs(dToC - circle.r) < 22 && BR._stormT <= 0) {
      BR._stormT = 2.4;
      if (RT.audio) RT.audio.stormRumble(0.4);
    }
  }

  /* ---------------- loot ---------------- */
  const RARITY = [
    { name: 'Common', c: 0x9aa0a2, m: 0 }, { name: 'Uncommon', c: 0x5fbf5f, m: 1 },
    { name: 'Rare', c: 0x4a90e2, m: 2 }, { name: 'Epic', c: 0xa05ae8, m: 3 }, { name: 'Legendary', c: 0xe8a33d, m: 4 },
  ];
  function lootBeamMat(color) {
    return new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  }
  function spawnLoot(x, z, forceKind) {
    const rnd = Math.random();
    const y = RT.map.groundAt(x, z, 999);
    const kind = forceKind || (rnd < 0.42 ? 'weapon' : rnd < 0.58 ? 'ammo' : rnd < 0.72 ? 'armor' : rnd < 0.88 ? 'medkit' : 'grenade');
    const rarity = Math.random() < 0.06 ? 4 : Math.random() < 0.16 ? 3 : Math.random() < 0.36 ? 2 : Math.random() < 0.64 ? 1 : 0;
    const grp = new THREE.Group();
    let label = '';
    const weaponId = ['m4', 'dmr', 'shotgun', 'pistol'][(Math.random() * 4) | 0];
    if (kind === 'weapon') {
      const m = RT.character.buildNPCRifle();
      m.scale.setScalar(0.85);
      m.rotation.z = Math.PI / 2 * 0.9;
      grp.add(m);
      label = RARITY[rarity].name + ' ' + RT.weapons.CFG[weaponId].name;
    } else {
      const col = kind === 'ammo' ? 0x8a7a52 : kind === 'armor' ? 0x4a90e2 : kind === 'medkit' ? 0xc94b3f : 0x3a4433;
      const box = RT.meshOf([RT.G.cbox(0.34, 0.24, 0.24, 0.03, col, { vary: 0.1 })], RT.MAT.std);
      grp.add(box);
      label = kind === 'ammo' ? 'Ammo Box' : kind === 'armor' ? 'Armor Plate' : kind === 'medkit' ? 'Medkit' : 'Frag Grenade';
    }
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.14, 3.2, 6, 1, true), lootBeamMat(RARITY[kind === 'weapon' ? rarity : 1].c));
    beam.position.y = 1.7;
    grp.add(beam);
    grp.position.set(x, y + 0.25, z);
    RT.engine.world.add(grp);
    const item = { kind, weaponId, rarity, grp, x, z, y, taken: false };
    lootItems.push(item);
    RT.map.interact.push({
      x, y: y + 1, z, r: 2.3, label: 'TAKE ' + label.toUpperCase(),
      fn: (it) => { pickupLoot(item); it.used = true; },
    });
    return item;
  }
  function pickupLoot(item) {
    if (item.taken) return;
    item.taken = true;
    RT.engine.world.remove(item.grp);
    if (item.kind === 'weapon') {
      const m = RARITY[item.rarity].m;
      RT.weapons.addWeapon(item.weaponId, { dmg: 1 + 0.08 * m, kick: 1 - 0.06 * m, mag: 1 + 0.12 * m });
      RT.ui.toastMsg(RARITY[item.rarity].name.toUpperCase() + ' ' + RT.weapons.CFG[item.weaponId].name);
    } else if (item.kind === 'ammo') { RT.weapons.giveAmmo(0.45); RT.ui.toastMsg('AMMO'); }
    else if (item.kind === 'armor') { inv.armor = Math.min(100, inv.armor + 50); RT.ui.toastMsg('ARMOR PLATE EQUIPPED'); refreshArmorBar(); }
    else if (item.kind === 'medkit') { inv.medkits++; RT.ui.toastMsg('MEDKIT (H TO USE) × ' + inv.medkits); }
    else { RT.player.grenades = Math.min(6, RT.player.grenades + 2); RT.ui.toastMsg('GRENADES +2'); }
    if (RT.hud) RT.hud.refreshAmmo();
    if (RT.audio) RT.audio.magIn();
  }
  function scatterLoot() {
    for (const p of POIS) {
      const n = 10 + ((p.r / 20) | 0);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU, r = Math.random() * p.r * 0.8;
        spawnLoot(p.x + Math.cos(a) * r, p.z + Math.sin(a) * r);
      }
    }
    for (let i = 0; i < 26; i++) spawnLoot((Math.random() - 0.5) * 1200, (Math.random() - 0.5) * 1200);
  }
  function refreshArmorBar() {
    const el2 = RT.$('hp-armor');
    if (!el2) return;
    el2.style.display = inv.armor > 0 ? 'flex' : 'none';
    el2.innerHTML = `<div style="width:${inv.armor * 2.2}px;height:5px;background:#4a90e2;box-shadow:0 0 5px rgba(74,144,226,.7)"></div>`;
  }

  /* ---------------- bots (3 LOD tiers) ---------------- */
  function makeImposter() {
    const g = RT.mergeGeos([
      RT.G.box(0.42, 0.62, 0.24, 0x3e4139, { y: 1.15 }),
      RT.G.box(0.3, 0.72, 0.26, 0x383b33, { y: 0.42 }),
      RT.G.sph(0.11, 6, 5, 0x8a6a4e, { y: 1.62 }),
    ]);
    return new THREE.Mesh(g, RT.MAT.std);
  }
  function spawnBots() {
    bots = [];
    for (let i = 0; i < 49; i++) {
      const pers = ['rusher', 'looter', 'camper'][i % 3];
      const poi = POIS[(Math.random() * POIS.length) | 0];
      const a = Math.random() * TAU, r = Math.random() * poi.r * 0.7;
      const bot = {
        id: i, name: BOT_NAMES[i], dead: false, hp: 100,
        x: poi.x + Math.cos(a) * r, z: poi.z + Math.sin(a) * r, y: 0,
        skill: 0.35 + Math.random() * 0.6,        // aim quality
        pers, state: 'loot', lootT: 4 + Math.random() * 14, fireT: Math.random(),
        target: null, tier: 2, rig: null, imposter: null,
        moveA: Math.random() * TAU, aiT: Math.random() * 0.2, weapon: 'rifle',
      };
      bot.y = RT.map.groundAt(bot.x, bot.z, 999);
      bot.imposter = makeImposter();
      bot.imposter.position.set(bot.x, bot.y, bot.z);
      RT.engine.world.add(bot.imposter);
      bots.push(bot);
    }
    alive = 50;
  }
  function botRigAcquire(bot) {
    if (bot.rig) return;
    let slot = rigPool.find(s => !s.user);
    if (!slot && rigPool.length < 18) {
      slot = { rig: RT.character.build({ faction: 'enemy', seed: 7000 + rigPool.length, rifle: true }), user: null };
      slot.rig.group.visible = false;
      RT.engine.world.add(slot.rig.group);
      rigPool.push(slot);
    }
    if (!slot) return;
    slot.user = bot;
    bot.rig = slot;
    slot.rig.group.visible = true;
  }
  function botRigRelease(bot) {
    if (!bot.rig) return;

  let fullAiCursor = 0;
  function botsUpdate(dt) {
    const p = RT.player.pos;
    /* tier assignment + far encounters */
    let fullBudget = 12;
    for (const b of bots) {
      if (b.dead) continue;
      const d = Math.hypot(b.x - p.x, b.z - p.z);
      b.tier = d < 100 ? 0 : d < 230 ? 1 : 2;
      if (b.tier === 0 && !b.rig) botRigAcquire(b);
      if (b.tier > 0 && b.rig && d > 120) botRigRelease(b);

      }
      if (b.rig) {

        r.group.position.set(b.x, b.y, b.z);
        r.group.rotation.y = b.faceA != null ? b.faceA : b.moveA;
        RT.character.pose(r, dt);

    }
    /* staggered AI */
    const n = bots.length;
    for (let i = 0; i < n; i++) {
      const b = bots[(fullAiCursor + i) % n];
      if (b.dead) continue;
      if (b.tier === 0) {
        if (fullBudget-- <= 0) continue;
        botThink(b, dt, true);
      } else if (b.tier === 1) {
        b.aiT -= dt;
        if (b.aiT <= 0) { botThink(b, 0.2, false); b.aiT = 0.2; }
      } else {
        b.aiT -= dt;
        if (b.aiT <= 0) { botFar(b, 0.6); b.aiT = 0.6; }
      }
    }
    fullAiCursor = (fullAiCursor + 1) % n;
    /* abstract far-vs-far encounters keep the count shrinking */
    encounterT -= dt;
    if (encounterT <= 0) {
      encounterT = 5 + Math.random() * 4;
      const far = bots.filter(b => !b.dead && b.tier === 2);
      for (let i = 0; i + 1 < far.length; i += 2) {
        const a = far[i], c = far[i + 1];
        if (Math.hypot(a.x - c.x, a.z - c.z) < 70 && Math.random() < 0.5) {
          const winner = a.skill > c.skill === (Math.random() < 0.75) ? a : c;
          const loser = winner === a ? c : a;

  }
  function botMove(b, tx, tz, speed, dt) {
    const dx = tx - b.x, dz = tz - b.z;
    const d = Math.hypot(dx, dz);
    if (d < 1.5) return true;
    let mx = dx / d, mz = dz / d;
    const probe = RT.map.raycast(b.x, b.y + 1, b.z, mx, 0, mz, 1.6);
    if (probe) { const nn = probe.normal; const side = ((mx * -nn.z) + (mz * nn.x)) >= 0 ? 1 : -1; mx = -nn.z * side; mz = nn.x * side; }
    b.x += mx * speed * dt; b.z += mz * speed * dt;
    b.y = damp(b.y, RT.map.groundAt(b.x, b.z, b.y + 0.6), 14, dt);
    b.moveA = Math.atan2(mx, mz);
    if (b.rig) b.rig.rig.anim.mode = speed > 3.6 ? 'run' : 'walk';
    return false;
  }
  function botThink(b, dt, full) {
    if (BR._testFreeze) return;
    const p = RT.player.pos;
    const distP = Math.hypot(b.x - p.x, b.z - p.z);
    /* out of circle? rotate in */
    const dC = Math.hypot(b.x - circle.cx, b.z - circle.cz);
    if (dC > circle.r * 0.92) {
      b.state = 'rotate';
    }
    /* target: player if close + LOS occasionally checked; other bots nearby */
    const engageR = b.pers === 'rusher' ? 66 : b.pers === 'camper' ? 44 : 55;
    if (!RT.player.dead && distP < engageR && phase !== 'fly' && phase !== 'drop' && phase !== 'chute') {
      b.losT = (b.losT || 0) - dt;
      if (b.losT <= 0) {
        b.losT = 0.4;
        const dy = RT.player.eyeY() - (b.y + 1.5);
        const d3 = Math.hypot(distP, dy);
        b.canSeeP = !RT.map.raycast(b.x, b.y + 1.5, b.z, (p.x - b.x) / d3, dy / d3, (p.z - b.z) / d3, d3 - 0.6);
      }
      if (b.canSeeP) { if (b.state !== 'fight') b.acqT = 0; b.state = 'fight'; }
      else if (b.state === 'fight') b.state = 'rotate';
    } else if (b.state === 'fight') b.state = 'rotate';

    if (b.state === 'fight') {
      b.acqT = (b.acqT || 0) + dt;      // time on target — drives the reaction/settle model
      b.faceA = Math.atan2(p.x - b.x, p.z - b.z);
      if (b.rig) { b.rig.rig.anim.mode = 'aim'; b.rig.rig.anim.aimPitch = clamp(Math.atan2(RT.player.eyeY() - (b.y + 1.5), distP), -0.5, 0.5); }
      /* strafe by personality */
      if (b.pers !== 'camper') {
        const strafe = Math.sin(matchT * 1.7 + b.id) * (b.pers === 'rusher' ? 1 : 0.5);
        botMove(b, b.x + Math.cos(b.faceA) * strafe * 2, b.z - Math.sin(b.faceA) * strafe * 2, 2.4, dt);
        if (b.pers === 'rusher' && distP > 18) botMove(b, p.x, p.z, 3.4, dt);
      }
      b.fireT -= dt;
      if (b.fireT <= 0 && b.acqT > 0.32) {                  // brief reaction before the first shot
        b.fireT = 0.5 + Math.random() * 0.6 * (1 - b.skill * 0.35);
        botShoot(b, distP);
      }
    } else if (b.state === 'rotate') {
      const arrived = botMove(b, circle.tcx + Math.cos(b.id) * circle.tr * 0.5, circle.tcz + Math.sin(b.id * 2.3) * circle.tr * 0.5, 4.6, dt);
      if (arrived) b.state = 'loot';
    } else { /* loot: wander current POI, sometimes pause */
      b.lootT -= dt;
      if (b.lootT <= 0) {
        b.lootT = 5 + Math.random() * 12;

        b.moveTz = b.z + (Math.random() - 0.5) * 60;

      } else if (b.rig) b.rig.rig.anim.mode = 'idle';
    }
  }
  function botFar(b, dt) {
    if (BR._testFreeze) return;
    /* abstract: drift toward the circle */
    const dC = Math.hypot(b.x - circle.cx, b.z - circle.cz);
    if (dC > circle.r * 0.8) {
      const sp = 5 * dt;
      b.x += (circle.cx - b.x) / dC * sp * 8;
      b.z += (circle.cz - b.z) / dC * sp * 8;

  function botShoot(b, distP) {
    /* muzzle + tracer + hit roll against the player */
    const from = new THREE.Vector3(b.x, b.y + 1.5, b.z);
    if (RT.audio) RT.audio.enemyShot(distP);
    let err = 0.055 + (1 - b.skill) * 0.12 + distP * 0.0016;       // humans miss — wider cone
    if ((b.acqT || 0) < 0.8) err += (0.8 - b.acqT) * 0.22;         // first shots after acquiring go wild (reaction)
    if (PHASES.length - circle.idx <= 1) err *= 0.82;              // only the very last circle sharpens, mildly
    err *= 1 + RT.player.speedF * 1.7;                             // a moving target is much harder to hit
    const py = RT.player.eyeY() - 0.25;
    const dir = new THREE.Vector3(RT.player.pos.x - b.x, py - from.y, RT.player.pos.z - b.z).normalize();
    dir.x += (Math.random() - 0.5) * 2 * err;
    dir.y += (Math.random() - 0.5) * 2 * err * 0.8;
    dir.z += (Math.random() - 0.5) * 2 * err;
    dir.normalize();
    const wall = RT.map.raycast(from.x, from.y, from.z, dir.x, dir.y, dir.z, distP + 10);
    const rel = new THREE.Vector3(RT.player.pos.x - from.x, py + 0.1 - from.y, RT.player.pos.z - from.z);
    const tA = rel.dot(dir);
    RT.engine.tracer(from, dir, Math.min(wall ? wall.dist : 200, 200), 300);
    if (tA > 0 && (!wall || wall.dist > tA)) {
      const cx = from.x + dir.x * tA - RT.player.pos.x;
      const cy = from.y + dir.y * tA - (RT.player.pos.y + 0.9);
      const cz = from.z + dir.z * tA - RT.player.pos.z;
      const miss = Math.hypot(cx, cy * 0.55, cz);
      if (miss < 0.42) {
        let dmg = 6 + Math.random() * 6;
        if (inv.armor > 0) { const absorbed = Math.min(inv.armor, dmg * 0.65); inv.armor -= absorbed; dmg -= absorbed; refreshArmorBar(); }
        RT.player.damage(dmg, from);

        else killer = b;
      } else if (miss < 1.6 && RT.audio) RT.audio.crack();
    }
  }

  /* ---------------- vehicles ---------------- */
  function buildCar(x, z, col) {
    const gy = RT.map.groundAt(x, z, 999);
    const g = [
      RT.G.cbox(1.75, 0.5, 4.0, 0.08, col, { y: 0.65, vary: 0.06 }),
      RT.G.cbox(1.6, 0.5, 2.0, 0.1, adjc2(col, 0.8), { y: 1.15, z: -0.2 }),
      RT.G.box(1.5, 0.06, 0.7, 0x222831, { y: 1.2, z: 0.9, rx: 0.5 }),
    ];
    for (const [sx, sz] of [[-0.8, 1.35], [0.8, 1.35], [-0.8, -1.4], [0.8, -1.4]])
      g.push(RT.G.torus(0.3, 0.12, 6, 12, 0x1d1c1a, { x: sx, y: 0.32, z: sz, ry: Math.PI / 2 }));
    const mesh = RT.meshOf(g, RT.MAT.std);
    mesh.position.set(x, gy, z);
    RT.engine.world.add(mesh);
    const head = new THREE.PointLight(0xffd9a0, 0, 18, 2);
    head.position.set(0, 1, 2.4);
    mesh.add(head);
    const car = { mesh, x, z, y: gy, yaw: 0, speed: 0, hp: 100, burning: 0, dead: false, head };
    vehicles.push(car);
    RT.map.interact.push({
      getPos: () => ({ x: car.x, y: car.y + 1, z: car.z }), r: 2.8, label: 'DRIVE',
      fn: () => { if (!car.dead && phase === 'play') enterCar(car); },
    });
    return car;
  }
  function adjc2(hex, m) { const c = new THREE.Color(hex); c.multiplyScalar(m); return c.getHex(); }
  function enterCar(car) {
    curVehicle = car;
    phase = 'drive';
    RT.game.state = 'br';
    RT.weapons.setVisible(false);
    if (RT.audio) RT.audio.engineStart();
    RT.ui.toastMsg('E TO EXIT · ' + (RT.input.keyboardMode() ? 'ARROWS' : 'WASD') + ' TO DRIVE');
  }
  function exitCar() {
    if (RT.audio) RT.audio.engineStop();
    RT.player.pos.set(curVehicle.x + Math.cos(curVehicle.yaw) * 2.2, curVehicle.y + 0.1, curVehicle.z - Math.sin(curVehicle.yaw) * 2.2);

  function vehicleUpdate(dt) {
    for (const car of vehicles) {
      if (car.burning > 0 && !car.dead) {
        car.burning -= dt;
        RT.engine.particle(car.x, car.y + 1.4, car.z, (Math.random() - .5), 2.5, (Math.random() - .5),
          { color: 0x2b2926, size: 0.7, life: 1.6, grav: 0.6, drag: 1, grow: -0.3, alpha: 0.6 });
        if (car.burning <= 0) {
          car.dead = true;
          RT.fxExplosion(new THREE.Vector3(car.x, car.y + 1, car.z), 7);
          if (curVehicle === car) { RT.player.damage(70, null); exitCar(); }
          RT.tintGeo(car.mesh.geometry, 0x2e2a26);
        }
      }
      car.head.intensity = BR.duskK > 0.5 && !car.dead ? 1.4 : 0;
    }
    if (!curVehicle) return;
    const car = curVehicle;
    const I = RT.input;
    const kb = I.keyboardMode();
    const fwd = (kb ? I.keys.ArrowUp : I.keys.KeyW) ? 1 : (kb ? I.keys.ArrowDown : I.keys.KeyS) ? -0.5 : 0;
    const steer = ((kb ? I.keys.ArrowLeft : I.keys.KeyA) ? 1 : 0) - ((kb ? I.keys.ArrowRight : I.keys.KeyD) ? 1 : 0);
    car.speed = clamp(car.speed + fwd * 13 * dt - Math.sign(car.speed) * 4.5 * dt, -8, 23);
    car.yaw += steer * clamp(Math.abs(car.speed) / 12, 0, 1.4) * 1.5 * dt * Math.sign(car.speed || 1);
    const nx = car.x + Math.sin(car.yaw) * car.speed * dt;
    const nz = car.z + Math.cos(car.yaw) * car.speed * dt;
    const hit = RT.map.raycast(car.x, car.y + 0.8, car.z, Math.sin(car.yaw) * Math.sign(car.speed || 1), 0, Math.cos(car.yaw) * Math.sign(car.speed || 1), 2.4);
    if (hit && Math.abs(car.speed) > 3) {
      car.hp -= Math.abs(car.speed) * 2.2;
      RT.engine.shake(0.3);
      car.speed = -car.speed * 0.25;
      if (car.hp <= 0 && car.burning <= 0) car.burning = 3;
    } else if (!hit || Math.abs(car.speed) <= 3) {
      car.x = nx; car.z = nz;
    }
    car.y = damp(car.y, RT.map.terrain.heightAt(car.x, car.z), 12, dt);
    car.mesh.position.set(car.x, car.y, car.z);
    car.mesh.rotation.y = car.yaw;
    if (RT.audio) RT.audio.engineRPM(clamp(Math.abs(car.speed) / 23, 0, 1));
    /* camera chase */
    const cam = RT.engine.camera;
    const cx = car.x - Math.sin(car.yaw) * 7.5, cz = car.z - Math.cos(car.yaw) * 7.5;
    cam.position.set(damp(cam.position.x, cx, 6, dt), car.y + 3.4, damp(cam.position.z, cz, 6, dt));
    cam.lookAt(car.x + Math.sin(car.yaw) * 6, car.y + 1.2, car.z + Math.cos(car.yaw) * 6);
    RT.engine.updateSun(cam.position);
    RT.player.pos.set(car.x, car.y, car.z);   // player rides along (storm damage etc.)
    if (I.pressed('KeyE')) exitCar();
  }

  function buildBrHud() {

  function drawMinimap() {
    if (!minimap || minimap.style.display === 'none') return;
    const c = minimap.getContext('2d');
    c.clearRect(0, 0, 200, 200);
    const W2P = v => (v / 1600 + 0.5) * 200;
    c.fillStyle = 'rgba(60,70,45,.5)'; c.fillRect(0, 0, 200, 200);
    c.font = '7px Segoe UI'; c.fillStyle = '#d8d4c8'; c.textAlign = 'center';
    for (const p of POIS) {
      c.fillStyle = 'rgba(232,163,61,.25)';
      c.beginPath(); c.arc(W2P(p.x), W2P(p.z), p.r / 8, 0, TAU); c.fill();
      c.fillStyle = '#e8e4da';
      c.fillText(p.name, W2P(p.x), W2P(p.z) - p.r / 8 - 2);
    }
    /* circles */
    c.strokeStyle = 'rgba(150,110,255,.9)'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(W2P(circle.cx), W2P(circle.cz), circle.r / 8, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1;
    c.beginPath(); c.arc(W2P(circle.tcx), W2P(circle.tcz), circle.tr / 8, 0, TAU); c.stroke();
    /* plane or player */
    if (phase === 'fly') {
      const pp = planePos(planeT);
      c.fillStyle = '#fff';
      c.save(); c.translate(W2P(pp.x), W2P(pp.z)); c.rotate(Math.atan2(planeDir.x, -planeDir.z));
      c.beginPath(); c.moveTo(0, -5); c.lineTo(3.5, 4); c.lineTo(-3.5, 4); c.fill(); c.restore();
    } else {
      c.fillStyle = '#7fe08a';
      c.beginPath(); c.arc(W2P(RT.player.pos.x), W2P(RT.player.pos.z), 2.6, 0, TAU); c.fill();
    }
  }
