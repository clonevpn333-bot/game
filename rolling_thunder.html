    } else if (raiseK < 1) raiseK = Math.min(1, raiseK + dt / 0.2);  // fast raise (≤380ms total)

    /* ADS: ≤140ms in, ≤110ms out, ease-out both ways + FOV punch at alignment */
    const wantAds = I.aim && !opts.sprinting && reloadT < 0 && !switchTo && raiseK > 0.9;
    const adsPrevT = adsT;
    adsT = clamp(adsT + (wantAds ? dt / 0.14 : -dt / 0.11), 0, 1);
    adsK = wantAds || adsT > adsPrevT ? easeOutCubic(adsT) : 1 - easeOutCubic(1 - adsT);
    if (adsPrevT < 1 && adsT >= 1) fovPunch = 2;                     // 1-frame punch as sights align
    fovPunch = damp(fovPunch, 0, 28, dt);
    const baseFov = RT.settings.fov;
    const moveFov = (RT.player && RT.player.fovBoost || 0) * (1 - adsK);   // tac-sprint / slide widen
    RT.engine.camera.fov = lerp(baseFov, cfg.adsFov, adsK) - fovPunch + moveFov;
    RT.engine.camera.updateProjectionMatrix();
    if (cfg.scope && RT.$('scope')) RT.$('scope').style.opacity = adsK > 0.82 ? 1 : 0;
    else if (RT.$('scope')) RT.$('scope').style.opacity = 0;

    /* cooldowns */
    cooldown -= dt;
    if (pumpT >= 0) {
      pumpT += dt;
      const k = pumpT / cfg.pumpT;
      if (k >= 1) pumpT = -1;
      else {
        const s = k < 0.4 ? smoothstep(0, 0.4, k) : 1 - smoothstep(0.5, 1, k);
        cur.parts.action.position.z = s * 0.09;
        if (k > 0.38 && k < 0.44 && !cur._pumpEject) { cur._pumpEject = true; ejectShell(true); }
        if (k > 0.5) cur._pumpEject = false;
      }
    }
    if (boltT >= 0) {
      boltT += dt;
      const k = boltT / cfg.boltT;
      if (k >= 1) { boltT = -1; cur.parts.action.position.z = 0; cur.parts.action.rotation.z = 0; }
      else {
        // lift, pull, push, drop
        const lift = smoothstep(0, 0.2, k) - smoothstep(0.75, 0.95, k);
        const pull = smoothstep(0.2, 0.45, k) - smoothstep(0.5, 0.75, k);
        cur.parts.action.rotation.z = -lift * 0.9;
        cur.parts.action.position.z = pull * 0.07;
        if (k > 0.45 && k < 0.52 && !cur._boltEject) { cur._boltEject = true; ejectShell(false); }
        if (k > 0.6) cur._boltEject = false;
      }
    }
    /* pistol slide */
    if (cfg.slide) {
      const targetSlide = (am.mag === 0 && reloadT < 0) ? 0.028 : slideBack;
      cur.parts.action.position.z = damp(cur.parts.action.position.z, targetSlide, 40, dt);
      slideBack = Math.max(0, slideBack - dt * 0.45);
    }

    /* fire */
    const canFire = cooldown <= 0 && reloadT < 0 && !switchTo && raiseK > 0.85 && pumpT < 0 && boltT < 0 && !opts.sprinting && !opts.dead;
    let firing = false;
    if (cfg.auto) firing = I.fire;
    else { firing = I.fire && !semiLatch; }
    semiLatch = I.fire;
    if (firing && canFire) {
      if (am.mag > 0) fireOnce(opts);
      else if (!cfg.auto) { RT.audio && RT.audio.dryClick(); cooldown = 0.25; if (am.res > 0) startReload(); }
      else { RT.audio && RT.audio.dryClick(); cooldown = 0.3; if (am.res > 0) startReload(); }
    }
    if (I.pressed('KeyR') && reloadT < 0 && am.mag < cfg.mag && am.res > 0 && !switchTo) startReload();

    /* reload animation */
    if (reloadT >= 0) updateReload(dt);

    /* flash lifetime */
    if (flashT > 0) {
      flashT -= dt;
      if (flashT <= 0) cur.flash.visible = false;
      else { cur.flash.rotation.z += 2.4; cur.flash.scale.setScalar(0.8 + Math.random() * 0.5); }
    }

    /* viewmodel motion: breathe + sway + bob + recoil + ads blend */
    const t = RT.engine.time;
    const speedF = opts.speedF || 0;
    bobT += dt * (4 + speedF * 6) * Math.min(1, speedF * 2);
    const breathe = Math.sin(t * 1.7) * 0.0016 * (1 - adsK * 0.85);
    const [mdx, mdy] = [opts.lookVelX || 0, opts.lookVelY || 0];
    const swayX = clamp(-mdx * 0.012, -0.02, 0.02) * (1 - adsK * 0.9);
    const swayY = clamp(mdy * 0.01, -0.018, 0.018) * (1 - adsK * 0.9);
    const bobX = Math.sin(bobT) * 0.009 * speedF * (1 - adsK * 0.9);
    const bobY = -Math.abs(Math.cos(bobT)) * 0.011 * speedF * (1 - adsK * 0.85);
    vmZ = Math.min(0, damp(vmZ, 0, 10, dt));   // kick instant, recovery exponential

    const hip = cfg.hip;
    const sight = cur.parts.sight;
    const adsPos = [-sight.x, -sight.y, cfg.adsZ];
    const k2 = adsK * adsK * (3 - 2 * adsK);
    const px = lerp(hip[0], adsPos[0], k2) + swayX + bobX + breathe * 0.4;
    const py = lerp(hip[1], adsPos[1], k2) + swayY + bobY + breathe;
    const pz = lerp(hip[2], adsPos[2], k2) + vmZ;
    /* sprint + raise/lower pose */
    const lowerK = 1 - easeOutCubic(raiseK);
    /* raise overshoot: 3° tilt bump that settles as the weapon arrives */
    const overTilt = (!switchTo && raiseK > 0.72 && raiseK < 1) ? Math.sin((raiseK - 0.72) / 0.28 * Math.PI) * 0.052 : 0;
    const sprintK = damp(cur._sprintK || 0, opts.sprinting ? 1 : 0, opts.sprinting ? 15 : 7.5, dt); // snap in, settle out
    cur._sprintK = sprintK;
    const rl = cur._reloadPose || { rx: 0, rz: 0, y: 0 };
    cur.root.position.set(px + sprintK * -0.06, py - lowerK * 0.45 - sprintK * 0.07 + rl.y, pz + sprintK * 0.06);
    cur.root.rotation.set(
      -vmZ * 2.2 + lowerK * 0.9 + sprintK * 0.55 + swayY * 1.4 + rl.rx,
      swayX * 1.6 + sprintK * 0.4,
      sprintK * 0.25 + swayX * 0.8 + rl.rz + overTilt);
    /* weapon inspect (hold I): raise + turn the weapon to examine it */
    const wantInspect = I.keys.KeyI && reloadT < 0 && !switchTo && raiseK > 0.9 && !opts.sprinting && adsK < 0.1 && !I.fire && pumpT < 0 && boltT < 0;
    inspectK = damp(inspectK, wantInspect ? 1 : 0, wantInspect ? 6 : 11, dt);
    inspectT = inspectK > 0.003 ? inspectT + dt : 0;
    if (inspectK > 0.003) {
      const wob = Math.sin(inspectT * 1.7), wob2 = Math.sin(inspectT * 1.1 + 1);
      cur.root.position.x += inspectK * (0.06 + wob2 * 0.012);
      cur.root.position.y += inspectK * 0.05;
      cur.root.position.z += inspectK * 0.06;
      cur.root.rotation.x += inspectK * (-0.32 + wob * 0.06);
      cur.root.rotation.y += inspectK * (0.95 + wob2 * 0.12);
      cur.root.rotation.z += inspectK * 0.42;
    }
    RT.hud && RT.hud.setCrosshairSpread(currentSpread(opts) * 900, adsK);
  };

  function currentSpread(opts) {
    const cfg = cur.cfg;
    let s = lerp(cfg.spreadHip, cfg.spreadAds, adsK);
    s *= 1 + (opts && opts.speedF || 0) * 1.6;
    return s;
  }
  W.currentSpread = currentSpread;

  const _dir = new THREE.Vector3(), _org = new THREE.Vector3(), _tmp = new THREE.Vector3();
  function fireOnce(opts) {
    const cfg = cur.cfg, am = ammo[curId];
    const mods = W.modFor(curId);
    am.mag--;
    cooldown = 60 / cfg.rpm;
    /* recoil */
    recP += cfg.kick * mods.kick * (0.85 + Math.random() * 0.3);
    recY += cfg.kickYaw * (Math.random() - 0.42);
    vmZ -= cfg.vmKick;
    RT.engine.shake(cfg.pellets ? 0.16 : 0.07);
    /* flash + light */
    cur.flash.visible = true; flashT = 0.045;
    cur.flash.rotation.z = Math.random() * TAU;
    const mw = _tmp.set(0, 0.02, cur.parts.muzzleZ);
    cur.root.localToWorld(mw);
    RT.engine.flash(mw, 0xffb050, cfg.pellets ? 3.4 : 2.2, 13, 0.06);
    /* shots */
    const cam = RT.engine.camera;
    cam.getWorldDirection(_dir);
    _org.setFromMatrixPosition(cam.matrixWorld);
    const n = cfg.pellets || 1;
    const spread = currentSpread(opts);
    for (let i = 0; i < n; i++) {
      const d = _dir.clone();
      d.x += (Math.random() - 0.5) * 2 * spread;
      d.y += (Math.random() - 0.5) * 2 * spread;
      d.z += (Math.random() - 0.5) * 2 * spread * 0.4;
      d.normalize();
      if (RT.combat) RT.combat.playerShot(_org, d, cfg, mw);
    }
    if (RT.audio) RT.audio.gunshot(cfg.sound);
    /* action cycling */
    if (cfg.pump) { pumpT = 0.12; cur._pumpEject = false; }
    else if (cfg.bolt) { if (am.mag > 0) { boltT = 0.1; cur._boltEject = false; } else ejectShell(false); }
    else if (cfg.slide) { slideBack = 0.026; ejectShell(false); }
    else ejectShell(false);
    if (am.mag === 0 && am.res > 0 && cfg.auto) setTimeout(() => { if (reloadT < 0 && ammo[curId].mag === 0) startReload(); }, 350);
  }

  /* ---------- shell casings (pooled meshes with physics) ---------- */
  const shells = [];
  function getShellPool() {
    if (shells.length) return;
    const brassG = RT.mergeGeos([G.cyl(0.005, 0.0055, 0.028, 6, 0xc9a552, {})]);
    const redG = RT.mergeGeos([G.cyl(0.0095, 0.0095, 0.05, 6, 0x9e2f24, {}), G.cyl(0.0098, 0.0098, 0.014, 6, 0xb99b52, { y: -0.02 })]);
    for (let i = 0; i < 22; i++) {
      const m = new THREE.Mesh(i % 4 === 3 ? redG : brassG, RT.MAT.gun);
      m.visible = false;
      RT.engine.scene.add(m);
      shells.push({ m, red: i % 4 === 3, life: 0, v: new THREE.Vector3(), w: new THREE.Vector3() });
    }
  }
  function ejectShell(isShotgun) {
    getShellPool();
    let s = shells.find(x => !x.m.visible && (!!x.red === !!isShotgun));
    if (!s) s = shells.find(x => !x.m.visible);
    if (!s) return;
    const ep = _tmp.copy(cur.parts.ejectPos);
    cur.root.localToWorld(ep);
    s.m.visible = true; s.life = 3;
    s.m.position.copy(ep);
    const cam = RT.engine.camera;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion);
    const up = new THREE.Vector3(0, 1, 0);
    s.v.copy(right).multiplyScalar(1.2 + Math.random() * 0.8).addScaledVector(up, 1.6 + Math.random()).addScaledVector(new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 2), -0.3);
    s.w.set(Math.random() * 20 - 10, Math.random() * 20 - 10, Math.random() * 20 - 10);
    s.m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  }
  W.updateShells = function (dt) {
    for (const s of shells) {
      if (!s.m.visible) continue;
      s.life -= dt;
      if (s.life <= 0) { s.m.visible = false; continue; }
      s.v.y -= 9.8 * dt;
      s.m.position.addScaledVector(s.v, dt);
      s.m.rotation.x += s.w.x * dt; s.m.rotation.z += s.w.z * dt;
      const gy = (RT.map && RT.map.heightAt ? RT.map.heightAt(s.m.position.x, s.m.position.z) : 0) + 0.012;
      if (s.m.position.y < gy) {
        s.m.position.y = gy;
        if (Math.abs(s.v.y) > 0.4) { s.v.y = -s.v.y * 0.32; s.v.x *= 0.6; s.v.z *= 0.6; if (RT.audio) RT.audio.shellTink(); }
        else { s.v.set(0, 0, 0); s.w.set(0, 0, 0); s.m.rotation.x = Math.PI / 2; }
      }
    }
  };

  /* ---------- reload ---------- */
  function startReload() {
    const cfg = cur.cfg, am = ammo[curId];
    if (am.res <= 0 || am.mag >= cfg.mag) return;
    if (cfg.pump) {
      shellsToLoad = Math.min(cfg.mag - am.mag, am.res);
      reloadT = 0; reloadStage = 0;
    } else {
      reloadT = 0;
      cur._magDropped = false; cur._magBack = false; cur._rack = false;
    }
    if (RT.audio) RT.audio.reloadStart();
  }
  W.startReload = startReload;

  /* keyframed reloads: fast reaches, brief holds, snappy insertions,
   * finger open/close states, weapon tilt + slap jolts */
  const s01 = (k, a, b) => clamp((k - a) / (b - a), 0, 1);
  const eo = easeOutCubic;
  function setOpenL(v) { if (cur.armL.userData.setOpen) cur.armL.userData.setOpen(v); }
  function armLTo(hx, hy, hz, k) {
    cur.armL.position.set(
      lerp(cur.armL.position.x, hx, k), lerp(cur.armL.position.y, hy, k), lerp(cur.armL.position.z, hz, k));
  }

  function updateReload(dt) {
    const cfg = cur.cfg, am = ammo[curId];
    const H = cur.armLHome;
    if (cfg.pump) { /* ------- shotgun: shell-by-shell, interruptible ------- */
      /* fire cuts the reload short with what's loaded */
      if (RT.input.fire && am.mag > 0) {
        reloadT = -1; cur._reloadPose = null; setOpenL(false);
        cur.armL.position.copy(H);
        return;
      }
      reloadT += dt;
      const per = cfg.reloadShell;
      const k = (reloadT % per) / per;
      const tl = eo(Math.min(1, reloadT * 4));
      cur._reloadPose = { rx: tl * 0.1, rz: tl * 0.52, y: -tl * 0.028 };   // ~30° port-visible tilt
      /* shuttle: reach down fast (open) → align → push-click (closed, nudge) */
      const portY = H.y - 0.02, portZ = H.z + 0.17;
      if (k < 0.42) {            // reach down-back fast, hand opens
        const r = eo(s01(k, 0, 0.42));
        cur.armL.position.set(H.x - 0.02, lerp(portY, portY - 0.15, 1 - r * 0 + (1 - r)), lerp(portZ, portZ + 0.1, 1 - r));
        cur.armL.position.y = portY - 0.15 * (1 - r);
        setOpenL(k > 0.06 && k < 0.3);
      } else if (k < 0.62) {     // align at port (brief)
        cur.armL.position.set(H.x - 0.02 + (k - 0.42) * 0.02, portY, portZ);
        setOpenL(false);
      } else {                   // push-click
        cur.armL.position.set(H.x - 0.02, portY + 0.008, portZ - 0.02);
      }
      if (k > 0.64 && !cur._shellFed) {
        cur._shellFed = true;
        am.mag++; am.res--; shellsToLoad--;
        cur._reloadPose.y += 0.01;                                   // insert nudge
        if (RT.audio) RT.audio.shellLoad();
      }
      if (k < 0.5) cur._shellFed = false;
      if (shellsToLoad <= 0 || am.res <= 0 || am.mag >= cfg.mag) {
        reloadT = -1;
        cur._reloadPose = null;
        setOpenL(false);
        cur.armL.position.copy(H);
        if (pumpT < 0 && !cur._chambered) { pumpT = 0; }
      }
      return;
    }

    reloadT += dt;
    const T = cfg.reloadT, k = reloadT / T;
    const mag = cur.parts.mag;
    if (k >= 1) {
      reloadT = -1;
      const take = Math.min(cfg.mag - am.mag, am.res);
      am.mag += take; am.res -= take;
      if (mag) { mag.position.copy(cur.parts.magHome); mag.visible = true; }
      cur.armL.position.copy(H);
      setOpenL(false);
      cur._reloadPose = null;
      return;
    }

    if (cfg.slide) { /* ------- pistol: tilt, palm-heel insert, slide pinch ------- */
      const tl = eo(s01(k, 0, 0.1)) * (1 - smoothstep(0.88, 1, k));
      let jolt = 0;
      if (k > 0.5 && k < 0.56) jolt = 0.012 * Math.exp(-(k - 0.5) * 60);         // palm-heel bump
      cur._reloadPose = { rx: tl * 0.1, rz: -tl * 0.4, y: -tl * 0.02 + jolt };   // one-handed tilt inward
      if (k < 0.08) { armLTo(H.x, H.y - 0.05, H.z, eo(s01(k, 0, 0.08))); }
      else if (k < 0.3) {                                    // hand darts off with old mag out
        if (!cur._magDropped) { cur._magDropped = true; if (mag) spawnFallingMag(mag); if (mag) mag.visible = false; if (RT.audio) RT.audio.magOut(); }
        setOpenL(true);
        armLTo(H.x - 0.06, H.y - 0.22, H.z + 0.1, eo(s01(k, 0.08, 0.3)));
      } else if (k < 0.5) {                                  // return with mag, close on contact
        if (mag) { mag.visible = true; mag.position.copy(cur.parts.magHome); mag.position.y -= (1 - eo(s01(k, 0.3, 0.5))) * 0.16; }
        if (k > 0.44) setOpenL(false);
        armLTo(H.x, H.y - 0.03, H.z + 0.02, eo(s01(k, 0.3, 0.5)));
      } else if (k < 0.56) {                                 // slap
        if (!cur._magBack) { cur._magBack = true; if (RT.audio) RT.audio.magIn(); }
      } else if (k < 0.84) {                                 // pinch the slide, rack it
        const p = eo(s01(k, 0.56, 0.68));
        armLTo(H.x + 0.02, H.y + 0.1, H.z + 0.05, p);        // hand up to the slide
        if (k > 0.68 && k < 0.76) cur.parts.action.position.z = 0.028 * eo(s01(k, 0.68, 0.74));
        else if (k >= 0.76) {
          if (!cur._rack) { cur._rack = true; if (RT.audio) RT.audio.boltRack(); }
          cur.parts.action.position.z = Math.max(0, cur.parts.action.position.z - dt * 1.4); // slide snaps home
        }
      } else {                                               // settle back with overshoot
        const p = s01(k, 0.84, 1);
        const os = 1 + 0.05 * Math.sin(Math.min(1, p * 1.4) * Math.PI);
        cur.armL.position.set(H.x * os, lerp(cur.armL.position.y, H.y, eo(p)) * 1, H.z);
        armLTo(H.x, H.y, H.z, eo(p));
      }
      return;
    }

    /* ------- AR / DMR: dart → drop mag → off-screen → arc back → SLAP → bolt flick → settle ------- */
    const droop = eo(s01(k, 0.02, 0.14)) * (1 - smoothstep(0.86, 0.97, k));
    let tiltZ = droop * 0.32, tiltX = droop * 0.11, dy2 = -droop * 0.022;
    let jolt = 0;
    if (k > 0.72 && k < 0.78) jolt = 0.014 * Math.exp(-(k - 0.72) * 55);          // mag SLAP jolt
    /* bolt-flick window: weapon tilts right so the player sees the release */
    if (k > 0.76 && k < 0.9) tiltZ = -eo(s01(k, 0.76, 0.82)) * (1 - smoothstep(0.86, 0.9, k)) * 0.14;
    cur._reloadPose = { rx: tiltX, rz: tiltZ, y: dy2 + jolt };
    if (k < 0.05) {                                          // hand leaves handguard FAST
      armLTo(H.x + 0.03, H.y - 0.06, H.z + 0.14, eo(s01(k, 0, 0.05)));
    } else if (k < 0.16) {                                   // hits mag release; mag drops; darts away
      if (!cur._magDropped && k > 0.07) {
        cur._magDropped = true;
        if (mag) { spawnFallingMag(mag); mag.visible = false; }
        if (RT.audio) RT.audio.magOut();
      }
      setOpenL(k > 0.1);                                     // fingers open mid-travel
      armLTo(H.x - 0.09, H.y - 0.26, H.z + 0.16, eo(s01(k, 0.05, 0.16)));
    } else if (k < 0.5) {
      /* off-screen beat */
    } else if (k < 0.72) {                                   // returns with the new mag in an arc
      const p = eo(s01(k, 0.5, 0.72));
      const arc = Math.sin(p * Math.PI) * 0.05;
      if (mag) {
        mag.visible = true;
        mag.position.copy(cur.parts.magHome);
        mag.position.y -= (1 - p) * 0.24;
        mag.position.z += (1 - p) * 0.06 + arc * 0.3;
      }
      if (p > 0.75) setOpenL(false);                          // closes around the mag
      armLTo(H.x + 0.02 - arc, H.y - 0.1 * (1 - p) - 0.06, H.z + 0.1 * (1 - p) + 0.06, p);
    } else if (k < 0.76) {
      if (!cur._magBack) { cur._magBack = true; if (RT.audio) RT.audio.magIn(); }
    } else if (k < 0.9) {                                    // flick the bolt release
      const p = eo(s01(k, 0.76, 0.84));
      armLTo(H.x + 0.05, H.y + 0.07, H.z + 0.3, p);
      if (cur.parts.action && !cfg.bolt) {
        if (k > 0.82 && k < 0.86) cur.parts.action.position.z = 0.03;
        else cur.parts.action.position.z = 0;
        if (!cur._rack && k > 0.84) { cur._rack = true; if (RT.audio) RT.audio.boltRack(); }
      }
    } else {                                                 // snap back to handguard, overshoot-settle
      const p = s01(k, 0.9, 1);
      const over = Math.sin(Math.min(1, p * 1.35) * Math.PI) * 0.012;
      armLTo(H.x - over, H.y + over * 0.5, H.z - over, eo(p));
    }
  }

  function spawnFallingMag(mag) {
    const clone = new THREE.Mesh(mag.geometry, mag.material);
    const wp = new THREE.Vector3(); mag.getWorldPosition(wp);
    const wq = new THREE.Quaternion(); mag.getWorldQuaternion(wq);
    clone.position.copy(wp); clone.quaternion.copy(wq);
    RT.engine.scene.add(clone);
    const v = new THREE.Vector3((Math.random() - 0.5) * 0.4, -0.5, (Math.random() - 0.5) * 0.4);
    let life = 2.5;
    (RT.transients = RT.transients || []).push((dt2) => {
      life -= dt2;
      v.y -= 9.8 * dt2;
      clone.position.addScaledVector(v, dt2);
      clone.rotation.x += 3 * dt2;
      const gy = (RT.map && RT.map.heightAt ? RT.map.heightAt(clone.position.x, clone.position.z) : 0) + 0.03;
      if (clone.position.y < gy) { clone.position.y = gy; v.set(0, 0, 0); clone.rotation.x = Math.PI / 2; }
      if (life <= 0) { RT.engine.scene.remove(clone); return false; }
      return true;
    });
  }

  return W;
})();


/* ==================== 05_player.js ==================== */
/* ============================================================
 * Player controller: movement + collision vs map, health/regen,
 * camera (look, bob, recoil, shake), grenades with arc indicator,
 * interaction, door animation.
 * ============================================================ */
RT.player = (() => {
  const PL = {};
  const pos = new THREE.Vector3();       // feet position
  const vel = new THREE.Vector3();
  let yaw = 0, pitch = 0;
  let health = 100, lastHurt = -99, dead = false;
  let crouchK = 0, wantCrouch = false, sprinting = false, grounded = true;
  let bobT = 0, speedF = 0, lookVelX = 0, lookVelY = 0;
  let kickP = 0, kickY = 0, recovP = 0;
  let grenades = 4, gCooking = -1, smokes = 2;
  RT.smokeVolumes = RT.smokeVolumes || [];
  let snapAnim = null, landT = 9, losT = 0, losOK = false, losTarget = null;
  /* movement kit: tac-sprint, slide, mantle, lean */
  let tacSprint = false, wWas = false, wTapT = -9;
  let slideT = -1, slideVX = 0, slideVZ = 0, mantle = null, leanK = 0, fovBoostS = 0;
  const EYE = 1.62, EYE_C = 1.08, R = 0.34;
  const UP = new THREE.Vector3(0, 1, 0);
  const _shake = new THREE.Vector3();
  PL.fovBoost = 0;

  /* nearest live enemy by angular distance from the crosshair (LOS-checked at 4Hz) */
  function findAssistTarget() {
    let best = null, bd = 0.12;
    for (const e of RT.ai.enemies) {
      if (e.dead) continue;
      const dx = e.x - pos.x, dz = e.z - pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 2 || dist > 90) continue;
      const wantYaw = Math.atan2(-dx, -dz);
      let dYaw = (wantYaw - yaw + Math.PI) % TAU; if (dYaw < 0) dYaw += TAU; dYaw -= Math.PI;
      const dPitch = Math.atan2((e.y + 1.2) - PL.eyeY(), dist) - pitch;
      const ang = Math.hypot(dYaw, dPitch);
      if (ang < bd) { bd = ang; best = { e, dYaw, dPitch, ang, dist }; }
    }
    if (!best) { losTarget = null; return null; }
    losT -= RT.engine.frameMS / 1000;
    if (losTarget !== best.e || losT <= 0) {
      losT = 0.25; losTarget = best.e;
      const dy = (best.e.y + 1.2) - PL.eyeY();
      const d3 = Math.hypot(best.dist, dy);
      losOK = !RT.map.raycast(pos.x, PL.eyeY(), pos.z,
        (best.e.x - pos.x) / d3, dy / d3, (best.e.z - pos.z) / d3, d3 - 0.5);
    }
    return losOK ? best : null;
  }

  /* ledge detection: if a chest-to-head-high collider sits ahead with clear
     space above the landing spot, start a scripted mantle onto its top. */
  function tryMantle(dir) {
    let dx = dir.x, dz = dir.z;
    const L = Math.hypot(dx, dz);
    if (L < 0.1) { dx = -Math.sin(yaw); dz = -Math.cos(yaw); } else { dx /= L; dz /= L; }
    const px = pos.x + dx * 0.55, pz = pos.z + dz * 0.55;
    let top = -1;
    for (const c of RT.map.colliders) {
      if (c.disabled) continue;
      if (px < c.min.x - R || px > c.max.x + R || pz < c.min.z - R || pz > c.max.z + R) continue;
      if (c.min.y <= pos.y + 0.6 && c.max.y > pos.y + 0.5 && c.max.y < pos.y + 1.8) top = Math.max(top, c.max.y);
    }
    if (top < 0) return false;
    const lx = pos.x + dx * 0.95, lz = pos.z + dz * 0.95;
    for (const c of RT.map.colliders) {          // require headroom over the landing
      if (c.disabled) continue;
      if (lx < c.min.x - R || lx > c.max.x + R || lz < c.min.z - R || lz > c.max.z + R) continue;
      if (c.min.y < top + 1.7 && c.max.y > top + 0.12) return false;
    }
    mantle = { t: 0, dur: 0.42, sx: pos.x, sy: pos.y, sz: pos.z, ex: lx, ey: top + 0.02, ez: lz };
    vel.set(0, 0, 0);
    if (RT.audio) RT.audio.footstep(1);
    return true;
  }

  Object.defineProperties(PL, {
    pos: { get: () => pos }, vel: { get: () => vel },
    yaw: { get: () => yaw, set: v => { yaw = v; } },
    pitch: { get: () => pitch, set: v => { pitch = v; } },
    health: { get: () => health }, dead: { get: () => dead },
    sprinting: { get: () => sprinting }, speedF: { get: () => speedF },
    grenades: { get: () => grenades, set: v => { grenades = v; } },
    smokes: { get: () => smokes, set: v => { smokes = v; } },
    crouched: { get: () => crouchK > 0.5 },
    sliding: { get: () => slideT >= 0 }, tacSprinting: { get: () => tacSprint },
    leanK: { get: () => leanK }, mantling: { get: () => !!mantle },
  });
  PL.eyeY = () => pos.y + lerp(EYE, EYE_C, crouchK);

  PL.init = function (spawn) {
    pos.set(spawn.x, RT.map.groundAt(spawn.x, spawn.z, 999) + 0.05, spawn.z);
    vel.set(0, 0, 0);
    yaw = spawn.ry || 0; pitch = 0;
    health = 100; dead = false; lastHurt = -99;
    grenades = 4; smokes = 2;
    RT.smokeVolumes.length = 0;
    RT.engine.camera.position.set(pos.x, PL.eyeY(), pos.z);
  };
  PL.addRecoil = function (p, y) { kickP += p; kickY += y; };
  PL.state = () => ({ pos: pos.clone(), yaw, pitch, health, grenades });
  PL.heal = (n) => { if (!dead) health = Math.min(100, health + n); };
  PL.restore = (s) => { pos.copy(s.pos); yaw = s.yaw; pitch = s.pitch; health = 100; dead = false; grenades = Math.max(2, s.grenades); };

  PL.damage = function (amount, fromPos) {
    if (dead || RT.game && RT.game.godmode) return;
    health -= amount;
    lastHurt = RT.engine.time;
    RT.engine.shake(0.12 + amount * 0.004);
    if (RT.audio) RT.audio.hurt();
    kickP += 0.02 + amount * 0.0012;                     // flinch the view upward
    if (RT.hud) {
      RT.hud.pulseVignette(clamp(1.3 - health / 100, 0.25, 1));
      if (fromPos) {
        const a = Math.atan2(fromPos.x - pos.x, fromPos.z - pos.z);
        RT.hud.damageFrom(a - yaw + Math.PI);
        kickY += Math.sin(a - yaw) * (0.02 + amount * 0.0009);   // shove toward the hit direction
      }
    }
    if (health <= 0) { health = 0; dead = true; if (RT.game) RT.game.onPlayerDeath(); }
  };

  /* collision resolve: circle (R) vs collider AABBs, axis separated */
  function collideMove(dx, dz) {
    const feet = pos.y;
    const head = feet + 1.75;
    for (const axis of [0, 1]) {
      const nx = pos.x + (axis === 0 ? dx : 0);
      const nz = pos.z + (axis === 1 ? dz : 0);
      let blocked = false;
      for (const c of RT.map.colliders) {
        if (c.disabled) continue;
        if (c.max.y < feet + 0.45 || c.min.y > head - 0.15) continue;    // step-under/step-over
        const cx = clamp(nx, c.min.x, c.max.x), cz = clamp(nz, c.min.z, c.max.z);
        const ddx = nx - cx, ddz = nz - cz;
        if (ddx * ddx + ddz * ddz < R * R) {
          if (c.max.y - feet <= 0.52 && grounded) continue;              // walkable step (handled by groundAt)
          blocked = true; break;
        }
      }
      if (!blocked) { if (axis === 0) pos.x = nx; else pos.z = nz; }
      else if (axis === 0) vel.x = 0; else vel.z = 0;
    }
  }

  PL.update = function (dt) {
    const I = RT.input, cam = RT.engine.camera;
    if (RT.game && RT.game.state !== 'play') { PL.fovBoost = 0; return; }

    /* look */
    let [mdx, mdy] = I.consumeMouse();
    if (RT.game && RT.game.testLockLook) { mdx = 0; mdy = 0; } // harness-controlled facing
    const adsNow = RT.weapons && RT.weapons.state().adsK > 0.5;
    const kbLook = I.keyboardMode() || I.fallback;

    /* --- aim assist (keyboard scheme): slowdown / magnetism / ADS snap --- */
    let assistSlow = 1;
    const assistLvl = I.keyboardMode() ? RT.settings.aimAssist : 0;
    if (assistLvl > 0 && RT.ai && RT.game && RT.game.state === 'play') {
      const tgt = findAssistTarget();
      if (tgt) {
        const str = assistLvl === 2 ? 1 : 0.6;
        if (tgt.ang < 0.07) assistSlow = lerp(1, 0.55, str);                     // slowdown zone ~4°
        if (I.fire && tgt.ang < 0.0436) {                                        // soft magnetism ~2.5°
          const step = 0.14 * str * dt;                                          // up to ~8°/s
          yaw += clamp(tgt.dYaw, -step, step);
          pitch += clamp(tgt.dPitch, -step, step);
        }
        if (I.pressed('Aim') && tgt.ang < 0.0873) {                              // snap-lite on ADS ~5°
          snapAnim = { t: 0, yawLeft: tgt.dYaw * 0.4 * str, pitchLeft: tgt.dPitch * 0.4 * str };
        }
      }
    }
    if (snapAnim) {
      const k = Math.min(1, dt / 0.12);
      yaw += snapAnim.yawLeft * k; pitch += snapAnim.pitchLeft * k;
      snapAnim.yawLeft *= (1 - k); snapAnim.pitchLeft *= (1 - k);
      snapAnim.t += dt;
      if (snapAnim.t >= 0.12) snapAnim = null;
    }

    /* arrow-key look: 70°/s ramping to 160°/s over 0.35s, instant stop */
    if (kbLook) {
      const lx = (I.keys.ArrowRight ? 1 : 0) - (I.keys.ArrowLeft ? 1 : 0);
      const ly = (I.keys.ArrowDown ? 1 : 0) - (I.keys.ArrowUp ? 1 : 0);
      if (lx || ly) {
        PL._lookHold = (PL._lookHold || 0) + dt;
        const ramp = smoothstep(0, 0.35, PL._lookHold);
        let rate = (70 + 90 * ramp) * DEG * RT.settings.sens * assistSlow;
        if (adsNow) rate *= 0.45;
        const ease = 0.55 + 0.45 * Math.min(1, PL._lookHold / 0.09); // analog-feel ease-in
        yaw -= lx * rate * ease * dt;
        pitch -= ly * rate * ease * dt;
      } else PL._lookHold = 0;
    }
    const sens = 0.0021 * RT.settings.sens * (adsNow ? 0.6 : 1) * (I.keyboardMode() ? assistSlow : 1);
    yaw -= mdx * sens; pitch -= mdy * sens;
    pitch = clamp(pitch, -1.45, 1.45);
    lookVelX = damp(lookVelX, mdx / Math.max(dt, 0.001) / 800, 14, dt);
    lookVelY = damp(lookVelY, mdy / Math.max(dt, 0.001) / 800, 14, dt);

    /* recoil: kick is near-instant (1-2 frames), recovery ~10 frames */
    const kApply = 1 - Math.exp(-85 * dt);
    const dp = kickP * kApply, dy = kickY * kApply;
    pitch += dp; yaw += dy;
    kickP -= dp; kickY -= dy;
    recovP += dp * 0.55;
    const rec = recovP * (1 - Math.exp(-9 * dt));
    pitch -= rec; recovP -= rec;

    if (dead) { crouchK = damp(crouchK, 1, 4, dt); applyCamera(dt); return; }

    /* ---- mantle / vault: scripted arc up-and-over a ledge ---- */
    if (mantle) {
      mantle.t += dt;
      const k = Math.min(1, mantle.t / mantle.dur);
      const vk = smoothstep(0, 0.55, k), hk = smoothstep(0.25, 1, k);
      pos.x = lerp(mantle.sx, mantle.ex, hk);
      pos.z = lerp(mantle.sz, mantle.ez, hk);
      pos.y = lerp(mantle.sy, mantle.ey, vk);
      vel.set(0, 0, 0); grounded = true; landT = 9;
      if (k >= 1) { pos.y = RT.map.groundAt(pos.x, pos.z, mantle.ey + 0.4); mantle = null; }
      if (RT.hud) RT.hud.setHealth(health, RT.engine.time - lastHurt);
      updateInteract(dt); updateDoors(dt);
      applyCamera(dt);
      return;
    }

    const jumpPressed = I.pressed('Space');

    /* wish (world-space movement direction) */
    const wish = new THREE.Vector3(
      (I.keys.KeyD ? 1 : 0) - (I.keys.KeyA ? 1 : 0), 0,
      (I.keys.KeyS ? 1 : 0) - (I.keys.KeyW ? 1 : 0));
    const wishWorld = wish.clone().applyAxisAngle(UP, yaw);
    const moving = wish.lengthSq() > 0;

    /* tactical sprint: double-tap W */
    const wNow = I.keys.KeyW;
    if (wNow && !wWas) { if (RT.engine.time - wTapT < 0.30) tacSprint = true; wTapT = RT.engine.time; }
    wWas = wNow;
    if (!wNow || I.aim || wantCrouch) tacSprint = false;
    sprinting = (I.keys.ShiftLeft || tacSprint) && wNow && !wantCrouch && !I.aim && slideT < 0;

    /* crouch toggle OR slide (slide requires speed + sprint) */
    const crouchPressed = I.pressed('KeyC') || I.pressed('ControlLeft');
    const preSpeed = Math.hypot(vel.x, vel.z);
    if (crouchPressed) {
      if (slideT < 0 && grounded && preSpeed > 4.2 && (sprinting || tacSprint)) {
        slideT = 0.60;
        const m = preSpeed || 1; slideVX = vel.x / m; slideVZ = vel.z / m;
        tacSprint = false; wantCrouch = false; sprinting = false;
        if (RT.audio) RT.audio.footstep(1);
      } else wantCrouch = !wantCrouch;
    }

    /* slide integration + slide-cancel (jump out of a slide) */
    let sliding = slideT >= 0;
    if (sliding) {
      slideT -= dt;
      if (jumpPressed) { slideT = -1; sliding = false; vel.y = 4.8; tacSprint = wNow; }
    }

    /* stance blend: snap in, settle out */
    crouchK = damp(crouchK, (wantCrouch || sliding) ? 1 : 0, (wantCrouch || sliding) ? 18 : 9, dt);

    /* movement */
    const adsK = RT.weapons ? RT.weapons.state().adsK : 0;
    if (sliding) {
      const sk = clamp(slideT / 0.60, 0, 1);
      const sp = lerp(2.4, 8.8, sk * sk);
      vel.x = slideVX * sp; vel.z = slideVZ * sp;
    } else {
      let speed = 4.3;
      if (sprinting) speed = tacSprint ? 8.4 : 6.6;
      if (wantCrouch) speed = 2.3;
      if (adsK > 0.5) speed = 2.7;
      wishWorld.normalize();
      const accel = grounded ? 38 : 8;
      vel.x = damp(vel.x, wishWorld.x * speed, accel / speed * 4, dt);
      vel.z = damp(vel.z, wishWorld.z * speed, accel / speed * 4, dt);
    }

    /* gravity + jump / mantle */
    const ground = RT.map.groundAt(pos.x, pos.z, pos.y);
    vel.y -= 19 * dt;
    if (jumpPressed && grounded && !sliding) {
      if (!tryMantle(wishWorld)) {
        vel.y = 5.6;
        const aheadX = pos.x + wishWorld.x * 0.6, aheadZ = pos.z + wishWorld.z * 0.6;
        const og = RT.map.groundAt(aheadX, aheadZ, pos.y + 1.4);
        if (og - pos.y > 0.5 && og - pos.y < 1.25) vel.y = 6.4;
        if (RT.audio) RT.audio.footstep(1);
      }
    }
    if (mantle) { applyCamera(dt); return; }   // mantle began this frame

    const fallSpeed = -vel.y;
    pos.y += vel.y * dt;
    if (pos.y <= ground) {
      if (!grounded && fallSpeed > 3.5) { landT = 0; if (RT.audio) RT.audio.footstep(1); } // land dip
      pos.y = ground; vel.y = 0; grounded = true;
    } else grounded = pos.y - ground < 0.08;
    landT += dt;

    /* lean-peek (Z left / X right), collision-clamped */
    let leanTarget = 0;
    if (!sprinting && !sliding && grounded) {
      leanTarget = (I.keys.KeyZ ? 1 : 0) - (I.keys.KeyX ? 1 : 0);
      if (leanTarget !== 0) {
        const lrx = Math.cos(yaw) * leanTarget, lrz = Math.sin(yaw) * leanTarget;
        const hitL = RT.map.raycast(pos.x, PL.eyeY(), pos.z, lrx, 0, lrz, 0.85);
        if (hitL) leanTarget *= clamp((hitL.dist - 0.2) / 0.6, 0, 1);
      }
    }
    leanK = damp(leanK, leanTarget, 12, dt);

    /* tac-sprint / slide FOV widen (read by weapon camera) */
    fovBoostS = damp(fovBoostS, (tacSprint ? 8 : 0) + (sliding ? 7 : 0), 10, dt);
    PL.fovBoost = fovBoostS;

    collideMove(vel.x * dt, vel.z * dt);

    /* keep inside map bounds */
    const lim = RT.map.terrain.size / 2 - 4;
    pos.x = clamp(pos.x, -lim, lim); pos.z = clamp(pos.z, -lim, lim);

    /* footsteps + speed factor */
    const hSpeed = Math.hypot(vel.x, vel.z);
    speedF = clamp(hSpeed / 6.6, 0, 1);
    bobT += dt * (5 + speedF * 5.5) * (hSpeed > 0.4 ? 1 : 0);
    if (grounded && hSpeed > 0.5) {
      PL._stepAcc = (PL._stepAcc || 0) + hSpeed * dt;
      const stride = sprinting ? 2.4 : 1.9;
      if (PL._stepAcc > stride) {
        PL._stepAcc = 0;
        if (RT.audio) RT.audio.footstep(speedF);
      }
    }

    /* health regen */
    if (health < 100 && RT.engine.time - lastHurt > 4.6) {
      health = Math.min(100, health + 26 * dt);
    }
    if (RT.hud) RT.hud.setHealth(health, RT.engine.time - lastHurt);

    /* grenade */
    updateGrenade(dt);
    /* interact */
    updateInteract(dt);
    /* doors */
    updateDoors(dt);

    applyCamera(dt);
  };

  function applyCamera(dt) {
    const cam = RT.engine.camera;
    const bobA = speedF * (sprinting ? 0.05 : 0.032) * (grounded ? 1 : 0.2);
    const bobY = Math.abs(Math.sin(bobT)) * bobA;
    const bobX = Math.sin(bobT * 0.5) * bobA * 0.6;
    RT.engine.getShakeOffset(_shake);
    /* jump-land dip: sharp 4cm drop over 60ms, recover over 220ms */
    const dip = landT < 0.06 ? (landT / 0.06) * 0.04 : 0.04 * (1 - smoothstep(0.06, 0.28, landT));
    cam.position.set(pos.x + bobX * Math.cos(yaw) + _shake.x, PL.eyeY() + bobY + _shake.y - dip + (dead ? -0.5 : 0), pos.z + bobX * Math.sin(yaw) + _shake.z);
    cam.rotation.set(pitch + _shake.x * 0.8, yaw + _shake.y * 0.8, _shake.z * 0.7 + (dead ? 0.4 : 0));
    /* lean-peek: slide camera laterally + roll */
    if (Math.abs(leanK) > 0.001) {
      cam.position.x += Math.cos(yaw) * leanK * 0.5;
      cam.position.z += Math.sin(yaw) * leanK * 0.5;
      cam.rotation.z += leanK * 0.15;
    }
    RT.engine.updateSun(cam.position);
  }

  /* ---------- grenades ---------- */
  let arcDots = null;
  function grenadeVel() {
    const cam = RT.engine.camera;
    const d = new THREE.Vector3();
    cam.getWorldDirection(d);
    d.multiplyScalar(13.5).add(new THREE.Vector3(0, 3.4, 0));
    return d;
  }
  function updateGrenade(dt) {
    const I = RT.input;
    if (I.pressed('KeyB') && smokes > 0 && gCooking < 0) throwSmoke();
    if (I.keys.KeyG && grenades > 0 && gCooking < 0) gCooking = 0;
    if (gCooking >= 0) {
      gCooking += dt;
      if (!arcDots) {
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(16 * 3), 3));
        arcDots = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffd080, size: 0.09, sizeAttenuation: true, depthTest: false, transparent: true, opacity: 0.85 }));
        arcDots.renderOrder = 30; arcDots.frustumCulled = false;
        RT.engine.scene.add(arcDots);
      }
      arcDots.visible = true;
      const v = grenadeVel(), p = new THREE.Vector3(pos.x, PL.eyeY() - 0.1, pos.z);
      const arr = arcDots.geometry.attributes.position.array;
      let idx = 0;
      for (let i = 0; i < 16; i++) {
        const t = (i + 1) * 0.13;
        arr[idx++] = p.x + v.x * t;
        arr[idx++] = p.y + v.y * t - 9.8 * t * t / 2;
        arr[idx++] = p.z + v.z * t;
      }
      arcDots.geometry.attributes.position.needsUpdate = true;
      if (!I.keys.KeyG || gCooking > 3.2) {
        arcDots.visible = false;
        throwGrenade(Math.max(0.2, 4 - gCooking));
        gCooking = -1;
      }
    } else if (arcDots) arcDots.visible = false;
  }
  function throwGrenade(fuse) {
    grenades--;
    if (RT.hud) RT.hud.refreshAmmo();
    const geos = [RT.G.sph(0.055, 10, 8, 0x3a4433, {}), RT.G.cyl(0.02, 0.02, 0.03, 6, 0x6a6a5a, { y: 0.06 }),
      RT.G.box(0.015, 0.07, 0.03, 0x8a8578, { x: 0.02, y: 0.045, rz: -0.3 })];
    const m = RT.meshOf(geos, RT.MAT.gun);
    const p = new THREE.Vector3(pos.x, PL.eyeY() - 0.1, pos.z);
    const v = grenadeVel();
    m.position.copy(p);
    RT.engine.scene.add(m);
    if (RT.audio) RT.audio.throwWhoosh();
    let t = 0;
    (RT.transients = RT.transients || []).push((dt2) => {
      t += dt2; fuse -= dt2;
      v.y -= 9.8 * dt2;
      const nx = m.position.x + v.x * dt2, ny = m.position.y + v.y * dt2, nz = m.position.z + v.z * dt2;
      const hit = RT.map.raycast(m.position.x, m.position.y, m.position.z, v.x * dt2, v.y * dt2, v.z * dt2, 1.001, true);
      const g = RT.map.groundAt(nx, nz, ny + 0.5);
      if (ny <= g + 0.05) {
        m.position.set(nx, g + 0.05, nz);
        if (Math.abs(v.y) > 1.5 && RT.audio) RT.audio.gBounce();
        v.y = Math.abs(v.y) * 0.38;
        v.x *= 0.55; v.z *= 0.55;
      } else if (hit) {
        // reflect off surface
        const n = hit.normal;
        const dot = v.x * n.x + v.y * n.y + v.z * n.z;
        v.x -= 2 * dot * n.x; v.y -= 2 * dot * n.y; v.z -= 2 * dot * n.z;
        v.multiplyScalar(0.42);
        if (RT.audio) RT.audio.gBounce();
      } else m.position.set(nx, ny, nz);
      m.rotation.x += 6 * dt2; m.rotation.z += 4 * dt2;
      if (fuse <= 0) {
        RT.engine.scene.remove(m);
        PL.explode(m.position, 6.2, 118);
        return false;
      }
      return true;
    });
  }
  /* smoke grenade: throws a canister that blooms a vision-blocking cloud (key B) */
  function throwSmoke() {
    smokes--;
    if (RT.hud) RT.hud.refreshAmmo();
    const geos = [RT.G.cyl(0.042, 0.042, 0.12, 8, 0x37432f, {}), RT.G.torus(0.043, 0.008, 4, 8, 0x9a9a3a, { y: 0.03, rx: Math.PI / 2 })];
    const m = RT.meshOf(geos, RT.MAT.gun);
    const p = new THREE.Vector3(pos.x, PL.eyeY() - 0.1, pos.z);
    const v = grenadeVel().multiplyScalar(0.85);
    m.position.copy(p);
    RT.engine.scene.add(m);
    if (RT.audio) RT.audio.throwWhoosh();
    let landed = false, vol = null, emitT = 0, life = 0;
    (RT.transients = RT.transients || []).push((dt2) => {
      if (!landed) {
        v.y -= 9.8 * dt2;
        const nx = m.position.x + v.x * dt2, ny = m.position.y + v.y * dt2, nz = m.position.z + v.z * dt2;
        const g = RT.map.groundAt(nx, nz, ny + 0.5);
        if (ny <= g + 0.06) { m.position.set(nx, g + 0.07, nz); landed = true; vol = { x: nx, y: g + 1.1, z: nz, r: 0.6 }; RT.smokeVolumes.push(vol); if (RT.audio) RT.audio.gBounce(); }
        else { m.position.set(nx, ny, nz); m.rotation.x += 5 * dt2; }
        return true;
      }
      life += dt2; emitT -= dt2;
      vol.r = Math.min(3.7, vol.r + dt2 * 1.7);
      if (emitT <= 0) {
        emitT = 0.05;
        for (let i = 0; i < 3; i++) {
          const a = Math.random() * TAU, rr = Math.random() * vol.r * 0.7;
          RT.engine.particle(vol.x + Math.cos(a) * rr, vol.y - 0.7 + Math.random() * 1.5, vol.z + Math.sin(a) * rr,
            (Math.random() - .5) * 0.5, 0.5 + Math.random() * 0.6, (Math.random() - .5) * 0.5,
            { color: [0x9a9a94, 0xb2b2ac, 0x84847c][i % 3], size: 1.5 + Math.random() * 1.3, life: 2.6 + Math.random() * 1.6, grav: 0.12, drag: 1.4, grow: 0.6, alpha: 0.5 });
        }
      }
      if (life > 12) {
        const idx = RT.smokeVolumes.indexOf(vol); if (idx >= 0) RT.smokeVolumes.splice(idx, 1);
        RT.engine.scene.remove(m);
        return false;
      }
      return true;
    });
  }

  PL.explode = function (p, radius, dmg) {
    RT.fxExplosion(p, radius);
    // damage player
    const d2p = Math.hypot(p.x - pos.x, p.y - (pos.y + 1), p.z - pos.z);
    if (d2p < radius) PL.damage(dmg * (1 - d2p / radius), p);
    if (RT.ai) RT.ai.explosionAt(p, radius, dmg);
    if (RT.br && RT.br.active && RT.br.blastBots) RT.br.blastBots(p, radius, dmg);   // BR bots
    if (RT.blastDestructibles) RT.blastDestructibles(p, radius, dmg);                 // pop barrels / break glass
  };

  /* ---------- interaction ---------- */
  let curInteract = null;
  function updateInteract(dt) {
    const eye = PL.eyeY();
    curInteract = null;
    let bestD = 99;
    for (const it of RT.map.interact) {
      if (it.used) continue;
      const p = it.getPos ? it.getPos() : it;
      const d = Math.hypot(p.x - pos.x, (p.y - eye) * 0.6, p.z - pos.z);
      if (d < (it.r || 1.7) && d < bestD) { bestD = d; curInteract = it; }
    }
    if (RT.hud) RT.hud.setInteract(curInteract ? (curInteract.door ? (curInteract.door.breach ? 'BREACH' : (curInteract.door.open ? 'CLOSE' : 'OPEN')) : curInteract.label) : null);
    const useKey = RT.input.pressed('KeyE') || (!RT.input.keyboardMode() && RT.input.pressed('KeyF'));
    if (curInteract && useKey) {
      if (curInteract.door) {
        const dr = curInteract.door;
        if (dr.breach && !dr.open) {
          dr.open = true; dr.target = 1.15; dr.speed = 14;
          if (RT.game && RT.game.onBreach) RT.game.onBreach(dr);
          if (RT.audio) RT.audio.doorKick();
        } else {
          dr.open = !dr.open; dr.target = dr.open ? 1.05 : 0; dr.speed = 5;
          if (RT.audio) RT.audio.doorCreak();
        }
      } else if (curInteract.fn) {
        curInteract.fn(curInteract);
        if (curInteract.once) curInteract.used = true;
      }
    }
  }
  function updateDoors(dt) {
    for (const d of RT.map.doors) {
      const target = d.target || 0;
      if (Math.abs(d.t - target) > 0.001) {
        d.t = damp(d.t, target, d.speed || 5, dt);
        d.pivot.rotation.y = d.baseRy + d.t * Math.PI * 0.52;
        d.updateCol();
      }
    }
  }

  return PL;
})();

/* explosion FX shared by grenades / mortars / charges */
RT.fxExplosion = function (p, radius) {
  const E = RT.engine;
  E.flash(new THREE.Vector3(p.x, p.y + 1.2, p.z), 0xffb058, 5.5, radius * 4.5, 0.35);
  E.shake(clamp(1.4 - RT.player.pos.distanceTo(p) / 40, 0.15, 1));
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * TAU, r = Math.random();
    E.particle(p.x, p.y + 0.2, p.z,
      Math.cos(a) * r * 7, 3 + Math.random() * 8, Math.sin(a) * r * 7,
      { color: [0xff9b40, 0xffc060, 0x54473a, 0x2e2a24][i % 4], size: 0.32 + Math.random() * 0.5, life: 0.7 + Math.random() * 0.9, grav: -7, drag: 1.5, grow: -0.4 });
  }
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * TAU;
    E.particle(p.x, p.y + 0.4, p.z, Math.cos(a) * 12 * Math.random(), 1 + Math.random() * 3, Math.sin(a) * 12 * Math.random(),
      { color: 0xffe0a0, size: 0.1, life: 0.35, grav: -2, drag: 0.5 });
  }
  // smoke column
  for (let i = 0; i < 10; i++) {
    E.particle(p.x + (Math.random() - .5), p.y + 0.5 + i * 0.3, p.z + (Math.random() - .5),
      (Math.random() - .5) * 1.5, 2 + Math.random() * 2, (Math.random() - .5) * 1.5,
      { color: 0x3d3833, size: 0.7 + Math.random() * 0.7, life: 1.6 + Math.random(), grav: 0.6, drag: 1.2, grow: -0.5, alpha: 0.75 });
  }
  E.decal(new THREE.Vector3(p.x, RT.map ? RT.map.terrain.heightAt(p.x, p.z) : p.y, p.z), new THREE.Vector3(0, 1, 0), 2.6, 0x1c1a16, 30);
  if (RT.audio) RT.audio.explosion(RT.player.pos.distanceTo(p));
};


/* ==================== 06_world.js ==================== */
/* ============================================================
 * World: heightmapped terrain, house construction system with
 * enterable interiors + war damage, clutter factory, map builder
 * with colliders / cover points / walkable platforms.
 * ============================================================ */

/* ---------------- Terrain ---------------- */
RT.Terrain = class {
  /* opts: {size, segs, seed, amp, palette:{lush,dirt,rock}, roads:[[x,z]...],
   *        flats:[{x,z,r}], craters:[{x,z,r,d}], riverPath, riverDepth, riverWidth} */
  constructor(opts) {
    this.size = opts.size || 400;
    this.segs = opts.segs || 128;
    this.opts = opts;
    const S = this.segs + 1;
    this.grid = new Float32Array(S * S);
    const rnd = RNG(opts.seed || 7);
    const off1 = rnd() * 100, off2 = rnd() * 100;
    const amp = opts.amp != null ? opts.amp : 6;
    for (let iz = 0; iz < S; iz++) {
      for (let ix = 0; ix < S; ix++) {
        const x = (ix / this.segs - 0.5) * this.size;
        const z = (iz / this.segs - 0.5) * this.size;
        let h = RT.fbm(x * 0.008 + off1, z * 0.008 + off1, 4, 2.1, 0.5) * amp;
        h += RT.fbm(x * 0.035 + off2, z * 0.035 + off2, 3, 2, 0.5) * amp * 0.22;
        h += RT.noise(x * 0.11 + off2, z * 0.11 + off1) * amp * 0.06;   // small bumpy detail
        if (opts.tiltZ) h += z * opts.tiltZ;
        if (opts.tiltX) h += x * opts.tiltX;
        // gentle bowl rim so map edges rise (natural boundary)
        const edge = Math.max(Math.abs(x), Math.abs(z)) / (this.size / 2);
        h += smoothstep(0.78, 1.0, edge) * (opts.rim != null ? opts.rim : 14);
        this.grid[iz * S + ix] = h;
      }
    }
    if (opts.riverPath) this._carveRiver(opts.riverPath, opts.riverWidth || 14, opts.riverDepth || 5);
    if (opts.roads) for (const r of opts.roads) this._carveRoad(r, opts.roadWidth || 5);
    if (opts.flats) for (const f of opts.flats) this._flatten(f.x, f.z, f.r, f.h);
    if (opts.craters) for (const c of opts.craters) this._crater(c.x, c.z, c.r, c.d);
    /* mesh is built in MapBuilder.finalize(), after building pads are flattened */
  }
  _idx(ix, iz) { const S = this.segs + 1; return clamp(iz, 0, this.segs) * S + clamp(ix, 0, this.segs); }
  _worldToGrid(x, z) { return [(x / this.size + 0.5) * this.segs, (z / this.size + 0.5) * this.segs]; }
  _flatten(x, z, r, hOverride) {
    const [gx, gz] = this._worldToGrid(x, z);
    const gr = r / this.size * this.segs;
    const base = hOverride != null ? hOverride : this.grid[this._idx(Math.round(gx), Math.round(gz))];
    for (let iz = Math.floor(gz - gr * 2); iz <= Math.ceil(gz + gr * 2); iz++)
      for (let ix = Math.floor(gx - gr * 2); ix <= Math.ceil(gx + gr * 2); ix++) {
        const d = Math.hypot(ix - gx, iz - gz) / gr;
        if (d < 2) {
          const k = smoothstep(2, 0.85, d);
          const i = this._idx(ix, iz);
          this.grid[i] = lerp(this.grid[i], base, k);
        }
      }
    return base;
  }
  _crater(x, z, r, depth) {
    const [gx, gz] = this._worldToGrid(x, z);
    const gr = r / this.size * this.segs;
    for (let iz = Math.floor(gz - gr * 1.6); iz <= Math.ceil(gz + gr * 1.6); iz++)
      for (let ix = Math.floor(gx - gr * 1.6); ix <= Math.ceil(gx + gr * 1.6); ix++) {
        const d = Math.hypot(ix - gx, iz - gz) / gr;
        const i = this._idx(ix, iz);
        if (d < 1) this.grid[i] -= Math.cos(d * Math.PI / 2) * depth;
        else if (d < 1.5) this.grid[i] += (1.5 - d) * depth * 0.28; // rim lip
        if (d < 0.85) (this.scorch = this.scorch || []).push([ix, iz]);
      }
  }
  _carveRoad(path, width) {
    this.roadCells = this.roadCells || new Set();
    this.rutCells = this.rutCells || new Set();
    this.roadEdgeCells = this.roadEdgeCells || new Set();
    for (let s = 0; s < path.length - 1; s++) {
      const [x0, z0] = path[s], [x1, z1] = path[s + 1];
      const len = Math.hypot(x1 - x0, z1 - z0);
      const steps = Math.ceil(len / (this.size / this.segs) * 1.6);
      for (let i = 0; i <= steps; i++) {
        const x = lerp(x0, x1, i / steps), z = lerp(z0, z1, i / steps);
        const [gx, gz] = this._worldToGrid(x, z);
        const gr = width / this.size * this.segs;
        const h = this.grid[this._idx(Math.round(gx), Math.round(gz))];
        for (let iz = Math.floor(gz - gr * 2.2); iz <= Math.ceil(gz + gr * 2.2); iz++)
          for (let ix = Math.floor(gx - gr * 2.2); ix <= Math.ceil(gx + gr * 2.2); ix++) {
            const d = Math.hypot(ix - gx, iz - gz) / gr;
            if (d < 2.2) {
              const idx2 = this._idx(ix, iz);
              this.grid[idx2] = lerp(this.grid[idx2], h, smoothstep(2.2, 0.7, d) * 0.85);
              if (d < 1) {
                this.grid[idx2] -= (1 - d) * 0.09;          // slightly recessed
                this.roadCells.add(idx2);
                if (d > 0.32 && d < 0.62) this.rutCells.add(idx2);  // tire ruts
              } else if (d < 1.45) this.roadEdgeCells.add(idx2);    // blend band
            }
          }
      }
    }
  }
  _carveRiver(path, width, depth) {
    this.waterCells = new Set();
    /* accumulate the max dig per cell, then apply once (idempotent) */
    const digs = new Float32Array(this.grid.length);
    for (let s = 0; s < path.length - 1; s++) {
      const [x0, z0] = path[s], [x1, z1] = path[s + 1];
      const len = Math.hypot(x1 - x0, z1 - z0);
      const steps = Math.ceil(len / (this.size / this.segs) * 1.6);
      for (let i = 0; i <= steps; i++) {
        const x = lerp(x0, x1, i / steps), z = lerp(z0, z1, i / steps);
        const [gx, gz] = this._worldToGrid(x, z);
        const gr = width / this.size * this.segs / 2;
        for (let iz = Math.floor(gz - gr * 1.5); iz <= Math.ceil(gz + gr * 1.5); iz++)
          for (let ix = Math.floor(gx - gr * 1.5); ix <= Math.ceil(gx + gr * 1.5); ix++) {
            const d = Math.hypot(ix - gx, iz - gz) / gr;
            if (d < 1.5) {
              const idx2 = this._idx(ix, iz);
              const dig = Math.cos(Math.min(1, d / 1.5) * Math.PI / 2) * depth;
              if (dig > digs[idx2]) digs[idx2] = dig;
              if (d < 0.6) this.waterCells.add(idx2);
            }
          }
      }
    }
    for (let i = 0; i < digs.length; i++) this.grid[i] -= digs[i];
  }
  heightAt(x, z) {
    const [gx, gz] = this._worldToGrid(x, z);
    const x0 = Math.floor(gx), z0 = Math.floor(gz);
    const fx = gx - x0, fz = gz - z0;
    const h00 = this.grid[this._idx(x0, z0)], h10 = this.grid[this._idx(x0 + 1, z0)];
    const h01 = this.grid[this._idx(x0, z0 + 1)], h11 = this.grid[this._idx(x0 + 1, z0 + 1)];
    return lerp(lerp(h00, h10, fx), lerp(h01, h11, fx), fz);
  }
  _buildMesh(pal) {
    const S = this.segs + 1;
    const geo = new THREE.PlaneGeometry(this.size, this.size, this.segs, this.segs);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const cols = new Float32Array(pos.count * 3);
    const lush = RT.lin(pal.lush || 0x5d6b38);
    const lush2 = RT.lin(pal.lush2 || 0x6e7a42);
    const dirt = RT.lin(pal.dirt || 0x77664a);
    const rock = RT.lin(pal.rock || 0x74705f);
    const road = RT.lin(pal.road || 0x6d6354);
    const scorchC = RT.lin(0x2e2a24);
    const c = new THREE.Color();
    const scorchSet = new Set((this.scorch || []).map(([ix, iz]) => this._idx(ix, iz)));
    for (let i = 0; i < pos.count; i++) {
      const ix = i % S, iz = Math.floor(i / S);
      const h = this.grid[iz * S + ix];
      pos.setY(i, h);
      // slope from neighbors
      const hx = this.grid[this._idx(ix + 1, iz)] - this.grid[this._idx(ix - 1, iz)];
      const hz = this.grid[this._idx(ix, iz + 1)] - this.grid[this._idx(ix, iz - 1)];
      const slope = Math.min(1, Math.hypot(hx, hz) * 0.55);
      const n = RT.noise(ix * 0.35, iz * 0.35) * 0.5 + 0.5;
      c.copy(lush).lerp(lush2, n);
      c.lerp(dirt, smoothstep(0.25, 0.7, slope + RT.noise(ix * 0.13, iz * 0.13) * 0.18));
      c.lerp(rock, smoothstep(0.55, 0.95, slope));
      const gi = iz * S + ix;
      if (this.roadEdgeCells && this.roadEdgeCells.has(gi)) c.lerp(road, 0.45);        // worn edge blend
      if (this.roadCells && this.roadCells.has(gi)) c.copy(road).multiplyScalar(0.92 + n * 0.16);
      if (this.rutCells && this.rutCells.has(gi)) c.multiplyScalar(0.78);              // packed tire ruts
      if (this.waterCells && this.waterCells.has(gi)) c.multiplyScalar(0.6);
      if (scorchSet.has(gi)) c.lerp(scorchC, 0.5);
      // low wet areas darker
      if (h < -1.5) c.multiplyScalar(clamp(1 + (h + 1.5) * 0.06, 0.72, 1));
      const vr = 0.93 + RT.noise(ix * 1.7, iz * 1.7) * 0.12;
      cols[i * 3] = c.r * vr; cols[i * 3 + 1] = c.g * vr; cols[i * 3 + 2] = c.b * vr;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    geo.computeVertexNormals();
    /* mandatory ground detail texture: mottled tone map × vertex colors */
    if (!RT.Terrain._groundTex) {
      RT.Terrain._groundTex = RT.canvasTex(1024, (ctx, s) => {
        ctx.fillStyle = '#cfcbc2';
        ctx.fillRect(0, 0, s, s);
        for (let i = 0; i < 900; i++) {     // large soft mottling
          const r = 14 + Math.random() * 46;
          const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
          const tone = Math.random();
          const cc = tone < 0.55 ? [186 + Math.random() * 30, 188 + Math.random() * 26, 172 + Math.random() * 22]
            : (tone < 0.8 ? [172 + Math.random() * 20, 160 + Math.random() * 18, 138 + Math.random() * 16]      // dirt patches
              : [206 + Math.random() * 28, 208 + Math.random() * 24, 190 + Math.random() * 20]);                 // light dry grass
          g2.addColorStop(0, `rgba(${cc[0] | 0},${cc[1] | 0},${cc[2] | 0},${0.25 + Math.random() * 0.3})`);
          g2.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.save();
          ctx.translate(Math.random() * s, Math.random() * s);
          ctx.fillStyle = g2;
          ctx.fillRect(-r, -r, r * 2, r * 2);
          ctx.restore();
        }
        for (let i = 0; i < 9000; i++) {    // darker speckle noise
          const v = 105 + (Math.random() * 90) | 0;
          ctx.fillStyle = `rgba(${v},${v + 4},${v - 8},${0.2 + Math.random() * 0.35})`;
          ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 2, 1 + Math.random() * 2);
        }
        for (let i = 0; i < 380; i++) {     // grass-blade flecks
          const v = 150 + (Math.random() * 70) | 0;
          ctx.strokeStyle = `rgba(${v - 30},${v},${v - 45},0.4)`;
          const x = Math.random() * s, y = Math.random() * s;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random() - 0.5) * 7, y - 3 - Math.random() * 6); ctx.stroke();
        }
      });
      RT.Terrain._groundTex.wrapS = RT.Terrain._groundTex.wrapT = THREE.RepeatWrapping;
      RT.Terrain._groundTex.repeat.set(11, 11);
      RT.Terrain._groundMat = new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.95, metalness: 0.0, map: RT.Terrain._groundTex,
      });
    }
    this.mesh = new THREE.Mesh(geo, RT.Terrain._groundMat);
    this.mesh.receiveShadow = true;
    this.mesh.castShadow = false;
  }
};

/* ---------------- Map builder ---------------- */
RT.MapBuilder = class {
  constructor(terrain, seed) {
    this.terrain = terrain;
    this.rnd = RNG(seed || 42);
    this.static = [];        // merged world geometry buckets
    this.colliders = [];     // {min:{x,y,z}, max:{x,y,z}, door?:ref}
    this.platforms = [];     // walkable {x0,z0,x1,z1,y}
    this.cover = [];         // {x,z,y, dir:{x,z}, low:bool}
    this.doors = [];         // {pivot, open, closed collider}
    this.destructibles = []; // explosive barrels + breakable glass (live meshes)
    this.interact = [];      // {x,z,y,r, label, fn, once}
    this.waypointObjs = [];
    this.group = new THREE.Group();
    this.buckets = { std: [], wood: [] };
  }
  h(x, z) { return this.terrain.heightAt(x, z); }
  addGeo(geo) { this.buckets.std.push(geo); }
  box(w, h, d, c, o) { this.buckets.std.push(RT.G.box(w, h, d, c, o)); }
  collide(x, y, z, w, h, d) {
    this.colliders.push({ min: { x: x - w / 2, y: y - h / 2, z: z - d / 2 }, max: { x: x + w / 2, y: y + h / 2, z: z + d / 2 } });
    return this.colliders[this.colliders.length - 1];
  }
  collideRot(cx, cy, cz, w, h, d, ry) {
    // approximate rotated box with AABB (fine for near-axis) or split into strips for long walls
    if (Math.abs(Math.sin(ry)) < 0.05 || Math.abs(Math.cos(ry)) < 0.05) {
      const along = Math.abs(Math.cos(ry)) > 0.5 ? [w, d] : [d, w];
      return this.collide(cx, cy, cz, along[0], h, along[1]);
    }
    const steps = Math.max(1, Math.ceil(w / 1.2));
    const cs = Math.cos(ry), sn = Math.sin(ry);
    for (let i = 0; i < steps; i++) {
      const t = (i + 0.5) / steps - 0.5;
      this.collide(cx + cs * t * w, cy, cz - sn * t * w, w / steps + d, h, w / steps + d);
    }
  }
  addCover(x, z, dirX, dirZ, low) {
    this.cover.push({ x, z, y: this.h(x, z), dir: { x: dirX, z: dirZ }, low: !!low, claimed: null });
  }
  platform(x0, z0, x1, z1, y) { this.platforms.push({ x0: Math.min(x0, x1), z0: Math.min(z0, z1), x1: Math.max(x0, x1), z1: Math.max(z0, z1), y }); }

  /* ground height incl. platforms (for player/AI standing) */
  groundAt(x, z, feetY) {
    let g = this.terrain.heightAt(x, z);
    for (const p of this.platforms) {
      if (x >= p.x0 && x <= p.x1 && z >= p.z0 && z <= p.z1 && p.y <= feetY + 0.55 && p.y > g) g = p.y;
    }
    return g;
  }

  /* segment raycast vs colliders + terrain. returns {dist, point, normal} or null */
  raycast(ox, oy, oz, dx, dy, dz, maxDist, skipDoors) {
    let best = maxDist, bestN = null, bestCol = null, bestExit = 0;
    for (const c of this.colliders) {
      if (c.disabled) continue;
      let tmin = 0, tmax = 1e9, nx = 0, ny = 0, nz = 0;
      let hit = true;
      const o = [ox, oy, oz], d = [dx, dy, dz], mn = [c.min.x, c.min.y, c.min.z], mx = [c.max.x, c.max.y, c.max.z];
      let axis = -1, sign = 0;
      for (let a = 0; a < 3; a++) {
        if (Math.abs(d[a]) < 1e-8) {
          if (o[a] < mn[a] || o[a] > mx[a]) { hit = false; break; }
        } else {
          let t1 = (mn[a] - o[a]) / d[a], t2 = (mx[a] - o[a]) / d[a];
          let s = -1;
          if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; s = 1; }
          if (t1 > tmin) { tmin = t1; axis = a; sign = s; }
          if (t2 < tmax) tmax = t2;
          if (tmin > tmax) { hit = false; break; }
        }
      }
      if (hit && tmin > 0.01 && tmin < best) {
        best = tmin;
        nx = ny = nz = 0;
        if (axis === 0) nx = sign; else if (axis === 1) ny = sign; else nz = sign;
        bestN = { x: nx, y: ny, z: nz };
        bestCol = c; bestExit = tmax;
      }
    }
    // terrain march
    let t = 1, lastH = oy - this.terrain.heightAt(ox, oz);
    const step = 1.4;
    while (t < best) {
      const px = ox + dx * t, py = oy + dy * t, pz = oz + dz * t;
      if (Math.abs(px) > this.terrain.size / 2 || Math.abs(pz) > this.terrain.size / 2) break;
      const dh = py - this.terrain.heightAt(px, pz);
      if (dh <= 0) {
        // refine between t-step and t
        let lo = Math.max(0, t - step), hi = t;
        for (let i = 0; i < 5; i++) {
          const mid = (lo + hi) / 2;
          const mh = (oy + dy * mid) - this.terrain.heightAt(ox + dx * mid, oz + dz * mid);
          if (mh > 0) lo = mid; else hi = mid;
        }
        if (hi < best) { best = hi; bestN = { x: 0, y: 1, z: 0, terrain: true }; }
        break;
      }
      t += Math.max(0.35, Math.min(step, dh * 1.8));
      lastH = dh;
    }
    if (!bestN || best >= maxDist) return null;
    return { dist: best, point: { x: ox + dx * best, y: oy + dy * best, z: oz + dz * best }, normal: bestN, col: bestCol, exit: bestExit };
  }

  finalize() {
    this.terrain._buildMesh(this.terrain.opts.palette || {});
    this.group.add(this.terrain.mesh);
    if (this.buckets.std.length) {
      // chunk merge for frustum culling: 3x3 grid
      const chunks = {};
      const cs = this.terrain.size / 3;
      for (const g of this.buckets.std) {
        g.computeBoundingSphere();
        const c = g.boundingSphere.center;
        const key = Math.floor((c.x + this.terrain.size / 2) / cs) + '_' + Math.floor((c.z + this.terrain.size / 2) / cs);
        (chunks[key] = chunks[key] || []).push(g);
      }
      for (const key in chunks) {
        const m = RT.meshOf(RT.mergeGeos(chunks[key]), RT.MAT.std);
        m.frustumCulled = false;   // never pop whole prop clusters out when the camera turns
        this.group.add(m);
      }
      this.buckets.std = [];
    }
    return this.group;
  }
};

/* ---------------- Prop & building factory ---------------- */
RT.props = (() => {
  const P = {};
  const G = RT.G;
  function adjc(hex, mul) { const c = new THREE.Color(hex); c.multiplyScalar(mul); return c.getHex(); }

  /* ---------- house construction system ----------
   * o: {x,z,ry, w,d, floors, roof:'gable'|'hip'|'flat', wallC, roofC, trimC,
   *     damage:0-2, interior:true, ajar, stairs, porch} */
  P.house = function (B, o) {
    const rnd = RNG((o.seed != null ? o.seed : (o.x * 131 + o.z * 17)) | 0);
    const w = o.w || rnd.range(7, 10), d = o.d || rnd.range(6, 9);
    const floors = o.floors || 1;
    const fh = 2.75;                       // per-floor height
    const H = floors * fh;
    const wallC = o.wallC != null ? o.wallC : rnd.pick([0xb5a68c, 0xa89a80, 0x9d8f78, 0xb8a998, 0x8f8064]);
    const trimC = o.trimC != null ? o.trimC : adjc(wallC, 0.72);
    const roofC = o.roofC != null ? o.roofC : rnd.pick([0x6e4434, 0x5c4a3a, 0x536052, 0x62555e]);
    const dmg = o.damage || 0;
    const T = 0.24;                        // wall thickness
    const gy = B.terrain instanceof RT.Terrain ? B._flattenFor(o, w, d) : 0;
    const cs = Math.cos(o.ry || 0), sn = Math.sin(o.ry || 0);
    const L2W = (lx, lz) => [o.x + lx * cs + lz * sn, o.z - lx * sn + lz * cs];
    const geos = [];
    const woodC = 0x5e4630;

    /* geometry is built in LOCAL space (origin = house center at ground),
     * then rotated/translated once at the end */
    const wallBox = (lx, ly, lz, ww, hh, dd, col) => {
      geos.push(G.box(ww, hh, dd, col || wallC, { x: lx, y: ly, z: lz, vary: 0.05 }));
    };
    const solid = (lx, ly, lz, ww, hh, dd) => {
      const [wx, wz] = L2W(lx, lz);
      B.collideRot(wx, gy + ly, wz, ww, hh, dd, o.ry || 0);
    };

    /* one exterior wall with openings.
     * axis: 'x' (wall runs along x) or 'z'; sign: which side.
     * openings: [{c:center along wall, w, type:'door'|'win', broken}] */
    const mkWall = (axis, sign, openings) => {
      const len = axis === 'x' ? w : d;
      const off = (axis === 'x' ? d : w) / 2 - T / 2;
      const place = (c, ww, y0, y1, col) => {
        const mid = (y0 + y1) / 2, hh = y1 - y0;
        if (hh <= 0.01 || ww <= 0.01) return;
        if (axis === 'x') { wallBox(c, mid, off * sign, ww, hh, T, col); solid(c, mid, off * sign, ww, hh, T); }
        else { wallBox(off * sign, mid, c, T, hh, ww, col); solid(off * sign, mid, c, T, hh, ww); }
      };
      const sorted = (openings || []).slice().sort((a, b) => a.c - b.c);
      let cursor = -len / 2;
      for (const op of sorted) {
        const x0 = op.c - op.w / 2, x1 = op.c + op.w / 2;
        place((cursor + x0) / 2, x0 - cursor, 0, H);            // segment before opening
        if (op.type === 'door') {
          place(op.c, op.w, 2.15, H);                            // lintel above door
        } else {
          const sy0 = op.y0 != null ? op.y0 : 0.95, sy1 = op.y1 != null ? op.y1 : 2.15;
          place(op.c, op.w, 0, sy0);                             // below sill
          place(op.c, op.w, sy1, H);                             // above lintel
          // window frame + cross bar
          const fr = trimC;
          if (axis === 'x') {
            wallBox(op.c - op.w / 2 + 0.04, (sy0 + sy1) / 2, off * sign, 0.08, sy1 - sy0, T + 0.06, fr);
            wallBox(op.c + op.w / 2 - 0.04, (sy0 + sy1) / 2, off * sign, 0.08, sy1 - sy0, T + 0.06, fr);
            wallBox(op.c, sy0 + 0.04, off * sign, op.w, 0.08, T + 0.09, fr);
            wallBox(op.c, sy1 - 0.04, off * sign, op.w, 0.08, T + 0.06, fr);
            if (!op.broken) wallBox(op.c, (sy0 + sy1) / 2, off * sign, 0.05, sy1 - sy0 - 0.1, 0.04, 0x2d3438);
            else wallBox(op.c - op.w * 0.2, sy0 + 0.3, off * sign, 0.05, 0.5, 0.04, 0x2d3438);
            // shutters (some crooked)
            if (op.shutter) {
              wallBox(op.c - op.w / 2 - 0.24, (sy0 + sy1) / 2 - (op.crooked ? 0.15 : 0), off * sign + sign * 0.05, 0.4, sy1 - sy0 - 0.15, 0.05, adjc(roofC, 0.85));
              if (!op.crooked) wallBox(op.c + op.w / 2 + 0.24, (sy0 + sy1) / 2, off * sign + sign * 0.05, 0.4, sy1 - sy0 - 0.15, 0.05, adjc(roofC, 0.85));
            }
          } else {
            wallBox(off * sign, (sy0 + sy1) / 2, op.c - op.w / 2 + 0.04, T + 0.06, sy1 - sy0, 0.08, fr);
            wallBox(off * sign, (sy0 + sy1) / 2, op.c + op.w / 2 - 0.04, T + 0.06, sy1 - sy0, 0.08, fr);
            wallBox(off * sign, sy0 + 0.04, op.c, T + 0.09, 0.08, op.w, fr);
            wallBox(off * sign, sy1 - 0.04, op.c, T + 0.06, 0.08, op.w, fr);
            if (!op.broken) wallBox(off * sign, (sy0 + sy1) / 2, op.c, 0.04, sy1 - sy0 - 0.1, 0.05, 0x2d3438);
          }
          if (axis === 'x') solid(op.c, sy0 / 2, off * sign, op.w, sy0, T); else solid(off * sign, sy0 / 2, op.c, T, sy0, op.w);
        }
        cursor = x1;
      }
      place((cursor + len / 2) / 2, len / 2 - cursor, 0, H);     // tail segment
      // door meshes on hinge pivots
      for (const op of sorted) {
        if (op.type !== 'door') continue;
        const dw = op.w - 0.08;
        const doorGeos = [G.box(dw, 2.06, 0.07, op.doorC || woodC, { x: dw / 2, y: 1.03, vary: 0.1 }),
          G.box(dw - 0.16, 0.7, 0.09, adjc(op.doorC || woodC, 0.85), { x: dw / 2, y: 1.55 }),
          G.box(dw - 0.16, 0.7, 0.09, adjc(op.doorC || woodC, 0.85), { x: dw / 2, y: 0.55 }),
          G.sph(0.035, 8, 6, 0x8a8578, { x: dw - 0.12, y: 1.02, z: 0.06 })];
        const doorMesh = RT.meshOf(doorGeos, RT.MAT.std);
        const pivot = new THREE.Object3D();
        let wx, wz, wry = o.ry || 0;
        if (axis === 'x') { [wx, wz] = L2W(op.c - dw / 2, off * sign); }
        else { [wx, wz] = L2W(off * sign, op.c - dw / 2); wry += Math.PI / 2; }
        pivot.position.set(wx, gy, wz);
        pivot.rotation.y = wry;
        pivot.add(doorMesh);
        B.group.add(pivot);
        const doorCol = { min: {}, max: {}, disabled: false };
        const updateCol = () => {
          const a = pivot.rotation.y - wry; // open angle
          const ex = Math.cos(a) * dw, ez = -Math.sin(a) * dw;
          const p1x = wx + Math.cos(wry) * ex + Math.sin(wry) * ez;
          const p1z = wz - Math.sin(wry) * ex + Math.cos(wry) * ez;
          doorCol.min.x = Math.min(wx, p1x) - 0.06; doorCol.max.x = Math.max(wx, p1x) + 0.06;
          doorCol.min.z = Math.min(wz, p1z) - 0.06; doorCol.max.z = Math.max(wz, p1z) + 0.06;
          doorCol.min.y = gy; doorCol.max.y = gy + 2.1;
        };
        updateCol();
        B.colliders.push(doorCol);
        const door = { pivot, baseRy: wry, open: !!op.ajar, t: op.ajar ? 0.55 : 0, target: op.ajar ? 0.55 : 0, updateCol, breach: op.breach };
        B.doors.push(door);
        if (op.ajar) { pivot.rotation.y = wry + 0.9; updateCol(); }
        if (!op.locked) {
          B.interact.push({
            getPos: () => { const [ix, iz] = axis === 'x' ? L2W(op.c, off * sign) : L2W(off * sign, op.c); return { x: ix, y: gy + 1.2, z: iz }; },
            r: 1.7, label: op.breach ? 'BREACH' : 'OPEN', door,
          });
        }
      }
    };

    /* generate openings */
    const front = o.front || 'S'; // door side (local +z = S)
    const winW = 1.15;
    const doorWall = { S: ['x', 1], N: ['x', -1], E: ['z', 1], W: ['z', -1] }[front];
    const walls = { S: ['x', 1], N: ['x', -1], E: ['z', 1], W: ['z', -1] };
    for (const key in walls) {
      const [axis, sign] = walls[key];
      const len = axis === 'x' ? w : d;
      const ops = [];
      if (key === front) {
        const dc = o.doorAt != null ? o.doorAt : rnd.range(-len / 4, len / 4);
        ops.push({ c: dc, w: 1.06, type: 'door', ajar: o.ajar != null ? o.ajar : rnd.chance(0.4), breach: o.breach, locked: o.locked });
        if (len > 6.5) ops.push({ c: dc + (dc > 0 ? -len / 3.1 : len / 3.1), w: winW, type: 'win', shutter: rnd.chance(0.6), crooked: rnd.chance(0.3), broken: dmg > 0 && rnd.chance(0.5) });
      } else {
        const n = len > 8 ? 2 : 1;
        for (let i = 0; i < n; i++) {
          ops.push({ c: (i - (n - 1) / 2) * len / (n + 0.4), w: winW, type: 'win', shutter: rnd.chance(0.5), crooked: rnd.chance(0.25), broken: dmg > 0 && rnd.chance(0.45) });
        }
      }
      mkWall(axis, sign, ops);
    }
    /* second floor windows */
    if (floors > 1) {
      for (const key in walls) {
        const [axis, sign] = walls[key];
        const len = axis === 'x' ? w : d;
        const n = len > 8 ? 2 : 1;
        for (let i = 0; i < n; i++) {
          const c = (i - (n - 1) / 2) * len / (n + 0.6);
          const off = (axis === 'x' ? d : w) / 2 - T / 2;
          const y0 = fh + 0.9, y1 = fh + 2.0;
          // punch handled by wall builder only for floor 1; add framed opening look for floor 2
          if (axis === 'x') {
            wallBox(c, (y0 + y1) / 2, off * sign + sign * 0.02, winW, y1 - y0, 0.1, 0x22282c);
            wallBox(c - winW / 2, (y0 + y1) / 2, off * sign + sign * 0.05, 0.08, y1 - y0, 0.08, trimC);
            wallBox(c + winW / 2, (y0 + y1) / 2, off * sign + sign * 0.05, 0.08, y1 - y0, 0.08, trimC);
            wallBox(c, y0, off * sign + sign * 0.05, winW, 0.08, 0.09, trimC);
          } else {
            wallBox(off * sign + sign * 0.02, (y0 + y1) / 2, c, 0.1, y1 - y0, winW, 0x22282c);
            wallBox(off * sign + sign * 0.05, (y0 + y1) / 2, c - winW / 2, 0.08, y1 - y0, 0.08, trimC);
            wallBox(off * sign + sign * 0.05, (y0 + y1) / 2, c + winW / 2, 0.08, y1 - y0, 0.08, trimC);
            wallBox(off * sign + sign * 0.05, y0, c, 0.09, 0.08, winW, trimC);
          }
        }
      }
    }

    /* foundation + interior floor */
    wallBox(0, -0.22, 0, w + 0.5, 0.6, d + 0.5, adjc(wallC, 0.6));
    wallBox(0, 0.06, 0, w - 0.2, 0.12, d - 0.2, 0x7a6a52);
    B.platform(...(() => { const [ax, az] = L2W(-w / 2, -d / 2); const [bx, bz] = L2W(w / 2, d / 2); return [Math.min(ax, bx), Math.min(az, bz), Math.max(ax, bx), Math.max(az, bz)]; })(), gy + 0.12);

    /* roof */
    const roofDrop = dmg >= 2 ? 1 : 0; // collapsed corner
    if (o.roof === 'flat') {
      wallBox(0, H + 0.1, 0, w + 0.7, 0.22, d + 0.7, adjc(roofC, 0.9));
      wallBox(0, H + 0.35, 0, w + 0.2, 0.5, 0.2, wallC); // parapet front/back
      wallBox(0, H + 0.35, 0, 0.2, 0.5, d + 0.2, wallC);
      solid(0, H + 0.1, 0, w + 0.7, 0.22, d + 0.7);
      B.platform(...(() => { const [ax, az] = L2W(-w / 2, -d / 2); const [bx, bz] = L2W(w / 2, d / 2); return [Math.min(ax, bx), Math.min(az, bz), Math.max(ax, bx), Math.max(az, bz)]; })(), gy + H + 0.22);
    } else {
      const rise = w * 0.3, ov = 0.55;
      const slopeL = Math.hypot(w / 2 + ov, rise);
      const ang = Math.atan2(rise, w / 2 + ov);
      // two slopes with shingle rows
      for (const s of [-1, 1]) {
        if (roofDrop && s === 1) {
          // collapsed corner: half slope + exposed rafters + rubble
          geos.push(G.box(slopeL * 0.55, 0.16, d * 0.55 + ov, roofC, {
            x: s * (w / 4 + ov / 2) * Math.cos(ang) * 0.9, y: H + rise / 2 + 0.28 - rise * 0.28, z: -d * 0.22,
            rz: -s * ang, vary: 0.09,
          }));
          for (let i = 0; i < 5; i++) {
            geos.push(G.box(0.09, 0.14, d * 0.5, 0x4a3826, {
              x: s * (w / 2 - i * w / 9), y: H + rise - i * rise / 5 - rise * 0.3, z: d * 0.24,
              rz: -s * ang * 0.9, vary: 0.15,
            }));
          }
          // rubble pile at the collapse
          const [rx, rz2] = L2W(s * w / 3, d / 3);
          P.rubble(B, { x: rx, z: rz2, r: 2.4, seed: rnd.int(0, 999) });
          continue;
        }
        const cx = s * (w / 4 + ov / 4);
        geos.push(G.box(slopeL, 0.14, d + ov * 2, roofC, {
          x: cx, y: H + rise / 2 + 0.14, z: 0, rz: -s * ang, vary: 0.07,
        }));
        // shingle rows (thin strips)
        const rows = 4;
        for (let i = 0; i < rows; i++) {
          const t = (i + 0.5) / rows;
          geos.push(G.box(0.06, 0.05, d + ov * 2 + 0.05, adjc(roofC, 0.8 + 0.1 * (i % 2)), {
            x: s * ((w / 2 + ov) * (1 - t)) * 0.98, y: H + rise * t + 0.2, z: 0,
          }));
        }
        const covW = Math.cos(ang) * slopeL, covH = Math.sin(ang) * slopeL;
        B.collideRot(...L2W(cx, 0), gy + H + rise / 2 + 0.14, covW, covH + 0.3, d + ov * 2, o.ry || 0);
      }
      // ridge cap
      if (!roofDrop) geos.push(G.box(0.3, 0.12, d + ov * 2 + 0.1, adjc(roofC, 0.7), { y: H + rise + 0.2 }));
      // gable end triangles
      for (const s of [-1, 1]) {
        geos.push(G.wedge(w, rise, T, wallC, { x: 0, y: H, z: s * (d / 2 - T / 2), vary: 0.05 }));
      }
      // chimney with crown
      if (rnd.chance(0.7) && !roofDrop) {
        const chx = rnd.range(-w / 4, w / 4);
        geos.push(G.box(0.7, rise + 1.6, 0.7, adjc(wallC, 0.78), { x: chx, y: H + rise / 2 + 0.6, z: d / 4, vary: 0.12 }));
        geos.push(G.box(0.9, 0.18, 0.9, adjc(wallC, 0.62), { x: chx, y: H + rise + 1.45, z: d / 4 }));
      }
    }
    /* gutters */
    geos.push(G.box(0.1, 0.1, d + 1, adjc(trimC, 0.8), { x: -w / 2 - 0.5, y: H + 0.12 }));
    geos.push(G.box(0.1, 0.1, d + 1, adjc(trimC, 0.8), { x: w / 2 + 0.5, y: H + 0.12 }));

    /* porch + steps */
    if (o.porch !== false && front === 'S') {
      const pw = Math.min(3.4, w * 0.5);
      const px = o.doorAt != null ? o.doorAt : 0;
      wallBox(px, 0.02, d / 2 + 0.8, pw, 0.14, 1.6, 0x6b5a42);
      for (let i = 0; i < 2; i++) wallBox(px, -0.1 - i * 0.14, d / 2 + 1.7 + i * 0.34, pw * 0.7, 0.14, 0.36, 0x6b5a42);
      geos.push(G.cyl(0.07, 0.08, 2.3, 8, woodC, { x: px - pw / 2 + 0.15, y: 1.15, z: d / 2 + 1.5 }));
      geos.push(G.cyl(0.07, 0.08, 2.3, 8, woodC, { x: px + pw / 2 - 0.15, y: 1.15, z: d / 2 + 1.5 }));
      wallBox(px, 2.35, d / 2 + 1.15, pw + 0.4, 0.12, 2.1, adjc(roofC, 0.95));
    }

    /* interior */
    if (o.interior !== false) {
      const IC = adjc(wallC, 1.12);
      // one dividing wall with doorway
      const divZ = rnd.range(-d / 6, d / 6);
      const dwx = rnd.range(-w / 4, 0);
      wallBox((dwx - w / 2) / 2 - 0.55, fh / 2, divZ, (dwx - (-w / 2)) - 1.1, fh, 0.16, IC);
      solid((dwx - w / 2) / 2 - 0.55, fh / 2, divZ, (dwx - (-w / 2)) - 1.1, fh, 0.16);
      wallBox((dwx + 1.1 + w / 2) / 2, fh / 2, divZ, (w / 2 - dwx - 1.1), fh, 0.16, IC);
      solid((dwx + 1.1 + w / 2) / 2, fh / 2, divZ, (w / 2 - dwx - 1.1), fh, 0.16);
      wallBox(dwx + 0.55, fh - 0.3, divZ, 1.1, 0.6, 0.16, IC); // doorway lintel
      P.furnishRoom(B, o, gy, w, d, divZ, rnd, L2W);
      if (floors > 1) {
        // ceiling slab with stair hole
        const holeW = 1.2, holeD = 3.2, hx = w / 2 - 0.9, hz = -d / 2 + 2.1;
        wallBox(-(w - (w / 2 - hx + holeW / 2)) / 2 + 0 - 0.6, fh + 0.09, 0, w - (w / 2 - hx) - holeW, 0.18, d - 0.3, 0x7a6a52);
        wallBox(hx, fh + 0.09, (hz + holeD / 2 + d / 2) / 2 + 0.3, holeW + 0.7, 0.18, d - (d / 2 - hz) - holeD + 1, 0x7a6a52);
        B.platform(...(() => { const [ax, az] = L2W(-w / 2 + 0.2, -d / 2 + 0.2); const [bx, bz] = L2W(w / 2 - 0.2, d / 2 - 0.2); return [Math.min(ax, bx), Math.min(az, bz), Math.max(ax, bx), Math.max(az, bz)]; })(), gy + fh + 0.18);
        // stairs
        const steps = 10, sw = 1.1;
        for (let i = 0; i < steps; i++) {
          const sy = (i + 1) * fh / steps, sz = hz + holeD / 2 - (i + 0.5) * holeD / steps;
          wallBox(hx, sy - 0.07, sz, sw, 0.14, holeD / steps + 0.04, 0x6b5a42);

      const bg = RT.mergeGeos([
        RT.G.cyl(0.018, 0.026, 0.5, 5, 0x4a3c2c, { rz: Math.PI / 2, vary: 0.2 }),
        RT.G.cyl(0.012, 0.018, 0.3, 5, 0x453828, { x: 0.32, rz: Math.PI / 2 + 0.5, vary: 0.2 }),

    }

})();

/* helper: flatten terrain pad for a building */

/* ============================================================

RT.ai = (() => {

    enemies.length = 0; allies.length = 0;
  };

  A.spawnEnemy = function (x, z, opts) {
    opts = opts || {};

    const y = opts.y != null ? opts.y : RT.map.groundAt(x, z, 999);

    const e = {
      rig, x, z, y, home: { x, z }, group: opts.group || 'default',

      alertT: 0, lastKnown: null, cover: null, atCover: false,

    const g = new THREE.Group();

    const defs = names || [
      { name: 'MARSH', headgear: 'helmet', paletteIdx: 0 },
      { name: 'DOC', headgear: 'boonie', paletteIdx: 1 },
      { name: 'VANE', headgear: 'helmet', paletteIdx: 2 },

    defs.forEach((d, i) => {
      if (!spawns[i]) return;

      const y = RT.map.groundAt(spawns[i].x, spawns[i].z, 999);
      rig.group.position.set(spawns[i].x, y, spawns[i].z);
