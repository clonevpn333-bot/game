    for (let i = 0; i < 4; i++) {
      st.push(G.cyl(0.0095, 0.0095, 0.042, 8, 0x9e2f24, { x: -0.04, y: 0.012, z: -0.025 + i * 0.03, vary: 0.1 }));
      st.push(G.cyl(0.0098, 0.0098, 0.012, 8, 0xb99b52, { x: -0.04, y: -0.006, z: -0.025 + i * 0.03 }));
    }
    const staticMesh = RT.meshOf(st, RT.MAT.gun);
    // pump (action part - slides)
    const act = [G.cyl(0.019, 0.019, 0.13, 10, WOOD, { y: -0.008, z: -0.26, rx: Math.PI / 2, vary: 0.06 })];
    for (let i = 0; i < 6; i++) act.push(G.torus(0.0195, 0.002, 5, 10, adjc(WOOD, 0.8), { y: -0.008, z: -0.315 + i * 0.022 }));
    const action = RT.meshOf(act, RT.MAT.gun);
    return { staticMesh, mag: null, action, magHome: null, pump: true,
      muzzleZ: -0.54, sight: new THREE.Vector3(0, 0.045, 0), ejectPos: new THREE.Vector3(0.03, 0.01, 0.0),
      gripR: { pos: [0.012, -0.085, 0.105], rot: [-0.3, 0, -1.5] },
      gripL: { pos: [-0.008, -0.062, -0.25], rot: [1.5, 0, 0.15] } };
  }

  /* ---------- sidearm pistol ---------- */
  function buildPistol() {
    const st = [];
    st.push(G.cbox(0.03, 0.045, 0.15, 0.006, GM, { y: -0.012, z: -0.01 }));                    // frame
    st.push(G.cbox(0.03, 0.085, 0.05, 0.007, GM2, { y: -0.068, z: 0.045, rx: -0.28, vary: 0.05 })); // grip
    st.push(G.box(0.033, 0.03, 0.02, adjc(GM2, 1.2), { y: -0.05, z: 0.048, rx: -0.28 }));      // grip panel band
    st.push(G.box(0.008, 0.02, 0.036, GM2, { y: -0.045, z: -0.006 }));                         // trigger guard bottom
    st.push(G.box(0.008, 0.022, 0.006, GM2, { y: -0.036, z: -0.028 }));                        // guard front
    st.push(G.box(0.005, 0.018, 0.007, GM3, { y: -0.032, z: 0.0, rx: 0.15 }));                 // trigger
    st.push(G.box(0.018, 0.012, 0.014, GM2, { y: 0.012, z: 0.075, rx: 0.5 }));                 // hammer
    st.push(G.cyl(0.007, 0.007, 0.02, 8, GM3, { y: -0.005, z: -0.09, rx: Math.PI / 2 }));      // guide rod
    const staticMesh = RT.meshOf(st, RT.MAT.gun);
    // slide (reciprocates)
    const sl = [];
    sl.push(G.cbox(0.032, 0.032, 0.17, 0.006, adjc(GM, 1.12), { y: 0.022, z: -0.015 }));
    for (let i = 0; i < 6; i++) sl.push(G.box(0.034, 0.02, 0.004, GM2, { y: 0.022, z: 0.05 + i * 0.008 })); // serrations
    sl.push(G.box(0.006, 0.012, 0.008, GM2, { y: 0.044, z: 0.068 }));                          // rear sight
    sl.push(G.box(0.004, 0.01, 0.006, GM2, { y: 0.043, z: -0.09 }));                           // front sight
    sl.push(G.cyl(0.009, 0.009, 0.03, 8, GM3, { y: 0.018, z: -0.095, rx: Math.PI / 2 }));      // muzzle/barrel tip
    const action = RT.meshOf(sl, RT.MAT.gun);
    const mg = [G.cbox(0.024, 0.02, 0.04, 0.004, GM2, { y: -0.115, z: 0.052, rx: -0.28 })];    // visible baseplate
    const mag = RT.meshOf(mg, RT.MAT.gun);
    return { staticMesh, mag, action, magHome: mag.position.clone(), slide: true,
      muzzleZ: -0.11, sight: new THREE.Vector3(0, 0.044, 0), ejectPos: new THREE.Vector3(0.02, 0.03, 0.02),
      gripR: { pos: [0.014, -0.085, 0.06], rot: [-0.28, 0, -1.5] },
      gripL: { pos: [-0.018, -0.095, 0.055], rot: [-0.28, 0.1, 1.5] } };
  }

  /* ---------- first-person arm (hand at origin, forearm angled
   * down/back/outward toward an off-screen elbow) ---------- */
  function buildArm(side, skin, sleeve, gripRot) {
    const grp = new THREE.Group();
    const handGeos = RT.character.buildHand(skin, 1.0, side);
    handGeos.push(G.cyl(0.03, 0.036, 0.06, 10, skin, { y: 0.015 })); // wrist stub
    const hand = RT.meshOf(handGeos, RT.MAT.skin, false);
    hand.rotation.fromArray(gripRot);
    grp.add(hand);
    // forearm + rolled cuff + sleeve built along +y, then aimed at an
    // off-screen elbow in WEAPON space (independent of hand rotation)
    const armGeos = [];
    armGeos.push(G.cyl(0.032, 0.042, 0.22, 12, skin, { y: 0.13 }));
    armGeos.push(G.cyl(0.048, 0.052, 0.05, 12, adjc(sleeve, 0.94), { y: 0.255 }));
    armGeos.push(G.cyl(0.052, 0.06, 0.26, 12, sleeve, { y: 0.4, vary: 0.06 }));
    const arm = RT.meshOf(armGeos, RT.MAT.skin, false);
    const elbowDir = new THREE.Vector3(side * 0.35, -0.75, 0.58).normalize();
    arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), elbowDir);
    grp.add(arm);
    return grp;
  }

  /* ---------- weapon configs ---------- */
  const CFG = {
    m4: {
      name: 'M4A3 CARBINE', build: buildM4, auto: true, rpm: 720, dmg: 30, headMul: 2.2,
      mag: 30, reserve: 150, reloadT: 2.3, adsFov: 58, adsZ: -0.23,
      spreadHip: 0.03, spreadAds: 0.004, kick: 0.014, kickYaw: 0.005, vmKick: 0.03,
      hip: [0.16, -0.15, -0.35], sound: 'rifle', tracer: 3,
    },
    dmr: {
      name: 'MK14 DMR', build: buildDMR, auto: false, rpm: 220, dmg: 82, headMul: 3,
      mag: 10, reserve: 50, reloadT: 2.7, adsFov: 26, adsZ: -0.16, scope: true, bolt: true, boltT: 0.75,
      spreadHip: 0.05, spreadAds: 0.0012, kick: 0.045, kickYaw: 0.012, vmKick: 0.07,
      hip: [0.17, -0.16, -0.4], sound: 'dmr', tracer: 1,
    },
    shotgun: {
      name: 'M590 SHOTGUN', build: buildShotgun, auto: false, rpm: 70, dmg: 14, pellets: 8, headMul: 1.5,
      mag: 6, reserve: 42, reloadShell: 0.62, adsFov: 62, adsZ: -0.24, pump: true, pumpT: 0.62,
      spreadHip: 0.055, spreadAds: 0.04, kick: 0.05, kickYaw: 0.012, vmKick: 0.09,
      hip: [0.16, -0.15, -0.36], sound: 'shotgun', tracer: 0, range: 30,
    },
    pistol: {
      name: 'P9 SIDEARM', build: buildPistol, auto: false, rpm: 420, dmg: 34, headMul: 2.4,
      mag: 15, reserve: 90, reloadT: 1.8, adsFov: 66, adsZ: -0.28, slide: true,
      spreadHip: 0.025, spreadAds: 0.006, kick: 0.02, kickYaw: 0.007, vmKick: 0.045,
      hip: [0.15, -0.14, -0.3], sound: 'pistol', tracer: 0,
    },
  };
  W.CFG = CFG;

  /* ---------- state ---------- */
  const built = {};      // id -> assembly
  let vmRoot = null, cur = null, curId = null;
  let loadout = [];      // array of ids
  const ammo = {};       // id -> {mag, res}
  let adsK = 0, raiseK = 0, switchTo = null;
  let reloadT = -1, reloadStage = 0, shellsToLoad = 0;
  let cooldown = 0, pumpT = -1, boltT = -1, flashT = 0, slideBack = 0;
  let recP = 0, recY = 0, vmZ = 0, bobT = 0;
  const SKIN_FP = 0xb98e6d, SLEEVE_FP = 0x585c3c;
  W.state = () => ({ curId, adsK, ammo: ammo[curId], reloading: reloadT >= 0, raiseK });

  function assemble(id) {
    if (built[id]) return built[id];
    const cfg = CFG[id];
    const parts = cfg.build();
    const root = new THREE.Group();
    root.add(parts.staticMesh);
    if (parts.mag) root.add(parts.mag);
    if (parts.action) root.add(parts.action);
    if (parts.extra) parts.extra.forEach(e => root.add(e));
    parts.staticMesh.castShadow = false; parts.staticMesh.receiveShadow = false;
    // muzzle flash: 3 crossed additive planes + glow
    const fg = new THREE.Group();
    const fmat = new THREE.MeshBasicMaterial({ color: 0xffca66, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    for (let i = 0; i < 3; i++) {
      const p = new THREE.Mesh(starPlane(), fmat);
      p.rotation.z = i * Math.PI / 3;
      fg.add(p);
    }
    const sideP = new THREE.Mesh(starPlane(), fmat);
    sideP.rotation.y = Math.PI / 2; sideP.scale.setScalar(0.6);
    fg.add(sideP);
    fg.position.set(0, cfg.sight ? parts.sight.y - 0.06 : 0.02, parts.muzzleZ - 0.03);
    fg.position.y = id === 'pistol' ? 0.02 : 0.02;
    fg.visible = false;
    root.add(fg);
    // arms
    const armR = buildArm(1, SKIN_FP, SLEEVE_FP, parts.gripR.rot);
    armR.position.fromArray(parts.gripR.pos);
    const armL = buildArm(-1, SKIN_FP, SLEEVE_FP, parts.gripL.rot);
    armL.position.fromArray(parts.gripL.pos);
    root.add(armR); root.add(armL);
    root.traverse(o => { o.castShadow = false; o.receiveShadow = false; if (o.frustumCulled !== undefined) o.frustumCulled = false; });
    const asm = { root, cfg, parts, armR, armL, flash: fg,
      armLHome: armL.position.clone(), armRHome: armR.position.clone() };
    built[id] = asm;
    return asm;
  }
  function starPlane() {
    // 4-point star silhouette plane
    const sh = new THREE.Shape();
    const R = 0.09, r = 0.02;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU, rad = i % 2 === 0 ? R : r;
      const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
      if (i === 0) sh.moveTo(x, y); else sh.lineTo(x, y);
    }
    sh.closePath();
    return new THREE.ShapeGeometry(sh);
  }

  W.init = function () {
    vmRoot = new THREE.Group();
    RT.engine.camera.add(vmRoot);
  };

  W.setLoadout = function (ids, ammoOverride) {
    loadout = ids.slice();
    for (const id of ids) {
      if (!ammo[id] || ammoOverride) ammo[id] = { mag: CFG[id].mag, res: CFG[id].reserve };
    }
    if (!loadout.includes(curId)) equip(loadout[0], true);
  };
  W.giveAmmo = function (mult) {
    for (const id of loadout) { ammo[id].res = Math.min(CFG[id].reserve, ammo[id].res + Math.ceil(CFG[id].reserve * (mult || 0.5))); }
  };
  W.ammoOf = id => ammo[id];
  W.loadout = () => loadout;

  function equip(id, instant) {
    if (!id || (id === curId && !instant)) return;
    if (instant) {
      if (cur) vmRoot.remove(cur.root);
      const asm = assemble(id);
      vmRoot.add(asm.root);
      cur = asm; curId = id; raiseK = 1; switchTo = null;
      reloadT = -1; pumpT = -1; boltT = -1; cooldown = 0.2;
    } else if (curId !== id) {
      switchTo = id; reloadT = -1;
    }
  }
  W.equip = equip;

  /* recoil accessors for player camera */
  W.consumeRecoil = function () { const r = [recP, recY]; recP = 0; recY = 0; return r; };

  let semiLatch = false;
  W.update = function (dt, opts) {
    if (!cur) return;
    opts = opts || {};
    const cfg = cur.cfg;
    const I = RT.input;
    const am = ammo[curId];

    /* switching */
    for (let i = 0; i < loadout.length && i < 4; i++)
      if (I.pressed('Digit' + (i + 1)) && loadout[i] !== curId) equip(loadout[i]);
    if (I.wheel !== 0 && loadout.length > 1) {
      const d = Math.sign(I.wheel); I.wheel = 0;
      const idx = (loadout.indexOf(switchTo || curId) + d + loadout.length) % loadout.length;
      equip(loadout[idx]);
    } else I.wheel = 0;
    if (switchTo) {
      raiseK -= dt * 5;
      if (raiseK <= 0) { const t = switchTo; switchTo = null; equip(t, true); raiseK = 0; }
    } else if (raiseK < 1) raiseK = Math.min(1, raiseK + dt * 4);

    /* ADS */
    const wantAds = I.aim && !opts.sprinting && reloadT < 0 && !switchTo && raiseK > 0.9;
    adsK = damp(adsK, wantAds ? 1 : 0, 12, dt);
    const baseFov = RT.settings.fov;
    RT.engine.camera.fov = lerp(baseFov, cfg.adsFov, adsK * adsK * (3 - 2 * adsK));
    RT.engine.camera.updateProjectionMatrix();
    if (cfg.scope && RT.$('scope')) RT.$('scope').style.opacity = adsK > 0.82 ? 1 : 0;
    else if (RT.$('scope')) RT.$('scope').style.opacity = 0;

    /* cooldowns */
    cooldown -= dt;
    if (pumpT >= 0) {
      pumpT += dt;
      const k = pumpT / cfg.pumpT;
      if (k >= 1) pumpT = -1;
      else {
        const s = k < 0.4 ? smoothstep(0, 0.4, k) : 1 - smoothstep(0.5, 1, k);
        cur.parts.action.position.z = s * 0.09;
        if (k > 0.38 && k < 0.44 && !cur._pumpEject) { cur._pumpEject = true; ejectShell(true); }
        if (k > 0.5) cur._pumpEject = false;
      }
    }
    if (boltT >= 0) {
      boltT += dt;
      const k = boltT / cfg.boltT;
      if (k >= 1) { boltT = -1; cur.parts.action.position.z = 0; cur.parts.action.rotation.z = 0; }
      else {
        // lift, pull, push, drop
        const lift = smoothstep(0, 0.2, k) - smoothstep(0.75, 0.95, k);
        const pull = smoothstep(0.2, 0.45, k) - smoothstep(0.5, 0.75, k);
        cur.parts.action.rotation.z = -lift * 0.9;
        cur.parts.action.position.z = pull * 0.07;
        if (k > 0.45 && k < 0.52 && !cur._boltEject) { cur._boltEject = true; ejectShell(false); }
        if (k > 0.6) cur._boltEject = false;
      }
    }
    /* pistol slide */
    if (cfg.slide) {
      const targetSlide = (am.mag === 0 && reloadT < 0) ? 0.028 : slideBack;
      cur.parts.action.position.z = damp(cur.parts.action.position.z, targetSlide, 40, dt);
      slideBack = Math.max(0, slideBack - dt * 0.45);
    }

    /* fire */
    const canFire = cooldown <= 0 && reloadT < 0 && !switchTo && raiseK > 0.85 && pumpT < 0 && boltT < 0 && !opts.sprinting && !opts.dead;
    let firing = false;
    if (cfg.auto) firing = I.fire;
    else { firing = I.fire && !semiLatch; }
    semiLatch = I.fire;
    if (firing && canFire) {
      if (am.mag > 0) fireOnce(opts);
      else if (!cfg.auto) { RT.audio && RT.audio.dryClick(); cooldown = 0.25; if (am.res > 0) startReload(); }
      else { RT.audio && RT.audio.dryClick(); cooldown = 0.3; if (am.res > 0) startReload(); }
    }
    if (I.pressed('KeyR') && reloadT < 0 && am.mag < cfg.mag && am.res > 0 && !switchTo) startReload();

    /* reload animation */
    if (reloadT >= 0) updateReload(dt);

    /* flash lifetime */
    if (flashT > 0) {
      flashT -= dt;
      if (flashT <= 0) cur.flash.visible = false;
      else { cur.flash.rotation.z += 2.4; cur.flash.scale.setScalar(0.8 + Math.random() * 0.5); }
    }

    /* viewmodel motion: breathe + sway + bob + recoil + ads blend */
    const t = RT.engine.time;
    const speedF = opts.speedF || 0;
    bobT += dt * (4 + speedF * 6) * Math.min(1, speedF * 2);
    const breathe = Math.sin(t * 1.7) * 0.0016 * (1 - adsK * 0.85);
    const [mdx, mdy] = [opts.lookVelX || 0, opts.lookVelY || 0];
    const swayX = clamp(-mdx * 0.012, -0.02, 0.02) * (1 - adsK * 0.9);
    const swayY = clamp(mdy * 0.01, -0.018, 0.018) * (1 - adsK * 0.9);
    const bobX = Math.sin(bobT) * 0.009 * speedF * (1 - adsK * 0.9);
    const bobY = -Math.abs(Math.cos(bobT)) * 0.011 * speedF * (1 - adsK * 0.85);
    vmZ = Math.min(0, vmZ + dt * 0.35);

    const hip = cfg.hip;
    const sight = cur.parts.sight;
    const adsPos = [-sight.x, -sight.y, cfg.adsZ];
    const k2 = adsK * adsK * (3 - 2 * adsK);
    const px = lerp(hip[0], adsPos[0], k2) + swayX + bobX + breathe * 0.4;
    const py = lerp(hip[1], adsPos[1], k2) + swayY + bobY + breathe;
    const pz = lerp(hip[2], adsPos[2], k2) + vmZ;
    /* sprint + raise/lower pose */
    const lowerK = 1 - raiseK;
    const sprintK = damp(cur._sprintK || 0, opts.sprinting ? 1 : 0, 8, dt);
    cur._sprintK = sprintK;
    const rl = cur._reloadPose || { rx: 0, rz: 0, y: 0 };
    cur.root.position.set(px + sprintK * -0.06, py - lowerK * 0.45 - sprintK * 0.07 + rl.y, pz + sprintK * 0.06);
    cur.root.rotation.set(
      -vmZ * 2.2 + lowerK * 0.9 + sprintK * 0.55 + swayY * 1.4 + rl.rx,
      swayX * 1.6 + sprintK * 0.4,
      sprintK * 0.25 + swayX * 0.8 + rl.rz);
    RT.hud && RT.hud.setCrosshairSpread(currentSpread(opts) * 900, adsK);
  };

  function currentSpread(opts) {
    const cfg = cur.cfg;
    let s = lerp(cfg.spreadHip, cfg.spreadAds, adsK);
    s *= 1 + (opts && opts.speedF || 0) * 1.6;
    return s;
  }
  W.currentSpread = currentSpread;

  const _dir = new THREE.Vector3(), _org = new THREE.Vector3(), _tmp = new THREE.Vector3();
  function fireOnce(opts) {
    const cfg = cur.cfg, am = ammo[curId];
    am.mag--;
    cooldown = 60 / cfg.rpm;
    /* recoil */
    recP += cfg.kick * (0.85 + Math.random() * 0.3);
    recY += cfg.kickYaw * (Math.random() - 0.42);
    vmZ -= cfg.vmKick;
    RT.engine.shake(cfg.pellets ? 0.16 : 0.07);
    /* flash + light */
    cur.flash.visible = true; flashT = 0.045;
    cur.flash.rotation.z = Math.random() * TAU;
    const mw = _tmp.set(0, 0.02, cur.parts.muzzleZ);
    cur.root.localToWorld(mw);
    RT.engine.flash(mw, 0xffb050, cfg.pellets ? 3.4 : 2.2, 13, 0.06);
    /* shots */
    const cam = RT.engine.camera;
    cam.getWorldDirection(_dir);
    _org.setFromMatrixPosition(cam.matrixWorld);
    const n = cfg.pellets || 1;
    const spread = currentSpread(opts);
    for (let i = 0; i < n; i++) {
      const d = _dir.clone();
      d.x += (Math.random() - 0.5) * 2 * spread;
      d.y += (Math.random() - 0.5) * 2 * spread;
      d.z += (Math.random() - 0.5) * 2 * spread * 0.4;
      d.normalize();
      if (RT.combat) RT.combat.playerShot(_org, d, cfg, mw);
    }
    if (RT.audio) RT.audio.gunshot(cfg.sound);
    /* action cycling */
    if (cfg.pump) { pumpT = 0.12; cur._pumpEject = false; }
    else if (cfg.bolt) { if (am.mag > 0) { boltT = 0.1; cur._boltEject = false; } else ejectShell(false); }
    else if (cfg.slide) { slideBack = 0.026; ejectShell(false); }
    else ejectShell(false);
    if (am.mag === 0 && am.res > 0 && cfg.auto) setTimeout(() => { if (reloadT < 0 && ammo[curId].mag === 0) startReload(); }, 350);
  }

  /* ---------- shell casings (pooled meshes with physics) ---------- */
  const shells = [];
  function getShellPool() {
    if (shells.length) return;
    const brassG = RT.mergeGeos([G.cyl(0.005, 0.0055, 0.028, 6, 0xc9a552, {})]);
    const redG = RT.mergeGeos([G.cyl(0.0095, 0.0095, 0.05, 6, 0x9e2f24, {}), G.cyl(0.0098, 0.0098, 0.014, 6, 0xb99b52, { y: -0.02 })]);
    for (let i = 0; i < 22; i++) {
      const m = new THREE.Mesh(i % 4 === 3 ? redG : brassG, RT.MAT.gun);
      m.visible = false;
      RT.engine.scene.add(m);
      shells.push({ m, red: i % 4 === 3, life: 0, v: new THREE.Vector3(), w: new THREE.Vector3() });
    }
  }
  function ejectShell(isShotgun) {
    getShellPool();
    let s = shells.find(x => !x.m.visible && (!!x.red === !!isShotgun));
    if (!s) s = shells.find(x => !x.m.visible);
    if (!s) return;
    const ep = _tmp.copy(cur.parts.ejectPos);
    cur.root.localToWorld(ep);
    s.m.visible = true; s.life = 3;
    s.m.position.copy(ep);
    const cam = RT.engine.camera;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cam.quaternion);
    const up = new THREE.Vector3(0, 1, 0);
    s.v.copy(right).multiplyScalar(1.2 + Math.random() * 0.8).addScaledVector(up, 1.6 + Math.random()).addScaledVector(new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 2), -0.3);
    s.w.set(Math.random() * 20 - 10, Math.random() * 20 - 10, Math.random() * 20 - 10);
    s.m.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  }
  W.updateShells = function (dt) {
    for (const s of shells) {
      if (!s.m.visible) continue;
      s.life -= dt;
      if (s.life <= 0) { s.m.visible = false; continue; }
      s.v.y -= 9.8 * dt;
      s.m.position.addScaledVector(s.v, dt);
      s.m.rotation.x += s.w.x * dt; s.m.rotation.z += s.w.z * dt;
      const gy = (RT.map && RT.map.heightAt ? RT.map.heightAt(s.m.position.x, s.m.position.z) : 0) + 0.012;
      if (s.m.position.y < gy) {
        s.m.position.y = gy;
        if (Math.abs(s.v.y) > 0.4) { s.v.y = -s.v.y * 0.32; s.v.x *= 0.6; s.v.z *= 0.6; if (RT.audio) RT.audio.shellTink(); }
        else { s.v.set(0, 0, 0); s.w.set(0, 0, 0); s.m.rotation.x = Math.PI / 2; }
      }
    }
  };

  /* ---------- reload ---------- */
  function startReload() {
    const cfg = cur.cfg, am = ammo[curId];
    if (am.res <= 0 || am.mag >= cfg.mag) return;
    if (cfg.pump) {
      shellsToLoad = Math.min(cfg.mag - am.mag, am.res);
      reloadT = 0; reloadStage = 0;
    } else {
      reloadT = 0;
      cur._magDropped = false; cur._magBack = false;
    }
    if (RT.audio) RT.audio.reloadStart();
  }
  W.startReload = startReload;

  function updateReload(dt) {
    const cfg = cur.cfg, am = ammo[curId];
    if (cfg.pump) { // shell-by-shell
      reloadT += dt;
      const per = cfg.reloadShell;
      const k = (reloadT % per) / per;
      // weapon tilts, left hand pushes shells from below
      const tl = Math.sin(Math.min(1, reloadT * 3) * Math.PI / 2);
      cur._reloadPose = { rx: tl * 0.12, rz: tl * 0.4, y: -tl * 0.03 };
      cur.armL.position.y = cur.armLHome.y - 0.1 + 0.1 * Math.sin(k * Math.PI);
      cur.armL.position.z = cur.armLHome.z + 0.14 - 0.05 * Math.sin(k * Math.PI);
      if (k > 0.55 && !cur._shellFed) {
        cur._shellFed = true;
        am.mag++; am.res--; shellsToLoad--;
        if (RT.audio) RT.audio.shellLoad();
      }
      if (k < 0.5) cur._shellFed = false;
      if (shellsToLoad <= 0 || am.res <= 0 || am.mag >= cfg.mag) {
        reloadT = -1;
        cur._reloadPose = null;
        cur.armL.position.copy(cur.armLHome);
        if (pumpT < 0 && !cur._chambered) { pumpT = 0; }
      }
      return;
    }
    reloadT += dt;
    const T = cfg.reloadT, k = reloadT / T;
    const mag = cur.parts.mag;
    if (k >= 1) {
      reloadT = -1;
      const take = Math.min(cfg.mag - am.mag, am.res);
      am.mag += take; am.res -= take;
      if (mag) { mag.position.copy(cur.parts.magHome); mag.visible = true; }
      cur.armL.position.copy(cur.armLHome);
      cur._reloadPose = null;
      return;
    }
    // stage motions
    const tilt = Math.sin(Math.min(k / 0.15, 1) * Math.PI / 2) * (1 - smoothstep(0.85, 1, k));
    cur._reloadPose = { rx: tilt * 0.14, rz: tilt * 0.38, y: -tilt * 0.02 };
    if (mag) {
      if (k > 0.16 && k < 0.45) { // mag out & falls
        if (!cur._magDropped) {
          cur._magDropped = true;
          spawnFallingMag(mag);
          mag.visible = false;
          if (RT.audio) RT.audio.magOut();
        }
      } else if (k >= 0.55 && k < 0.92) { // new mag rides hand up
        mag.visible = true;
        const rise = smoothstep(0.55, 0.8, k);
        mag.position.copy(cur.parts.magHome);
        mag.position.y -= (1 - rise) * 0.22;
        mag.position.z += (1 - rise) * 0.05;
        if (!cur._magBack && rise >= 1) { cur._magBack = true; if (RT.audio) RT.audio.magIn(); }
      }
      // left hand follows mag
      if (k > 0.16 && k < 0.92) {
        const hk = k < 0.45 ? smoothstep(0.16, 0.3, k) : 1 - smoothstep(0.55, 0.85, k);
        cur.armL.position.y = cur.armLHome.y - hk * 0.24;
        cur.armL.position.z = cur.armLHome.z + hk * 0.22;
      } else cur.armL.position.copy(cur.armLHome);
    }
    // action gesture at the end (bolt release / slide rack)
    if (k > 0.9 && cur.parts.action && !cfg.bolt) {
      const ak = smoothstep(0.9, 0.94, k) - smoothstep(0.95, 1, k);
      cur.parts.action.position.z = ak * (cfg.slide ? 0.028 : 0.03);
      if (!cur._rack && k > 0.94) { cur._rack = true; if (RT.audio) RT.audio.boltRack(); }
    } else cur._rack = false;
  }

  function spawnFallingMag(mag) {
    const clone = new THREE.Mesh(mag.geometry, mag.material);
    const wp = new THREE.Vector3(); mag.getWorldPosition(wp);
    const wq = new THREE.Quaternion(); mag.getWorldQuaternion(wq);
    clone.position.copy(wp); clone.quaternion.copy(wq);
    RT.engine.scene.add(clone);
    const v = new THREE.Vector3((Math.random() - 0.5) * 0.4, -0.5, (Math.random() - 0.5) * 0.4);
    let life = 2.5;
    (RT.transients = RT.transients || []).push((dt2) => {
      life -= dt2;
      v.y -= 9.8 * dt2;
      clone.position.addScaledVector(v, dt2);
      clone.rotation.x += 3 * dt2;
      const gy = (RT.map && RT.map.heightAt ? RT.map.heightAt(clone.position.x, clone.position.z) : 0) + 0.03;
      if (clone.position.y < gy) { clone.position.y = gy; v.set(0, 0, 0); clone.rotation.x = Math.PI / 2; }
      if (life <= 0) { RT.engine.scene.remove(clone); return false; }
      return true;
    });
  }

  return W;
})();


/* ==================== 06_world.js ==================== */
/* ============================================================
 * World: heightmapped terrain, house construction system with
 * enterable interiors + war damage, clutter factory, map builder
 * with colliders / cover points / walkable platforms.
 * ============================================================ */

/* ---------------- Terrain ---------------- */
RT.Terrain = class {
  /* opts: {size, segs, seed, amp, palette:{lush,dirt,rock}, roads:[[x,z]...],
   *        flats:[{x,z,r}], craters:[{x,z,r,d}], riverPath, riverDepth, riverWidth} */
  constructor(opts) {
    this.size = opts.size || 400;
    this.segs = opts.segs || 128;
    this.opts = opts;
    const S = this.segs + 1;
    this.grid = new Float32Array(S * S);
    const rnd = RNG(opts.seed || 7);
    const off1 = rnd() * 100, off2 = rnd() * 100;
    const amp = opts.amp != null ? opts.amp : 6;
    for (let iz = 0; iz < S; iz++) {
      for (let ix = 0; ix < S; ix++) {
        const x = (ix / this.segs - 0.5) * this.size;
        const z = (iz / this.segs - 0.5) * this.size;
        let h = RT.fbm(x * 0.008 + off1, z * 0.008 + off1, 4, 2.1, 0.5) * amp;
        h += RT.fbm(x * 0.035 + off2, z * 0.035 + off2, 3, 2, 0.5) * amp * 0.22;
        // gentle bowl rim so map edges rise (natural boundary)
        const edge = Math.max(Math.abs(x), Math.abs(z)) / (this.size / 2);
        h += smoothstep(0.78, 1.0, edge) * (opts.rim != null ? opts.rim : 14);
        this.grid[iz * S + ix] = h;
      }
    }
    if (opts.riverPath) this._carveRiver(opts.riverPath, opts.riverWidth || 14, opts.riverDepth || 5);
    if (opts.roads) for (const r of opts.roads) this._carveRoad(r, opts.roadWidth || 5);
    if (opts.flats) for (const f of opts.flats) this._flatten(f.x, f.z, f.r, f.h);
    if (opts.craters) for (const c of opts.craters) this._crater(c.x, c.z, c.r, c.d);
    /* mesh is built in MapBuilder.finalize(), after building pads are flattened */
  }
  _idx(ix, iz) { const S = this.segs + 1; return clamp(iz, 0, this.segs) * S + clamp(ix, 0, this.segs); }
  _worldToGrid(x, z) { return [(x / this.size + 0.5) * this.segs, (z / this.size + 0.5) * this.segs]; }
  _flatten(x, z, r, hOverride) {
    const [gx, gz] = this._worldToGrid(x, z);
    const gr = r / this.size * this.segs;
    const base = hOverride != null ? hOverride : this.grid[this._idx(Math.round(gx), Math.round(gz))];
    for (let iz = Math.floor(gz - gr * 2); iz <= Math.ceil(gz + gr * 2); iz++)
      for (let ix = Math.floor(gx - gr * 2); ix <= Math.ceil(gx + gr * 2); ix++) {
        const d = Math.hypot(ix - gx, iz - gz) / gr;
        if (d < 2) {
          const k = smoothstep(2, 0.85, d);
          const i = this._idx(ix, iz);
          this.grid[i] = lerp(this.grid[i], base, k);
        }
      }
    return base;
  }
  _crater(x, z, r, depth) {
    const [gx, gz] = this._worldToGrid(x, z);
    const gr = r / this.size * this.segs;
    for (let iz = Math.floor(gz - gr * 1.6); iz <= Math.ceil(gz + gr * 1.6); iz++)
      for (let ix = Math.floor(gx - gr * 1.6); ix <= Math.ceil(gx + gr * 1.6); ix++) {
        const d = Math.hypot(ix - gx, iz - gz) / gr;
        const i = this._idx(ix, iz);
        if (d < 1) this.grid[i] -= Math.cos(d * Math.PI / 2) * depth;
        else if (d < 1.5) this.grid[i] += (1.5 - d) * depth * 0.28; // rim lip
        if (d < 0.85) (this.scorch = this.scorch || []).push([ix, iz]);
      }
  }
  _carveRoad(path, width) {
    this.roadCells = this.roadCells || new Set();
    for (let s = 0; s < path.length - 1; s++) {
      const [x0, z0] = path[s], [x1, z1] = path[s + 1];
      const len = Math.hypot(x1 - x0, z1 - z0);
      const steps = Math.ceil(len / (this.size / this.segs) * 1.6);
      for (let i = 0; i <= steps; i++) {
        const x = lerp(x0, x1, i / steps), z = lerp(z0, z1, i / steps);
        const [gx, gz] = this._worldToGrid(x, z);
        const gr = width / this.size * this.segs;
        const h = this.grid[this._idx(Math.round(gx), Math.round(gz))];
        for (let iz = Math.floor(gz - gr * 2.2); iz <= Math.ceil(gz + gr * 2.2); iz++)
          for (let ix = Math.floor(gx - gr * 2.2); ix <= Math.ceil(gx + gr * 2.2); ix++) {
            const d = Math.hypot(ix - gx, iz - gz) / gr;
            if (d < 2.2) {
              const idx2 = this._idx(ix, iz);
              this.grid[idx2] = lerp(this.grid[idx2], h, smoothstep(2.2, 0.7, d) * 0.85);
              if (d < 1) this.roadCells.add(idx2);
            }
          }
      }
    }
  }
  _carveRiver(path, width, depth) {
    this.waterCells = new Set();
    for (let s = 0; s < path.length - 1; s++) {
      const [x0, z0] = path[s], [x1, z1] = path[s + 1];
      const len = Math.hypot(x1 - x0, z1 - z0);
      const steps = Math.ceil(len / (this.size / this.segs) * 1.6);
      for (let i = 0; i <= steps; i++) {
        const x = lerp(x0, x1, i / steps), z = lerp(z0, z1, i / steps);
        const [gx, gz] = this._worldToGrid(x, z);
        const gr = width / this.size * this.segs;
        for (let iz = Math.floor(gz - gr * 2.5); iz <= Math.ceil(gz + gr * 2.5); iz++)
          for (let ix = Math.floor(gx - gr * 2.5); ix <= Math.ceil(gx + gr * 2.5); ix++) {
            const d = Math.hypot(ix - gx, iz - gz) / gr;
            if (d < 2.5) {
              const idx2 = this._idx(ix, iz);
              const dig = Math.cos(Math.min(1, d / 1.4) * Math.PI / 2) * depth;
              this.grid[idx2] = Math.min(this.grid[idx2], this.grid[idx2] - dig + (d > 1.4 ? (d - 1.4) * depth * 0.5 : 0));
              if (d < 1) this.waterCells.add(idx2);
            }
          }
      }
    }
  }
  heightAt(x, z) {
    const [gx, gz] = this._worldToGrid(x, z);
    const x0 = Math.floor(gx), z0 = Math.floor(gz);
    const fx = gx - x0, fz = gz - z0;
    const h00 = this.grid[this._idx(x0, z0)], h10 = this.grid[this._idx(x0 + 1, z0)];
    const h01 = this.grid[this._idx(x0, z0 + 1)], h11 = this.grid[this._idx(x0 + 1, z0 + 1)];
    return lerp(lerp(h00, h10, fx), lerp(h01, h11, fx), fz);
  }
  _buildMesh(pal) {
    const S = this.segs + 1;
    const geo = new THREE.PlaneGeometry(this.size, this.size, this.segs, this.segs);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const cols = new Float32Array(pos.count * 3);
    const lush = RT.lin(pal.lush || 0x5d6b38);
    const lush2 = RT.lin(pal.lush2 || 0x6e7a42);
    const dirt = RT.lin(pal.dirt || 0x77664a);
    const rock = RT.lin(pal.rock || 0x74705f);
    const road = RT.lin(pal.road || 0x6d6354);
    const scorchC = RT.lin(0x2e2a24);
    const c = new THREE.Color();
    const scorchSet = new Set((this.scorch || []).map(([ix, iz]) => this._idx(ix, iz)));
    for (let i = 0; i < pos.count; i++) {
      const ix = i % S, iz = Math.floor(i / S);
      const h = this.grid[iz * S + ix];
      pos.setY(i, h);
      // slope from neighbors
      const hx = this.grid[this._idx(ix + 1, iz)] - this.grid[this._idx(ix - 1, iz)];
      const hz = this.grid[this._idx(ix, iz + 1)] - this.grid[this._idx(ix, iz - 1)];
      const slope = Math.min(1, Math.hypot(hx, hz) * 0.55);
      const n = RT.noise(ix * 0.35, iz * 0.35) * 0.5 + 0.5;
      c.copy(lush).lerp(lush2, n);
      c.lerp(dirt, smoothstep(0.25, 0.7, slope + RT.noise(ix * 0.13, iz * 0.13) * 0.18));
      c.lerp(rock, smoothstep(0.55, 0.95, slope));
      const gi = iz * S + ix;
      if (this.roadCells && this.roadCells.has(gi)) c.copy(road).multiplyScalar(0.92 + n * 0.16);
      if (this.waterCells && this.waterCells.has(gi)) c.multiplyScalar(0.6);
      if (scorchSet.has(gi)) c.lerp(scorchC, 0.5);
      const vr = 0.93 + RT.noise(ix * 1.7, iz * 1.7) * 0.12;
      cols[i * 3] = c.r * vr; cols[i * 3 + 1] = c.g * vr; cols[i * 3 + 2] = c.b * vr;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    geo.computeVertexNormals();
    this.mesh = new THREE.Mesh(geo, RT.MAT.std);
    this.mesh.receiveShadow = true;
    this.mesh.castShadow = false;
  }
};

/* ---------------- Map builder ---------------- */
RT.MapBuilder = class {
  constructor(terrain, seed) {
    this.terrain = terrain;
    this.rnd = RNG(seed || 42);
    this.static = [];        // merged world geometry buckets
    this.colliders = [];     // {min:{x,y,z}, max:{x,y,z}, door?:ref}
    this.platforms = [];     // walkable {x0,z0,x1,z1,y}
    this.cover = [];         // {x,z,y, dir:{x,z}, low:bool}
    this.doors = [];         // {pivot, open, closed collider}
    this.interact = [];      // {x,z,y,r, label, fn, once}
    this.waypointObjs = [];
    this.group = new THREE.Group();
    this.buckets = { std: [], wood: [] };
  }
  h(x, z) { return this.terrain.heightAt(x, z); }
  addGeo(geo) { this.buckets.std.push(geo); }
  box(w, h, d, c, o) { this.buckets.std.push(RT.G.box(w, h, d, c, o)); }
  collide(x, y, z, w, h, d) {
    this.colliders.push({ min: { x: x - w / 2, y: y - h / 2, z: z - d / 2 }, max: { x: x + w / 2, y: y + h / 2, z: z + d / 2 } });
    return this.colliders[this.colliders.length - 1];
  }
  collideRot(cx, cy, cz, w, h, d, ry) {
    // approximate rotated box with AABB (fine for near-axis) or split into strips for long walls
    if (Math.abs(Math.sin(ry)) < 0.05 || Math.abs(Math.cos(ry)) < 0.05) {
      const along = Math.abs(Math.cos(ry)) > 0.5 ? [w, d] : [d, w];
      return this.collide(cx, cy, cz, along[0], h, along[1]);
    }
    const steps = Math.max(1, Math.ceil(w / 1.2));
    const cs = Math.cos(ry), sn = Math.sin(ry);
    for (let i = 0; i < steps; i++) {
      const t = (i + 0.5) / steps - 0.5;
      this.collide(cx + cs * t * w, cy, cz - sn * t * w, w / steps + d, h, w / steps + d);
    }
  }
  addCover(x, z, dirX, dirZ, low) {
    this.cover.push({ x, z, y: this.h(x, z), dir: { x: dirX, z: dirZ }, low: !!low, claimed: null });
  }
  platform(x0, z0, x1, z1, y) { this.platforms.push({ x0: Math.min(x0, x1), z0: Math.min(z0, z1), x1: Math.max(x0, x1), z1: Math.max(z0, z1), y }); }

  /* ground height incl. platforms (for player/AI standing) */
  groundAt(x, z, feetY) {
    let g = this.terrain.heightAt(x, z);
    for (const p of this.platforms) {
      if (x >= p.x0 && x <= p.x1 && z >= p.z0 && z <= p.z1 && p.y <= feetY + 0.55 && p.y > g) g = p.y;
    }
    return g;
  }

  /* segment raycast vs colliders + terrain. returns {dist, point, normal} or null */
  raycast(ox, oy, oz, dx, dy, dz, maxDist, skipDoors) {
    let best = maxDist, bestN = null;
    for (const c of this.colliders) {
      if (c.disabled) continue;
      let tmin = 0, tmax = best, nx = 0, ny = 0, nz = 0;
      let hit = true;
      const o = [ox, oy, oz], d = [dx, dy, dz], mn = [c.min.x, c.min.y, c.min.z], mx = [c.max.x, c.max.y, c.max.z];
      let axis = -1, sign = 0;
      for (let a = 0; a < 3; a++) {
        if (Math.abs(d[a]) < 1e-8) {
          if (o[a] < mn[a] || o[a] > mx[a]) { hit = false; break; }
        } else {
          let t1 = (mn[a] - o[a]) / d[a], t2 = (mx[a] - o[a]) / d[a];
          let s = -1;
          if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; s = 1; }
          if (t1 > tmin) { tmin = t1; axis = a; sign = s; }
          if (t2 < tmax) tmax = t2;
          if (tmin > tmax) { hit = false; break; }
        }
      }
      if (hit && tmin > 0.01 && tmin < best) {
        best = tmin;
        nx = ny = nz = 0;
        if (axis === 0) nx = sign; else if (axis === 1) ny = sign; else nz = sign;
        bestN = { x: nx, y: ny, z: nz };
      }
    }
    // terrain march
    let t = 1, lastH = oy - this.terrain.heightAt(ox, oz);
    const step = 1.4;
    while (t < best) {
      const px = ox + dx * t, py = oy + dy * t, pz = oz + dz * t;
      if (Math.abs(px) > this.terrain.size / 2 || Math.abs(pz) > this.terrain.size / 2) break;
      const dh = py - this.terrain.heightAt(px, pz);
      if (dh <= 0) {
        // refine between t-step and t
        let lo = Math.max(0, t - step), hi = t;
        for (let i = 0; i < 5; i++) {
          const mid = (lo + hi) / 2;
          const mh = (oy + dy * mid) - this.terrain.heightAt(ox + dx * mid, oz + dz * mid);
          if (mh > 0) lo = mid; else hi = mid;
        }
        if (hi < best) { best = hi; bestN = { x: 0, y: 1, z: 0, terrain: true }; }
        break;
      }
      t += Math.max(0.35, Math.min(step, dh * 1.8));
      lastH = dh;
    }
    if (!bestN || best >= maxDist) return null;
    return { dist: best, point: { x: ox + dx * best, y: oy + dy * best, z: oz + dz * best }, normal: bestN };
  }

  finalize() {
    this.terrain._buildMesh(this.terrain.opts.palette || {});
    this.group.add(this.terrain.mesh);
    if (this.buckets.std.length) {
      // chunk merge for frustum culling: 3x3 grid
      const chunks = {};
      const cs = this.terrain.size / 3;
      for (const g of this.buckets.std) {
        g.computeBoundingSphere();
        const c = g.boundingSphere.center;
        const key = Math.floor((c.x + this.terrain.size / 2) / cs) + '_' + Math.floor((c.z + this.terrain.size / 2) / cs);
        (chunks[key] = chunks[key] || []).push(g);
      }
      for (const key in chunks) {
        const m = RT.meshOf(RT.mergeGeos(chunks[key]), RT.MAT.std);
        this.group.add(m);
      }
      this.buckets.std = [];
    }
    return this.group;
  }
};

/* ---------------- Prop & building factory ---------------- */
RT.props = (() => {
  const P = {};
  const G = RT.G;
  function adjc(hex, mul) { const c = new THREE.Color(hex); c.multiplyScalar(mul); return c.getHex(); }

  /* ---------- house construction system ----------
   * o: {x,z,ry, w,d, floors, roof:'gable'|'hip'|'flat', wallC, roofC, trimC,
   *     damage:0-2, interior:true, ajar, stairs, porch} */
  P.house = function (B, o) {
    const rnd = RNG((o.seed != null ? o.seed : (o.x * 131 + o.z * 17)) | 0);
    const w = o.w || rnd.range(7, 10), d = o.d || rnd.range(6, 9);
    const floors = o.floors || 1;
    const fh = 2.75;                       // per-floor height
    const H = floors * fh;
    const wallC = o.wallC != null ? o.wallC : rnd.pick([0xb5a68c, 0xa89a80, 0x9d8f78, 0xb8a998, 0x8f8064]);
    const trimC = o.trimC != null ? o.trimC : adjc(wallC, 0.72);
    const roofC = o.roofC != null ? o.roofC : rnd.pick([0x6e4434, 0x5c4a3a, 0x536052, 0x62555e]);
    const dmg = o.damage || 0;
    const T = 0.24;                        // wall thickness
    const gy = B.terrain instanceof RT.Terrain ? B._flattenFor(o, w, d) : 0;
    const cs = Math.cos(o.ry || 0), sn = Math.sin(o.ry || 0);
    const L2W = (lx, lz) => [o.x + lx * cs + lz * sn, o.z - lx * sn + lz * cs];
    const geos = [];
    const woodC = 0x5e4630;

    /* geometry is built in LOCAL space (origin = house center at ground),
     * then rotated/translated once at the end */
    const wallBox = (lx, ly, lz, ww, hh, dd, col) => {
      geos.push(G.box(ww, hh, dd, col || wallC, { x: lx, y: ly, z: lz, vary: 0.05 }));
    };
    const solid = (lx, ly, lz, ww, hh, dd) => {
      const [wx, wz] = L2W(lx, lz);
      B.collideRot(wx, gy + ly, wz, ww, hh, dd, o.ry || 0);
    };

    /* one exterior wall with openings.
     * axis: 'x' (wall runs along x) or 'z'; sign: which side.
     * openings: [{c:center along wall, w, type:'door'|'win', broken}] */
    const mkWall = (axis, sign, openings) => {
      const len = axis === 'x' ? w : d;
      const off = (axis === 'x' ? d : w) / 2 - T / 2;
      const place = (c, ww, y0, y1, col) => {
        const mid = (y0 + y1) / 2, hh = y1 - y0;
        if (hh <= 0.01 || ww <= 0.01) return;
        if (axis === 'x') { wallBox(c, mid, off * sign, ww, hh, T, col); solid(c, mid, off * sign, ww, hh, T); }
        else { wallBox(off * sign, mid, c, T, hh, ww, col); solid(off * sign, mid, c, T, hh, ww); }
      };
      const sorted = (openings || []).slice().sort((a, b) => a.c - b.c);
      let cursor = -len / 2;
      for (const op of sorted) {
        const x0 = op.c - op.w / 2, x1 = op.c + op.w / 2;
        place((cursor + x0) / 2, x0 - cursor, 0, H);            // segment before opening
        if (op.type === 'door') {
          place(op.c, op.w, 2.15, H);                            // lintel above door
        } else {
          const sy0 = op.y0 != null ? op.y0 : 0.95, sy1 = op.y1 != null ? op.y1 : 2.15;
          place(op.c, op.w, 0, sy0);                             // below sill
          place(op.c, op.w, sy1, H);                             // above lintel
          // window frame + cross bar
          const fr = trimC;
          if (axis === 'x') {
            wallBox(op.c - op.w / 2 + 0.04, (sy0 + sy1) / 2, off * sign, 0.08, sy1 - sy0, T + 0.06, fr);
            wallBox(op.c + op.w / 2 - 0.04, (sy0 + sy1) / 2, off * sign, 0.08, sy1 - sy0, T + 0.06, fr);
            wallBox(op.c, sy0 + 0.04, off * sign, op.w, 0.08, T + 0.09, fr);
            wallBox(op.c, sy1 - 0.04, off * sign, op.w, 0.08, T + 0.06, fr);
            if (!op.broken) wallBox(op.c, (sy0 + sy1) / 2, off * sign, 0.05, sy1 - sy0 - 0.1, 0.04, 0x2d3438);
            else wallBox(op.c - op.w * 0.2, sy0 + 0.3, off * sign, 0.05, 0.5, 0.04, 0x2d3438);
            // shutters (some crooked)
            if (op.shutter) {
              wallBox(op.c - op.w / 2 - 0.24, (sy0 + sy1) / 2 - (op.crooked ? 0.15 : 0), off * sign + sign * 0.05, 0.4, sy1 - sy0 - 0.15, 0.05, adjc(roofC, 0.85));
              if (!op.crooked) wallBox(op.c + op.w / 2 + 0.24, (sy0 + sy1) / 2, off * sign + sign * 0.05, 0.4, sy1 - sy0 - 0.15, 0.05, adjc(roofC, 0.85));
            }
          } else {
            wallBox(off * sign, (sy0 + sy1) / 2, op.c - op.w / 2 + 0.04, T + 0.06, sy1 - sy0, 0.08, fr);
            wallBox(off * sign, (sy0 + sy1) / 2, op.c + op.w / 2 - 0.04, T + 0.06, sy1 - sy0, 0.08, fr);
            wallBox(off * sign, sy0 + 0.04, op.c, T + 0.09, 0.08, op.w, fr);
            wallBox(off * sign, sy1 - 0.04, op.c, T + 0.06, 0.08, op.w, fr);
            if (!op.broken) wallBox(off * sign, (sy0 + sy1) / 2, op.c, 0.04, sy1 - sy0 - 0.1, 0.05, 0x2d3438);
          }
          if (axis === 'x') solid(op.c, sy0 / 2, off * sign, op.w, sy0, T); else solid(off * sign, sy0 / 2, op.c, T, sy0, op.w);
        }
        cursor = x1;
      }
      place((cursor + len / 2) / 2, len / 2 - cursor, 0, H);     // tail segment
      // door meshes on hinge pivots
      for (const op of sorted) {
        if (op.type !== 'door') continue;
        const dw = op.w - 0.08;
        const doorGeos = [G.box(dw, 2.06, 0.07, op.doorC || woodC, { x: dw / 2, y: 1.03, vary: 0.1 }),
          G.box(dw - 0.16, 0.7, 0.09, adjc(op.doorC || woodC, 0.85), { x: dw / 2, y: 1.55 }),
          G.box(dw - 0.16, 0.7, 0.09, adjc(op.doorC || woodC, 0.85), { x: dw / 2, y: 0.55 }),
          G.sph(0.035, 8, 6, 0x8a8578, { x: dw - 0.12, y: 1.02, z: 0.06 })];
        const doorMesh = RT.meshOf(doorGeos, RT.MAT.std);
        const pivot = new THREE.Object3D();
        let wx, wz, wry = o.ry || 0;
        if (axis === 'x') { [wx, wz] = L2W(op.c - dw / 2, off * sign); }
        else { [wx, wz] = L2W(off * sign, op.c - dw / 2); wry += Math.PI / 2; }
        pivot.position.set(wx, gy, wz);
        pivot.rotation.y = wry;
        pivot.add(doorMesh);
        B.group.add(pivot);
        const doorCol = { min: {}, max: {}, disabled: false };
        const updateCol = () => {
          const a = pivot.rotation.y - wry; // open angle
          const ex = Math.cos(a) * dw, ez = -Math.sin(a) * dw;
          const p1x = wx + Math.cos(wry) * ex + Math.sin(wry) * ez;
          const p1z = wz - Math.sin(wry) * ex + Math.cos(wry) * ez;
          doorCol.min.x = Math.min(wx, p1x) - 0.06; doorCol.max.x = Math.max(wx, p1x) + 0.06;
          doorCol.min.z = Math.min(wz, p1z) - 0.06; doorCol.max.z = Math.max(wz, p1z) + 0.06;
          doorCol.min.y = gy; doorCol.max.y = gy + 2.1;
        };
        updateCol();
        B.colliders.push(doorCol);
        const door = { pivot, baseRy: wry, open: !!op.ajar, t: op.ajar ? 0.55 : 0, target: op.ajar ? 0.55 : 0, updateCol, breach: op.breach };
        B.doors.push(door);
        if (op.ajar) { pivot.rotation.y = wry + 0.9; updateCol(); }
        if (!op.locked) {
          B.interact.push({
            getPos: () => { const [ix, iz] = axis === 'x' ? L2W(op.c, off * sign) : L2W(off * sign, op.c); return { x: ix, y: gy + 1.2, z: iz }; },
            r: 1.7, label: op.breach ? 'BREACH' : 'OPEN', door,
          });
        }
      }
    };

    /* generate openings */
    const front = o.front || 'S'; // door side (local +z = S)
    const winW = 1.15;
    const doorWall = { S: ['x', 1], N: ['x', -1], E: ['z', 1], W: ['z', -1] }[front];
    const walls = { S: ['x', 1], N: ['x', -1], E: ['z', 1], W: ['z', -1] };
    for (const key in walls) {
      const [axis, sign] = walls[key];
      const len = axis === 'x' ? w : d;
      const ops = [];
      if (key === front) {
        const dc = o.doorAt != null ? o.doorAt : rnd.range(-len / 4, len / 4);
        ops.push({ c: dc, w: 1.06, type: 'door', ajar: o.ajar != null ? o.ajar : rnd.chance(0.4), breach: o.breach, locked: o.locked });
        if (len > 6.5) ops.push({ c: dc + (dc > 0 ? -len / 3.1 : len / 3.1), w: winW, type: 'win', shutter: rnd.chance(0.6), crooked: rnd.chance(0.3), broken: dmg > 0 && rnd.chance(0.5) });
      } else {
        const n = len > 8 ? 2 : 1;
        for (let i = 0; i < n; i++) {
          ops.push({ c: (i - (n - 1) / 2) * len / (n + 0.4), w: winW, type: 'win', shutter: rnd.chance(0.5), crooked: rnd.chance(0.25), broken: dmg > 0 && rnd.chance(0.45) });
        }
      }
      mkWall(axis, sign, ops);
    }
    /* second floor windows */
    if (floors > 1) {
      for (const key in walls) {
        const [axis, sign] = walls[key];
        const len = axis === 'x' ? w : d;
        const n = len > 8 ? 2 : 1;
        for (let i = 0; i < n; i++) {
          const c = (i - (n - 1) / 2) * len / (n + 0.6);
          const off = (axis === 'x' ? d : w) / 2 - T / 2;
          const y0 = fh + 0.9, y1 = fh + 2.0;
          // punch handled by wall builder only for floor 1; add framed opening look for floor 2
          if (axis === 'x') {
            wallBox(c, (y0 + y1) / 2, off * sign + sign * 0.02, winW, y1 - y0, 0.1, 0x22282c);
            wallBox(c - winW / 2, (y0 + y1) / 2, off * sign + sign * 0.05, 0.08, y1 - y0, 0.08, trimC);
            wallBox(c + winW / 2, (y0 + y1) / 2, off * sign + sign * 0.05, 0.08, y1 - y0, 0.08, trimC);
            wallBox(c, y0, off * sign + sign * 0.05, winW, 0.08, 0.09, trimC);
          } else {
            wallBox(off * sign + sign * 0.02, (y0 + y1) / 2, c, 0.1, y1 - y0, winW, 0x22282c);
            wallBox(off * sign + sign * 0.05, (y0 + y1) / 2, c - winW / 2, 0.08, y1 - y0, 0.08, trimC);
            wallBox(off * sign + sign * 0.05, (y0 + y1) / 2, c + winW / 2, 0.08, y1 - y0, 0.08, trimC);
            wallBox(off * sign + sign * 0.05, y0, c, 0.09, 0.08, winW, trimC);
          }
        }
      }
    }

    /* foundation + interior floor */
    wallBox(0, -0.22, 0, w + 0.5, 0.6, d + 0.5, adjc(wallC, 0.6));
    wallBox(0, 0.06, 0, w - 0.2, 0.12, d - 0.2, 0x7a6a52);
    B.platform(...(() => { const [ax, az] = L2W(-w / 2, -d / 2); const [bx, bz] = L2W(w / 2, d / 2); return [Math.min(ax, bx), Math.min(az, bz), Math.max(ax, bx), Math.max(az, bz)]; })(), gy + 0.12);

    /* roof */
    const roofDrop = dmg >= 2 ? 1 : 0; // collapsed corner
    if (o.roof === 'flat') {
      wallBox(0, H + 0.1, 0, w + 0.7, 0.22, d + 0.7, adjc(roofC, 0.9));
      wallBox(0, H + 0.35, 0, w + 0.2, 0.5, 0.2, wallC); // parapet front/back
      wallBox(0, H + 0.35, 0, 0.2, 0.5, d + 0.2, wallC);
      solid(0, H + 0.1, 0, w + 0.7, 0.22, d + 0.7);
      B.platform(...(() => { const [ax, az] = L2W(-w / 2, -d / 2); const [bx, bz] = L2W(w / 2, d / 2); return [Math.min(ax, bx), Math.min(az, bz), Math.max(ax, bx), Math.max(az, bz)]; })(), gy + H + 0.22);
    } else {
      const rise = w * 0.3, ov = 0.55;
      const slopeL = Math.hypot(w / 2 + ov, rise);
      const ang = Math.atan2(rise, w / 2 + ov);
      // two slopes with shingle rows
      for (const s of [-1, 1]) {
        if (roofDrop && s === 1) {
          // collapsed corner: half slope + exposed rafters + rubble
          geos.push(G.box(slopeL * 0.55, 0.16, d * 0.55 + ov, roofC, {
            x: s * (w / 4 + ov / 2) * Math.cos(ang) * 0.9, y: H + rise / 2 + 0.28 - rise * 0.28, z: -d * 0.22,
            rz: -s * ang, vary: 0.09,
          }));
          for (let i = 0; i < 5; i++) {
            geos.push(G.box(0.09, 0.14, d * 0.5, 0x4a3826, {
              x: s * (w / 2 - i * w / 9), y: H + rise - i * rise / 5 - rise * 0.3, z: d * 0.24,
              rz: -s * ang * 0.9, vary: 0.15,
            }));
          }
          // rubble pile at the collapse
          const [rx, rz2] = L2W(s * w / 3, d / 3);
          P.rubble(B, { x: rx, z: rz2, r: 2.4, seed: rnd.int(0, 999) });
          continue;
        }
        const cx = s * (w / 4 + ov / 4);
        geos.push(G.box(slopeL, 0.14, d + ov * 2, roofC, {
          x: cx, y: H + rise / 2 + 0.14, z: 0, rz: -s * ang, vary: 0.07,
        }));
        // shingle rows (thin strips)
        const rows = 4;
        for (let i = 0; i < rows; i++) {
          const t = (i + 0.5) / rows;
          geos.push(G.box(0.06, 0.05, d + ov * 2 + 0.05, adjc(roofC, 0.8 + 0.1 * (i % 2)), {
            x: s * ((w / 2 + ov) * (1 - t)) * 0.98, y: H + rise * t + 0.2, z: 0,
          }));
        }
        const covW = Math.cos(ang) * slopeL, covH = Math.sin(ang) * slopeL;
        B.collideRot(...L2W(cx, 0), gy + H + rise / 2 + 0.14, covW, covH + 0.3, d + ov * 2, o.ry || 0);
      }
      // ridge cap
      if (!roofDrop) geos.push(G.box(0.3, 0.12, d + ov * 2 + 0.1, adjc(roofC, 0.7), { y: H + rise + 0.2 }));
      // gable end triangles
      for (const s of [-1, 1]) {
        geos.push(G.wedge(w, rise, T, wallC, { x: 0, y: H, z: s * (d / 2 - T / 2), vary: 0.05 }));
      }
      // chimney with crown
      if (rnd.chance(0.7) && !roofDrop) {
        const chx = rnd.range(-w / 4, w / 4);
        geos.push(G.box(0.7, rise + 1.6, 0.7, adjc(wallC, 0.78), { x: chx, y: H + rise / 2 + 0.6, z: d / 4, vary: 0.12 }));
        geos.push(G.box(0.9, 0.18, 0.9, adjc(wallC, 0.62), { x: chx, y: H + rise + 1.45, z: d / 4 }));
      }
    }
    /* gutters */
    geos.push(G.box(0.1, 0.1, d + 1, adjc(trimC, 0.8), { x: -w / 2 - 0.5, y: H + 0.12 }));
    geos.push(G.box(0.1, 0.1, d + 1, adjc(trimC, 0.8), { x: w / 2 + 0.5, y: H + 0.12 }));

    /* porch + steps */
    if (o.porch !== false && front === 'S') {
      const pw = Math.min(3.4, w * 0.5);
      const px = o.doorAt != null ? o.doorAt : 0;
      wallBox(px, 0.02, d / 2 + 0.8, pw, 0.14, 1.6, 0x6b5a42);
      for (let i = 0; i < 2; i++) wallBox(px, -0.1 - i * 0.14, d / 2 + 1.7 + i * 0.34, pw * 0.7, 0.14, 0.36, 0x6b5a42);
      geos.push(G.cyl(0.07, 0.08, 2.3, 8, woodC, { x: px - pw / 2 + 0.15, y: 1.15, z: d / 2 + 1.5 }));
      geos.push(G.cyl(0.07, 0.08, 2.3, 8, woodC, { x: px + pw / 2 - 0.15, y: 1.15, z: d / 2 + 1.5 }));
      wallBox(px, 2.35, d / 2 + 1.15, pw + 0.4, 0.12, 2.1, adjc(roofC, 0.95));
    }

    /* interior */
    if (o.interior !== false) {
      const IC = adjc(wallC, 1.12);
      // one dividing wall with doorway
      const divZ = rnd.range(-d / 6, d / 6);
      const dwx = rnd.range(-w / 4, 0);
      wallBox((dwx - w / 2) / 2 - 0.55, fh / 2, divZ, (dwx - (-w / 2)) - 1.1, fh, 0.16, IC);
      solid((dwx - w / 2) / 2 - 0.55, fh / 2, divZ, (dwx - (-w / 2)) - 1.1, fh, 0.16);
      wallBox((dwx + 1.1 + w / 2) / 2, fh / 2, divZ, (w / 2 - dwx - 1.1), fh, 0.16, IC);
      solid((dwx + 1.1 + w / 2) / 2, fh / 2, divZ, (w / 2 - dwx - 1.1), fh, 0.16);
      wallBox(dwx + 0.55, fh - 0.3, divZ, 1.1, 0.6, 0.16, IC); // doorway lintel
      P.furnishRoom(B, o, gy, w, d, divZ, rnd, L2W);
      if (floors > 1) {
        // ceiling slab with stair hole
        const holeW = 1.2, holeD = 3.2, hx = w / 2 - 0.9, hz = -d / 2 + 2.1;
        wallBox(-(w - (w / 2 - hx + holeW / 2)) / 2 + 0 - 0.6, fh + 0.09, 0, w - (w / 2 - hx) - holeW, 0.18, d - 0.3, 0x7a6a52);
        wallBox(hx, fh + 0.09, (hz + holeD / 2 + d / 2) / 2 + 0.3, holeW + 0.7, 0.18, d - (d / 2 - hz) - holeD + 1, 0x7a6a52);
        B.platform(...(() => { const [ax, az] = L2W(-w / 2 + 0.2, -d / 2 + 0.2); const [bx, bz] = L2W(w / 2 - 0.2, d / 2 - 0.2); return [Math.min(ax, bx), Math.min(az, bz), Math.max(ax, bx), Math.max(az, bz)]; })(), gy + fh + 0.18);
        // stairs
        const steps = 10, sw = 1.1;
        for (let i = 0; i < steps; i++) {
          const sy = (i + 1) * fh / steps, sz = hz + holeD / 2 - (i + 0.5) * holeD / steps;
          wallBox(hx, sy - 0.07, sz, sw, 0.14, holeD / steps + 0.04, 0x6b5a42);
          const [sxw, szw] = L2W(hx, sz);
          B.platform(sxw - sw / 2, szw - holeD / steps / 2, sxw + sw / 2, szw + holeD / steps / 2, gy + sy);
        }
        // upstairs furniture: bed + shelf near window (sniper spot)
        P.bed(B, ...L2W(-w / 4, d / 4), gy + fh + 0.18, o.ry || 0, rnd);
        B.addCover(...L2W(0, d / 2 - 1.2), 0 * cs + 1 * sn, 1 * cs, true);
      }
    }
    /* single final transform: rotate about house origin, then translate */
    const fm = new THREE.Matrix4().makeRotationY(o.ry || 0);
    fm.setPosition(o.x, gy, o.z);
    for (const gg of geos) gg.applyMatrix4(fm);
    B.buckets.std.push(...geos);
    return { gy };
  };

  /* room furniture */
  P.furnishRoom = function (B, o, gy, w, d, divZ, rnd, L2W) {
    const items = rnd.int(2, 4);
    if (rnd.chance(0.85)) P.table(B, ...L2W(rnd.range(-w / 4, w / 4), divZ + d / 5), gy, o.ry || 0, rnd);
    if (rnd.chance(0.7)) P.shelf(B, ...L2W(-w / 2 + 0.45, divZ - d / 5), gy, (o.ry || 0) + Math.PI / 2, rnd);
    if (rnd.chance(0.5)) P.bed(B, ...L2W(w / 4, -d / 4), gy, o.ry || 0, rnd);
    if (rnd.chance(0.5)) P.cabinetFallen(B, ...L2W(rnd.range(-w / 5, w / 5), -d / 3), gy, o.ry || 0, rnd);
  };
  P.table = function (B, x, z, gy, ry, rnd) {
    const g = [];
    g.push(G.box(1.5, 0.07, 0.9, 0x6b5138, { x: 0, y: 0.74, z: 0, vary: 0.08 }));
    for (const [lx, lz] of [[-0.65, -0.35], [0.65, -0.35], [-0.65, 0.35], [0.65, 0.35]]) {
      g.push(G.cyl(0.035, 0.05, 0.72, 7, 0x5e4630, { x: lx, y: 0.37, z: lz }));
      g.push(G.sph(0.05, 6, 5, 0x5e4630, { x: lx, y: 0.55, z: lz, sy: 1.6 }));  // turned bulge
    }
    // chairs
    for (const s of [-1, 1]) {
      if (rnd && rnd.chance(0.3)) continue;
      g.push(G.box(0.45, 0.05, 0.45, 0x6b5138, { x: 0, y: 0.46, z: s * 0.85 }));
      for (const [lx, lz] of [[-0.18, -0.18], [0.18, -0.18], [-0.18, 0.18], [0.18, 0.18]])
        g.push(G.box(0.045, 0.46, 0.045, 0x5e4630, { x: lx, y: 0.23, z: s * 0.85 + lz }));
      g.push(G.box(0.45, 0.55, 0.05, 0x5e4630, { x: 0, y: 0.75, z: s * (0.85 + 0.2) }));
    }
    const merged = g.map(gg => { const m = new THREE.Matrix4().makeRotationY(ry); gg.applyMatrix4(m); gg.translate(x, gy, z); return gg; });
    B.buckets.std.push(...merged);
    B.collide(x, gy + 0.4, z, 1.6, 0.8, 1.0);
    B.addCover(x, z + 1.4, 0, -1, true);
  };
  P.shelf = function (B, x, z, gy, ry, rnd) {
    const g = [];
    g.push(G.box(1.4, 2.0, 0.36, 0x5e4630, { y: 1.0, vary: 0.08 }));
    for (let i = 0; i < 4; i++) {
      g.push(G.box(1.28, 0.05, 0.3, 0x6b5138, { y: 0.3 + i * 0.5, z: 0.02 }));
      // clutter items
      const n = rnd ? rnd.int(1, 3) : 2;
      for (let k = 0; k < n; k++) {
        const cx = (k - n / 2) * 0.4 + 0.1;
        if ((i + k) % 3 === 0) g.push(G.box(0.12, 0.22, 0.18, 0x8a4a38, { x: cx, y: 0.42 + i * 0.5, z: 0 }));
        else if ((i + k) % 3 === 1) g.push(G.cyl(0.07, 0.07, 0.18, 7, 0x7a8a68, { x: cx, y: 0.41 + i * 0.5 }));
        else g.push(G.box(0.2, 0.14, 0.14, 0x9a8a62, { x: cx, y: 0.38 + i * 0.5, ry: 0.4 }));
      }
    }
    const m4r = new THREE.Matrix4().makeRotationY(ry);
    g.forEach(gg => { gg.applyMatrix4(m4r); gg.translate(x, gy, z); });
    B.buckets.std.push(...g);
    B.collide(x, gy + 1, z, 1.4, 2, 0.5);
  };
  P.bed = function (B, x, z, gy, ry, rnd) {
    const g = [];
    g.push(G.box(1.05, 0.28, 2.1, 0x5e4630, { y: 0.32 }));
    g.push(G.box(1.0, 0.16, 2.0, 0xb0a890, { y: 0.5, vary: 0.08 }));
    g.push(G.box(0.9, 0.1, 0.5, 0xcac2ae, { y: 0.58, z: -0.7 }));
    g.push(G.box(1.05, 0.75, 0.08, 0x5e4630, { y: 0.55, z: -1.06 }));
    for (const [lx, lz] of [[-0.48, -1], [0.48, -1], [-0.48, 1], [0.48, 1]])
      g.push(G.box(0.07, 0.34, 0.07, 0x4a3826, { x: lx, y: 0.17, z: lz }));
    const m4r = new THREE.Matrix4().makeRotationY(ry);
    g.forEach(gg => { gg.applyMatrix4(m4r); gg.translate(x, gy, z); });
    B.buckets.std.push(...g);
    B.collide(x, gy + 0.3, z, 1.1, 0.6, 2.1);
  };

      G.box(0.5, 0.3, 0.5, 0x8a8072, { x, y: gy + 0.06, z }));
    B.collide(x, gy + 0.5, z, 0.4, 1.1, 0.4);
  };
  P.tree = function (B, x, z, o) {
    const rnd = RNG(((x * 17 + z * 23) | 0) ^ 3);
    const gy = B.h(x, z);
    const s = (o && o.s) || rnd.range(0.8, 1.4);
    const trunkC = 0x584434, leafC = (o && o.leafC) || rnd.pick([0x4a5d2e, 0x556635, 0x3f5229]);
    const g = [G.cyl(0.14 * s, 0.22 * s, 2.6 * s, 8, trunkC, { x, y: gy + 1.3 * s, z, vary: 0.15 })];
    g.push(G.cyl(0.06 * s, 0.1 * s, 1.4 * s, 6, trunkC, { x: x + 0.4 * s, y: gy + 2.7 * s, z, rz: -0.7, vary: 0.15 }));
    const lobes = rnd.int(3, 5);
    for (let i = 0; i < lobes; i++) {
      const a = (i / lobes) * TAU + rnd.spread(0.5);
      g.push(G.sph(rnd.range(0.8, 1.25) * s, 8, 6, leafC, {
        x: x + Math.cos(a) * 0.75 * s, y: gy + (3.1 + rnd.spread(0.5)) * s, z: z + Math.sin(a) * 0.75 * s,
        sy: rnd.range(0.75, 0.95), vary: 0.22,
      }));
    }
    g.push(G.sph(1.1 * s, 8, 6, adjc(leafC, 1.15), { x, y: gy + 3.9 * s, z, sy: 0.8, vary: 0.22 }));
    B.buckets.std.push(...g);
    B.collide(x, gy + 1.3, z, 0.5, 2.6 * s, 0.5);
  };
  P.deadTree = function (B, x, z) {
    const rnd = RNG(((x * 29 + z * 31) | 0) ^ 9);
    const gy = B.h(x, z);
    const g = [G.cyl(0.1, 0.2, 3.4, 7, 0x4a423a, { x, y: gy + 1.7, z, rz: rnd.spread(0.1), vary: 0.2 })];
    for (let i = 0; i < 3; i++) {
      const a = rnd() * TAU;
      g.push(G.cyl(0.03, 0.07, rnd.range(1, 1.8), 5, 0x443c34, {
        x: x + Math.cos(a) * 0.4, y: gy + rnd.range(2, 3.2), z: z + Math.sin(a) * 0.4,
        rz: rnd.spread(1.2), rx: rnd.spread(1.2), vary: 0.2,
      }));
    }
    B.buckets.std.push(...g);
    B.collide(x, gy + 1.7, z, 0.4, 3.4, 0.4);
  };

  /* instanced vegetation & rocks */
  P.scatterGrass = function (B, count, area, palette) {
    const rnd = RNG(999);
    /* tuft: fan of 3 tapered blades (triangles) */
    const tuft = new THREE.BufferGeometry();
    const verts = [];
    for (let b = 0; b < 3; b++) {
      const a = (b / 3) * Math.PI;
      const dx = Math.cos(a), dz = Math.sin(a);
      const w2 = 0.13, hgt = 0.42, lean = 0.1;
      verts.push(-dx * w2, 0, -dz * w2, dx * w2, 0, dz * w2, dx * lean - dz * 0.06, hgt, dz * lean + dx * 0.06);
    }
    tuft.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
    tuft.computeVertexNormals();
    const blade = tuft;
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 1 });
    const im = new THREE.InstancedMesh(blade, mat, count * 2);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
    const c = new THREE.Color();
    let idx = 0;
    for (let i = 0; i < count; i++) {
      let x, z, tries = 0;
      do { x = rnd.spread(area); z = rnd.spread(area); tries++; } while (tries < 8 && area > 100 && Math.hypot(x, z) > area);
      const gy = B.h(x, z);
      if (B.terrain.waterCells) { const [gx, gz] = B.terrain._worldToGrid(x, z); if (B.terrain.waterCells.has(B.terrain._idx(Math.round(gx), Math.round(gz)))) continue; }
      if (B.terrain.roadCells) { const [gx, gz] = B.terrain._worldToGrid(x, z); if (B.terrain.roadCells.has(B.terrain._idx(Math.round(gx), Math.round(gz)))) continue; }
      const s = rnd.range(0.7, 1.5);
      for (const ry of [rnd() * Math.PI, rnd() * Math.PI + Math.PI / 2]) {
        e.set(rnd.spread(0.12), ry, rnd.spread(0.12)); q.setFromEuler(e);
        v.set(x, gy - 0.02, z); sc.set(s, s * rnd.range(0.7, 1.15), s);
        m4.compose(v, q, sc);
        im.setMatrixAt(idx, m4);
        c.setHex(palette || 0x5d6b38).multiplyScalar(rnd.range(1.0, 1.45)).convertSRGBToLinear();
        im.setColorAt(idx, c);
        idx++;
      }
    }
    im.count = idx;
    im.castShadow = false; im.receiveShadow = true;
    B.group.add(im);
    return im;
  };
  P.scatterRocks = function (B, count, area) {
    const rnd = RNG(777);
    const rock = new THREE.DodecahedronGeometry(0.4, 0);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
    const im = new THREE.InstancedMesh(rock, mat, count);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
    const c = new THREE.Color();
    for (let i = 0; i < count; i++) {
      const x = rnd.spread(area), z = rnd.spread(area);
      const gy = B.h(x, z);
      e.set(rnd() * 3, rnd() * 3, rnd() * 3); q.setFromEuler(e);
      const s = rnd.range(0.2, 1.4);
      v.set(x, gy + 0.05 * s, z); sc.set(s, s * rnd.range(0.5, 0.8), s);
      m4.compose(v, q, sc);
      im.setMatrixAt(i, m4);
      c.setHex(0x7d7768).multiplyScalar(rnd.range(0.75, 1.1)).convertSRGBToLinear();
      im.setColorAt(i, c);
    }
    im.castShadow = false; im.receiveShadow = true;
    B.group.add(im);
  };

  return P;
})();

/* helper: flatten terrain pad for a building */
RT.MapBuilder.prototype._flattenFor = function (o, w, d) {
  const r = Math.max(w, d) * 0.62;
  return this.terrain._flatten(o.x, o.z, r);
};

/* map viewer support (Gate C) */
RT.buildMissionWorld = function (idx) {
  const def = RT.missions[idx];
  RT.engine.setAtmosphere(def.atmosphere);
  const terrain = new RT.Terrain(def.terrain);
  const B = new RT.MapBuilder(terrain, def.terrain.seed);
  const info = def.buildMap(B);
  const group = B.finalize();
  RT.engine.world.add(group);
  RT.map = B;
  RT.map.info = info;
  RT.map.def = def;
  return { B, info, def };
};


/* ==================== 10_main.js ==================== */
/* ============================================================
 * Boot / orchestration
 * ============================================================ */
function boot() {
  if (typeof THREE === 'undefined') {
    RT.$('boot-msg').textContent = 'FAILED TO LOAD RENDERER (check connection)';
    return;
  }
  RT.engine.init();
  RT.input.init(RT.engine.renderer.domElement);
  RT.engine.setAtmosphere({
    top: 0x3e5a80, horizon: 0xe8b07a, ground: 0x5a4a3a,
    sunDir: new THREE.Vector3(-0.5, 0.35, -0.6), sunColor: 0xffd9a8, sunIntensity: 2.4,
    hemiSky: 0xc7ad8a, hemiGround: 0x4a4238, hemiIntensity: 0.5,
    fogColor: 0xd9b48c, fogDensity: 0.004,
  });

  RT.engine.onUpdate((dt) => {
    if (RT.transients) {
      for (let i = RT.transients.length - 1; i >= 0; i--) if (!RT.transients[i](dt)) RT.transients.splice(i, 1);
    }
  });

  if (location.hash === '#soldier') { soldierViewer(); return finishBoot(); }
  if (location.hash === '#weapon') { weaponViewer(); return finishBoot(); }
  if (location.hash === '#map') { mapViewer(); return finishBoot(); }

  /* temporary boot scene */
  const ground = RT.meshOf([RT.G.box(200, 0.5, 200, 0x6a7a4a, { y: -0.25, vary: 0.15 })]);
  RT.engine.world.add(ground);
  RT.engine.camera.position.set(0, 3, 12);
  RT.engine.onUpdate(() => RT.engine.updateSun(RT.engine.camera.position));
  finishBoot();
}

function finishBoot() {
  RT.engine.start();
  RT.$('boot-msg').classList.add('hidden');
  window.RT_BOOT = 'ok';
  console.log('RT boot ok');
}

/* ---------- Gate C viewer: mission map flyover ---------- */
function mapViewer() {
  const params = new URLSearchParams(location.search);
  const mi = parseInt(params.get('m') || '0', 10);
  RT.buildMissionWorld(mi);
  const cam = RT.engine.camera;
  const cx = parseFloat(params.get('x') || '0');
  const cy = parseFloat(params.get('y') || '90');
  const cz = parseFloat(params.get('z') || '120');
  const lx = parseFloat(params.get('lx') || '0');
  const ly = parseFloat(params.get('ly') || '0');
  const lz = parseFloat(params.get('lz') || '-40');
  cam.position.set(cx, cy, cz);
  cam.lookAt(lx, ly, lz);
  if (params.get('ground')) {
    const gx = parseFloat(params.get('x') || '0'), gz = parseFloat(params.get('z') || '120');
    cam.position.set(gx, RT.map.groundAt(gx, gz, 99) + 1.65, gz);
    cam.lookAt(lx, RT.map.groundAt(lx, lz, 99) + 1.4, lz);
  }
  RT.engine.onUpdate(() => RT.engine.updateSun(cam.position));
  window.RT_VIEWER = { map: RT.map };
}

/* ---------- Gate B viewer: first-person weapon rig ---------- */
function weaponViewer() {
  RT.engine.setAtmosphere({
    top: 0x4a5d7d, horizon: 0xb0a794, ground: 0x4c4a45,
    sunDir: new THREE.Vector3(-0.4, 0.55, -0.6), sunColor: 0xffedd0, sunIntensity: 1.8,
    hemiSky: 0xa8b2c4, hemiGround: 0x50493e, hemiIntensity: 0.45,
    fogColor: 0xb0a794, fogDensity: 0.002, exposure: 0.95,
  });
  const world = RT.engine.world;
  world.add(RT.meshOf([RT.G.box(120, 0.4, 120, 0x6f6a58, { y: -0.2, vary: 0.12 })]));
  // target wall + posts to judge sight alignment
  world.add(RT.meshOf([RT.G.box(6, 3.4, 0.4, 0x7a7466, { y: 1.7, z: -20, vary: 0.1 }),
    RT.G.box(0.5, 0.5, 0.5, 0x9e2f24, { y: 1.62, z: -19.7 }),
    RT.G.cyl(0.08, 0.08, 3, 8, 0x5a5348, { x: -4, y: 1.5, z: -12 }),
    RT.G.cyl(0.08, 0.08, 3, 8, 0x5a5348, { x: 4, y: 1.5, z: -12 })]));
  RT.combat = RT.combat || {
    playerShot(org, dir, cfg, muzzle) {
      RT.engine.tracer(muzzle, dir, 60, 300);
      const t = (-20 - org.z) / dir.z;
      if (t > 0) {
        const hit = org.clone().addScaledVector(dir, Math.min(t, 60));
        RT.engine.decal(hit, new THREE.Vector3(0, 0, 1), 0.16, 0x26221c, 10);
        for (let i = 0; i < 5; i++)
          RT.engine.particle(hit.x, hit.y, hit.z, (Math.random() - .5) * 2, Math.random() * 2, Math.random() * 1.5,
            { color: 0x8a8072, size: 0.06, life: 0.5, grav: -6, drag: 2 });
      }
    },
  };
  const params = new URLSearchParams(location.search);
  RT.weapons.init();
  RT.weapons.setLoadout([params.get('w') || 'm4', 'pistol']);
  const cam = RT.engine.camera;
  cam.position.set(0, 1.62, 0);
  if (params.get('ads')) RT.input.aim = true;
  if (params.get('fire')) {
    let ft = 0.8;
    RT.engine.onUpdate((dt) => { ft -= dt; RT.input.fire = ft < 0 && ft > -0.4; });
  }
  RT.engine.onUpdate((dt) => {
    RT.weapons.update(dt, { speedF: 0 });
    RT.weapons.updateShells(dt);
    RT.engine.updateSun(cam.position);
  });
  window.RT_VIEWER = { weapons: RT.weapons };
}

/* ---------- Gate A viewer: soldiers on a plain stage ---------- */
function soldierViewer() {
  RT.engine.setAtmosphere({

    sunDir: new THREE.Vector3(-0.45, 0.6, 0.55), sunColor: 0xfff2dd, sunIntensity: 1.7,

  });
  const world = RT.engine.world;
  world.add(RT.meshOf([RT.G.box(60, 0.4, 60, 0x6a675f, { y: -0.2, vary: 0.1 })]));
  const rigs = [];
  const setups = [
    { seed: 11, faction: 'ally', paletteIdx: 0, headgear: 'helmet', mode: 'idle' },
    { seed: 22, faction: 'ally', paletteIdx: 1, headgear: 'boonie', mode: 'aim' },
    { seed: 33, faction: 'ally', paletteIdx: 2, headgear: 'beanie', mode: 'walk' },
    { seed: 44, faction: 'enemy', paletteIdx: 0, headgear: 'helmet', mode: 'run' },
    { seed: 55, faction: 'enemy', paletteIdx: 1, headgear: 'helmet', mode: 'idle', crouch: 1 },
  ];
  setups.forEach((s, i) => {
    const rig = RT.character.build(s);
    rig.group.position.set((i - (setups.length - 1) / 2) * 1.35, 0, 0);
    rig.anim.mode = s.mode;
    if (s.crouch) rig.anim.crouch = 1;
    world.add(rig.group);
    rigs.push(rig);
  });
  const cam = RT.engine.camera;
  const params = new URLSearchParams(location.search);
  const cd = parseFloat(params.get('dist') || '3.2');
  const ch = parseFloat(params.get('h') || '1.35');
  const cx = parseFloat(params.get('x') || '0');
  cam.position.set(cx, ch, cd);
  cam.lookAt(cx, 1.05, 0);
  RT.engine.onUpdate((dt) => {
    for (const r of rigs) RT.character.pose(r, dt);
    RT.engine.updateSun(cam.position);
  });
  window.RT_VIEWER = { rigs };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
