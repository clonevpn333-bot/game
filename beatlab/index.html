<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BeatLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--APP-->
<div id="app">
  <header id="toolbar" class="toolbar"></header>
  <nav id="bigTabs" class="bigtabs" role="tablist" aria-label="Studio"></nav>
  <main id="panel" class="panel">
    <div id="panelHead" class="panel-head"></div>
    <div id="edBody" class="ed-body"></div>
  </main>
  <footer id="status" class="statusbar"><span id="hint" class="hint"></span><span id="saveState" class="save-state"></span></footer>
</div>
<input id="filePick" type="file" hidden>
<div id="pop" class="pop" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="loading" class="loading"><div class="loading-card"><span class="spinner" aria-hidden="true"></span><span id="loadingMsg">Loading…</span></div></div>
<div class="drop-hint" aria-hidden="true"><span>Drop to import</span><small>Single audio files become Song tracks · zips, folders and groups of files become beat packs</small></div>
<!--/APP-->

<script src="js/theory.js"></script>
<script src="js/dsp.js"></script>
<script src="js/sounds.js"></script>
<script src="js/engine.js"></script>
<script src="js/beats.js"></script>
<script src="js/magic.js"></script>
<script src="js/media.js"></script>
<script src="js/lab.js"></script>
<script src="js/playlist.js"></script>
<script src="js/browser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
