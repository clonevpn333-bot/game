<!doctype html>
<html><head><meta charset="utf-8"><title>Summit — generated texture sheet</title>
<style>body{margin:0;background:#15171c;color:#cbd;font:11px ui-monospace,monospace;display:flex;flex-wrap:wrap;gap:10px;padding:12px}
figure{margin:0}figcaption{padding:4px 0}canvas{image-rendering:auto;background:#333 repeating-conic-gradient(#3a3a3a 0 25%,#2c2c2c 0 50%) 0 0/16px 16px;width:150px;height:150px}</style>
</head><body>
<script type="module">
import { materialMaps, leafCard, grassCard, cloudSprite, softBlob, waterNormal } from './client/gfx/textures.js';
const show = (canvas, label) => {
  const f = document.createElement('figure');
  const c = document.createElement('canvas'); c.width = c.height = 150;
  c.getContext('2d').drawImage(canvas, 0, 0, 150, 150);
  f.append(c, Object.assign(document.createElement('figcaption'), { textContent: label }));
  document.body.append(f);
};
for (const k of ['rock','snow','sand','jungle','ash','bark','fabric','leather','metal','wood','skin']) {
  const m = materialMaps(k, 11, k === 'skin' ? 1 : undefined, 1);
  show(m.map.image, k + ' albedo');
  show(m.normalMap.image, k + ' normal');
}
show(leafCard(1, 0.24).image, 'leaf 0.24');
show(leafCard(2, 0.30).image, 'leaf 0.30');
show(grassCard(3, 0.24).image, 'grass');
show(cloudSprite(5).image, 'cloud');
show(waterNormal(3).image, 'water normal');
window.__ready = true;
</script></body></html>
