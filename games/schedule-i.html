<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule I</title>
<style>
/* inlined from css/style.css */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
}

#gc {
    display: block;
    cursor: default;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    /* Scale to fit viewport while keeping 16:9 */
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 16 / 9;
}

/* Loading screen shown before canvas is ready */
#loading {
    position: fixed;
    inset: 0;
    background: #0a0a14;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #ffd700;
    z-index: 9999;
}

#loading h1 {
    font-size: 4rem;
    letter-spacing: 0.3em;
    margin-bottom: 1rem;
    color: #f44336;
}

#loading p {
    font-size: 1rem;
    color: #90a4ae;
    animation: blink 1s step-end infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
}
</style>
</head>
<body>

<div id="loading">
    <h1>SCHEDULE I</h1>
    <p>Loading…</p>
</div>

<canvas id="gc"></canvas>

<!-- Shared portal engine (inlined at build time) -->
<script>
/* inlined from ../../engine/teardown.js */
'use strict';
/**
 * Teardown registry — §1.1 "Deterministic teardown on game exit".
 *
 * Nothing in a game should call addEventListener / requestAnimationFrame /
 * setTimeout / createObjectURL directly. Route them through here and a single
 * destroyAll() reclaims the lot. The portal also destroys the whole iframe
 * (§2.2), but manual teardown is what makes standalone play and the
 * heap-returns-to-baseline benchmark (§4) hold.
 */
(function (global) {
    const PE = (global.PE = global.PE || {});

    const listeners = [];   // [target, type, fn, opts]
    const rafs      = [];   // raf handles
    const timers    = [];   // setTimeout handles
    const intervals = [];   // setInterval handles
    const contexts  = [];   // WebGL contexts
    const urls      = [];   // object URLs
    const audios    = [];   // AudioContexts
    const closers   = [];   // arbitrary cleanup fns
    let destroyed   = false;

    const Teardown = {
        get destroyed() { return destroyed; },

        on(target, type, fn, opts) {
            if (destroyed) return fn;
            target.addEventListener(type, fn, opts);
            listeners.push([target, type, fn, opts]);
            return fn;
        },

        off(target, type, fn, opts) {
            target.removeEventListener(type, fn, opts);
            for (let i = listeners.length - 1; i >= 0; i--) {
                const l = listeners[i];
                if (l[0] === target && l[1] === type && l[2] === fn) listeners.splice(i, 1);
            }
        },

        raf(fn) {
            if (destroyed) return 0;
            const h = requestAnimationFrame(fn);
            rafs.push(h);
            // Keep the handle list bounded: a long-running loop would otherwise
            // push one entry per frame forever (a leak in the leak-preventer).
            if (rafs.length > 8) rafs.splice(0, rafs.length - 8);
            return h;
        },

        timeout(fn, ms) {
            if (destroyed) return 0;
            const h = setTimeout(function () {
                const i = timers.indexOf(h);
                if (i >= 0) timers.splice(i, 1);
                fn();
            }, ms);
            timers.push(h);
            return h;
        },

        interval(fn, ms) {
            if (destroyed) return 0;
            const h = setInterval(fn, ms);
            intervals.push(h);
            return h;
        },

        trackContext(gl)      { if (gl) contexts.push(gl); return gl; },
        trackAudio(ac)        { if (ac) audios.push(ac); return ac; },
        trackObjectURL(url)   { if (url) urls.push(url); return url; },
        onDestroy(fn)         { if (fn) closers.push(fn); return fn; },

        /** Idempotent. Safe to call from unload, from the portal, or both. */
        destroyAll() {
            if (destroyed) return;
            destroyed = true;

            for (let i = 0; i < rafs.length; i++) cancelAnimationFrame(rafs[i]);
            for (let i = 0; i < timers.length; i++) clearTimeout(timers[i]);
            for (let i = 0; i < intervals.length; i++) clearInterval(intervals[i]);
            for (let i = 0; i < listeners.length; i++) {
                const l = listeners[i];
                try { l[0].removeEventListener(l[1], l[2], l[3]); } catch (e) { /* detached */ }
            }
            for (let i = 0; i < closers.length; i++) {
                try { closers[i](); } catch (e) { /* keep tearing down */ }
            }
            for (let i = 0; i < contexts.length; i++) {
                try {
                    const ext = contexts[i].getExtension('WEBGL_lose_context');
                    if (ext) ext.loseContext();
                } catch (e) { /* context already gone */ }
            }
            for (let i = 0; i < audios.length; i++) {
                try { audios[i].close(); } catch (e) { /* already closed */ }
            }
            for (let i = 0; i < urls.length; i++) {
                try { URL.revokeObjectURL(urls[i]); } catch (e) { /* already revoked */ }
            }

            listeners.length = 0; rafs.length = 0; timers.length = 0;
            intervals.length = 0; contexts.length = 0; urls.length = 0;
            audios.length = 0; closers.length = 0;

            if (document.pointerLockElement) {
                try { document.exitPointerLock(); } catch (e) { /* not locked */ }
            }
        },
    };

    PE.Teardown = Teardown;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* inlined from ../../engine/pool.js */
'use strict';
/**
 * Fixed-capacity object pool — §1.1 "Pools are sized at load and never grow
 * during play". Growing a pool mid-frame is exactly the allocation spike the
 * target hardware cannot absorb, so exhaustion recycles the oldest live object
 * instead (or drops, if the pool is configured to).
 */
(function (global) {
    const PE = (global.PE = global.PE || {});

    function Pool(capacity, factory, reset, opts) {
        this.capacity = capacity | 0;
        this._reset   = reset || null;
        this._items   = new Array(this.capacity);
        this._live    = new Array(this.capacity);   // dense list of active items
        this.size     = 0;                          // active count
        this._free    = this.capacity;
        this._cursor  = 0;                          // round-robin recycle cursor
        this.recycleOldest = !opts || opts.recycleOldest !== false;
        this.exhausted = 0;                         // diagnostic counter

        for (let i = 0; i < this.capacity; i++) this._items[i] = factory(i);
        // Free list as a stack of indices into _items.
        this._stack = new Int32Array(this.capacity);
        for (let i = 0; i < this.capacity; i++) this._stack[i] = this.capacity - 1 - i;
    }

    Pool.prototype.acquire = function () {
        if (this._free > 0) {
            const idx = this._stack[--this._free];
            const obj = this._items[idx];
            obj.__poolIndex = idx;
            obj.__poolSlot  = this.size;
            this._live[this.size++] = obj;
            if (this._reset) this._reset(obj);
            return obj;
        }
        this.exhausted++;
        if (!this.recycleOldest || this.size === 0) return null;
        // Recycle round-robin so one long-lived entity can't monopolise the pool.
        const victim = this._live[this._cursor % this.size];
        this._cursor++;
        if (this._reset) this._reset(victim);
        return victim;
    };

    /** O(1) release via swap-with-last; iteration order is not stable. */
    Pool.prototype.release = function (obj) {
        const slot = obj.__poolSlot;
        if (slot === undefined || slot < 0 || slot >= this.size || this._live[slot] !== obj) return false;
        const last = this._live[--this.size];
        this._live[slot] = last;
        last.__poolSlot  = slot;
        this._live[this.size] = null;
        obj.__poolSlot = -1;
        this._stack[this._free++] = obj.__poolIndex;
        return true;
    };

    Pool.prototype.at = function (i) { return this._live[i]; };

    Pool.prototype.releaseAll = function () {
        for (let i = 0; i < this.size; i++) {
            const o = this._live[i];
            o.__poolSlot = -1;
            this._stack[this._free++] = o.__poolIndex;
            this._live[i] = null;
        }
        this.size = 0;
    };

    /**
     * Allocation-free sweep. `fn(obj, dt)` returns false to release the object.
     * Iterates backwards so swap-removal never skips an entry.
     */
    Pool.prototype.update = function (fn, dt) {
        for (let i = this.size - 1; i >= 0; i--) {
            const o = this._live[i];
            if (fn(o, dt) === false) this.release(o);
        }
    };

    PE.Pool = Pool;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* inlined from ../../engine/resscale.js */
'use strict';
/**
 * Backing-resolution control + dynamic resolution scaling — §1.2 / §1.3.
 *
 * Two jobs:
 *   1. Clamp devicePixelRatio and render the backing store at 0.75x-1.0x of CSS
 *      size, then let CSS upscale. Full retina rendering is banned on the
 *      target profile: it is a pure fill-rate multiplier for no gameplay value.
 *   2. When frame time blows the budget, drop backing resolution *before*
 *      dropping frame rate, with hysteresis strong enough that the renderer
 *      never oscillates between two scales (the "never jitters between 60 and
 *      45" criterion).
 */
(function (global) {
    const PE = (global.PE = global.PE || {});

    const STEPS = [1.0, 0.9, 0.8, 0.7, 0.6, 0.5];

    function ResolutionScaler(canvas, opts) {
        opts = opts || {};
        this.canvas      = canvas;
        this.targetFps   = opts.targetFps || 60;
        this.floorFps    = opts.floorFps || 30;
        this.maxDpr      = opts.maxDpr || 1.0;       // never exceed 1 backing px per CSS px
        this.minScale    = opts.minScale || 0.5;
        this.maxScale    = opts.maxScale || 1.0;
        this.auto        = opts.auto !== false;
        // A game with a fixed logical resolution (most 2D titles) scales its
        // backing store against that, not against CSS size or DPR.
        this.logicalW    = opts.logicalWidth || 0;
        this.logicalH    = opts.logicalHeight || 0;
        this.onResize    = opts.onResize || null;    // (w, h, scale) => void

        this._stepIndex  = STEPS.indexOf(clampStep(opts.initialScale || 1.0));
        if (this._stepIndex < 0) this._stepIndex = 0;
        this._budgetMs   = 1000 / this.targetFps;
        this._overCount  = 0;
        this._underCount = 0;
        this._cooldown   = 0;
        // Steps that produced an immediate relapse are not retried this session.
        this._blocked    = new Uint8Array(STEPS.length);
        this._lastUpAt   = -1e9;
        this.width = 0; this.height = 0;

        this.applyResize();
    }

    function clampStep(v) {
        let best = STEPS[0], bd = Infinity;
        for (let i = 0; i < STEPS.length; i++) {
            const d = Math.abs(STEPS[i] - v);
            if (d < bd) { bd = d; best = STEPS[i]; }
        }
        return best;
    }

    ResolutionScaler.prototype.scale = function () { return STEPS[this._stepIndex]; };

    ResolutionScaler.prototype.dpr = function () {
        return Math.min(global.devicePixelRatio || 1, this.maxDpr);
    };

    /** Resize the backing store to CSS size x scale x clamped DPR. */
    ResolutionScaler.prototype.applyResize = function () {
        let cssW, cssH, f;
        if (this.logicalW) {
            cssW = this.logicalW; cssH = this.logicalH; f = this.scale();
        } else {
            const rect = this.canvas.getBoundingClientRect();
            cssW = Math.max(1, rect.width  || this.canvas.clientWidth  || 640);
            cssH = Math.max(1, rect.height || this.canvas.clientHeight || 360);
            f = this.scale() * this.dpr();
        }
        const w = Math.max(1, Math.round(cssW * f));
        const h = Math.max(1, Math.round(cssH * f));
        if (w === this.width && h === this.height) return false;
        this.width = w; this.height = h;
        this.canvas.width = w;
        this.canvas.height = h;
        if (this.onResize) this.onResize(w, h, this.scale());
        return true;
    };

    /** Manual override — §1.2 requires scaling be reversible at runtime. */
    ResolutionScaler.prototype.setScale = function (v) {
        const idx = STEPS.indexOf(clampStep(v));
        if (idx < 0 || idx === this._stepIndex) return false;
        this._stepIndex = idx;
        this._overCount = 0; this._underCount = 0;
        this.applyResize();
        return true;
    };

    ResolutionScaler.prototype.setAuto = function (on) {
        this.auto = !!on;
        this._overCount = 0; this._underCount = 0;
    };

    /**
     * Feed one frame time (ms). Called from the render callback; allocation-free.
     */
    ResolutionScaler.prototype.sample = function (frameMs, nowMs) {
        if (!this.auto) return;
        if (nowMs < this._cooldown) return;

        // Over budget by >15% counts as pressure; under 70% counts as headroom.
        if (frameMs > this._budgetMs * 1.15) { this._overCount++; this._underCount = 0; }
        else if (frameMs < this._budgetMs * 0.70) { this._underCount++; this._overCount = 0; }
        else { this._overCount = 0; this._underCount = 0; }

        if (this._overCount >= 12 && this._stepIndex < STEPS.length - 1 &&
            STEPS[this._stepIndex + 1] >= this.minScale) {
            // A downgrade right after an upgrade means that step is not
            // sustainable on this device: block it for the rest of the session.
            if (nowMs - this._lastUpAt < 4000) this._blocked[this._stepIndex] = 1;
            this._stepIndex++;
            this._overCount = 0; this._underCount = 0;
            this._cooldown = nowMs + 1500;
            this.applyResize();
            return;
        }

        // Upscale is deliberately reluctant: 4s of clear headroom, and never
        // into a step that already relapsed.
        if (this._underCount >= 240 && this._stepIndex > 0 &&
            !this._blocked[this._stepIndex - 1] && STEPS[this._stepIndex - 1] <= this.maxScale) {
            this._stepIndex--;
            this._overCount = 0; this._underCount = 0;
            this._cooldown = nowMs + 3000;
            this._lastUpAt = nowMs;
            this.applyResize();
        }
    };

    /**
     * Pick a starting scale from what the device advertises. Cheap heuristic;
     * the adaptive loop corrects it within a couple of seconds either way.
     */
    ResolutionScaler.suggestInitialScale = function () {
        const mem   = global.navigator && navigator.deviceMemory || 4;
        const cores = global.navigator && navigator.hardwareConcurrency || 2;
        const px    = (global.innerWidth || 1280) * (global.innerHeight || 720);
        if (mem <= 2 || cores <= 2) return 0.75;
        if (mem <= 4 && px > 1280 * 800) return 0.8;
        if (mem <= 4) return 0.9;
        return 1.0;
    };

    ResolutionScaler.STEPS = STEPS;
    PE.ResolutionScaler = ResolutionScaler;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* inlined from ../../engine/bridge.js */
'use strict';
/**
 * Game-side half of the portal <-> game postMessage bridge (§2.2).
 *
 * Protocol (v1), all messages { type, token, ... }:
 *
 *   game   -> portal : game:hello      first contact, no token yet
 *   portal -> game   : portal:hello    { token, tier, caps, save, settings }
 *   game   -> portal : game:ready      { needs: { tier, pointerLock } }
 *   game   -> portal : game:save       { data }        persisted via IndexedDB
 *   game   -> portal : game:score      { score, label }
 *   game   -> portal : game:stats      { fps, frameMs, heapMB, scale, entities }
 *   game   -> portal : game:exit       user chose to quit
 *   game   -> portal : game:error      { message, stack }
 *   game   -> portal : game:pointerlock{ locked }
 *   portal -> game   : portal:pause | portal:resume | portal:shutdown
 *   portal -> game   : portal:lowmem   release what you can, you are near budget
 *   portal -> game   : portal:settings { resolutionScale, audio, auto }
 *
 * The game never touches portal storage directly: save state round-trips
 * through this bridge, which is what §2.2's acceptance criterion asks for.
 * Standalone (opened outside the portal) degrades to a local IndexedDB store
 * so a bundle stays playable as a plain file.
 */
(function (global) {
    const PE = (global.PE = global.PE || {});
    const PROTOCOL = 1;

    const Bridge = {
        connected:  false,
        standalone: false,
        token:      null,
        id:         null,
        tier:       null,
        caps:       null,
        settings:   null,
        _handlers:  null,
        _saveTimer: 0,
        _pendingSave: null,
        _origin:    null,
        _onMessage: null,
        _helloTimer: 0,

        connect(opts) {
            this._handlers = opts || {};
            this.id = opts.id || 'unknown';
            const parent = global.parent;
            const embedded = parent && parent !== global;

            // location.origin is "null" for an opaque-origin sandbox; postMessage
            // then has to target '*' because there is no origin to name.
            this._origin = (location.origin && location.origin !== 'null') ? location.origin : '*';

            const self = this;
            this._onMessage = function (e) { self._handle(e); };
            global.addEventListener('message', this._onMessage);

            // Report uncaught errors to the portal so a broken title surfaces
            // in the launcher instead of dying silently inside the frame.
            global.addEventListener('error', function (e) {
                self.post('game:error', { message: String(e.message || e), stack: e.error && e.error.stack || '' });
            });
            global.addEventListener('unhandledrejection', function (e) {
                self.post('game:error', { message: 'unhandled rejection: ' + String(e.reason), stack: '' });
            });

            if (!embedded) { this._goStandalone(); return this; }

            parent.postMessage({ type: 'game:hello', protocol: PROTOCOL, id: this.id }, this._origin);
            this._helloTimer = setTimeout(function () {
                if (!self.connected) self._goStandalone();
            }, 1500);
            return this;
        },

        _goStandalone() {
            this.standalone = true;
            this.connected  = false;
            const self = this;
            localLoad(this.id).then(function (save) {
                self._fire('onHello', { tier: null, caps: null, save: save, settings: null, standalone: true });
            });
        },

        _handle(e) {
            const d = e.data;
            if (!d || typeof d !== 'object' || typeof d.type !== 'string') return;
            if (d.type.slice(0, 7) !== 'portal:') return;
            // After the handshake every message must carry our token; a frame
            // that can post to us is not automatically the portal.
            if (this.token && d.token !== this.token) return;

            switch (d.type) {
                case 'portal:hello':
                    if (this.connected) return;
                    clearTimeout(this._helloTimer);
                    this.connected = true;
                    this.token     = d.token;
                    this.tier      = d.tier;
                    this.caps      = d.caps || null;
                    this.settings  = d.settings || null;
                    this._fire('onHello', { tier: d.tier, caps: d.caps, save: d.save, settings: d.settings, standalone: false });
                    break;
                case 'portal:pause':    this._fire('onPause'); break;
                case 'portal:resume':   this._fire('onResume'); break;
                case 'portal:lowmem':   this._fire('onLowMemory', d.level || 1); break;
                case 'portal:settings':
                    this.settings = d.settings || null;
                    this._fire('onSettings', d.settings);
                    break;
                case 'portal:shutdown':
                    this.flush();
                    this._fire('onShutdown');
                    this.post('game:shutdown-ack', null);
                    this.dispose();
                    break;
            }
        },

        _fire(name, arg) {
            const fn = this._handlers && this._handlers[name];
            if (typeof fn === 'function') {
                try { fn(arg); } catch (err) { this.post('game:error', { message: String(err), stack: err && err.stack || '' }); }
            }
        },

        post(type, payload) {
            if (this.standalone || !global.parent || global.parent === global) return false;
            const msg = payload ? Object.assign({ type: type, token: this.token }, payload)
                                : { type: type, token: this.token };
            try { global.parent.postMessage(msg, this._origin); } catch (e) { return false; }
            return true;
        },

        /** Declare what the game needs; the portal has already gated on this,
         *  but a standalone-opened bundle can warn for itself. */
        ready(needs) { this.post('game:ready', { needs: needs || null }); },

        progress(v) { this.post('game:progress', { value: v }); },

        score(score, label) { this.post('game:score', { score: score, label: label || '' }); },

        /** Debounced save — games call this freely; it coalesces to <=1 write/2s. */
        save(data) {
            this._pendingSave = data;
            if (this._saveTimer) return;
            const self = this;
            this._saveTimer = setTimeout(function () { self.flush(); }, 2000);
        },

        flush() {
            if (this._saveTimer) { clearTimeout(this._saveTimer); this._saveTimer = 0; }
            if (this._pendingSave == null) return;
            const data = this._pendingSave;
            this._pendingSave = null;
            if (this.standalone) localSave(this.id, data);
            else this.post('game:save', { data: data });
        },

        stats(s) { this.post('game:stats', s); },

        pointerLock(locked) { this.post('game:pointerlock', { locked: !!locked }); },

        exit() { this.flush(); this.post('game:exit', null); },

        dispose() {
            if (this._onMessage) global.removeEventListener('message', this._onMessage);
            this._onMessage = null;
            this._handlers  = null;
            this.connected  = false;
        },
    };

    // --- standalone-only local persistence (never localStorage, per §1.4) ---
    function idb() {
        return new Promise(function (resolve, reject) {
            const req = indexedDB.open('pe-standalone', 1);
            req.onupgradeneeded = function () { req.result.createObjectStore('saves'); };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror   = function () { reject(req.error); };
        });
    }
    function localSave(id, data) {
        return idb().then(function (db) {
            const tx = db.transaction('saves', 'readwrite');
            tx.objectStore('saves').put({ data: data, at: Date.now() }, id);
            return new Promise(function (res) { tx.oncomplete = function () { db.close(); res(); }; });
        }).catch(function () { /* private mode / quota — play on without saves */ });
    }
    function localLoad(id) {
        return idb().then(function (db) {
            const tx = db.transaction('saves', 'readonly');
            const rq = tx.objectStore('saves').get(id);
            return new Promise(function (res) {
                rq.onsuccess = function () { db.close(); res(rq.result ? rq.result.data : null); };
                rq.onerror   = function () { db.close(); res(null); };
            });
        }).catch(function () { return null; });
    }

    PE.Bridge = Bridge;
    PE.PROTOCOL = PROTOCOL;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

    // Canvas
    W: 1280,
    H: 720,
    TS: 32,          // tile size px

    // World

    WH: 96,

    // Player

    LAUNDER_FEE: 0.08,

    // Police

    HEAT_PUBLIC_DEAL: 12,
    HEAT_INDOOR_DEAL: 2,
    BUST_THRESHOLD: 85,

    // Growing (game-hours)
    GROW_SPROUT:  8,
    GROW_VEG:    24,
    GROW_FLOWER: 48,
    GROW_READY:  72,

    // UI
    NOTIF_MS:   4000,
    MSG_DELAY_MS: 9000,  // delay before NPC first texts

    // Ranks
    RANKS: [

<script>
/* inlined from js/utils.js */
'use strict';

const U = {
    clamp: (v, lo, hi) => Math.max(lo, Math.min(hi, v)),
    lerp:  (a, b, t)   => a + (b - a) * t,
    dist:  (x1,y1,x2,y2) => Math.hypot(x2-x1, y2-y1),
    rng:   (lo, hi)    => Math.floor(Math.random() * (hi - lo + 1)) + lo,
    pick:  arr         => arr[Math.floor(Math.random() * arr.length)],
    shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    },

    money(n) {
        return '$' + Math.abs(n).toLocaleString('en-US', {
            minimumFractionDigits: 2, maximumFractionDigits: 2
        });
    },

    timeStr(gameMins) {
        const h = Math.floor(gameMins / 60) % 24;
        const m = Math.floor(gameMins % 60);
        const ap = h >= 12 ? 'PM' : 'AM';
        return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${ap}`;
    },

    weekday(day) {
        return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][day % 7];
    },

    // Pixel-perfect rect collision
    rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
        return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
    },

    // Wrap text for dialog boxes
    wrapText(ctx, text, maxW) {
        const words = text.split(' ');
        const lines = [];
        let line = '';
        for (const w of words) {
            const test = line ? line + ' ' + w : w;
            if (ctx.measureText(test).width > maxW && line) {
                lines.push(line);
                line = w;
            } else {
                line = test;
            }
        }
        if (line) lines.push(line);
        return lines;
    },

    // Deep copy plain object
    clone(obj) { return JSON.parse(JSON.stringify(obj)); },
};

    init(canvas) {
        PE.Teardown.on(window, 'keydown', e => {

            if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
                e.preventDefault();
        });
        PE.Teardown.on(window, 'keyup', e => { this.keys[e.code] = false; });

        PE.Teardown.on(canvas, 'mousemove', e => {
            const r = canvas.getBoundingClientRect();
            const sx = CFG.W / r.width;
            const sy = CFG.H / r.height;
            this.mouse.x = (e.clientX - r.left) * sx;
            this.mouse.y = (e.clientY - r.top)  * sy;

// Interactable objects in the world  [tx, ty, type, data]
const INTERACT_OBJECTS = [
    // Park bench / deal zones
    { tx:20, ty:18, type:'park',    label:'City Park',    action:'deal_zone' },

// ── World class ────────────────────────────────────────────────────────────
const World = {
    map: null,          // Uint8Array [WW * WH]
    mapW: CFG.WW,
    mapH: CFG.WH,
    buildingMap: null,  // which building index occupies each tile (-1 = none)
    buildings: [],

    init() {
        this.map        = new Uint8Array(this.mapW * this.mapH);
        this.buildingMap = new Int16Array(this.mapW * this.mapH).fill(-1);
        this.buildings   = [];
        this._generate();
    },

    _set(tx, ty, tile) {
        if (tx >= 0 && tx < this.mapW && ty >= 0 && ty < this.mapH)
            this.map[ty * this.mapW + tx] = tile;
    },

    _get(tx, ty) {
        if (tx < 0 || tx >= this.mapW || ty < 0 || ty >= this.mapH) return T.WALL;
        return this.map[ty * this.mapW + tx];
    },

    _fillRect(tx, ty, tw, th, tile) {
        for (let y = ty; y < ty+th; y++)
            for (let x = tx; x < tx+tw; x++)
                this._set(x, y, tile);
    },

    _setBuilding(tx, ty, tw, th, idx) {
        for (let y = ty; y < ty+th; y++)
            for (let x = tx; x < tx+tw; x++) {
                if (x >= 0 && x < this.mapW && y >= 0 && y < this.mapH)
                    this.buildingMap[y * this.mapW + x] = idx;
            }
    },

    _generate() {
        // 1. Base grass
        this.map.fill(T.GRASS);

        // 2. Trees scattered
        for (let i = 0; i < 300; i++) {
            const tx = U.rng(0, this.mapW-1);
            const ty = U.rng(0, this.mapH-1);
            this._set(tx, ty, T.TREE);
        }

        // 3. Main roads grid (every 16 tiles)
        for (let y = 0; y < this.mapH; y++) {
            for (let x = 0; x < this.mapW; x++) {
                const onMainX = (x === 16 || x === 32 || x === 48 || x === 64 || x === 80);
                const onMainY = (y === 16 || y === 32 || y === 48 || y === 64 || y === 80);
                if (onMainX || onMainY) {
                    // Two-lane road (width 2)
                    const RX = onMainX ? [x,x+1] : [x];
                    const RY = onMainY ? [y,y+1] : [y];
                    for (const rx of RX) for (const ry of RY) this._set(rx, ry, T.ROAD);
                }
                // Sidewalks on both sides of roads
                const nearRoadX = (x===15||x===18||x===31||x===34||x===47||x===50||x===63||x===66||x===79||x===82);
                const nearRoadY = (y===15||y===18||y===31||y===34||y===47||y===50||y===63||y===66||y===79||y===82);
                if (nearRoadX || nearRoadY) this._set(x, y, T.SIDEWALK);
            }
        }

        // 4. Water (port district)
        this._fillRect(72, 70, 24, 26, T.WATER);

        // 5. Parking lots
        this._fillRect(26, 8,  6, 3, T.PARKING);
        this._fillRect(62, 44, 8, 3, T.PARKING);
        this._fillRect(10, 48, 8, 3, T.PARKING);

        // 6. Park / open areas (overwrite trees)
        this._fillRect(17, 14, 12, 10, T.GRASS);
        this._fillRect(42, 14, 10,  8, T.GRASS);
        this._fillRect(55, 57, 10,  8, T.GRASS);

        // 7. Buildings
        for (const [bx,by,bw,bh,wc,fc,name,type,itile] of BUILDING_DEFS) {
            const idx = this.buildings.length;
            // Outer wall
            this._fillRect(bx, by, bw, bh, T.WALL);
            // Interior floor
            this._fillRect(bx+1, by+1, bw-2, bh-2, T.FLOOR);
            this._setBuilding(bx, by, bw, bh, idx);
            this.buildings.push({
                tx:bx, ty:by, tw:bw, th:bh,
                wallColor:wc, floorColor:fc,
                name, type,
                door: itile,   // where to stand to enter/exit
                idx,
            });
        }

        // 8. Industrial dirt
        this._fillRect(8, 49, 28, 15, T.DIRT);
        // Restore roads over dirt
        for (let x=0; x<this.mapW; x++) {
            for (let y=0; y<this.mapH; y++) {
                const t = this._get(x,y);
                if (t===T.ROAD) { /* keep road */ }
            }
        }
    },

    isSolid(tx, ty) {
        const t = this._get(tx, ty);
        return t === T.WALL || t === T.WATER || t === T.TREE || t === T.FENCE;
    },

    // Pixel-level collision for entity movement
    canMoveTo(px, py, hw, hh) {
        // Check 4 corners of the hitbox
        const corners = [
            [px - hw, py - hh], [px + hw - 1, py - hh],
            [px - hw, py + hh - 1], [px + hw - 1, py + hh - 1],
        ];
        for (const [cx, cy] of corners) {
            const tx = Math.floor(cx / CFG.TS);
            const ty = Math.floor(cy / CFG.TS);
            if (this.isSolid(tx, ty)) return false;
        }
        return true;
    },

    buildingAt(tx, ty) {
        if (tx < 0 || tx >= this.mapW || ty < 0 || ty >= this.mapH) return null;
        const idx = this.buildingMap[ty * this.mapW + tx];
        return idx >= 0 ? this.buildings[idx] : null;
    },

    // ── Rendering ──────────────────────────────────────────────────────────
    draw(ctx, camX, camY) {
        const TS = CFG.TS;
        const startTX = Math.max(0, Math.floor(camX / TS));
        const startTY = Math.max(0, Math.floor(camY / TS));
        const endTX   = Math.min(this.mapW, startTX + Math.ceil(CFG.W / TS) + 2);
        const endTY   = Math.min(this.mapH, startTY + Math.ceil(CFG.H / TS) + 2);

        for (let ty = startTY; ty < endTY; ty++) {
            for (let tx = startTX; tx < endTX; tx++) {
                const tile  = this._get(tx, ty);
                const bIdx  = this.buildingMap[ty * this.mapW + tx];
                const sx    = tx * TS - camX;
                const sy    = ty * TS - camY;

                // Use building-specific colours for wall/floor tiles
                if (bIdx >= 0) {
                    const b = this.buildings[bIdx];
                    ctx.fillStyle = (tile === T.WALL) ? b.wallColor : b.floorColor;
                } else {
                    ctx.fillStyle = TILE_COLORS[tile] || '#ff00ff';
                }
                ctx.fillRect(sx, sy, TS, TS);

                // Tile details
                if (tile === T.ROAD) this._drawRoadDetail(ctx, sx, sy, tx, ty, TS);
                if (tile === T.TREE) this._drawTree(ctx, sx, sy, TS);
                if (tile === T.WATER) this._drawWater(ctx, sx, sy, TS);
                if (tile === T.GRASS) this._drawGrass(ctx, sx, sy, tx, ty, TS);
            }
        }

        // Draw building names
        this._drawBuildingLabels(ctx, camX, camY, TS);

        // Draw interactive object icons
        for (const obj of INTERACT_OBJECTS) {
            const sx = obj.tx * TS - camX + TS/2;
            const sy = obj.ty * TS - camY + TS/2;
            if (sx < -32 || sx > CFG.W+32 || sy < -32 || sy > CFG.H+32) continue;
            if (obj.type === 'park') {
                ctx.fillStyle = 'rgba(80,200,80,0.25)';
                ctx.fillRect(sx - TS, sy - TS, TS*3, TS*3);
            } else if (obj.type === 'atm') {
                ctx.fillStyle = '#2a6fd4';
                ctx.fillRect(sx-8, sy-14, 16, 20);
                ctx.fillStyle = '#fff';
                ctx.font = '8px monospace';
                ctx.fillText('ATM', sx-7, sy-2);
            }
        }
    },

    _drawRoadDetail(ctx, sx, sy, tx, ty, TS) {
        // Center dashes
        const isVert = (tx===16||tx===17||tx===32||tx===33||tx===48||tx===49||tx===64||tx===65||tx===80||tx===81);
        ctx.fillStyle = '#f0c800';
        if (isVert) {
            if (ty % 4 === 0) ctx.fillRect(sx + TS/2 - 1, sy + 4, 2, TS - 8);
        } else {
            if (tx % 4 === 0) ctx.fillRect(sx + 4, sy + TS/2 - 1, TS - 8, 2);
        }
    },

    _drawTree(ctx, sx, sy, TS) {
        ctx.fillStyle = '#1a4a1a';
        ctx.beginPath();
        ctx.arc(sx + TS/2, sy + TS/2, TS/2 - 2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#2d7a2d';
        ctx.beginPath();
        ctx.arc(sx + TS/2 - 2, sy + TS/2 - 2, TS/2 - 5, 0, Math.PI*2);
        ctx.fill();
    },

    _drawWater(ctx, sx, sy, TS) {
        const t = (Date.now() / 1500);
        ctx.fillStyle = `hsl(${210 + Math.sin(t + sx*0.01)*8}, 65%, ${35 + Math.sin(t*1.3+sy*0.01)*5}%)`;
        ctx.fillRect(sx, sy, TS, TS);
        // Wave lines
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
            const wy = sy + 6 + i * 9 + Math.sin(t + sx * 0.05 + i) * 2;
            ctx.beginPath();
            ctx.moveTo(sx, wy);
            ctx.lineTo(sx + TS, wy);
            ctx.stroke();
        }
    },

    _drawGrass(ctx, sx, sy, tx, ty, TS) {
        // Subtle variation
        const h = ((tx * 73 + ty * 137) % 20);
        if (h < 5) {
            ctx.fillStyle = '#3d6e34';
            ctx.fillRect(sx + 4, sy + 4, 3, 3);
        } else if (h < 8) {
            ctx.fillStyle = '#5a9050';
            ctx.fillRect(sx + 16, sy + 10, 2, 2);
        }
    },

    _drawBuildingLabels(ctx, camX, camY, TS) {
        ctx.font = 'bold 10px "Courier New"';
        ctx.textAlign = 'center';
        for (const b of this.buildings) {
            const cx = (b.tx + b.tw/2) * TS - camX;
            const cy = (b.ty + 1) * TS - camY + TS/2;
            if (cx < -60 || cx > CFG.W+60 || cy < -20 || cy > CFG.H+20) continue;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            const tw = ctx.measureText(b.name).width;
            ctx.fillRect(cx - tw/2 - 3, cy - 11, tw+6, 14);
            ctx.fillStyle = '#ffe080';
            ctx.fillText(b.name, cx, cy);
        }
        ctx.textAlign = 'left';
    },
};

<script>
/* inlined from js/entities.js */
'use strict';

// ── Base Entity ───────────────────────────────────────────────────────────
class Entity {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.w = 22; this.h = 22;     // hitbox half-dims: actual is 2w × 2h
        this.facing = 'down';          // 'up' 'down' 'left' 'right'
        this.active = true;
    }

    move(dx, dy, dt) {
        if (dx !== 0) {
            const nx = this.x + dx * dt;
            if (World.canMoveTo(nx, this.y, this.w, this.h)) this.x = nx;
        }
        if (dy !== 0) {
            const ny = this.y + dy * dt;
            if (World.canMoveTo(this.x, ny, this.w, this.h)) this.y = ny;
        }
        if (dx < 0) this.facing = 'left';
        else if (dx > 0) this.facing = 'right';
        else if (dy < 0) this.facing = 'up';
        else if (dy > 0) this.facing = 'down';
    }

    get tx() { return Math.floor(this.x / CFG.TS); }
    get ty() { return Math.floor(this.y / CFG.TS); }

    distTo(other) { return U.dist(this.x, this.y, other.x, other.y); }

    // Draw cartoon-style character
    drawCharacter(ctx, sx, sy, bodyColor, headColor, hatColor, label) {
        const W = 20, H = 24;
        const hx = sx - W/2, hy = sy - H/2;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.ellipse(sx, sy + H/2 + 2, W/2, 4, 0, 0, Math.PI*2);
        ctx.fill();

        // Legs (animated)
        const legAnim = Math.sin(Date.now() * 0.012) * (this.vx||this.vy ? 6 : 0);
        ctx.fillStyle = '#2a2a2a';
        ctx.fillRect(hx + 4,  hy + H - 5,  5, 8 - Math.abs(legAnim));
        ctx.fillRect(hx + W - 9, hy + H - 5, 5, 8 + Math.abs(legAnim));

        // Body
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.roundRect(hx, hy + 8, W, H - 4, 4);
        ctx.fill();

        // Arms
        const armSwing = Math.sin(Date.now() * 0.012) * (this.vx||this.vy ? 10 : 0);
        ctx.fillStyle = bodyColor;
        ctx.fillRect(hx - 5, hy + 10 + armSwing, 6, 10);
        ctx.fillRect(hx + W - 1, hy + 10 - armSwing, 6, 10);

        // Neck
        ctx.fillStyle = headColor;
        ctx.fillRect(sx - 4, hy + 6, 8, 6);

        // Head
        ctx.fillStyle = headColor;
        ctx.beginPath();
        ctx.roundRect(hx + 1, hy - 10, W - 2, 20, 6);
        ctx.fill();

        // Hat (if any)
        if (hatColor) {
            ctx.fillStyle = hatColor;
            ctx.fillRect(hx - 1, hy - 14, W + 2, 6);
            ctx.fillRect(hx + 3, hy - 22, W - 6, 10);
        }

        // Eyes
        const eyeY = hy - 4;
        const blink = (Math.sin(Date.now() * 0.0015) > 0.97) ? 1 : 3;
        ctx.fillStyle = '#111';
        ctx.fillRect(hx + 4, eyeY, 4, blink);
        ctx.fillRect(hx + W - 8, eyeY, 4, blink);
        // Pupils
        if (blink > 1) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(hx + 5, eyeY + 1, 2, 2);
            ctx.fillRect(hx + W - 7, eyeY + 1, 2, 2);
        }

        // Label
        if (label) {
            ctx.font = '10px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            const lw = ctx.measureText(label).width;
            ctx.fillRect(sx - lw/2 - 3, hy - 28, lw + 6, 13);
            ctx.fillStyle = '#fff';
            ctx.fillText(label, sx, hy - 18);
            ctx.textAlign = 'left';
        }
    }
}

// ── Player ────────────────────────────────────────────────────────────────
const Player = {
    x: (CFG.WW / 2) * CFG.TS,
    y: (CFG.WH / 2) * CFG.TS,
    w: 11, h: 11,
    facing: 'down',
    vx: 0, vy: 0,
    active: true,

    // Core stats
    cash: CFG.START_CASH,
    xp: 0,
    rank: 0,
    heat: 0,
    energy: 100,   // 0-100, depletes when sprinting
    hidden: false, // hiding in dumpster

    // Inventory: { [productKey]: { strainId, effects, grams, packaging } }
    inventory: {},
    // Supplies: { [itemId]: count }
    supplies: { baggie: 20 },
    // Active pots (across all owned properties)
    // Managed by GrowSystem

    get tx() { return Math.floor(this.x / CFG.TS); },
    get ty() { return Math.floor(this.y / CFG.TS); },

    get rankData() { return CFG.RANKS[Math.min(this.rank, CFG.RANKS.length - 1)]; },

    addXP(n) {
        this.xp += n;
        while (this.rank < CFG.RANKS.length - 1 &&
               this.xp >= CFG.RANKS[this.rank + 1].xp) {
            this.rank++;
            UI.notify(`🏆 RANK UP! You are now: ${CFG.RANKS[this.rank].name}`, '#ffd700');
        }
    },

    earn(amount, source = '') {
        this.cash += amount;
        this.addXP(Math.floor(amount / 5));
        if (source) UI.notify(`+${U.money(amount)} — ${source}`, '#4caf50');
    },

    spend(amount) {
        if (this.cash < amount) return false;
        this.cash -= amount;
        return true;
    },

    addInventory(strainId, effects, grams) {
        const key = strainId + ':' + effects.join(',');
        if (!this.inventory[key]) {
            this.inventory[key] = { strainId, effects: [...effects], grams: 0, key };
        }
        this.inventory[key].grams += grams;
    },

    removeInventory(key, grams) {
        if (!this.inventory[key]) return false;
        if (this.inventory[key].grams < grams) return false;
        this.inventory[key].grams -= grams;
        if (this.inventory[key].grams <= 0) delete this.inventory[key];
        return true;
    },

    totalGrams() {
        return Object.values(this.inventory).reduce((s, v) => s + v.grams, 0);
    },

    // Pixel-level movement
    update(dt) {
        if (GameState.uiMode !== 'playing') return;
        if (this.hidden) return;

        const speed = Input.sprint && this.energy > 0
            ? CFG.SPRINT : CFG.SPEED;

        const dx = Input.axis('ArrowLeft','KeyA') + Input.axis('ArrowLeft','ArrowLeft')
                 || Input.left;
        const dy = Input.axis('ArrowUp','KeyW') + Input.axis('ArrowUp','ArrowUp')
                 || 0;

        let mx = Input.left;
        let my = Input.up;

        // Re-read properly
        mx = (Input.down('KeyA') || Input.down('ArrowLeft') ? -1 : 0)
           + (Input.down('KeyD') || Input.down('ArrowRight') ? 1 : 0);
        my = (Input.down('KeyW') || Input.down('ArrowUp')   ? -1 : 0)
           + (Input.down('KeyS') || Input.down('ArrowDown') ? 1 : 0);

        if (mx !== 0 && my !== 0) { mx *= 0.707; my *= 0.707; }

        const spd = (Input.sprint && this.energy > 10) ? CFG.SPRINT : CFG.SPEED;

        if (mx !== 0) {
            const nx = this.x + mx * spd * dt;
            if (World.canMoveTo(nx, this.y, this.w, this.h)) this.x = nx;
        }
        if (my !== 0) {
            const ny = this.y + my * spd * dt;
            if (World.canMoveTo(this.x, ny, this.w, this.h)) this.y = ny;
        }

        if (mx < 0) this.facing = 'left';
        else if (mx > 0) this.facing = 'right';
        else if (my < 0) this.facing = 'up';
        else if (my > 0) this.facing = 'down';

        this.vx = mx; this.vy = my;

        // Energy drain/regen
        if (Input.sprint && (mx||my)) this.energy = Math.max(0, this.energy - 15 * dt);
        else this.energy = Math.min(100, this.energy + 8 * dt);

        // Clamp to world bounds
        this.x = U.clamp(this.x, this.w, World.mapW * CFG.TS - this.w);
        this.y = U.clamp(this.y, this.h, World.mapH * CFG.TS - this.h);
    },

    draw(ctx, camX, camY) {
        const sx = this.x - camX;
        const sy = this.y - camY;
        const e = new Entity(0, 0);
        e.vx = this.vx; e.vy = this.vy;
        e.drawCharacter(ctx, sx, sy, '#1e90ff', '#FDBCB4', null, null);

        // Sprint particles
        if (Input.sprint && (this.vx || this.vy) && this.energy > 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            for (let i = 0; i < 3; i++) {
                ctx.fillRect(
                    sx - this.vx * U.rng(10,25) + U.rng(-5,5),
                    sy - this.vy * U.rng(10,25) + U.rng(-5,5),
                    2, 2
                );
            }
        }
    },
};

// ── NPC Manager ────────────────────────────────────────────────────────────
const NPCManager = {
    npcs: [],

    init() {
        this.npcs = NPC_DEFS.map(def => {
            const npc = Object.assign({}, def);
            npc.x = (def.tx + 0.5) * CFG.TS;
            npc.y = (def.ty + 0.5) * CFG.TS;
            npc.vx = 0; npc.vy = 0;
            // Customer state
            npc.unlocked    = (def.unlockRank === 0);
            npc.introduced  = false;
            npc.hired       = false;
            npc.spentToday  = 0;
            // Patrol/wander state
            npc.patrolIdx   = 0;
            npc.moveTimer   = 0;
            npc.wanderTarget = null;
            npc.w = 10; npc.h = 10;
            return npc;
        });
    },

    update(dt) {
        for (const npc of this.npcs) {
            if (!npc.active) continue;
            if (npc.role === 'ambient') this._updateWander(npc, dt);
            if (npc.role === 'police')  this._updatePatrol(npc, dt);
            if ((npc.role === 'customer' || npc.role === 'dealer') && npc.unlocked)
                this._updateCustomer(npc, dt);
        }
    },

    _updateWander(npc, dt) {
        npc.moveTimer -= dt;
        if (!npc.wanderTarget || npc.moveTimer <= 0) {
            const ox = (npc.tx || Math.floor(npc.x/CFG.TS));
            const oy = (npc.ty || Math.floor(npc.y/CFG.TS));
            const r  = npc.wanderRadius || 4;
            npc.wanderTarget = {
                x: (ox + U.rng(-r, r) + 0.5) * CFG.TS,
                y: (oy + U.rng(-r, r) + 0.5) * CFG.TS,
            };
            npc.moveTimer = U.rng(2, 6);
        }
        this._moveToward(npc, npc.wanderTarget.x, npc.wanderTarget.y, 50, dt);
    },

    _updatePatrol(npc, dt) {
        if (!npc.patrolPath || npc.patrolPath.length === 0) return;
        npc.patrolWait -= dt;
        if (npc.patrolWait > 0) return;

        const target = npc.patrolPath[npc.patrolIdx];
        const tx = (target[0] + 0.5) * CFG.TS;
        const ty = (target[1] + 0.5) * CFG.TS;
        const d  = U.dist(npc.x, npc.y, tx, ty);

        if (d < 8) {
            npc.patrolIdx = (npc.patrolIdx + 1) % npc.patrolPath.length;
            npc.patrolWait = U.rng(1, 3);
        } else {
            this._moveToward(npc, tx, ty, 70, dt);
        }

        // Police: check if close to player and heat is high
        if (GameState.heat > CFG.BUST_THRESHOLD) {
            const dp = U.dist(npc.x, npc.y, Player.x, Player.y);
            if (dp < 120) {
                // Chase!
                this._moveToward(npc, Player.x, Player.y, 90, dt);
                if (dp < 35) {
                    PoliceSystem.bust();
                }
            }
        } else {
            // Random search
            const dp = U.dist(npc.x, npc.y, Player.x, Player.y);
            if (dp < 80 && GameState.heat > 30) {
                this._moveToward(npc, Player.x, Player.y, 75, dt);
                if (dp < 35) PoliceSystem.bodySearch();
            }
        }
    },

    _updateCustomer(npc, dt) {
        // Idle near their spawn point
        npc.moveTimer -= dt;
        if (npc.moveTimer <= 0) {
            npc.wanderTarget = {
                x: (npc.tx + U.rng(-2,2) + 0.5) * CFG.TS,
                y: (npc.ty + U.rng(-2,2) + 0.5) * CFG.TS,
            };
            npc.moveTimer = U.rng(3, 8);
        }
        if (npc.wanderTarget) {
            this._moveToward(npc, npc.wanderTarget.x, npc.wanderTarget.y, 45, dt);
        }
    },

    _moveToward(npc, tx, ty, speed, dt) {
        const dx = tx - npc.x;
        const dy = ty - npc.y;
        const d  = Math.hypot(dx, dy);
        if (d < 4) { npc.vx = 0; npc.vy = 0; return; }
        const nx = dx / d * speed * dt;
        const ny = dy / d * speed * dt;
        if (World.canMoveTo(npc.x + nx, npc.y, npc.w, npc.h)) npc.x += nx;
        if (World.canMoveTo(npc.x, npc.y + ny, npc.w, npc.h)) npc.y += ny;
        npc.vx = nx / dt; npc.vy = ny / dt;
        if (dx < 0) npc.facing = 'left';
        else if (dx > 0) npc.facing = 'right';
        else if (dy < 0) npc.facing = 'up';
        else npc.facing = 'down';

        for (const npc of this.npcs) {
            if (!npc.active) continue;

            if (npc.role === 'customer' && !npc.unlocked) continue;
            if (npc.role === 'dealer'   && !npc.hired)    continue;

            const sx = npc.x - camX;
            const sy = npc.y - camY;
            if (sx < -40 || sx > CFG.W+40 || sy < -40 || sy > CFG.H+40) continue;

            ent.vx = npc.vx; ent.vy = npc.vy;
            const label = npc.role === 'police' ? npc.name : (npc.name || null);
            ent.drawCharacter(ctx, sx, sy,
                npc.bodyColor, npc.headColor, npc.hatColor,
                label
            );

            // Police badge
            if (npc.role === 'police') {
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 9px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('POLICE', sx, sy + 14);
                ctx.textAlign = 'left';
            }

            // Interact prompt
            if (npc.role !== 'ambient') {
                const dp = U.dist(npc.x, npc.y, Player.x, Player.y);
                if (dp < CFG.INTERACT) {
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.font = '11px "Courier New"';
                    ctx.textAlign = 'center';
                    ctx.fillText('[E] Talk', sx, sy - 34);
                    ctx.textAlign = 'left';
                }
            }
        }
    },

    getNearest(x, y, range, role) {
        let best = null, bestD = range;
        for (const npc of this.npcs) {
            if (!npc.active) continue;
            if (role && npc.role !== role) continue;
            if (npc.role === 'customer' && !npc.unlocked) continue;
            if (npc.role === 'dealer'   && !npc.hired)    continue;
            const d = U.dist(npc.x, npc.y, x, y);
            if (d < bestD) { bestD = d; best = npc; }
        }
        return best;
    },

    getById(id) { return this.npcs.find(n => n.id === id); },

    unlockCustomer(id) {
        const npc = this.getById(id);
        if (npc && !npc.unlocked) {
            npc.unlocked = true;
            Phone.addContact(npc);
            Phone.receiveMessage(npc.id, npc.introMsg);
            UI.notify(`📱 New contact: ${npc.name}`, '#4caf50');
        }
    },
};
</script>
<script>
/* inlined from js/systems.js */
'use strict';

// ── Game State (global) ───────────────────────────────────────────────────
const GameState = {
    uiMode:  'playing',   // 'playing' | 'phone' | 'inventory' | 'map' | 'shop' | 'dialog' | 'mixing'
    day:     0,
    gameMins: 8 * 60,     // start 08:00
    heat:    0,
    lastDealTime: 0,      // gameMins when last deal happened

    // Active shop / dialog context
    activeShop:   null,
    activeDialog: null,
    activeMix:    null,    // { key, strainId, effects, grams }

    // Owned properties
    properties: ['motel_room'],

    // Grow pots: [{ propertyId, slotIdx, strainId, plantedAt (gameMins), stage, watered, fertilized, effects }]
    pots: [],

    // Dealer assignments: { dealerId: { productKey, gramsSupplied, gramsLeft, cutPct } }
    dealers: {},

    // Laundry / bank
    bankBalance: 0,

    // Flags
    flags: {},

    tick(dt) {
        const prevMins = this.gameMins;
        this.gameMins += dt * CFG.MIN_PER_SEC;
        if (Math.floor(this.gameMins / (60*24)) > Math.floor(prevMins / (60*24))) {
            this._onNewDay();
        }
    },

    _onNewDay() {
        this.day++;
        // Reset customer spend
        for (const npc of NPCManager.npcs) npc.spentToday = 0;
        // Grow tick
        GrowSystem.dailyTick();
        // Dealer sales tick
        DealerSystem.dailyTick();
        UI.notify(`☀️ ${U.weekday(this.day)} — Day ${this.day + 1}`, '#ffe082');
        // Unlock customers by rank
        CustomerSystem.checkUnlocks();
    },
};

// ── Police System ──────────────────────────────────────────────────────────
const PoliceSystem = {
    wantedFlash: 0,
    searchCooldown: 0,
    bustCooldown: 0,

    update(dt) {
        // Decay heat over time
        if (GameState.heat > 0) {
            GameState.heat = Math.max(0,
                GameState.heat - CFG.HEAT_DECAY_MIN * CFG.MIN_PER_SEC * dt
            );
        }
        if (this.searchCooldown > 0) this.searchCooldown -= dt;
        if (this.bustCooldown   > 0) this.bustCooldown   -= dt;
        if (this.wantedFlash    > 0) this.wantedFlash    -= dt;
    },

    addHeat(amount, reason) {
        GameState.heat = Math.min(CFG.MAX_HEAT, GameState.heat + amount);
        if (reason) UI.notify(`🚨 Heat +${amount} — ${reason}`, '#f44336');
        if (GameState.heat > 60) this.wantedFlash = 0.3;
    },

    bodySearch() {
        if (this.searchCooldown > 0 || Player.hidden) return;
        this.searchCooldown = 30; // 30 real seconds cooldown
        const hasProduct = Player.totalGrams() > 0;
        if (hasProduct && GameState.heat > 20) {
            // Confiscate product
            UI.showDialog('Officer Davis',
                "Body search in progress... We found something on you. You're coming with us.",
                [{ label:'Cooperate', action:'bust' },
                 { label:'Run!', action:'run' }]);
        } else {
            UI.notify('Officer: "Move along, nothing to see here."', '#90caf9');
        }
    },

    bust() {
        if (this.bustCooldown > 0) return;
        this.bustCooldown = 60;
        const lost = Math.min(Player.cash, Math.floor(Player.cash * 0.5));
        const productKeys = Object.keys(Player.inventory);
        Player.cash -= lost;
        Player.inventory = {};
        GameState.heat = Math.max(0, GameState.heat - 40);
        UI.notify(`⚠️ BUSTED! Lost ${U.money(lost)} and all product.`, '#f44336');
        UI.closeAllPanels();
        GameState.uiMode = 'playing';
    },

    flee() {
        // Running adds heat
        this.addHeat(20, 'fleeing police');
    },
};

// ── Grow System ────────────────────────────────────────────────────────────
const GrowSystem = {
    STAGES: ['Planted','Sprouting','Vegetative','Flowering','Ready'],

    plant(propertyId, slotIdx, strainId) {
        const prop = PROPERTIES.find(p => p.id === propertyId);
        if (!prop) return false;
        // Check slot availability
        const occupied = GameState.pots.filter(p => p.propertyId === propertyId).length;
        if (occupied >= prop.potSlots) {
            UI.notify('No free pot slots in this property.', '#f44336');
            return false;
        }
        if (!Player.supplies[strainId + '_seed'] || Player.supplies[strainId + '_seed'] < 1) {
            UI.notify('You need seeds to plant!', '#f44336');
            return false;
        }
        Player.supplies[strainId + '_seed']--;
        GameState.pots.push({
            propertyId, slotIdx,
            strainId,
            plantedAt:  GameState.gameMins,
            stage:      0,
            watered:    true,
            fertilized: false,
            effects:    [...(STRAINS[strainId]?.effects || [])],
            id: Date.now() + Math.random(),
        });
        UI.notify(`🌱 Planted ${STRAINS[strainId]?.name}!`, '#4caf50');
        return true;
    },

    water(potId) {
        const pot = GameState.pots.find(p => p.id === potId);
        if (pot) { pot.watered = true; UI.notify('💧 Watered the plant.', '#64b5f6'); }
    },

    fertilize(potId) {
        const pot = GameState.pots.find(p => p.id === potId);
        if (!pot) return;
        if (!Player.supplies.fertilizer || Player.supplies.fertilizer < 1) {
            UI.notify('No fertilizer in supplies.', '#f44336'); return;
        }
        Player.supplies.fertilizer--;
        pot.fertilized = true;
        UI.notify('🌿 Applied fertilizer — growth boosted!', '#81c784');
    },

    harvest(potId) {
        const idx = GameState.pots.findIndex(p => p.id === potId);
        if (idx < 0) return;
        const pot = GameState.pots[idx];
        if (pot.stage < 4) { UI.notify("Plant isn't ready to harvest yet.", '#f44336'); return; }
        const strain = STRAINS[pot.strainId];
        const base   = strain?.yieldGrams || 28;
        const bonus  = pot.fertilized ? 1.25 : 1.0;
        const grams  = Math.round(base * bonus * (0.8 + Math.random() * 0.4));
        Player.addInventory(pot.strainId, pot.effects, grams);
        GameState.pots.splice(idx, 1);
        Player.addXP(50);
        UI.notify(`✂️ Harvested ${grams}g of ${strain?.name}!`, '#4caf50');
    },

    dailyTick() {
        const hoursPassed = 24;
        for (const pot of GameState.pots) {
            if (!pot.watered) continue; // needs water to grow
            const hoursGrown = (GameState.gameMins - pot.plantedAt) / 60;
            const speed = pot.fertilized ? 1.25 : 1.0;
            const effective = hoursGrown * speed;
            const thresholds = [
                CFG.GROW_SPROUT, CFG.GROW_VEG, CFG.GROW_FLOWER, CFG.GROW_READY
            ];
            let stage = 0;
            for (let i = 0; i < thresholds.length; i++) {
                if (effective >= thresholds[i]) stage = i + 1;
            }
            const oldStage = pot.stage;
            pot.stage = Math.min(4, stage);
            pot.watered = false; // needs watering each "day"
            if (pot.stage !== oldStage) {
                const name = STRAINS[pot.strainId]?.name;
                UI.notify(`🌿 ${name} reached stage: ${this.STAGES[pot.stage]}`, '#81c784');
            }
        }
    },

    getPotsForProperty(propertyId) {
        return GameState.pots.filter(p => p.propertyId === propertyId);
    },
};

// ── Mixing System ──────────────────────────────────────────────────────────
const MixSystem = {
    mix(productKey, additiveId) {
        const slot = Player.inventory[productKey];
        if (!slot) { UI.notify('Product not found.', '#f44336'); return; }
        const add = ADDITIVES[additiveId];
        if (!add) { UI.notify('Additive not found.', '#f44336'); return; }
        if (!Player.supplies[additiveId] || Player.supplies[additiveId] < 1) {
            UI.notify(`No ${add.name} in supplies.`, '#f44336'); return;
        }
        Player.supplies[additiveId]--;

        const newEffects = applyAdditive(slot.effects, add.adds);
        const oldKey = productKey;
        const newKey = slot.strainId + ':' + newEffects.join(',');

        const grams = slot.grams;
        delete Player.inventory[oldKey];

        if (!Player.inventory[newKey]) {
            Player.inventory[newKey] = { strainId: slot.strainId, effects: newEffects, grams: 0, key: newKey };
        }
        Player.inventory[newKey].grams += grams;

        const newEff = newEffects[newEffects.length - 1];
        UI.notify(`🧪 Mixed in ${add.icon} ${add.name} → ${newEff} effect added!`, '#ba68c8');
        Player.addXP(10);

        // Close and reopen mix panel to refresh
        if (GameState.activeMix?.key === oldKey) {
            GameState.activeMix = Player.inventory[newKey]
                ? { ...Player.inventory[newKey], key: newKey }
                : null;
        }
    },
};

// ── Economy / Deal System ─────────────────────────────────────────────────
const EconomySystem = {
    deal(npc, productKey, grams) {
        const slot = Player.inventory[productKey];
        if (!slot || slot.grams < grams) {
            UI.notify("You don't have enough product.", '#f44336'); return false;
        }
        if (npc.spentToday + calcGramPrice(slot.strainId, slot.effects) * grams > npc.maxSpendDay) {
            UI.notify(`${npc.name} has hit their daily budget.`, '#ff9800'); return false;
        }
        const value = Math.round(calcBatchValue(slot.strainId, slot.effects, grams));
        Player.removeInventory(productKey, grams);
        npc.spentToday += value;

        // Heat based on location
        const inBuilding = World.buildingAt(Player.tx, Player.ty) !== null;
        const heatAdd = inBuilding ? CFG.HEAT_INDOOR_DEAL : CFG.HEAT_PUBLIC_DEAL;
        PoliceSystem.addHeat(heatAdd, 'street deal');

        Player.earn(value, `sold ${grams}g to ${npc.name}`);
        Phone.addDealRecord(npc.id, grams, value);

        UI.notify(`💰 Sold ${grams}g to ${npc.name} for ${U.money(value)}`, '#4caf50');
        return true;
    },

    buyItem(itemDef) {
        if (!Player.spend(itemDef.cost)) {
            UI.notify("Not enough cash.", '#f44336'); return false;
        }
        if (itemDef.category === 'seed') {
            const key = itemDef.strainId + '_seed';
            Player.supplies[key] = (Player.supplies[key] || 0) + 1;
        } else if (itemDef.category === 'additive') {
            Player.supplies[itemDef.id] = (Player.supplies[itemDef.id] || 0) + 1;
        } else if (itemDef.id === 'baggie') {
            Player.supplies.baggie = (Player.supplies.baggie || 0) + (itemDef.qty || 1);
        } else {
            Player.supplies[itemDef.id] = (Player.supplies[itemDef.id] || 0) + 1;
        }
        UI.notify(`🛒 Bought: ${itemDef.name} (${U.money(itemDef.cost)})`, '#64b5f6');
        return true;
    },

    buyProperty(propId) {
        const prop = PROPERTIES.find(p => p.id === propId);
        if (!prop) return false;
        if (prop.owned || GameState.properties.includes(propId)) {
            UI.notify("You already own this property.", '#ff9800'); return false;
        }
        if (!Player.spend(prop.cost)) {
            UI.notify(`Need ${U.money(prop.cost)} to buy this.`, '#f44336'); return false;
        }
        GameState.properties.push(propId);
        prop.owned = true;
        Player.addXP(200);
        UI.notify(`🏠 You now own: ${prop.name}!`, '#ffd700');
        return true;
    },

    launder(amount) {
        if (amount <= 0 || Player.cash < amount) {
            UI.notify("Invalid amount.", '#f44336'); return;
        }
        const fee = Math.round(amount * CFG.LAUNDER_FEE);
        const clean = amount - fee;
        if (!Player.spend(amount)) return;
        GameState.bankBalance += clean;
        UI.notify(`🏦 Laundered ${U.money(amount)} — fee: ${U.money(fee)}`, '#90caf9');
    },
};

// ── Customer System ────────────────────────────────────────────────────────
const CustomerSystem = {
    checkUnlocks() {
        const rank = Player.rank;
        for (const npc of NPCManager.npcs) {
            if (npc.role === 'customer' && !npc.unlocked && npc.unlockRank <= rank) {
                // Delay intro message slightly
                setTimeout(() => NPCManager.unlockCustomer(npc.id),
                    U.rng(5000, 20000));
            }
        }
    },

    // Called when player talks to a customer NPC
    openDealMenu(npc) {
        if (!npc.introduced) {
            npc.introduced = true;
            Phone.receiveMessage(npc.id, npc.introMsg);
        }
        GameState.uiMode   = 'deal';
        GameState.dealTarget = npc;
        UI.showDealPanel(npc);
    },
};

// ── Dealer System ──────────────────────────────────────────────────────────
const DealerSystem = {
    hire(npcId) {
        const npc = NPCManager.getById(npcId);
        if (!npc || npc.role !== 'dealer') return;
        if (!Player.spend(npc.hireCost)) {
            UI.notify(`Need ${U.money(npc.hireCost)} to hire ${npc.name}.`, '#f44336'); return;
        }
        npc.hired = true;
        GameState.dealers[npcId] = { productKey: null, gramsSupplied: 0, gramsLeft: 0, cutPct: npc.cutPct };
        Player.addXP(100);
        UI.notify(`🤝 Hired ${npc.name} as a dealer!`, '#4caf50');
        Phone.receiveMessage(npcId, npc.introMsg);
    },

    supply(npcId, productKey, grams) {
        const dealer = GameState.dealers[npcId];
        if (!dealer) return;
        if (!Player.removeInventory(productKey, grams)) {
            UI.notify("Not enough product to supply.", '#f44336'); return;
        }
        dealer.productKey    = productKey;
        dealer.gramsSupplied += grams;
        dealer.gramsLeft     += grams;
        UI.notify(`📦 Supplied ${grams}g to dealer.`, '#64b5f6');
    },

    dailyTick() {
        for (const [npcId, dealer] of Object.entries(GameState.dealers)) {
            if (!dealer.productKey || dealer.gramsLeft <= 0) continue;
            const npc    = NPCManager.getById(npcId);
            const sold   = Math.min(dealer.gramsLeft, U.rng(8, 20));
            const slot   = Player.inventory[dealer.productKey];
            const pricePG = slot
                ? calcGramPrice(slot.strainId, slot.effects)
                : 38;
            const revenue  = Math.round(sold * pricePG);
            const cut      = Math.round(revenue * dealer.cutPct);
            const profit   = revenue - cut;
            dealer.gramsLeft -= sold;
            Player.earn(profit, `${npc?.name || 'Dealer'}'s daily sales`);
            if (dealer.gramsLeft <= 0) {
                Phone.receiveMessage(npcId, "All out of product. Need a re-up ASAP.");
            }
        }
    },
};

// ── Interaction Handler ───────────────────────────────────────────────────
const Interaction = {
    tryInteract() {
        // Check NPC
        const npc = NPCManager.getNearest(Player.x, Player.y, CFG.INTERACT);
        if (npc) { this._interactNPC(npc); return; }

        // Check building door
        const b = World.buildingAt(Player.tx, Player.ty);
        if (b) { this._interactBuilding(b); return; }

        // Check interactive objects
        for (const obj of INTERACT_OBJECTS) {
            const ox = (obj.tx + 0.5) * CFG.TS;
            const oy = (obj.ty + 0.5) * CFG.TS;
            if (U.dist(Player.x, Player.y, ox, oy) < CFG.INTERACT) {
                this._interactObject(obj); return;
            }
        }
    },

    _interactNPC(npc) {
        if (npc.role === 'police') {
            UI.showDialog(npc.name,
                GameState.heat > 30
                    ? "Hold it right there. Mind if I search you?"
                    : "Everything alright? Move along.",
                GameState.heat > 30
                    ? [{ label:'Allow search', action:'search' },
                       { label:'Run!', action:'run_police' }]
                    : [{ label:'Sure officer', action:'dismiss' }]
            );
        } else if (npc.role === 'dealer') {
            if (!npc.hired) {
                UI.showDialog(npc.name, `Hire ${npc.name} as a dealer for ${U.money(npc.hireCost)}?`,
                    [{ label:`Hire (${U.money(npc.hireCost)})`, action:'hire_dealer', npcId: npc.id },
                     { label:'Not now', action:'dismiss' }]);
            } else {
                UI.showDealerPanel(npc);
            }
        } else if (npc.role === 'customer') {
            CustomerSystem.openDealMenu(npc);
        }
    },

    _interactBuilding(b) {
        switch (b.type) {
            case 'store':    UI.showShop('store');      break;
            case 'supplier': UI.showShop('supplier');   break;
            case 'motel':
            case 'house':
            case 'warehouse':
            case 'penthouse':
                UI.showPropertyPanel(b); break;
            case 'laundry':
                UI.showLaundryPanel();   break;
            case 'casino':
                UI.showCasinoPanel();    break;
            case 'pawn':
                UI.showPawnPanel();      break;
            default:
                UI.showDialog(b.name, "You're inside " + b.name + '.', [{ label:'Leave', action:'dismiss' }]);
        }
    },

    _interactObject(obj) {
        if (obj.action === 'atm') UI.showATMPanel();
        if (obj.action === 'hide') {
            Player.hidden = !Player.hidden;
            UI.notify(Player.hidden ? '🗑️ Hiding in dumpster...' : 'You stepped out.', '#90a4ae');
        }
    },
};
</script>
<script>
/* inlined from js/phone.js */
'use strict';

const Phone = {
    contacts: [],      // { id, name, unread, messages: [{from, text, time}] }
    activeContact: null,
    pendingMessages: [],

    init() {
        this.contacts = [];
        // Add player's own contact for system messages
        this.contacts.push({ id:'system', name:'📋 Journal', unread:0, messages:[
            { from:'system', text:"Welcome. Stay low, stay smart. Press [F] to open your phone.", time: GameState.gameMins },
        ]});
    },

    addContact(npc) {
        if (this.contacts.find(c => c.id === npc.id)) return;
        this.contacts.push({ id: npc.id, name: npc.name, unread: 0, messages: [], role: npc.role });
    },

    receiveMessage(contactId, text) {
        let contact = this.contacts.find(c => c.id === contactId);
        if (!contact) {
            const npc = NPCManager.getById(contactId);
            if (!npc) return;
            this.addContact(npc);
            contact = this.contacts.find(c => c.id === contactId);
        }
        contact.messages.push({ from: contactId, text, time: GameState.gameMins });
        if (this.activeContact !== contactId) {
            contact.unread++;
        }
        const name = contact.name;
        UI.notify(`📱 ${name}: "${text.slice(0, 40)}${text.length > 40 ? '…' : ''}"`, '#7e57c2');
    },

    sendMessage(contactId, text) {
        const contact = this.contacts.find(c => c.id === contactId);
        if (!contact) return;
        contact.messages.push({ from:'player', text, time: GameState.gameMins });
        // Auto-reply from NPC
        setTimeout(() => this._npcReply(contactId), U.rng(3000, 8000));
    },

    _npcReply(contactId) {
        const npc = NPCManager.getById(contactId);
        if (!npc) return;
        const replies = {
            customer: [
                "Got anything good right now?",
                "How much you got on you?",
                "I need something this week.",
                "What strains you carrying?",
                "Hurry up, I'm waiting.",
            ],
            dealer: [
                "Supply's running low. Need a re-up.",
                "Sales are good. Need more product.",
                "When you coming through?",
                "Running out soon.",
            ],
        };
        const pool = replies[npc.role] || ["..."];
        this.receiveMessage(contactId, U.pick(pool));
    },

    addDealRecord(contactId, grams, value) {
        const contact = this.contacts.find(c => c.id === contactId);
        if (contact) {
            contact.messages.push({
                from: 'player',
                text: `[Deal: ${grams}g for ${U.money(value)}]`,
                time: GameState.gameMins,
            });
        }
    },

    open(contactId) {
        GameState.uiMode = 'phone';
        if (contactId) {
            this.activeContact = contactId;
            const c = this.contacts.find(c => c.id === contactId);
            if (c) c.unread = 0;
        } else {
            this.activeContact = this.contacts[0]?.id || null;
        }
    },

    close() {
        GameState.uiMode = 'playing';
        this.activeContact = null;
    },

    totalUnread() {
        return this.contacts.reduce((s, c) => s + c.unread, 0);
    },

    // ── Render the phone UI (canvas overlay) ─────────────────────────────
    draw(ctx) {
        if (GameState.uiMode !== 'phone') return;

        const pw = 580, ph = 520;
        const px = (CFG.W - pw) / 2;
        const py = (CFG.H - ph) / 2;

        // Phone body
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.roundRect(px, py, pw, ph, 16);
        ctx.fill();
        ctx.strokeStyle = '#4a4a8a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Title bar
        ctx.fillStyle = '#16213e';
        ctx.fillRect(px, py, pw, 42);
        ctx.fillStyle = '#e2e2e2';
        ctx.font = 'bold 16px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('📱 PHONE', px + pw/2, py + 27);
        ctx.textAlign = 'left';

        // Close button
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(px + pw - 36, py + 8, 26, 26);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('✕', px + pw - 23, py + 26);
        ctx.textAlign = 'left';

        // Contact list (left pane)
        const listW = 180;
        ctx.fillStyle = '#0f3460';
        ctx.fillRect(px, py + 42, listW, ph - 42);

        ctx.font = 'bold 11px "Courier New"';
        ctx.fillStyle = '#90caf9';
        ctx.fillText('CONTACTS', px + 10, py + 60);

        for (let i = 0; i < this.contacts.length; i++) {
            const c  = this.contacts[i];
            const cy = py + 72 + i * 38;
            const isActive = c.id === this.activeContact;

            ctx.fillStyle = isActive ? '#1565c0' : (i % 2 === 0 ? '#0d2a50' : '#0a2244');
            ctx.fillRect(px, cy, listW, 36);

            ctx.fillStyle = isActive ? '#fff' : '#90caf9';
            ctx.font = (isActive ? 'bold ' : '') + '12px "Courier New"';
            ctx.fillText(c.name.slice(0, 14), px + 10, cy + 14);

            if (c.messages.length > 0) {
                const last = c.messages[c.messages.length - 1];
                ctx.fillStyle = '#607d8b';
                ctx.font = '9px "Courier New"';
                ctx.fillText(last.text.slice(0, 20) + (last.text.length > 20 ? '…' : ''), px + 10, cy + 28);
            }

            if (c.unread > 0) {
                ctx.fillStyle = '#f44336';
                ctx.beginPath();
                ctx.arc(px + listW - 16, cy + 12, 9, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText(c.unread, px + listW - 16, cy + 16);
                ctx.textAlign = 'left';
            }

            // Click handler stored for game.js
            c._btnY = cy; c._btnH = 36;
        }

        // Message thread (right pane)
        const msgX = px + listW + 4;
        const msgW = pw - listW - 4;
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(msgX, py + 42, msgW, ph - 42 - 50);

        const contact = this.contacts.find(c => c.id === this.activeContact);
        if (contact) {
            ctx.fillStyle = '#4a4a8a';
            ctx.fillRect(msgX, py + 42, msgW, 28);
            ctx.fillStyle = '#e2e2e2';
            ctx.font = 'bold 12px "Courier New"';
            ctx.fillText(contact.name, msgX + 8, py + 61);

            // Messages
            const msgArea = ph - 42 - 50 - 30;
            const msgs    = contact.messages.slice(-12);
            ctx.save();
            ctx.beginPath();
            ctx.rect(msgX, py + 72, msgW, msgArea);
            ctx.clip();

            let mY = py + 72 + 8;
            for (const msg of msgs) {
                const isPlayer = msg.from === 'player';
                const bubbleW  = msgW - 24;
                const lines    = U.wrapText(ctx, msg.text, bubbleW - 16);
                const bubbleH  = lines.length * 16 + 12;

                const bx = isPlayer ? msgX + msgW - bubbleW - 4 : msgX + 4;
                ctx.fillStyle = isPlayer ? '#1565c0' : '#263238';
                ctx.beginPath();
                ctx.roundRect(bx, mY, bubbleW, bubbleH, 8);
                ctx.fill();

                ctx.fillStyle = '#e2e2e2';
                ctx.font = '11px "Courier New"';
                for (let li = 0; li < lines.length; li++) {
                    ctx.fillText(lines[li], bx + 8, mY + 14 + li * 16);
                }

                ctx.fillStyle = '#607d8b';
                ctx.font = '9px "Courier New"';
                ctx.fillText(U.timeStr(msg.time), bx + 4, mY + bubbleH + 10);

                mY += bubbleH + 18;
            }
            ctx.restore();

            // Input bar
            const inputY = py + ph - 50;
            ctx.fillStyle = '#16213e';
            ctx.fillRect(msgX, inputY, msgW, 50);
            ctx.fillStyle = '#263238';
            ctx.fillRect(msgX + 6, inputY + 8, msgW - 80, 30);
            ctx.fillStyle = '#607d8b';
            ctx.font = '11px "Courier New"';
            ctx.fillText('Type a message... (feature coming)', msgX + 12, inputY + 28);

            // Send button
            ctx.fillStyle = '#1565c0';
            ctx.fillRect(msgX + msgW - 68, inputY + 8, 60, 30);
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.fillText('Send', msgX + msgW - 38, inputY + 27);
            ctx.textAlign = 'left';
        }
    },

    handleClick(mx, my) {
        if (GameState.uiMode !== 'phone') return false;
        const pw = 580, ph = 520;
        const px = (CFG.W - pw) / 2;
        const py = (CFG.H - ph) / 2;

        // Close button
        if (mx > px + pw - 36 && mx < px + pw - 10 && my > py + 8 && my < py + 34) {
            this.close(); return true;
        }

        // Contact list
        for (const c of this.contacts) {
            if (c._btnY && mx > px && mx < px + 180 && my > c._btnY && my < c._btnY + 36) {
                this.activeContact = c.id;
                c.unread = 0;
                return true;
            }
        }
        return true; // consume all clicks in phone mode
    },
};
</script>
<script>
/* inlined from js/ui.js */
'use strict';

// ── Notification queue ────────────────────────────────────────────────────
const Notifications = {
    queue: [],
    push(text, color) {
        this.queue.push({ text, color: color || '#ffffff', born: Date.now(), ttl: CFG.NOTIF_MS });
    },
    draw(ctx) {
        const now = Date.now();
        this.queue = this.queue.filter(n => now - n.born < n.ttl);
        let y = CFG.H - 80;
        for (let i = this.queue.length - 1; i >= 0; i--) {
            const n   = this.queue[i];
            const age = (now - n.born) / n.ttl;
            const alpha = age > 0.75 ? 1 - (age - 0.75) / 0.25 : 1;
            const w = ctx.measureText(n.text).width + 24;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.beginPath();
            ctx.roundRect(CFG.W / 2 - w/2, y - 18, w, 24, 6);
            ctx.fill();
            ctx.fillStyle = n.color;
            ctx.font = '13px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText(n.text, CFG.W / 2, y);
            ctx.textAlign = 'left';
            y -= 30;
        }
        ctx.globalAlpha = 1;
    },
};

// ── Main UI manager ───────────────────────────────────────────────────────
const UI = {
    notify: (t, c) => Notifications.push(t, c),
