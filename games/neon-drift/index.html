<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Drift</title>
<style>
  html,body{height:100%;margin:0;background:#07040f;overflow:hidden;color:#fff;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  .hud{position:fixed;top:18px;left:22px;right:22px;display:flex;gap:26px;align-items:flex-start;
    pointer-events:none;text-shadow:0 2px 14px #000}
  .hud b{display:block;font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .hud span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}
  .boost{margin-left:auto;width:160px}
  .boost i{display:block;height:5px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:7px}
  .boost i em{display:block;height:100%;background:linear-gradient(90deg,#ff59c7,#ffd36e);width:0%}
  .msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
    background:radial-gradient(60% 60% at 50% 45%,rgba(24,4,44,.62),rgba(7,4,15,.94))}
  .msg.hide{display:none}
  .msg h1{font-size:min(13vw,80px);margin:0 0 6px;letter-spacing:-.03em;
    background:linear-gradient(90deg,#ff59c7,#7ee8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .msg p{margin:6px 0 22px;opacity:.72;font-size:14px;letter-spacing:.03em}
  .msg button{padding:13px 32px;border:0;border-radius:99px;background:#fff;color:#12061f;font-weight:700;font-size:14px;cursor:pointer}
  .msg button:hover{background:#ffd36e}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud">
  <div><span>Score</span><b id="score">0</b></div>
  <div><span>km/h</span><b id="speed">0</b></div>
  <div><span>Best</span><b id="best">0</b></div>
  <div class="boost"><span>Boost — hold Space</span><i><em id="boostbar"></em></i></div>
</div>
<div class="msg" id="msg"><div>
  <h1 id="title">NEON DRIFT</h1>
  <p id="sub">A / D or ← → to steer &nbsp;·&nbsp; Space to boost &nbsp;·&nbsp; graze a barrier to refill it</p>
  <button id="go">Start</button>
</div></div>
<script type="module">
import * as THREE from '../../vendor/three/three.module.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x0a0418, 1);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a0a3f, 60, 460);
const camera = new THREE.PerspectiveCamera(78, 1, 0.1, 900);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- world ---------- */
const ROAD_W = 15, SEG = 22, SEGS = 90, FAR = SEG * SEGS;

scene.add(new THREE.HemisphereLight(0xff8ad8, 0x2a1050, 1.5));
const key = new THREE.DirectionalLight(0xffd3f2, 1.6);
key.position.set(-1, 2, 1); scene.add(key);

// sun disc on the horizon
const sunTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#ffe57a'); g.addColorStop(1, '#ff3d94');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 9; i++) x.fillRect(0, 150 + i * 13, 256, 5 + i * 0.8);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const sun = new THREE.Mesh(new THREE.CircleGeometry(70, 48),
  new THREE.MeshBasicMaterial({ map: sunTex, transparent: true, fog: false, depthWrite: false }));
sun.position.set(0, 34, -FAR);
scene.add(sun);

// road surface
const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a1745, roughness: 0.62, metalness: 0.2 });
const road = new THREE.InstancedMesh(new THREE.BoxGeometry(ROAD_W * 2, 0.2, SEG + 0.6), roadMat, SEGS);
scene.add(road);

// glowing lane lines and edges, recycled as they pass
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: true });
const edgeMatA = new THREE.MeshBasicMaterial({ color: 0xff59c7, fog: true });
const edgeMatB = new THREE.MeshBasicMaterial({ color: 0x7ee8ff, fog: true });
const dash = new THREE.InstancedMesh(new THREE.BoxGeometry(0.34, 0.04, 7), lineMat, SEGS);
const edgeL = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.3, SEG), edgeMatA, SEGS);
const edgeR = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.3, SEG), edgeMatB, SEGS);
scene.add(dash, edgeL, edgeR);

// ground grid far to the sides
const gridMat = new THREE.MeshBasicMaterial({ color: 0x6a2a8f, fog: true });
const grid = new THREE.InstancedMesh(new THREE.BoxGeometry(260, 0.02, 0.35), gridMat, SEGS);
scene.add(grid);

// barriers
const barrierGeo = new THREE.BoxGeometry(1, 1, 1);
const barriers = [];
const BARRIERS = 26;
for (let i = 0; i < BARRIERS; i++) {
  const m = new THREE.Mesh(barrierGeo, new THREE.MeshStandardMaterial({
    color: 0xff59c7, emissive: 0xff59c7, emissiveIntensity: 1.2, roughness: 0.3,
  }));
  m.visible = false;
  scene.add(m);
  barriers.push({ mesh: m, z: 0, x: 0, w: 3, live: false, hit: false });
}

/* ---------- the car ---------- */
const car = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 4.2),
    new THREE.MeshStandardMaterial({ color: 0xdfe6ff, roughness: 0.25, metalness: 0.7 }));
  body.position.y = 0.55;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.45, 1.9),
    new THREE.MeshStandardMaterial({ color: 0x1a1030, roughness: 0.1, metalness: 0.3 }));
  cabin.position.set(0, 0.98, -0.15);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.1, 0.5),
    new THREE.MeshStandardMaterial({ color: 0xff59c7, emissive: 0xff59c7, emissiveIntensity: 0.7 }));
  wing.position.set(0, 1.05, 2.0);
  car.add(body, cabin, wing);
  for (const [x, z] of [[-1.05, -1.4], [1.05, -1.4], [-1.05, 1.4], [1.05, 1.4]]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.32, 12),
      new THREE.MeshStandardMaterial({ color: 0x14101c, roughness: 0.8 }));
    w.rotation.z = Math.PI / 2; w.position.set(x, 0.42, z);
    car.add(w);
  }
  const flameMat = new THREE.MeshBasicMaterial({ color: 0xffd36e, transparent: true, opacity: 0, fog: false });
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.42, 2.4, 10), flameMat);
  flame.rotation.x = Math.PI / 2; flame.position.set(0, 0.55, 3.0);
  car.add(flame);
  car.userData.flame = flame;
}
scene.add(car);

/* ---------- state ---------- */
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.code] = 1;
  if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && !S.alive) start();
});
addEventListener('keyup', (e) => { keys[e.code] = 0; });
let touchX = null;
addEventListener('pointerdown', (e) => { touchX = e.clientX; });
addEventListener('pointermove', (e) => { if (touchX !== null) touchX = e.clientX; });
addEventListener('pointerup', () => { touchX = null; });

const S = { alive: false, dist: 0, x: 0, speed: 0, boost: 1, score: 0, curve: 0, curveT: 0, shake: 0,
  best: Number(localStorage.getItem('nd.best3d') || 0) };
document.getElementById('best').textContent = Math.floor(S.best);

function start() {
  Object.assign(S, { alive: true, dist: 0, x: 0, speed: 60, boost: 1, score: 0, curve: 0, curveT: 0, shake: 0 });
  for (const b of barriers) { b.live = false; b.mesh.visible = false; }
  spawnAhead(190);
  document.getElementById('msg').classList.add('hide');
}
document.getElementById('go').onclick = start;

function die() {
  S.alive = false;
  S.best = Math.max(S.best, S.score);
  localStorage.setItem('nd.best3d', String(Math.floor(S.best)));
  document.getElementById('best').textContent = Math.floor(S.best);
  const m = document.getElementById('msg');
  m.classList.remove('hide');
  document.getElementById('title').textContent = Math.floor(S.score).toLocaleString();
  document.getElementById('sub').textContent = 'Distance run · Space or click to run it back';
  document.getElementById('go').textContent = 'Again';
}

function spawnAhead(from) {
  for (const b of barriers) {
    if (b.live) continue;
    b.z = from + 34 + Math.random() * 34;
    b.w = 2.2 + Math.random() * 3.2;
    // keep a gap of at least six units on one side so there is always a way through
    const side = Math.random() < 0.5 ? -1 : 1;
    b.x = side * (ROAD_W - b.w * 0.5 - 0.6) * (0.45 + Math.random() * 0.55);
    b.live = true; b.hit = false;
    b.mesh.visible = true;
    b.mesh.scale.set(b.w, 2.2 + Math.random() * 1.6, 1.1);
    const cool = Math.random() < 0.5;
    b.mesh.material.color.setHex(cool ? 0x7ee8ff : 0xff59c7);
    b.mesh.material.emissive.setHex(cool ? 0x7ee8ff : 0xff59c7);
    from = b.z;
  }
}

/* ---------- loop ---------- */
const m4 = new THREE.Matrix4();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.alive) update(dt);
  render();
  requestAnimationFrame(frame);
}

function update(dt) {
  const boosting = keys.Space && S.boost > 0.02;
  const target = boosting ? 210 : 128;
  S.speed += (target - S.speed) * dt * (boosting ? 1.5 : 0.7);
  S.boost = boosting ? Math.max(0, S.boost - dt * 0.32) : Math.min(1, S.boost + dt * 0.06);
  S.dist += S.speed * dt;
  S.score += S.speed * dt * 0.5;

  // the road bends; a long lazy curve that keeps changing
  S.curveT += dt * 0.35;
  S.curve = Math.sin(S.curveT) * 0.6 + Math.sin(S.curveT * 0.37 + 1.2) * 0.35;

  let steer = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (touchX !== null) steer = Math.max(-1, Math.min(1, (touchX - innerWidth / 2) / (innerWidth * 0.28)));
  S.x += steer * dt * 26 * (1 - S.speed / 620);
  S.x -= S.curve * S.speed * dt * 0.055;
  const lim = ROAD_W - 1.2;
  if (S.x > lim) { S.x = lim; S.speed *= 1 - dt * 1.6; }
  if (S.x < -lim) { S.x = -lim; S.speed *= 1 - dt * 1.6; }
  S.shake = Math.max(0, S.shake - dt * 3);

  let furthest = 0;
  for (const b of barriers) {
    if (!b.live) continue;
    b.z -= S.speed * dt;
    furthest = Math.max(furthest, b.z);
    if (b.z < -12) { b.live = false; b.mesh.visible = false; continue; }
    if (!b.hit && b.z < 2.4 && b.z > -2.4) {
      const gap = Math.abs(b.x - S.x) - (b.w * 0.5 + 1.0);
      if (gap < 0) { b.hit = true; S.shake = 1; die(); }
      else if (gap < 1.5) { b.hit = true; S.boost = Math.min(1, S.boost + 0.2); S.score += 120; S.shake = 0.35; }
    }
  }
  if (furthest < 300) spawnAhead(Math.max(furthest, 190));

  document.getElementById('score').textContent = Math.floor(S.score).toLocaleString();
  document.getElementById('speed').textContent = Math.floor(S.speed * 3.2);
  document.getElementById('boostbar').style.width = (S.boost * 100) + '%';
}

function render() {
  const bend = S.curve;
  // road pieces slide with distance so the surface reads as motion
  const off = S.dist % SEG;
  for (let i = 0; i < SEGS; i++) {
    const z = i * SEG - off;
    const drift = bend * (z * z) * 0.0006;
    m4.makeTranslation(drift - S.x, -0.1, -z + 10);
    road.setMatrixAt(i, m4);
    m4.makeTranslation(drift - S.x, 0.03, -z + 10);
    dash.setMatrixAt(i, m4);
    m4.makeTranslation(drift - S.x - ROAD_W, 0.16, -z + 10);
    edgeL.setMatrixAt(i, m4);
    m4.makeTranslation(drift - S.x + ROAD_W, 0.16, -z + 10);
    edgeR.setMatrixAt(i, m4);
    m4.makeTranslation(drift - S.x, -1.4, -z + 10);
    grid.setMatrixAt(i, m4);
  }
  road.instanceMatrix.needsUpdate = true;
  dash.instanceMatrix.needsUpdate = true;
  edgeL.instanceMatrix.needsUpdate = true;
  edgeR.instanceMatrix.needsUpdate = true;
  grid.instanceMatrix.needsUpdate = true;

  for (const b of barriers) {
    if (!b.live) continue;
    const drift = bend * (b.z * b.z) * 0.0006;
    b.mesh.position.set(b.x + drift - S.x, b.mesh.scale.y * 0.5, -b.z + 10);
  }

  car.position.set(0, 0, 0);
  car.rotation.z = -( (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) ) * 0.09;
  car.rotation.y = Math.sin(performance.now() * 0.001) * 0.005;
  const boosting = keys.Space && S.boost > 0.02;
  car.userData.flame.material.opacity = boosting ? 0.55 + Math.random() * 0.35 : 0;

  const shake = S.shake * S.shake * 0.6;
  camera.position.set(
    (Math.random() - 0.5) * shake,
    4.1 + (Math.random() - 0.5) * shake,
    11.0 - Math.min(2.4, S.speed * 0.012),
  );
  camera.lookAt(bend * 9, 2.6, -70);
  camera.fov = 76 + Math.min(18, S.speed * 0.075);
  camera.updateProjectionMatrix();
  sun.position.set(bend * 180, 34, -FAR);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script></body></html>
