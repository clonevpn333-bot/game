<script>
/* portal shim: teardown.js */
'use strict';
/**
 * Teardown registry — §1.1 "Deterministic teardown on game exit".
 *
 * Nothing in a game should call addEventListener / requestAnimationFrame /
 * setTimeout / createObjectURL directly. Route them through here and a single
 * destroyAll() reclaims the lot. The portal also destroys the whole iframe
 * (§2.2), but manual teardown is what makes standalone play and the
 * heap-returns-to-baseline benchmark (§4) hold.
 */
(function (global) {
    const PE = (global.PE = global.PE || {});

    const listeners = [];   // [target, type, fn, opts]
    const rafs      = [];   // raf handles
    const timers    = [];   // setTimeout handles
    const intervals = [];   // setInterval handles
    const contexts  = [];   // WebGL contexts
    const urls      = [];   // object URLs
    const audios    = [];   // AudioContexts
    const closers   = [];   // arbitrary cleanup fns
    let destroyed   = false;

    const Teardown = {
        get destroyed() { return destroyed; },

        on(target, type, fn, opts) {
            if (destroyed) return fn;
            target.addEventListener(type, fn, opts);
            listeners.push([target, type, fn, opts]);
            return fn;
        },

        off(target, type, fn, opts) {
            target.removeEventListener(type, fn, opts);
            for (let i = listeners.length - 1; i >= 0; i--) {
                const l = listeners[i];
                if (l[0] === target && l[1] === type && l[2] === fn) listeners.splice(i, 1);
            }
        },

        raf(fn) {
            if (destroyed) return 0;
            const h = requestAnimationFrame(fn);
            rafs.push(h);
            // Keep the handle list bounded: a long-running loop would otherwise
            // push one entry per frame forever (a leak in the leak-preventer).
            if (rafs.length > 8) rafs.splice(0, rafs.length - 8);
            return h;
        },

        timeout(fn, ms) {
            if (destroyed) return 0;
            const h = setTimeout(function () {
                const i = timers.indexOf(h);
                if (i >= 0) timers.splice(i, 1);
                fn();
            }, ms);
            timers.push(h);
            return h;
        },

        interval(fn, ms) {
            if (destroyed) return 0;
            const h = setInterval(fn, ms);
            intervals.push(h);
            return h;
        },

        trackContext(gl)      { if (gl) contexts.push(gl); return gl; },
        trackAudio(ac)        { if (ac) audios.push(ac); return ac; },
        trackObjectURL(url)   { if (url) urls.push(url); return url; },
        onDestroy(fn)         { if (fn) closers.push(fn); return fn; },

        /** Idempotent. Safe to call from unload, from the portal, or both. */
        destroyAll() {
            if (destroyed) return;
            destroyed = true;

            for (let i = 0; i < rafs.length; i++) cancelAnimationFrame(rafs[i]);
            for (let i = 0; i < timers.length; i++) clearTimeout(timers[i]);
            for (let i = 0; i < intervals.length; i++) clearInterval(intervals[i]);
            for (let i = 0; i < listeners.length; i++) {
                const l = listeners[i];
                try { l[0].removeEventListener(l[1], l[2], l[3]); } catch (e) { /* detached */ }
            }
            for (let i = 0; i < closers.length; i++) {
                try { closers[i](); } catch (e) { /* keep tearing down */ }
            }
            for (let i = 0; i < contexts.length; i++) {
                try {
                    const ext = contexts[i].getExtension('WEBGL_lose_context');
                    if (ext) ext.loseContext();
                } catch (e) { /* context already gone */ }
            }
            for (let i = 0; i < audios.length; i++) {
                try { audios[i].close(); } catch (e) { /* already closed */ }
            }
            for (let i = 0; i < urls.length; i++) {
                try { URL.revokeObjectURL(urls[i]); } catch (e) { /* already revoked */ }
            }

            listeners.length = 0; rafs.length = 0; timers.length = 0;
            intervals.length = 0; contexts.length = 0; urls.length = 0;
            audios.length = 0; closers.length = 0;

            if (document.pointerLockElement) {
                try { document.exitPointerLock(); } catch (e) { /* not locked */ }
            }
        },
    };

    PE.Teardown = Teardown;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* portal shim: bridge.js */
'use strict';
/**
 * Game-side half of the portal <-> game postMessage bridge (§2.2).
 *
 * Protocol (v1), all messages { type, token, ... }:
 *
 *   game   -> portal : game:hello      first contact, no token yet
 *   portal -> game   : portal:hello    { token, tier, caps, save, settings }
 *   game   -> portal : game:ready      { needs: { tier, pointerLock } }
 *   game   -> portal : game:save       { data }        persisted via IndexedDB
 *   game   -> portal : game:score      { score, label }
 *   game   -> portal : game:stats      { fps, frameMs, heapMB, scale, entities }
 *   game   -> portal : game:exit       user chose to quit
 *   game   -> portal : game:error      { message, stack }
 *   game   -> portal : game:pointerlock{ locked }
 *   portal -> game   : portal:pause | portal:resume | portal:shutdown
 *   portal -> game   : portal:lowmem   release what you can, you are near budget
 *   portal -> game   : portal:settings { resolutionScale, audio, auto }
 *
 * The game never touches portal storage directly: save state round-trips
 * through this bridge, which is what §2.2's acceptance criterion asks for.
 * Standalone (opened outside the portal) degrades to a local IndexedDB store
 * so a bundle stays playable as a plain file.
 */
(function (global) {
    const PE = (global.PE = global.PE || {});
    const PROTOCOL = 1;

    const Bridge = {
        connected:  false,
        standalone: false,
        token:      null,
        id:         null,
        tier:       null,
        caps:       null,
        settings:   null,
        _handlers:  null,
        _saveTimer: 0,
        _pendingSave: null,
        _origin:    null,
        _onMessage: null,
        _helloTimer: 0,

        connect(opts) {
            this._handlers = opts || {};
            this.id = opts.id || 'unknown';
            const parent = global.parent;
            const embedded = parent && parent !== global;

            // location.origin is "null" for an opaque-origin sandbox; postMessage
            // then has to target '*' because there is no origin to name.
            this._origin = (location.origin && location.origin !== 'null') ? location.origin : '*';

            const self = this;
            this._onMessage = function (e) { self._handle(e); };
            global.addEventListener('message', this._onMessage);

            // Report uncaught errors to the portal so a broken title surfaces
            // in the launcher instead of dying silently inside the frame.
            global.addEventListener('error', function (e) {
                self.post('game:error', { message: String(e.message || e), stack: e.error && e.error.stack || '' });
            });
            global.addEventListener('unhandledrejection', function (e) {
                self.post('game:error', { message: 'unhandled rejection: ' + String(e.reason), stack: '' });
            });

            if (!embedded) { this._goStandalone(); return this; }

            parent.postMessage({ type: 'game:hello', protocol: PROTOCOL, id: this.id }, this._origin);
            this._helloTimer = setTimeout(function () {
                if (!self.connected) self._goStandalone();
            }, 1500);
            return this;
        },

        _goStandalone() {
            this.standalone = true;
            this.connected  = false;
            const self = this;
            localLoad(this.id).then(function (save) {
                self._fire('onHello', { tier: null, caps: null, save: save, settings: null, standalone: true });
            });
        },

        _handle(e) {
            const d = e.data;
            if (!d || typeof d !== 'object' || typeof d.type !== 'string') return;
            if (d.type.slice(0, 7) !== 'portal:') return;
            // After the handshake every message must carry our token; a frame
            // that can post to us is not automatically the portal.
            if (this.token && d.token !== this.token) return;

            switch (d.type) {
                case 'portal:hello':
                    if (this.connected) return;
                    clearTimeout(this._helloTimer);
                    this.connected = true;
                    this.token     = d.token;
                    this.tier      = d.tier;
                    this.caps      = d.caps || null;
                    this.settings  = d.settings || null;
                    this._fire('onHello', { tier: d.tier, caps: d.caps, save: d.save, settings: d.settings, standalone: false });
                    break;
                case 'portal:pause':    this._fire('onPause'); break;
                case 'portal:resume':   this._fire('onResume'); break;
                case 'portal:lowmem':   this._fire('onLowMemory', d.level || 1); break;
                case 'portal:settings':
                    this.settings = d.settings || null;
                    this._fire('onSettings', d.settings);
                    break;
                case 'portal:shutdown':
                    this.flush();
                    this._fire('onShutdown');
                    this.post('game:shutdown-ack', null);
                    this.dispose();
                    break;
            }
        },

        _fire(name, arg) {
            const fn = this._handlers && this._handlers[name];
            if (typeof fn === 'function') {
                try { fn(arg); } catch (err) { this.post('game:error', { message: String(err), stack: err && err.stack || '' }); }
            }
        },

        post(type, payload) {
            if (this.standalone || !global.parent || global.parent === global) return false;
            const msg = payload ? Object.assign({ type: type, token: this.token }, payload)
                                : { type: type, token: this.token };
            try { global.parent.postMessage(msg, this._origin); } catch (e) { return false; }
            return true;
        },

        /** Declare what the game needs; the portal has already gated on this,
         *  but a standalone-opened bundle can warn for itself. */
        ready(needs) { this.post('game:ready', { needs: needs || null }); },

        progress(v) { this.post('game:progress', { value: v }); },

        score(score, label) { this.post('game:score', { score: score, label: label || '' }); },

        /** Debounced save — games call this freely; it coalesces to <=1 write/2s. */
        save(data) {
            this._pendingSave = data;
            if (this._saveTimer) return;
            const self = this;
            this._saveTimer = setTimeout(function () { self.flush(); }, 2000);
        },

        flush() {
            if (this._saveTimer) { clearTimeout(this._saveTimer); this._saveTimer = 0; }
            if (this._pendingSave == null) return;
            const data = this._pendingSave;
            this._pendingSave = null;
            if (this.standalone) localSave(this.id, data);
            else this.post('game:save', { data: data });
        },

        stats(s) { this.post('game:stats', s); },

        pointerLock(locked) { this.post('game:pointerlock', { locked: !!locked }); },

        exit() { this.flush(); this.post('game:exit', null); },

        dispose() {
            if (this._onMessage) global.removeEventListener('message', this._onMessage);
            this._onMessage = null;
            this._handlers  = null;
            this.connected  = false;
        },
    };

    // --- standalone-only local persistence (never localStorage, per §1.4) ---
    function idb() {
        return new Promise(function (resolve, reject) {
            const req = indexedDB.open('pe-standalone', 1);
            req.onupgradeneeded = function () { req.result.createObjectStore('saves'); };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror   = function () { reject(req.error); };
        });
    }
    function localSave(id, data) {
        return idb().then(function (db) {
            const tx = db.transaction('saves', 'readwrite');
            tx.objectStore('saves').put({ data: data, at: Date.now() }, id);
            return new Promise(function (res) { tx.oncomplete = function () { db.close(); res(); }; });
        }).catch(function () { /* private mode / quota — play on without saves */ });
    }
    function localLoad(id) {
        return idb().then(function (db) {
            const tx = db.transaction('saves', 'readonly');
            const rq = tx.objectStore('saves').get(id);
            return new Promise(function (res) {
                rq.onsuccess = function () { db.close(); res(rq.result ? rq.result.data : null); };
                rq.onerror   = function () { db.close(); res(null); };
            });
        }).catch(function () { return null; });
    }

    PE.Bridge = Bridge;
    PE.PROTOCOL = PROTOCOL;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* portal shim: shim.js */
'use strict';
/**
 * Compatibility shim for prebuilt bundles.
 *
 * The games imported from the hub were written standalone: they know nothing
 * about the portal, and they were built for a machine with a fan. This wraps
 * them from the outside — no edits to their code — and gives them the three
 * things that decide whether they are playable on a Chromebook:
 *
 *   1. A device-pixel-ratio governor. Nearly every Three.js title sizes its
 *      drawing buffer from window.devicePixelRatio, so owning that value owns
 *      the fill rate. It starts clamped and drops further when frames run long,
 *      then dispatches resize so the game re-applies it.
 *   2. A frame governor. Every requestAnimationFrame goes through here, so the
 *      portal can genuinely pause a backgrounded game (and hide the pause from
 *      its clock, so nothing teleports on resume) and stop it dead on exit.
 *   3. Lifecycle. Reports ready, streams frame stats, and on shutdown cancels
 *      the loop and drops every WebGL context it saw created.
 *
 * It only ever lowers resolution below 1x. A game that hardcodes its pixel
 * ratio opts out of step 1 by construction; steps 2 and 3 still apply.
 */
(function (global) {
    const Bridge = global.PE && global.PE.Bridge;
    const doc = global.document;

    // --- device pixel ratio governor -------------------------------------
    const STEPS = [1, 0.85, 0.72, 0.6, 0.5];
    let stepIndex = 0;
    let nativeDpr = global.devicePixelRatio || 1;

    function currentScale() {
        // Never upscale past 1: retina rendering is banned on this hardware.
        return Math.min(nativeDpr, STEPS[stepIndex]);
    }

    try {
        Object.defineProperty(global, 'devicePixelRatio', {
            get: currentScale,
            configurable: true,
        });
    } catch (e) { /* locked down; the frame governor still applies */ }

    let manual = false;
    function setStep(i, why) {
        i = Math.max(0, Math.min(STEPS.length - 1, i));
        if (i === stepIndex) return false;
        stepIndex = i;
        // Most titles only resize their renderer on a resize event; without
        // this the new ratio would not take effect until the window changed.
        try { global.dispatchEvent(new Event('resize')); } catch (e) { /* ignore */ }
        return true;
    }

    // --- frame governor ---------------------------------------------------
    const nativeRaf = global.requestAnimationFrame && global.requestAnimationFrame.bind(global);
    const nativeCaf = global.cancelAnimationFrame && global.cancelAnimationFrame.bind(global);
    const liveHandles = new Set();
    let paused = false, dead = false;
    let pauseStart = 0, pauseOffset = 0;

    // Frame-time tracking, with the same hysteresis as the engine's scaler:
    // slow to drop, much slower to recover, and a step that relapsed is not
    // retried — that is what stops the resolution pulsing.
    let last = 0, over = 0, under = 0, cooldown = 0, lastUpAt = -1e9;
    const blocked = [0, 0, 0, 0, 0];
    let frames = 0, acc = 0, fps = 0;
    const BUDGET = 1000 / 60;

    function sample(ts) {
        if (!last) { last = ts; return; }
        const dt = ts - last;
        last = ts;
        if (dt <= 0 || dt > 500) return;          // tab was hidden; not a real frame

        frames++; acc += dt;
        if (acc >= 1000) { fps = (frames * 1000) / acc; frames = 0; acc = 0; report(); }

        if (manual || ts < cooldown) return;

        if (dt > BUDGET * 1.15) { over++; under = 0; } 
        else if (dt < BUDGET * 0.70) { under++; over = 0; } 
        else { over = 0; under = 0; }

        if (over >= 12 && stepIndex < STEPS.length - 1) {
            if (ts - lastUpAt < 4000) blocked[stepIndex] = 1;
            setStep(stepIndex + 1);
            over = under = 0; cooldown = ts + 1500;
        } else if (under >= 240 && stepIndex > 0 && !blocked[stepIndex - 1]) {
            setStep(stepIndex - 1);
            over = under = 0; cooldown = ts + 3000; lastUpAt = ts;
        }
    }

    if (nativeRaf) {
        global.requestAnimationFrame = function (cb) {
            if (dead) return 0;
            return nativeRaf(function tick(ts) {
                if (dead) return;
                if (paused) { liveHandles.add(nativeRaf(tick)); return; }
                sample(ts);
                // Hide the paused interval from the game's own clock.
                cb(ts - pauseOffset);
            });
        };
        global.cancelAnimationFrame = function (h) { liveHandles.delete(h); return nativeCaf(h); };
    }

    // --- WebGL context tracking ------------------------------------------
    const contexts = [];
    const nativeGetContext = global.HTMLCanvasElement && global.HTMLCanvasElement.prototype.getContext;
    if (nativeGetContext) {
        global.HTMLCanvasElement.prototype.getContext = function (type) {
            const ctx = nativeGetContext.apply(this, arguments);
            if (ctx && /webgl/i.test(String(type))) contexts.push(ctx);
            return ctx;
        };
    }

    function teardown() {
        dead = true;
        for (const h of liveHandles) { try { nativeCaf(h); } catch (e) { /* gone */ } }
        liveHandles.clear();
        for (const gl of contexts) {
            try {
                const ext = gl.getExtension('WEBGL_lose_context');
                if (ext) ext.loseContext();
            } catch (e) { /* already lost */ }
        }
        contexts.length = 0;
        if (doc && doc.pointerLockElement) { try { doc.exitPointerLock(); } catch (e) { /* not locked */ } }
    }

    function report() {
        if (!Bridge) return;
        Bridge.stats({
            fps: fps,
            frameMs: fps ? 1000 / fps : 0,
            scale: currentScale(),
            heapMB: global.performance && performance.memory
                ? Math.round(performance.memory.usedJSHeapSize / 1048576) : 0,
        });
    }

    // --- portal lifecycle -------------------------------------------------
    if (Bridge) {
        Bridge.connect({
            id: (doc && doc.title || 'prebuilt').toLowerCase().replace(/[^a-z0-9]+/g, '-'),
            onHello: function (ctx) {
                const pref = ctx && ctx.settings && ctx.settings.resolutionScale;
                if (typeof pref === 'number') {
                    manual = true;
                    let best = 0;
                    for (let i = 0; i < STEPS.length; i++) {
                        if (Math.abs(STEPS[i] - pref) < Math.abs(STEPS[best] - pref)) best = i;
                    }
                    stepIndex = best;
                } else if (ctx && ctx.caps) {
                    // A software rasteriser cannot hold 60 fps on these scenes;
                    // start low rather than spending four seconds discovering it.
                    if (ctx.caps.software) stepIndex = 3;
                    else if (ctx.caps.deviceMemory && ctx.caps.deviceMemory <= 4) stepIndex = 1;
                }
                Bridge.ready({ tier: null, pointerLock: true });
            },
            onPause: function () {
                if (paused) return;
                paused = true;
                pauseStart = global.performance ? performance.now() : Date.now();
            },
            onResume: function () {
                if (!paused) return;
                paused = false;
                const now = global.performance ? performance.now() : Date.now();
                pauseOffset += now - pauseStart;
                last = 0;
            },
            onLowMemory: function () { setStep(stepIndex + 1); },
            onSettings: function (s) {
                if (!s) return;
                if (typeof s.resolutionScale === 'number') {
                    manual = true;
                    let best = 0;
                    for (let i = 0; i < STEPS.length; i++) {
                        if (Math.abs(STEPS[i] - s.resolutionScale) < Math.abs(STEPS[best] - s.resolutionScale)) best = i;
                    }
                    setStep(best);
                } else {
                    manual = false;
                }
            },
            onShutdown: teardown,
        });
    }

    global.__shim = {
        scale: currentScale,
        setStep: setStep,
        stats: function () { return { fps: fps, scale: currentScale(), paused: paused, contexts: contexts.length }; },
    };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<style>
  html,body{height:100%;margin:0;background:#04070c;overflow:hidden;color:#dff3ff;font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}

  .msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(60% 60% at 50% 45%,rgba(6,20,32,.72),rgba(4,7,12,.96))}

<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
const keys={},mouse={x:0,y:0,down:false};
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space')e.preventDefault();if(e.code==='Space'&&!state.alive)start();});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('pointerdown',e=>{if(e.target===c)mouse.down=true});
addEventListener('pointerup',()=>mouse.down=false);

const WEAPONS=[
  {name:'Pulse',rate:.16,spread:.05,n:1,dmg:1,speed:760,life:1.1},
  {name:'Split',rate:.20,spread:.16,n:3,dmg:1,speed:700,life:1.0},
  {name:'Lance',rate:.09,spread:.02,n:1,dmg:2,speed:1080,life:1.3},
  {name:'Storm',rate:.07,spread:.22,n:2,dmg:1.4,speed:820,life:1.1},
];
let state={};
function start(){
  state={alive:true,wave:0,score:0,hp:100,heat:0,weap:0,t:0,shake:0,waveT:0,between:1.2,
    player:{x:W/2,y:H/2,vx:0,vy:0,r:13,a:0},bullets:[],foes:[],parts:[],drops:[],cd:0};
  document.getElementById('msg').classList.add('hide');nextWave();
}
document.getElementById('go').onclick=start;

function nextWave(){
  state.wave++;state.between=1.4;
  const big=document.getElementById('wavebig');
  big.textContent=state.wave===20?'FINAL':'WAVE '+state.wave;
  big.classList.remove('show');void big.offsetWidth;big.classList.add('show');
  document.getElementById('wave').textContent=state.wave;
  const n=4+state.wave*2;
  for(let i=0;i<n;i++)spawnFoe();
  if(state.wave%4===0)state.drops.push({x:rnd(80,W-80),y:rnd(80,H-80),t:0,kind:'weapon'});
  if(state.wave%3===0)state.drops.push({x:rnd(80,W-80),y:rnd(80,H-80),t:0,kind:'repair'});
}
function spawnFoe(){
  const edge=Math.floor(rnd(0,4));
  const p={x:edge===0?-40:edge===1?W+40:rnd(0,W),y:edge===2?-40:edge===3?H+40:rnd(0,H)};
  const tier=Math.min(3,Math.floor(rnd(0,1+state.wave/5)));
  const kinds=[
    {r:14,hp:2,sp:74,sides:3,hue:184,dmg:8,score:20},
    {r:19,hp:4,sp:58,sides:4,hue:44,dmg:12,score:40},
    {r:24,hp:8,sp:44,sides:6,hue:340,dmg:18,score:90,shoots:true},
    {r:31,hp:16,sp:34,sides:8,hue:280,dmg:26,score:180,shoots:true},
  ][tier];
  state.foes.push({...p,...kinds,max:kinds.hp,a:rnd(0,TAU),spin:rnd(-1.6,1.6),fire:rnd(1,3)});
}
function fire(){
  const w=WEAPONS[state.weap],p=state.player;
  const base=Math.atan2(mouse.y-p.y,mouse.x-p.x);
  for(let i=0;i<w.n;i++){
    const a=base+(i-(w.n-1)/2)*w.spread+rnd(-.02,.02);
    state.bullets.push({x:p.x+Math.cos(a)*18,y:p.y+Math.sin(a)*18,vx:Math.cos(a)*w.speed,vy:Math.sin(a)*w.speed,life:w.life,dmg:w.dmg,foe:false});
  }
  state.cd=w.rate;state.shake=Math.min(state.shake+.14,.6);
}
function burst(px,py,hue,n,pow){
  for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(40,340)*pow;
    state.parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.25,.75),hue});}
}
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;if(state.alive)update(dt);render(dt);requestAnimationFrame(loop);}
function update(dt){
  state.t+=dt;state.shake=Math.max(0,state.shake-dt*2.4);
  const p=state.player;
  let ax=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let ay=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  const m=Math.hypot(ax,ay)||1;
  p.vx+=(ax/m*430-p.vx)*dt*7;p.vy+=(ay/m*430-p.vy)*dt*7;
  p.x=Math.max(20,Math.min(W-20,p.x+p.vx*dt));p.y=Math.max(20,Math.min(H-20,p.y+p.vy*dt));
  p.a=Math.atan2(mouse.y-p.y,mouse.x-p.x);
  state.cd-=dt;
  if((mouse.down||keys.Space)&&state.cd<=0)fire();
  for(const b of state.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;}
  state.bullets=state.bullets.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
  for(const f of state.foes){
    const dx=p.x-f.x,dy=p.y-f.y,d=Math.hypot(dx,dy)||1;
    f.x+=dx/d*f.sp*dt;f.y+=dy/d*f.sp*dt;f.a+=f.spin*dt;
    if(f.shoots){f.fire-=dt;if(f.fire<=0){f.fire=rnd(1.6,3.2);
      state.bullets.push({x:f.x,y:f.y,vx:dx/d*260,vy:dy/d*260,life:3,dmg:f.dmg*.5,foe:true,hue:f.hue});}}
    if(d<f.r+p.r){hurt(f.dmg);burst(f.x,f.y,f.hue,18,1);f.hp=0;}
    for(const b of state.bullets){
      if(b.foe)continue;
      if(Math.hypot(b.x-f.x,b.y-f.y)<f.r){f.hp-=b.dmg;b.life=0;burst(b.x,b.y,f.hue,4,.4);
        if(f.hp<=0){state.score+=f.score;burst(f.x,f.y,f.hue,26,1.2);state.shake=Math.min(1,state.shake+.3);}}
    }
  }
  for(const b of state.bullets){if(b.foe&&Math.hypot(b.x-p.x,b.y-p.y)<p.r+4){hurt(b.dmg);b.life=0;burst(b.x,b.y,0,8,.6);}}
  state.foes=state.foes.filter(f=>f.hp>0);
  for(const d of state.drops){d.t+=dt;
    if(Math.hypot(d.x-p.x,d.y-p.y)<26){
      if(d.kind==='weapon'){state.weap=(state.weap+1)%WEAPONS.length;document.getElementById('weap').textContent=WEAPONS[state.weap].name;}
      else state.hp=Math.min(100,state.hp+30);
      burst(d.x,d.y,150,20,.8);d.dead=true;}}
  state.drops=state.drops.filter(d=>!d.dead);
  for(const q of state.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.life-=dt;}
  state.parts=state.parts.filter(q=>q.life>0);
  if(!state.foes.length){state.between-=dt;if(state.between<=0){
    if(state.wave>=20){win();}else nextWave();}}
  document.getElementById('score').textContent=state.score.toLocaleString();
  document.getElementById('hp').style.width=state.hp+'%';
}
function hurt(n){state.hp-=n;state.shake=Math.min(1,state.shake+.4);if(state.hp<=0)over(false);}
function over(){state.alive=false;const m=document.getElementById('msg');m.classList.remove('hide');
  document.getElementById('title').textContent='CORE LOST';
  document.getElementById('sub').textContent=`Wave ${state.wave} · ${state.score.toLocaleString()} points`;
  document.getElementById('go').textContent='Retry';}
function win(){state.alive=false;const m=document.getElementById('msg');m.classList.remove('hide');
  document.getElementById('title').textContent='HELD';
  document.getElementById('sub').textContent=`All 20 waves cleared · ${state.score.toLocaleString()} points`;
  document.getElementById('go').textContent='Play again';}
function shape(px,py,r,sides,a,stroke,fill,lw){
  x.beginPath();
  for(let i=0;i<=sides;i++){const t=a+i/sides*TAU;x[i?'lineTo':'moveTo'](px+Math.cos(t)*r,py+Math.sin(t)*r);}
  if(fill){x.fillStyle=fill;x.fill();}
  x.strokeStyle=stroke;x.lineWidth=lw||2;x.stroke();
}
function render(dt){
  x.fillStyle='rgba(4,7,12,.34)';x.fillRect(0,0,W,H);
  x.save();
  if(state.shake)x.translate(rnd(-1,1)*state.shake*11,rnd(-1,1)*state.shake*11);
  x.strokeStyle='rgba(120,200,255,.055)';x.lineWidth=1;
  for(let gx=0;gx<W;gx+=60){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke();}
  for(let gy=0;gy<H;gy+=60){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();}
  if(!state.alive){x.restore();return;}
  x.globalCompositeOperation='lighter';
  for(const q of state.parts){x.globalAlpha=Math.max(0,q.life);x.fillStyle=`hsl(${q.hue},90%,68%)`;x.fillRect(q.x-1.5,q.y-1.5,3.4,3.4);}
  x.globalAlpha=1;
  for(const d of state.drops){const pulse=1+Math.sin(d.t*5)*.14;
    shape(d.x,d.y,15*pulse,d.kind==='weapon'?5:4,d.t,d.kind==='weapon'?'#ffd36e':'#4ff0c1',null,2.4);}
  for(const f of state.foes){
    const hurtT=f.hp/f.max;
    shape(f.x,f.y,f.r,f.sides,f.a,`hsl(${f.hue},90%,${50+hurtT*22}%)`,`hsla(${f.hue},80%,${18+hurtT*10}%,.55)`,2.2);
    shape(f.x,f.y,f.r*.45,f.sides,-f.a*1.6,`hsla(${f.hue},95%,78%,.8)`,null,1.4);
  }
  for(const b of state.bullets){
    x.strokeStyle=b.foe?`hsl(${b.hue||340},95%,70%)`:'#bff4ff';x.lineWidth=b.foe?3:2.4;
    x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x-b.vx*.014,b.y-b.vy*.014);x.stroke();
  }
  const p=state.player;
  x.save();x.translate(p.x,p.y);x.rotate(p.a);
  x.strokeStyle='#eafcff';x.lineWidth=2.4;x.fillStyle='rgba(120,232,255,.18)';
  x.beginPath();x.moveTo(17,0);x.lineTo(-11,10);x.lineTo(-5,0);x.lineTo(-11,-10);x.closePath();x.fill();x.stroke();
  x.restore();
  x.globalCompositeOperation='source-over';
  x.restore();
}
requestAnimationFrame(loop);
</script></body></html>
